name: Audit Yu-Gi-Oh OCG DOCS Super Secret Production V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_docs_super_secret_production_v1.py'
      - '.github/workflows/audit-yugioh-ocg-docs-super-secret-production-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_DOCS_SUPER_SECRET_PROOF_OUTPUT: /tmp/ygo-ocg-docs-super-secret-proof/production.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile writer and independent DOCS proof
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_docs_super_secret_v1.py
          python -m py_compile app/scripts/audit_yugioh_ocg_docs_super_secret_production_v1.py
      - name: READ ONLY prove writer sees full idempotent 20 state
        run: |
          mkdir -p /tmp/ygo-ocg-docs-super-secret-proof
          python -m app.scripts.apply_yugioh_ocg_docs_super_secret_v1 --report /tmp/ygo-ocg-docs-super-secret-proof/idempotency-readonly.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-docs-super-secret-proof/idempotency-readonly.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['certified_pairs']==20,p
          assert p['already_accepted_same_pair']==20,p
          assert p['new_links_ready']==0,p
          assert p['regional_accepted_before_or_after']==108,p
          print(json.dumps({'writer_readonly':'idempotent','existing':20,'DOCS_accepted':108},indent=2))
          PY
      - name: READ ONLY certify complete DOCS identity and exact idProduct prices
        run: python -m app.scripts.audit_yugioh_ocg_docs_super_secret_production_v1
      - name: Require production proof PASS
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-docs-super-secret-proof/production.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['accepted_links']==20,p
          assert p['unique_products']==20,p
          assert p['unique_prints']==20,p
          assert p['regional_DOCS']['accepted_links']==108,p
          assert p['regional_DOCS']['unique_products']==108,p
          assert p['regional_DOCS']['unique_prints']==108,p
          assert p['regional_DOCS']['exact_JA_set_links']==108,p
          assert p['pricing']['canonical_current_wrong_idProduct']==0,p
          assert p['pricing']['canonical_current_exact_idProduct_prices']==p['pricing']['externally_priceable_links'],p
          assert p['failures']==[],p
          print(json.dumps({'DOCS':'108/108 exact','method_links':20,'priceable':p['pricing']['externally_priceable_links'],'unpriced_external':p['pricing']['missing_external_current_price'],'wrong_idProduct':0},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-docs-super-secret-production-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-docs-super-secret-proof/*.json
          retention-days: 90
          if-no-files-found: warn
