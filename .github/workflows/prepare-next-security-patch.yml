name: Prepare Next Security Patch

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/prepare-next-security-patch.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact patched Next.js release into lockfile
        run: npm install next@13.5.11 --save-exact --package-lock-only
      - name: Verify resolved Next.js version
        run: |
          node - <<'NODE'
          const pkg = require('./package.json')
          const lock = require('./package-lock.json')
          if (pkg.dependencies.next !== '13.5.11') throw new Error(`package.json next=${pkg.dependencies.next}`)
          const locked = lock.packages?.['node_modules/next']?.version
          if (locked !== '13.5.11') throw new Error(`package-lock next=${locked}`)
          console.log({ package: pkg.dependencies.next, lock: locked })
          NODE
      - name: Audit patched production dependency set
        run: |
          npm audit --omit=dev --json > /tmp/next-13.5.11-audit.json || true
          node - <<'NODE'
          const fs = require('fs')
          const audit = JSON.parse(fs.readFileSync('/tmp/next-13.5.11-audit.json', 'utf8'))
          console.log(JSON.stringify({ metadata: audit.metadata, vulnerabilities: audit.vulnerabilities }, null, 2))
          NODE
      - name: Upload patched package files
        uses: actions/upload-artifact@v4
        with:
          name: next-13.5.11-package-files-${{ github.sha }}
          path: |
            frontend/package.json
            frontend/package-lock.json
            /tmp/next-13.5.11-audit.json
          retention-days: 30
