name: Audit Yu-Gi-Oh ALIN-JP Unassigned Prints V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_alin_jp_unassigned_prints_v1.py'
      - '.github/workflows/audit-yugioh-alin-jp-unassigned-prints-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_ALIN_JP_UNASSIGNED_OUTPUT: /tmp/yugioh-alin-jp-unassigned-prints-v1.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile reconciliation audit
        run: python -m py_compile app/scripts/audit_yugioh_alin_jp_unassigned_prints_v1.py
      - name: Expose the seven ALIN-JP residual prints outside exact-name groups
        run: python -m app.scripts.audit_yugioh_alin_jp_unassigned_prints_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-alin-jp-unassigned-prints-v1-${{ github.run_id }}
          path: /tmp/yugioh-alin-jp-unassigned-prints-v1.json
          retention-days: 60
          if-no-files-found: error
