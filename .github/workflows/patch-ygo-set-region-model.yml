name: Patch YGO Set ORM regional identity

on:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - .github/workflows/patch-ygo-set-region-model.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multilingual-ygo-v1

      - name: Patch Set ORM exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/models.py")
          text = path.read_text()
          old_constraint = '        UniqueConstraint("game_id", "code", name="uq_sets_game_code"),'
          new_constraint = '        UniqueConstraint("game_id", "code", "region", name="uq_sets_game_code_region"),'
          old_column = '    code: Mapped[str] = mapped_column(String(50), nullable=False)\n'
          new_column = old_column + '    region: Mapped[str] = mapped_column(String(16), nullable=False, default="global", server_default="global")\n'

          assert old_constraint in text, "old set uniqueness not found"
          assert new_constraint not in text, "regional set uniqueness already present"
          assert old_column in text, "Set.code column not found"
          text = text.replace(old_constraint, new_constraint, 1)
          text = text.replace(old_column, new_column, 1)
          path.write_text(text)
          PY

      - name: Verify patch
        run: |
          grep -F 'UniqueConstraint("game_id", "code", "region", name="uq_sets_game_code_region")' backend/app/models.py
          grep -F 'region: Mapped[str] = mapped_column(String(16), nullable=False, default="global", server_default="global")' backend/app/models.py

      - name: Commit model update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/models.py
          git commit -m "feat(ygo): map regional canonical set identity"
          git push origin HEAD:multilingual-ygo-v1
