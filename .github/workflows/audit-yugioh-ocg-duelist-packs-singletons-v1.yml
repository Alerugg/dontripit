name: Audit Yu-Gi-Oh OCG Duelist Packs Singletons V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_duelist_packs_singletons_v1.py'
      - '.github/workflows/audit-yugioh-ocg-duelist-packs-singletons-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_DUELIST_PACK_SINGLETONS_OUTPUT: /tmp/ygo-ocg-duelist-pack-singletons/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile deterministic Duelist Pack singleton auditor
        run: python -m py_compile app/scripts/audit_yugioh_ocg_duelist_packs_singletons_v1.py
      - name: READ ONLY derive exact 219 one-to-one pairs
        run: |
          mkdir -p /tmp/ygo-ocg-duelist-pack-singletons
          python -m app.scripts.audit_yugioh_ocg_duelist_packs_singletons_v1
      - name: Require exact deterministic singleton surface
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-duelist-pack-singletons/report.json'))
          expected={'DP23':56,'DP22':56,'DP21':56,'DP19':51}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['identity_evidence_sha256']=='8c8a39536d03b5f8e2feeeae05ef12c80a0610227c856c0b0721f7f583e3ee26',p
          assert p['certified_pairs']==219,p
          assert len(p['proposal'])==219,p
          assert len({x['external_product_id'] for x in p['proposal']})==219,p
          assert len({x['idProduct'] for x in p['proposal']})==219,p
          assert len({x['print_id'] for x in p['proposal']})==219,p
          rows={r['set_code']:r for r in p['sets']}
          assert {k:rows[k]['pairs'] for k in rows}==expected,p
          assert all(rows[k]['existing_same']==0 and rows[k]['new_ready']==expected[k] for k in expected),p
          assert all(x['metacard_evidence_links']>0 for x in p['proposal']),p
          print(json.dumps({'pairs':219,'sets':expected,'evidence_sha256':p['identity_evidence_sha256']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-duelist-packs-singletons-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-duelist-pack-singletons/report.json
          retention-days: 90
          if-no-files-found: error
