name: Audit Cardmarket Regional Expansion Identity V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_cardmarket_regional_expansion_identity_v1.py'
      - 'backend/tests/test_cardmarket_regional_expansion_identity_v1.py'
      - '.github/workflows/audit-cardmarket-regional-expansion-identity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile certifier
        run: python -m py_compile app/scripts/audit_cardmarket_regional_expansion_identity_v1.py
      - name: Unit tests
        run: pytest -q tests/test_cardmarket_regional_expansion_identity_v1.py
      - name: Certify live regional Cardmarket expansion anchors
        run: |
          mkdir -p /tmp/cardmarket-regional-identity
          python -m app.scripts.audit_cardmarket_regional_expansion_identity_v1 \
            --require-certified \
            --report /tmp/cardmarket-regional-identity/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-regional-expansion-identity-${{ github.run_id }}
          path: /tmp/cardmarket-regional-identity/report.json
          retention-days: 90
          if-no-files-found: warn
