name: Probe Cardmarket Sealed Live
on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/probe-cardmarket-sealed-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - run: |
          python - <<'PY'
          import json,os
          import psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          out={}
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
            c.execute("SELECT max(last_seen_at) capture FROM external_catalog_products WHERE source='cardmarket'")
            cap=c.fetchone()['capture']
            c.execute('''SELECT g.slug,e.category,count(*) n FROM external_catalog_products e JOIN games g ON g.id=e.game_id
              WHERE e.source='cardmarket' AND e.product_group='non_single' AND e.last_seen_at=%s
              GROUP BY g.slug,e.category ORDER BY g.slug,n DESC''',(cap,))
            out['categories']=[dict(x) for x in c.fetchall()]
            for slug in ('pokemon','onepiece','mtg','yugioh'):
              c.execute('''SELECT e.external_id,e.name,e.category,e.expansion_external_id,e.date_added,e.website_path,e.raw_json
                FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.product_group='non_single' AND e.last_seen_at=%s AND g.slug=%s
                ORDER BY e.date_added DESC NULLS LAST,e.id DESC LIMIT 12''',(cap,slug))
              out[slug]=[dict(x) for x in c.fetchall()]
          conn.close()
          print(json.dumps(out,indent=2,default=str,sort_keys=True))
          PY
