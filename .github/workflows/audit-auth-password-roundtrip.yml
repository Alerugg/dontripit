name: Audit auth password roundtrip

on:
  push:
    branches:
      - auth-cardmarket-dark-ui
    paths:
      - '.github/workflows/audit-auth-password-roundtrip.yml'
      - 'backend/app/user_auth_service.py'
      - 'backend/app/routes/user_auth.py'
      - 'frontend/app/api/auth/**'
      - 'frontend/components/auth/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  password-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://dontripit.com
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Prepare disposable identity
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="auth-roundtrip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.invalid"
          PASSWORD="Roundtrip-${GITHUB_RUN_ID}-$(openssl rand -hex 12)Aa!"
          echo "SMOKE_EMAIL=${EMAIL}" >> "$GITHUB_ENV"
          echo "SMOKE_PASSWORD=${PASSWORD}" >> "$GITHUB_ENV"
          echo "COOKIE_JAR=/tmp/dri-auth-roundtrip-cookies.txt" >> "$GITHUB_ENV"

      - name: Register, logout, and log back in with identical password
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/register.json <<JSON
          {"name":"Auth Roundtrip Smoke","email":"${SMOKE_EMAIL}","password":"${SMOKE_PASSWORD}","terms_accepted":true,"marketing_consent":false}
          JSON

          REGISTER_CODE=$(curl -sS -c "$COOKIE_JAR" -o /tmp/register-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/register.json \
            "${BASE_URL}/api/auth/register")
          test "$REGISTER_CODE" = "201" || { echo "register failed HTTP ${REGISTER_CODE}"; cat /tmp/register-response.json; exit 1; }

          LOGOUT_CODE=$(curl -sS -b "$COOKIE_JAR" -c "$COOKIE_JAR" -X POST -o /tmp/logout.json -w '%{http_code}' \
            "${BASE_URL}/api/auth/logout")
          test "$LOGOUT_CODE" = "200" || { echo "logout failed HTTP ${LOGOUT_CODE}"; cat /tmp/logout.json; exit 1; }

          cat > /tmp/login.json <<JSON
          {"email":"${SMOKE_EMAIL}","password":"${SMOKE_PASSWORD}"}
          JSON
          LOGIN_CODE=$(curl -sS -c "$COOKIE_JAR" -o /tmp/login-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/login.json \
            "${BASE_URL}/api/auth/login")
          test "$LOGIN_CODE" = "200" || { echo "login replay failed HTTP ${LOGIN_CODE}"; cat /tmp/login-response.json; exit 1; }

          ME_CODE=$(curl -sS -b "$COOKIE_JAR" -o /tmp/me.json -w '%{http_code}' "${BASE_URL}/api/auth/me")
          test "$ME_CODE" = "200" || { echo "session replay failed HTTP ${ME_CODE}"; cat /tmp/me.json; exit 1; }
          python - <<'PY'
          import json, os
          payload=json.load(open('/tmp/me.json'))
          assert payload['user']['email'] == os.environ['SMOKE_EMAIL']
          print('register -> logout -> login -> me PASS')
          PY

      - name: Audit stored password hash shape without exposing identities
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'sqlalchemy>=2,<3' psycopg2-binary
          python - <<'PY'
          import os
          from collections import Counter
          from sqlalchemy import create_engine, text

          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not url:
              raise SystemExit('No database URL available')
          if url.startswith('postgres://'):
              url='postgresql://' + url[len('postgres://'):]
          engine=create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              rows=conn.execute(text('SELECT password_hash FROM users')).all()
          prefixes=Counter()
          bad=0
          lengths=[]
          for (value,) in rows:
              value=value or ''
              lengths.append(len(value))
              if value.startswith('scrypt:'):
                  prefixes['scrypt'] += 1
              elif value.startswith('pbkdf2:'):
                  prefixes['pbkdf2'] += 1
              else:
                  prefixes['other_or_empty'] += 1
              if not value or '$' not in value:
                  bad += 1
          print(f'users={len(rows)} hash_families={dict(prefixes)} malformed={bad}')
          if lengths:
              print(f'hash_length_min={min(lengths)} hash_length_max={max(lengths)}')
          if bad:
              raise SystemExit(f'Found {bad} malformed password hash(es)')
          PY

      - name: Delete disposable account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SMOKE_EMAIL:-}" || exit 0
          python -m pip install --quiet 'sqlalchemy>=2,<3' psycopg2-binary
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not url:
              raise SystemExit('No database URL available for cleanup')
          if url.startswith('postgres://'):
              url='postgresql://' + url[len('postgres://'):]
          engine=create_engine(url, pool_pre_ping=True)
          with engine.begin() as conn:
              conn.execute(text('DELETE FROM users WHERE email=:email'), {'email': os.environ['SMOKE_EMAIL']})
              remaining=conn.execute(text('SELECT COUNT(*) FROM users WHERE email=:email'), {'email': os.environ['SMOKE_EMAIL']}).scalar_one()
          assert int(remaining) == 0
          print('Disposable auth account cleanup PASS')
          PY
