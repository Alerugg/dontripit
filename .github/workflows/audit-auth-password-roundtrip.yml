name: Audit auth password roundtrip

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/audit-auth-password-roundtrip.yml'
      - 'backend/app/user_auth_service.py'
      - 'backend/app/routes/user_auth.py'
      - 'backend/app/email_delivery.py'
      - 'backend/tests/test_user_auth_mvp.py'
      - 'frontend/app/api/auth/**'
      - 'frontend/app/forgot-password/**'
      - 'frontend/app/reset-password/**'
      - 'frontend/components/auth/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-password-roundtrip-live
  cancel-in-progress: false

jobs:
  password-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://dontripit.com
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run password recovery regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r backend/requirements.txt
          python -m pytest -q backend/tests/test_user_auth_mvp.py

      - name: Prepare disposable identity
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="auth-roundtrip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@dontripit.com"
          PASSWORD="Roundtrip-${GITHUB_RUN_ID}-$(openssl rand -hex 12)Aa!"
          NEW_PASSWORD="Recovered-${GITHUB_RUN_ID}-$(openssl rand -hex 12)Bb!"
          RESET_TOKEN="$(openssl rand -hex 48)"
          echo "SMOKE_EMAIL=${EMAIL}" >> "$GITHUB_ENV"
          echo "SMOKE_PASSWORD=${PASSWORD}" >> "$GITHUB_ENV"
          echo "SMOKE_NEW_PASSWORD=${NEW_PASSWORD}" >> "$GITHUB_ENV"
          echo "SMOKE_RESET_TOKEN=${RESET_TOKEN}" >> "$GITHUB_ENV"
          echo "COOKIE_JAR=/tmp/dri-auth-roundtrip-cookies.txt" >> "$GITHUB_ENV"

      - name: Register and prove initial session
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/register.json <<JSON
          {"name":"Auth Roundtrip Smoke","email":"${SMOKE_EMAIL}","password":"${SMOKE_PASSWORD}","terms_accepted":true,"marketing_consent":false}
          JSON
          REGISTER_CODE=$(curl -sS -c "$COOKIE_JAR" -o /tmp/register-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/register.json "${BASE_URL}/api/auth/register")
          test "$REGISTER_CODE" = "201" || { echo "register failed HTTP ${REGISTER_CODE}"; cat /tmp/register-response.json; exit 1; }
          ME_CODE=$(curl -sS -b "$COOKIE_JAR" -o /tmp/me-before.json -w '%{http_code}' "${BASE_URL}/api/auth/me")
          test "$ME_CODE" = "200" || { echo "initial session failed HTTP ${ME_CODE}"; cat /tmp/me-before.json; exit 1; }

      - name: Prove live email reset delivery is configured and accepted
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/forgot.json <<JSON
          {"email":"${SMOKE_EMAIL}"}
          JSON
          FORGOT_CODE=$(curl -sS -o /tmp/forgot-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/forgot.json "${BASE_URL}/api/auth/forgot-password")
          test "$FORGOT_CODE" = "200" || { echo "forgot-password failed HTTP ${FORGOT_CODE}"; cat /tmp/forgot-response.json; exit 1; }
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/forgot-response.json'))
          assert payload.get('ok') is True, payload
          print('forgot-password public response PASS')
          PY

          python -m pip install --quiet 'sqlalchemy>=2,<3' psycopg2-binary
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from sqlalchemy import create_engine, text
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not url:
              raise SystemExit('No database URL available')
          if url.startswith('postgres://'):
              url='postgresql://' + url[len('postgres://'):]
          engine=create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              rows=conn.execute(text('''
                  SELECT r.token_hash, r.expires_at, r.used_at
                  FROM user_password_reset_tokens r
                  JOIN users u ON u.id=r.user_id
                  WHERE u.email=:email
              '''), {'email': os.environ['SMOKE_EMAIL']}).all()
          assert len(rows) == 1, f'Expected one committed reset token after provider acceptance, got {len(rows)}'
          token_hash, expires_at, used_at = rows[0]
          assert token_hash and len(token_hash) == 64
          assert used_at is None
          if expires_at.tzinfo is None:
              expires_at=expires_at.replace(tzinfo=timezone.utc)
          assert expires_at > datetime.now(timezone.utc)
          print('email provider accepted reset request and hashed token persisted PASS')
          PY

      - name: Seed known one-time token for black-box reset verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os
          from sqlalchemy import create_engine, text
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if url.startswith('postgres://'):
              url='postgresql://' + url[len('postgres://'):]
          engine=create_engine(url, pool_pre_ping=True)
          token_hash=hashlib.sha256(os.environ['SMOKE_RESET_TOKEN'].encode()).hexdigest()
          with engine.begin() as conn:
              user_id=conn.execute(text('SELECT id FROM users WHERE email=:email'), {'email': os.environ['SMOKE_EMAIL']}).scalar_one()
              conn.execute(text('DELETE FROM user_password_reset_tokens WHERE user_id=:user_id'), {'user_id': user_id})
              conn.execute(text("INSERT INTO user_password_reset_tokens (user_id, token_hash, expires_at) VALUES (:user_id, :token_hash, NOW() + INTERVAL '30 minutes')"), {'user_id': user_id, 'token_hash': token_hash})
          print('known hashed reset token seeded PASS')
          PY

      - name: Prove same-password rejection keeps token usable
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/reset-same.json <<JSON
          {"token":"${SMOKE_RESET_TOKEN}","password":"${SMOKE_PASSWORD}"}
          JSON
          SAME_CODE=$(curl -sS -o /tmp/reset-same-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/reset-same.json "${BASE_URL}/api/auth/reset-password")
          test "$SAME_CODE" = "400" || { echo "same-password reset expected 400, got ${SAME_CODE}"; cat /tmp/reset-same-response.json; exit 1; }
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/reset-same-response.json'))
          assert payload.get('error') == 'password_reused', payload
          PY

      - name: Reset password and prove old access is revoked
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/reset.json <<JSON
          {"token":"${SMOKE_RESET_TOKEN}","password":"${SMOKE_NEW_PASSWORD}"}
          JSON
          RESET_CODE=$(curl -sS -o /tmp/reset-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/reset.json "${BASE_URL}/api/auth/reset-password")
          test "$RESET_CODE" = "200" || { echo "reset failed HTTP ${RESET_CODE}"; cat /tmp/reset-response.json; exit 1; }

          STALE_CODE=$(curl -sS -b "$COOKIE_JAR" -o /tmp/me-stale.json -w '%{http_code}' "${BASE_URL}/api/auth/me")
          test "$STALE_CODE" = "401" || { echo "old session should be revoked, got HTTP ${STALE_CODE}"; cat /tmp/me-stale.json; exit 1; }

          REUSE_CODE=$(curl -sS -o /tmp/reuse-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/reset.json "${BASE_URL}/api/auth/reset-password")
          test "$REUSE_CODE" = "400" || { echo "used token should fail, got HTTP ${REUSE_CODE}"; cat /tmp/reuse-response.json; exit 1; }

      - name: Prove old password fails and new password succeeds
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/login-old.json <<JSON
          {"email":"${SMOKE_EMAIL}","password":"${SMOKE_PASSWORD}"}
          JSON
          OLD_CODE=$(curl -sS -o /tmp/login-old-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/login-old.json "${BASE_URL}/api/auth/login")
          test "$OLD_CODE" = "401" || { echo "old password should fail, got HTTP ${OLD_CODE}"; cat /tmp/login-old-response.json; exit 1; }

          cat > /tmp/login-new.json <<JSON
          {"email":"${SMOKE_EMAIL}","password":"${SMOKE_NEW_PASSWORD}"}
          JSON
          NEW_CODE=$(curl -sS -c "$COOKIE_JAR" -o /tmp/login-new-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/login-new.json "${BASE_URL}/api/auth/login")
          test "$NEW_CODE" = "200" || { echo "new password login failed HTTP ${NEW_CODE}"; cat /tmp/login-new-response.json; exit 1; }
          ME_CODE=$(curl -sS -b "$COOKIE_JAR" -o /tmp/me-after.json -w '%{http_code}' "${BASE_URL}/api/auth/me")
          test "$ME_CODE" = "200" || { echo "new session failed HTTP ${ME_CODE}"; cat /tmp/me-after.json; exit 1; }
          python - <<'PY'
          import json, os
          payload=json.load(open('/tmp/me-after.json'))
          assert payload['user']['email'] == os.environ['SMOKE_EMAIL']
          print('forgot -> reset -> revoke -> one-time -> new login PASS')
          PY

      - name: Audit stored password hash shape without exposing identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from collections import Counter
          from sqlalchemy import create_engine, text
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if url.startswith('postgres://'):
              url='postgresql://' + url[len('postgres://'):]
          engine=create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              rows=conn.execute(text('SELECT password_hash FROM users')).all()
          prefixes=Counter()
          bad=0
          for (value,) in rows:
              value=value or ''
              if value.startswith('scrypt:'):
                  prefixes['scrypt'] += 1
              elif value.startswith('pbkdf2:'):
                  prefixes['pbkdf2'] += 1
              else:
                  prefixes['other_or_empty'] += 1
              if not value or '$' not in value:
                  bad += 1
          print(f'users={len(rows)} hash_families={dict(prefixes)} malformed={bad}')
          if bad:
              raise SystemExit(f'Found {bad} malformed password hash(es)')
          PY

      - name: Delete disposable account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SMOKE_EMAIL:-}" || exit 0
          python -m pip install --quiet 'sqlalchemy>=2,<3' psycopg2-binary
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not url:
              raise SystemExit('No database URL available for cleanup')
          if url.startswith('postgres://'):
              url='postgresql://' + url[len('postgres://'):]
          engine=create_engine(url, pool_pre_ping=True)
          with engine.begin() as conn:
              conn.execute(text('DELETE FROM users WHERE email=:email'), {'email': os.environ['SMOKE_EMAIL']})
              remaining=conn.execute(text('SELECT COUNT(*) FROM users WHERE email=:email'), {'email': os.environ['SMOKE_EMAIL']}).scalar_one()
          assert int(remaining) == 0
          print('Disposable auth account cleanup PASS')
          PY
