name: Backfill Pokemon JA Localized Images V1

on:
  pull_request:
    paths:
      - '.github/workflows/backfill-pokemon-ja-localized-images-v1.yml'
      - 'backend/app/scripts/backfill_pokemon_ja_localized_images_v1.py'
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/backfill-pokemon-ja-localized-images-v1.yml'
      - 'backend/app/scripts/backfill_pokemon_ja_localized_images_v1.py'

permissions:
  contents: read

concurrency:
  group: pokemon-ja-localized-images-v1
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PYTHONPATH: .
      TCGDEX_CARDS_SHA: 771a8381c57c73182b9776657a15cd1166c66d36
      TCGDEX_CARDS_REPO: ${{ github.workspace }}/tcgdex-cards
      POKEMON_JA_LOCALIZED_IMAGE_BACKFILL_OUTPUT: artifacts/pokemon-ja-localized-images-v1.json
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Dontripit
        uses: actions/checkout@v4

      - name: Checkout exact historical TCGdex source
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 771a8381c57c73182b9776657a15cd1166c66d36
          path: tcgdex-cards
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install --disable-pip-version-check -r requirements.txt

      - name: PR preflight - READ ONLY
        if: github.event_name == 'pull_request'
        env:
          PGOPTIONS: -c default_transaction_read_only=on
        run: python -m app.scripts.backfill_pokemon_ja_localized_images_v1 --require-baseline

      - name: Production apply
        if: github.event_name == 'push'
        run: python -m app.scripts.backfill_pokemon_ja_localized_images_v1 --apply --require-baseline

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-ja-localized-images-v1-${{ github.run_id }}
          path: backend/artifacts/pokemon-ja-localized-images-v1.json
          retention-days: 30
