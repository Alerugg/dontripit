name: Audit YGO Cardmarket Konami Bridge

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-yugioh-cardmarket-konami-bridge.yml'
      - 'backend/scripts/audit_yugioh_cardmarket_konami_bridge.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: backend
        run: pip install -r requirements.txt
      - name: Audit release-aware exact candidates
        working-directory: backend
        run: python scripts/audit_yugioh_cardmarket_konami_bridge.py --min-samples 3 --report /tmp/ygo-cardmarket-konami-bridge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-cardmarket-konami-bridge-${{ github.run_id }}
          path: /tmp/ygo-cardmarket-konami-bridge.json
          retention-days: 30
          if-no-files-found: error
