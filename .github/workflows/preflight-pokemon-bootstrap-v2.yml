name: Preflight Pokemon Bootstrap V2

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/preflight-pokemon-bootstrap-v2.yml'
      - 'backend/app/pokemon_source_inventory.py'
      - 'backend/app/scripts/preflight_pokemon_bootstrap_v2.py'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Neon secret
        run: test -n "${DATABASE_URL}${DATABASE_URL_UNPOOLED}"
      - name: Simulate complete physical Pokémon bootstrap
        run: |
          set -o pipefail
          python -m app.scripts.preflight_pokemon_bootstrap_v2 | tee /tmp/pokemon-bootstrap-v2-preflight.json
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-bootstrap-v2-preflight-${{ github.sha }}
          path: /tmp/pokemon-bootstrap-v2-preflight.json
          retention-days: 180
          if-no-files-found: warn
