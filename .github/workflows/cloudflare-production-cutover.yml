name: Cloudflare frontend production cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-production-cutover-trigger'

permissions:
  contents: read

concurrency:
  group: cloudflare-frontend-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7fcca192ccc3d1f2f0d9d5843391a2f5
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      INTERNAL_API_BASE_URL: https://api.dontripit.com
      NEXT_PUBLIC_SITE_NAME: Don’tRipIt
      WORKER_NAME: dontripit-web-production
      WORKER_URL: https://dontripit-web-production.alejandro-ruggeri-l.workers.dev
      APEX: https://dontripit.com
      WWW: https://www.dontripit.com
    steps:
      - name: Validate secrets and Cloudflare-proxied production host
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "$INTERNAL_API_KEY" || { echo 'Missing INTERNAL_API_KEY'; exit 2; }
          curl -fsSI --max-time 30 "$APEX/" | tr -d '\r' | tee /tmp/prod-before.headers
          grep -Eqi '^cf-ray:|^server: cloudflare$' /tmp/prod-before.headers || {
            echo 'Apex is not visibly proxied by Cloudflare; aborting before any change.'
            exit 3
          }
          echo 'production_host_cloudflare_proxied=yes'

      - name: Checkout certified production-parity branch
        uses: actions/checkout@v4
        with:
          ref: infra/cloudflare-frontend-production-parity
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install and traditional build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps
          npm run build

      - name: Prepare production Worker config
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'wrangler.jsonc';
          let s = fs.readFileSync(p, 'utf8');
          const before = '"name": "dontripit-web-preview"';
          const after = '"name": "dontripit-web-production"';
          if (!s.includes(before)) throw new Error('Expected certified preview Worker name not found');
          s = s.replace(before, after);
          if (!s.includes('"id": "c025d78bd6d6469999d2df9b2c685b4e"')) {
            throw new Error('Certified VINEXT_KV_CACHE binding drifted');
          }
          fs.writeFileSync(p, s);
          NODE
          grep -q 'dontripit-web-production' wrangler.jsonc

      - name: Build and deploy production Worker without public routes
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build:vinext
          npm run deploy:vinext
          printf '%s' "$INTERNAL_API_KEY" | npx wrangler secret put INTERNAL_API_KEY --name "$WORKER_NAME"

      - name: Certify production Worker on workers.dev before cutover
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "$WORKER_URL/" -o /tmp/worker-home.html; then break; fi
            sleep 5
          done
          test -s /tmp/worker-home.html
          curl -fsS --max-time 30 "$WORKER_URL/api/health" -o /tmp/worker-health.json
          jq -e '.status == "ok"' /tmp/worker-health.json >/dev/null
          code=$(curl -sS -o /tmp/worker-me.json -w '%{http_code}' --max-time 30 "$WORKER_URL/api/auth/me")
          test "$code" = "401"
          jq -e '.error == "authentication_required"' /tmp/worker-me.json >/dev/null
          curl -fsS --max-time 45 "$WORKER_URL/api/search-v2?q=P-150&limit=20" -o /tmp/worker-search.json
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/worker-search.json','utf8'));
          const a = Array.isArray(j) ? j : (j.results || j.items || j.data || j.data?.results || j.data?.items || []);
          const ids = a.map(x => String(x?.print_id ?? x?.printId ?? x?.id ?? x?.card_id ?? x?.cardId ?? x?.external_id ?? x?.code ?? x?.name ?? ''));
          if (ids.length !== 1 || ids[0] !== '710107') throw new Error(`P-150 contract drift: ${JSON.stringify(ids)}`);
          NODE
          curl -fsSI --max-time 30 "$WORKER_URL/" | tr -d '\r' | tee /tmp/worker.headers
          awk -F': ' 'tolower($1)=="x-vinext-build-id" {print $2}' /tmp/worker.headers | tail -1 > /tmp/worker-build-id
          test -s /tmp/worker-build-id
          echo "worker_build_id=$(cat /tmp/worker-build-id)"

      - name: Attach reversible Worker routes and verify production
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_code=$(curl -sS "${auth[@]}" -o /tmp/zone.json -w '%{http_code}' 'https://api.cloudflare.com/client/v4/zones?name=dontripit.com&status=active')
          test "$zone_code" = "200"
          zone_id=$(jq -r '.result[0].id // empty' /tmp/zone.json)
          test -n "$zone_id"
          routes_code=$(curl -sS "${auth[@]}" -o /tmp/routes-before.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes")
          test "$routes_code" = "200"

          : > /tmp/created-route-ids
          cutover_ok=0
          rollback() {
            rc=$?
            if [ "$cutover_ok" != "1" ] && [ -s /tmp/created-route-ids ]; then
              echo 'Verification failed; rolling back newly created Worker routes.'
              while IFS= read -r id; do
                [ -n "$id" ] || continue
                curl -sS -X DELETE "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes/$id" >/tmp/rollback.json || true
              done < /tmp/created-route-ids
            fi
            exit "$rc"
          }
          trap rollback EXIT

          create_route() {
            pattern="$1"
            existing_id=$(jq -r --arg p "$pattern" '.result[] | select(.pattern==$p) | .id' /tmp/routes-before.json | head -1)
            existing_script=$(jq -r --arg p "$pattern" '.result[] | select(.pattern==$p) | .script // ""' /tmp/routes-before.json | head -1)
            if [ -n "$existing_id" ]; then
              if [ "$existing_script" = "$WORKER_NAME" ]; then
                echo "route already attached pattern=$pattern id=$existing_id"
                return 0
              fi
              echo "Conflicting existing route for $pattern uses script=$existing_script; aborting."
              return 4
            fi
            body=$(jq -nc --arg pattern "$pattern" --arg script "$WORKER_NAME" '{pattern:$pattern,script:$script}')
            code=$(curl -sS -X POST "${auth[@]}" -d "$body" -o /tmp/route-create.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "Failed to create route $pattern http=$code"
              jq -c '{success,errors}' /tmp/route-create.json || true
              return 5
            fi
            id=$(jq -r '.result.id // empty' /tmp/route-create.json)
            test -n "$id"
            echo "$id" >> /tmp/created-route-ids
            echo "created route pattern=$pattern id=$id"
          }

          create_route 'dontripit.com/*'
          create_route 'www.dontripit.com/*'

          worker_build=$(cat /tmp/worker-build-id)
          for i in 1 2 3 4 5 6; do
            curl -fsSI --max-time 30 "$APEX/" | tr -d '\r' > /tmp/apex-after.headers || true
            apex_build=$(awk -F': ' 'tolower($1)=="x-vinext-build-id" {print $2}' /tmp/apex-after.headers | tail -1)
            if [ "$apex_build" = "$worker_build" ]; then break; fi
            sleep 3
          done
          echo "worker_build=$worker_build apex_build=${apex_build:-missing}"
          test "${apex_build:-}" = "$worker_build"

          curl -fsS --max-time 30 "$APEX/api/health" -o /tmp/apex-health.json
          jq -e '.status == "ok"' /tmp/apex-health.json >/dev/null
          code=$(curl -sS -o /tmp/apex-me.json -w '%{http_code}' --max-time 30 "$APEX/api/auth/me")
          test "$code" = "401"
          jq -e '.error == "authentication_required"' /tmp/apex-me.json >/dev/null
          for path in /api/library/collection /api/library/wishlist; do
            code=$(curl -sS -o /tmp/protected.json -w '%{http_code}' --max-time 30 "$APEX$path")
            test "$code" = "401"
          done

          queries=('Pikachu' 'Luffy' 'P-150' 'OP05-119' 'LOB-001')
          for q in "${queries[@]}"; do
            encoded=$(node -p "encodeURIComponent(process.argv[1])" "$q")
            curl -fsS --max-time 45 "$APEX/api/search-v2?q=$encoded&limit=20" -o /tmp/prod-search.json
            curl -fsS --max-time 45 "$WORKER_URL/api/search-v2?q=$encoded&limit=20" -o /tmp/worker-search.json
            QUERY="$q" node <<'NODE'
          const fs = require('fs');
          const q = process.env.QUERY;
          const p = JSON.parse(fs.readFileSync('/tmp/prod-search.json','utf8'));
          const w = JSON.parse(fs.readFileSync('/tmp/worker-search.json','utf8'));
          const arr = j => Array.isArray(j) ? j : (j.results || j.items || j.data || j.data?.results || j.data?.items || []);
          const id = x => String(x?.print_id ?? x?.printId ?? x?.id ?? x?.card_id ?? x?.cardId ?? x?.external_id ?? x?.code ?? x?.name ?? '');
          const pa=arr(p), wa=arr(w);
          const pIds=pa.slice(0,5).map(id), wIds=wa.slice(0,5).map(id);
          console.log(`${q} prod_results=${pa.length} worker_results=${wa.length} prod_top=${JSON.stringify(pIds)}`);
          if (pa.length !== wa.length || JSON.stringify(pIds) !== JSON.stringify(wIds)) throw new Error(`${q}: post-cutover search drift`);
          NODE
          done

          curl -fsS --max-time 45 "$APEX/api/catalog/search?q=Pikachu&type=card&include_counts=0&limit=24&offset=0" -o /tmp/catalog.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const items=j.items||[];
          const placeholders=new Set(['','-','?','n/a','na','none','null','unknown','undefined']);
          const fields=['set_code','set_name','collector_number','rarity','language','finish','variant_family','exact_variant'];
          for (const item of items) for (const field of fields) {
            const value=item?.[field];
            if (typeof value==='string' && placeholders.has(value.trim().toLowerCase())) throw new Error(`placeholder leaked ${field}=${value}`);
          }
          const base=items.find(x=>Number(x.card_id)===1);
          if (!base) throw new Error('Base Set Pikachu missing');
          if (Number(base.matched_print_id)!==571 || String(base.set_code).toLowerCase()!=='bs' || String(base.collector_number)!=='58' || String(base.rarity||'').toLowerCase()!=='common') {
            throw new Error(`Base Set Pikachu metadata drift ${JSON.stringify(base)}`);
          }
          console.log('metadata_contract=green');
          NODE

          www_code=$(curl -L -sS -o /tmp/www-home.html -w '%{http_code}' --max-time 30 "$WWW/")
          test "$www_code" = "200"
          test -s /tmp/www-home.html

          cutover_ok=1
          trap - EXIT
          echo 'CUTOVER_GREEN=yes'

      - name: Production cutover summary
        run: |
          echo '### Cloudflare frontend production cutover' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Worker: dontripit-web-production' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source: infra/cloudflare-frontend-production-parity' >> "$GITHUB_STEP_SUMMARY"
          echo '- Apex route: dontripit.com/*' >> "$GITHUB_STEP_SUMMARY"
          echo '- WWW route: www.dontripit.com/*' >> "$GITHUB_STEP_SUMMARY"
          echo '- Vercel origin retained for immediate route rollback.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Health/auth/search/metadata: green' >> "$GITHUB_STEP_SUMMARY"
