name: Apply One Piece JP Safe Batch V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/onepiece_jp_safe_batches_v1.py'
      - 'backend/app/scripts/apply_onepiece_jp_safe_batch_v1.py'
      - 'backend/app/scripts/reindex_onepiece_jp_safe_batch_v1.py'
      - '.github/workflows/apply-onepiece-jp-safe-batch-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/onepiece_jp_safe_batches_v1.py'
      - 'backend/app/scripts/apply_onepiece_jp_safe_batch_v1.py'
      - 'backend/app/scripts/reindex_onepiece_jp_safe_batch_v1.py'
      - '.github/workflows/apply-onepiece-jp-safe-batch-v1.yml'

permissions:
  contents: read

concurrency:
  group: onepiece-jp-safe-batch-v1
  cancel-in-progress: false

jobs:
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      ONEPIECE_HTTP_TIMEOUT: '30'
      BATCH_ID: op06_10
      EXPECTED_TOTAL: '1130'
      CONFIRM_TOKEN: APPLY_ONEPIECE_JP_SAFE_BATCH_OP06_10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile reusable safe-batch entrypoints
        run: |
          python -m py_compile app/scripts/onepiece_jp_safe_batches_v1.py
          python -m py_compile app/scripts/apply_onepiece_jp_safe_batch_v1.py
          python -m py_compile app/scripts/reindex_onepiece_jp_safe_batch_v1.py
      - name: READ ONLY rebuild exact configured Japanese batch
        run: |
          mkdir -p /tmp/opjp-safe-batch
          python -m app.scripts.apply_onepiece_jp_safe_batch_v1 \
            --batch "$BATCH_ID" \
            --report /tmp/opjp-safe-batch/proposal.json
          python - <<'PY'
          import json,os
          p=json.load(open('/tmp/opjp-safe-batch/proposal.json'))
          expected=int(os.environ['EXPECTED_TOTAL'])
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['official_full_surface_sha256']=='772684372981c8004acc0b17598f2853118b2ea0c375e5654631b2cfacdf2008',p
          assert p['target_physical']==expected,p
          assert p['already_exact'] in (0,expected),p
          assert p['new_prints_ready']+p['already_exact']==expected,p
          print(json.dumps({'dry_run':'pass','batch':os.environ['BATCH_ID'],'new':p['new_prints_ready'],'existing':p['already_exact']},indent=2))
          PY
      - name: Apply exact configured Japanese physical batch
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_onepiece_jp_safe_batch_v1 \
            --batch "$BATCH_ID" \
            --apply --confirm "$CONFIRM_TOKEN" \
            --report /tmp/opjp-safe-batch/applied.json
      - name: Reindex only configured Japanese batch
        if: github.event_name == 'push'
        run: python -m app.scripts.reindex_onepiece_jp_safe_batch_v1 --batch "$BATCH_ID"
      - name: Prove writer idempotency
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_onepiece_jp_safe_batch_v1 \
            --batch "$BATCH_ID" \
            --apply --confirm "$CONFIRM_TOKEN" \
            --report /tmp/opjp-safe-batch/idempotency.json
          python - <<'PY'
          import json,os
          p=json.load(open('/tmp/opjp-safe-batch/idempotency.json'))
          expected=int(os.environ['EXPECTED_TOTAL'])
          assert p['production_writes']==0,p
          assert p['new_prints_ready']==0,p
          assert p['already_exact']==expected,p
          print(json.dumps({'idempotency':'pass','batch':os.environ['BATCH_ID'],'exact_JA':expected},indent=2))
          PY
      - name: Final configured batch proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,re,psycopg2
          from psycopg2.extras import RealDictCursor
          from app.scripts.onepiece_jp_safe_batches_v1 import BATCHES,EXPECTED_TOTALS
          batch=os.environ['BATCH_ID']; expected=BATCHES[batch]; total=EXPECTED_TOTALS[batch]
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL']); conn.set_session(readonly=True,autocommit=False)
          out={'batch':batch,'sets':{}}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='onepiece' LIMIT 1"); game_id=int(cur.fetchone()['id'])
              cur.execute("SELECT id,code FROM sets WHERE game_id=%s",(game_id,)); sets=[dict(r) for r in cur.fetchall()]
              by_token={re.sub(r'[^A-Z0-9]+','',str(r['code']).upper()):r for r in sets}; ids=[]
              for token,cfg in expected.items():
                set_id=int(by_token[token]['id']); cur.execute("SELECT id print_id FROM prints WHERE set_id=%s AND lower(coalesce(language,''))='ja'",(set_id,)); pids=[int(r['print_id']) for r in cur.fetchall()]; assert len(pids)==cfg['physical'],(token,len(pids),cfg); ids.extend(pids); out['sets'][token]={'ja_prints':len(pids)}
              assert len(ids)==total,(len(ids),total)
              cur.execute("SELECT count(*) n,count(DISTINCT print_id) p FROM print_images WHERE print_id=ANY(%s) AND is_primary=true AND source='onepiece_official_jp'",(ids,)); x=cur.fetchone(); assert (int(x['n']),int(x['p']))==(total,total),x
              cur.execute("SELECT count(*) n,count(DISTINCT print_id) p,count(DISTINCT external_id) e FROM print_identifiers WHERE print_id=ANY(%s) AND source='onepiece_official_jp'",(ids,)); x=cur.fetchone(); assert (int(x['n']),int(x['p']),int(x['e']))==(total,total,total),x
              cur.execute("SELECT count(*) n FROM search_documents WHERE doc_type='print' AND object_id=ANY(%s)",(ids,)); assert int(cur.fetchone()['n'])==total
              cur.execute("SELECT count(*) n FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id WHERE e.source='cardmarket' AND l.print_id=ANY(%s) AND l.link_status IN ('accepted','mapped','exact')",(ids,)); cm_links=int(cur.fetchone()['n']); assert cm_links==0
              cur.execute("SELECT count(*) n FROM price_snapshots ps JOIN price_sources src ON src.id=ps.source_id WHERE src.name='cardmarket' AND ps.entity_type='print' AND ps.entity_id=ANY(%s)",(ids,)); cm_prices=int(cur.fetchone()['n']); assert cm_prices==0
              out['total']={'ja_prints':total,'official_images':total,'official_identifiers':total,'search_docs':total,'cardmarket_links':0,'cardmarket_prices':0}; conn.rollback()
          finally: conn.close()
          open('/tmp/opjp-safe-batch/final.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-jp-safe-batch-v1-${{ github.run_id }}
          path: /tmp/opjp-safe-batch/*.json
          retention-days: 90
          if-no-files-found: warn
