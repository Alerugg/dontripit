name: Certify Search V2 Exhaustive Pagination V1

on:
  pull_request:
    paths:
      - 'backend/app/routes/search_v2.py'
      - 'backend/app/search_v2/exhaustive_name_query.py'
      - 'backend/app/search_v2/exact_identifier.py'
      - 'backend/app/search_v2/onepiece_exact_collector.py'
      - 'backend/app/search_v2/pokemon_query.py'
      - 'backend/app/search_v2/yugioh_query.py'
      - 'backend/app/scripts/audit_search_v2_exhaustive_pagination_v1.py'
      - 'backend/alembic/versions/*search*'
      - 'backend/alembic/versions/*localized*'
      - 'backend/tests/test_search_v2_api.py'
      - 'backend/tests/test_search_v2_exact_identifier.py'
      - 'backend/tests/test_onepiece_exact_collector_physical.py'
      - 'backend/tests/test_search_v2_performance.py'
      - 'backend/tests/test_pokemon_search_v2_performance.py'
      - 'backend/tests/test_yugioh_search_v2_performance.py'
      - '.github/workflows/certify-search-v2-exhaustive-pagination-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certify-search-v2-exhaustive-pagination-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile search hot-path contract
        run: |
          python -m py_compile app/routes/search_v2.py
          python -m py_compile app/search_v2/exhaustive_name_query.py
          python -m py_compile app/search_v2/exact_identifier.py
          python -m py_compile app/search_v2/onepiece_exact_collector.py
          python -m py_compile app/search_v2/pokemon_query.py
          python -m py_compile app/search_v2/yugioh_query.py
          python -m py_compile app/scripts/audit_search_v2_exhaustive_pagination_v1.py
          python -m py_compile alembic/versions/20260822_37_add_search_hot_path_indexes.py
          python -m py_compile alembic/versions/20260822_38_add_localized_name_trgm.py
          test "$(alembic heads | wc -l)" -eq 1
      - name: Run Search V2 regression suite
        run: |
          pytest -q \
            tests/test_search_v2_api.py \
            tests/test_search_v2_exact_identifier.py \
            tests/test_onepiece_exact_collector_physical.py \
            tests/test_search_v2_filter_contracts.py \
            tests/test_search_v2_performance.py \
            tests/test_mtg_search_v2.py \
            tests/test_pokemon_search_v2_performance.py \
            tests/test_yugioh_multilingual_search_v2.py \
            tests/test_yugioh_search_v2_performance.py
      - name: Audit exhaustive live Pikachu and Luffy pagination
        run: |
          mkdir -p /tmp/search-v2-exhaustive-pagination-v1
          python -m app.scripts.audit_search_v2_exhaustive_pagination_v1 \
            --report /tmp/search-v2-exhaustive-pagination-v1/report.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/search-v2-exhaustive-pagination-v1/report.json'))
          assert p['status']=='pass', p
          assert p['production_writes']==0, p
          cases={row['query']:row for row in p['cases']}
          assert cases['Pikachu']['total_cards']==191, p
          assert cases['Pikachu']['total_prints']==376, p
          assert cases['Pikachu']['unique_card_ids']==191, p
          assert cases['Pikachu']['variant_count_sum']==376, p
          assert cases['Luffy']['total_cards']==87, p
          assert cases['Luffy']['total_prints']==418, p
          assert cases['Luffy']['unique_card_ids']==87, p
          assert cases['Luffy']['variant_count_sum']==418, p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-v2-exhaustive-pagination-v1-${{ github.run_id }}
          path: /tmp/search-v2-exhaustive-pagination-v1/*
          retention-days: 90
          if-no-files-found: warn
