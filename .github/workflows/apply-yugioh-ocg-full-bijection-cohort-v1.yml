name: Apply Yu-Gi-Oh OCG Full Bijection Cohort V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/apply_yugioh_ocg_full_bijection_cohort_v1.py'
      - '.github/workflows/apply-yugioh-ocg-full-bijection-cohort-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/apply_yugioh_ocg_full_bijection_cohort_v1.py'
      - '.github/workflows/apply-yugioh-ocg-full-bijection-cohort-v1.yml'

permissions:
  contents: read

concurrency:
  group: yugioh-ocg-full-bijection-cohort-v1
  cancel-in-progress: false

jobs:
  exact-links:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile guarded cohort writer and exact-idProduct projector
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_full_bijection_cohort_v1.py
          python -m py_compile scripts/project_cardmarket_link_prices.py
      - name: READ ONLY rebuild exact frozen 715-link proposal
        run: |
          mkdir -p /tmp/ygo-ocg-full-bijection-cohort-apply
          python -m app.scripts.apply_yugioh_ocg_full_bijection_cohort_v1 --report /tmp/ygo-ocg-full-bijection-cohort-apply/proposal.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-full-bijection-cohort-apply/proposal.json'))
          expected={'SK2':57,'PE':55,'ST14':48,'TDS2':46,'SD32':43,'ST17':43,'YSD6':43,'SR05':42,'SR06':42,'SR10':41,'SD25':40,'SD18':38,'SD20':38,'DP07':30,'SD2':28,'SSD2':21,'EN01':20,'JF09':10,'PP13':10,'PP14':10,'PP15':10}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['cardmarket_capture']=='2026-08-18 21:09:20.740891+00:00',p
          assert p['frozen_proposal_sha256']=='ef0ee909fa46752d37df46f91df473be96ebdf3ef67a54e9be93fd7cbac57d03',p
          assert p['certified_pairs']==715,p
          assert p['already_accepted_same_pair'] in (0,715),p
          assert p['new_links_ready'] in (0,715),p
          assert p['already_accepted_same_pair']+p['new_links_ready']==715,p
          rows={r['set_code']:r for r in p['sets']}
          assert {k:rows[k]['pairs'] for k in rows}==expected,p
          if '${{ github.event_name }}'=='pull_request':
              assert p['already_accepted_same_pair']==0,p
              assert p['new_links_ready']==715,p
          print(json.dumps({'dry_run':'pass','existing':p['already_accepted_same_pair'],'new':p['new_links_ready'],'sets':len(expected)},indent=2))
          PY
      - name: Atomically apply 715 exact OCG cohort links
        if: github.event_name == 'push'
        run: python -m app.scripts.apply_yugioh_ocg_full_bijection_cohort_v1 --apply --confirm APPLY_YUGIOH_OCG_FULL_BIJECTION_COHORT_V1 --report /tmp/ygo-ocg-full-bijection-cohort-apply/applied.json
      - name: Project Yu-Gi-Oh Cardmarket prices from exact linked idProducts
        if: github.event_name == 'push'
        run: python scripts/project_cardmarket_link_prices.py --game yugioh --apply --report /tmp/ygo-ocg-full-bijection-cohort-apply/projection.json
      - name: Prove writer idempotency
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_full_bijection_cohort_v1 --apply --confirm APPLY_YUGIOH_OCG_FULL_BIJECTION_COHORT_V1 --report /tmp/ygo-ocg-full-bijection-cohort-apply/idempotency.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-full-bijection-cohort-apply/idempotency.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['already_accepted_same_pair']==715,p
          assert p['new_links_ready']==0,p
          print(json.dumps({'idempotency':'pass','exact_links':715},indent=2))
          PY
      - name: Final exact regional identity proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          method='cardmarket_ocg_certified_full_logical_bijection_cohort_v1'
          surfaces={'4889':('SK2',57),'4910':('PE',55),'4708':('ST14',48),'5894':('TDS2',46),'4641':('SD32',43),'4645':('ST17',43),'4763':('YSD6',43),'4636':('SR05',42),'4624':('SR06',42),'4711':('SR10',41),'4721':('SD25',40),'4789':('SD18',38),'4769':('SD20',38),'4822':('DP07',30),'4871':('SD2',28),'4599':('SSD2',21),'4686':('EN01',20),'4805':('JF09',10),'4762':('PP13',10),'4749':('PP14',10),'4729':('PP15',10)}
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'],connect_timeout=30,application_name='dontripit_ygo_ocg_full_bijection_cohort_final_v1'); conn.set_session(readonly=True,autocommit=False); out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='yugioh' LIMIT 1"); gid=int(cur.fetchone()['id'])
              cur.execute("SELECT max(last_seen_at) capture FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s",(gid,)); capture=cur.fetchone()['capture']
              assert str(capture)=='2026-08-18 21:09:20.740891+00:00',capture
              total=0
              for exp,(set_code,expected) in surfaces.items():
                cur.execute("""SELECT count(*) total,count(DISTINCT l.external_product_id) products,count(DISTINCT l.print_id) prints,
                    count(*) FILTER (WHERE lower(coalesce(p.language,''))='ja' AND upper(coalesce(s.code,''))=%s) good,
                    count(*) FILTER (WHERE l.mapping_method=%s AND l.confidence='exact' AND l.reviewed=true) method_good,
                    count(*) FILTER (WHERE e.last_seen_at=%s) current
                  FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN prints p ON p.id=l.print_id JOIN sets s ON s.id=p.set_id
                  WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND e.expansion_external_id=%s AND l.link_status IN ('accepted','mapped','exact')""",(set_code,method,capture,gid,exp)); x=cur.fetchone()
                vals=(int(x['total']),int(x['products']),int(x['prints']),int(x['good']),int(x['method_good']),int(x['current']))
                assert vals==(expected,expected,expected,expected,expected,expected),(exp,set_code,vals,expected)
                out[set_code]={'idExpansion':exp,'accepted_exact_ja_links':expected}; total+=expected
              assert total==715,total
              out['total']={'mapping_method':method,'links':total}; conn.rollback()
          finally: conn.close()
          open('/tmp/ygo-ocg-full-bijection-cohort-apply/final.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-full-bijection-cohort-apply-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-full-bijection-cohort-apply/*.json
          retention-days: 90
          if-no-files-found: warn
