name: Repair Yu-Gi-Oh Current Canonical Live

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/repair-yugioh-current-canonical-live.yml'

permissions:
  contents: read

concurrency:
  group: repair-yugioh-current-canonical-live
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Build current canonical snapshot before targeted repair
        run: |
          rm -rf /tmp/ygo-current
          python -m app.scripts.build_yugioh_v2_snapshot_canonical --output-dir /tmp/ygo-current
      - name: Materialize fixture for only canonical Cards missing in Neon
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import create_engine, text
          from app.ingest.connectors.ygoprodeck_yugioh import YgoProDeckYugiohConnector

          root = Path('/tmp/ygo-current')
          source_cards = {
              str(json.loads(line)['card_key'])
              for line in (root / 'cards.jsonl').read_text().splitlines()
              if line.strip()
          }
          engine = create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              gid = conn.execute(text("SELECT id FROM games WHERE slug='yugioh' LIMIT 1")).scalar_one()
              db_cards = {
                  str(value)
                  for value in conn.execute(
                      text("SELECT card_key FROM cards WHERE game_id=:g AND card_key IS NOT NULL"),
                      {'g': gid},
                  ).scalars()
              }

          missing_keys = sorted(source_cards - db_cards)
          prefix = 'yugioh:ygoprodeck:card-id:'
          connector = YgoProDeckYugiohConnector()
          endpoint = f"{connector.base_url}/cardinfo.php"
          raw_cards = []
          for key in missing_keys:
              if not key.startswith(prefix):
                  raise SystemExit(f'Unexpected Yu-Gi-Oh canonical card key: {key}')
              raw_id = key[len(prefix):]
              payload = connector._request_json(endpoint, params={'id': raw_id})
              matches = [row for row in (payload.get('data') or []) if str(row.get('id')) == raw_id]
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one raw YGOPRODeck row for {key}, got {len(matches)}')
              raw_cards.append(matches[0])

          fixture = Path('/tmp/ygo-missing-cards.json')
          fixture.write_text(json.dumps({'data': raw_cards}, sort_keys=True) + '\n')
          report = {
              'missing_before': len(missing_keys),
              'fixture_cards': len(raw_cards),
              'missing_keys': missing_keys,
          }
          Path('/tmp/ygo-targeted-repair-input.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          if len(raw_cards) != len(missing_keys):
              raise SystemExit('Targeted fixture cardinality mismatch')
          PY
      - name: Upsert only missing Yu-Gi-Oh Cards through official connector
        run: python -m app.ingest.run ygoprodeck_yugioh --fixture true --path /tmp/ygo-missing-cards.json --incremental true
      - name: Rebuild current canonical snapshot after targeted repair
        run: |
          rm -rf /tmp/ygo-current
          python -m app.scripts.build_yugioh_v2_snapshot_canonical --output-dir /tmp/ygo-current
      - name: Prove current source coverage in Neon
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          root = Path('/tmp/ygo-current')
          def vals(name, key):
              with (root / name).open() as handle:
                  return {str(json.loads(line)[key]) for line in handle if line.strip()}

          source_cards = vals('cards.jsonl', 'card_key')
          source_sets = {value.lower() for value in vals('sets.jsonl', 'code')}
          source_prints = vals('prints.jsonl', 'print_key')
          engine = create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              gid = conn.execute(text("SELECT id FROM games WHERE slug='yugioh' LIMIT 1")).scalar_one()
              db_cards = {str(v) for v in conn.execute(text("SELECT card_key FROM cards WHERE game_id=:g AND card_key IS NOT NULL"), {'g': gid}).scalars()}
              db_sets = {str(v).lower() for v in conn.execute(text("SELECT code FROM sets WHERE game_id=:g"), {'g': gid}).scalars()}
              db_prints = {str(v) for v in conn.execute(text('''SELECT p.print_key FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=:g AND p.print_key IS NOT NULL'''), {'g': gid}).scalars()}

          report = {
              'source_counts': {'cards': len(source_cards), 'sets': len(source_sets), 'prints': len(source_prints)},
              'neon_counts': {'cards': len(db_cards), 'sets': len(db_sets), 'prints': len(db_prints)},
              'missing_cards': len(source_cards - db_cards),
              'missing_sets': len(source_sets - db_sets),
              'missing_prints': len(source_prints - db_prints),
              'missing_card_examples': sorted(source_cards - db_cards)[:100],
              'missing_set_examples': sorted(source_sets - db_sets)[:100],
              'missing_print_examples': sorted(source_prints - db_prints)[:100],
          }
          Path('/tmp/ygo-live-repair-proof.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          if report['missing_cards'] or report['missing_sets'] or report['missing_prints']:
              raise SystemExit(f"Yu-Gi-Oh live repair did not reach 0/0/0: {json.dumps(report, sort_keys=True)}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-live-repair-proof-${{ github.run_id }}
          path: |
            /tmp/ygo-targeted-repair-input.json
            /tmp/ygo-live-repair-proof.json
          retention-days: 30
          if-no-files-found: warn
