name: Audit YGO OCG Physical Identity V2

on:
  workflow_dispatch:
  push:
    branches: [p1/cardmarket-identity-resolver-v1]
    paths:
      - 'backend/scripts/audit_yugioh_ocg_physical_identity_v2.py'
      - '.github/workflows/audit-ygo-ocg-physical-identity-v2.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ''
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1/cardmarket-identity-resolver-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Compile Physical Identity V2 replay
        run: python -m py_compile scripts/audit_yugioh_ocg_physical_identity_v2.py
        working-directory: backend
      - name: Replay YGO OCG physical identity READ ONLY
        env:
          YGO_OCG_PHYSICAL_IDENTITY_V2_OUTPUT: /tmp/yugioh-ocg-physical-identity-v2.json
        run: python scripts/audit_yugioh_ocg_physical_identity_v2.py
        working-directory: backend
      - name: Gate zero-write certified replay
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/yugioh-ocg-physical-identity-v2.json'))
          assert d['mode']=='read_only', d
          assert d['production_writes']==0, d
          assert d['status']=='PASS', d
          assert d['accepted_ygo']['exact_reviewed_ja_product_conflicts']==0, d
          assert d['accepted_ygo']['exact_reviewed_ja_print_conflicts']==0, d
          assert d['replayed_certified']['links'] > 0, d
          assert all(x['production_writes']==0 for x in d['replays']), d
          print('YGO_OCG_PHYSICAL_IDENTITY_V2_GATE=PASS')
          print('REPLAYED_CERTIFIED_LINKS=', d['replayed_certified']['links'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-ocg-physical-identity-v2-${{ github.run_id }}
          path: /tmp/yugioh-ocg-physical-identity-v2.json
          if-no-files-found: warn
          retention-days: 90
