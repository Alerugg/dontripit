name: Apply Yu-Gi-Oh OCG Certified Singletons V5

on:
  pull_request:
    paths:
      - 'backend/app/scripts/apply_yugioh_ocg_certified_singletons_v5.py'
      - '.github/workflows/apply-yugioh-ocg-certified-singletons-v5.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/apply_yugioh_ocg_certified_singletons_v5.py'
      - '.github/workflows/apply-yugioh-ocg-certified-singletons-v5.yml'

permissions:
  contents: read

concurrency:
  group: yugioh-ocg-certified-singletons-v5
  cancel-in-progress: false

jobs:
  exact-links:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile certified OCG singleton writer V5
        run: python -m py_compile app/scripts/apply_yugioh_ocg_certified_singletons_v5.py
      - name: READ ONLY rebuild exact frozen 293-link proposal
        run: |
          mkdir -p /tmp/ygo-ocg-certified-singletons-v5
          python -m app.scripts.apply_yugioh_ocg_certified_singletons_v5 --report /tmp/ygo-ocg-certified-singletons-v5/proposal.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-certified-singletons-v5/proposal.json'))
          expected={'INOV':64,'TDIL':64,'NECH':82,'PRIO':83}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['certified_pairs']==293,p
          assert p['already_accepted_same_pair'] in (0,293),p
          assert p['new_links_ready'] in (0,293),p
          assert p['already_accepted_same_pair']+p['new_links_ready']==293,p
          assert {r['set_code']:r['pairs'] for r in p['sets']}==expected,p
          if '${{ github.event_name }}' == 'pull_request':
              assert p['already_accepted_same_pair']==0,p
              assert p['new_links_ready']==293,p
          print(json.dumps({'dry_run':'pass','existing':p['already_accepted_same_pair'],'new':p['new_links_ready']},indent=2))
          PY
      - name: Atomically apply 293 exact OCG singleton links
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_certified_singletons_v5 \
            --apply --confirm APPLY_YUGIOH_OCG_CERTIFIED_SINGLETONS_V5 \
            --report /tmp/ygo-ocg-certified-singletons-v5/applied.json
      - name: Project Yu-Gi-Oh Cardmarket prices from exact linked idProducts
        if: github.event_name == 'push'
        run: python scripts/project_cardmarket_link_prices.py --game yugioh --apply --report /tmp/ygo-ocg-certified-singletons-v5/projection.json
      - name: Prove writer idempotency
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_certified_singletons_v5 \
            --apply --confirm APPLY_YUGIOH_OCG_CERTIFIED_SINGLETONS_V5 \
            --report /tmp/ygo-ocg-certified-singletons-v5/idempotency.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-certified-singletons-v5/idempotency.json'))
          assert p['production_writes']==0,p
          assert p['already_accepted_same_pair']==293,p
          assert p['new_links_ready']==0,p
          print(json.dumps({'idempotency':'pass','exact_links':293},indent=2))
          PY
      - name: Final exact regional identity proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          surfaces={'4660':('INOV',64),'4666':('TDIL',64),'4702':('NECH',82),'4709':('PRIO',83)}
          method='cardmarket_ocg_certified_unique_physical_v7'
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'],connect_timeout=30,application_name='dontripit_ygo_ocg_singletons_v5_final')
          conn.set_session(readonly=True,autocommit=False); out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              total=0
              for exp,(set_code,expected) in surfaces.items():
                cur.execute("""SELECT count(*) total,
                  count(*) FILTER (WHERE lower(coalesce(p.language,''))='ja' AND upper(coalesce(s.code,''))=%s) good,
                  count(*) FILTER (WHERE l.mapping_method=%s AND l.confidence='exact' AND l.reviewed=true) method_good,
                  count(DISTINCT e.external_id) products,count(DISTINCT p.id) prints
                  FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN prints p ON p.id=l.print_id JOIN sets s ON s.id=p.set_id
                  WHERE e.source='cardmarket' AND e.game_id=(SELECT id FROM games WHERE slug='yugioh')
                  AND e.product_group='single' AND e.expansion_external_id=%s AND l.link_status IN ('accepted','mapped','exact')""",(set_code,method,exp))
                x=cur.fetchone(); vals=(int(x['total']),int(x['good']),int(x['method_good']),int(x['products']),int(x['prints']))
                assert vals==(expected,expected,expected,expected,expected),(exp,set_code,vals,expected)
                out[set_code]={'idExpansion':exp,'accepted_exact_ja_links':expected}; total+=expected
              assert total==293,total
              out['total']={'mapping_method':method,'links':total}; conn.rollback()
          finally: conn.close()
          open('/tmp/ygo-ocg-certified-singletons-v5/final.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-certified-singletons-v5-${{ github.run_id }}
          path: /tmp/ygo-ocg-certified-singletons-v5/*.json
          retention-days: 90
          if-no-files-found: warn
