name: Audit Search Character Exhaustive V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_search_character_exhaustive_v1.py'
      - '.github/workflows/audit-search-character-exhaustive-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile read-only auditor
        run: python -m py_compile app/scripts/audit_search_character_exhaustive_v1.py
      - name: Measure live Pikachu and Luffy search surfaces
        run: |
          mkdir -p /tmp/search-character-exhaustive-v1
          python -m app.scripts.audit_search_character_exhaustive_v1 \
            --report /tmp/search-character-exhaustive-v1/report.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/search-character-exhaustive-v1/report.json'))
          assert p['status']=='pass' and p['production_writes']==0,p
          for key,case in p['cases'].items():
              assert case['canonical_name_substring']['logical_cards'] > 0,(key,case)
              assert case['canonical_name_substring']['physical_prints'] > 0,(key,case)
              assert case['normal_search']['100']['count'] > 0,(key,case)
          print(json.dumps({
              k:{
                  'logical_cards':v['canonical_name_substring']['logical_cards'],
                  'physical_prints':v['canonical_name_substring']['physical_prints'],
                  'normal_24':v['normal_search']['24']['count'],
                  'normal_50':v['normal_search']['50']['count'],
                  'normal_100':v['normal_search']['100']['count'],
                  'missing_name_ids_top100':len(v['canonical_ids_missing_from_top100']),
              } for k,v in p['cases'].items()
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-character-exhaustive-v1-${{ github.run_id }}
          path: /tmp/search-character-exhaustive-v1/*
          retention-days: 90
          if-no-files-found: warn
