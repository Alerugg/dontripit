name: Project Cardmarket Canonical Prices V2

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - 'backend/app/jobs/cardmarket_product_link_price_projection.py'
      - 'backend/scripts/project_cardmarket_product_link_prices.py'
      - 'backend/tests/test_cardmarket_product_link_price_projection.py'
      - '.github/workflows/project-cardmarket-canonical-prices-v2.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/jobs/cardmarket_product_link_price_projection.py'
      - 'backend/scripts/project_cardmarket_product_link_prices.py'
      - 'backend/tests/test_cardmarket_product_link_price_projection.py'
      - '.github/workflows/project-cardmarket-canonical-prices-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardmarket-canonical-prices-v2
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Require production database
        run: test -n "${DATABASE_URL_UNPOOLED}${DATABASE_URL}"
      - name: Compile and test exact-link price projectors
        run: |
          python -m py_compile \
            app/jobs/cardmarket_link_price_projection.py \
            app/jobs/cardmarket_product_link_price_projection.py \
            scripts/project_cardmarket_link_prices.py \
            scripts/project_cardmarket_product_link_prices.py
          pytest -q \
            tests/test_cardmarket_link_price_projection.py \
            tests/test_cardmarket_product_link_price_projection.py
      - name: Preflight current exact canonical price plans READ ONLY
        run: |
          set -euo pipefail
          mkdir -p /tmp/cardmarket-canonical-prices-v2
          for game in mtg yugioh pokemon onepiece; do
            python scripts/project_cardmarket_link_prices.py \
              --game "$game" \
              --report "/tmp/cardmarket-canonical-prices-v2/${game}-singles-preflight.json"
            python scripts/project_cardmarket_product_link_prices.py \
              --game "$game" \
              --report "/tmp/cardmarket-canonical-prices-v2/${game}-sealed-preflight.json"
          done
      - name: Gate exact identity and complete classification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/cardmarket-canonical-prices-v2')
          summary={}
          for game in ('mtg','yugioh','pokemon','onepiece'):
              singles=json.loads((root/f'{game}-singles-preflight.json').read_text())
              sealed=json.loads((root/f'{game}-sealed-preflight.json').read_text())
              assert singles['write_ready'],(game,'singles',singles)
              assert sealed['write_ready'],(game,'sealed',sealed)
              assert singles['snapshot_count']==singles['priceable_prints'],(game,singles)
              assert (
                  singles['priceable_prints']
                  + singles['missing_external_price']
                  + singles['unsupported_finish']
                  + singles['ambiguous_print_links']
              )==singles['canonical_prints'],(game,singles)
              assert sealed['accepted_links']==sealed['canonical_variants'],(game,sealed)
              assert sealed['snapshot_count']==sealed['priceable_variants'],(game,sealed)
              assert sealed['priceable_variants']+sealed['missing_external_price']==sealed['canonical_variants'],(game,sealed)
              summary[game]={
                  'singles':{k:singles[k] for k in ('as_of','canonical_prints','priceable_prints','missing_external_price','unsupported_finish','snapshot_count')},
                  'sealed':{k:sealed[k] for k in ('catalog_capture','as_of','canonical_variants','priceable_variants','missing_external_price','snapshot_count')},
              }
          (root/'preflight-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Apply current canonical singles and sealed prices
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for game in mtg yugioh pokemon onepiece; do
            python scripts/project_cardmarket_link_prices.py \
              --game "$game" --apply \
              --report "/tmp/cardmarket-canonical-prices-v2/${game}-singles-apply.json"
            python scripts/project_cardmarket_product_link_prices.py \
              --game "$game" --apply \
              --report "/tmp/cardmarket-canonical-prices-v2/${game}-sealed-apply.json"
          done
      - name: Prove current canonical snapshots match exact plans
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import select
          from app import db
          from app.jobs.cardmarket_link_price_projection import build_link_price_projection_plan
          from app.jobs.cardmarket_product_link_price_projection import build_product_link_price_projection_plan
          from app.models import PriceSnapshot, PriceSource

          db.init_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          proof={}
          with db.SessionLocal() as session:
              source=session.execute(select(PriceSource).where(PriceSource.name=='cardmarket')).scalar_one()
              for game in ('mtg','yugioh','pokemon','onepiece'):
                  plans=(
                      ('print',build_link_price_projection_plan(session,game_slug=game)),
                      ('product_variant',build_product_link_price_projection_plan(session,game_slug=game)),
                  )
                  proof[game]={}
                  for entity_type,plan in plans:
                      assert plan.summary()['write_ready'],(game,entity_type,plan.summary())
                      expected={int(x['entity_id']):str(x['raw_json']['idProduct']) for x in plan.snapshots}
                      if expected:
                          rows=session.execute(select(PriceSnapshot).where(
                              PriceSnapshot.entity_type==entity_type,
                              PriceSnapshot.entity_id.in_(sorted(expected)),
                              PriceSnapshot.source_id==source.id,
                              PriceSnapshot.currency=='EUR',
                              PriceSnapshot.as_of==plan.as_of,
                          )).scalars().all()
                      else:
                          rows=[]
                      actual={int(row.entity_id):str((row.raw_json or {}).get('idProduct','')) for row in rows}
                      assert actual==expected,(game,entity_type,len(expected),len(actual))
                      proof[game][entity_type]={'as_of':plan.as_of.isoformat() if plan.as_of else None,'expected':len(expected),'stored':len(actual)}
              session.rollback()
          root=Path('/tmp/cardmarket-canonical-prices-v2')
          (root/'final-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-canonical-prices-v2-${{ github.run_id }}
          path: /tmp/cardmarket-canonical-prices-v2/*.json
          retention-days: 90
          if-no-files-found: warn
