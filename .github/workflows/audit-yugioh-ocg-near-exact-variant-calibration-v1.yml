name: Audit Yu-Gi-Oh OCG Near Exact Variant Calibration V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_near_exact_variant_calibration_v1.py'
      - '.github/workflows/audit-yugioh-ocg-near-exact-variant-calibration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_NEAR_EXACT_VARIANT_CALIBRATION_OUTPUT: /tmp/ygo-ocg-near-exact-variant-calibration-v1/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile independent non-ordinal calibration audit
        run: python -m py_compile app/scripts/audit_yugioh_ocg_near_exact_variant_calibration_v1.py
      - name: READ ONLY calibrate residual multi-version groups
        run: |
          mkdir -p /tmp/ygo-ocg-near-exact-variant-calibration-v1
          python -m app.scripts.audit_yugioh_ocg_near_exact_variant_calibration_v1
      - name: Require safe calibrated subset
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-near-exact-variant-calibration-v1/report.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['ordinal_methods_excluded_from_calibration'] is True,p
          assert p['target_variant_physical']==591,p
          assert p['certifiable_pairs']<=591,p
          assert p['certifiable_groups']+p['unresolved_groups']==p['target_variant_groups'],p
          assert len({x['external_product_id'] for x in p['proposal']})==p['certifiable_pairs'],p
          assert len({x['print_id'] for x in p['proposal']})==p['certifiable_pairs'],p
          print(json.dumps({'target_variant_physical':p['target_variant_physical'],'certifiable_pairs':p['certifiable_pairs'],'certifiable_groups':p['certifiable_groups'],'unresolved_groups':p['unresolved_groups'],'pairs_by_set':p['certifiable_pairs_by_set'],'stable_sha256':p['stable_identity_sha256']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-near-exact-variant-calibration-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-near-exact-variant-calibration-v1/report.json
          retention-days: 90
          if-no-files-found: error
