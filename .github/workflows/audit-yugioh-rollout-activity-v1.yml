name: Audit Yu-Gi-Oh Rollout Activity V1

on:
  push:
    branches:
      - agent/yugioh-multilingual-production-recovery-v1
    paths:
      - backend/app/scripts/audit_yugioh_rollout_activity_v1.py
      - .github/workflows/audit-yugioh-rollout-activity-v1.yml
  pull_request:
    branches:
      - main
    paths:
      - backend/app/scripts/audit_yugioh_rollout_activity_v1.py
      - .github/workflows/audit-yugioh-rollout-activity-v1.yml

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Inspect production writer READ ONLY
        run: python -m app.scripts.audit_yugioh_rollout_activity_v1 | tee /tmp/yugioh-rollout-activity-v1.json
      - name: Upload activity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-rollout-activity-v1-${{ github.run_id }}
          path: /tmp/yugioh-rollout-activity-v1.json
          retention-days: 7
          if-no-files-found: warn
