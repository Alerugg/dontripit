name: Audit Yu-Gi-Oh multilingual YGOJSON v1

on:
  workflow_dispatch:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - backend/app/scripts/audit_yugioh_multilingual_ygojson.py
      - .github/workflows/audit-yugioh-multilingual-ygojson-v1.yml

permissions:
  contents: read

concurrency:
  group: audit-yugioh-multilingual-ygojson-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  YGOJSON_URL: https://github.com/iconmaster5326/YGOJSON/releases/download/v1/aggregate.zip

jobs:
  source-audit:
    name: Read-only ES/JA physical-source audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Download immutable YGOJSON v1 aggregate asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ygojson" artifacts
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/ygojson/aggregate.zip" \
            "$YGOJSON_URL"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("${{ runner.temp }}/ygojson/aggregate.zip")
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"archive_bytes={p.stat().st_size}")
          print(f"archive_sha256={h}")
          PY

      - name: Extract aggregate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ygojson/extracted"
          unzip -q "$RUNNER_TEMP/ygojson/aggregate.zip" -d "$RUNNER_TEMP/ygojson/extracted"
          find "$RUNNER_TEMP/ygojson/extracted" -maxdepth 3 -type f -printf '%P\n' | sort | head -80

      - name: Audit Spanish TCG and Japanese OCG physical identities
        shell: bash
        run: |
          set -euo pipefail
          python backend/app/scripts/audit_yugioh_multilingual_ygojson.py \
            --input-dir "$RUNNER_TEMP/ygojson/extracted" \
            --archive "$RUNNER_TEMP/ygojson/aggregate.zip" \
            --source-url "$YGOJSON_URL" \
            --report artifacts/yugioh-multilingual-ygojson-audit.json

      - name: Print compact evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/yugioh-multilingual-ygojson-audit.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/yugioh-multilingual-ygojson-audit.json').read_text())
          compact = {
              'production_writes': r['production_writes'],
              'source': {
                  'archive_bytes': r['source'].get('archive_bytes'),
                  'archive_sha256': r['source'].get('archive_sha256'),
                  'meta': r['source'].get('meta'),
              },
              'totals': r['totals'],
              'es': r['targets']['es'],
              'ja': r['targets']['ja'],
              'gates': r['gates'],
              'gate_pass': r['gate_pass'],
          }
          print(json.dumps(compact, indent=2, ensure_ascii=False))
          PY
          fi

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-multilingual-ygojson-audit
          path: artifacts/yugioh-multilingual-ygojson-audit.json
          if-no-files-found: warn
          retention-days: 30
