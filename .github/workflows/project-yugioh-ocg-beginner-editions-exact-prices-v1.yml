name: Project Yu-Gi-Oh OCG Beginner Editions Exact Prices V1

on:
  pull_request:
    paths:
      - '.github/workflows/project-yugioh-ocg-beginner-editions-exact-prices-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/project-yugioh-ocg-beginner-editions-exact-prices-v1.yml'

permissions:
  contents: read

concurrency:
  group: yugioh-ocg-beginner-editions-exact-prices-v1
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile installed Beginner Edition writer and exact-idProduct projector
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_beginner_editions_v1.py
          python -m py_compile scripts/project_cardmarket_link_prices.py
      - name: READ ONLY prove exact 460-link identity is already complete
        run: |
          mkdir -p /tmp/ygo-ocg-beginner-editions-prices
          python -m app.scripts.apply_yugioh_ocg_beginner_editions_v1 --report /tmp/ygo-ocg-beginner-editions-prices/identity-before.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-beginner-editions-prices/identity-before.json'))
          expected={'BE2':250,'BE02':210}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['certified_pairs']==460,p
          assert p['already_accepted_same_pair']==460,p
          assert p['new_links_ready']==0,p
          rows={r['set_code']:r for r in p['sets']}
          assert {k:rows[k]['existing_same'] for k in rows}==expected,p
          print(json.dumps({'identity_before':'460/460','sets':expected},indent=2))
          PY
      - name: Project current Yu-Gi-Oh prices from accepted exact Cardmarket idProducts
        if: github.event_name == 'push'
        run: python scripts/project_cardmarket_link_prices.py --game yugioh --apply --report /tmp/ygo-ocg-beginner-editions-prices/projection.json
      - name: READ ONLY prove identity remained unchanged
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_beginner_editions_v1 --report /tmp/ygo-ocg-beginner-editions-prices/identity-after.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-beginner-editions-prices/identity-after.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['already_accepted_same_pair']==460,p
          assert p['new_links_ready']==0,p
          print(json.dumps({'identity_after':'460/460','unchanged':True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-beginner-editions-exact-prices-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-beginner-editions-prices/*.json
          retention-days: 90
          if-no-files-found: warn
