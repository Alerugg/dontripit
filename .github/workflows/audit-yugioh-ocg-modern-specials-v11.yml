name: Audit Yu-Gi-Oh OCG Modern Specials V11

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_modern_specials_v11.py'
      - '.github/workflows/audit-yugioh-ocg-modern-specials-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile OCG modern-special certifier V11
        run: python -m py_compile app/scripts/audit_yugioh_ocg_modern_specials_v11.py
      - name: READ ONLY probe exact regional Cardmarket identities
        run: python -m app.scripts.audit_yugioh_ocg_modern_specials_v11
      - name: Require only first-party-positive identities
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/yugioh-ocg-modern-specials-v11.json'))
          expected={'AC02':'5081','AC01':'4532','DBSS':'4558','DBMF':'4575'}
          assert p['production_writes']==0,p
          assert p['not_certified']==0,p
          rows={r['set_code']:r for r in p['results']}
          assert set(rows)==set(expected),p
          for code,exp in expected.items():
              r=rows[code]
              assert r['candidate_idExpansion']==exp,r
              if r['status']=='certified':
                  assert r['certified_idExpansion']==exp,r
                  assert r['candidate']['positive_images']>=2,r
              else:
                  assert r['status']=='inconclusive',r
                  assert r['certified_idExpansion'] is None,r
                  probes=r['candidate'].get('probes',[])
                  assert probes and any(x.get('status')==403 for x in probes),r
          assert p['certified']+p['inconclusive']==4,p
          print(json.dumps({'certified':{k:rows[k]['certified_idExpansion'] for k in expected},'inconclusive':[k for k in expected if rows[k]['status']=='inconclusive']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-modern-specials-v11-${{ github.run_id }}
          path: /tmp/yugioh-ocg-modern-specials-v11.json
          retention-days: 90
          if-no-files-found: error
