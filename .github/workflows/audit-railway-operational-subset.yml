name: Audit Railway Operational Subset

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-railway-operational-subset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install psycopg2-binary

      - name: Compare production API identities and usage read-only
        run: |
          mkdir -p /tmp/railway-operational
          cat > /tmp/railway-operational/audit.py <<'PY'
          import json, os
          from pathlib import Path
          import psycopg2

          def norm(url):
              for old in ('postgresql+psycopg2://','postgres+psycopg2://','postgres://'):
                  if url.startswith(old):
                      return 'postgresql://' + url[len(old):]
              return url

          def load(url):
              conn=psycopg2.connect(norm(url), connect_timeout=15)
              conn.set_session(readonly=True, autocommit=False)
              out={}
              try:
                  with conn.cursor() as cur:
                      cur.execute('''
                        SELECT k.key_hash, k.prefix, p.name, k.is_active,
                               COALESCE(k.scopes::text,'null'), k.created_at, k.last_used_at
                        FROM api_keys k JOIN api_plans p ON p.id=k.plan_id
                      ''')
                      out['keys']={r[0]: {
                          'prefix': r[1], 'plan': r[2], 'active': bool(r[3]),
                          'scopes': r[4], 'created_at': str(r[5]), 'last_used_at': str(r[6]) if r[6] else None
                      } for r in cur.fetchall()}
                      cur.execute('''
                        SELECT p.name, p.monthly_quota_requests, p.burst_rpm
                        FROM api_plans p ORDER BY p.name
                      ''')
                      out['plans']={r[0]: {'quota': r[1], 'burst_rpm': r[2]} for r in cur.fetchall()}
                      cur.execute('''
                        SELECT k.key_hash, u.period_ym, u.request_count, u.last_request_at
                        FROM api_usage u JOIN api_keys k ON k.id=u.api_key_id
                      ''')
                      out['usage']={(r[0],r[1]): {'count': int(r[2]), 'last': str(r[3])} for r in cur.fetchall()}
                      cur.execute('SELECT COUNT(*), COALESCE(SUM(request_count),0) FROM api_usage')
                      rows,total=cur.fetchone(); out['usage_summary']={'rows':int(rows),'requests':int(total)}
                      cur.execute('SELECT COUNT(*) FROM api_request_metrics')
                      out['metric_rows']=int(cur.fetchone()[0])
                  conn.rollback()
                  return out
              finally:
                  conn.close()

          r=load(os.environ['RAILWAY_DATABASE_URL'])
          n=load(os.environ['NEON_DATABASE_URL'])
          rkeys=set(r['keys']); nkeys=set(n['keys']); shared=rkeys & nkeys
          missing=sorted(rkeys-nkeys)
          metadata_mismatch=[]
          for key in shared:
              rk,nk=r['keys'][key],n['keys'][key]
              diffs=[]
              for field in ('prefix','plan','active','scopes'):
                  if rk[field] != nk[field]: diffs.append(field)
              if diffs: metadata_mismatch.append({'key_fingerprint': key[:8], 'fields': diffs})

          usage_keys=set(r['usage']) | set(n['usage'])
          railway_only_usage=[]
          higher_railway_usage=[]
          for ident in sorted(usage_keys):
              rv=r['usage'].get(ident); nv=n['usage'].get(ident)
              if rv and not nv:
                  railway_only_usage.append({'key_fingerprint':ident[0][:8], 'period':ident[1], 'railway_count':rv['count']})
              elif rv and nv and rv['count'] > nv['count']:
                  higher_railway_usage.append({
                      'key_fingerprint':ident[0][:8], 'period':ident[1],
                      'railway_count':rv['count'], 'neon_count':nv['count'],
                      'delta':rv['count']-nv['count']
                  })

          report={
              'status':'pass' if not missing and not metadata_mismatch else 'block',
              'database_writes':0,
              'railway_keys':len(rkeys),
              'neon_keys':len(nkeys),
              'shared_keys':len(shared),
              'railway_keys_missing_in_neon':len(missing),
              'shared_key_metadata_mismatches':len(metadata_mismatch),
              'metadata_mismatch_samples':metadata_mismatch[:20],
              'plans_match':r['plans']==n['plans'],
              'railway_usage':r['usage_summary'],
              'neon_usage':n['usage_summary'],
              'railway_only_usage_rows':len(railway_only_usage),
              'railway_only_usage_requests':sum(x['railway_count'] for x in railway_only_usage),
              'railway_usage_higher_than_neon_rows':len(higher_railway_usage),
              'railway_usage_higher_delta_requests':sum(x['delta'] for x in higher_railway_usage),
              'railway_metric_rows':r['metric_rows'],
              'neon_metric_rows':n['metric_rows'],
          }
          Path('/tmp/railway-operational/report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          if report['status'] != 'pass':
              raise SystemExit('Operational cutover gate blocked')
          PY
          python /tmp/railway-operational/audit.py

      - name: Upload operational audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-operational-subset-${{ github.sha }}
          path: /tmp/railway-operational/report.json
          retention-days: 30
          if-no-files-found: warn
