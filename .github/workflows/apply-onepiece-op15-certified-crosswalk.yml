name: Apply One Piece OP15 Certified Crosswalk

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/apply-onepiece-op15-certified-crosswalk.yml'
      - 'backend/data/op15_cardmarket_crosswalk.zlib.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary==2.9.9
      - name: Validate certified crosswalk and apply exact links
        working-directory: backend
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import zlib
          from collections import Counter, defaultdict
          from pathlib import Path
          from urllib.parse import quote

          import psycopg2
          from psycopg2.extras import Json, RealDictCursor, execute_values

          PAYLOAD = Path('data/op15_cardmarket_crosswalk.zlib.b64')
          EXPECTED_SHA256 = '8c4aa5eb3d60019f9b1de07a75ab0d357ee7ab721acbb40444d50fc9124373e1'
          MAPPING_METHOD = 'op_variant_cm_exact'
          ACCEPTED = ('accepted', 'mapped', 'exact')

          report = {'mode': 'apply_certified', 'status': 'started'}
          try:
              compressed = base64.b64decode(PAYLOAD.read_text(encoding='utf-8').strip())
              raw = zlib.decompress(compressed).decode('utf-8')
              digest = hashlib.sha256(raw.encode('utf-8')).hexdigest()
              if digest != EXPECTED_SHA256:
                  raise AssertionError({'payload_sha256': digest, 'expected': EXPECTED_SHA256})
              mappings = json.loads(raw)
              if len(mappings) != 195:
                  raise AssertionError({'mapping_count': len(mappings), 'expected': 195})
              if len({int(x['print_id']) for x in mappings}) != 195:
                  raise AssertionError('print ids are not globally one-to-one')
              if len({int(x['external_product_id']) for x in mappings}) != 195:
                  raise AssertionError('external product ids are not globally one-to-one')
              if len({str(x['cardmarket_id']) for x in mappings}) != 195:
                  raise AssertionError('Cardmarket idProducts are not globally one-to-one')

              print_ids = [int(x['print_id']) for x in mappings]
              external_ids = [int(x['external_product_id']) for x in mappings]

              conn = psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
              conn.autocommit = False
              try:
                  with conn.cursor(cursor_factory=RealDictCursor) as cur:
                      cur.execute("SELECT id FROM games WHERE slug='onepiece' LIMIT 1")
                      game = cur.fetchone()
                      if not game:
                          raise AssertionError('One Piece game missing')
                      game_id = int(game['id'])

                      cur.execute('''
                          SELECT r.id, r.external_id, r.name, count(DISTINCT pr.print_id) AS print_count
                          FROM catalog_releases r
                          LEFT JOIN print_releases pr ON pr.release_id = r.id
                          WHERE r.game_id=%s AND r.source='onepiece_official'
                            AND upper(r.name) LIKE '%%OP15%%'
                          GROUP BY r.id,r.external_id,r.name
                          ORDER BY print_count DESC,r.id
                      ''', (game_id,))
                      releases = [dict(row) for row in cur.fetchall()]
                      if len(releases) != 1 or int(releases[0]['id']) != 66 or int(releases[0]['print_count']) != 196:
                          raise AssertionError({'unexpected_release_state': releases})
                      release_id = int(releases[0]['id'])

                      cur.execute('''
                          SELECT p.id AS print_id, p.collector_number, p.variant, p.language,
                                 c.game_id, c.name AS card_name, s.code AS set_code,
                                 EXISTS(
                                     SELECT 1 FROM print_releases pr
                                     WHERE pr.print_id=p.id AND pr.release_id=%s
                                 ) AS in_release
                          FROM prints p
                          JOIN cards c ON c.id=p.card_id
                          JOIN sets s ON s.id=p.set_id
                          WHERE p.id = ANY(%s)
                      ''', (release_id, print_ids))
                      print_rows = {int(row['print_id']): dict(row) for row in cur.fetchall()}
                      if len(print_rows) != 195:
                          raise AssertionError({'print_rows': len(print_rows), 'expected': 195})

                      cur.execute("SELECT max(last_seen_at) AS latest FROM external_catalog_products WHERE source='cardmarket'")
                      latest = cur.fetchone()['latest']
                      if latest is None:
                          raise AssertionError('Cardmarket mirror has no current snapshot')

                      cur.execute('''
                          SELECT id AS external_product_id, external_id, game_id, product_group,
                                 name, expansion_external_id, last_seen_at, website_path
                          FROM external_catalog_products
                          WHERE id = ANY(%s) AND source='cardmarket'
                      ''', (external_ids,))
                      product_rows = {int(row['external_product_id']): dict(row) for row in cur.fetchall()}
                      if len(product_rows) != 195:
                          raise AssertionError({'product_rows': len(product_rows), 'expected': 195})

                      collector_re = re.compile(r'\(((?:OP|ST|EB|PRB)\d{1,2}-\d{3}|P-\d{3})\)\s*$', re.I)
                      validation_errors = []
                      for mapping in mappings:
                          pid = int(mapping['print_id'])
                          eid = int(mapping['external_product_id'])
                          print_row = print_rows[pid]
                          product_row = product_rows[eid]
                          expected_collector = str(mapping['collector']).upper()
                          expected_variant = str(mapping['variant'] or 'default').lower()
                          match = collector_re.search(str(product_row.get('name') or ''))
                          product_collector = match.group(1).upper() if match else None

                          checks = {
                              'canonical_game': int(print_row['game_id']) == game_id,
                              'canonical_release': bool(print_row['in_release']),
                              'collector': str(print_row['collector_number']).upper() == expected_collector,
                              'variant': str(print_row.get('variant') or 'default').lower() == expected_variant,
                              'language': str(print_row.get('language') or '').lower() == 'en',
                              'market_game': int(product_row['game_id']) == game_id,
                              'market_single': product_row['product_group'] == 'single',
                              'market_current': product_row['last_seen_at'] == latest,
                              'market_id': str(product_row['external_id']) == str(mapping['cardmarket_id']),
                              'market_collector': product_collector == expected_collector,
                          }
                          if not all(checks.values()):
                              validation_errors.append({
                                  'print_id': pid,
                                  'external_product_id': eid,
                                  'collector': expected_collector,
                                  'variant': expected_variant,
                                  'checks': checks,
                                  'product_name': product_row.get('name'),
                              })
                      if validation_errors:
                          raise AssertionError({'validation_errors': validation_errors[:20], 'count': len(validation_errors)})

                      cur.execute('''
                          SELECT l.external_product_id,l.print_id,l.link_status,l.mapping_method
                          FROM external_catalog_print_links l
                          JOIN external_catalog_products e ON e.id=l.external_product_id
                          WHERE e.source='cardmarket' AND e.game_id=%s
                            AND l.link_status IN ('accepted','mapped','exact')
                            AND (l.print_id = ANY(%s) OR l.external_product_id = ANY(%s))
                      ''', (game_id, print_ids, external_ids))
                      existing = [dict(row) for row in cur.fetchall()]
                      expected_by_print = {int(x['print_id']): int(x['external_product_id']) for x in mappings}
                      expected_by_product = {int(x['external_product_id']): int(x['print_id']) for x in mappings}
                      conflicts = []
                      for row in existing:
                          pid = int(row['print_id'])
                          eid = int(row['external_product_id'])
                          if pid in expected_by_print and expected_by_print[pid] != eid:
                              conflicts.append({'kind': 'print_claimed_elsewhere', **row})
                          if eid in expected_by_product and expected_by_product[eid] != pid:
                              conflicts.append({'kind': 'product_claimed_elsewhere', **row})
                      if conflicts:
                          raise AssertionError({'existing_conflicts': conflicts[:30], 'count': len(conflicts)})

                      values = []
                      for mapping in mappings:
                          pid = int(mapping['print_id'])
                          eid = int(mapping['external_product_id'])
                          source_id = str(mapping['source_id'])
                          evidence = {
                              'source': 'one-piece.cards',
                              'source_kind': 'secondary_explicit_crosswalk',
                              'source_variant_id': source_id,
                              'source_url': f"https://one-piece.cards/cards/{quote(source_id, safe='')}",
                              'cardmarket_id_product': str(mapping['cardmarket_id']),
                              'collector_number': str(mapping['collector']).upper(),
                              'canonical_variant': str(mapping['variant'] or 'default').lower(),
                              'official_release_id': release_id,
                              'certified_payload_sha256': EXPECTED_SHA256,
                              'validation': [
                                  'explicit_cardmarket_id',
                                  'official_release_print',
                                  'collector_exact',
                                  'variant_exact',
                                  'cardmarket_mirror_current',
                                  'global_one_to_one',
                                  'no_existing_conflict',
                              ],
                          }
                          values.append((eid, pid, MAPPING_METHOD, 'exact', 'accepted', False, Json(evidence)))

                      execute_values(
                          cur,
                          '''
                          INSERT INTO external_catalog_print_links(
                              external_product_id,print_id,mapping_method,confidence,link_status,reviewed,evidence
                          ) VALUES %s
                          ON CONFLICT(external_product_id,print_id) DO UPDATE SET
                              mapping_method=EXCLUDED.mapping_method,
                              confidence=EXCLUDED.confidence,
                              link_status=EXCLUDED.link_status,
                              reviewed=EXCLUDED.reviewed,
                              evidence=EXCLUDED.evidence,
                              updated_at=now()
                          ''',
                          values,
                          page_size=500,
                      )

                      cur.execute('''
                          SELECT count(*) AS links,
                                 count(DISTINCT l.external_product_id) AS products,
                                 count(DISTINCT l.print_id) AS prints
                          FROM external_catalog_print_links l
                          WHERE l.mapping_method=%s AND l.link_status='accepted'
                            AND l.print_id = ANY(%s)
                      ''', (MAPPING_METHOD, print_ids))
                      stored = dict(cur.fetchone())
                      if tuple(int(stored[key]) for key in ('links','products','prints')) != (195,195,195):
                          raise AssertionError({'stored': stored, 'expected': {'links':195,'products':195,'prints':195}})

                      cur.execute('''
                          SELECT count(*) AS priced
                          FROM external_catalog_print_links l
                          JOIN external_market_price_snapshots mp ON mp.external_product_id=l.external_product_id
                          WHERE l.mapping_method=%s AND l.link_status='accepted'
                            AND l.print_id = ANY(%s)
                            AND mp.currency='EUR' AND mp.price_variant='nonfoil'
                            AND mp.as_of=(
                                SELECT max(mp2.as_of)
                                FROM external_market_price_snapshots mp2
                                WHERE mp2.external_product_id=mp.external_product_id
                                  AND mp2.currency='EUR' AND mp2.price_variant='nonfoil'
                            )
                      ''', (MAPPING_METHOD, print_ids))
                      priced = int(cur.fetchone()['priced'])

                      report.update({
                          'status': 'validated_and_applied',
                          'release_id': release_id,
                          'payload_sha256': digest,
                          'mapping_count': len(mappings),
                          'stored': {k: int(v) for k,v in stored.items()},
                          'current_nonfoil_price_rows': priced,
                          'op15_links': sum(1 for x in mappings if str(x['collector']).startswith('OP15-')),
                          'eb04_links': sum(1 for x in mappings if str(x['collector']).startswith('EB04-')),
                          'other_release_reprints': sum(1 for x in mappings if not str(x['collector']).startswith(('OP15-','EB04-'))),
                      })
                  conn.commit()
              except Exception:
                  conn.rollback()
                  raise
              finally:
                  conn.close()
          except Exception as error:
              report.update({'status': 'failed', 'error': repr(error)})
              Path('/tmp/op15-certified-crosswalk-apply.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
              print(json.dumps(report,indent=2,default=str))
              raise

          Path('/tmp/op15-certified-crosswalk-apply.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
          print(json.dumps(report,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op15-certified-crosswalk-apply-${{ github.run_id }}
          path: /tmp/op15-certified-crosswalk-apply.json
          retention-days: 90
