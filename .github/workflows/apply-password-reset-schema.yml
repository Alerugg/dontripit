name: Apply Password Reset Schema

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/apply-password-reset-schema.yml'
      - 'backend/alembic/versions/20260809_27_add_password_reset_tokens.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: password-reset-schema-live
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify database secret
        run: test -n "${DATABASE_URL}${DATABASE_URL_UNPOOLED}"

      - name: Bring live database to current migration head
        run: alembic upgrade head

      - name: Verify password reset table is usable
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          url = os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if url.startswith('postgres://'):
              url = 'postgresql://' + url[len('postgres://'):]
          engine = create_engine(url, pool_pre_ping=True)
          inspector = inspect(engine)
          if not inspector.has_table('user_password_reset_tokens'):
              raise SystemExit('user_password_reset_tokens table is missing')
          columns = {column['name'] for column in inspector.get_columns('user_password_reset_tokens')}
          required = {'id', 'user_id', 'token_hash', 'expires_at', 'used_at', 'created_at'}
          missing = required - columns
          if missing:
              raise SystemExit(f'Missing password reset columns: {sorted(missing)}')
          print('password reset schema PASS')
          PY
