name: Apply Password Reset Schema

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/apply-password-reset-schema.yml'
      - 'backend/alembic/versions/20260809_27_add_password_reset_tokens.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: password-reset-schema-live
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify Neon secret
        run: test -n "${DATABASE_URL}${DATABASE_URL_UNPOOLED}"

      - name: Capture live state and verify migration preconditions
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          url = os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if url.startswith('postgres://'):
              url = 'postgresql://' + url[len('postgres://'):]
          engine = create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              version = str(conn.execute(text('SELECT version_num FROM alembic_version')).scalar_one())
              state = {
                  'alembic_version': version,
                  'cards': int(conn.execute(text('SELECT COUNT(*) FROM cards')).scalar_one()),
                  'prints': int(conn.execute(text('SELECT COUNT(*) FROM prints')).scalar_one()),
                  'prices': int(conn.execute(text('SELECT COUNT(*) FROM prices')).scalar_one()),
                  'price_snapshots': int(conn.execute(text('SELECT COUNT(*) FROM price_snapshots')).scalar_one()),
                  'users': int(conn.execute(text('SELECT COUNT(*) FROM users')).scalar_one()),
                  'user_sessions': int(conn.execute(text('SELECT COUNT(*) FROM user_sessions')).scalar_one()),
                  'collection': int(conn.execute(text('SELECT COUNT(*) FROM user_collection_items')).scalar_one()),
                  'wishlist': int(conn.execute(text('SELECT COUNT(*) FROM user_wishlist_items')).scalar_one()),
                  'reset_table': bool(conn.execute(text("SELECT to_regclass('public.user_password_reset_tokens') IS NOT NULL")).scalar_one()),
              }
          if version not in {'20260809_26', '20260809_27'}:
              raise SystemExit(f'Unexpected live Alembic version: {version}')
          if version == '20260809_26' and state['reset_table']:
              raise SystemExit('Password-reset table exists before revision 27')
          if version == '20260809_27' and not state['reset_table']:
              raise SystemExit('Revision 27 recorded but password-reset table is missing')
          Path('/tmp/password-reset-before.json').write_text(json.dumps(state, indent=2, sort_keys=True) + '\n')
          print(json.dumps(state, indent=2, sort_keys=True))
          PY

      - name: Apply additive password reset schema
        run: alembic upgrade 20260809_27

      - name: Verify live state is unchanged except additive schema
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          before = json.loads(Path('/tmp/password-reset-before.json').read_text())
          url = os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if url.startswith('postgres://'):
              url = 'postgresql://' + url[len('postgres://'):]
          engine = create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              after = {
                  'alembic_version': str(conn.execute(text('SELECT version_num FROM alembic_version')).scalar_one()),
                  'cards': int(conn.execute(text('SELECT COUNT(*) FROM cards')).scalar_one()),
                  'prints': int(conn.execute(text('SELECT COUNT(*) FROM prints')).scalar_one()),
                  'prices': int(conn.execute(text('SELECT COUNT(*) FROM prices')).scalar_one()),
                  'price_snapshots': int(conn.execute(text('SELECT COUNT(*) FROM price_snapshots')).scalar_one()),
                  'users': int(conn.execute(text('SELECT COUNT(*) FROM users')).scalar_one()),
                  'user_sessions': int(conn.execute(text('SELECT COUNT(*) FROM user_sessions')).scalar_one()),
                  'collection': int(conn.execute(text('SELECT COUNT(*) FROM user_collection_items')).scalar_one()),
                  'wishlist': int(conn.execute(text('SELECT COUNT(*) FROM user_wishlist_items')).scalar_one()),
              }
              reset_table = bool(conn.execute(text("SELECT to_regclass('public.user_password_reset_tokens') IS NOT NULL")).scalar_one())
              constraints = {
                  name: bool(conn.execute(text('SELECT EXISTS(SELECT 1 FROM pg_constraint WHERE conname=:name)'), {'name': name}).scalar_one())
                  for name in ('uq_user_password_reset_token_hash',)
              }
              indexes = {
                  name: bool(conn.execute(text('SELECT to_regclass(:name) IS NOT NULL'), {'name': f'public.{name}'}).scalar_one())
                  for name in (
                      'ix_user_password_reset_tokens_user_id',
                      'ix_user_password_reset_tokens_token_hash',
                      'ix_user_password_reset_tokens_expires_at',
                  )
              }

          if after['alembic_version'] != '20260809_27':
              raise SystemExit(f"Unexpected post-migration version: {after['alembic_version']}")
          if not reset_table or not all(constraints.values()) or not all(indexes.values()):
              raise SystemExit(f'Incomplete password reset schema: table={reset_table}, constraints={constraints}, indexes={indexes}')
          for key in ('cards', 'prints', 'prices', 'price_snapshots', 'users', 'user_sessions', 'collection', 'wishlist'):
              if before[key] != after[key]:
                  raise SystemExit(f'{key} changed during additive migration: {before[key]} -> {after[key]}')
          print(json.dumps({'before': before, 'after': after, 'constraints': constraints, 'indexes': indexes}, indent=2, sort_keys=True))
          PY
