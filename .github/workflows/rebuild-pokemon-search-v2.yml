name: Rebuild Pokemon Search V2

on:
  workflow_dispatch:

concurrency:
  group: pokemon-search-v2-rebuild
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Checkout catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify Neon secret
        run: test -n "${DATABASE_URL}${DATABASE_URL_UNPOOLED}"

      - name: Compile Search V2 modules
        working-directory: backend
        run: |
          python -m compileall -q app/search_v2 app/routes/search_v2.py app/scripts/rebuild_pokemon_search_v2_fast.py app/scripts/benchmark_pokemon_search_v2_fast.py

      - name: Apply performance schema migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Rebuild Pokémon Search V2 transactionally
        working-directory: backend
        run: |
          set -euo pipefail
          python -u -m app.scripts.rebuild_pokemon_search_v2_fast \
            --report-path /tmp/pokemon-search-v2-rebuild.json \
            | tee /tmp/pokemon-search-v2-rebuild.log

      - name: Run Pokémon Search V2 functional and latency benchmark
        working-directory: backend
        run: |
          set -euo pipefail
          python -u -m app.scripts.benchmark_pokemon_search_v2_fast \
            --report-path /tmp/pokemon-search-v2-benchmark.json \
            | tee /tmp/pokemon-search-v2-benchmark.log

      - name: Print Search V2 evidence
        if: always()
        run: |
          echo '--- rebuild ---'
          cat /tmp/pokemon-search-v2-rebuild.json 2>/dev/null || true
          echo '--- benchmark ---'
          cat /tmp/pokemon-search-v2-benchmark.json 2>/dev/null || true

      - name: Upload Pokémon Search V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-search-v2-${{ github.sha }}
          path: |
            /tmp/pokemon-search-v2-rebuild.json
            /tmp/pokemon-search-v2-rebuild.log
            /tmp/pokemon-search-v2-benchmark.json
            /tmp/pokemon-search-v2-benchmark.log
          retention-days: 90
          if-no-files-found: warn
