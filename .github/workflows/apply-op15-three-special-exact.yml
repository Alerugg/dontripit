name: Apply OP15 Final Three Exact Variants

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/apply-op15-three-special-exact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 psycopg2-binary==2.9.9
      - name: Validate official two-print identity and apply remaining exact mappings
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import quote,urlencode
          import psycopg2,requests
          from bs4 import BeautifulSoup
          from psycopg2.extras import Json,RealDictCursor,execute_values

          targets=[
            {'collector':'OP15-036','name':'Ryuma','print_id':42532,'variant':'r1','cardmarket_id':'883418','source_id':'en:OP15-036_cm883418','official_other_set':'STARTER DECK -GREEN Roronoa Zoro- [ST-32]'},
            {'collector':'OP15-075','name':'El Thor','print_id':42579,'variant':'p1','cardmarket_id':'883395','source_id':'en:OP15-075_cm883395','official_other_set':'Premium Card Collection -Best Selection Vol.6-'},
            {'collector':'OP15-108','name':'Nami','print_id':42618,'variant':'p1','cardmarket_id':'883935','source_id':'en:OP15-108_cm883935','official_other_set':'Premium Card Collection -Best Selection Vol.6-'},
          ]
          http=requests.Session(); http.headers.update({'User-Agent':'DontRipIt/1.0 exact-special-variant-verifier'})
          secondary_cm_re=re.compile(r'https://www\.cardmarket\.com/OnePiece/Products\?idProduct=(\d+)',re.I)
          official_evidence=[]
          for target in targets:
            official_url='https://en.onepiece-cardgame.com/cardlist/?'+urlencode({'freewords':target['collector']})
            r=http.get(official_url,timeout=25); r.raise_for_status()
            soup=BeautifulSoup(r.text,'html.parser')
            text='\n'.join(line.strip() for line in soup.get_text('\n').splitlines() if line.strip())
            result_match=re.search(r'(\d+)\s+results',text,re.I)
            result_count=int(result_match.group(1)) if result_match else None
            if result_count != 2:
              raise AssertionError({'collector':target['collector'],'official_result_count':result_count})
            if '-ADVENTURE ON KAMI\'S ISLAND- [OP15-EB04]' not in text:
              raise AssertionError({'collector':target['collector'],'missing_base_set':True})
            if target['official_other_set'] not in text:
              raise AssertionError({'collector':target['collector'],'missing_official_other_set':target['official_other_set']})

            secondary_url=f"https://one-piece.cards/cards/{quote(target['source_id'],safe='')}"
            s=http.get(secondary_url,timeout=20); s.raise_for_status()
            cm_ids=sorted(set(secondary_cm_re.findall(s.text)))
            if cm_ids != [target['cardmarket_id']]:
              raise AssertionError({'collector':target['collector'],'secondary_cm_ids':cm_ids,'expected':target['cardmarket_id']})
            official_evidence.append({
              'collector':target['collector'],'official_url':official_url,'official_result_count':result_count,
              'official_other_set':target['official_other_set'],'secondary_url':secondary_url,'explicit_cardmarket_id':target['cardmarket_id']
            })

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL']); conn.autocommit=False
          report={'mode':'apply','targets':[]}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='onepiece'"); gid=int(cur.fetchone()['id'])
              cur.execute("SELECT id FROM sets WHERE game_id=%s AND lower(code)='op-15'",(gid,)); set_id=int(cur.fetchone()['id'])
              cur.execute("SELECT max(last_seen_at) latest FROM external_catalog_products WHERE source='cardmarket'"); latest=cur.fetchone()['latest']
              inserts=[]
              for target,evidence in zip(targets,official_evidence):
                cur.execute('''
                  SELECT p.id AS print_id,p.variant,p.collector_number,p.language,c.name AS card_name
                  FROM prints p JOIN cards c ON c.id=p.card_id
                  WHERE p.set_id=%s AND c.game_id=%s AND upper(p.collector_number)=%s
                  ORDER BY p.id
                ''',(set_id,gid,target['collector']))
                prints=[dict(r) for r in cur.fetchall()]
                if len(prints)!=2:
                  raise AssertionError({'collector':target['collector'],'canonical_prints':prints})
                alt=[p for p in prints if int(p['print_id'])==target['print_id']]
                base=[p for p in prints if int(p['print_id'])!=target['print_id']]
                if len(alt)!=1 or len(base)!=1:
                  raise AssertionError({'collector':target['collector'],'target_print_partition_failed':prints})
                if str(alt[0]['variant'] or 'default').lower()!=target['variant'] or str(base[0]['variant'] or 'default').lower()!='default':
                  raise AssertionError({'collector':target['collector'],'variants':prints})

                cur.execute('''
                  SELECT e.id AS external_product_id,e.external_id,e.name,e.last_seen_at,e.expansion_external_id
                  FROM external_catalog_products e
                  WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single'
                    AND e.last_seen_at=%s AND e.name ILIKE %s
                  ORDER BY e.id
                ''',(gid,latest,f"%({target['collector']})"))
                products=[dict(r) for r in cur.fetchall()]
                if len(products)!=2:
                  raise AssertionError({'collector':target['collector'],'current_cardmarket_products':products,'expected':2})
                by_cm={str(p['external_id']):p for p in products}
                if target['cardmarket_id'] not in by_cm:
                  raise AssertionError({'collector':target['collector'],'missing_explicit_cm_id':target['cardmarket_id'],'products':products})
                target_product=by_cm[target['cardmarket_id']]
                other_products=[p for p in products if str(p['external_id'])!=target['cardmarket_id']]
                if len(other_products)!=1:
                  raise AssertionError({'collector':target['collector'],'other_product_count':len(other_products)})

                cur.execute('''
                  SELECT l.external_product_id,l.print_id,l.mapping_method,l.link_status
                  FROM external_catalog_print_links l
                  JOIN external_catalog_products e ON e.id=l.external_product_id
                  WHERE e.source='cardmarket' AND e.game_id=%s AND l.link_status IN ('accepted','mapped','exact')
                    AND (l.print_id=ANY(%s) OR l.external_product_id=ANY(%s))
                ''',(gid,[int(p['print_id']) for p in prints],[int(p['external_product_id']) for p in products]))
                links=[dict(r) for r in cur.fetchall()]
                base_print_id=int(base[0]['print_id']); alt_print_id=int(alt[0]['print_id'])
                target_eid=int(target_product['external_product_id']); other_eid=int(other_products[0]['external_product_id'])
                base_links=[l for l in links if int(l['print_id'])==base_print_id and int(l['external_product_id'])==other_eid]
                if len(base_links)!=1:
                  raise AssertionError({'collector':target['collector'],'base_complement_not_proven':True,'base_print_id':base_print_id,'other_eid':other_eid,'links':links})
                conflicts=[l for l in links if (int(l['print_id'])==alt_print_id and int(l['external_product_id'])!=target_eid) or (int(l['external_product_id'])==target_eid and int(l['print_id'])!=alt_print_id)]
                if conflicts:
                  raise AssertionError({'collector':target['collector'],'conflicts':conflicts})

                ev={
                  'source':'onepiece_official+one-piece.cards+cardmarket_mirror',
                  'mapping_basis':['official_exactly_two_prints','official_alternate_product_set','secondary_explicit_cardmarket_id','current_cardmarket_exactly_two_products','default_complement_already_exact','global_one_to_one','no_existing_conflict'],
                  'collector_number':target['collector'],'canonical_variant':target['variant'],'official_other_set':target['official_other_set'],
                  'official_cardlist_url':evidence['official_url'],'secondary_source_url':evidence['secondary_url'],'cardmarket_id_product':target['cardmarket_id'],
                  'base_print_id':base_print_id,'base_cardmarket_external_product_id':other_eid,
                }
                inserts.append((target_eid,alt_print_id,'op_special_two_print_exact','exact','accepted',False,Json(ev)))
                report['targets'].append({**target,'external_product_id':target_eid,'base_print_id':base_print_id,'base_external_product_id':other_eid,'official_other_set':target['official_other_set']})

              execute_values(cur,'''INSERT INTO external_catalog_print_links(external_product_id,print_id,mapping_method,confidence,link_status,reviewed,evidence) VALUES %s
                ON CONFLICT(external_product_id,print_id) DO UPDATE SET mapping_method=EXCLUDED.mapping_method,confidence=EXCLUDED.confidence,link_status=EXCLUDED.link_status,evidence=EXCLUDED.evidence,updated_at=now()''',inserts,page_size=20)
              cur.execute('''SELECT count(*) links,count(DISTINCT print_id) prints,count(DISTINCT external_product_id) products
                FROM external_catalog_print_links WHERE mapping_method='op_special_two_print_exact' AND link_status='accepted' AND print_id=ANY(%s)''',([x['print_id'] for x in targets],))
              stored=dict(cur.fetchone())
              if tuple(int(stored[k]) for k in ('links','prints','products'))!=(3,3,3):
                raise AssertionError({'stored':stored})
              report['stored']={k:int(v) for k,v in stored.items()}
            conn.commit()
          except Exception:
            conn.rollback(); raise
          finally: conn.close()
          print(json.dumps(report,indent=2,ensure_ascii=False,default=str))
          Path('/tmp/op15-final-three-exact.json').write_text(json.dumps(report,indent=2,ensure_ascii=False,default=str)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op15-final-three-exact-${{ github.run_id }}
          path: /tmp/op15-final-three-exact.json
          retention-days: 90
