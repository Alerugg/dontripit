name: Audit Yu-Gi-Oh OCG Certified Singletons V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_certified_singletons_v1.py'
      - '.github/workflows/audit-yugioh-ocg-certified-singletons-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_CERTIFIED_SINGLETONS_OUTPUT: /tmp/yugioh-ocg-certified-singletons-v1.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile singleton auditor
        run: python -m py_compile app/scripts/audit_yugioh_ocg_certified_singletons_v1.py
      - name: READ ONLY derive deterministic singleton mappings
        run: python -m app.scripts.audit_yugioh_ocg_certified_singletons_v1
      - name: Require safe one-to-one surface
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/yugioh-ocg-certified-singletons-v1.json'))
          expected={'ROTA':'5840','SUDA':'5929','INFO':'5753','LEDE':'5608','PHNI':'5533','DUNE':'5326','CYAC':'5242','PHHY':'5166','DABL':'5107','DIFO':'4519','BACH':'4524','BODE':'4528'}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['certified_expansions']==expected,p
          assert len(p['sets'])==12,p
          assert p['total_certified_singleton_pairs']>0,p
          assert p['total_new_links_ready']>0,p
          for row in p['sets']:
              assert row['certified_singleton_pairs']>0,row
              assert row['blocked_breakdown'].get('accepted_claim_conflicts',0)==0,row
          print(json.dumps({'pairs':p['total_certified_singleton_pairs'],'new':p['total_new_links_ready'],'sets':{r['set_code']:r['new_links_ready'] for r in p['sets']}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-certified-singletons-v1-${{ github.run_id }}
          path: /tmp/yugioh-ocg-certified-singletons-v1.json
          retention-days: 90
          if-no-files-found: error
