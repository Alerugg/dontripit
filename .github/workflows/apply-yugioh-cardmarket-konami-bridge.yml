name: Apply YGO Cardmarket Konami Bridge

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/apply-yugioh-cardmarket-konami-bridge.yml'
      - 'backend/scripts/apply_yugioh_cardmarket_konami_bridge.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-yugioh-cardmarket-konami-bridge
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Dry-run exact release-aware links
        run: python scripts/apply_yugioh_cardmarket_konami_bridge.py --min-samples 3 --report /tmp/ygo-konami-bridge-dry.json
      - name: Apply exact release-aware links
        run: python scripts/apply_yugioh_cardmarket_konami_bridge.py --min-samples 3 --apply --report /tmp/ygo-konami-bridge-apply.json
      - name: Project exact YGO Cardmarket prices
        run: |
          python scripts/project_cardmarket_link_prices.py --game yugioh --report /tmp/ygo-price-projection-dry.json
          python scripts/project_cardmarket_link_prices.py --game yugioh --apply --report /tmp/ygo-price-projection-apply.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-cardmarket-konami-bridge-apply-${{ github.run_id }}
          path: |
            /tmp/ygo-konami-bridge-dry.json
            /tmp/ygo-konami-bridge-apply.json
            /tmp/ygo-price-projection-dry.json
            /tmp/ygo-price-projection-apply.json
          retention-days: 90
          if-no-files-found: warn
