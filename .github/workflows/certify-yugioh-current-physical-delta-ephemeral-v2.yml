name: Certify Yu-Gi-Oh Current Physical Delta Ephemeral V2

on:
  workflow_dispatch:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - backend/app/scripts/certify_yugioh_current_physical_delta_ephemeral_v1.py
      - backend/app/scripts/certify_yugioh_current_physical_delta_ephemeral_v2.py
      - backend/app/scripts/audit_yugioh_current_physical_delta_v2.py
      - backend/app/scripts/seed_yugioh_multilingual_ephemeral_lean_v1.py
      - backend/app/scripts/seed_yugioh_production_shape_v1.py
      - backend/app/scripts/prepare_yugioh_multilingual_ephemeral_v1.py
      - backend/alembic/versions/20260815_35_add_set_region_identity.py
      - backend/alembic/versions/20260815_36_scope_print_identity_by_card.py
      - .github/workflows/certify-yugioh-current-physical-delta-ephemeral-v2.yml

permissions:
  contents: read

concurrency:
  group: certify-yugioh-current-physical-delta-ephemeral-v2
  cancel-in-progress: true

env:
  PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
  EPHEMERAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_ygo_delta_ephemeral
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_ygo_delta_ephemeral
  YGOJSON_URL: https://github.com/iconmaster5326/YGOJSON/releases/download/v1/aggregate.zip
  YAML_YUGI_CARDS_URL: https://dawnbrandbots.github.io/yaml-yugi/cards.json
  YAML_YUGI_REPO_API: https://api.github.com/repos/DawnbrandBots/yaml-yugi
  PYTHONPATH: .

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dontripit_ygo_delta_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dontripit_ygo_delta_ephemeral"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout isolated Yu-Gi-Oh branch
        uses: actions/checkout@v4
        with:
          ref: multilingual-ygo-v1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Compile current overlay certification code
        run: |
          python -m py_compile \
            app/scripts/certify_yugioh_current_physical_delta_ephemeral_v1.py \
            app/scripts/certify_yugioh_current_physical_delta_ephemeral_v2.py \
            app/scripts/audit_yugioh_current_physical_delta_v2.py \
            app/scripts/seed_yugioh_multilingual_ephemeral_lean_v1.py

      - name: Prove production is source-only and ephemeral is local
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          prod=os.getenv('PRODUCTION_DATABASE_URL_UNPOOLED') or os.getenv('PRODUCTION_DATABASE_URL')
          eph=os.environ['EPHEMERAL_DATABASE_URL']
          assert prod and prod != eph
          assert urlparse(eph).hostname in {'127.0.0.1','localhost'}
          print('safety gate: production != target; target is local PostgreSQL')
          PY

      - name: Build exact production schema revision 34
        run: alembic upgrade 20260814_34

      - name: Clone only Yu-Gi-Oh catalog from production in READ ONLY mode
        run: python -m app.scripts.seed_yugioh_production_shape_v1

      - name: Apply regional and card-scoped migrations on production-shaped data
        run: alembic upgrade head

      - name: Certify migrations and install hard write guards
        run: python -m app.scripts.prepare_yugioh_multilingual_ephemeral_v1

      - name: Download and seal YGOJSON and current YAML Yugi sources
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ygojson/extracted" "$RUNNER_TEMP/yaml-yugi" artifacts
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/ygojson/aggregate.zip" "$YGOJSON_URL"
          sha256sum "$RUNNER_TEMP/ygojson/aggregate.zip" | tee artifacts/yugioh-ygojson-v1-sha256.txt
          unzip -q "$RUNNER_TEMP/ygojson/aggregate.zip" -d "$RUNNER_TEMP/ygojson/extracted"

          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/yaml-yugi/cards.json" "$YAML_YUGI_CARDS_URL"
          sha256sum "$RUNNER_TEMP/yaml-yugi/cards.json" | tee artifacts/yugioh-yaml-yugi-cards-sha256.txt

          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          cards=Path(os.environ['RUNNER_TEMP'])/'yaml-yugi'/'cards.json'
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'User-Agent':'dontripit-ygo-delta-ephemeral-v2',
          }
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          repo=get(os.environ['YAML_YUGI_REPO_API'])
          commits=get(os.environ['YAML_YUGI_REPO_API']+'/commits?sha=master&per_page=1')
          meta={
              'source':'yaml-yugi',
              'cards_url':os.environ['YAML_YUGI_CARDS_URL'],
              'sha256':hashlib.sha256(cards.read_bytes()).hexdigest(),
              'head':commits[0]['sha'] if commits else None,
              'head_date':commits[0]['commit']['committer']['date'] if commits else None,
              'pushed_at':repo.get('pushed_at'),
          }
          out=Path(os.environ['RUNNER_TEMP'])/'yaml-yugi'/'source-meta.json'
          out.write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          Path('artifacts/yugioh-yaml-yugi-source-meta.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          print(json.dumps(meta,indent=2,sort_keys=True))
          PY

      - name: Run guarded two-pass current physical overlay certification
        run: |
          python -m app.scripts.certify_yugioh_current_physical_delta_ephemeral_v2 \
            --ygojson-dir "$RUNNER_TEMP/ygojson/extracted" \
            --yaml-cards "$RUNNER_TEMP/yaml-yugi/cards.json" \
            --yaml-meta "$RUNNER_TEMP/yaml-yugi/source-meta.json" \
            --output ../artifacts/yugioh-current-physical-delta-ephemeral-v2.json

      - name: Enforce exact current overlay contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../artifacts/yugioh-current-physical-delta-ephemeral-v2.json').read_text())
          assert r['status']=='pass', r
          assert r['mode']=='ephemeral-only-yugioh-current-physical-overlay-v1', r
          assert r['production_writes']==0, r
          assert r['production_rollout_ready'] is False, r
          assert r['plan_summary']['overlay_counts']=={'es':3938,'ja':5350}, r
          assert r['plan_summary']['quarantine']['es']=={
              'retained_missing_card':32,'rarity_disjoint_conflicts':397,'total':429
          }, r
          assert r['plan_summary']['quarantine']['ja']=={
              'retained_missing_card':52,'rarity_disjoint_conflicts':2833,'total':2885
          }, r
          assert sum(v['total'] for v in r['plan_summary']['quarantine'].values())==3314, r
          assert all(r['plan_summary']['gates'].values()), r
          assert r['plan_summary']['gates']['localized_text_conflicts_preserved_without_synthesis'] is True, r
          assert r['plan_summary']['gates']['localized_text_conflict_evidence_retained'] is True, r
          assert r['pass1_exact_9288'] is True, r
          assert r['pass1']['prints_created']==9288, r
          assert r['pass1']['prints_created_by_target']=={'es':3938,'ja':5350}, r
          assert r['validation']['status']=='pass', r
          assert all(r['validation']['gates'].values()), r
          assert r['validation']['materialized_unique_prints']==9288, r
          assert r['validation']['target_counts']=={'es':3938,'ja':5350}, r
          assert r['validation']['foreign_id_violations']==0, r
          assert r['validation']['print_images_written']==0, r
          assert r['validation']['provenance_missing']==0, r
          assert r['validation']['metadata_price_key_violations']==0, r
          assert r['validation']['lean_invariants']['status']=='pass', r
          assert r['validation']['lean_invariants']['economics_untouched'] is True, r
          assert r['pass2_zero_writes'] is True, r
          assert r['pass2']['total_writes']==0, r
          print(json.dumps({
              'status':r['status'],
              'overlay':r['plan_summary']['overlay_counts'],
              'quarantine':r['plan_summary']['quarantine'],
              'localized_name_coverage':r['plan_summary']['localized_name_coverage'],
              'localized_text_coverage':r['plan_summary']['localized_text_coverage'],
              'pass1':r['pass1'],
              'validation':r['validation'],
              'pass2':r['pass2'],
              'production_rollout_ready':r['production_rollout_ready'],
              'rollout_blocker':r['rollout_blocker'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-current-physical-delta-ephemeral-v2-${{ github.run_id }}
          path: |
            artifacts/yugioh-current-physical-delta-ephemeral-v2.json
            artifacts/yugioh-ygojson-v1-sha256.txt
            artifacts/yugioh-yaml-yugi-cards-sha256.txt
            artifacts/yugioh-yaml-yugi-source-meta.json
            /tmp/yugioh-production-shape-pre-migration.json
            /tmp/yugioh-multilingual-ephemeral-baseline.json
          retention-days: 90
          if-no-files-found: warn
