name: Audit Yu-Gi-Oh OCG DOCS Super Secret V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_docs_super_secret_v1.py'
      - '.github/workflows/audit-yugioh-ocg-docs-super-secret-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_DOCS_SUPER_SECRET_OUTPUT: /tmp/ygo-ocg-docs-super-secret/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile DOCS Super Secret residual auditor
        run: python -m py_compile app/scripts/audit_yugioh_ocg_docs_super_secret_v1.py
      - name: READ ONLY derive exact final DOCS Super Secret residual pairs
        run: |
          mkdir -p /tmp/ygo-ocg-docs-super-secret
          python -m app.scripts.audit_yugioh_ocg_docs_super_secret_v1
      - name: Require exact frozen DOCS residual surface
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-docs-super-secret/report.json'))
          expected=['220961','220978','220985','220989','221004','221006','221017','221041','221393','225872']
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['set_code']=='DOCS',p
          assert p['idExpansion']=='4680',p
          assert p['regional_products']==108,p
          assert p['canonical_ja_prints']==108,p
          assert p['accepted_links_before']==88,p
          assert len(p['evidence_sha256'])==64,p
          assert p['candidate_groups']==10,p
          assert p['candidate_pairs']==20,p
          assert p['candidate_products']==20,p
          assert p['candidate_prints']==20,p
          assert p['expected_residual_metacards']==expected,p
          assert {g['idMetacard'] for g in p['groups']}==set(expected),p
          assert all(g['residual_products']==2 and g['residual_prints']==2 for g in p['groups']),p
          assert all([x['contract_rarity'] for x in g['pairs']]==['super','secret'] for g in p['groups']),p
          assert len({x['idProduct'] for x in p['proposal']})==20,p
          assert len({x['print_id'] for x in p['proposal']})==20,p
          print(json.dumps({'evidence_sha256':p['evidence_sha256'],'groups':10,'pairs':20,'accepted_before':88,'target_after':108},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-docs-super-secret-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-docs-super-secret/report.json
          retention-days: 90
          if-no-files-found: error
