name: Repair Canonical Images

on:
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/jobs/repair_source_images.py'
      - '.github/workflows/repair-canonical-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-canonical-images
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Repair only exact-source image gaps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app import db
          from app.jobs.repair_source_images import repair_exact_source_images
          db.init_engine()
          with db.SessionLocal() as session:
              report=repair_exact_source_images(session)
              if report['pokemon']['request_failures'] or report['mtg']['request_failures']:
                  raise AssertionError({'source_request_failures':report})
              session.commit()
          Path('/tmp/canonical-image-repair.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Verify no image was attached without exact source ID
        run: |
          python - <<'PY'
          import json,os
          from sqlalchemy import create_engine,text
          engine=create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with engine.connect() as c:
              bad=c.execute(text('''
                SELECT count(*)
                FROM print_images i JOIN prints p ON p.id=i.print_id
                WHERE (i.source='tcgdex' AND NULLIF(p.tcgdex_id,'') IS NULL)
                   OR (i.source='scryfall' AND NULLIF(p.scryfall_id,'') IS NULL)
              ''')).scalar_one()
              rows=c.execute(text('''
                SELECT g.slug,count(*) missing
                FROM prints p JOIN cards ca ON ca.id=p.card_id JOIN games g ON g.id=ca.game_id
                WHERE g.slug IN ('pokemon','onepiece','mtg','yugioh')
                  AND NOT EXISTS(SELECT 1 FROM print_images i WHERE i.print_id=p.id AND NULLIF(i.url,'') IS NOT NULL)
                GROUP BY g.slug ORDER BY g.slug
              ''')).mappings().all()
          if int(bad):
              raise AssertionError({'images_without_exact_source_identity':int(bad)})
          proof={r['slug']:int(r['missing']) for r in rows}
          print(json.dumps({'images_without_exact_source_identity':0,'remaining_missing':proof},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-image-repair-${{ github.run_id }}
          path: /tmp/canonical-image-repair.json
          retention-days: 90
          if-no-files-found: warn
