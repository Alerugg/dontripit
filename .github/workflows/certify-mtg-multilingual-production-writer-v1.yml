name: Certify MTG Multilingual Production Writer V1

on:
  push:
    branches:
      - multilingual-mtg-v1
    paths:
      - 'backend/app/scripts/apply_mtg_multilingual_production_v1.py'
      - 'backend/app/scripts/postflight_mtg_multilingual_production_v1.py'
      - 'backend/app/scripts/preflight_mtg_multilingual_production_v1.py'
      - 'backend/app/scripts/prepare_mtg_multilingual_certified_snapshot_v1.py'
      - 'backend/app/scripts/validate_mtg_multilingual_source_fidelity_v1.py'
      - 'backend/app/scripts/seed_mtg_multilingual_ephemeral_lean_v1.py'
      - 'backend/app/scripts/mtg_multilingual_certified_manifest_v1.json'
      - '.github/workflows/certify-mtg-multilingual-production-writer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtg-multilingual-production-writer-certification-v1
  cancel-in-progress: true

jobs:
  certify-atomic-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dontripit_atomic_writer_cert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dontripit_atomic_writer_cert"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      EPHEMERAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_atomic_writer_cert
      APPLY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_atomic_writer_cert
      POSTFLIGHT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_atomic_writer_cert
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_atomic_writer_cert
      PYTHONPATH: .

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact writer commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile exact production writer path
        run: |
          python -m py_compile \
            app/scripts/apply_mtg_multilingual_production_v1.py \
            app/scripts/postflight_mtg_multilingual_production_v1.py \
            app/scripts/preflight_mtg_multilingual_production_v1.py \
            app/scripts/prepare_mtg_multilingual_certified_snapshot_v1.py \
            app/scripts/validate_mtg_multilingual_source_fidelity_v1.py \
            app/scripts/seed_mtg_multilingual_ephemeral_lean_v1.py

      - name: Migrate clean ephemeral PostgreSQL
        run: alembic upgrade head

      - name: Seed guarded lean clone from production read-only
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from app.scripts.seed_mtg_multilingual_ephemeral_lean_v1 import seed_ephemeral_lean

          production = os.getenv('PRODUCTION_DATABASE_URL_UNPOOLED') or os.getenv('PRODUCTION_DATABASE_URL')
          target = os.environ['EPHEMERAL_DATABASE_URL']
          assert production and production != target
          report = seed_ephemeral_lean(production, target)
          Path('/tmp/mtg-writer-seed.json').write_text(json.dumps(report, indent=2, default=str) + '\n')
          assert report['production_transaction_read_only'] is True, report
          assert report['lean_clone'] is True, report
          assert report['economics_copied'] is False, report
          PY

      - name: Replay exact certified Scryfall snapshot
        run: |
          python -m app.scripts.prepare_mtg_multilingual_certified_snapshot_v1 \
            --snapshot /tmp/mtg-certified-scryfall.jsonl \
            --meta /tmp/mtg-certified-scryfall-meta.json

      - name: Execute exact atomic writer on ephemeral clone
        run: |
          python -m app.scripts.apply_mtg_multilingual_production_v1 \
            --snapshot /tmp/mtg-certified-scryfall.jsonl \
            --mode ephemeral-certification \
            --output /tmp/mtg-atomic-writer-apply.json

      - name: Independent read-only postflight after commit
        run: |
          python -m app.scripts.postflight_mtg_multilingual_production_v1 \
            --snapshot /tmp/mtg-certified-scryfall.jsonl \
            --apply-report /tmp/mtg-atomic-writer-apply.json \
            --output /tmp/mtg-atomic-writer-postflight.json

      - name: Enforce exact writer certification gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('/tmp/mtg-certified-scryfall-meta.json').read_text())
          apply = json.loads(Path('/tmp/mtg-atomic-writer-apply.json').read_text())
          post = json.loads(Path('/tmp/mtg-atomic-writer-postflight.json').read_text())

          assert source['status'] == 'pass', source
          assert source['certification_run_id'] == 31891077971, source
          assert source['snapshot_sha256'] == '744e09b735e63b697008cd5e4b52062857661a212be2cdf188f72fda9a67f8f7', source

          assert apply['status'] == 'pass', apply
          assert apply['mode'] == 'ephemeral-certification', apply
          assert apply['atomic_transaction'] is True, apply
          assert apply['committed'] is True, apply
          assert apply['writes']['prints_created_es'] == 88198, apply
          assert apply['writes']['prints_created_ja'] == 103860, apply
          assert apply['writes']['print_attributes_created'] == 192058, apply
          assert apply['writes']['print_images_created'] == 194121, apply
          assert apply['writes']['print_localizations_created'] == 194140, apply
          assert apply['writes'].get('print_identifiers_created', 0) == 0, apply
          assert apply['precommit']['status'] == 'pass', apply
          assert apply['precommit']['protected_digests_unchanged'] is True, apply
          assert apply['precommit']['source_fidelity']['counts']['exact_es'] == 89405, apply
          assert apply['precommit']['source_fidelity']['counts']['exact_ja'] == 104735, apply

          assert post['status'] == 'pass', post
          assert post['mode'] == 'independent-read-only-postflight', post
          assert post['transaction_read_only'] is True, post
          assert post['database_writes'] == 0, post
          assert post['final']['languages'] == {'es': 89405, 'ja': 104735}, post
          assert post['final']['total_mtg_prints'] == 353202, post
          assert post['final']['target_localizations'] == 194140, post
          assert post['final']['natural_duplicates'] == 0, post
          assert post['final']['duplicate_scryfall_finish_identities'] == 0, post
          assert post['final']['missing_scryfall_ids'] == 0, post
          assert post['final']['auxiliary_scryfall_print_identifiers'] == 0, post
          assert post['final']['protected_digests_unchanged'] is True, post
          assert post['final']['source_fidelity']['counts']['exact_es'] == 89405, post
          assert post['final']['source_fidelity']['counts']['exact_ja'] == 104735, post
          print('atomic production writer certification: PASS')
          PY

      - name: Upload exact writer certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-multilingual-production-writer-certification-${{ github.run_id }}
          path: |
            /tmp/mtg-writer-seed.json
            /tmp/mtg-certified-scryfall-meta.json
            /tmp/mtg-atomic-writer-apply.json
            /tmp/mtg-atomic-writer-postflight.json
          retention-days: 90
          if-no-files-found: warn
