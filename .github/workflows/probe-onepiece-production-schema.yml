name: Probe One Piece Production Schema

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/probe-onepiece-production-schema.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Inspect catalog attribute and image schema
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
            c.execute("""
              SELECT table_name,column_name,data_type
              FROM information_schema.columns
              WHERE table_schema='public' AND (
                table_name LIKE '%attribute%' OR table_name LIKE '%image%' OR table_name LIKE '%search%'
              ) ORDER BY table_name,ordinal_position
            """)
            print('SCHEMA',json.dumps([dict(x) for x in c.fetchall()],indent=2,default=str))
            for table in ['card_attributes','print_attributes','print_images','search_documents']:
              c.execute("SELECT to_regclass(%s) name",(table,)); exists=c.fetchone()['name']
              if not exists: continue
              try:
                c.execute(f'SELECT * FROM {table} LIMIT 3')
                print('SAMPLE',table,json.dumps([dict(x) for x in c.fetchall()],indent=2,default=str))
              except Exception as e:
                conn.rollback(); print('ERR',table,repr(e))
          conn.close()
          PY
