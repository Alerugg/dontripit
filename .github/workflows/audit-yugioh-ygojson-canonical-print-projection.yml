name: Audit Yu-Gi-Oh YGOJSON canonical print projection

on:
  workflow_dispatch:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - backend/app/scripts/audit_yugioh_ygojson_canonical_print_projection.py
      - .github/workflows/audit-yugioh-ygojson-canonical-print-projection.yml

permissions:
  contents: read

concurrency:
  group: audit-yugioh-ygojson-canonical-print-projection-${{ github.ref }}
  cancel-in-progress: false

env:
  YGOJSON_URL: https://github.com/iconmaster5326/YGOJSON/releases/download/v1/aggregate.zip
  PYTHONPATH: .

jobs:
  canonical-print-projection:
    name: Source-only release-aware canonical print projection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: multilingual-ygo-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Download immutable historical YGOJSON aggregate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ygo-canonical-projection/extracted" artifacts
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/ygo-canonical-projection/aggregate.zip" "$YGOJSON_URL"
          unzip -q "$RUNNER_TEMP/ygo-canonical-projection/aggregate.zip" -d "$RUNNER_TEMP/ygo-canonical-projection/extracted"

      - name: Project exact historical rows to canonical Prints and Releases
        shell: bash
        run: |
          set -euo pipefail
          python -m app.scripts.audit_yugioh_ygojson_canonical_print_projection \
            --input-dir "$RUNNER_TEMP/ygo-canonical-projection/extracted" \
            --report ../artifacts/yugioh-ygojson-canonical-print-projection.json

      - name: Enforce canonical projection gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../artifacts/yugioh-ygojson-canonical-print-projection.json').read_text())
          if not r['gate_pass']:
              raise SystemExit('YGOJSON canonical Print projection gate failed')
          print(json.dumps({
              'gate_pass': r['gate_pass'],
              'gates': r['gates'],
              'cross_language_source_uuid_reuse_count': r['cross_language_source_uuid_reuse_count'],
              'es': {k:v for k,v in r['targets']['es'].items() if not k.endswith('_samples')},
              'ja': {k:v for k,v in r['targets']['ja'].items() if not k.endswith('_samples')},
          }, indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-ygojson-canonical-print-projection
          path: artifacts/yugioh-ygojson-canonical-print-projection.json
          if-no-files-found: warn
          retention-days: 30
