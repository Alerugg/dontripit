name: RETIRED - One Piece Explicit Crosswalk Global

# RETIRED 2026-08-11 after physical-version integrity audit.
# The secondary one-piece.cards crosswalk can identify a collector/variant tuple
# but does not independently prove the exact Bandai physical release represented
# by a Cardmarket reprint product. It previously produced the wrong mapping
# 44257 -> 749435 (Winner Cards) instead of the correct Pillars of Strength
# product 720061. The accepted subset has since been revalidated by the
# independent Bandai CatalogRelease/PrintRelease -> standard-English Cardmarket
# expansion gate. This historical writer must never be able to resurrect the
# quarantined rows.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "RETIRED: secondary global crosswalk is not sufficient proof of a Cardmarket physical reprint."
          echo "Use apply-onepiece-cardmarket-physical-release-gate-v2.yml or a stricter official-release mapper."
          exit 1
