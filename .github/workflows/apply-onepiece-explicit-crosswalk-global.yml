name: Apply One Piece Explicit Crosswalk Global

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/apply-onepiece-explicit-crosswalk-global.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Download certified global dry-run
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9076822162/zip > /tmp/op-global.zip
          mkdir -p /tmp/op-global
          unzip -q /tmp/op-global.zip -d /tmp/op-global
          test -s /tmp/op-global/onepiece-explicit-crosswalk-global.json
      - name: Revalidate all candidates and apply only exact one-to-one links
        working-directory: backend
        run: |
          python - <<'PY'
          import json,os,re
          from collections import Counter
          from pathlib import Path
          from urllib.parse import quote
          import psycopg2
          from psycopg2.extras import Json,RealDictCursor,execute_values

          AUDIT=Path('/tmp/op-global/onepiece-explicit-crosswalk-global.json')
          METHOD='op_variant_cm_global_exact'
          report={'mode':'apply_certified_global','status':'started'}
          try:
            audit=json.loads(AUDIT.read_text(encoding='utf-8'))
            if audit.get('mode')!='dry_run_global': raise AssertionError('wrong audit mode')
            if int(audit.get('safe_one_to_one_pairs') or 0)!=3093 or int(audit.get('candidate_pairs') or 0)!=3093:
              raise AssertionError({'unexpected_safe_counts':{k:audit.get(k) for k in ('candidate_pairs','safe_one_to_one_pairs')}})
            if int(audit.get('canonical_en_prints') or 0)!=4672:
              raise AssertionError({'canonical_en_prints':audit.get('canonical_en_prints')})

            candidates=[]
            for row in audit.get('details') or []:
              if row.get('result')!='candidate': continue
              candidates.append({
                'source_id':str(row['source_id']),
                'source_url':str(row['source_url']),
                'collector':str(row['collector']).upper(),
                'variant':str(row.get('variant') or 'default').lower(),
                'print_id':int(row['print_id']),
                'external_product_id':int(row['external_product_id']),
                'cardmarket_id':str(row['cardmarket_id']),
                'cardmarket_name':row.get('cardmarket_name'),
                'set_code':str(row.get('set_code') or '').lower(),
              })
            if len(candidates)!=3093: raise AssertionError({'candidate_rows':len(candidates)})
            if len({c['print_id'] for c in candidates})!=3093: raise AssertionError('duplicate print claims')
            if len({c['external_product_id'] for c in candidates})!=3093: raise AssertionError('duplicate product claims')
            if len({c['cardmarket_id'] for c in candidates})!=3093: raise AssertionError('duplicate Cardmarket ids')

            print_ids=[c['print_id'] for c in candidates]; product_ids=[c['external_product_id'] for c in candidates]
            conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL']); conn.autocommit=False
            try:
              with conn.cursor(cursor_factory=RealDictCursor) as cur:
                cur.execute("SELECT id FROM games WHERE slug='onepiece'"); gid=int(cur.fetchone()['id'])
                cur.execute("SELECT max(last_seen_at) latest FROM external_catalog_products WHERE source='cardmarket'"); latest=cur.fetchone()['latest']
                if latest is None: raise AssertionError('no current Cardmarket snapshot')

                cur.execute('''
                  SELECT p.id print_id,p.collector_number,p.variant,p.language,c.game_id,c.name card_name,s.code set_code
                  FROM prints p JOIN cards c ON c.id=p.card_id JOIN sets s ON s.id=p.set_id
                  WHERE p.id=ANY(%s)
                ''',(print_ids,)); prints={int(r['print_id']):dict(r) for r in cur.fetchall()}
                if len(prints)!=3093: raise AssertionError({'canonical_rows':len(prints)})

                cur.execute('''
                  SELECT id external_product_id,external_id,game_id,product_group,name,expansion_external_id,last_seen_at,website_path
                  FROM external_catalog_products WHERE source='cardmarket' AND id=ANY(%s)
                ''',(product_ids,)); products={int(r['external_product_id']):dict(r) for r in cur.fetchall()}
                if len(products)!=3093: raise AssertionError({'market_rows':len(products)})

                collector_re=re.compile(r'\(((?:OP|ST|EB|PRB)\d{1,2}-\d{3}|P-\d{3})\)\s*$',re.I)
                errors=[]
                for c in candidates:
                  p=prints[c['print_id']]; e=products[c['external_product_id']]
                  match=collector_re.search(str(e.get('name') or '')); market_collector=match.group(1).upper() if match else None
                  checks={
                    'game':int(p['game_id'])==gid and int(e['game_id'])==gid,
                    'language':str(p.get('language') or '').lower()=='en',
                    'collector':str(p['collector_number']).upper()==c['collector']==market_collector,
                    'variant':str(p.get('variant') or 'default').lower()==c['variant'],
                    'set_code':str(p.get('set_code') or '').lower()==c['set_code'],
                    'single':e.get('product_group')=='single',
                    'current':e.get('last_seen_at')==latest,
                    'cardmarket_id':str(e.get('external_id'))==c['cardmarket_id'],
                  }
                  if not all(checks.values()): errors.append({'candidate':c,'checks':checks,'print':p,'product':e})
                if errors: raise AssertionError({'validation_errors':errors[:20],'count':len(errors)})

                # Recheck global conflict state immediately before the write.
                cur.execute('''
                  SELECT l.external_product_id,l.print_id,l.mapping_method,l.confidence,l.link_status
                  FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                  WHERE e.source='cardmarket' AND e.game_id=%s AND l.link_status IN ('accepted','mapped','exact')
                    AND (l.print_id=ANY(%s) OR l.external_product_id=ANY(%s))
                ''',(gid,print_ids,product_ids)); existing=[dict(r) for r in cur.fetchall()]
                expected_by_print={c['print_id']:c['external_product_id'] for c in candidates}; expected_by_product={c['external_product_id']:c['print_id'] for c in candidates}
                conflicts=[]
                for r in existing:
                  pid=int(r['print_id']); eid=int(r['external_product_id'])
                  if pid in expected_by_print and expected_by_print[pid]!=eid: conflicts.append({'kind':'print_conflict',**r})
                  if eid in expected_by_product and expected_by_product[eid]!=pid: conflicts.append({'kind':'product_conflict',**r})
                if conflicts: raise AssertionError({'conflicts':conflicts[:30],'count':len(conflicts)})

                values=[]
                for c in candidates:
                  evidence={
                    'source':'one-piece.cards','source_kind':'secondary_explicit_crosswalk','source_variant_id':c['source_id'],'source_url':c['source_url'],
                    'cardmarket_id_product':c['cardmarket_id'],'collector_number':c['collector'],'canonical_variant':c['variant'],'canonical_set_code':c['set_code'],
                    'certified_audit_run_id':31424881435,
                    'validation':['semantic_variant_id_exact','collector_exact','canonical_variant_exact','current_cardmarket_product','global_one_to_one','no_existing_conflict'],
                  }
                  values.append((c['external_product_id'],c['print_id'],METHOD,'exact','accepted',False,Json(evidence)))
                execute_values(cur,'''INSERT INTO external_catalog_print_links(external_product_id,print_id,mapping_method,confidence,link_status,reviewed,evidence) VALUES %s
                  ON CONFLICT(external_product_id,print_id) DO UPDATE SET mapping_method=EXCLUDED.mapping_method,confidence=EXCLUDED.confidence,link_status=EXCLUDED.link_status,evidence=EXCLUDED.evidence,updated_at=now()''',values,page_size=1000)

                cur.execute('''SELECT count(*) links,count(DISTINCT print_id) prints,count(DISTINCT external_product_id) products FROM external_catalog_print_links
                  WHERE mapping_method=%s AND link_status='accepted' AND print_id=ANY(%s)''',(METHOD,print_ids)); stored=dict(cur.fetchone())
                if tuple(int(stored[k]) for k in ('links','prints','products'))!=(3093,3093,3093): raise AssertionError({'stored':stored})

                cur.execute('''SELECT count(DISTINCT l.print_id) priced FROM external_catalog_print_links l JOIN external_market_price_snapshots mp ON mp.external_product_id=l.external_product_id
                  WHERE l.mapping_method=%s AND l.link_status='accepted' AND l.print_id=ANY(%s) AND mp.currency='EUR' AND mp.price_variant='nonfoil'
                    AND COALESCE(mp.price_mid,mp.price_market,mp.price_last,mp.price_low) IS NOT NULL''',(METHOD,print_ids)); priced=int(cur.fetchone()['priced'])
                cur.execute('''SELECT count(DISTINCT l.print_id) mapped FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN prints p ON p.id=l.print_id JOIN cards c ON c.id=p.card_id WHERE e.source='cardmarket' AND c.game_id=%s AND lower(p.language)='en' AND l.link_status IN ('accepted','mapped','exact')''',(gid,)); total_mapped=int(cur.fetchone()['mapped'])
                report.update({'status':'validated_and_applied','inserted_exact_links':3093,'stored':{k:int(v) for k,v in stored.items()},'priced_among_new_links':priced,'total_onepiece_en_mapped_after_apply':total_mapped,'canonical_en_prints':4672})
              conn.commit()
            except Exception:
              conn.rollback(); raise
            finally: conn.close()
          except Exception as exc:
            report.update({'status':'failed','error':repr(exc)})
            Path('/tmp/onepiece-explicit-crosswalk-global-apply.json').write_text(json.dumps(report,indent=2,default=str)+'\n'); print(json.dumps(report,indent=2,default=str)); raise
          Path('/tmp/onepiece-explicit-crosswalk-global-apply.json').write_text(json.dumps(report,indent=2,default=str)+'\n'); print(json.dumps(report,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-explicit-crosswalk-global-apply-${{ github.run_id }}
          path: /tmp/onepiece-explicit-crosswalk-global-apply.json
          retention-days: 90
