name: Fix promos and DON search E2E v1

on:
  push:
    branches:
      - fix/promos-don-search-e2e-v1
    paths:
      - .github/workflows/fix-promos-don-e2e-v1.yml
      - .github/scripts/fix_promos_don_e2e_v1.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/promos-don-search-e2e-v1
          fetch-depth: 0

      - name: Apply promo and DON search patch
        run: python .github/scripts/fix_promos_don_e2e_v1.py

      - name: Verify patch cleanliness
        run: |
          git diff --check
          git status --short

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Test promo normalization
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_onepiece_promo_query_normalization.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test promo and DON frontend contracts
        working-directory: frontend
        run: |
          node --test tests/promos-don-search-contract.test.mjs
          node --check app/api/catalog/search/route.js
          node --check app/api/search-v2/don/route.js
          node --check app/api/search-v2/don/suggest/route.js

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend/tests
          if git diff --cached --quiet; then
            echo "No functional changes to commit"
            exit 0
          fi
          git commit -m "fix(search): restore exact promos and wire One Piece DON filter"
          git push origin HEAD:fix/promos-don-search-e2e-v1
