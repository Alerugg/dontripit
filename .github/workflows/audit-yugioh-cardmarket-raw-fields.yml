name: Audit YGO Cardmarket Raw Identity Fields

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-yugioh-cardmarket-raw-fields.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Inventory raw JSON keys and values on linked vs unlinked YGO singles
        run: |
          python - <<'PY'
          import json,os
          from collections import Counter,defaultdict
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='yugioh' LIMIT 1");gid=int(cur.fetchone()['id'])
              cur.execute("SELECT max(last_seen_at) latest FROM external_catalog_products WHERE source='cardmarket'");latest=cur.fetchone()['latest']
              cur.execute('''SELECT e.id,e.external_id,e.name,e.expansion_external_id,e.metacard_external_id,e.category,e.website_path,e.raw_json,
                EXISTS(SELECT 1 FROM external_catalog_print_links l WHERE l.external_product_id=e.id AND l.link_status IN ('accepted','mapped','exact') AND l.confidence='exact') is_linked
                FROM external_catalog_products e WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND e.last_seen_at=%s''',(gid,latest))
              rows=[dict(r) for r in cur.fetchall()]
            key_counts=Counter();linked_key_counts=Counter();unlinked_key_counts=Counter();types=defaultdict(Counter);samples=[]
            for r in rows:
              raw=r['raw_json'] or {}
              if not isinstance(raw,dict):continue
              for k,v in raw.items():
                key_counts[k]+=1;(linked_key_counts if r['is_linked'] else unlinked_key_counts)[k]+=1;types[k][type(v).__name__]+=1
              if not r['is_linked'] and len(samples)<40:
                samples.append({'idProduct':r['external_id'],'name':r['name'],'expansion_external_id':r['expansion_external_id'],'metacard_external_id':r['metacard_external_id'],'website_path':r['website_path'],'raw_json':raw})
            # candidate identity-like fields: names suggesting number, rarity, version, edition, language, foil, variant, code, set.
            needles=('number','num','rar','version','edition','lang','foil','variant','code','set','expansion','metacard','product')
            identity_keys=[k for k in key_counts if any(n in k.casefold() for n in needles)]
            identity_values={}
            for k in identity_keys:
              vals=Counter()
              for r in rows:
                raw=r['raw_json'] or {}
                if isinstance(raw,dict) and k in raw and raw[k] not in (None,'',[],{}):vals[str(raw[k])[:160]]+=1
              identity_values[k]={'nonempty_distinct':len(vals),'top_values':vals.most_common(15)}
            report={'game':'yugioh','latest_cardmarket_snapshot':str(latest),'single_rows':len(rows),'linked_rows':sum(1 for r in rows if r['is_linked']),'unlinked_rows':sum(1 for r in rows if not r['is_linked']),
              'raw_key_counts':dict(key_counts),'raw_key_types':{k:dict(v) for k,v in types.items()},'identity_like_keys':identity_keys,'identity_like_values':identity_values,'unlinked_sample':samples}
            summary={k:v for k,v in report.items() if k!='unlinked_sample'}
            Path('/tmp/ygo-cardmarket-raw-fields.json').write_text(json.dumps(report,indent=2,default=str)+'\n');Path('/tmp/ygo-cardmarket-raw-fields-summary.json').write_text(json.dumps(summary,indent=2,default=str)+'\n');print(json.dumps(summary,indent=2,default=str))
          finally:conn.close()
          PY
      - name: Persist summary
        run: |
          mkdir -p audit-reports
          cp /tmp/ygo-cardmarket-raw-fields-summary.json audit-reports/yugioh-cardmarket-raw-fields-summary.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/yugioh-cardmarket-raw-fields-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update YGO Cardmarket raw identity field audit"
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-cardmarket-raw-fields-${{ github.run_id }}
          path: /tmp/ygo-cardmarket-raw-fields.json
          retention-days: 90
