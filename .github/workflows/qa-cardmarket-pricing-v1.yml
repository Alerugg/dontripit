name: QA Cardmarket Pricing V1

on:
  push:
    branches:
      - cardmarket-pricing-v1
    paths:
      - 'backend/app/jobs/cardmarket_prices.py'
      - 'backend/scripts/import_cardmarket_prices.py'
      - 'backend/tests/test_cardmarket_prices.py'
      - '.github/workflows/qa-cardmarket-pricing-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Compile pricing importer
        working-directory: backend
        run: python -m compileall -q app/jobs/cardmarket_prices.py scripts/import_cardmarket_prices.py
      - name: Run Cardmarket pricing regression tests
        working-directory: backend
        env:
          API_KEY_REQUIRED: 'false'
        run: pytest -q tests/test_cardmarket_prices.py --tb=short
