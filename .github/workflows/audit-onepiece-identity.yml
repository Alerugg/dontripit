name: Audit One Piece Canonical Identity

on:
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/scripts/audit_onepiece_identity.py'
      - '.github/workflows/audit-onepiece-identity.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit One Piece logical card identity without writes
        run: |
          set -o pipefail
          python -u -m app.scripts.audit_onepiece_identity | tee onepiece-identity-audit.json

      - name: Print compact identity summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('onepiece-identity-audit.json')
          if path.exists():
              payload = json.loads(path.read_text())
              print(json.dumps(payload.get('counts'), indent=2))
          PY

      - name: Upload identity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onepiece-identity-audit-${{ github.sha }}
          path: backend/onepiece-identity-audit.json
          retention-days: 30
          if-no-files-found: warn
