name: Audit Fictional Production Data

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-fictional-production-data.yml'
      - 'backend/scripts/audit_fictional_production_data.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install psycopg2-binary==2.9.9
      - name: Compile read-only audit
        run: python -m py_compile scripts/audit_fictional_production_data.py
      - name: Audit production for fictional residue
        run: python scripts/audit_fictional_production_data.py --report /tmp/fictional-production-data.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-production-data-${{ github.run_id }}
          path: /tmp/fictional-production-data.json
          retention-days: 90
          if-no-files-found: warn
