name: Audit Fictional Production Data

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-fictional-production-data.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Inspect canonical and user-facing tables for demo/test residue
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          suspicious=re.compile(r'(^|[^a-z])(demo|dummy|fake|fixture|lorem|placeholder|example|sample|test)([^a-z]|$)',re.I)
          table_columns={
            'games':['slug','name'],
            'sets':['code','name'],
            'cards':['card_key','name'],
            'prints':['print_key','collector_number','variant'],
            'products':['name','product_type'],
            'product_variants':['sku','language','region'],
            'catalog_releases':['external_id','name','source'],
            'print_identifiers':['source','external_id'],
            'product_identifiers':['source','external_id'],
            'external_catalog_products':['source','external_id','name','category','website_path'],
          }

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          report={'scanned':{},'suspicious_rows':{},'user_test_residue':[]}
          with conn,conn.cursor(cursor_factory=RealDictCursor) as cur:
            cur.execute("SELECT table_name,column_name FROM information_schema.columns WHERE table_schema='public'")
            available={}
            for row in cur.fetchall(): available.setdefault(row['table_name'],set()).add(row['column_name'])

            for table,columns in table_columns.items():
              cols=[c for c in columns if c in available.get(table,set())]
              if not cols: continue
              select_cols=['id'] if 'id' in available.get(table,set()) else []
              select_cols+=cols
              cur.execute(f"SELECT {','.join(select_cols)} FROM {table}")
              rows=[dict(r) for r in cur.fetchall()]
              hits=[]
              for row in rows:
                matched=[]
                for col in cols:
                  value=row.get(col)
                  if value is not None and suspicious.search(str(value)):
                    matched.append({'column':col,'value':str(value)[:500]})
                if matched: hits.append({'row':row,'matches':matched})
              report['scanned'][table]={'rows':len(rows),'columns':cols,'suspicious':len(hits)}
              if hits: report['suspicious_rows'][table]=hits[:100]

            # Test identities should be cleaned by live E2E workflows. Report any obvious residue.
            if 'users' in available and 'email' in available['users']:
              cur.execute("SELECT id,email,created_at FROM users WHERE lower(email) LIKE '%%resend.dev' OR lower(email) LIKE '%%example.com' OR lower(email) LIKE '%%test%%' ORDER BY created_at DESC NULLS LAST LIMIT 200")
              report['user_test_residue']=[dict(r) for r in cur.fetchall()]
          conn.close()

          report['suspicious_total']=sum(v['suspicious'] for v in report['scanned'].values())
          report['test_user_total']=len(report['user_test_residue'])
          print(json.dumps(report,indent=2,ensure_ascii=False,default=str))
          Path('/tmp/fictional-production-data.json').write_text(json.dumps(report,indent=2,ensure_ascii=False,default=str)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-production-data-${{ github.run_id }}
          path: /tmp/fictional-production-data.json
          retention-days: 90
