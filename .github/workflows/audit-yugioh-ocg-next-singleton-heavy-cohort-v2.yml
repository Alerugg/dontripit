name: Audit Yu-Gi-Oh OCG Next Singleton Heavy Cohort V2

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_next_singleton_heavy_cohort_v2.py'
      - '.github/workflows/audit-yugioh-ocg-next-singleton-heavy-cohort-v2.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_SINGLETON_HEAVY_COHORT_OUTPUT: /tmp/ygo-next-singleton-heavy-v2/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile next-cohort wrapper
        run: python -m py_compile app/scripts/audit_yugioh_ocg_next_singleton_heavy_cohort_v2.py
      - name: READ ONLY screen 26 current untouched high-yield surfaces
        run: |
          mkdir -p /tmp/ygo-next-singleton-heavy-v2
          python -m app.scripts.audit_yugioh_ocg_next_singleton_heavy_cohort_v2
      - name: Require safe partition output
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-next-singleton-heavy-v2/report.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['screened_targets']==26,p
          assert p['certified_singleton_pairs']>0,p
          assert p['certified_targets']+p['rejected_targets']==26,p
          print(json.dumps({
            'screened':p['screened_targets'],
            'certified_targets':p['certified_targets'],
            'rejected_targets':p['rejected_targets'],
            'safe_singletons':p['certified_singleton_pairs'],
            'variant_groups':len(p['variant_residual_groups']),
            'identity_sha256':p['stable_singleton_identity_sha256'],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-next-singleton-heavy-cohort-v2-${{ github.run_id }}
          path: /tmp/ygo-next-singleton-heavy-v2/report.json
          retention-days: 90
          if-no-files-found: error
