name: Daily Catalog V2 Orchestrator

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-catalog-v2-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs allow at most 360 minutes. The previous 180-minute
    # ceiling and fixed 60-minute child wait could terminate a healthy child
    # before its own certified timeout (Pokemon now permits 90 minutes).
    timeout-minutes: 360
    env:
      # GitHub schedules only the default-branch workflow. Production catalog
      # work lives on catalog-v2, so never derive this target from github.ref_name.
      TARGET_REF: catalog-v2
    steps:
      - name: Dispatch the production children sequentially
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetRef = process.env.TARGET_REF;
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            // This default-branch workflow owns the daily schedule, while every
            // production child executes the exact catalog-v2 ref. Riftbound remains excluded.
            // MTG canonical source writes remain deliberately excluded until the
            // finish-aware incremental writer is certified. Cardmarket MTG catalog,
            // exact accepted links and canonical prices remain refreshed below.
            // Search latency is the final read-only customer-retention gate.
            //
            // waitMinutes is deliberately derived from each child's own job ceiling,
            // plus bounded queue/cleanup headroom. The parent still fails closed at
            // GitHub's 360-minute job ceiling; it no longer imposes a shorter generic
            // 60-minute deadline on a healthy long-running child.
            const pipeline = [
              ['refresh-onepiece-yugioh-canonical-v2.yml', 'One Piece and Yu-Gi-Oh canonical refresh', 110],
              ['refresh-pokemon-canonical-v2.yml', 'Pokemon canonical EN ES JA physical refresh', 105],
              ['sync-cardmarket-master-production-v2.yml', 'Cardmarket multigame master', 60],
              ['project-cardmarket-canonical-prices-v2.yml', 'Cardmarket exact canonical singles and sealed prices', 60],
              ['sync-cardmarket-website-paths.yml', 'Cardmarket official website paths', 25],
              ['sync-regional-tcg-content.yml', 'Regional official news and releases', 45],
              ['certify-search-v2-production-latency-v1.yml', 'Search V2 production latency and result quality', 25],
            ];

            async function api(label, fn, attempts = 6) {
              let last;
              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                try {
                  return await fn();
                } catch (error) {
                  last = error;
                  const status = Number(error?.status || 0);
                  const retryable = !status || status === 409 || status === 429 || status >= 500;
                  if (!retryable || attempt === attempts) throw error;
                  const waitMs = Math.min(30000, 1500 * (2 ** (attempt - 1)));
                  core.warning(`${label} failed (${attempt}/${attempts}, status ${status || 'transport'}); retrying in ${waitMs}ms`);
                  await sleep(waitMs);
                }
              }
              throw last;
            }

            async function branchSha() {
              const response = await api('resolve target branch', () => github.rest.repos.getBranch({
                owner,
                repo,
                branch: targetRef,
              }));
              return response.data.commit.sha;
            }

            async function resolveRun(workflowId, expectedSha, dispatchedAt) {
              for (let attempt = 1; attempt <= 90; attempt += 1) {
                const response = await api(`list runs ${workflowId}`, () => github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  branch: targetRef,
                  event: 'workflow_dispatch',
                  per_page: 30,
                }));
                const lowerBound = dispatchedAt - 15000;
                const candidates = response.data.workflow_runs
                  .filter(run => run.head_branch === targetRef)
                  .filter(run => run.head_sha === expectedSha)
                  .filter(run => Date.parse(run.created_at) >= lowerBound)
                  .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
                if (candidates.length) return candidates[0];
                await sleep(4000);
              }
              throw new Error(`Could not resolve dispatched run for ${workflowId} at ${expectedSha}`);
            }

            async function waitForRun(workflowId, runId, waitMinutes) {
              const deadline = Date.now() + waitMinutes * 60 * 1000;
              while (Date.now() < deadline) {
                const response = await api(`get run ${runId}`, () => github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: runId,
                }));
                if (response.data.status === 'completed') return response.data;
                await sleep(10000);
              }
              throw new Error(`${workflowId} run ${runId} exceeded its ${waitMinutes}-minute orchestrator wait budget`);
            }

            const summary = [];
            for (const [workflowId, label, waitMinutes] of pipeline) {
              const expectedSha = await branchSha();
              const dispatchedAt = Date.now();
              core.startGroup(`${label} (${workflowId})`);
              await api(`dispatch ${workflowId}`, () => github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: targetRef,
              }));
              const resolved = await resolveRun(workflowId, expectedSha, dispatchedAt);
              const completed = await waitForRun(workflowId, resolved.id, waitMinutes);
              const row = {
                workflow: workflowId,
                run_id: completed.id,
                conclusion: completed.conclusion,
                head_sha: completed.head_sha,
                wait_budget_minutes: waitMinutes,
              };
              summary.push(row);
              core.info(JSON.stringify(row));
              core.endGroup();
              if (completed.conclusion !== 'success') {
                core.setFailed(`${label} failed in run ${completed.id}: ${completed.conclusion}`);
                break;
              }
            }

            await core.summary
              .addHeading('Daily Catalog V2')
              .addTable([
                [{data: 'Workflow', header: true}, {data: 'Run', header: true}, {data: 'Conclusion', header: true}, {data: 'Wait budget (min)', header: true}],
                ...summary.map(row => [row.workflow, String(row.run_id), String(row.conclusion), String(row.wait_budget_minutes)]),
              ])
              .write();

            if (summary.length !== pipeline.length || summary.some(row => row.conclusion !== 'success')) {
              throw new Error('Daily catalog pipeline did not complete successfully');
            }
