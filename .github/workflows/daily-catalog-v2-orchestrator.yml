name: Daily Catalog V2 Orchestrator

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/daily-catalog-v2-orchestrator.yml']

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-catalog-v2-orchestrator
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Dispatch certified catalog-v2 pipeline sequentially
        uses: actions/github-script@v7
        env:
          TARGET_REF: catalog-v2
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetRef = process.env.TARGET_REF;
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            const pipeline = [
              ['sync-cardmarket-mvp-daily.yml', 'Cardmarket mirror and price guide'],
              ['apply-mtg-cardmarket-direct-links.yml', 'MTG exact mapping'],
              ['apply-pokemon-cardmarket-direct-links.yml', 'Pokemon exact mapping'],
              ['apply-yugioh-cardmarket-exact-singles.yml', 'Yu-Gi-Oh exact mapping'],
              ['apply-onepiece-cardmarket-release-exact-singles.yml', 'One Piece exact mapping'],
              ['project-mtg-cardmarket-prices.yml', 'MTG prices'],
              ['project-pokemon-cardmarket-prices.yml', 'Pokemon prices'],
              ['project-yugioh-cardmarket-prices.yml', 'Yu-Gi-Oh prices'],
              ['project-onepiece-cardmarket-prices.yml', 'One Piece prices'],
              ['apply-cardmarket-product-catalog-bulk.yml', 'Non-single catalog and prices'],
              ['sync-regional-tcg-content-v4.yml', 'Regional official content'],
              ['repair-canonical-images.yml', 'Exact-source image repair'],
              ['audit-roadmap-1-8-live.yml', 'Roadmap 1-8 audit'],
            ];

            async function api(label, fn, attempts = 6) {
              let last;
              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                try {
                  return await fn();
                } catch (error) {
                  last = error;
                  const status = Number(error?.status || 0);
                  const retryable = !status || status === 409 || status === 429 || status >= 500;
                  if (!retryable || attempt === attempts) throw error;
                  const waitMs = Math.min(30000, 1500 * (2 ** (attempt - 1)));
                  core.warning(`${label} failed (attempt ${attempt}/${attempts}, status ${status || 'transport'}); retrying in ${waitMs}ms: ${error.message}`);
                  await sleep(waitMs);
                }
              }
              throw last;
            }

            async function branchSha() {
              const response = await api('resolve target branch', () => github.rest.repos.getBranch({
                owner, repo, branch: targetRef,
              }));
              return response.data.commit.sha;
            }

            async function resolveRun(workflowId, expectedSha, dispatchedAt) {
              for (let attempt = 1; attempt <= 90; attempt += 1) {
                const response = await api(`list runs ${workflowId}`, () => github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  branch: targetRef,
                  event: 'workflow_dispatch',
                  per_page: 50,
                }));
                const lowerBound = dispatchedAt - 15000;
                const candidates = response.data.workflow_runs
                  .filter(run => run.head_branch === targetRef)
                  .filter(run => run.head_sha === expectedSha)
                  .filter(run => Date.parse(run.created_at) >= lowerBound)
                  .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
                if (candidates.length) return candidates[0];
                await sleep(4000);
              }
              throw new Error(`Could not resolve dispatched run for ${workflowId} at ${expectedSha}`);
            }

            async function waitForRun(workflowId, runId) {
              const deadline = Date.now() + 55 * 60 * 1000;
              while (Date.now() < deadline) {
                const response = await api(`get run ${runId}`, () => github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: runId,
                }));
                const run = response.data;
                if (run.status === 'completed') return run;
                await sleep(10000);
              }
              throw new Error(`${workflowId} run ${runId} exceeded 55 minute wait window`);
            }

            const summary = [];
            for (const [workflowId, label] of pipeline) {
              core.startGroup(`${label} (${workflowId})`);
              const expectedSha = await branchSha();
              const dispatchedAt = Date.now();
              await api(`dispatch ${workflowId}`, () => github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: targetRef,
              }));
              const resolved = await resolveRun(workflowId, expectedSha, dispatchedAt);
              core.info(`Resolved child run ${resolved.id}: ${resolved.html_url}`);
              const completed = await waitForRun(workflowId, resolved.id);
              const row = {
                workflow: workflowId,
                label,
                run_id: completed.id,
                conclusion: completed.conclusion,
                head_sha: completed.head_sha,
                url: completed.html_url,
              };
              summary.push(row);
              core.info(JSON.stringify(row));
              core.endGroup();
              if (completed.conclusion !== 'success') {
                core.setFailed(`${label} failed: child run ${completed.id} concluded ${completed.conclusion}`);
                break;
              }
            }

            await core.summary
              .addHeading('Daily Catalog V2 pipeline')
              .addTable([
                [{data: 'Workflow', header: true}, {data: 'Run', header: true}, {data: 'Conclusion', header: true}],
                ...summary.map(row => [row.workflow, String(row.run_id), String(row.conclusion)]),
              ])
              .write();

            if (summary.length === pipeline.length && summary.every(row => row.conclusion === 'success')) {
              core.info('Certified daily catalog-v2 pipeline completed successfully.');
            }
