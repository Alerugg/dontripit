name: Apply Four Pokémon Cardmarket Mappings 2026-08-09

on:
  push:
    branches:
      - apply-four-cardmarket-pokemon-mappings-2026-08-09
    paths:
      - 'backend/scripts/apply_four_cardmarket_pokemon_mappings.py'
      - '.github/workflows/apply-four-cardmarket-pokemon-mappings-2026-08-09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apply-four-cardmarket-pokemon-mappings-2026-08-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Download current Pokémon Product List
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json \
            -o /tmp/products_pokemon.json
          test -s /tmp/products_pokemon.json
      - name: Revalidate all four identities and apply mappings atomically
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python scripts/apply_four_cardmarket_pokemon_mappings.py --products /tmp/products_pokemon.json --report /tmp/cardmarket-four-mappings.json
      - name: Upload verified apply report
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-four-pokemon-mappings-2026-08-09
          path: /tmp/cardmarket-four-mappings.json
          if-no-files-found: error
          retention-days: 30
