name: Android TWA CI

on:
  workflow_dispatch:
  push:
    branches: [mobile-pwa]
    paths:
      - 'android-twa/**'
      - 'frontend/public/icons/**'
      - '.github/workflows/android-twa-ci.yml'

permissions:
  contents: read

jobs:
  android-twa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate TWA source configuration
        run: |
          node <<'NODE'
          const fs = require('fs')
          const m = JSON.parse(fs.readFileSync('android-twa/twa-manifest.json', 'utf8'))
          const required = ['packageId','host','name','themeColor','themeColorDark','navigationColor','backgroundColor','startUrl','iconUrl','signingKey','splashScreenFadeOutDuration']
          for (const key of required) {
            if (m[key] === undefined || m[key] === null || m[key] === '') throw new Error(`Missing ${key}`)
          }
          if (m.packageId !== 'com.dontripit.app') throw new Error(`Unexpected packageId: ${m.packageId}`)
          if (m.host !== 'dontripit.com') throw new Error(`Unexpected host: ${m.host}`)
          if (m.enableNotifications !== false) throw new Error('Notifications must remain disabled for the initial wrapper')
          if (!m.iconUrl.includes('dontripit-512.png')) throw new Error('512px launcher icon required')
          if (!m.maskableIconUrl?.includes('dontripit-512-maskable.png')) throw new Error('Maskable 512px launcher icon required')
          console.log(`TWA source OK: ${m.packageId} ${m.appVersion} (${m.appVersionCode}) -> https://${m.host}${m.startUrl}`)
          NODE

      - name: Install Bubblewrap 1.25.0
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Decode every configured icon with Bubblewrap Jimp
        run: |
          JIMP_PACKAGE="$(find "$(npm root -g)/@bubblewrap/cli/node_modules" -path '*/jimp/package.json' -print -quit)"
          test -n "$JIMP_PACKAGE"
          export JIMP_DIR="$(dirname "$JIMP_PACKAGE")"
          echo "Using Bubblewrap Jimp from $JIMP_DIR"
          node <<'NODE'
          const fs = require('fs')
          const Jimp = require(process.env.JIMP_DIR)
          const manifest = JSON.parse(fs.readFileSync('android-twa/twa-manifest.json', 'utf8'))
          const candidates = [
            ['launcher', manifest.iconUrl],
            ['maskable', manifest.maskableIconUrl],
            ...((manifest.shortcuts || []).flatMap((s, index) => [
              [`shortcut-${index + 1}`, s.chosenIconUrl],
              [`shortcut-${index + 1}-maskable`, s.chosenMaskableIconUrl],
            ])),
          ].filter(([, url]) => Boolean(url))

          ;(async () => {
            for (const [label, url] of candidates) {
              const response = await fetch(url)
              if (!response.ok) throw new Error(`${label}: HTTP ${response.status} ${url}`)
              const contentType = response.headers.get('content-type') || ''
              const bytes = Buffer.from(await response.arrayBuffer())
              console.log(`${label}: ${contentType} ${bytes.length} bytes ${url}`)
              const image = await Jimp.read(bytes)
              console.log(`${label}: decoded ${image.bitmap.width}x${image.bitmap.height}`)
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Configure Bubblewrap with runner SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT"

          if [ ! -d "$SDK_ROOT/bin" ]; then
            CMDLINE_BIN="$(find "$SDK_ROOT/cmdline-tools" -mindepth 2 -maxdepth 2 -type d -name bin | head -n 1)"
            test -n "$CMDLINE_BIN"
            ln -s "$CMDLINE_BIN" "$SDK_ROOT/bin"
          fi

          mkdir -p "$HOME/.bubblewrap"
          node -e "require('fs').writeFileSync(process.env.HOME + '/.bubblewrap/config.json', JSON.stringify({jdkPath: process.env.JAVA_HOME, androidSdkPath: process.env.ANDROID_HOME || process.env.ANDROID_SDK_ROOT}, null, 2))"
          cat "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Generate Android project
        working-directory: android-twa
        run: bubblewrap update --skipVersionUpgrade

      - name: Verify generated Android identity
        working-directory: android-twa
        run: |
          grep -R "com.dontripit.app" app build.gradle settings.gradle || true
          grep -q "com.dontripit.app" app/build.gradle
          grep -q "dontripit.com" app/build.gradle

      - name: Build unsigned APK and Android App Bundle
        working-directory: android-twa
        run: bubblewrap build --skipPwaValidation --skipSigning

      - name: Inventory Android outputs
        run: |
          find android-twa -type f \( -name '*.aab' -o -name '*.apk' \) -print -exec ls -lh {} \;
          test -n "$(find android-twa -type f -name '*.aab' -print -quit)"

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dontripit-android-twa-unsigned
          path: |
            android-twa/**/*.aab
            android-twa/**/*.apk
          if-no-files-found: error
          retention-days: 7
