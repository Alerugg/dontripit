name: Android TWA CI

on:
  workflow_dispatch:
  push:
    branches: [mobile-pwa]
    paths:
      - 'android-twa/**'
      - 'frontend/public/icons/**'
      - '.github/workflows/android-twa-ci.yml'

permissions:
  contents: read

concurrency:
  group: android-twa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-twa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate TWA source configuration
        run: |
          node <<'NODE'
          const fs = require('fs')
          const m = JSON.parse(fs.readFileSync('android-twa/twa-manifest.json', 'utf8'))
          const required = ['packageId','host','name','themeColor','themeColorDark','navigationColor','backgroundColor','startUrl','iconUrl','signingKey','splashScreenFadeOutDuration']
          for (const key of required) {
            if (m[key] === undefined || m[key] === null || m[key] === '') throw new Error(`Missing ${key}`)
          }
          if (m.packageId !== 'com.dontripit.app') throw new Error(`Unexpected packageId: ${m.packageId}`)
          if (m.host !== 'dontripit.com') throw new Error(`Unexpected host: ${m.host}`)
          if (m.enableNotifications !== false) throw new Error('Notifications must remain disabled for the initial wrapper')
          if (!m.iconUrl.includes('dontripit-512.png')) throw new Error('512px launcher icon required')
          if (!m.maskableIconUrl?.includes('dontripit-512-maskable.png')) throw new Error('Maskable 512px launcher icon required')
          console.log(`TWA source OK: ${m.packageId} ${m.appVersion} (${m.appVersionCode}) -> https://${m.host}${m.startUrl}`)
          NODE

      - name: Validate Digital Asset Links renderer
        run: |
          PLAY_APP_SIGNING_SHA256=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
          UPLOAD_SHA256=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB \
          REQUIRE_PLAY_FINGERPRINT=1 \
          node android-twa/scripts/render-assetlinks.mjs /tmp/assetlinks.json
          node -e "const d=require('/tmp/assetlinks.json'); if(d[0].target.package_name!=='com.dontripit.app'||d[0].target.sha256_cert_fingerprints.length!==2) process.exit(1)"
          ! grep -q '__PLAY_APP_SIGNING_SHA256__\|__LOCAL_OR_UPLOAD_SHA256__' /tmp/assetlinks.json

      - name: Install Bubblewrap 1.25.0
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Decode every configured icon with Bubblewrap Jimp
        run: |
          JIMP_PACKAGE="$(find "$(npm root -g)/@bubblewrap/cli/node_modules" -path '*/jimp/package.json' -print -quit)"
          test -n "$JIMP_PACKAGE"
          export JIMP_DIR="$(dirname "$JIMP_PACKAGE")"
          echo "Using Bubblewrap Jimp from $JIMP_DIR"
          node <<'NODE'
          const fs = require('fs')
          const Jimp = require(process.env.JIMP_DIR)
          const manifest = JSON.parse(fs.readFileSync('android-twa/twa-manifest.json', 'utf8'))
          const candidates = [
            ['launcher', manifest.iconUrl],
            ['maskable', manifest.maskableIconUrl],
            ...((manifest.shortcuts || []).flatMap((s, index) => [
              [`shortcut-${index + 1}`, s.chosenIconUrl],
              [`shortcut-${index + 1}-maskable`, s.chosenMaskableIconUrl],
            ])),
          ].filter(([, url]) => Boolean(url))

          ;(async () => {
            for (const [label, url] of candidates) {
              const response = await fetch(url)
              if (!response.ok) throw new Error(`${label}: HTTP ${response.status} ${url}`)
              const contentType = response.headers.get('content-type') || ''
              const bytes = Buffer.from(await response.arrayBuffer())
              console.log(`${label}: ${contentType} ${bytes.length} bytes ${url}`)
              const image = await Jimp.read(bytes)
              console.log(`${label}: decoded ${image.bitmap.width}x${image.bitmap.height}`)
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Configure Bubblewrap with runner SDK
        run: bash android-twa/scripts/configure-bubblewrap-sdk.sh

      - name: Generate Android project
        working-directory: android-twa
        run: bubblewrap update --skipVersionUpgrade

      - name: Verify generated Android identity
        working-directory: android-twa
        run: |
          grep -q "com.dontripit.app" app/build.gradle
          grep -q "dontripit.com" app/build.gradle

      - name: Build unsigned APK and Android App Bundle
        working-directory: android-twa
        run: bubblewrap build --skipPwaValidation --skipSigning

      - name: Verify unsigned release outputs
        working-directory: android-twa
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          if jarsigner -verify app/build/outputs/bundle/release/app-release.aab 2>&1 | grep -q 'jar verified'; then
            echo 'Unsigned gate produced a signed AAB unexpectedly' >&2
            exit 1
          fi
          sha256sum app/build/outputs/bundle/release/app-release.aab app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Certify Bubblewrap signing with ephemeral smoke key
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: dri-smoke-pass
          BUBBLEWRAP_KEY_PASSWORD: dri-smoke-pass
        run: |
          keytool -genkeypair -noprompt \
            -keystore /tmp/dri-smoke.jks \
            -storepass dri-smoke-pass \
            -keypass dri-smoke-pass \
            -alias dri-smoke \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=DonRipIt CI Smoke, OU=CI, O=DonRipIt, L=Madrid, ST=Madrid, C=ES"

          bubblewrap build --skipPwaValidation \
            --signingKeyPath /tmp/dri-smoke.jks \
            --signingKeyAlias dri-smoke

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app-release-signed.apk
          jarsigner -verify -verbose -certs app-release-bundle.aab | grep -q 'jar verified'

          rm -f /tmp/dri-smoke.jks app-release-signed.apk app-release-bundle.aab

      - name: Inventory unsigned Android outputs
        run: |
          find android-twa -type f \( -name '*.aab' -o -name '*.apk' \) -print -exec ls -lh {} \;
          test -n "$(find android-twa -type f -name '*.aab' -print -quit)"

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dontripit-android-twa-unsigned
          path: |
            android-twa/app/build/outputs/bundle/release/app-release.aab
            android-twa/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
