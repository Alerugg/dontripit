name: Audit Cardmarket Products Fast

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-cardmarket-products-fast.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - run: |
          python - <<'PY'
          import json,os
          import psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
              c.execute("SET LOCAL statement_timeout='90s'")
              c.execute('''
                CREATE TEMP TABLE current_cm_non_single ON COMMIT DROP AS
                SELECT e.id,e.external_id,e.game_id,g.slug
                FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.product_group='non_single'
                  AND e.last_seen_at=(SELECT max(last_seen_at) FROM external_catalog_products WHERE source='cardmarket')
                  AND g.slug IN ('pokemon','onepiece','mtg','yugioh')
              ''')
              c.execute('CREATE INDEX ON current_cm_non_single(external_id)')
              c.execute('CREATE INDEX ON current_cm_non_single(id)')
              c.execute('''
                SELECT slug,count(*) total FROM current_cm_non_single GROUP BY slug ORDER BY slug
              ''')
              totals={r['slug']:int(r['total']) for r in c.fetchall()}
              c.execute('''
                SELECT count(*) identifiers,
                       count(*) FILTER (WHERE p.game_id<>cm.game_id) cross_game
                FROM current_cm_non_single cm
                JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                JOIN product_variants pv ON pv.id=pi.product_variant_id
                JOIN products p ON p.id=pv.product_id
              ''')
              identity=dict(c.fetchone())
              c.execute('''
                SELECT count(DISTINCT cm.id) accepted_links
                FROM current_cm_non_single cm
                JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                JOIN external_catalog_product_variant_links l
                  ON l.external_product_id=cm.id AND l.product_variant_id=pi.product_variant_id AND l.link_status='accepted'
              ''')
              accepted=int(c.fetchone()['accepted_links'])
              c.execute("SELECT id FROM price_sources WHERE name='cardmarket'")
              source_id=int(c.fetchone()['id'])
              c.execute('''
                SELECT count(DISTINCT cm.id) priced
                FROM current_cm_non_single cm
                JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                JOIN price_snapshots ps ON ps.entity_type='product_variant' AND ps.entity_id=pi.product_variant_id
                  AND ps.source_id=%s
              ''',(source_id,))
              priced=int(c.fetchone()['priced'])
              c.execute('''
                SELECT cm.slug,count(DISTINCT cm.id) priced
                FROM current_cm_non_single cm
                JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                JOIN price_snapshots ps ON ps.entity_type='product_variant' AND ps.entity_id=pi.product_variant_id
                  AND ps.source_id=%s
                GROUP BY cm.slug ORDER BY cm.slug
              ''',(source_id,))
              priced_by_game={r['slug']:int(r['priced']) for r in c.fetchall()}
          conn.close()
          total=sum(totals.values())
          proof={
            'totals_by_game':totals,'total':total,'identifiers':int(identity['identifiers']),
            'accepted_links':accepted,'cross_game':int(identity['cross_game']),
            'canonically_priced':priced,'priced_by_game':priced_by_game,
            'price_coverage_pct':round(priced*100/total,3) if total else 0,
          }
          if total!=13173 or proof['identifiers']!=total or accepted!=total or proof['cross_game']!=0:
              raise AssertionError(proof)
          if priced < int(total*0.75):
              raise AssertionError({'reason':'price coverage below safety gate','proof':proof})
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
