name: Audit Yu-Gi-Oh OCG Structure Deck Variants Production V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_structure_decks_variants_production_v1.py'
      - '.github/workflows/audit-yugioh-ocg-structure-decks-variants-production-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_STRUCTURE_DECK_VARIANTS_PROOF_OUTPUT: /tmp/ygo-ocg-structure-deck-variants-proof/production.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile writer and independent full-variant proof
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_structure_decks_variants_v1.py
          python -m py_compile app/scripts/audit_yugioh_ocg_structure_decks_variants_production_v1.py
      - name: READ ONLY prove writer sees full idempotent 40 state
        run: |
          mkdir -p /tmp/ygo-ocg-structure-deck-variants-proof
          python -m app.scripts.apply_yugioh_ocg_structure_decks_variants_v1 \
            --report /tmp/ygo-ocg-structure-deck-variants-proof/idempotency-readonly.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-structure-deck-variants-proof/idempotency-readonly.json'))
          expected={'SD41':10,'SD40':16,'SD38':10,'SD36':4}
          after={'SD41':53,'SD40':54,'SD38':53,'SD36':48}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['certified_pairs']==40,p
          assert p['already_accepted_same_pair']==40,p
          assert p['new_links_ready']==0,p
          rows={r['set_code']:r for r in p['sets']}
          assert {k:rows[k]['existing_same'] for k in rows}==expected,p
          assert {k:rows[k]['regional_accepted_before_or_after'] for k in rows}==after,p
          print(json.dumps({'writer_readonly':'idempotent','existing':40,'regional_complete':after},indent=2))
          PY
      - name: READ ONLY certify complete 208-link Structure Deck identity and exact prices
        run: python -m app.scripts.audit_yugioh_ocg_structure_decks_variants_production_v1
      - name: Require production proof PASS
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-structure-deck-variants-proof/production.json'))
          expected_variants={'SD41':10,'SD40':16,'SD38':10,'SD36':4}
          expected_total={'SD41':53,'SD40':54,'SD38':53,'SD36':48}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['accepted_method_links']==40,p
          assert p['unique_method_products']==40,p
          assert p['unique_method_prints']==40,p
          assert {k:p['method_sets'][k]['links'] for k in p['method_sets']}==expected_variants,p
          assert {k:p['regional_surfaces'][k]['accepted_links'] for k in p['regional_surfaces']}==expected_total,p
          assert p['regional_total_accepted_links']==208,p
          assert p['pricing']['canonical_current_wrong_idProduct']==0,p
          assert p['pricing']['canonical_current_exact_idProduct_prices']==p['pricing']['externally_priceable_links'],p
          assert p['failures']==[],p
          print(json.dumps({'regional_exact_links':208,'variant_links':40,'priceable_variants':p['pricing']['externally_priceable_links'],'unpriced_external':p['pricing']['missing_external_current_price'],'wrong_idProduct':0},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-structure-deck-variants-production-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-structure-deck-variants-proof/*.json
          retention-days: 90
          if-no-files-found: warn
