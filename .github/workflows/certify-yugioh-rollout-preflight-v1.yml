name: Certify Yu-Gi-Oh Multilingual Rollout Preflight V1

on:
  push:
    branches:
      - agent/yugioh-multilingual-rollout-v1
    paths:
      - .github/triggers/run-yugioh-rollout-preflight-v1
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/certify-yugioh-rollout-preflight-v1.yml'
      - 'backend/alembic/versions/20260815_35_add_set_region_identity.py'
      - 'backend/alembic/versions/20260815_36_include_card_in_print_identity.py'
      - 'backend/app/models.py'
      - 'backend/app/routes/set_ui.py'
      - 'backend/app/scripts/seed_yugioh_production_shape_v1.py'
      - 'backend/app/scripts/prepare_yugioh_multilingual_ephemeral_v1.py'
      - 'backend/app/scripts/certify_yugioh_multilingual_ephemeral_v1.py'
      - 'backend/app/scripts/certify_yugioh_multilingual_ephemeral_v2.py'
      - 'backend/app/scripts/certify_yugioh_multilingual_ephemeral_v3.py'
      - 'backend/app/scripts/audit_yugioh_multilingual_rollout_readiness_v1.py'
      - 'backend/tests/test_set_ui_region_identity.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: certify-yugioh-rollout-preflight-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
  EPHEMERAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_ygo_rollout_preflight
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_ygo_rollout_preflight
  YAML_YUGI_CARDS_URL: https://dawnbrandbots.github.io/yaml-yugi/cards.json
  YAML_YUGI_REPO_API: https://api.github.com/repos/DawnbrandBots/yaml-yugi
  FULL_REFRESH_RUN_ID: '31915462442'
  OVERLAY_RUN_ID: '31910377210'
  GAPS_RUN_ID: '31911720911'
  PYTHONPATH: .

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dontripit_ygo_rollout_preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dontripit_ygo_rollout_preflight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout clean rollout branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Compile and run regional identity tests
        run: |
          python -m py_compile \
            app/scripts/seed_yugioh_production_shape_v1.py \
            app/scripts/prepare_yugioh_multilingual_ephemeral_v1.py \
            app/scripts/certify_yugioh_multilingual_ephemeral_v1.py \
            app/scripts/certify_yugioh_multilingual_ephemeral_v2.py \
            app/scripts/certify_yugioh_multilingual_ephemeral_v3.py \
            app/scripts/audit_yugioh_multilingual_rollout_readiness_v1.py
          pytest -q tests/test_set_ui_region_identity.py

      - name: Prove production is source-only and target is local
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          prod = os.getenv('PRODUCTION_DATABASE_URL_UNPOOLED') or os.getenv('PRODUCTION_DATABASE_URL')
          eph = os.environ['EPHEMERAL_DATABASE_URL']
          assert prod, 'production database secret missing'
          assert prod != eph
          assert urlparse(eph).hostname in {'127.0.0.1', 'localhost'}
          print('safety gate: production != target; target is local PostgreSQL')
          PY

      - name: Build exact production schema revision 34 locally
        run: alembic upgrade 20260814_34

      - name: Clone only Yu-Gi-Oh catalog from production READ ONLY
        run: python -m app.scripts.seed_yugioh_production_shape_v1

      - name: Apply regional and card-scoped migrations locally
        run: alembic upgrade head

      - name: Certify migrations and install local hard write guards
        run: python -m app.scripts.prepare_yugioh_multilingual_ephemeral_v1

      - name: Download certified fresh YGOJSON shadow artifact
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fresh-artifact" "$RUNNER_TEMP/ygojson-fresh/extracted" artifacts
          state="$(gh run view "$FULL_REFRESH_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,name --jq '.status+":"+(.conclusion // "")+":"+.name')"
          test "$state" = 'completed:success:Shadow YGOJSON Full Refresh V1'
          gh run view "$FULL_REFRESH_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,name > artifacts/yugioh-fresh-source-run.json
          gh run download "$FULL_REFRESH_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ygojson-shadow-full-refresh-v1-${FULL_REFRESH_RUN_ID}" \
            --dir "$RUNNER_TEMP/fresh-artifact"
          test -s "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-full-refresh-v1.json"
          test -s "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-fresh-aggregate-v1.zip"
          unzip -q "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-fresh-aggregate-v1.zip" -d "$RUNNER_TEMP/ygojson-fresh/extracted"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/cards.json"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/sets.json"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/meta.json"
          cp "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-full-refresh-v1.json" artifacts/
          cp "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-aggregate-sha256.txt" artifacts/

      - name: Download and seal current YAML Yugi localization source
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yaml-yugi"
          curl --fail --location --retry 4 --retry-all-errors --output "$RUNNER_TEMP/yaml-yugi/cards.json" "$YAML_YUGI_CARDS_URL"
          sha256sum "$RUNNER_TEMP/yaml-yugi/cards.json" | tee artifacts/yugioh-yaml-yugi-cards-sha256-preflight.txt
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          cards = Path(os.environ['RUNNER_TEMP']) / 'yaml-yugi' / 'cards.json'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'User-Agent': 'dontripit-ygo-rollout-preflight-v1',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          repo = get(os.environ['YAML_YUGI_REPO_API'])
          commits = get(os.environ['YAML_YUGI_REPO_API'] + '/commits?sha=master&per_page=1')
          meta = {
              'source': 'yaml-yugi',
              'cards_url': os.environ['YAML_YUGI_CARDS_URL'],
              'sha256': hashlib.sha256(cards.read_bytes()).hexdigest(),
              'head': commits[0]['sha'] if commits else None,
              'head_date': commits[0]['commit']['committer']['date'] if commits else None,
              'pushed_at': repo.get('pushed_at'),
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'yaml-yugi' / 'source-meta.json'
          out.write_text(json.dumps(meta, indent=2, sort_keys=True) + '\n')
          Path('artifacts/yugioh-yaml-yugi-source-meta-preflight.json').write_text(json.dumps(meta, indent=2, sort_keys=True) + '\n')
          PY

      - name: Run guarded two-pass certification against fresh physical source
        run: |
          python -m app.scripts.certify_yugioh_multilingual_ephemeral_v3 \
            --input-dir "$RUNNER_TEMP/ygojson-fresh/extracted" \
            --yaml-yugi-cards "$RUNNER_TEMP/yaml-yugi/cards.json" \
            --yaml-yugi-meta "$RUNNER_TEMP/yaml-yugi/source-meta.json" \
            --source-evidence "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-full-refresh-v1.json" \
            --output ../artifacts/yugioh-multilingual-rollout-preflight-fresh.json

      - name: Enforce fresh-source certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('../artifacts/yugioh-multilingual-rollout-preflight-fresh.json').read_text())
          assert r['status'] == 'pass', r
          assert r['fresh_source_certified'] is True, r
          assert all(r['fresh_source_gates'].values()), r
          assert r['source_freshness']['status'] == 'current_enough', r
          assert r['production_writes'] == 0, r
          assert r['production_rollout_ready'] is False, r
          assert r['pass2_zero_writes'] is True and r['pass2']['total_writes'] == 0, r
          assert r['validation']['status'] == 'pass' and all(r['validation']['gates'].values()), r
          assert r['validation']['lean_invariants']['economics_untouched'] is True, r
          PY

      - name: Download certified overlay and localization-gap evidence
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/overlay evidence/gaps
          for run in "$OVERLAY_RUN_ID" "$GAPS_RUN_ID"; do
            state="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status+":"+.conclusion')"
            test "$state" = 'completed:success'
          done
          gh run download "$OVERLAY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "yugioh-current-physical-delta-ephemeral-v2-${OVERLAY_RUN_ID}" --dir evidence/overlay
          gh run download "$GAPS_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "yugioh-current-localization-gaps-v2-${GAPS_RUN_ID}" --dir evidence/gaps
          overlay_json="$(find evidence/overlay -type f -name 'yugioh-current-physical-delta-ephemeral-v2.json' -print -quit)"
          gaps_json="$(find evidence/gaps -type f -name 'yugioh-current-localization-gaps-v2.json' -print -quit)"
          test -n "$overlay_json" && test -s "$overlay_json"
          test -n "$gaps_json" && test -s "$gaps_json"
          cp "$overlay_json" evidence/overlay/current-overlay.json
          cp "$gaps_json" evidence/gaps/current-gaps.json

      - name: Run final controlled rollout readiness gate
        run: |
          python -m app.scripts.audit_yugioh_multilingual_rollout_readiness_v1 \
            --fresh-historical ../artifacts/yugioh-multilingual-rollout-preflight-fresh.json \
            --current-overlay ../evidence/overlay/current-overlay.json \
            --localization-gaps ../evidence/gaps/current-gaps.json \
            --output ../artifacts/yugioh-multilingual-rollout-readiness-v1.json

      - name: Enforce final readiness without production authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('../artifacts/yugioh-multilingual-rollout-readiness-v1.json').read_text())
          assert r['status'] == 'pass', r
          assert r['controlled_rollout_candidate_ready'] is True, r
          assert r['automatic_production_write_authorized'] is False, r
          assert r['production_writes'] == 0, r
          assert all(r['gates'].values()), r
          PY

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-multilingual-rollout-preflight-v1-${{ github.run_id }}
          path: |
            artifacts/yugioh-multilingual-rollout-preflight-fresh.json
            artifacts/yugioh-multilingual-rollout-readiness-v1.json
            artifacts/yugioh-fresh-source-run.json
            artifacts/ygojson-shadow-full-refresh-v1.json
            artifacts/ygojson-shadow-aggregate-sha256.txt
            artifacts/yugioh-yaml-yugi-cards-sha256-preflight.txt
            artifacts/yugioh-yaml-yugi-source-meta-preflight.json
            /tmp/yugioh-production-shape-pre-migration.json
            /tmp/yugioh-multilingual-ephemeral-baseline.json
          retention-days: 90
          if-no-files-found: warn
