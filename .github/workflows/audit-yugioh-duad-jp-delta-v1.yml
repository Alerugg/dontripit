name: Audit Yu-Gi-Oh DUAD-JP Delta V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_duad_jp_delta_v1.py'
      - '.github/workflows/audit-yugioh-duad-jp-delta-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_DUAD_JP_DELTA_OUTPUT: /tmp/yugioh-duad-jp-delta-v1.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile exact delta audit
        run: python -m py_compile app/scripts/audit_yugioh_duad_jp_delta_v1.py
      - name: Resolve DUAD-JP metacards to canonical JA cards and classify the 121/117 delta
        run: python -m app.scripts.audit_yugioh_duad_jp_delta_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-duad-jp-delta-v1-${{ github.run_id }}
          path: /tmp/yugioh-duad-jp-delta-v1.json
          retention-days: 60
          if-no-files-found: error
