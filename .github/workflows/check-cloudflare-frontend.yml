name: Check Cloudflare frontend compatibility

on:
  push:
    branches:
      - infra/cloudflare-frontend-production-parity
    paths:
      - '.github/workflows/check-cloudflare-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout production-parity frontend
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Record frontend revision
        run: echo "FRONTEND_SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Run vinext compatibility check
        run: npx --yes vinext check
