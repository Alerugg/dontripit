name: Inspect Yu-Gi-Oh Source Conflict Cards

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/inspect-yugioh-source-conflict-cards.yml'
      - 'backend/app/scripts/inspect_yugioh_source_conflict_cards.py'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile inspector
        working-directory: backend
        run: python -m compileall -q app/scripts/inspect_yugioh_source_conflict_cards.py
      - name: Inspect source conflict payloads read-only
        working-directory: backend
        run: |
          set -euo pipefail
          python -u -m app.scripts.inspect_yugioh_source_conflict_cards \
            --report-path /tmp/yugioh-source-conflict-cards.json \
            | tee /tmp/yugioh-source-conflict-cards.log
      - name: Upload source conflict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-source-conflict-cards-${{ github.sha }}
          path: |
            /tmp/yugioh-source-conflict-cards.json
            /tmp/yugioh-source-conflict-cards.log
          retention-days: 90
          if-no-files-found: error
