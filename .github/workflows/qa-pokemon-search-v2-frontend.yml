name: QA Pokemon Search V2 Frontend

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/qa-pokemon-search-v2-frontend.yml'
      - 'frontend/package.json'
      - 'frontend/tests/**'
      - 'frontend/app/games/[slug]/page.js'
      - 'frontend/components/games/PokemonExplorerV2Page.js'
      - 'frontend/components/searchV2/**'
      - 'frontend/lib/searchV2/**'
      - 'frontend/app/api/search-v2/**'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build Next.js application
        working-directory: frontend
        env:
          INTERNAL_API_BASE_URL: http://127.0.0.1:5000
          INTERNAL_API_KEY: test-build-key
          ADMIN_CONSOLE_USERNAME: admin
          ADMIN_CONSOLE_PASSWORD: test-build-password
        run: npm run build
      - name: Verify the current Pokémon hub is present in build source
        run: |
          set -euo pipefail
          grep -q "GameHubPage" 'frontend/app/games/[slug]/page.js'
          grep -q "OnePieceSearchV2Experience" 'frontend/components/games/GameHubPage.js'
          grep -q "pokemon" 'frontend/components/searchV2/AdvancedSearchPanel.js'
          grep -q "Pikachu" 'frontend/components/searchV2/OnePieceSearchV2Experience.js'
          grep -q "physical.finish" 'frontend/components/searchV2/SearchV2Results.js'
