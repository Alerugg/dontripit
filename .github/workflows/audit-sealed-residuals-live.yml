name: Audit Sealed Residuals Live

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-sealed-residuals-live.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-sealed-residuals-live
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary==2.9.9
      - name: Rank exact and near canonical candidates for six live residuals
        working-directory: backend
        run: |
          python - <<'PY'
          import json, os, re, unicodedata
          from difflib import SequenceMatcher
          import psycopg2
          from psycopg2.extras import RealDictCursor

          def norm(value):
              raw=unicodedata.normalize('NFKD',str(value or '').casefold())
              raw=''.join(c for c in raw if not unicodedata.combining(c))
              return ' '.join(re.sub(r'[^a-z0-9]+',' ',raw).split())

          def score(a,b):
              na,nb=norm(a),norm(b)
              ta,tb=set(na.split()),set(nb.split())
              seq=SequenceMatcher(None,na,nb).ratio()
              jac=len(ta&tb)/len(ta|tb) if ta|tb else 0
              contain=(len(ta&tb)/min(len(ta),len(tb))) if ta and tb else 0
              return round(0.45*seq+0.35*jac+0.20*contain,6)

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          conn.set_session(readonly=True,autocommit=True)
          with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT max(last_seen_at) capture FROM external_catalog_products WHERE source='cardmarket'")
              capture=cur.fetchone()['capture']
              cur.execute('''
                SELECT e.id external_product_id,e.external_id,g.slug game,e.game_id,e.name,e.category,e.category_id,
                       e.expansion_external_id,e.date_added,e.website_path,e.raw_json
                FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.last_seen_at=%s AND e.product_group='non_single'
                  AND g.slug IN ('mtg','pokemon','yugioh','onepiece')
                  AND NOT EXISTS (
                    SELECT 1 FROM external_catalog_product_variant_links l
                    JOIN product_variants pv ON pv.id=l.product_variant_id
                    JOIN products p ON p.id=pv.product_id
                    WHERE l.external_product_id=e.id AND l.link_status IN ('accepted','mapped','exact') AND p.game_id=e.game_id
                  )
                  AND NOT EXISTS (
                    SELECT 1 FROM product_identifiers pi
                    JOIN product_variants pv ON pv.id=pi.product_variant_id
                    JOIN products p ON p.id=pv.product_id
                    WHERE pi.source='cardmarket' AND pi.external_id=e.external_id AND p.game_id=e.game_id
                  )
                ORDER BY g.slug,e.external_id
              ''',(capture,))
              residuals=[dict(r) for r in cur.fetchall()]
              cur.execute('''
                SELECT p.id product_id,p.game_id,g.slug game,p.name,p.product_type,p.set_id,p.release_date,
                       pv.id product_variant_id,pv.language,pv.region,pv.packaging,pv.sku
                FROM products p JOIN games g ON g.id=p.game_id
                LEFT JOIN product_variants pv ON pv.product_id=p.id
                WHERE g.slug IN ('mtg','pokemon','yugioh','onepiece')
                ORDER BY p.id,pv.id
              ''')
              canon=[dict(r) for r in cur.fetchall()]
          conn.close()

          out=[]
          for row in residuals:
              same=[c for c in canon if c['game']==row['game']]
              ranked=[]
              seen=set()
              for c in same:
                  key=(c['product_id'],c['product_variant_id'])
                  if key in seen: continue
                  seen.add(key)
                  ranked.append({**c,'match_score':score(row['name'],c['name']),'normalized_name':norm(c['name'])})
              ranked.sort(key=lambda x:(x['match_score'],x['product_id']),reverse=True)
              exact=[c for c in ranked if c['normalized_name']==norm(row['name'])]
              item={k:v for k,v in row.items() if k!='raw_json'}
              item['normalized_name']=norm(row['name'])
              item['exact_candidates']=exact
              item['top_near_candidates']=ranked[:8]
              item['raw_json']=row['raw_json']
              out.append(item)
          report={'mode':'READ_ONLY','capture':capture,'count':len(out),'residuals':out}
          print('SEALED_CANDIDATE_REPORT='+json.dumps(report,default=str,sort_keys=True))
          if len(out)!=6:
              raise SystemExit(f'Expected exactly 6 live sealed residuals, got {len(out)}')
          PY
