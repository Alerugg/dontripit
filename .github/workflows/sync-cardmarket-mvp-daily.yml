name: Sync Cardmarket MVP Daily

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cardmarket-mvp-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Download all official Cardmarket catalog and price feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cardmarket
          for spec in mtg:1 yugioh:3 pokemon:6 onepiece:18; do
            game="${spec%%:*}"
            game_id="${spec##*:}"
            for group in singles nonsingles; do
              curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
                "https://downloads.s3.cardmarket.com/productCatalog/productList/products_${group}_${game_id}.json" \
                -o "/tmp/cardmarket/${game}_${group}.json"
            done
            curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
              "https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_${game_id}.json" \
              -o "/tmp/cardmarket/${game}_prices.json"
          done
      - name: Validate and apply complete external catalog
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          ARGS=(
            --catalog mtg:single:/tmp/cardmarket/mtg_singles.json
            --catalog mtg:non_single:/tmp/cardmarket/mtg_nonsingles.json
            --catalog yugioh:single:/tmp/cardmarket/yugioh_singles.json
            --catalog yugioh:non_single:/tmp/cardmarket/yugioh_nonsingles.json
            --catalog pokemon:single:/tmp/cardmarket/pokemon_singles.json
            --catalog pokemon:non_single:/tmp/cardmarket/pokemon_nonsingles.json
            --catalog onepiece:single:/tmp/cardmarket/onepiece_singles.json
            --catalog onepiece:non_single:/tmp/cardmarket/onepiece_nonsingles.json
          )
          python scripts/sync_cardmarket_catalog.py "${ARGS[@]}" --report /tmp/cardmarket/catalog-dry.json
          python scripts/sync_cardmarket_catalog.py "${ARGS[@]}" --apply --report /tmp/cardmarket/catalog-apply.json
      - name: Map only exact and unique sealed identities
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/map_cardmarket_sealed_exact.py --report /tmp/cardmarket/sealed-mapping-dry.json
          python scripts/map_cardmarket_sealed_exact.py --apply --report /tmp/cardmarket/sealed-mapping-apply.json
      - name: Validate and apply all current Cardmarket prices
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          for game in mtg yugioh pokemon onepiece; do
            python scripts/sync_cardmarket_external_prices.py "/tmp/cardmarket/${game}_prices.json" \
              --game "$game" --report "/tmp/cardmarket/${game}-prices-dry.json"
            python scripts/sync_cardmarket_external_prices.py "/tmp/cardmarket/${game}_prices.json" \
              --game "$game" --apply --report "/tmp/cardmarket/${game}-prices-apply.json"
          done
      - name: Generate missing verified image worklist
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/report_missing_images.py \
            --json /tmp/cardmarket/missing-images.json \
            --csv /tmp/cardmarket/missing-images.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-mvp-daily-${{ github.run_id }}
          path: |
            /tmp/cardmarket/*-*.json
            /tmp/cardmarket/missing-images.csv
          retention-days: 30
          if-no-files-found: warn
