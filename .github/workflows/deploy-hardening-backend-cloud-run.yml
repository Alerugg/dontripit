name: Deploy hardening backend revision to Cloud Run

on:
  push:
    branches:
      - backend/perfection-hardening-20260911
    paths:
      - '.github/workflows/deploy-hardening-backend-cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TARGET_SHA: 98665a41253f46c7bb9ac14c30300424285f66a6
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-southwest1' }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'dontripit' }}
  GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'dontripit-api' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact hardening revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Validate deploy configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          for name in PROJECT_ID WIF_PROVIDER DEPLOYER_SA; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push exact backend image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/dontripit-api:${TARGET_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build --pull -t "${IMAGE}" ./backend
          docker push "${IMAGE}"

      - name: Deploy without replacing production configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud run deploy "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --image="${IMAGE}" \
            --update-env-vars="SOURCE_VERSION=${TARGET_SHA}" \
            --quiet

      - name: Verify exact revision health
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" --project="${PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          echo "Cloud Run URL: ${SERVICE_URL}"
          BODY="$(curl --fail --show-error --silent --retry 8 --retry-delay 3 "${SERVICE_URL}/api/health")"
          echo "${BODY}"
          HEALTH_BODY="${BODY}" python - <<'PY'
          import json, os
          body = json.loads(os.environ['HEALTH_BODY'])
          assert body.get('ok') is True, body
          assert body.get('runtime') == 'cloud_run', body
          assert body.get('revision') == os.environ['TARGET_SHA'], body
          print('Exact Cloud Run revision verified:', body['revision'])
          PY
