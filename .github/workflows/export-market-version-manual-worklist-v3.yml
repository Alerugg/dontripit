name: Export Market Version Manual Worklist V3

on:
  push:
    branches: [ops/cardmarket-worklist-export-20260825]
    paths:
      - '.github/workflows/export-market-version-manual-worklist-v3.yml'
      - 'backend/scripts/export_market_version_manual_worklist_v3.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-market-version-manual-worklist-v3
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: backend
      WORKLIST_OUT_DIR: /tmp/market-version-worklist-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Export current production worklist (read-only)
        run: python backend/scripts/export_market_version_manual_worklist_v3.py
      - name: Upload worklist snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-version-manual-worklist-v3-${{ github.run_id }}
          path: /tmp/market-version-worklist-v3
          if-no-files-found: error
          retention-days: 7
