name: Mobile PWA CI

on:
  push:
    branches:
      - mobile-pwa
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-pwa-ci.yml'
  pull_request:
    branches:
      - catalog-v2
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-pwa-ci.yml'
  workflow_dispatch:

jobs:
  pwa-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      INTERNAL_API_BASE_URL: http://127.0.0.1:5000
      INTERNAL_API_KEY: ci-placeholder-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend and PWA tests
        run: npm test
      - name: Build Next.js app
        run: npm run build
      - name: Validate PWA static assets
        run: |
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/offline.html
          test -f public/icons/dontripit-app.svg
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/manifest.webmanifest','utf8')); if(m.display!=='standalone'||m.scope!=='/'||!m.icons?.length) process.exit(1)"
