name: Audit Yu-Gi-Oh Cardmarket Print Images Post V1

on:
  pull_request:
    paths:
      - '.github/workflows/audit-yugioh-cardmarket-print-images-post-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime and image validator
        run: |
          pip install -r requirements.txt
          pip install 'Pillow==11.3.0'
      - name: Independently prove all 16 exact images are committed
        run: |
          mkdir -p /tmp/ygo-cardmarket-images-post-v1
          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            python -m app.scripts.apply_yugioh_cardmarket_exact_print_images_v1 \
              --report /tmp/ygo-cardmarket-images-post-v1/preflight.json
            if python - <<'PY'
          import json, sys
          p=json.load(open('/tmp/ygo-cardmarket-images-post-v1/preflight.json'))
          ok=(
              p['status']=='pass' and p['mode']=='dry_run' and
              p['manifest_rows']==16 and p['network_verified']==16 and p['identity_verified']==16 and
              p['planned_inserts']==0 and p['already_present']==16 and
              p['post_exact_images']==16 and p['production_writes']==0
          )
          print(json.dumps({k:p[k] for k in ('planned_inserts','already_present','post_exact_images','production_writes')},indent=2))
          sys.exit(0 if ok else 1)
          PY
            then
              break
            fi
            if [ "$ATTEMPT" = "8" ]; then
              echo 'Exact image rollout did not reach certified post-state' >&2
              exit 1
            fi
            sleep 15
          done
      - name: Count fresh canonical Yu-Gi-Oh image gaps
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          conn=psycopg2.connect(url,connect_timeout=30,application_name='dontripit_ygo_image_post_cert_v1')
          conn.set_session(readonly=True,autocommit=False)
          try:
              with conn.cursor(cursor_factory=RealDictCursor) as cur:
                  cur.execute('''
                      SELECT lower(coalesce(p.language,'')) AS language, count(*) AS missing
                      FROM prints p
                      JOIN cards c ON c.id=p.card_id
                      JOIN games g ON g.id=c.game_id
                      WHERE g.slug='yugioh'
                        AND NOT EXISTS (SELECT 1 FROM print_images pi WHERE pi.print_id=p.id)
                      GROUP BY lower(coalesce(p.language,''))
                      ORDER BY language
                  ''')
                  rows=[dict(r) for r in cur.fetchall()]
                  conn.rollback()
          finally:
              conn.close()
          by_language={str(r['language'] or 'unknown'):int(r['missing']) for r in rows}
          total=sum(by_language.values())
          report={
              'status':'pass',
              'production_writes':0,
              'missing_print_images_total':total,
              'missing_by_language':by_language,
              'expected_reduction_from_prewrite_baseline':16,
              'baseline_total':26459,
              'expected_total_if_no_concurrent_image_changes':26443,
          }
          Path('/tmp/ygo-cardmarket-images-post-v1/gaps.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          assert total <= 26443, report
          assert by_language.get('es',0) <= 25178, report
          assert by_language.get('ja',0) <= 1265, report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-cardmarket-print-images-post-v1-${{ github.run_id }}
          path: /tmp/ygo-cardmarket-images-post-v1/*
          retention-days: 90
          if-no-files-found: warn
