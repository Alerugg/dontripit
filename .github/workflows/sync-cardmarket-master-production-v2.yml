name: Cardmarket Master Production Sync V2

on:
  schedule:
    - cron: '20 4 * * *'
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/sync-cardmarket-master-production-v2.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardmarket-master-production-sync-v2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Require production database
        run: |
          if [ -z "${DATABASE_URL_UNPOOLED:-}" ] && [ -z "${DATABASE_URL:-}" ]; then exit 1; fi
      - name: Upgrade schema
        run: alembic upgrade head
      - name: Download all current Cardmarket MVP feeds
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/cardmarket
          for spec in mtg:1 yugioh:3 pokemon:6 onepiece:18; do
            game=${spec%%:*}; gid=${spec##*:}
            for group in singles nonsingles; do
              curl --retry 5 --retry-all-errors --retry-delay 2 --fail --location --silent --show-error \
                "https://downloads.s3.cardmarket.com/productCatalog/productList/products_${group}_${gid}.json" \
                -o "/tmp/cardmarket/${game}_${group}.json"
              test -s "/tmp/cardmarket/${game}_${group}.json"
            done
            curl --retry 5 --retry-all-errors --retry-delay 2 --fail --location --silent --show-error \
              "https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_${gid}.json" \
              -o "/tmp/cardmarket/${game}_prices.json"
            test -s "/tmp/cardmarket/${game}_prices.json"
          done
      - name: Validate source contracts before writes
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.jobs.cardmarket_master_inventory import load_catalog_feed_bytes
          from app.jobs.cardmarket_prices import load_price_guide_bytes
          specs=['mtg','yugioh','pokemon','onepiece']
          all_ids=set(); summary={}
          for game in specs:
            feeds={}
            for fg,pg in [('singles','single'),('nonsingles','non_single')]:
              feed=load_catalog_feed_bytes(Path(f'/tmp/cardmarket/{game}_{fg}.json').read_bytes(),game_slug=game,product_group=pg)
              ids=[x.product_id for x in feed.rows]
              assert feed.raw_records and feed.rejected_records==0 and len(ids)==feed.raw_records
              assert len(ids)==len(set(ids))
              assert not (set(ids)&all_ids), f'cross-feed idProduct collision for {game}:{pg}'
              all_ids.update(ids);feeds[pg]=set(ids)
            assert not (feeds['single']&feeds['non_single'])
            created,prices=load_price_guide_bytes(Path(f'/tmp/cardmarket/{game}_prices.json').read_bytes(),filename=f'{game}.json')
            pids=[x.product_id for x in prices]
            assert pids and len(pids)==len(set(pids))
            missing=set(pids)-(feeds['single']|feeds['non_single'])
            assert not missing, f'{game}: price IDs absent from catalog: {sorted(missing)[:20]}'
            summary[game]={'singles':len(feeds['single']),'non_singles':len(feeds['non_single']),'price_products':len(pids),'price_as_of':created.isoformat() if created else None}
          print({'validated':summary,'global_current_products':len(all_ids)})
          PY
      - name: Preflight complete Cardmarket catalog
        run: |
          python scripts/sync_cardmarket_catalog.py \
            --catalog mtg:single:/tmp/cardmarket/mtg_singles.json --catalog mtg:non_single:/tmp/cardmarket/mtg_nonsingles.json \
            --catalog yugioh:single:/tmp/cardmarket/yugioh_singles.json --catalog yugioh:non_single:/tmp/cardmarket/yugioh_nonsingles.json \
            --catalog pokemon:single:/tmp/cardmarket/pokemon_singles.json --catalog pokemon:non_single:/tmp/cardmarket/pokemon_nonsingles.json \
            --catalog onepiece:single:/tmp/cardmarket/onepiece_singles.json --catalog onepiece:non_single:/tmp/cardmarket/onepiece_nonsingles.json \
            --report /tmp/cardmarket/catalog-preflight.json
      - name: Apply complete Cardmarket catalog
        run: |
          python scripts/sync_cardmarket_catalog.py \
            --catalog mtg:single:/tmp/cardmarket/mtg_singles.json --catalog mtg:non_single:/tmp/cardmarket/mtg_nonsingles.json \
            --catalog yugioh:single:/tmp/cardmarket/yugioh_singles.json --catalog yugioh:non_single:/tmp/cardmarket/yugioh_nonsingles.json \
            --catalog pokemon:single:/tmp/cardmarket/pokemon_singles.json --catalog pokemon:non_single:/tmp/cardmarket/pokemon_nonsingles.json \
            --catalog onepiece:single:/tmp/cardmarket/onepiece_singles.json --catalog onepiece:non_single:/tmp/cardmarket/onepiece_nonsingles.json \
            --apply --report /tmp/cardmarket/catalog-apply.json
      - name: Preflight and apply all Cardmarket Price Guides
        shell: bash
        run: |
          set -euo pipefail
          for game in mtg yugioh pokemon onepiece; do
            python scripts/sync_cardmarket_external_prices.py "/tmp/cardmarket/${game}_prices.json" --game "$game" --report "/tmp/cardmarket/${game}-prices-preflight.json"
          done
          for game in mtg yugioh pokemon onepiece; do
            python scripts/sync_cardmarket_external_prices.py "/tmp/cardmarket/${game}_prices.json" --game "$game" --apply --report "/tmp/cardmarket/${game}-prices-apply.json"
          done
      - name: Prove latest capture exactly matches downloaded Product Catalogues
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from sqlalchemy import create_engine,text
          from app.jobs.cardmarket_master_inventory import load_catalog_feed_bytes
          expected={}
          for game in ('mtg','yugioh','pokemon','onepiece'):
            for fg,pg in [('singles','single'),('nonsingles','non_single')]:
              f=load_catalog_feed_bytes(Path(f'/tmp/cardmarket/{game}_{fg}.json').read_bytes(),game_slug=game,product_group=pg)
              expected[(game,pg)]=len(f.rows)
          engine=create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with engine.connect() as conn:
            latest=conn.execute(text("SELECT max(last_seen_at) FROM external_catalog_products WHERE source='cardmarket'" )).scalar_one()
            rows=conn.execute(text('''
              SELECT g.slug,e.product_group,count(*) FROM external_catalog_products e JOIN games g ON g.id=e.game_id
              WHERE e.source='cardmarket' AND e.last_seen_at=:latest AND g.slug IN ('mtg','yugioh','pokemon','onepiece')
              GROUP BY g.slug,e.product_group
            '''),{'latest':latest}).all()
            actual={(str(g),str(pg)):int(c) for g,pg,c in rows}
            priced=conn.execute(text('''
              WITH latest_price AS (
                SELECT e.game_id,max(p.as_of) as as_of
                FROM external_market_price_snapshots p JOIN external_catalog_products e ON e.id=p.external_product_id
                WHERE e.source='cardmarket' GROUP BY e.game_id
              )
              SELECT g.slug,count(DISTINCT p.external_product_id),max(p.as_of)
              FROM latest_price l JOIN games g ON g.id=l.game_id
              JOIN external_catalog_products e ON e.game_id=l.game_id AND e.source='cardmarket'
              JOIN external_market_price_snapshots p ON p.external_product_id=e.id AND p.as_of=l.as_of
              WHERE g.slug IN ('mtg','yugioh','pokemon','onepiece')
              GROUP BY g.slug
            ''')).all()
          if actual!=expected: raise AssertionError({'expected':expected,'actual':actual,'latest':latest.isoformat()})
          proof={'current_capture_seen_at':latest.isoformat(),'catalog_exact_match':True,
                 'catalog_counts':{f'{g}:{pg}':c for (g,pg),c in sorted(actual.items())},
                 'latest_price_products':{str(g):{'products':int(c),'as_of':a.isoformat()} for g,c,a in priced}}
          Path('/tmp/cardmarket/current-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-master-v2-${{ github.run_id }}
          path: /tmp/cardmarket/*.json
          retention-days: 30
          if-no-files-found: warn
