name: Search V2 End-to-End

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/search-v2-e2e.yml'
      - 'backend/app/search_v2/**'
      - 'backend/app/routes/search_v2.py'
      - 'frontend/next.config.js'
      - 'frontend/app/api/search-v2/**'
      - 'frontend/app/api/build-info/**'
      - 'frontend/app/api/catalog/cards/**'
      - 'frontend/app/api/catalog/prints/**'
      - 'frontend/app/api/catalog/news/**'
      - 'frontend/lib/news/**'
      - 'frontend/app/games/**'
      - 'frontend/app/cards/**'
      - 'frontend/app/prints/**'
      - 'frontend/app/tcg/**'
      - 'frontend/app/play/**'
      - 'frontend/app/explorer/**'
      - 'frontend/components/searchV2/**'
      - 'frontend/lib/searchV2/**'
      - 'frontend/tests/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PUBLIC_API_ENABLED: 'false'
      INTERNAL_API_BASE_URL: http://127.0.0.1:5000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Neon secret
        run: test -n "${DATABASE_URL}${DATABASE_URL_UNPOOLED}"

      - name: Create temporary catalog API key
        working-directory: backend
        run: |
          set -euo pipefail
          KEY="$(python -m app.auth.create_key --plan enterprise --label "ci-e2e-${GITHUB_RUN_ID}" --scopes read:catalog | tail -n 1)"
          PREFIX="${KEY:0:8}"
          echo "::add-mask::$KEY"
          echo "TEMP_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "TEMP_API_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "Created temporary key prefix $PREFIX"

      - name: Start backend
        working-directory: backend
        run: |
          nohup flask --app app.main:app run --host 127.0.0.1 --port 5000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5000/api/health >/tmp/backend-health.json; then
              cat /tmp/backend-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1

      - name: Build frontend
        working-directory: frontend
        env:
          INTERNAL_API_KEY: ${{ env.TEMP_API_KEY }}
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        env:
          INTERNAL_API_KEY: ${{ env.TEMP_API_KEY }}
        run: |
          nohup npm start > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/api/build-info >/tmp/build-info.json; then
              cat /tmp/build-info.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/frontend.log
          exit 1

      - name: Exercise Search V2 and dynamic routes over HTTP
        run: |
          set -euo pipefail

          curl -fsS 'http://127.0.0.1:3000/games/onepiece' > /tmp/onepiece-page.html
          curl -fsS -o /tmp/legacy-tcg.html -w '%{http_code}' 'http://127.0.0.1:3000/tcg/onepiece' > /tmp/legacy-tcg-status.txt
          curl -fsS 'http://127.0.0.1:3000/api/search-v2?game=onepiece&q=OP05-119&limit=10' > /tmp/search.json
          curl -fsS 'http://127.0.0.1:3000/api/search-v2?game=onepiece&q=Luffy&limit=10' > /tmp/luffy.json
          curl -fsS 'http://127.0.0.1:3000/api/search-v2?game=onepiece&q=monky%20lufi&limit=10' > /tmp/typo.json
          curl -fsS 'http://127.0.0.1:3000/api/search-v2?game=onepiece&q=leader%20life%205&limit=10' > /tmp/life.json
          curl -fsS 'http://127.0.0.1:3000/api/search-v2?game=onepiece&q=purple%2010000%20power&limit=10' > /tmp/power.json
          curl -fsS 'http://127.0.0.1:3000/api/search-v2?game=onepiece&q=2000%20counter&limit=10' > /tmp/counter.json
          curl -fsS 'http://127.0.0.1:3000/api/search-v2/suggest?game=onepiece&q=Luffy&limit=8' > /tmp/suggest.json
          curl -fsS 'http://127.0.0.1:3000/api/search-v2/facets?game=onepiece' > /tmp/facets.json
          curl -fsS 'http://127.0.0.1:3000/api/search-v2/facet-values?game=onepiece&key=set&q=op05&limit=10' > /tmp/set-values.json
          curl -fsS 'http://127.0.0.1:3000/api/catalog/news?game=onepiece&limit=1' > /tmp/news.json
          curl -fsS -X POST 'http://127.0.0.1:3000/api/search-v2/advanced' \
            -H 'Content-Type: application/json' \
            --data '{"game":"onepiece","q":"Luffy","filters":{"set":"op-05","language":"en","rarity":"SEC"},"limit":20,"offset":0}' \
            > /tmp/advanced.json

          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path(name).read_text())

          def first_attrs(payload):
              items = payload.get('items') or []
              assert items, payload
              return items[0], items[0].get('attributes') or {}

          search = load('/tmp/search.json')
          luffy = load('/tmp/luffy.json')
          typo = load('/tmp/typo.json')
          life = load('/tmp/life.json')
          power = load('/tmp/power.json')
          counter = load('/tmp/counter.json')
          suggest = load('/tmp/suggest.json')
          facets = load('/tmp/facets.json')
          sets = load('/tmp/set-values.json')
          news = load('/tmp/news.json')
          advanced = load('/tmp/advanced.json')
          build = load('/tmp/build-info.json')

          items = search.get('items') or []
          assert items, f'exact collector returned no physical variants: {items}'
          assert all(row.get('card_key') == 'onepiece:op05-119' for row in items), items
          assert len({row.get('card_id') for row in items}) == 1, items
          print_ids = [row.get('print_id') for row in items]
          assert all(print_ids) and len(print_ids) == len(set(print_ids)), f'duplicate physical prints: {items}'

          luffy_items = luffy.get('items') or []
          assert luffy_items, luffy
          assert str(luffy_items[0].get('name') or '').lower() == 'monkey.d.luffy', luffy_items[:5]

          typo_items = typo.get('items') or []
          assert typo_items, typo
          assert all('luffy' in str(row.get('name') or '').lower() for row in typo_items[:10]), typo_items[:10]

          life_row, life_attrs = first_attrs(life)
          assert str(life_attrs.get('card_type') or '').lower() == 'leader', life_row
          assert int(life_attrs.get('life') or -1) == 5, life_row

          power_row, power_attrs = first_attrs(power)
          assert 'purple' in [str(value).lower() for value in (power_attrs.get('color') or [])], power_row
          assert int(power_attrs.get('power') or -1) == 10000, power_row

          counter_row, counter_attrs = first_attrs(counter)
          assert int(counter_attrs.get('counter') or -1) == 2000, counter_row

          suggest_items = suggest.get('items') or []
          assert suggest_items, suggest
          assert str(suggest_items[0].get('name') or '').lower() == 'monkey.d.luffy', suggest_items[:5]

          groups = facets.get('groups') or {}
          assert groups and sum(len(v) for v in groups.values()) >= 19, facets

          set_items = sets.get('items') or []
          assert set_items, sets
          assert any(str(row.get('value') or '').lower() == 'op-05' for row in set_items), set_items

          assert isinstance(news.get('items'), list), news
          assert str(news.get('provider') or '').startswith('news_ingestion'), news

          adv_items = advanced.get('items') or []
          assert adv_items, advanced
          for row in adv_items[:10]:
              assert row.get('set_code') == 'op-05', row
              assert row.get('language') == 'en', row
              assert str(row.get('rarity') or '').upper() == 'SEC', row

          html = Path('/tmp/onepiece-page.html').read_text(errors='ignore')
          assert 'One Piece' in html or 'ONE PIECE' in html, 'One Piece page rendered without game identity'
          assert build.get('build_contract') == 'catalog-v2-search-v2', build

          print(json.dumps({
              'status': 'pass',
              'exact_results': len(items),
              'luffy_first': luffy_items[0].get('name'),
              'typo_results': len(typo_items),
              'life_first': {'name': life_row.get('name'), 'life': life_attrs.get('life')},
              'power_first': {'name': power_row.get('name'), 'power': power_attrs.get('power')},
              'counter_first': {'name': counter_row.get('name'), 'counter': counter_attrs.get('counter')},
              'suggestion_first': suggest_items[0].get('name'),
              'facet_count': sum(len(v) for v in groups.values()),
              'set_choices': len(set_items),
              'advanced_total': advanced.get('total'),
              'news_provider': news.get('provider'),
              'build_contract': build.get('build_contract'),
          }, indent=2))
          PY

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-v2-e2e-${{ github.sha }}
          path: |
            /tmp/search.json
            /tmp/luffy.json
            /tmp/typo.json
            /tmp/life.json
            /tmp/power.json
            /tmp/counter.json
            /tmp/suggest.json
            /tmp/facets.json
            /tmp/set-values.json
            /tmp/news.json
            /tmp/advanced.json
            /tmp/build-info.json
            /tmp/backend-health.json
            /tmp/backend.log
            /tmp/frontend.log
          if-no-files-found: warn
          retention-days: 30

      - name: Disable temporary API key
        if: always() && env.TEMP_API_PREFIX != ''
        working-directory: backend
        run: python -m app.auth.disable_key --prefix "$TEMP_API_PREFIX" || true
