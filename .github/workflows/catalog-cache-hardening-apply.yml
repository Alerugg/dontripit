name: Catalog Cache Hardening Apply

on:
  push:
    branches:
      - infra/cloudflare-catalog-cache-hardening
    paths:
      - '.github/triggers/catalog-cache-hardening-apply'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/cloudflare-catalog-cache-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply fail-closed route patch
        working-directory: frontend
        run: node scripts/patch-catalog-search-cache-hardening.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run catalog hardening regression
        working-directory: frontend
        run: node --test tests/catalogMetadataHardening.test.js tests/bffRoutesSyntax.test.mjs
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit hardened route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/api/catalog/search/route.js
          git diff --cached --check
          git commit -m "fix(catalog): prevent stale metadata during cutover"
          git push origin HEAD:infra/cloudflare-catalog-cache-hardening
