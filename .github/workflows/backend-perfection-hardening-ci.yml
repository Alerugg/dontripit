name: Backend Perfection Hardening CI

on:
  push:
    branches:
      - backend/perfection-hardening-20260911
    paths:
      - 'backend/app/search_v2/**'
      - 'backend/app/routes/search_v2.py'
      - 'backend/app/routes/market_print_summary.py'
      - 'backend/app/ingest/**'
      - 'backend/app/scripts/audit_search_v2_production_latency_v1.py'
      - 'backend/tests/test_search_v2_*.py'
      - 'backend/tests/test_market_print_summary_hot_path.py'
      - 'backend/tests/test_yugioh_search_v2_performance.py'
      - 'backend/tests/test_ingest_*.py'
      - 'backend/tests/test_ygoprodeck_*.py'
      - 'backend/tests/test_yugioh_*maintenance*.py'
      - 'backend/tests/test_yugioh_*growth_guard*.py'
      - 'backend/tests/test_onepiece_*connector.py'
      - 'backend/tests/test_onepiece_*self_heal.py'
      - 'backend/tests/test_tcgdex_*.py'
      - 'backend/tests/test_mtg_ingest_guardrails_v2.py'
      - 'backend/tests/test_scryfall_incremental.py'
      - '.github/workflows/backend-perfection-hardening-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-perfection-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search-certifier-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile changed search/certifier modules
        run: |
          python -m py_compile \
            app/routes/search_v2.py \
            app/routes/market_print_summary.py \
            app/search_v2/output_contract.py \
            app/search_v2/physical_metadata.py \
            app/search_v2/exhaustive_name_query.py \
            app/search_v2/onepiece_exact_collector.py \
            app/search_v2/onepiece_query.py \
            app/search_v2/mtg_query.py \
            app/search_v2/yugioh_exact_collector.py \
            app/search_v2/yugioh_fast_query.py \
            app/scripts/audit_search_v2_production_latency_v1.py
      - name: Run Search V2, routing, rarity, market hot-path and certifier hardening regression suite
        run: |
          pytest -q \
            tests/test_search_v2_yugioh_exact_collector.py \
            tests/test_search_v2_exact_identifier.py \
            tests/test_search_v2_api.py \
            tests/test_search_v2_fast_routing.py \
            tests/test_search_v2_output_contract.py \
            tests/test_search_v2_rarity_consensus.py \
            tests/test_search_v2_performance.py \
            tests/test_search_v2_production_certifier.py \
            tests/test_market_print_summary_hot_path.py \
            tests/test_yugioh_search_v2_performance.py

  ingest-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile ingest engine and production connectors
        run: |
          python -m py_compile \
            app/ingest/base.py \
            app/ingest/connectors/onepiece_canonical.py \
            app/ingest/connectors/tcgdex_pokemon_certified_refresh.py \
            app/ingest/connectors/ygoprodeck_yugioh.py \
            app/ingest/connectors/ygoprodeck_yugioh_v2.py \
            app/ingest/connectors/scryfall_mtg_v2.py
      - name: Run ingest identity, incremental and self-heal regressions
        run: |
          pytest -q \
            tests/test_ingest_source_record_prefetch.py \
            tests/test_ygoprodeck_incremental_v2.py \
            tests/test_yugioh_v2_incremental_maintenance.py \
            tests/test_yugioh_v2_snapshot_growth_guard.py \
            tests/test_onepiece_canonical_connector.py \
            tests/test_onepiece_incremental_self_heal.py \
            tests/test_tcgdex_certified_refresh.py \
            tests/test_tcgdex_certified_refresh_db_fastpath.py \
            tests/test_tcgdex_sharded_refresh.py \
            tests/test_mtg_ingest_guardrails_v2.py \
            tests/test_scryfall_incremental.py
