name: P0 Final Scheduled Master Verifier

on:
  workflow_run:
    workflows: ['Daily Catalog V2 Orchestrator']
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  verify:
    if: ${{ github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify seven children, one SHA, production health and cleaned schedule
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const master = context.payload.workflow_run;
            const selfPath = '.github/workflows/p0-final-scheduled-master-verifier.yml';
            const masterPath = '.github/workflows/daily-catalog-v2-orchestrator.yml';
            const children = [
              'refresh-onepiece-yugioh-canonical-v2.yml',
              'refresh-pokemon-canonical-v2-sharded.yml',
              'sync-cardmarket-master-production-v2.yml',
              'project-cardmarket-canonical-prices-v2.yml',
              'sync-cardmarket-website-paths.yml',
              'sync-regional-tcg-content.yml',
              'certify-search-v2-production-latency-v1.yml',
            ];

            if (master.event !== 'schedule') return;
            if (master.conclusion !== 'success') {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: 598,
                body: `### P0 scheduled master failed\n\n- master run: ${master.id}\n- conclusion: ${master.conclusion}\n- url: ${master.html_url}\n\nP0 remains blocked; no production-data writes by this verifier.`,
              });
              throw new Error(`Scheduled master ${master.id} concluded ${master.conclusion}`);
            }

            const start = Date.parse(master.created_at) - 60_000;
            const end = Date.parse(master.updated_at) + 120_000;
            const candidatesByWorkflow = new Map();

            for (const workflowId of children) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch: 'catalog-v2',
                event: 'workflow_dispatch',
                per_page: 100,
              });
              const candidates = response.data.workflow_runs
                .filter(run => {
                  const created = Date.parse(run.created_at);
                  return created >= start && created <= end;
                })
                .filter(run => run.head_branch === 'catalog-v2')
                .filter(run => run.status === 'completed' && run.conclusion === 'success');
              if (!candidates.length) {
                throw new Error(`No successful ${workflowId} child found inside master ${master.id} window`);
              }
              candidatesByWorkflow.set(workflowId, candidates);
            }

            let common = null;
            for (const workflowId of children) {
              const shas = new Set(candidatesByWorkflow.get(workflowId).map(run => run.head_sha));
              common = common === null ? shas : new Set([...common].filter(sha => shas.has(sha)));
            }
            if (!common || common.size === 0) {
              throw new Error('Seven successful children do not share a common catalog SHA');
            }

            const healthResponse = await fetch('https://api.dontripit.com/api/health', {headers: {'accept': 'application/json'}});
            if (!healthResponse.ok) {
              throw new Error(`Production health returned HTTP ${healthResponse.status}`);
            }
            const health = await healthResponse.json();
            const certifiedSha = health.revision;
            if (!health.ok || !certifiedSha || !common.has(certifiedSha)) {
              throw new Error(`Production health revision ${certifiedSha} does not match the seven-child common SHA set: ${[...common].join(', ')}`);
            }

            const evidence = [];
            for (const workflowId of children) {
              const matches = candidatesByWorkflow.get(workflowId)
                .filter(run => run.head_sha === certifiedSha)
                .sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at));
              if (!matches.length) throw new Error(`${workflowId} lacks SUCCESS on certified SHA ${certifiedSha}`);
              const run = matches[0];
              evidence.push({workflow: workflowId, run_id: run.id, conclusion: run.conclusion, head_sha: run.head_sha, url: run.html_url});
            }

            const masterFile = await github.rest.repos.getContent({owner, repo, path: masterPath, ref: 'main'});
            if (Array.isArray(masterFile.data) || !masterFile.data.content) throw new Error('Cannot read live main orchestrator');
            const masterText = Buffer.from(masterFile.data.content, 'base64').toString('utf8');
            const cronLines = masterText.split('\n').map(line => line.trim()).filter(line => line.startsWith('- cron:'));
            if (cronLines.length !== 1 || cronLines[0] !== "- cron: '20 4 * * *'") {
              throw new Error(`Temporary schedule cleanup incomplete: ${JSON.stringify(cronLines)}`);
            }

            const lines = [
              '### P0 scheduled master 7/7 certification',
              '',
              `- master run: ${master.id}`,
              `- master conclusion: ${master.conclusion}`,
              `- certified catalog SHA: ${certifiedSha}`,
              `- production health: ok=${health.ok}, revision=${health.revision}`,
              `- live schedule: ${cronLines[0]}`,
              '',
              '| Child | Run | Conclusion | SHA |',
              '|---|---:|---|---|',
              ...evidence.map(row => `| \`${row.workflow}\` | [${row.run_id}](${row.url}) | ${row.conclusion} | \`${row.head_sha}\` |`),
              '',
              'Result: **7/7 SUCCESS on one SHA; production health matches; temporary schedule removed.**',
              'Production-data writes by this verifier = 0.',
            ];

            await github.rest.issues.createComment({owner, repo, issue_number: 598, body: lines.join('\n')});

            const self = await github.rest.repos.getContent({owner, repo, path: selfPath, ref: 'main'});
            if (!Array.isArray(self.data) && self.data.sha) {
              await github.rest.repos.deleteFile({
                owner,
                repo,
                path: selfPath,
                message: 'chore(actions): remove completed P0 scheduled master verifier',
                sha: self.data.sha,
                branch: 'main',
              });
            }
