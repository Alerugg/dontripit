name: Audit Cardmarket Public Catalog Neon Delta V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_cardmarket_public_catalog_neon_delta_v1.py'
      - '.github/workflows/audit-cardmarket-public-catalog-neon-delta-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      CARDMARKET_PUBLIC_CATALOG_NEON_DELTA_OUTPUT: /tmp/cardmarket-public-catalog-neon-delta-v1/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile audit
        run: python -m py_compile app/scripts/audit_cardmarket_public_catalog_neon_delta_v1.py
      - name: Compare official Cardmarket IDs to current Neon capture
        run: |
          mkdir -p /tmp/cardmarket-public-catalog-neon-delta-v1
          python -m app.scripts.audit_cardmarket_public_catalog_neon_delta_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-public-catalog-neon-delta-v1-${{ github.run_id }}
          path: /tmp/cardmarket-public-catalog-neon-delta-v1/report.json
          retention-days: 90
          if-no-files-found: warn
