name: Production Neon Migrations

on:
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/alembic/**'
      - 'backend/alembic.ini'
      - '.github/workflows/migrate-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Checkout catalog-v2
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Show current migration revision
        run: alembic current

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify final migration revision
        run: alembic current
