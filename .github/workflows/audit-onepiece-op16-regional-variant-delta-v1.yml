name: Audit One Piece OP16 Regional Variant Delta V1
on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_onepiece_op16_regional_variant_delta_v1.py'
      - '.github/workflows/audit-onepiece-op16-regional-variant-delta-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      ONEPIECE_HTTP_TIMEOUT: '30'
      ONEPIECE_OP16_REGIONAL_DELTA_OUTPUT: /tmp/onepiece-op16-regional-variant-delta-v1.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/scripts/audit_onepiece_op16_regional_variant_delta_v1.py
      - name: Certify official EN versus JP exact physical variant delta READ ONLY
        run: python -m app.scripts.audit_onepiece_op16_regional_variant_delta_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-op16-regional-variant-delta-v1-${{ github.run_id }}
          path: /tmp/onepiece-op16-regional-variant-delta-v1.json
          retention-days: 90
          if-no-files-found: error
