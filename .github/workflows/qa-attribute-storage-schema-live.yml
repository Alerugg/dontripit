name: QA Attribute Storage Schema Live

on:
  workflow_dispatch:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/qa-attribute-storage-schema-live.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Inspect attribute tables, constraints and representative rows
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          out={}
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
            for table in ('card_attributes','print_attributes'):
              c.execute('''SELECT column_name,data_type,is_nullable,column_default
                           FROM information_schema.columns
                           WHERE table_schema='public' AND table_name=%s ORDER BY ordinal_position''',(table,))
              cols=[dict(x) for x in c.fetchall()]
              c.execute('''SELECT tc.constraint_name,tc.constraint_type,
                                  array_agg(kcu.column_name ORDER BY kcu.ordinal_position) columns
                           FROM information_schema.table_constraints tc
                           LEFT JOIN information_schema.key_column_usage kcu
                             ON kcu.constraint_name=tc.constraint_name AND kcu.table_schema=tc.table_schema
                           WHERE tc.table_schema='public' AND tc.table_name=%s
                           GROUP BY tc.constraint_name,tc.constraint_type ORDER BY tc.constraint_name''',(table,))
              constraints=[dict(x) for x in c.fetchall()]
              c.execute(f'SELECT * FROM {table} ORDER BY 1 LIMIT 3')
              samples=[dict(x) for x in c.fetchall()]
              out[table]={'columns':cols,'constraints':constraints,'samples':samples}
            c.execute('''SELECT source,count(*) rows,count(distinct pa.print_id) prints
                         FROM print_attributes pa JOIN prints p ON p.id=pa.print_id JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
                         WHERE g.slug='yugioh' GROUP BY source ORDER BY source''')
            out['yugioh_print_attribute_sources']=[dict(x) for x in c.fetchall()]
          conn.close()
          print(json.dumps(out,indent=2,ensure_ascii=False,default=str))
          PY
