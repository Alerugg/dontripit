name: Execute Yu-Gi-Oh Multilingual Production PR V1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/triggers/run-yugioh-production-execution-v1
      - .github/workflows/execute-yugioh-multilingual-production-pr-v1.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: yugioh-multilingual-production-execution-v1
  cancel-in-progress: false

jobs:
  rollout:
    if: github.head_ref == 'agent/yugioh-production-execution-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      YUGIOH_PRODUCTION_ROLLOUT_ACK: YGO_ES_JA_ROLLOUT_V1
      PREFLIGHT_RUN_ID: '32083597736'
      PREFLIGHT_ARTIFACT_ID: '9305982052'
      PREFLIGHT_ARTIFACT_SHA256: '0c59ad4ff93d0b39d96fab711d09963c7738537cb51bcd66c45087656ede763f'
      SOURCE_RUN_ID: '31915462442'
      SOURCE_ARTIFACT_ID: '9270830904'
      SOURCE_ARTIFACT_SHA256: '7c2cb875c49d857d2b016786b8a45cb6ec3614568876dbcd38f14aae829bcc45'
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout one-shot execution branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Download immutable successful preflight and fresh source
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/preflight evidence/fresh "$RUNNER_TEMP/ygojson-fresh/extracted"

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs/${PREFLIGHT_RUN_ID}" \
            | jq -e '.status == "completed" and .conclusion == "success" and .name == "Certify Yu-Gi-Oh Multilingual Rollout Preflight V1"' >/dev/null
          curl --fail --location --silent --show-error "${auth[@]}" \
            --output "$RUNNER_TEMP/preflight-artifact.zip" \
            "${api}/actions/artifacts/${PREFLIGHT_ARTIFACT_ID}/zip"
          echo "${PREFLIGHT_ARTIFACT_SHA256}  $RUNNER_TEMP/preflight-artifact.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/preflight-artifact.zip" -d evidence/preflight
          test -s evidence/preflight/yugioh-multilingual-rollout-preflight-fresh.json
          test -s evidence/preflight/yugioh-multilingual-rollout-readiness-v1.json
          test -s evidence/preflight/yugioh-yaml-yugi-cards-sha256-preflight.txt
          test -s evidence/preflight/yugioh-yaml-yugi-source-meta-preflight.json

          curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs/${SOURCE_RUN_ID}" \
            | jq -e '.status == "completed" and .conclusion == "success" and .name == "Shadow YGOJSON Full Refresh V1"' >/dev/null
          curl --fail --location --silent --show-error "${auth[@]}" \
            --output "$RUNNER_TEMP/source-artifact.zip" \
            "${api}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"
          echo "${SOURCE_ARTIFACT_SHA256}  $RUNNER_TEMP/source-artifact.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/source-artifact.zip" -d evidence/fresh
          test -s evidence/fresh/ygojson-shadow-fresh-aggregate-v1.zip
          unzip -q evidence/fresh/ygojson-shadow-fresh-aggregate-v1.zip -d "$RUNNER_TEMP/ygojson-fresh/extracted"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/cards.json"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/sets.json"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/meta.json"

      - name: Fetch YAML Yugi and require exact preflight hash
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yaml-yugi"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/yaml-yugi/cards.json" \
            https://dawnbrandbots.github.io/yaml-yugi/cards.json
          actual="$(sha256sum "$RUNNER_TEMP/yaml-yugi/cards.json" | awk '{print $1}')"
          expected="$(awk '{print $1}' evidence/preflight/yugioh-yaml-yugi-cards-sha256-preflight.txt)"
          test "$actual" = "$expected"
          cp evidence/preflight/yugioh-yaml-yugi-source-meta-preflight.json "$RUNNER_TEMP/yaml-yugi/source-meta.json"

      - name: Compile hardened production writers
        run: |
          python -m py_compile \
            app/scripts/rollout_yugioh_multilingual_production_v1.py \
            app/scripts/rollout_yugioh_multilingual_production_v2.py

      - name: Dry-run against live schema and live catalog
        run: |
          python -m app.scripts.rollout_yugioh_multilingual_production_v2 \
            --input-dir "$RUNNER_TEMP/ygojson-fresh/extracted" \
            --yaml-yugi-cards "$RUNNER_TEMP/yaml-yugi/cards.json" \
            --yaml-yugi-meta "$RUNNER_TEMP/yaml-yugi/source-meta.json" \
            --fresh-certificate ../evidence/preflight/yugioh-multilingual-rollout-preflight-fresh.json \
            --readiness ../evidence/preflight/yugioh-multilingual-rollout-readiness-v1.json \
            --output ../evidence/yugioh-multilingual-production-dry-run-v1.json

      - name: Apply one atomic ES/JA production transaction
        run: |
          python -m app.scripts.rollout_yugioh_multilingual_production_v2 \
            --input-dir "$RUNNER_TEMP/ygojson-fresh/extracted" \
            --yaml-yugi-cards "$RUNNER_TEMP/yaml-yugi/cards.json" \
            --yaml-yugi-meta "$RUNNER_TEMP/yaml-yugi/source-meta.json" \
            --fresh-certificate ../evidence/preflight/yugioh-multilingual-rollout-preflight-fresh.json \
            --readiness ../evidence/preflight/yugioh-multilingual-rollout-readiness-v1.json \
            --output ../evidence/yugioh-multilingual-production-v1.json \
            --apply

      - name: Enforce committed rollout evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('../evidence/yugioh-multilingual-production-v1.json').read_text())
          assert r['status'] == 'pass', r
          assert r['runner_version'] == 2, r
          assert r['commit_confirmed'] is True, r
          assert r['pass2_zero_writes'] is True, r
          assert r['logical_cards_created'] == 0, r
          assert r['economics_untouched'] is True, r
          assert r['invariants']['status'] == 'pass', r
          assert r['validation']['status'] == 'pass' and all(r['validation']['gates'].values()), r
          PY

      - name: Upload immutable production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-multilingual-production-pr-v1-${{ github.run_id }}
          path: |
            evidence/yugioh-multilingual-production-dry-run-v1.json
            evidence/yugioh-multilingual-production-v1.json
            evidence/preflight/yugioh-multilingual-rollout-preflight-fresh.json
            evidence/preflight/yugioh-multilingual-rollout-readiness-v1.json
          retention-days: 180
          if-no-files-found: warn
