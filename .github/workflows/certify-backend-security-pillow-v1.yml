name: Certify Backend Security Pillow V1

on:
  push:
    branches: ['fix/security-pillow-12-3-v1']
    paths:
      - 'backend/requirements.txt'
      - '.github/workflows/certify-backend-security-pillow-v1.yml'
  pull_request:
    branches: [catalog-v2]
    paths:
      - 'backend/requirements.txt'
      - '.github/workflows/certify-backend-security-pillow-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Pillow candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout catalog-v2 baseline
        uses: actions/checkout@v4
        with:
          ref: catalog-v2
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated baseline and candidate environments
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/pillow-base
          python -m venv /tmp/pillow-candidate
          /tmp/pillow-base/bin/pip install --disable-pip-version-check -r baseline/backend/requirements.txt 'ijson==3.4.0.post0'
          /tmp/pillow-candidate/bin/pip install --disable-pip-version-check -r candidate/backend/requirements.txt 'ijson==3.4.0.post0'
          test "$(/tmp/pillow-base/bin/python -c 'import PIL; print(PIL.__version__)')" = "11.3.0"
          test "$(/tmp/pillow-candidate/bin/python -c 'import PIL; print(PIL.__version__)')" = "12.3.0"
      - name: Run full suite on baseline and candidate and require no regression
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          set +e
          (
            cd baseline/backend
            /tmp/pillow-base/bin/pytest -q --tb=short 2>&1 | tee ../../artifacts/pytest-baseline.txt
            exit ${PIPESTATUS[0]}
          )
          base_status=$?
          (
            cd candidate/backend
            /tmp/pillow-candidate/bin/pytest -q --tb=short 2>&1 | tee ../../artifacts/pytest-candidate.txt
            exit ${PIPESTATUS[0]}
          )
          candidate_status=$?
          set -e
          echo "$base_status" > artifacts/pytest-baseline.exit
          echo "$candidate_status" > artifacts/pytest-candidate.exit
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('artifacts')
          def parse(name):
              text=(root/name).read_text(errors='replace')
              failed=sorted(set(re.findall(r'^FAILED\s+([^\s]+)', text, flags=re.M)))
              summary=re.findall(r'(?m)^.*\b\d+ failed, \d+ passed.*$', text)
              return {'failed_nodeids':failed,'summary':summary[-1] if summary else None}
          base=parse('pytest-baseline.txt')
          cand=parse('pytest-candidate.txt')
          base_exit=int((root/'pytest-baseline.exit').read_text().strip())
          cand_exit=int((root/'pytest-candidate.exit').read_text().strip())
          report={
              'baseline_pillow':'11.3.0',
              'candidate_pillow':'12.3.0',
              'baseline_exit':base_exit,
              'candidate_exit':cand_exit,
              'baseline':base,
              'candidate':cand,
              'same_failed_nodeids':base['failed_nodeids']==cand['failed_nodeids'],
              'same_exit_semantics':(base_exit == 0) == (cand_exit == 0),
              'new_failures':sorted(set(cand['failed_nodeids'])-set(base['failed_nodeids'])),
              'resolved_failures':sorted(set(base['failed_nodeids'])-set(cand['failed_nodeids'])),
          }
          (root/'pillow-suite-differential-v1.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          if not report['same_failed_nodeids'] or not report['same_exit_semantics']:
              raise SystemExit('Pillow candidate changed full-suite behavior')
          PY
      - name: Require clean production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pillow-candidate/bin/pip install --disable-pip-version-check pip-audit
          /tmp/pillow-candidate/bin/pip-audit -r candidate/backend/requirements.txt -f json -o artifacts/backend-pip-audit-pillow-v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/backend-pip-audit-pillow-v1.json').read_text())
          vulns=[]
          for dep in data.get('dependencies',[]):
              for vuln in dep.get('vulns') or []:
                  vulns.append({'name':dep.get('name'),'version':dep.get('version'),'id':vuln.get('id')})
          print(json.dumps({'known_vulnerabilities':len(vulns),'vulns':vulns},indent=2))
          if vulns:
              raise SystemExit(f'candidate still has {len(vulns)} known vulnerabilities')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-pillow-v1-${{ github.run_id }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: warn
