name: Certify Backend Security Pillow V1

on:
  push:
    branches: ['fix/security-pillow-12-3-v1']
    paths:
      - 'backend/requirements.txt'
      - '.github/workflows/certify-backend-security-pillow-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install exact backend requirements
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run full backend test suite
        working-directory: backend
        run: pytest -q
      - name: Require clean dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          mkdir -p artifacts
          pip-audit -r backend/requirements.txt -f json -o artifacts/backend-pip-audit-pillow-v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-pillow-v1-${{ github.run_id }}
          path: artifacts/backend-pip-audit-pillow-v1.json
          retention-days: 30
          if-no-files-found: warn
