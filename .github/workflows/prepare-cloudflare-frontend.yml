name: Prepare Cloudflare frontend migration

on:
  push:
    branches:
      - infra/cloudflare-frontend-production-parity
    paths:
      - '.github/workflows/prepare-cloudflare-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTERNAL_API_BASE_URL: https://api.dontripit.com
      INTERNAL_API_KEY: migration-build-placeholder
      NEXT_PUBLIC_SITE_NAME: Don’tRipIt
    steps:
      - name: Checkout production-parity frontend
        uses: actions/checkout@v4
        with:
          ref: infra/cloudflare-frontend-production-parity

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install current frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Bootstrap Vite for vinext initializer
        working-directory: frontend
        run: npm install --no-save vite

      - name: Initialize vinext for Cloudflare
        working-directory: frontend
        env:
          CI: '1'
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: npx --yes vinext init --skip-check --platform=cloudflare

      - name: Pin React server runtime to production React line
        working-directory: frontend
        run: npm install --save-exact react-server-dom-webpack@19.2.8

      - name: Convert Next config to ESM without changing behavior
        working-directory: frontend
        run: |
          cat > next.config.js <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            turbopack: {
              root: import.meta.dirname,
            },
            outputFileTracingRoot: import.meta.dirname,
            images: {
              remotePatterns: [
                { protocol: 'https', hostname: 'cards.scryfall.io' },
                { protocol: 'https', hostname: 'en.onepiece-cardgame.com' },
                { protocol: 'https', hostname: 'assets.tcgdex.net' },
                { protocol: 'https', hostname: 'images.ygoprodeck.com' },
                { protocol: 'https', hostname: 'images.riftbound.cards' },
              ],
            },
            async headers() {
              const securityHeaders = [
                { key: 'Content-Security-Policy', value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https://cards.scryfall.io https://en.onepiece-cardgame.com https://assets.tcgdex.net https://images.ygoprodeck.com https://images.riftbound.cards; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.dontripit.com; upgrade-insecure-requests" },
                { key: 'Referrer-Policy', value: 'strict-origin-when-cross-origin' },
                { key: 'X-Content-Type-Options', value: 'nosniff' },
                { key: 'X-Frame-Options', value: 'DENY' },
                { key: 'Permissions-Policy', value: 'camera=(), microphone=(), geolocation=(), payment=()' },
                { key: 'Cross-Origin-Opener-Policy', value: 'same-origin' },
              ]
              return [{ source: '/:path*', headers: securityHeaders }]
            },
          }

          export default nextConfig
          EOF

      - name: Build with vinext
        working-directory: frontend
        run: npm run build:vinext

      - name: Verify traditional Next.js build still works
        working-directory: frontend
        run: npm run build

      - name: Show generated migration files
        run: |
          git status --short
          git diff --stat

      - name: Commit validated migration config
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend
          if git diff --cached --quiet; then
            echo 'No frontend migration changes to commit.'
            exit 0
          fi
          git commit -m 'infra(cloudflare): initialize vinext frontend'
          git push origin HEAD:infra/cloudflare-frontend-production-parity
