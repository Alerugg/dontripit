name: Remote Source Probe

on:
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/scripts/source_probe.py'
      - 'backend/app/ingest/registry.py'
      - 'backend/app/ingest/connectors/onepiece.py'
      - 'backend/app/ingest/connectors/scryfall_mtg.py'
      - 'backend/app/ingest/connectors/scryfall_mtg_v2.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon.py'
      - 'backend/app/ingest/connectors/ygoprodeck_yugioh.py'
      - 'backend/app/ingest/connectors/ygoprodeck_yugioh_v2.py'
      - 'backend/app/ingest/connectors/riftbound.py'
      - 'backend/app/ingest/connectors/riftbound_official.py'
      - 'backend/app/ingest/connectors/riftbound_fallback.py'
      - '.github/workflows/source-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ONEPIECE_SOURCE: remote
      RIFTBOUND_API_BASE_URL: ${{ secrets.RIFTBOUND_API_BASE_URL }}
      RIFTBOUND_API_KEY: ${{ secrets.RIFTBOUND_API_KEY }}
      RIFTBOUND_FALLBACK_BASE_URL: ${{ secrets.RIFTBOUND_FALLBACK_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe remote catalog sources without database writes
        run: |
          set -o pipefail
          python -u -m app.scripts.source_probe | tee source-probe.json

      - name: Upload source probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-probe-${{ github.sha }}
          path: backend/source-probe.json
          retention-days: 14
          if-no-files-found: ignore
