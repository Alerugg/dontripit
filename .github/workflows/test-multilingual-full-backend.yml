name: Multilingual full backend regression

on:
  push:
    branches:
      - multilingual-v1
    paths:
      - '.github/workflows/test-multilingual-full-backend.yml'
      - '.github/multilingual-full-backend-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multilingual-full-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact sandbox commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend package
        run: python -m compileall -q app

      - name: Run full backend test suite
        env:
          PYTHONPATH: .
          PUBLIC_API_ENABLED: 'false'
        run: pytest -q
