name: Audit One Piece DON Image Crosswalk V2

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_onepiece_don_image_crosswalk_v2.py'
      - '.github/workflows/audit-onepiece-don-image-crosswalk-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PGOPTIONS: -c default_transaction_read_only=on
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install read-only image audit dependencies
        run: |
          pip install --disable-pip-version-check psycopg2-binary==2.9.9 'pypdf[image]==5.9.0' Pillow ImageHash
      - name: Compile image crosswalk auditor
        run: python -m py_compile app/scripts/audit_onepiece_don_image_crosswalk_v2.py
      - name: Audit production Neon and source images read-only
        env:
          ONEPIECE_DON_IMAGE_AUDIT_OUTPUT: artifacts/onepiece-don-image-crosswalk-v2.json
        run: |
          mkdir -p artifacts
          python app/scripts/audit_onepiece_don_image_crosswalk_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-don-image-crosswalk-v2-${{ github.run_id }}
          path: backend/artifacts/onepiece-don-image-crosswalk-v2.json
          retention-days: 90
