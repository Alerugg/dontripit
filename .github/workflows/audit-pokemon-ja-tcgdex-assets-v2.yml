name: Audit Pokemon JA TCGdex Assets V2

on:
  pull_request:
    paths:
      - '.github/workflows/audit-pokemon-ja-tcgdex-assets-v2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      TCGDEX_CARDS_SHA: 771a8381c57c73182b9776657a15cd1166c66d36
      TCGDEX_CARDS_REPO: ${{ github.workspace }}/tcgdex-cards
      OUTPUT: backend/artifacts/pokemon-ja-tcgdex-assets-v2.json

    steps:
      - name: Checkout Dontripit
        uses: actions/checkout@v4
      - name: Checkout pinned TCGdex source
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 771a8381c57c73182b9776657a15cd1166c66d36
          path: tcgdex-cards
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Validate JA production path rule and probe 4,862 exact assets - READ ONLY
        env:
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          test "$(git -C "$TCGDEX_CARDS_REPO" rev-parse HEAD)" = "$TCGDEX_CARDS_SHA"
          python - <<'PY'
          import json, os, re, time
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import requests
          from sqlalchemy import create_engine, text

          ROOT=Path(os.environ['TCGDEX_CARDS_REPO'])/'data-asia'
          PIN=os.environ['TCGDEX_CARDS_SHA']
          ID_RE=re.compile(r'\bid\s*:\s*["\']([^"\']+)["\']')

          set_to_series={}; source_files={}
          for path in ROOT.rglob('*.ts'):
              rel=path.relative_to(ROOT)
              if len(rel.parts)<2:
                  continue
              try: content=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if 'import { Set }' not in content or 'import serie from' not in content:
                  continue
              m=ID_RE.search(content)
              if not m: continue
              set_id=m.group(1)
              series_file=ROOT/f'{rel.parts[0]}.ts'
              if not series_file.exists(): continue
              try: series_content=series_file.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              sm=ID_RE.search(series_content)
              if not sm: continue
              series_id=sm.group(1)
              prior=set_to_series.get(set_id)
              if prior and prior!=series_id:
                  raise RuntimeError(f'conflicting series for {set_id}: {prior} vs {series_id}')
              set_to_series[set_id]=series_id
              source_files[set_id]=str(rel)
          if len(set_to_series)<100:
              raise RuntimeError(f'implausibly small Asia set index: {len(set_to_series)}')
          set_ids=sorted(set_to_series,key=len,reverse=True)

          engine=create_engine(os.environ['DATABASE_URL_UNPOOLED'],pool_pre_ping=True)
          with engine.connect() as conn:
              conn.execute(text('SET TRANSACTION READ ONLY'))
              if conn.execute(text('SHOW transaction_read_only')).scalar_one()!='on':
                  raise RuntimeError('audit connection is not read-only')

              existing=[dict(r) for r in conn.execute(text('''
                SELECT p.id print_id,p.variant,p.collector_number,im.url,im.is_primary,
                       ids.cnt ja_identifier_count,ids.external_id
                FROM prints p JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
                JOIN print_images im ON im.print_id=p.id
                LEFT JOIN LATERAL (
                  SELECT COUNT(*)::int cnt,MIN(pi.external_id) external_id
                  FROM print_identifiers pi WHERE pi.print_id=p.id AND pi.source='tcgdex:ja'
                ) ids ON TRUE
                WHERE g.slug='pokemon' AND p.language='ja' AND im.source='tcgdex:ja'
                ORDER BY p.id,im.id
              ''')).mappings().all()]

              missing=[dict(r) for r in conn.execute(text('''
                SELECT p.id print_id,p.variant,p.collector_number,p.print_key,c.name card_name,
                       s.code set_code,s.name set_name,ids.cnt ja_identifier_count,ids.external_id
                FROM prints p JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
                LEFT JOIN sets s ON s.id=p.set_id
                LEFT JOIN LATERAL (
                  SELECT COUNT(*)::int cnt,MIN(pi.external_id) external_id
                  FROM print_identifiers pi WHERE pi.print_id=p.id AND pi.source='tcgdex:ja'
                ) ids ON TRUE
                WHERE g.slug='pokemon' AND p.language='ja'
                  AND NOT EXISTS(SELECT 1 FROM print_images im WHERE im.print_id=p.id)
                ORDER BY p.id
              ''')).mappings().all()]
              conn.rollback()

          if len(existing)!=3297: raise RuntimeError(f'JA existing baseline drift: {len(existing)}')
          if len(missing)!=4862: raise RuntimeError(f'JA missing baseline drift: {len(missing)}')

          existing_errors=[]
          for row in existing:
              if row.get('variant')!='default' or int(row.get('ja_identifier_count') or 0)!=1 or not row.get('external_id') or not bool(row.get('is_primary')):
                  existing_errors.append({'print_id':row['print_id'],'reason':'identity-shape'}); continue
              ext=str(row['external_id'])
              sid=next((x for x in set_ids if ext.startswith(x+'-')),None)
              if not sid:
                  existing_errors.append({'print_id':row['print_id'],'reason':'no-source-set','external_id':ext}); continue
              local=ext[len(sid)+1:]
              expected=f'https://assets.tcgdex.net/ja/{set_to_series[sid]}/{sid}/{local}/high.webp'
              if str(row.get('url') or '')!=expected:
                  existing_errors.append({'print_id':row['print_id'],'external_id':ext,'actual':row.get('url'),'expected':expected})
          if existing_errors:
              raise RuntimeError(f'existing JA source/path violations: {existing_errors[:20]} total={len(existing_errors)}')

          candidates=[]; mapping_errors=[]
          for row in missing:
              if row.get('variant')!='default' or int(row.get('ja_identifier_count') or 0)!=1 or not row.get('external_id'):
                  mapping_errors.append({'print_id':row['print_id'],'reason':'identity-shape'}); continue
              ext=str(row['external_id'])
              sid=next((x for x in set_ids if ext.startswith(x+'-')),None)
              if not sid:
                  mapping_errors.append({'print_id':row['print_id'],'reason':'no-source-set','external_id':ext,'set_code':row.get('set_code')}); continue
              local=ext[len(sid)+1:]
              if not local:
                  mapping_errors.append({'print_id':row['print_id'],'reason':'empty-local','external_id':ext}); continue
              series=set_to_series[sid]
              candidates.append({
                'print_id':int(row['print_id']),'external_id':ext,'collector_number':row.get('collector_number'),
                'set_code':row.get('set_code'),'card_name':row.get('card_name'),'canonical_set_id':sid,
                'series_id':series,'local_id':local,'source_file':source_files.get(sid),
                'url':f'https://assets.tcgdex.net/ja/{series}/{sid}/{local}/high.webp',
              })

          if mapping_errors:
              raise RuntimeError(f'JA exact source mapping violations: {mapping_errors[:20]} total={len(mapping_errors)}')
          if len(candidates)!=4862:
              raise RuntimeError(f'JA candidate coverage mismatch: {len(candidates)}')

          def probe_once(item):
              try:
                  r=requests.get(item['url'],headers={
                    'User-Agent':'Dontripit Pokemon JA exact asset auditor/2.0',
                    'Accept':'image/webp,image/*;q=0.9,*/*;q=0.1',
                  },timeout=18,stream=True)
                  ctype=str(r.headers.get('Content-Type') or '').lower()
                  prefix=next(r.iter_content(32),b'') if r.status_code==200 else b''
                  return {**item,'status':r.status_code,'content_type':ctype,'prefix_hex':prefix[:12].hex(),'image_ok':r.status_code==200 and ctype.startswith('image/') and bool(prefix)}
              except Exception as exc:
                  return {**item,'status':type(exc).__name__,'error':str(exc),'image_ok':False}
          def probe(item):
              last=None
              for attempt in range(3):
                  last=probe_once(item); last['attempt']=attempt+1
                  if last.get('image_ok'): return last
                  if last.get('status') not in (429,500,502,503,504): return last
                  time.sleep(attempt+1)
              return last

          results=[]
          with ThreadPoolExecutor(max_workers=24) as pool:
              for f in as_completed([pool.submit(probe,x) for x in candidates]): results.append(f.result())
          results.sort(key=lambda x:x['print_id'])
          verified=[r for r in results if r.get('image_ok')]

          per_set={}
          for code in sorted({str(r.get('set_code')) for r in results}):
              subset=[r for r in results if str(r.get('set_code'))==code]
              per_set[code]={
                'count':len(subset),'canonical_set_ids':sorted({r['canonical_set_id'] for r in subset}),
                'status_counts':dict(Counter(str(x.get('status')) for x in subset)),
                'verified_images':sum(1 for x in subset if x.get('image_ok')),
              }

          report={
            'status':'pass','mode':'read-only-ja-source-backed-probe','production_writes':0,
            'source_version':PIN,'asia_sets_indexed':len(set_to_series),
            'existing_ja_image_rows_validated':len(existing),'residual_total':len(missing),
            'exact_ja_candidates':len(candidates),'probe_status_counts':dict(Counter(str(r.get('status')) for r in results)),
            'verified_images':len(verified),'per_set':per_set,
            'verified_manifest':[{'print_id':r['print_id'],'external_id':r['external_id'],'url':r['url'],'set_code':r.get('set_code')} for r in verified],
            'all_probe_results':results,
          }
          out=Path(os.environ['OUTPUT']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False,default=str)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k not in ('verified_manifest','all_probe_results','per_set')},indent=2,sort_keys=True,ensure_ascii=False,default=str))
          print(json.dumps({'top_verified_sets':sorted([(k,v['verified_images']) for k,v in per_set.items() if v['verified_images']],key=lambda x:(-x[1],x[0]))[:50]},indent=2,ensure_ascii=False))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-ja-tcgdex-assets-v2-${{ github.run_id }}
          path: backend/artifacts/pokemon-ja-tcgdex-assets-v2.json
          retention-days: 30
