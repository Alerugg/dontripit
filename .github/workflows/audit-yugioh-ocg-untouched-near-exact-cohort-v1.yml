name: Audit Yu-Gi-Oh OCG Untouched Near Exact Cohort V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_untouched_near_exact_cohort_v1.py'
      - '.github/workflows/audit-yugioh-ocg-untouched-near-exact-cohort-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_UNTOUCHED_NEAR_EXACT_OUTPUT: /tmp/ygo-ocg-untouched-near-exact-v1/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile untouched near-exact screen
        run: python -m py_compile app/scripts/audit_yugioh_ocg_untouched_near_exact_cohort_v1.py
      - name: READ ONLY screen current untouched near-exact OCG surfaces
        run: |
          mkdir -p /tmp/ygo-ocg-untouched-near-exact-v1
          python -m app.scripts.audit_yugioh_ocg_untouched_near_exact_cohort_v1
      - name: Require safe partition report
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-untouched-near-exact-v1/report.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['screened_targets']==31,p
          assert p['certified_targets']+p['rejected_targets']==31,p
          assert len({x['external_product_id'] for x in p['proposal']})==p['certified_singleton_pairs'],p
          assert len({x['print_id'] for x in p['proposal']})==p['certified_singleton_pairs'],p
          print(json.dumps({
            'certified_targets':p['certified_targets'],
            'rejected_targets':p['rejected_targets'],
            'singleton_pairs':p['certified_singleton_pairs'],
            'variant_groups':p['certified_variant_groups'],
            'variant_physical':p['certified_variant_physical'],
            'stable_sha256':p['stable_singleton_identity_sha256'],
            'certified':[{'set':x['set_code'],'exp':x['idExpansion'],'singletons':x['singleton_pairs'],'variants':x['variant_physical'],'outside':len(x['outside_products'])} for x in p['certified']],
            'rejected':[{'set':x['set_code'],'exp':x['idExpansion'],'reasons':x['reasons']} for x in p['rejected']]
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-untouched-near-exact-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-untouched-near-exact-v1/report.json
          retention-days: 90
          if-no-files-found: error
