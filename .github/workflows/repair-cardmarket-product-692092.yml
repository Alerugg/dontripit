name: Repair Cardmarket Product 692092

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/repair-cardmarket-product-692092.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Promote independently verified exact identity
        run: |
          python - <<'PY'
          import json,os
          import psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          try:
              with conn.cursor(cursor_factory=RealDictCursor) as c:
                  c.execute('''
                    SELECT e.id external_product_id,e.external_id,e.name,e.category,g.slug,
                           l.id link_id,l.product_variant_id,p.id product_id,p.name canonical_name,p.product_type,
                           g2.slug canonical_game,pv.language,pv.region,pv.packaging
                    FROM external_catalog_products e
                    JOIN games g ON g.id=e.game_id
                    JOIN external_catalog_product_variant_links l ON l.external_product_id=e.id AND l.link_status='accepted'
                    JOIN product_variants pv ON pv.id=l.product_variant_id
                    JOIN products p ON p.id=pv.product_id
                    JOIN games g2 ON g2.id=p.game_id
                    WHERE e.source='cardmarket' AND e.product_group='non_single'
                      AND e.external_id='692092'
                      AND e.last_seen_at=(SELECT max(last_seen_at) FROM external_catalog_products WHERE source='cardmarket')
                  ''')
                  rows=c.fetchall()
                  if len(rows)!=1:
                      raise AssertionError({'expected_one_exact_row':len(rows),'rows':rows})
                  row=dict(rows[0])
                  expected={
                    'external_id':'692092','name':'Scarlet & Violet Booster Box','category':'Pokémon Display','slug':'pokemon',
                    'product_variant_id':1,'product_id':1,'canonical_name':'Scarlet & Violet Booster Box',
                    'product_type':'booster_box','canonical_game':'pokemon'
                  }
                  for key,value in expected.items():
                      if row.get(key)!=value:
                          raise AssertionError({'field':key,'expected':value,'actual':row.get(key),'row':row})
                  c.execute('''
                    INSERT INTO product_identifiers (product_variant_id,source,external_id)
                    VALUES (1,'cardmarket','692092')
                    ON CONFLICT (source,external_id) DO UPDATE SET product_variant_id=EXCLUDED.product_variant_id
                  ''')
                  c.execute('''
                    UPDATE external_catalog_product_variant_links
                    SET mapping_method='cardmarket_product_identity',confidence='exact',reviewed=true,
                        evidence=jsonb_build_object(
                          'source','cardmarket','idProduct','692092','category','Pokémon Display',
                          'product_type','booster_box','identity_policy','existing exact canonical product promoted to source identity',
                          'prior_mapping_method','exact_unique_name_category','prior_identifier','demo:sv1-box-en-eu'
                        ),updated_at=now()
                    WHERE id=%s
                  ''',(row['link_id'],))
                  if c.rowcount!=1:
                      raise AssertionError({'link_update_count':c.rowcount})
              conn.commit()
              print(json.dumps({'status':'promoted','idProduct':'692092','product_variant_id':1,'canonical_name':'Scarlet & Violet Booster Box'},indent=2))
          except Exception:
              conn.rollback(); raise
          finally:
              conn.close()
          PY
