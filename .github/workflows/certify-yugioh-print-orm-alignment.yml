name: Certify Yu-Gi-Oh Print ORM alignment

on:
  workflow_dispatch:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - backend/app/models.py
      - backend/alembic/versions/20260815_35_add_set_region.py
      - backend/alembic/versions/20260815_36_include_card_in_print_identity.py
      - .github/workflows/certify-yugioh-print-orm-alignment.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dontripit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dontripit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/dontripit_test
      DATABASE_URL_UNPOOLED: postgresql+psycopg2://postgres:postgres@localhost:5432/dontripit_test
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: multilingual-ygo-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply complete Alembic chain
        working-directory: backend
        run: alembic upgrade head

      - name: Compare ORM metadata with migrated PostgreSQL schema
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          from app.models import Print, Set

          expected_print_key = (
              'card_id', 'set_id', 'collector_number', 'language', 'is_foil', 'variant'
          )
          expected_lookup = (
              'set_id', 'collector_number', 'language', 'is_foil', 'variant'
          )
          expected_set_key = ('game_id', 'code', 'region')

          orm_print_constraints = {
              c.name: tuple(col.name for col in c.columns)
              for c in Print.__table__.constraints
              if c.name
          }
          orm_print_indexes = {
              i.name: tuple(col.name for col in i.columns)
              for i in Print.__table__.indexes
              if i.name
          }
          orm_set_constraints = {
              c.name: tuple(col.name for col in c.columns)
              for c in Set.__table__.constraints
              if c.name
          }

          assert orm_print_constraints.get('uq_prints_set_number_language_is_foil_variant') == expected_print_key, orm_print_constraints
          assert orm_print_indexes.get('ix_prints_set_number_language_foil_variant') == expected_lookup, orm_print_indexes
          assert orm_set_constraints.get('uq_sets_game_code_region') == expected_set_key, orm_set_constraints

          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              inspector = inspect(conn)
              db_print_constraints = {
                  c['name']: tuple(c.get('column_names') or ())
                  for c in inspector.get_unique_constraints('prints')
              }
              db_print_indexes = {
                  i['name']: tuple(i.get('column_names') or ())
                  for i in inspector.get_indexes('prints')
              }
              db_set_constraints = {
                  c['name']: tuple(c.get('column_names') or ())
                  for c in inspector.get_unique_constraints('sets')
              }

          assert db_print_constraints.get('uq_prints_set_number_language_is_foil_variant') == expected_print_key, db_print_constraints
          assert db_print_indexes.get('ix_prints_set_number_language_foil_variant') == expected_lookup, db_print_indexes
          assert db_set_constraints.get('uq_sets_game_code_region') == expected_set_key, db_set_constraints

          print('orm_print_identity=PASS')
          print('db_print_identity=PASS')
          print('legacy_lookup_index=PASS')
          print('set_region_identity=PASS')
          print('production_writes=0')
          PY

      - name: Verify Alembic head
        working-directory: backend
        run: |
          alembic current
          alembic heads
