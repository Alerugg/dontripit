name: Audit One Piece Bandai Release Layer

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-onepiece-bandai-release-layer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Inspect One Piece release provenance layer
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
            c.execute("SELECT id FROM games WHERE slug='onepiece'"); gid=int(c.fetchone()['id'])
            c.execute('''SELECT source,count(*) releases,count(distinct external_id) external_ids,
                        count(*) filter (where language='en') en_releases
                        FROM catalog_releases WHERE game_id=%s GROUP BY source ORDER BY releases DESC''',(gid,))
            sources=[dict(x) for x in c.fetchall()]
            c.execute('''SELECT id,source,external_id,name,code,release_type,release_date,language,region,metadata_json
                         FROM catalog_releases WHERE game_id=%s ORDER BY source,external_id LIMIT 500''',(gid,))
            releases=[dict(x) for x in c.fetchall()]
            c.execute('''SELECT cr.source,count(*) memberships,count(distinct pr.print_id) prints,count(distinct pr.release_id) releases
                         FROM print_releases pr JOIN catalog_releases cr ON cr.id=pr.release_id
                         WHERE cr.game_id=%s GROUP BY cr.source ORDER BY memberships DESC''',(gid,))
            memberships=[dict(x) for x in c.fetchall()]
            c.execute('''SELECT cr.source,cr.external_id,cr.name,cr.code,count(pr.id) appearances,count(distinct pr.print_id) prints
                         FROM catalog_releases cr LEFT JOIN print_releases pr ON pr.release_id=cr.id
                         WHERE cr.game_id=%s GROUP BY cr.id ORDER BY cr.source,cr.external_id''',(gid,))
            per_release=[dict(x) for x in c.fetchall()]
          conn.close()
          print('SOURCES',json.dumps(sources,indent=2,default=str))
          print('MEMBERSHIPS',json.dumps(memberships,indent=2,default=str))
          print('RELEASE_COUNT',len(releases))
          print('RELEASES',json.dumps(releases,indent=2,ensure_ascii=False,default=str))
          print('PER_RELEASE',json.dumps(per_release,indent=2,ensure_ascii=False,default=str))
          PY
