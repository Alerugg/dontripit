name: Audit Vercel Cutover Secrets

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-vercel-cutover-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-presence:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          names = [
              'VERCEL_TOKEN',
              'DATABASE_URL',
              'DATABASE_URL_UNPOOLED',
              'RESEND_API_KEY',
              'AUTH_EMAIL_FROM',
              'INTERNAL_API_KEY',
          ]
          print(json.dumps({name: bool(os.getenv(name, '').strip()) for name in names}, indent=2, sort_keys=True))
          PY
