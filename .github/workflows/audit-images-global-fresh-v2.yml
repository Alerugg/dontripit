name: Audit Images Global Fresh V2

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-images-global-fresh-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PGOPTIONS: -c default_transaction_read_only=on
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Require production database and read-only mode
        run: |
          test -n "${DATABASE_URL_UNPOOLED:-}"
          python - <<'PY'
          import os
          from sqlalchemy import text
          from app import db
          db.init_engine(os.environ['DATABASE_URL_UNPOOLED'])
          with db.SessionLocal() as session:
              session.execute(text('SET TRANSACTION READ ONLY'))
              assert session.execute(text('SHOW transaction_read_only')).scalar_one() == 'on'
              session.rollback()
          print('transaction_read_only=on')
          PY
      - name: Generate complete fresh missing-image worklist READ ONLY
        run: |
          mkdir -p artifacts
          python scripts/report_missing_images.py \
            --json artifacts/missing-images-global-fresh-v2.json \
            --csv artifacts/missing-images-global-fresh-v2.csv
      - name: Classify image debt
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          src = Path('artifacts/missing-images-global-fresh-v2.json')
          payload = json.loads(src.read_text())
          rows = payload['items']

          game_reason = defaultdict(Counter)
          game_entity = defaultdict(Counter)
          language_game = defaultdict(Counter)
          set_game = defaultdict(Counter)
          for row in rows:
              game = str(row.get('game') or 'unknown')
              game_reason[game][str(row.get('reason') or 'unknown')] += 1
              game_entity[game][str(row.get('entity_type') or 'unknown')] += 1
              if row.get('entity_type') == 'print':
                  language_game[game][str(row.get('language') or 'unknown')] += 1
                  set_game[game][str(row.get('set_code') or 'unknown')] += 1

          deterministic = {
              'canonical_print_missing_image',
              'canonical_product_variant_missing_image',
              'external_mapped_variant_missing_image',
          }
          blocked_identity = {
              'external_identity_unverified_image_unknown',
              'external_identity_ambiguous_image_unknown',
          }

          repairable = [r for r in rows if r.get('reason') in deterministic]
          identity_blocked = [r for r in rows if r.get('reason') in blocked_identity]
          unknown = [r for r in rows if r.get('reason') not in deterministic | blocked_identity]

          summary = {
              'production_writes': 0,
              'scope': payload.get('scope'),
              'missing_verified_images': len(rows),
              'entity_counts': payload.get('entity_counts'),
              'game_counts': payload.get('game_counts'),
              'reason_counts': payload.get('reason_counts'),
              'repair_class_counts': {
                  'deterministic_identity_known_or_canonical': len(repairable),
                  'blocked_identity_unverified_or_ambiguous': len(identity_blocked),
                  'other': len(unknown),
              },
              'game_reason_matrix': {g: dict(sorted(c.items())) for g, c in sorted(game_reason.items())},
              'game_entity_matrix': {g: dict(sorted(c.items())) for g, c in sorted(game_entity.items())},
              'print_language_matrix': {g: dict(sorted(c.items())) for g, c in sorted(language_game.items())},
              'top_missing_print_sets_by_game': {
                  g: [{'set_code': k, 'count': v} for k, v in c.most_common(20)]
                  for g, c in sorted(set_game.items())
              },
          }
          Path('artifacts/missing-images-global-summary-v2.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-images-global-fresh-v2-${{ github.run_id }}
          path: |
            backend/artifacts/missing-images-global-fresh-v2.json
            backend/artifacts/missing-images-global-fresh-v2.csv
            backend/artifacts/missing-images-global-summary-v2.json
          retention-days: 30
          if-no-files-found: error
