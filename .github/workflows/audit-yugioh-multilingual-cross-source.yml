name: Audit Yu-Gi-Oh multilingual cross-source reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - backend/app/scripts/audit_yugioh_multilingual_cross_source_reconciliation.py
      - .github/workflows/audit-yugioh-multilingual-cross-source.yml

permissions:
  contents: read

concurrency:
  group: audit-yugioh-multilingual-cross-source-${{ github.ref }}
  cancel-in-progress: false

env:
  YGOJSON_URL: https://github.com/iconmaster5326/YGOJSON/releases/download/v1/aggregate.zip
  YAML_YUGI_CARDS_URL: https://dawnbrandbots.github.io/yaml-yugi/cards.json
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
  PYTHONPATH: .

jobs:
  reconcile:
    name: Read-only historical/current ES JA reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: multilingual-ygo-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Download historical YGOJSON and current YAML Yugi
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ygo-cross/ygojson" "$RUNNER_TEMP/ygo-cross/yaml" artifacts
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/ygo-cross/ygojson.zip" "$YGOJSON_URL"
          unzip -q "$RUNNER_TEMP/ygo-cross/ygojson.zip" -d "$RUNNER_TEMP/ygo-cross/ygojson"
          git ls-remote https://github.com/DawnbrandBots/yaml-yugi.git refs/heads/master | awk '{print $1}' \
            > "$RUNNER_TEMP/ygo-cross/yaml/master-head.txt"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/ygo-cross/yaml/cards.json" "$YAML_YUGI_CARDS_URL"
          curl --silent --show-error --location --head "$YAML_YUGI_CARDS_URL" \
            | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^last-modified:/{sub(/^[^:]*:[ ]*/, ""); print; exit}' \
            > "$RUNNER_TEMP/ygo-cross/yaml/last-modified.txt" || true
          test -s "$RUNNER_TEMP/ygo-cross/yaml/cards.json"
          echo "yaml_head=$(cat "$RUNNER_TEMP/ygo-cross/yaml/master-head.txt")"
          echo "yaml_last_modified=$(cat "$RUNNER_TEMP/ygo-cross/yaml/last-modified.txt" 2>/dev/null || true)"

      - name: Reconcile sources against Neon in explicit read-only transaction
        shell: bash
        run: |
          set -euo pipefail
          python -m app.scripts.audit_yugioh_multilingual_cross_source_reconciliation \
            --ygojson-dir "$RUNNER_TEMP/ygo-cross/ygojson" \
            --yaml-cards "$RUNNER_TEMP/ygo-cross/yaml/cards.json" \
            --yaml-head "$(cat "$RUNNER_TEMP/ygo-cross/yaml/master-head.txt")" \
            --yaml-last-modified "$(cat "$RUNNER_TEMP/ygo-cross/yaml/last-modified.txt" 2>/dev/null || true)" \
            --report ../artifacts/yugioh-multilingual-cross-source.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-multilingual-cross-source
          path: artifacts/yugioh-multilingual-cross-source.json
          if-no-files-found: warn
          retention-days: 30
