name: Apply Yu-Gi-Oh Cardmarket DUAD Singletons V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/apply_yugioh_cardmarket_duad_singletons_v1.py'
      - '.github/workflows/apply-yugioh-cardmarket-duad-singletons-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/apply_yugioh_cardmarket_duad_singletons_v1.py'
      - '.github/workflows/apply-yugioh-cardmarket-duad-singletons-v1.yml'

permissions:
  contents: read

concurrency:
  group: yugioh-cardmarket-duad-singletons-v1
  cancel-in-progress: false

jobs:
  exact-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile DUAD singleton mapper
        run: python -m py_compile app/scripts/apply_yugioh_cardmarket_duad_singletons_v1.py
      - name: READ ONLY rebuild exact 38 singleton proposal
        run: |
          mkdir -p /tmp/ygo-duad-singletons-v1
          python -m app.scripts.apply_yugioh_cardmarket_duad_singletons_v1 \
            --report /tmp/ygo-duad-singletons-v1/proposal.json
      - name: Apply only missing certified singleton links
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_cardmarket_duad_singletons_v1 \
            --apply \
            --confirm APPLY_YUGIOH_CARDMARKET_DUAD_SINGLETONS_V1 \
            --report /tmp/ygo-duad-singletons-v1/applied.json
      - name: Project Yu-Gi-Oh Cardmarket prices
        if: github.event_name == 'push'
        run: |
          python scripts/project_cardmarket_link_prices.py \
            --game yugioh \
            --apply \
            --report /tmp/ygo-duad-singletons-v1/projection.json
      - name: Prove writer idempotency
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_cardmarket_duad_singletons_v1 \
            --apply \
            --confirm APPLY_YUGIOH_CARDMARKET_DUAD_SINGLETONS_V1 \
            --report /tmp/ygo-duad-singletons-v1/idempotency.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-duad-singletons-v1/idempotency.json'))
          assert p['production_writes'] == 0, p
          assert p['already_accepted_same_pair'] == 38, p
          assert p['new_links_ready'] == 0, p
          print(json.dumps({'idempotency':'pass','existing_same_pair':38},indent=2))
          PY
      - name: Final OCG identity regression proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json, os, psycopg2
          from psycopg2.extras import RealDictCursor
          surfaces={
            '6129':('DUAD',38),
            '6025':('ALIN',132),
            '5044':('POTE',126),
            '5421':('AGOV',98),
          }
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          conn.set_session(readonly=True,autocommit=False)
          out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              for exp,(set_code,expected) in surfaces.items():
                cur.execute("""SELECT count(*) n,count(DISTINCT e.id) products,count(DISTINCT p.id) prints
                  FROM external_catalog_print_links l
                  JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN prints p ON p.id=l.print_id
                  JOIN sets s ON s.id=p.set_id
                  WHERE e.source='cardmarket'
                    AND e.game_id=(SELECT id FROM games WHERE slug='yugioh')
                    AND e.product_group='single'
                    AND e.expansion_external_id=%s
                    AND l.link_status IN ('accepted','mapped','exact')
                    AND lower(coalesce(p.language,''))='ja'
                    AND upper(coalesce(s.code,''))=%s""",(exp,set_code))
                row=cur.fetchone()
                n=int(row['n']); products=int(row['products']); prints=int(row['prints'])
                if (n,products,prints)!=(expected,expected,expected):
                  raise SystemExit(f'{set_code} identity expected {expected}/{expected}/{expected}, got {n}/{products}/{prints}')
                cur.execute("""SELECT count(*) n
                  FROM external_catalog_print_links l
                  JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN prints p ON p.id=l.print_id
                  JOIN sets s ON s.id=p.set_id
                  WHERE e.source='cardmarket'
                    AND e.expansion_external_id=%s
                    AND l.link_status IN ('accepted','mapped','exact')
                    AND (lower(coalesce(p.language,''))<>'ja' OR upper(coalesce(s.code,''))<>%s)""",(exp,set_code))
                bad=int(cur.fetchone()['n'])
                if bad:
                  raise SystemExit(f'{set_code} wrong-language/set links: {bad}')
                out[set_code]={'accepted_ja_links':n,'unique_products':products,'unique_prints':prints,'wrong_language_or_set':bad}
              cur.execute("""SELECT count(*) n
                FROM external_catalog_print_links l
                JOIN external_catalog_products e ON e.id=l.external_product_id
                WHERE e.source='cardmarket'
                  AND e.expansion_external_id='6129'
                  AND l.link_status IN ('accepted','mapped','exact')
                  AND l.mapping_method='cardmarket_ocg_certified_unique_physical_v2'""")
              method_count=int(cur.fetchone()['n'])
              if method_count != 38:
                raise SystemExit(f'DUAD expected 38 certified singleton-method links, got {method_count}')
              out['DUAD']['certified_singleton_method_links']=method_count
          finally:
            conn.close()
          open('/tmp/ygo-duad-singletons-v1/final.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-cardmarket-duad-singletons-v1-${{ github.run_id }}
          path: /tmp/ygo-duad-singletons-v1/*.json
          retention-days: 90
          if-no-files-found: warn
