name: Backfill Pokemon V2 Exact Images V1

on:
  pull_request:
    paths:
      - '.github/workflows/backfill-pokemon-v2-exact-images-v1.yml'
      - 'backend/app/scripts/backfill_pokemon_v2_exact_images_v1.py'
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/backfill-pokemon-v2-exact-images-v1.yml'
      - 'backend/app/scripts/backfill_pokemon_v2_exact_images_v1.py'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PYTHONPATH: .
      TCGDEX_CARDS_SHA: 771a8381c57c73182b9776657a15cd1166c66d36
      TCGDEX_CARDS_REPO: ${{ github.workspace }}/tcgdex-cards
      POKEMON_V2_IMAGE_BACKFILL_OUTPUT: artifacts/pokemon-v2-exact-images-v1.json
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Dontripit
        uses: actions/checkout@v4

      - name: Checkout exact historical TCGdex source
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 771a8381c57c73182b9776657a15cd1166c66d36
          path: tcgdex-cards
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install --disable-pip-version-check -r requirements.txt

      - name: Fail-closed source uniqueness gate
        env:
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          test "$(git -C "$TCGDEX_CARDS_REPO" rev-parse HEAD)" = "$TCGDEX_CARDS_SHA"
          python - <<'PY'
          import os,re
          from collections import Counter,defaultdict
          from pathlib import Path
          from sqlalchemy import create_engine,text

          pin=os.environ['TCGDEX_CARDS_SHA']
          occurrences=Counter()
          pattern=re.compile(r'\btcgplayer\s*:\s*(\d+)\b')
          for path in (Path(os.environ['TCGDEX_CARDS_REPO'])/'data').rglob('*.ts'):
              try: content=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              for m in pattern.finditer(content): occurrences[m.group(1)]+=1

          engine=create_engine(os.environ['DATABASE_URL_UNPOOLED'],pool_pre_ping=True)
          with engine.connect() as conn:
              conn.execute(text('SET TRANSACTION READ ONLY'))
              assert conn.execute(text('SHOW transaction_read_only')).scalar_one()=='on'
              rows=[dict(r) for r in conn.execute(text('''
                SELECT p.variant,pa.source_version,pa.attributes_json,
                       (SELECT pi.external_id FROM print_identifiers pi
                        WHERE pi.print_id=p.id AND pi.source='tcgdex-variant-v2' LIMIT 1) exact_variant_id,
                       EXISTS(SELECT 1 FROM print_images im WHERE im.print_id=p.id) has_image
                FROM prints p JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
                JOIN print_attributes pa ON pa.print_id=p.id
                WHERE g.slug='pokemon' AND p.language='en' AND COALESCE(p.variant,'') LIKE 'v2-%'
              ''')).mappings().all()]
              conn.rollback()

          if len(rows)!=27241: raise RuntimeError(f'v2 universe drift: {len(rows)}')
          product_to_exact=defaultdict(set); normalized=[]
          for r in rows:
              if str(r['source_version'])!=pin: raise RuntimeError('source version drift')
              attrs=r['attributes_json']; pv=attrs['physical_variant']
              exact=f"{attrs['source_id']}#{pv['variant_hash']}"
              if r['exact_variant_id']!=exact or r['variant']!=f"v2-{pv['variant_hash']}": raise RuntimeError('exact identity drift')
              tp=pv.get('third_party') or {}; product=str(tp.get('tcgplayer')) if tp.get('tcgplayer') not in (None,'') else None
              if product: product_to_exact[product].add(exact)
              normalized.append((bool(r['has_image']),product))
          residual=[x for x in normalized if not x[0]]
          db_unique=[product for _,product in residual if product and len(product_to_exact[product])==1]
          if len(residual)!=1296: raise RuntimeError(f'residual drift: {len(residual)}')
          if len(db_unique)!=1108: raise RuntimeError(f'DB-unique drift: {len(db_unique)}')
          bad=[product for product in db_unique if occurrences[product]!=1]
          if bad: raise RuntimeError(f'{len(bad)} DB-unique products are not globally unique in pinned source')
          print({'source_version':pin,'residual':len(residual),'db_unique':len(db_unique),'upstream_unique':len(db_unique)})
          PY

      - name: PR preflight - READ ONLY
        if: github.event_name == 'pull_request'
        env:
          PGOPTIONS: -c default_transaction_read_only=on
        run: python -m app.scripts.backfill_pokemon_v2_exact_images_v1 --require-baseline

      - name: Production apply
        if: github.event_name == 'push'
        run: python -m app.scripts.backfill_pokemon_v2_exact_images_v1 --apply

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-v2-exact-images-v1-${{ github.run_id }}
          path: backend/artifacts/pokemon-v2-exact-images-v1.json
          retention-days: 30
