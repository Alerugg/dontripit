name: QA Cardmarket Current Parser

on:
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/jobs/cardmarket_prices.py'
      - 'backend/tests/test_cardmarket_current_finish_fields.py'
      - '.github/workflows/qa-cardmarket-current-parser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_cardmarket_current_finish_fields.py tests/test_cardmarket_prices.py
