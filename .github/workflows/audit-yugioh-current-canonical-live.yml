name: Audit Yu-Gi-Oh Current Canonical Source

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-yugioh-current-canonical-live.yml'
      - 'backend/app/scripts/build_yugioh_v2_snapshot_canonical.py'
      - 'backend/app/ingest/connectors/ygoprodeck_yugioh.py'
      - 'backend/app/ingest/connectors/ygoprodeck_yugioh_v2.py'
      - 'backend/tests/test_yugioh_v2_snapshot_growth_guard.py'
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-yugioh-current-canonical-live.yml'
      - 'backend/app/scripts/build_yugioh_v2_snapshot_canonical.py'
      - 'backend/app/ingest/connectors/ygoprodeck_yugioh.py'
      - 'backend/app/ingest/connectors/ygoprodeck_yugioh_v2.py'
      - 'backend/tests/test_yugioh_v2_snapshot_growth_guard.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-yugioh-current-canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Prove Yu-Gi-Oh canonical growth guards
        run: pytest -q tests/test_yugioh_v2_snapshot_growth_guard.py
      - name: Build fresh canonical snapshot from current YGOPRODeck and cardsets source
        run: python -m app.scripts.build_yugioh_v2_snapshot_canonical --output-dir /tmp/ygo-current
      - name: Compare current canonical identities to Neon
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          root = Path('/tmp/ygo-current')
          manifest = json.loads((root / 'manifest.json').read_text())

          def vals(name, key):
              with (root / name).open() as handle:
                  return {str(json.loads(line)[key]) for line in handle if line.strip()}

          source_cards = vals('cards.jsonl', 'card_key')
          source_sets = {value.lower() for value in vals('sets.jsonl', 'code')}
          source_prints = vals('prints.jsonl', 'print_key')

          engine = create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              gid = conn.execute(text("SELECT id FROM games WHERE slug='yugioh' LIMIT 1")).scalar_one()
              db_cards = {
                  str(value)
                  for value in conn.execute(
                      text("SELECT card_key FROM cards WHERE game_id=:g AND card_key IS NOT NULL"),
                      {'g': gid},
                  ).scalars()
              }
              db_sets = {
                  str(value).lower()
                  for value in conn.execute(
                      text("SELECT code FROM sets WHERE game_id=:g"),
                      {'g': gid},
                  ).scalars()
              }
              db_prints = {
                  str(value)
                  for value in conn.execute(
                      text('''
                          SELECT p.print_key
                          FROM prints p
                          JOIN cards c ON c.id=p.card_id
                          WHERE c.game_id=:g AND p.print_key IS NOT NULL
                      '''),
                      {'g': gid},
                  ).scalars()
              }

          gaps = {
              'source_cards_missing_in_neon': len(source_cards - db_cards),
              'source_sets_missing_in_neon': len(source_sets - db_sets),
              'source_prints_missing_in_neon': len(source_prints - db_prints),
              'neon_cards_not_in_current_source': len(db_cards - source_cards),
              'neon_sets_not_in_current_source': len(db_sets - source_sets),
              'neon_prints_not_in_current_source': len(db_prints - source_prints),
          }
          report = {
              'mode': 'read_only',
              'source_counts': manifest['counts'],
              'neon_counts': {
                  'cards': len(db_cards),
                  'sets': len(db_sets),
                  'prints': len(db_prints),
              },
              'gaps': gaps,
              'current_source_exactly_covered': all(
                  gaps[key] == 0
                  for key in (
                      'source_cards_missing_in_neon',
                      'source_sets_missing_in_neon',
                      'source_prints_missing_in_neon',
                  )
              ),
              'samples': {
                  'missing_cards': sorted(source_cards - db_cards)[:100],
                  'missing_sets': sorted(source_sets - db_sets)[:100],
                  'missing_prints': sorted(source_prints - db_prints)[:100],
                  'stale_cards': sorted(db_cards - source_cards)[:100],
                  'stale_sets': sorted(db_sets - source_sets)[:100],
                  'stale_prints': sorted(db_prints - source_prints)[:100],
              },
          }
          Path('/tmp/ygo-current-canonical-gap.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report['current_source_exactly_covered']:
              raise SystemExit(
                  'Current Yu-Gi-Oh canonical source is not fully covered by Neon: '
                  + json.dumps(gaps, sort_keys=True)
              )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-current-canonical-gap-${{ github.run_id }}
          path: /tmp/ygo-current-canonical-gap.json
          retention-days: 30
          if-no-files-found: warn
