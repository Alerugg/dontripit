name: Audit Demo Product Identifier Dependencies

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-demo-product-identifiers-dependencies.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Trace demo identifiers and every related product object
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          report={'demo_identifiers':[],'schema':{},'relations':{}}
          with conn,conn.cursor(cursor_factory=RealDictCursor) as cur:
            cur.execute("SELECT table_name,column_name FROM information_schema.columns WHERE table_schema='public'")
            cols={}
            for r in cur.fetchall(): cols.setdefault(r['table_name'],set()).add(r['column_name'])
            for table in ('product_identifiers','product_variants','products','external_catalog_product_variant_links','external_catalog_products','user_collection_items','user_wishlist_items','collection_items','wishlist_items'):
              if table in cols: report['schema'][table]=sorted(cols[table])

            cur.execute("SELECT * FROM product_identifiers WHERE source='demo' ORDER BY id")
            identifiers=[dict(r) for r in cur.fetchall()]
            report['demo_identifiers']=identifiers
            variant_ids=sorted({int(r['product_variant_id']) for r in identifiers if r.get('product_variant_id') is not None})
            report['variant_ids']=variant_ids

            if variant_ids:
              cur.execute('''SELECT pv.*,p.name AS product_name,p.product_type,p.game_id,p.set_id,g.slug AS game_slug,s.code AS set_code,s.name AS set_name
                FROM product_variants pv JOIN products p ON p.id=pv.product_id JOIN games g ON g.id=p.game_id LEFT JOIN sets s ON s.id=p.set_id
                WHERE pv.id=ANY(%s) ORDER BY pv.id''',(variant_ids,))
              variants=[dict(r) for r in cur.fetchall()]
              report['relations']['variants']=variants
              product_ids=sorted({int(r['product_id']) for r in variants})
              report['product_ids']=product_ids

              cur.execute("SELECT * FROM product_identifiers WHERE product_variant_id=ANY(%s) ORDER BY product_variant_id,id",(variant_ids,))
              report['relations']['all_identifiers_for_variants']=[dict(r) for r in cur.fetchall()]

              if 'external_catalog_product_variant_links' in cols:
                cur.execute('''SELECT l.*,e.source AS external_source,e.external_id,e.name AS external_name,e.product_group,e.category,e.website_path,e.last_seen_at
                  FROM external_catalog_product_variant_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                  WHERE l.product_variant_id=ANY(%s) ORDER BY l.product_variant_id,l.id''',(variant_ids,))
                report['relations']['external_links']=[dict(r) for r in cur.fetchall()]

              # Discover all foreign keys referencing the affected tables so nothing is assumed.
              cur.execute('''
                SELECT tc.table_name,kcu.column_name,ccu.table_name AS foreign_table_name,ccu.column_name AS foreign_column_name
                FROM information_schema.table_constraints tc
                JOIN information_schema.key_column_usage kcu ON tc.constraint_name=kcu.constraint_name AND tc.table_schema=kcu.table_schema
                JOIN information_schema.constraint_column_usage ccu ON ccu.constraint_name=tc.constraint_name AND ccu.table_schema=tc.table_schema
                WHERE tc.constraint_type='FOREIGN KEY' AND ccu.table_name IN ('product_variants','products','product_identifiers')
                ORDER BY ccu.table_name,tc.table_name,kcu.column_name
              ''')
              fks=[dict(r) for r in cur.fetchall()]
              report['relations']['foreign_keys']=fks
              refs=[]
              for fk in fks:
                table=fk['table_name']; col=fk['column_name']; foreign=fk['foreign_table_name']
                ids=variant_ids if foreign=='product_variants' else product_ids if foreign=='products' else [int(r['id']) for r in identifiers]
                if not ids or table=='product_identifiers': continue
                try:
                  cur.execute(f'SELECT count(*) AS count FROM {table} WHERE {col}=ANY(%s)',(ids,))
                  refs.append({**fk,'matching_rows':int(cur.fetchone()['count'])})
                except Exception as exc:
                  conn.rollback(); refs.append({**fk,'error':repr(exc)})
              report['relations']['foreign_key_reference_counts']=refs
          conn.close()
          print(json.dumps(report,indent=2,ensure_ascii=False,default=str))
          Path('/tmp/demo-product-identifier-dependencies.json').write_text(json.dumps(report,indent=2,ensure_ascii=False,default=str)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-product-identifier-dependencies-${{ github.run_id }}
          path: /tmp/demo-product-identifier-dependencies.json
          retention-days: 90
