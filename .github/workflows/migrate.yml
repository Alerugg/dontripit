name: Neon Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug env (no secrets)
        run: |
          python - <<'PY'
          import os
          print("DATABASE_URL_UNPOOLED set?", bool(os.getenv("DATABASE_URL_UNPOOLED")))
          print("DATABASE_URL set?", bool(os.getenv("DATABASE_URL")))
          PY

      - name: Run Alembic migrations
        run: alembic upgrade head
