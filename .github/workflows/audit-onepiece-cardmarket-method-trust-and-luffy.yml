name: Audit One Piece Cardmarket Method Trust and Luffy

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-onepiece-cardmarket-method-trust-and-luffy.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary
      - run: |
          python - <<'PY'
          import json, os
          from collections import defaultdict, Counter
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='onepiece'"); gid=int(cur.fetchone()['id'])
              cur.execute('''SELECT pr.print_id,cr.id release_id,cr.external_id release_external_id,cr.name release_name
                             FROM print_releases pr JOIN catalog_releases cr ON cr.id=pr.release_id
                             JOIN prints p ON p.id=pr.print_id JOIN cards c ON c.id=p.card_id WHERE c.game_id=%s''',(gid,))
              memberships=defaultdict(list); rmeta={}
              for r in cur.fetchall():
                memberships[int(r['print_id'])].append(int(r['release_id']))
                rmeta[int(r['release_id'])]={'external_id':r['release_external_id'],'name':r['release_name']}

              # The only automatic bridge seed allowed here is the inspected release-exact method.
              cur.execute('''SELECT l.print_id,l.evidence,e.external_id id_product,e.expansion_external_id
                             FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                             WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single'
                               AND l.link_status='accepted' AND l.mapping_method='bandai_release_exact' ''',(gid,))
              votes=defaultdict(Counter)
              for r in cur.fetchall():
                ev=r['evidence'] or {}; rid=ev.get('release_id') if isinstance(ev,dict) else None
                if rid is None:
                  rs=memberships.get(int(r['print_id']),[]); rid=rs[0] if len(rs)==1 else None
                if rid is not None and int(rid) in memberships.get(int(r['print_id']),[]):
                  votes[str(r['expansion_external_id'] or '')][int(rid)]+=1
              bridge={exp:next(iter(v)) for exp,v in votes.items() if len(v)==1}
              out['trusted_bridge_count']=len(bridge)
              out['pillars_release']={'id':78,**rmeta.get(78,{})}
              out['pillars_cardmarket_expansions']=[{'expansion_external_id':e,'seed_count':sum(votes[e].values())} for e,r in bridge.items() if r==78]

              # Concise evidence samples/counts by method.
              cur.execute('''SELECT l.mapping_method,count(*) n FROM external_catalog_print_links l
                             JOIN external_catalog_products e ON e.id=l.external_product_id
                             WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status='accepted'
                             GROUP BY l.mapping_method ORDER BY n DESC''',(gid,))
              methods=[dict(r) for r in cur.fetchall()]
              for m in methods:
                cur.execute('''SELECT l.print_id,l.evidence,e.external_id id_product,e.expansion_external_id,p.collector_number,p.variant,p.rarity,c.name card_name
                               FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                               JOIN prints p ON p.id=l.print_id JOIN cards c ON c.id=p.card_id
                               WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status='accepted' AND l.mapping_method=%s
                               ORDER BY l.print_id LIMIT 5''',(gid,m['mapping_method']))
                m['sample']=[dict(r) for r in cur.fetchall()]
              out['methods']=methods

              # Candidate for the user's exact physical print: same identity, current feed, and CM expansion strongly bridged to Pillars release 78.
              cur.execute('''SELECT max(last_seen_at) latest FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s''',(gid,)); latest=cur.fetchone()['latest']
              pillar_exp=[e for e,r in bridge.items() if r==78]
              cur.execute('''SELECT id external_product_id,external_id id_product,name,expansion_external_id,website_path,metacard_external_id,raw_json
                             FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s AND product_group='single' AND last_seen_at=%s
                               AND upper(name) LIKE '%%ST01-012%%' AND expansion_external_id=ANY(%s)
                             ORDER BY external_id''',(gid,latest,pillar_exp or ['__none__']))
              out['luffy_44257_pillars_candidates']=[dict(r) for r in cur.fetchall()]
              cur.execute('''SELECT l.id link_id,l.external_product_id,l.mapping_method,l.evidence,e.external_id id_product,e.expansion_external_id,e.website_path
                             FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                             WHERE l.print_id=44257 AND e.source='cardmarket' ORDER BY l.id''')
              out['luffy_44257_current_links']=[dict(r) for r in cur.fetchall()]
          finally: conn.close()
          Path('/tmp/op-method-trust-luffy.json').write_text(json.dumps(out,indent=2,default=str,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,default=str,sort_keys=True))
          PY
      - name: Persist
        run: |
          mkdir -p audit-reports
          cp /tmp/op-method-trust-luffy.json audit-reports/onepiece-cardmarket-method-trust-and-luffy.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/onepiece-cardmarket-method-trust-and-luffy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record One Piece mapping trust audit'
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op-method-trust-luffy-${{ github.run_id }}
          path: /tmp/op-method-trust-luffy.json
          retention-days: 90
