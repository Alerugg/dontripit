name: QA One Piece Cardmarket Live

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/qa-onepiece-cardmarket-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary==2.9.9
      - name: Audit live English One Piece prints
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from collections import Counter, defaultdict
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          ACCEPTED=('accepted','mapped','exact')
          UNSUPPORTED=('etched','glossy')
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          try:
              with conn.cursor(cursor_factory=RealDictCursor) as cur:
                  cur.execute('''
                      SELECT p.id AS print_id,p.collector_number,p.language,p.variant,p.is_foil,p.rarity,
                             c.name AS card_name,s.code AS set_code,s.name AS set_name
                      FROM prints p
                      JOIN cards c ON c.id=p.card_id
                      JOIN sets s ON s.id=p.set_id
                      JOIN games g ON g.id=c.game_id
                      WHERE g.slug='onepiece' AND lower(coalesce(p.language,''))='en'
                      ORDER BY lower(s.code),p.collector_number,p.id
                  ''')
                  prints=[dict(r) for r in cur.fetchall()]
                  ids=[int(r['print_id']) for r in prints]
                  if not ids: raise AssertionError('English One Piece catalog is empty')

                  cur.execute('''
                      WITH latest_prices AS (
                          SELECT external_product_id,currency,price_variant,price_low,price_mid,price_market,price_last,as_of AS price_as_of,
                                 ROW_NUMBER() OVER(PARTITION BY external_product_id,currency,price_variant ORDER BY as_of DESC,id DESC) rn
                          FROM external_market_price_snapshots
                          WHERE currency='EUR' AND price_variant IN ('nonfoil','foil')
                      )
                      SELECT l.print_id,e.id AS external_product_id,e.external_id AS cardmarket_id,e.name AS product_name,
                             e.website_path,l.mapping_method,l.confidence,l.link_status,
                             lp.price_low,lp.price_mid,lp.price_market,lp.price_last,lp.price_as_of,lp.price_variant
                      FROM external_catalog_print_links l
                      JOIN external_catalog_products e ON e.id=l.external_product_id
                      JOIN prints p ON p.id=l.print_id
                      LEFT JOIN latest_prices lp ON lp.external_product_id=e.id AND lp.rn=1
                           AND lp.price_variant=CASE WHEN p.is_foil IS TRUE THEN 'foil' ELSE 'nonfoil' END
                      WHERE l.print_id=ANY(%s) AND e.source='cardmarket' AND e.product_group='single'
                        AND l.link_status=ANY(%s)
                      ORDER BY l.print_id,e.id
                  ''',(ids,list(ACCEPTED)))
                  links=defaultdict(list)
                  for r in cur.fetchall(): links[int(r['print_id'])].append(dict(r))

                  totals=Counter(); by_set=defaultdict(Counter); by_variant=defaultdict(Counter); gaps=[]
                  for p in prints:
                      pid=int(p['print_id']); rows=links.get(pid,[])
                      product_ids={int(r['external_product_id']) for r in rows if r.get('external_product_id') is not None}
                      market=None; reason=None
                      if not rows:
                          status='unmapped'; reason='no_accepted_exact_cardmarket_mapping'
                      elif len(product_ids)!=1:
                          status='ambiguous'; reason='multiple_accepted_cardmarket_products'
                      else:
                          market=rows[0]
                          vals=(market.get('price_mid'),market.get('price_market'),market.get('price_last'),market.get('price_low'))
                          has_price=market.get('price_as_of') is not None and any(v is not None for v in vals)
                          variant=str(p.get('variant') or '').lower()
                          if any(t in variant for t in UNSUPPORTED):
                              status='mapped_unpriced'; reason='cardmarket_priceguide_cannot_separate_finish'
                          elif not has_price:
                              status='mapped_unpriced'; reason='no_current_cardmarket_priceguide_row'
                          else:
                              status='priced'
                      totals[status]+=1
                      set_code=str(p.get('set_code') or '').upper()
                      variant=str(p.get('variant') or 'default').lower()
                      by_set[set_code]['total']+=1; by_set[set_code][status]+=1
                      by_variant[variant]['total']+=1; by_variant[variant][status]+=1
                      if status!='priced':
                          gaps.append({'print_id':pid,'set_code':set_code,'collector_number':p.get('collector_number'),
                                       'card_name':p.get('card_name'),'variant':p.get('variant'),'rarity':p.get('rarity'),
                                       'status':status,'reason':reason,
                                       'cardmarket':None if market is None else {'id_product':str(market.get('cardmarket_id') or ''),
                                           'product_name':market.get('product_name'),'website_path':market.get('website_path'),
                                           'mapping_method':market.get('mapping_method')}})

                  per_set=[]
                  for set_code,c in by_set.items():
                      total=int(c['total']); priced=int(c['priced'])
                      per_set.append({'set_code':set_code,'total':total,'priced':priced,
                                      'mapped_unpriced':int(c['mapped_unpriced']),'unmapped':int(c['unmapped']),
                                      'ambiguous':int(c['ambiguous']),'coverage_percent':round(priced/total*100,2) if total else 0})
                  per_set.sort(key=lambda x:(-x['unmapped']-x['mapped_unpriced']-x['ambiguous'],x['coverage_percent'],x['set_code']))
                  per_variant=[]
                  for variant,c in by_variant.items():
                      total=int(c['total']); priced=int(c['priced'])
                      per_variant.append({'variant':variant,'total':total,'priced':priced,
                                          'mapped_unpriced':int(c['mapped_unpriced']),'unmapped':int(c['unmapped']),
                                          'ambiguous':int(c['ambiguous']),'coverage_percent':round(priced/total*100,2) if total else 0})
                  per_variant.sort(key=lambda x:(-x['unmapped']-x['mapped_unpriced']-x['ambiguous'],x['variant']))

                  total=len(prints); priced=int(totals['priced'])
                  report={'status':'completed','game':'onepiece','language':'en','total_prints':total,
                          'priced_prints':priced,'mapped_unpriced_prints':int(totals['mapped_unpriced']),
                          'unmapped_prints':int(totals['unmapped']),'ambiguous_prints':int(totals['ambiguous']),
                          'priced_coverage_percent':round(priced/total*100,2),'gap_count':len(gaps),
                          'sets_with_gaps':sum(1 for x in per_set if x['priced']<x['total']),
                          'per_set':per_set,'per_variant':per_variant,'gaps':gaps}
          finally:
              conn.close()

          out=Path('/tmp/onepiece-cardmarket-live-audit.json')
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False,default=str)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k not in ('per_set','per_variant','gaps')},indent=2))
          print('\nTOP SET GAPS:')
          print(json.dumps(report['per_set'][:40],indent=2))
          print('\nVARIANT GAPS:')
          print(json.dumps(report['per_variant'][:30],indent=2))
          print('\nFIRST 100 GAPS:')
          print(json.dumps(report['gaps'][:100],indent=2,ensure_ascii=False,default=str))
          PY
      - name: Publish coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('/tmp/onepiece-cardmarket-live-audit.json')
          if not p.exists(): print('## One Piece Cardmarket audit\nNo report produced.'); raise SystemExit(0)
          r=json.loads(p.read_text())
          print('## One Piece Cardmarket live coverage')
          print(f"- English prints: **{r['total_prints']}**")
          print(f"- Priced: **{r['priced_prints']}** ({r['priced_coverage_percent']}%)")
          print(f"- Mapped but unpriced: **{r['mapped_unpriced_prints']}**")
          print(f"- Unmapped: **{r['unmapped_prints']}**")
          print(f"- Ambiguous: **{r['ambiguous_prints']}**")
          print(f"- Sets with gaps: **{r['sets_with_gaps']}**")
          print('\n### Sets with most gaps')
          for s in r['per_set'][:20]:
              gap=s['total']-s['priced']
              if gap:
                  print(f"- `{s['set_code']}`: {s['priced']}/{s['total']} priced; {gap} gaps")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-cardmarket-live-audit-${{ github.run_id }}
          path: /tmp/onepiece-cardmarket-live-audit.json
          retention-days: 90
