name: QA Cardmarket Catalogue Audit

on:
  pull_request:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_catalog_audit.py'
      - 'backend/scripts/audit_cardmarket_catalog_mapping.py'
      - 'backend/tests/test_cardmarket_catalog_audit.py'
      - '.github/workflows/qa-cardmarket-catalog-audit.yml'
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_catalog_audit.py'
      - 'backend/scripts/audit_cardmarket_catalog_mapping.py'
      - 'backend/tests/test_cardmarket_catalog_audit.py'
      - '.github/workflows/qa-cardmarket-catalog-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Compile auditor
        working-directory: backend
        run: python -m compileall -q app/jobs/cardmarket_catalog_audit.py scripts/audit_cardmarket_catalog_mapping.py
      - name: Run read-only mapping tests
        working-directory: backend
        env:
          API_KEY_REQUIRED: 'false'
        run: pytest -q tests/test_cardmarket_catalog_audit.py --tb=short
