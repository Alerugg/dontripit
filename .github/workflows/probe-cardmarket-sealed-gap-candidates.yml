name: Probe Cardmarket Sealed Gap Candidates

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/probe-cardmarket-sealed-gap-candidates.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary
      - name: Probe canonical candidates read-only
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          TARGETS={
            'mtg': [('903009','Commander: Foundations: Deck Set',['commander','foundations','deck'])],
            'pokemon': [('903002',"Deck Crafter's Collection: Meowth ex",['deck','crafter','meowth'])],
            'yugioh': [
              ('902998','Beyond the Brave Booster',['beyond','brave','booster']),
              ('902999','Beyond the Brave Booster Box',['beyond','brave','booster']),
              ('903000','Beyond the Brave: 3-Pack Tuckbox',['beyond','brave','tuckbox']),
              ('903001','Beyond the Brave Booster Box Case (12 Boxes)',['beyond','brave','booster']),
            ],
          }
          dsn=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          conn=psycopg2.connect(dsn)
          conn.set_session(readonly=True,autocommit=True)
          out={'mode':'production_read_only','production_writes':0,'targets':[]}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id,slug FROM games WHERE slug=ANY(%s)",([*TARGETS.keys()],))
              gids={r['slug']:r['id'] for r in cur.fetchall()}
              for slug, items in TARGETS.items():
                gid=gids[slug]
                for external_id,name,tokens in items:
                  # Probe all canonical products/variants in the same game using JSONB names,
                  # so this remains resilient to schema naming changes.
                  clauses=[]; params=[gid]
                  for token in tokens:
                    clauses.append("lower(coalesce(to_jsonb(p)->>'name','')) LIKE %s")
                    params.append('%'+token.lower()+'%')
                  where=' OR '.join(clauses)
                  cur.execute(f'''
                    SELECT to_jsonb(p) product,to_jsonb(pv) variant
                    FROM products p
                    JOIN product_variants pv ON pv.product_id=p.id
                    WHERE p.game_id=%s AND ({where})
                    ORDER BY p.id,pv.id
                    LIMIT 100
                  ''',params)
                  candidates=[dict(r) for r in cur.fetchall()]
                  out['targets'].append({
                    'game':slug,'external_id':external_id,'external_name':name,
                    'tokens':tokens,'candidates':candidates,'candidate_count':len(candidates)
                  })
          finally:
            conn.close()
          Path('/tmp/cardmarket-sealed-gap-candidates.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-sealed-gap-candidates-${{ github.run_id }}
          path: /tmp/cardmarket-sealed-gap-candidates.json
          retention-days: 30
          if-no-files-found: error
