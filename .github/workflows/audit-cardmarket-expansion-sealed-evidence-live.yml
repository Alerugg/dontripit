name: Audit Cardmarket Expansion Sealed Evidence Live

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-cardmarket-expansion-sealed-evidence-live.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Derive read-only expansion candidates from current sealed products
        run: |
          python - <<'PY'
          import json, os, re, unicodedata
          from collections import defaultdict
          from pathlib import Path
          from sqlalchemy import create_engine,text

          def norm(value):
              value=unicodedata.normalize('NFKD',str(value or ''))
              value=''.join(ch for ch in value if not unicodedata.combining(ch)).casefold()
              value=value.replace('&',' and ')
              value=re.sub(r'[^a-z0-9]+',' ',value)
              return re.sub(r'\s+',' ',value).strip()

          def set_aliases(code,name,game):
              out={norm(name)}
              # Common canonical prefixes/codes are metadata, not product-name identity.
              clean=re.sub(r'^\s*[A-Za-z]{1,5}[ -]?\d{1,3}\s*[:\-–—]\s*','',str(name or '')).strip()
              out.add(norm(clean))
              out.add(norm(f'{code} {clean}'))
              if game=='onepiece':
                  out.add(norm(re.sub(r'^starter deck\s*[:\-]?\s*','',clean,flags=re.I)))
              return {x for x in out if x}

          def product_bases(name,category,game):
              raw=str(name or '').strip(); cat=str(category or '')
              bases={norm(raw)}
              suffixes=[]
              if game=='onepiece' and cat in ('One Piece Booster','One Piece Booster Boxes'):
                  suffixes=[' booster box',' booster display',' booster']
              elif game=='yugioh' and cat in ('Yugioh Booster','Yugioh Display'):
                  suffixes=[' booster display',' display',' booster box',' booster']
              for suffix in suffixes:
                  if raw.casefold().endswith(suffix):
                      bases.add(norm(raw[:-len(suffix)]))
              # Preconstructed/structure/starter deck names themselves are useful evidence.
              if game=='onepiece' and cat=='One Piece Preconstructed Decks':
                  bases.add(norm(re.sub(r'^super prerelease\s+','',raw,flags=re.I)))
              return {x for x in bases if x}

          engine=create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          report={'mode':'read_only','source':'cardmarket','games':{}}
          with engine.connect() as conn:
              latest=conn.execute(text("SELECT max(last_seen_at) FROM external_catalog_products WHERE source='cardmarket'" )).scalar_one()
              for game in ('onepiece','yugioh'):
                  sets=conn.execute(text('''
                    SELECT s.id,s.code,s.name FROM sets s JOIN games g ON g.id=s.game_id
                    WHERE g.slug=:game ORDER BY s.code
                  '''),{'game':game}).mappings().all()
                  alias_index=defaultdict(list)
                  for s in sets:
                      for alias in set_aliases(s['code'],s['name'],game): alias_index[alias].append(dict(s))
                  products=conn.execute(text('''
                    SELECT e.external_id,e.expansion_external_id,e.name,e.category
                    FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                    WHERE e.source='cardmarket' AND e.last_seen_at=:latest AND g.slug=:game
                      AND e.product_group='non_single'
                    ORDER BY e.expansion_external_id,e.external_id
                  '''),{'latest':latest,'game':game}).mappings().all()
                  grouped=defaultdict(list)
                  for p in products: grouped[str(p['expansion_external_id'] or '')].append(dict(p))

                  expansions=[]; reviewable={}
                  for expansion_id,items in sorted(grouped.items()):
                      votes=defaultdict(list)
                      evidence=[]
                      for item in items:
                          for base in product_bases(item['name'],item['category'],game):
                              matches=alias_index.get(base,[])
                              if len(matches)==1:
                                  s=matches[0]
                                  votes[int(s['id'])].append({'external_id':item['external_id'],'product':item['name'],'category':item['category'],'matched_alias':base})
                      if len(votes)==1:
                          set_id=next(iter(votes)); ev=votes[set_id]
                          matched_set=next(s for s in sets if int(s['id'])==set_id)
                          status='reviewable_sealed_consensus'
                          reviewable[expansion_id]={
                            'set_id':set_id,'set_code':matched_set['code'],'set_name':matched_set['name'],
                            'evidence_count':len(ev),'evidence':ev[:20],
                          }
                      elif len(votes)>1:
                          status='conflicting_sealed_candidates'
                      else:
                          status='no_unique_sealed_match'
                      expansions.append({
                        'expansion_id':expansion_id,'non_single_products':len(items),'status':status,
                        'candidate_sets':[
                          {'set_id':sid,'set_code':next(s['code'] for s in sets if int(s['id'])==sid),'votes':len(ev)}
                          for sid,ev in sorted(votes.items())
                        ],
                        'product_samples':[{'idProduct':x['external_id'],'name':x['name'],'category':x['category']} for x in items[:10]],
                      })
                  counts=defaultdict(int)
                  for x in expansions: counts[x['status']]+=1
                  report['games'][game]={
                    'canonical_sets':len(sets),'cardmarket_expansions_with_non_singles':len(grouped),
                    'status_counts':dict(sorted(counts.items())),
                    'reviewable_crosswalk':reviewable,
                    'expansions':expansions,
                  }
          Path('/tmp/cardmarket-expansion-sealed-evidence.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({g:{k:v for k,v in d.items() if k not in ('expansions','reviewable_crosswalk')} for g,d in report['games'].items()},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cardmarket-expansion-sealed-evidence-${{ github.run_id }}
          path: /tmp/cardmarket-expansion-sealed-evidence.json
          retention-days: 30
          if-no-files-found: error
