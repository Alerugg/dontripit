name: Certify Search V2 Rarity Consensus V1

on:
  push:
    branches:
      - fix/search-v2-rarity-consensus-v1
    paths:
      - 'backend/app/search_v2/physical_metadata.py'
      - 'backend/app/search_v2/exhaustive_name_query.py'
      - 'backend/app/scripts/audit_search_v2_rarity_consensus_live_v1.py'
      - 'backend/tests/test_search_v2_output_contract.py'
      - 'backend/tests/test_search_v2_rarity_consensus.py'
      - 'backend/tests/test_search_v2_performance.py'
      - '.github/workflows/certify-search-v2-rarity-consensus-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certify-search-v2-rarity-consensus-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile changed Search V2 modules
        run: |
          python -m py_compile app/search_v2/physical_metadata.py
          python -m py_compile app/search_v2/exhaustive_name_query.py
          python -m py_compile app/scripts/audit_search_v2_rarity_consensus_live_v1.py
      - name: Run metadata and consensus regression tests
        run: |
          pytest -q \
            tests/test_search_v2_output_contract.py \
            tests/test_search_v2_rarity_consensus.py
      - name: Run canonical-name Search V2 regression tests
        run: |
          pytest -q \
            tests/test_search_v2_api.py \
            tests/test_search_v2_performance.py \
            tests/test_pokemon_search_v2_performance.py \
            tests/test_yugioh_search_v2_performance.py
      - name: Audit live Neon identity, consensus and latency
        run: |
          mkdir -p /tmp/search-v2-rarity-consensus-live-v1
          python -m app.scripts.audit_search_v2_rarity_consensus_live_v1 \
            --base-url https://api.dontripit.com \
            --report /tmp/search-v2-rarity-consensus-live-v1/report.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/search-v2-rarity-consensus-live-v1/report.json'))
          assert p['status']=='pass', p
          assert p['production_writes']==0, p
          assert p['totals']['identity_drift']==0, p
          assert p['totals']['non_rarity_payload_drift']==0, p
          assert p['totals']['consensus_enriched'] > 0, p
          for row in p['cases']:
              if row['cards']:
                  assert row['production_first_page_identity_match'] is True, row
          print(json.dumps(p, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-v2-rarity-consensus-live-v1-${{ github.run_id }}
          path: /tmp/search-v2-rarity-consensus-live-v1/*
          retention-days: 90
          if-no-files-found: warn
