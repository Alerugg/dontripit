name: Certify Search V2 Rarity Consensus V1

on:
  push:
    branches:
      - fix/search-v2-rarity-consensus-v1
    paths:
      - 'backend/app/search_v2/physical_metadata.py'
      - 'backend/app/search_v2/exhaustive_name_query.py'
      - 'backend/tests/test_search_v2_output_contract.py'
      - 'backend/tests/test_search_v2_rarity_consensus.py'
      - '.github/workflows/certify-search-v2-rarity-consensus-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certify-search-v2-rarity-consensus-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile changed Search V2 modules
        run: |
          python -m py_compile app/search_v2/physical_metadata.py
          python -m py_compile app/search_v2/exhaustive_name_query.py
      - name: Run metadata and consensus regression tests
        run: |
          pytest -q \
            tests/test_search_v2_output_contract.py \
            tests/test_search_v2_rarity_consensus.py
      - name: Run canonical-name Search V2 regression tests
        run: |
          pytest -q \
            tests/test_search_v2_api.py \
            tests/test_search_v2_performance.py \
            tests/test_pokemon_search_v2_performance.py \
            tests/test_yugioh_search_v2_performance.py
