name: Patch Pagination Point 2 Catalog Meta

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/patch-pagination-point2-catalog-meta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch catalog metadata and deep offsets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/routes/catalog.py')
          s=p.read_text()
          old="""    # The public HUB only needs shallow, human-scale pagination. Deep catalog
    # export remains available to scoped API customers instead of being an
    # anonymous bulk-extraction endpoint.
    if _is_public_catalog_request():
        max_limit = min(max_limit, 50)
        max_offset = min(max_offset, 1_000)
"""
          new="""    # Keep page size bounded for public requests, but allow deterministic
    # deep pagination. The UI still fetches one small page at a time.
    if _is_public_catalog_request():
        max_limit = min(max_limit, 50)
        max_offset = min(max_offset, 100_000)
"""
          assert old in s
          s=s.replace(old,new,1)

          old="""def list_sets():
    q = request.args.get(\"q\", \"\").strip()
    include_legacy_ambiguous = str(request.args.get(\"include_legacy_ambiguous\", \"\")).strip().lower() in {\"1\", \"true\", \"yes\"}
    limit, offset = _pagination()
"""
          new="""def list_sets():
    q = request.args.get(\"q\", \"\").strip()
    include_meta = str(request.args.get(\"meta\", \"\")).strip().lower() in {\"1\", \"true\", \"yes\"}
    include_legacy_ambiguous = str(request.args.get(\"include_legacy_ambiguous\", \"\")).strip().lower() in {\"1\", \"true\", \"yes\"}
    limit, offset = _pagination()
"""
          assert old in s
          s=s.replace(old,new,1)

          old="""    if q:
        where.append(\"(LOWER(s.name) LIKE :q OR LOWER(s.code) LIKE :q)\")
        params[\"q\"] = f\"%{q.lower()}%\"

    where_sql = f\"WHERE {' AND '.join(where)}\" if where else \"\"
"""
          new="""    if q:
        where.append(\"(LOWER(s.name) LIKE :q OR LOWER(s.code) LIKE :q)\")
        params[\"q\"] = f\"%{q.lower()}%\"
    if game == \"onepiece\" and not q and not include_legacy_ambiguous:
        where.append(\"s.code ~* '^(op|st|eb|prb|p)-[0-9]{1,3}$'\")

    where_sql = f\"WHERE {' AND '.join(where)}\" if where else \"\"
"""
          assert old in s
          s=s.replace(old,new,1)

          marker="""    try:
        with db.SessionLocal() as session:
            rows = session.execute(sql, params).mappings().all()
    except SQLAlchemyError as error:
        return _json_error(\"sets_query_failed\", str(error), 500)
"""
          repl="""    count_sql = text(f\"SELECT COUNT(*) FROM sets s JOIN games g ON g.id=s.game_id {where_sql}\")
    try:
        with db.SessionLocal() as session:
            rows = session.execute(sql, params).mappings().all()
            total = int(session.execute(count_sql, params).scalar_one())
    except SQLAlchemyError as error:
        return _json_error(\"sets_query_failed\", str(error), 500)
"""
          assert marker in s
          s=s.replace(marker,repl,1)

          old="""    if game == \"onepiece\":
        normalized_rows = _apply_onepiece_set_name_mapping(normalized_rows)
        if not q and not include_legacy_ambiguous:
            normalized_rows = [
                row for row in normalized_rows if row.get(\"onepiece_set_classification\") != \"legacy_mixed_ambiguous\"
            ]
"""
          new="""    if game == \"onepiece\":
        normalized_rows = _apply_onepiece_set_name_mapping(normalized_rows)
"""
          assert old in s
          s=s.replace(old,new,1)

          old="""    return jsonify(payload)


@catalog_bp.get(\"/api/prints\")
"""
          new="""    if include_meta:
        return jsonify({\"items\": payload, \"total\": total, \"limit\": limit, \"offset\": offset})
    return jsonify(payload)


@catalog_bp.get(\"/api/prints\")
"""
          assert old in s
          s=s.replace(old,new,1)

          old="""def list_prints():
    set_code = request.args.get(\"set_code\", \"\").strip()
    card_id = request.args.get(\"card_id\", type=int)
    limit, offset = _pagination()
"""
          new="""def list_prints():
    set_code = request.args.get(\"set_code\", \"\").strip()
    card_id = request.args.get(\"card_id\", type=int)
    include_meta = str(request.args.get(\"meta\", \"\")).strip().lower() in {\"1\", \"true\", \"yes\"}
    limit, offset = _pagination()
"""
          assert old in s
          s=s.replace(old,new,1)

          old="""    with db.SessionLocal() as session:
        rows = session.execute(sql, params).mappings().all()
    return jsonify([dict(row) for row in rows])


@catalog_bp.get(\"/api/products\")
"""
          new="""    count_sql = text(f\"SELECT COUNT(*) FROM prints p JOIN sets s ON s.id=p.set_id JOIN games g ON g.id=s.game_id {where_sql}\")
    with db.SessionLocal() as session:
        rows = session.execute(sql, params).mappings().all()
        total = int(session.execute(count_sql, params).scalar_one())
    items = [dict(row) for row in rows]
    if include_meta:
        return jsonify({\"items\": items, \"total\": total, \"limit\": limit, \"offset\": offset})
    return jsonify(items)


@catalog_bp.get(\"/api/products\")
"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          for file in ['frontend/app/api/catalog/sets/route.js','frontend/app/api/search-v2/federated/route.js']:
              p=Path(file); s=p.read_text()
              target="params: { game, q, limit"
              if file.endswith('sets/route.js'):
                  assert "params: { game, q, limit, offset }" in s
                  s=s.replace("params: { game, q, limit, offset }", "params: { game, q, limit, offset, meta: 1 }", 1)
              else:
                  assert "params: { game, q, limit: 12, offset: 0 }" in s
                  s=s.replace("params: { game, q, limit: 12, offset: 0 }", "params: { game, q, limit: 12, offset: 0, meta: 1 }", 1)
              p.write_text(s)
          PY
      - name: Static verification
        run: |
          python -m py_compile backend/app/routes/catalog.py backend/app/routes/set_ui.py backend/app/routes/search_v2.py
          grep -q "max_offset = min(max_offset, 100_000)" backend/app/routes/catalog.py
          grep -q "include_meta" backend/app/routes/catalog.py
          grep -q "meta: 1" frontend/app/api/catalog/sets/route.js
          grep -q "sets: setsTotal" frontend/app/api/search-v2/federated/route.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/routes/catalog.py frontend/app/api/catalog/sets/route.js frontend/app/api/search-v2/federated/route.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Expose catalog pagination totals and deep offsets'
          git push origin HEAD:catalog-v2
