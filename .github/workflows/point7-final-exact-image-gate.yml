name: Point 7 Final Exact Image Gate
on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/point7-final-exact-image-gate.yml'
      - 'backend/app/routes/exact_print_output.py'
      - 'backend/app/routes/__init__.py'
      - 'backend/tests/test_exact_print_output.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Regression - sibling print image can never leak
        working-directory: backend
        run: pytest -q tests/test_exact_print_output.py
      - name: Verify application imports with exact-image guard registered
        working-directory: backend
        run: python -c "from app.main import app; print('routes', len(app.url_map._rules))"
      - name: Certify live image gaps and Pokemon variant identity
        run: |
          python - <<'PY'
          import json, os, psycopg2
          from psycopg2.extras import RealDictCursor

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
            c.execute("SET LOCAL statement_timeout='300s'")
            c.execute('''
              SELECT g.slug,
                     count(*) FILTER (WHERE NOT EXISTS (
                       SELECT 1 FROM print_images pi WHERE pi.print_id=p.id AND pi.is_primary=true
                     )) AS missing_primary
              FROM prints p
              JOIN cards ca ON ca.id=p.card_id
              JOIN games g ON g.id=ca.game_id
              WHERE g.slug=ANY(%s)
              GROUP BY g.slug ORDER BY g.slug
            ''',(['mtg','onepiece','pokemon','yugioh'],))
            gaps={r['slug']:int(r['missing_primary']) for r in c.fetchall()}

            c.execute('''
              WITH missing AS (
                SELECT p.*
                FROM prints p
                JOIN cards ca ON ca.id=p.card_id
                JOIN games g ON g.id=ca.game_id
                WHERE g.slug='pokemon'
                  AND NOT EXISTS (SELECT 1 FROM print_images pi WHERE pi.print_id=p.id AND pi.is_primary=true)
              )
              SELECT
                count(*) AS total_missing,
                count(*) FILTER (WHERE tcgdex_id IS NOT NULL) AS direct_tcgdex,
                count(*) FILTER (WHERE tcgdex_id IS NULL AND variant LIKE 'v2-%%') AS variant_missing,
                count(*) FILTER (
                  WHERE tcgdex_id IS NULL AND variant LIKE 'v2-%%'
                    AND print_key LIKE 'pokemon:tcgdex:%%:en:v2-%%'
                    AND EXISTS (
                      SELECT 1 FROM print_attributes pa
                      JOIN print_identifiers pi ON pi.print_id=missing.id AND pi.source='tcgdex-variant-v2'
                      WHERE pa.print_id=missing.id
                        AND pa.source='tcgdex/cards-database'
                        AND coalesce(pa.attributes_json->>'source_id','')<>''
                        AND coalesce(pa.attributes_json->'physical_variant'->>'variant_hash','')<>''
                        AND missing.print_key = 'pokemon:tcgdex:' || (pa.attributes_json->>'source_id') || ':en:v2-' || (pa.attributes_json->'physical_variant'->>'variant_hash')
                        AND pi.external_id = (pa.attributes_json->>'source_id') || '#' || (pa.attributes_json->'physical_variant'->>'variant_hash')
                    )
                ) AS certified_variants
              FROM missing
            ''')
            pokemon={k:int(v) for k,v in dict(c.fetchone()).items()}

            c.execute('''
              SELECT count(*) n FROM (
                SELECT print_key FROM prints
                WHERE print_key LIKE 'pokemon:tcgdex:%%:en:v2-%%'
                GROUP BY print_key HAVING count(*)>1
              ) d
            ''')
            duplicate_variant_keys=int(c.fetchone()['n'])
            c.execute('''
              SELECT count(*) n FROM (
                SELECT external_id FROM print_identifiers
                WHERE source='tcgdex-variant-v2'
                GROUP BY external_id HAVING count(*)>1
              ) d
            ''')
            duplicate_variant_ids=int(c.fetchone()['n'])

            c.execute("''" if False else '''
              SELECT count(DISTINCT pi.product_variant_id) n
              FROM product_identifiers pi
              JOIN product_variants pv ON pv.id=pi.product_variant_id
              JOIN products pr ON pr.id=pv.product_id
              JOIN games g ON g.id=pr.game_id
              WHERE pi.source='cardmarket' AND g.slug='riftbound'
            ''')
            riftbound=int(c.fetchone()['n'])
          conn.close()

          expected={'mtg':243,'onepiece':0,'pokemon':1778,'yugioh':0}
          failures=[]
          if gaps!=expected: failures.append(f'image gap classification moved: {gaps} != {expected}')
          if sum(gaps.values())!=2021: failures.append(f'total classified gaps={sum(gaps.values())} != 2021')
          if pokemon['total_missing']!=1778: failures.append(f'pokemon missing={pokemon["total_missing"]}')
          if pokemon['direct_tcgdex']!=1558: failures.append(f'direct TCGdex missing={pokemon["direct_tcgdex"]}')
          if pokemon['variant_missing']!=220: failures.append(f'variant missing={pokemon["variant_missing"]}')
          if pokemon['certified_variants']!=pokemon['variant_missing']:
            failures.append(f'variant identity certification={pokemon["certified_variants"]}/{pokemon["variant_missing"]}')
          if duplicate_variant_keys or duplicate_variant_ids:
            failures.append(f'variant duplicates keys={duplicate_variant_keys} ids={duplicate_variant_ids}')
          if riftbound: failures.append(f'riftbound Cardmarket leakage={riftbound}')

          report={
            'point':7,
            'image_gaps':gaps,
            'classified_total':sum(gaps.values()),
            'pokemon':pokemon,
            'duplicate_variant_keys':duplicate_variant_keys,
            'duplicate_variant_identifiers':duplicate_variant_ids,
            'riftbound_cardmarket_leakage':riftbound,
            'gate':'PASS' if not failures else 'FAIL',
            'failures':failures,
          }
          print('POINT7_FINAL '+json.dumps(report,indent=2,sort_keys=True))
          if failures: raise SystemExit('; '.join(failures))
          PY
