name: P0 Final Schedule Observer

on:
  push:
    paths:
      - '.github/workflows/p0-final-schedule-observer.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve genuine scheduled master run
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = 'daily-catalog-v2-orchestrator.yml';
            const cutoff = Date.parse('2026-08-28T23:04:00Z');
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            let found = null;
            for (let attempt = 1; attempt <= 180; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                event: 'schedule',
                per_page: 20,
              });
              const candidates = response.data.workflow_runs
                .filter(run => Date.parse(run.created_at) >= cutoff)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              if (candidates.length) {
                found = candidates[0];
                break;
              }
              await sleep(5000);
            }

            if (!found) {
              throw new Error('No genuine scheduled Daily Catalog V2 run appeared after the certification cutoff');
            }

            const body = [
              '### P0 genuine schedule observer',
              '',
              `- master run: ${found.id}`,
              `- event: ${found.event}`,
              `- status: ${found.status}`,
              `- conclusion: ${found.conclusion ?? 'pending'}`,
              `- head_sha: ${found.head_sha}`,
              `- created_at: ${found.created_at}`,
              `- url: ${found.html_url}`,
              '',
              'Observer only; no production writes.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 598,
              body,
            });

            core.info(body);
