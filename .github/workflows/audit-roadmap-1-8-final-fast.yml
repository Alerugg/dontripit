name: Audit Roadmap 1-8 Final Fast

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-roadmap-1-8-final-fast.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Final production proof
        run: |
          python - <<'PY'
          import json,os
          import psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          report={}
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
              c.execute("SET LOCAL statement_timeout='90s'")
              c.execute("SELECT max(last_seen_at) capture FROM external_catalog_products WHERE source='cardmarket'")
              cap=c.fetchone()['capture']; report['cardmarket_capture']=cap.isoformat()
              c.execute('''SELECT g.slug,count(DISTINCT ca.id) cards,count(DISTINCT p.id) prints,count(DISTINCT s.id) sets
                FROM games g LEFT JOIN cards ca ON ca.game_id=g.id LEFT JOIN prints p ON p.card_id=ca.id
                LEFT JOIN sets s ON s.game_id=g.id WHERE g.slug IN ('pokemon','onepiece','mtg','yugioh')
                GROUP BY g.slug ORDER BY g.slug''')
              report['canonical']=[{k:(int(v) if k!='slug' else v) for k,v in r.items()} for r in c.fetchall()]

              c.execute('''CREATE TEMP TABLE cm_current ON COMMIT DROP AS
                SELECT e.id,e.external_id,e.game_id,e.product_group,g.slug
                FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.last_seen_at=%s AND g.slug IN ('pokemon','onepiece','mtg','yugioh')''',(cap,))
              c.execute('CREATE INDEX ON cm_current(external_id)'); c.execute('CREATE INDEX ON cm_current(id)')
              c.execute('''WITH mapped_print AS (
                  SELECT DISTINCT cm.id FROM cm_current cm
                  JOIN external_catalog_print_links l ON l.external_product_id=cm.id AND l.link_status IN ('accepted','mapped','exact')
                  JOIN prints p ON p.id=l.print_id JOIN cards ca ON ca.id=p.card_id AND ca.game_id=cm.game_id
                  WHERE cm.product_group='single'
                  UNION
                  SELECT DISTINCT cm.id FROM cm_current cm JOIN print_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                  JOIN prints p ON p.id=pi.print_id JOIN cards ca ON ca.id=p.card_id AND ca.game_id=cm.game_id
                  WHERE cm.product_group='single'
                ) SELECT cm.slug,count(*) total,count(mp.id) mapped
                FROM cm_current cm LEFT JOIN mapped_print mp ON mp.id=cm.id WHERE cm.product_group='single'
                GROUP BY cm.slug ORDER BY cm.slug''')
              report['single_mapping']=[{'slug':r['slug'],'total':int(r['total']),'mapped':int(r['mapped']),
                'unresolved':int(r['total'])-int(r['mapped'])} for r in c.fetchall()]

              c.execute('''WITH ns AS (SELECT * FROM cm_current WHERE product_group='non_single'), exact AS (
                  SELECT ns.id,ns.slug,ns.game_id,pi.product_variant_id,p.game_id canonical_game
                  FROM ns JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=ns.external_id
                  JOIN product_variants pv ON pv.id=pi.product_variant_id JOIN products p ON p.id=pv.product_id
                ), linked AS (
                  SELECT DISTINCT e.id FROM exact e JOIN external_catalog_product_variant_links l
                  ON l.external_product_id=e.id AND l.product_variant_id=e.product_variant_id AND l.link_status='accepted'
                ), priced AS (
                  SELECT DISTINCT e.id FROM exact e JOIN price_snapshots ps ON ps.entity_type='product_variant' AND ps.entity_id=e.product_variant_id
                  JOIN price_sources src ON src.id=ps.source_id AND src.name='cardmarket'
                ) SELECT (SELECT count(*) FROM ns) total,(SELECT count(*) FROM exact) identifiers,
                  (SELECT count(*) FROM linked) accepted_links,(SELECT count(*) FROM exact WHERE game_id<>canonical_game) cross_game,
                  (SELECT count(*) FROM priced) priced''')
              ns=dict(c.fetchone()); report['non_single']={k:int(v) for k,v in ns.items()}

              c.execute('''SELECT g.slug,count(*) prints,
                count(*) FILTER (WHERE NOT EXISTS(SELECT 1 FROM print_images i WHERE i.print_id=p.id AND NULLIF(i.url,'') IS NOT NULL)) missing
                FROM prints p JOIN cards ca ON ca.id=p.card_id JOIN games g ON g.id=ca.game_id
                WHERE g.slug IN ('pokemon','onepiece','mtg','yugioh') GROUP BY g.slug ORDER BY g.slug''')
              report['images']=[{'slug':r['slug'],'prints':int(r['prints']),'missing':int(r['missing'])} for r in c.fetchall()]

              c.execute('''SELECT g.slug,rc.region,count(*) items,count(*) FILTER (WHERE rc.kind IN ('product','release')) product_release
                FROM regional_tcg_content rc JOIN games g ON g.id=rc.game_id
                WHERE g.slug IN ('pokemon','onepiece','mtg','yugioh') GROUP BY g.slug,rc.region ORDER BY g.slug,rc.region''')
              report['regional']=[{'slug':r['slug'],'region':r['region'],'items':int(r['items']),'product_release':int(r['product_release'])} for r in c.fetchall()]
              c.execute("SELECT to_regclass('public.user_password_reset_tokens') reset_table")
              report['password_reset_schema']=bool(c.fetchone()['reset_table'])
          conn.close()
          report['email_transport']={'resend_key_present':bool(os.getenv('RESEND_API_KEY','').strip()),'from_present':bool(os.getenv('AUTH_EMAIL_FROM','').strip())}
          required={(g,r) for g in ('pokemon','onepiece','mtg','yugioh') for r in ('jp','eu','us')}
          actual={(r['slug'],r['region']) for r in report['regional'] if r['items']>0}
          gates={
            'non_single_exact':report['non_single']['total']==13173==report['non_single']['identifiers']==report['non_single']['accepted_links'] and report['non_single']['cross_game']==0,
            'non_single_prices_explicit':report['non_single']['priced']==12079,
            'onepiece_images_zero':next(r['missing'] for r in report['images'] if r['slug']=='onepiece')==0,
            'yugioh_images_zero':next(r['missing'] for r in report['images'] if r['slug']=='yugioh')==0,
            'known_source_image_gaps':sum(r['missing'] for r in report['images'])==2021,
            'regional_12_cells':required<=actual,
            'password_reset_schema':report['password_reset_schema'],
            'password_email_transport':report['email_transport']['resend_key_present'] and report['email_transport']['from_present'],
          }
          report['gates']=gates
          print(json.dumps(report,indent=2,sort_keys=True))
          required_non_email=[k for k in gates if k!='password_email_transport']
          if not all(gates[k] for k in required_non_email):
              raise AssertionError({'failed_non_email_gates':[k for k in required_non_email if not gates[k]],'report':report})
          PY
