name: Audit TCGdex Multilingual Physical Backfill

on:
  push:
    branches:
      - multilingual-v1
    paths:
      - "backend/app/scripts/audit_tcgdex_multilingual_backfill.py"
      - "backend/app/scripts/audit_tcgdex_multilingual_backfill_physical.py"
      - ".github/workflows/audit-tcgdex-multilingual-backfill.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-tcgdex-multilingual-backfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout multilingual sandbox
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies only
        run: pip install psycopg2-binary==2.9.9 requests==2.32.3

      - name: Compile physical dry-run auditor
        run: |
          python -m py_compile \
            app/scripts/audit_tcgdex_multilingual_backfill.py \
            app/scripts/audit_tcgdex_multilingual_backfill_physical.py

      - name: Run strict read-only physical backfill plan
        run: python app/scripts/audit_tcgdex_multilingual_backfill_physical.py

      - name: Publish physical dry-run summary
        if: always()
        run: |
          if [ -f /tmp/tcgdex-multilingual-physical-backfill-audit.md ]; then
            cat /tmp/tcgdex-multilingual-physical-backfill-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload physical dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcgdex-multilingual-physical-backfill-audit-${{ github.run_id }}
          path: |
            /tmp/tcgdex-multilingual-physical-backfill-audit.json
            /tmp/tcgdex-multilingual-physical-backfill-audit.md
          if-no-files-found: warn
          retention-days: 90
