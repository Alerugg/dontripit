name: Audit Yu-Gi-Oh YGOJSON physical variant identity

on:
  workflow_dispatch:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - backend/app/scripts/audit_yugioh_ygojson_variant_identity.py
      - .github/workflows/audit-yugioh-ygojson-variant-identity.yml

permissions:
  contents: read

concurrency:
  group: audit-yugioh-ygojson-variant-identity-${{ github.ref }}
  cancel-in-progress: false

env:
  YGOJSON_URL: https://github.com/iconmaster5326/YGOJSON/releases/download/v1/aggregate.zip
  PYTHONPATH: .

jobs:
  variant-audit:
    name: Source-only historical variant identity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: multilingual-ygo-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Download immutable historical YGOJSON aggregate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ygo-variant/extracted" artifacts
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/ygo-variant/aggregate.zip" "$YGOJSON_URL"
          unzip -q "$RUNNER_TEMP/ygo-variant/aggregate.zip" -d "$RUNNER_TEMP/ygo-variant/extracted"

      - name: Audit physical variant collision surface
        shell: bash
        run: |
          set -euo pipefail
          python -m app.scripts.audit_yugioh_ygojson_variant_identity \
            --input-dir "$RUNNER_TEMP/ygo-variant/extracted" \
            --report ../artifacts/yugioh-ygojson-variant-identity.json

      - name: Enforce source-only gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../artifacts/yugioh-ygojson-variant-identity.json').read_text())
          if not r['gate_pass']:
              raise SystemExit('YGOJSON variant identity audit failed')
          print(json.dumps({
              'gate_pass': r['gate_pass'],
              'es': r['targets']['es']['variant_resolution'],
              'ja': r['targets']['ja']['variant_resolution'],
          }, indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-ygojson-variant-identity
          path: artifacts/yugioh-ygojson-variant-identity.json
          if-no-files-found: warn
          retention-days: 30
