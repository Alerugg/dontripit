name: QA public password recovery

on:
  push:
    branches:
      - fix-public-password-recovery
    paths:
      - 'frontend/proxy.js'
      - 'frontend/app/forgot-password/**'
      - 'frontend/app/reset-password/**'
      - 'frontend/tests/publicPasswordRecovery.test.js'
      - '.github/workflows/qa-public-password-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build production frontend
        working-directory: frontend
        env:
          INTERNAL_API_BASE_URL: https://example.invalid
          INTERNAL_API_ALLOW_PUBLIC: 'true'
        run: npm run build
