name: Audit One Piece JP EB PRB Production Proof V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_onepiece_jp_eb_prb_production_proof_v1.py'
      - '.github/workflows/audit-onepiece-jp-eb-prb-production-proof-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      ONEPIECE_HTTP_TIMEOUT: '30'
      ONEPIECE_JP_EB_PRB_PROOF_OUTPUT: /tmp/onepiece-jp-eb-prb-production-proof-v1.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/scripts/audit_onepiece_jp_eb_prb_production_proof_v1.py
      - name: Compare six live Japanese official sets against Neon READ ONLY
        run: python -m app.scripts.audit_onepiece_jp_eb_prb_production_proof_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-jp-eb-prb-production-proof-v1-${{ github.run_id }}
          path: /tmp/onepiece-jp-eb-prb-production-proof-v1.json
          retention-days: 90
          if-no-files-found: error
