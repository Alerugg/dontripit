name: Audit Sealed Cardmarket Images V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_sealed_cardmarket_images_v1.py'
      - '.github/workflows/audit-sealed-cardmarket-images-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-sealed-cardmarket-images-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime and image validator
        run: |
          pip install -r requirements.txt
          pip install 'Pillow==11.3.0'
      - name: Compile read-only probe
        run: python -m py_compile app/scripts/audit_sealed_cardmarket_images_v1.py
      - name: Probe exact Cardmarket product pages and first-party images
        run: |
          mkdir -p /tmp/sealed-cardmarket-images-v1
          python -m app.scripts.audit_sealed_cardmarket_images_v1 \
            --sample-per-type 2 \
            --report /tmp/sealed-cardmarket-images-v1/report.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/sealed-cardmarket-images-v1/report.json'))
          assert p['status']=='pass', p
          assert p['production_writes']==0, p
          assert p['control_cardmarket_s3']['valid'] is True, p['control_cardmarket_s3']
          assert p['sample_rows'] > 0, p
          print(json.dumps({
              'control':p['control_cardmarket_s3'],
              'sample_rows':p['sample_rows'],
              'probe_counts':p['probe_counts'],
              'resolved':p['resolved_exact_product_images'],
              'by_game':p['by_game'],
              'duplicate_hash_groups':len(p['duplicate_hash_groups_across_distinct_products']),
          },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-cardmarket-images-v1-${{ github.run_id }}
          path: /tmp/sealed-cardmarket-images-v1/*
          retention-days: 90
          if-no-files-found: warn
