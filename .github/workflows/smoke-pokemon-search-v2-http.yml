name: Smoke Pokemon Search V2 HTTP

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/smoke-pokemon-search-v2-http.yml'
      - 'backend/app/scripts/smoke_pokemon_search_v2_http.py'
      - 'backend/app/routes/search_v2.py'
      - 'backend/app/search_v2/pokemon_*.py'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PUBLIC_API_ENABLED: 'true'
      PUBLIC_IP_RATE_LIMIT_RPM: '100'
    steps:
      - name: Checkout catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify Neon secret
        run: test -n "${DATABASE_URL}${DATABASE_URL_UNPOOLED}"
      - name: Create temporary catalog API key
        working-directory: backend
        run: |
          set -euo pipefail
          KEY="$(python -m app.auth.create_key --plan enterprise --label "smoke-pokemon-${GITHUB_RUN_ID}" --scopes read:catalog | tail -n 1)"
          PREFIX="${KEY:0:8}"
          echo "::add-mask::$KEY"
          echo "SEARCH_V2_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "TEMP_API_PREFIX=$PREFIX" >> "$GITHUB_ENV"
      - name: Run Search V2 HTTP contract smoke
        working-directory: backend
        run: |
          set -euo pipefail
          python -u -m app.scripts.smoke_pokemon_search_v2_http | tee /tmp/pokemon-search-v2-http-smoke.json
      - name: Upload HTTP smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-search-v2-http-${{ github.sha }}
          path: /tmp/pokemon-search-v2-http-smoke.json
          retention-days: 90
          if-no-files-found: warn
      - name: Disable temporary API key
        if: always() && env.TEMP_API_PREFIX != ''
        working-directory: backend
        run: python -m app.auth.disable_key --prefix "$TEMP_API_PREFIX" || true
