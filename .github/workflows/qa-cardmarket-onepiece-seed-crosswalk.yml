name: QA Cardmarket One Piece Seed Crosswalk

on:
  pull_request:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_onepiece_seed_crosswalk.py'
      - 'backend/tests/test_cardmarket_onepiece_seed_crosswalk.py'
      - '.github/workflows/qa-cardmarket-onepiece-seed-crosswalk.yml'
  push:
    branches:
      - cardmarket-onepiece-seed-crosswalk-v1
    paths:
      - 'backend/app/jobs/cardmarket_onepiece_seed_crosswalk.py'
      - 'backend/tests/test_cardmarket_onepiece_seed_crosswalk.py'
      - '.github/workflows/qa-cardmarket-onepiece-seed-crosswalk.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Compile seed crosswalk
        working-directory: backend
        run: python -m compileall -q app/jobs/cardmarket_onepiece_seed_crosswalk.py
      - name: Run conservative inference tests
        working-directory: backend
        env:
          API_KEY_REQUIRED: 'false'
        run: pytest -q tests/test_cardmarket_onepiece_seed_crosswalk.py --tb=short

  live-read-only-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Download current One Piece Product Catalogue
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_18.json \
            -o /tmp/products_onepiece.json
          test -s /tmp/products_onepiece.json
      - name: Run read-only seed inference against Neon
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, os
          from app import db
          from app.jobs.cardmarket_catalog_audit import load_product_list_file
          from app.jobs.cardmarket_onepiece_seed_crosswalk import derive_onepiece_seed_crosswalk

          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not url:
              raise SystemExit('database secret unavailable')
          db.init_engine(url)
          products=load_product_list_file('/tmp/products_onepiece.json')
          with db.SessionLocal() as session:
              summary, decisions, proposals=derive_onepiece_seed_crosswalk(session, products, min_hinted_rows=5, min_consensus=0.9)
              session.rollback()
          interesting=[d.as_dict() for d in decisions if d.status in {'reviewable_collector_consensus','mixed_prefixes_dominant','mixed_prefixes'}]
          payload={
              'summary': summary,
              'reviewable_crosswalk': proposals,
              'interesting_decisions': interesting[:100],
              'write_mode': 'disabled',
          }
          print('ONEPIECE_SEED_CROSSWALK='+json.dumps(payload, separators=(',',':'), sort_keys=True))
          open('/tmp/onepiece-seed-crosswalk.json','w',encoding='utf-8').write(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - name: Upload read-only report
        uses: actions/upload-artifact@v4
        with:
          name: onepiece-seed-crosswalk-${{ github.run_id }}
          path: /tmp/onepiece-seed-crosswalk.json
          if-no-files-found: error
          retention-days: 14
