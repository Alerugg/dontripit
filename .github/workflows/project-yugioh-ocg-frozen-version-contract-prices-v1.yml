name: Project Yu-Gi-Oh OCG Frozen Version Contract Exact Prices V1

on:
  pull_request:
    paths:
      - '.github/workflows/project-yugioh-ocg-frozen-version-contract-prices-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/project-yugioh-ocg-frozen-version-contract-prices-v1.yml'

permissions:
  contents: read

concurrency:
  group: project-yugioh-ocg-frozen-version-contract-prices-v1
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile installed frozen-contract writer and projector
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_frozen_version_contract_v1.py
          python -m py_compile scripts/project_cardmarket_link_prices.py
      - name: READ ONLY prove exact 41-link identity is already complete
        run: |
          mkdir -p /tmp/ygo-ocg-frozen-contract-price-projection
          python -m app.scripts.apply_yugioh_ocg_frozen_version_contract_v1 \
            --report /tmp/ygo-ocg-frozen-contract-price-projection/identity-before.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-frozen-contract-price-projection/identity-before.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['certified_pairs']==41,p
          assert p['already_accepted_same_pair']==41,p
          assert p['new_links_ready']==0,p
          rows={r['set_code']:r for r in p['sets']}
          assert {k:rows[k]['existing_same'] for k in rows}=={'DOCS':19,'LTGY':11,'CSOC':11},p
          assert {k:rows[k]['regional_accepted_before_or_after'] for k in rows}=={'DOCS':88,'LTGY':86,'CSOC':85},p
          print(json.dumps({'identity':'complete','links':41},indent=2))
          PY
      - name: Project current prices from exact linked Cardmarket idProducts
        if: github.event_name == 'push'
        run: |
          python scripts/project_cardmarket_link_prices.py \
            --game yugioh \
            --apply \
            --report /tmp/ygo-ocg-frozen-contract-price-projection/projection.json
      - name: READ ONLY prove identity remained unchanged
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_frozen_version_contract_v1 \
            --report /tmp/ygo-ocg-frozen-contract-price-projection/identity-after.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-frozen-contract-price-projection/identity-after.json'))
          assert p['production_writes']==0,p
          assert p['already_accepted_same_pair']==41,p
          assert p['new_links_ready']==0,p
          print(json.dumps({'identity_after_projection':'unchanged','links':41},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-frozen-contract-exact-price-projection-${{ github.run_id }}
          path: /tmp/ygo-ocg-frozen-contract-price-projection/*.json
          retention-days: 90
          if-no-files-found: warn
