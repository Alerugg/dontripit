name: Audit Live Cardmarket Master Now

on:
  push:
    branches:
      - audit-live-cardmarket-master-now

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Download all official Cardmarket MVP catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cardmarket
          for spec in mtg:1 yugioh:3 pokemon:6 onepiece:18; do
            game="${spec%%:*}"
            game_id="${spec##*:}"
            for group in singles nonsingles; do
              curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
                "https://downloads.s3.cardmarket.com/productCatalog/productList/products_${group}_${game_id}.json" \
                -o "/tmp/cardmarket/${game}_${group}.json"
            done
          done
      - name: Run read-only reverse completeness audit against Neon
        working-directory: backend
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_cardmarket_master_inventory.py \
            --catalog mtg:single:/tmp/cardmarket/mtg_singles.json \
            --catalog mtg:non_single:/tmp/cardmarket/mtg_nonsingles.json \
            --catalog yugioh:single:/tmp/cardmarket/yugioh_singles.json \
            --catalog yugioh:non_single:/tmp/cardmarket/yugioh_nonsingles.json \
            --catalog pokemon:single:/tmp/cardmarket/pokemon_singles.json \
            --catalog pokemon:non_single:/tmp/cardmarket/pokemon_nonsingles.json \
            --catalog onepiece:single:/tmp/cardmarket/onepiece_singles.json \
            --catalog onepiece:non_single:/tmp/cardmarket/onepiece_nonsingles.json \
            --report /tmp/cardmarket/master-report.json \
            --decisions-csv /tmp/cardmarket/master-decisions.csv > /tmp/cardmarket/master-stdout.json
      - name: Print compact coverage summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/cardmarket/master-report.json'))
          print(json.dumps(p['summary'], indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cardmarket-master-live-audit
          path: |
            /tmp/cardmarket/master-report.json
            /tmp/cardmarket/master-decisions.csv
          retention-days: 7
