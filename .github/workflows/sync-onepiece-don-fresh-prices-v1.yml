name: Sync One Piece DON Fresh Prices V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/sync-onepiece-don-fresh-prices-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/sync-onepiece-don-fresh-prices-v1.yml'

permissions:
  contents: read

concurrency:
  group: sync-onepiece-don-fresh-prices-v1
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Require production database
        run: test -n "${DATABASE_URL_UNPOOLED:-}"
      - name: Download current official One Piece Price Guide
        run: |
          set -euo pipefail
          mkdir -p /tmp/onepiece-don-price-sync
          curl --retry 5 --retry-all-errors --retry-delay 2 --fail --location --silent --show-error \
            'https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_18.json' \
            -o /tmp/onepiece-don-price-sync/price_guide_18.json
          test -s /tmp/onepiece-don-price-sync/price_guide_18.json
      - name: Validate fresh feed contract
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from app.jobs.cardmarket_prices import load_price_guide_bytes
          created, rows = load_price_guide_bytes(Path('/tmp/onepiece-don-price-sync/price_guide_18.json').read_bytes(), filename='price_guide_18.json')
          assert created is not None, 'Cardmarket Price Guide createdAt missing'
          age=(datetime.now(timezone.utc)-created).total_seconds()
          assert -7200 <= age <= 129600, ('stale_or_future_price_guide', created.isoformat(), age)
          ids=[row.product_id for row in rows]
          assert len(ids) > 10000, ('unexpected_price_guide_size', len(ids))
          assert len(ids) == len(set(ids)), 'duplicate idProduct in One Piece Price Guide'
          print({'createdAt':created.isoformat(),'age_seconds':age,'products':len(ids)})
          PY
      - name: Preflight exact source-owned price plan READ ONLY
        run: |
          python scripts/sync_cardmarket_external_prices.py \
            /tmp/onepiece-don-price-sync/price_guide_18.json \
            --game onepiece \
            --report /tmp/onepiece-don-price-sync/preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/onepiece-don-price-sync/preflight.json').read_text())
          assert p['mode']=='dry_run',p
          assert p['write_ready'],p
          assert p['duplicate_rows']==0,p
          assert p['cross_game_products']==0,p
          assert p['matched_external_products'] > 10000,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY
      - name: Apply current One Piece source prices
        if: github.event_name == 'push'
        run: |
          python scripts/sync_cardmarket_external_prices.py \
            /tmp/onepiece-don-price-sync/price_guide_18.json \
            --game onepiece --apply \
            --report /tmp/onepiece-don-price-sync/apply.json
      - name: Prove DON current-feed coverage after apply
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from sqlalchemy import text
          from app import db
          p=json.loads(Path('/tmp/onepiece-don-price-sync/apply.json').read_text())
          as_of=p['as_of']
          db.init_engine(os.environ['DATABASE_URL_UNPOOLED'])
          with db.SessionLocal() as session:
            rows=session.execute(text('''
              WITH latest AS (
                SELECT max(source_as_of) source_as_of FROM onepiece_don_market_items WHERE source='cardmarket'
              ), per_metacard AS (
                SELECT m.metacard_external_id,m.name,m.subject,
                  bool_or(COALESCE(NULLIF(ps.price_mid,0),NULLIF(ps.price_market,0),NULLIF(ps.price_last,0),NULLIF(ps.price_low,0)) IS NOT NULL) AS priced
                FROM onepiece_don_market_items m
                JOIN latest l ON l.source_as_of=m.source_as_of
                CROSS JOIN LATERAL jsonb_array_elements_text(COALESCE(m.product_ids_json,'[]'::jsonb)) pid(value)
                JOIN games g ON g.slug='onepiece'
                JOIN external_catalog_products e ON e.source='cardmarket' AND e.game_id=g.id AND e.product_group='single' AND e.external_id=pid.value
                LEFT JOIN external_market_price_snapshots ps ON ps.external_product_id=e.id AND ps.currency='EUR' AND ps.as_of=CAST(:as_of AS timestamptz)
                WHERE m.source='cardmarket'
                GROUP BY m.metacard_external_id,m.name,m.subject
              )
              SELECT metacard_external_id,name,subject,priced FROM per_metacard ORDER BY metacard_external_id
            '''),{'as_of':as_of}).mappings().all()
            session.rollback()
          priced=sum(1 for r in rows if r['priced'])
          missing=[dict(r) for r in rows if not r['priced']]
          proof={'as_of':as_of,'metacards':len(rows),'priced':priced,'unpriced':len(missing),'unpriced_rows':missing,'production_write_scope':'external_market_price_snapshots:onepiece'}
          Path('/tmp/onepiece-don-price-sync/proof.json').write_text(json.dumps(proof,indent=2,default=str,sort_keys=True)+'\n')
          print(json.dumps(proof,indent=2,default=str,sort_keys=True))
          assert len(rows)==164,proof
          assert priced>=160,proof
          assert len(missing)<=4,proof
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-don-fresh-price-sync-v1-${{ github.run_id }}
          path: /tmp/onepiece-don-price-sync/*.json
          retention-days: 30
          if-no-files-found: warn
