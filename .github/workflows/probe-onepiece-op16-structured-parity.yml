name: Probe One Piece OP16 Structured Parity

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/probe-onepiece-op16-structured-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Read representative One Piece canonical attributes
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          targets=['OP16-001','OP16-002','OP16-019','OP16-063','OP16-119']
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
            c.execute('''
              SELECT p.id print_id,p.collector_number,p.variant,p.rarity,p.is_foil,c.id card_id,c.name,s.code,s.name set_name,
                     COALESCE((SELECT jsonb_agg(jsonb_build_object('source',ca.source,'version',ca.source_version,'attributes',ca.attributes_json)) FROM card_attributes ca WHERE ca.card_id=c.id),'[]'::jsonb) card_attributes,
                     COALESCE((SELECT jsonb_agg(jsonb_build_object('source',pa.source,'version',pa.source_version,'attributes',pa.attributes_json)) FROM print_attributes pa WHERE pa.print_id=p.id),'[]'::jsonb) print_attributes,
                     COALESCE((SELECT jsonb_agg(jsonb_build_object('url',pi.url,'source',pi.source,'primary',pi.is_primary)) FROM print_images pi WHERE pi.print_id=p.id),'[]'::jsonb) images,
                     (SELECT psp.attributes_json FROM print_search_profiles psp WHERE psp.print_id=p.id LIMIT 1) search_attributes,
                     (SELECT psp.release_names_json FROM print_search_profiles psp WHERE psp.print_id=p.id LIMIT 1) release_names
              FROM prints p JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id JOIN sets s ON s.id=p.set_id
              WHERE g.slug='onepiece' AND p.collector_number=ANY(%s) AND lower(coalesce(p.language,''))='en'
              ORDER BY p.collector_number,p.variant
            ''',(targets,)); rows=[dict(x) for x in c.fetchall()]
            c.execute('''
              SELECT ca.source,count(*) rows,count(distinct ca.card_id) cards
              FROM card_attributes ca JOIN cards c ON c.id=ca.card_id JOIN games g ON g.id=c.game_id
              WHERE g.slug='onepiece' GROUP BY ca.source ORDER BY rows DESC
            '''); card_sources=[dict(x) for x in c.fetchall()]
            c.execute('''
              SELECT pa.source,count(*) rows,count(distinct pa.print_id) prints
              FROM print_attributes pa JOIN prints p ON p.id=pa.print_id JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
              WHERE g.slug='onepiece' GROUP BY pa.source ORDER BY rows DESC
            '''); print_sources=[dict(x) for x in c.fetchall()]
          conn.close()
          print('CARD_SOURCES',json.dumps(card_sources,indent=2,default=str))
          print('PRINT_SOURCES',json.dumps(print_sources,indent=2,default=str))
          print('ROWS',json.dumps(rows,indent=2,ensure_ascii=False,default=str))
          PY
