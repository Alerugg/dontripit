name: P0 YuGiOh Live Release Repair

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/p0-yugioh-live-release-repair.yml'

permissions:
  contents: read

jobs:
  audit-live-release-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enumerate cardinfo releases missing from cardsets registry
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from collections import defaultdict

          CARDINFO = 'https://db.ygoprodeck.com/api/v7/cardinfo.php'
          CARDSETS = 'https://db.ygoprodeck.com/api/v7/cardsets.php'

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'dontripit-p0-release-drift-audit/1.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          def clean(value):
              return ' '.join(str(value or '').split()).strip()

          def fold(value):
              return re.sub(r'[^a-z0-9]+', '', clean(value).lower())

          cards_payload = fetch(CARDINFO)
          registry = fetch(CARDSETS)
          cards = cards_payload.get('data') or []
          official_names = {clean(row.get('set_name')) for row in registry if clean(row.get('set_name'))}
          official_fold = {fold(name) for name in official_names}

          missing = defaultdict(lambda: {
              'rows': 0,
              'card_ids': set(),
              'codes': set(),
              'prefixes': set(),
              'rarities': set(),
          })
          for card in cards:
              card_id = str(card.get('id') or '')
              for row in card.get('card_sets') or []:
                  name = clean(row.get('set_name'))
                  if not name or name in official_names or fold(name) in official_fold:
                      continue
                  code = clean(row.get('set_code')).upper()
                  prefix = code.split('-', 1)[0] if '-' in code else code
                  bucket = missing[name]
                  bucket['rows'] += 1
                  bucket['card_ids'].add(card_id)
                  if code:
                      bucket['codes'].add(code)
                  if prefix:
                      bucket['prefixes'].add(prefix)
                  rarity = clean(row.get('set_rarity'))
                  if rarity:
                      bucket['rarities'].add(rarity)

          report = []
          for name in sorted(missing):
              bucket = missing[name]
              report.append({
                  'name': name,
                  'rows': bucket['rows'],
                  'cards': len(bucket['card_ids']),
                  'prefixes': sorted(bucket['prefixes']),
                  'sample_codes': sorted(bucket['codes'])[:12],
                  'rarities': sorted(bucket['rarities']),
              })

          print('OFFICIAL_REGISTRY_ROWS', len(registry))
          print('CARDINFO_CARDS', len(cards))
          print('MISSING_RELEASE_COUNT', len(report))
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY
