name: P0 YuGiOh Live Release Repair

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/p0-yugioh-live-release-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Patch exact verified live-release fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/scripts/build_yugioh_v2_snapshot_canonical.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''CARD_ALIAS_TO_CANONICAL = {
              "300302053": "300302018",  # Spell of Mask (Skill Card) -> Spell of Mask
          }

          '''
          if text.count(anchor) != 1:
              raise SystemExit('card alias anchor drifted')
          replacement = anchor + '''# YGOPRODeck cardinfo can expose a newly released product before cardsets.php
          # catches up. Fallbacks are exact reviewed identities only; unknown releases
          # still fail closed. Evidence: Konami official 2026-08-29 product page and
          # YGOPRODeck pack catalog code 26LP.
          VERIFIED_LIVE_RELEASE_FALLBACKS = {
              "Limited Pack World Championship 2026": {
                  "set_name": "Limited Pack World Championship 2026",
                  "set_code": "26LP",
                  "num_of_cards": 21,
                  "tcg_date": "2026-08-29",
                  "_resolution": "verified_live_release_fallback",
                  "_evidence": "konami_official_2026-08-29+ygoprodeck_pack_26LP",
              },
          }

          '''
          text = text.replace(anchor, replacement, 1)

          anchor = '''    candidates = release_by_fold.get(_fold(source_release_name)) or []
              if len(candidates) == 1:
                  return candidates[0]
              raise AssertionError(f"card_sets row cannot map to official release: {source_release_name!r}")
          '''
          if text.count(anchor) != 1:
              raise SystemExit('resolve release anchor drifted')
          replacement = '''    candidates = release_by_fold.get(_fold(source_release_name)) or []
              if len(candidates) == 1:
                  return candidates[0]
              fallback = VERIFIED_LIVE_RELEASE_FALLBACKS.get(source_release_name)
              if fallback is not None:
                  release = dict(fallback)
                  release_by_name[source_release_name] = release
                  release_by_fold[_fold(source_release_name)].append(release)
                  return release
              raise AssertionError(f"card_sets row cannot map to official release: {source_release_name!r}")
          '''
          text = text.replace(anchor, replacement, 1)

          anchor = '''                release_name = _clean(release.get("set_name"))
                          release_code = _clean(release.get("set_code")).upper()
                          release_date = _parse_date(release.get("tcg_date"))
                          if not full_code or len(full_code) > 50:
          '''
          if text.count(anchor) != 1:
              raise SystemExit('release validation anchor drifted')
          replacement = '''                release_name = _clean(release.get("set_name"))
                          release_code = _clean(release.get("set_code")).upper()
                          release_date = _parse_date(release.get("tcg_date"))
                          if release.get("_resolution") == "verified_live_release_fallback":
                              expected_prefix = f"{release_code}-"
                              if not full_code.startswith(expected_prefix):
                                  raise AssertionError(
                                      f"verified live release code mismatch: release={release_name!r} "
                                      f"expected_prefix={expected_prefix!r} code={full_code!r}"
                                  )
                          if not full_code or len(full_code) > 50:
          '''
          text = text.replace(anchor, replacement, 1)

          anchor = '''    for release in sorted(
                  releases,
                  key=lambda row: (
          '''
          if text.count(anchor) != 1:
              raise SystemExit('release rows anchor drifted')
          replacement = '''    for release in sorted(
                  release_by_name.values(),
                  key=lambda row: (
          '''
          text = text.replace(anchor, replacement, 1)

          anchor = '''                "metadata": {
                              "num_of_cards": release.get("num_of_cards"),
                              "source_set_code": _clean(release.get("set_code")).upper() or None,
                          },
          '''
          if text.count(anchor) != 1:
              raise SystemExit('release metadata anchor drifted')
          replacement = '''                "metadata": {
                              "num_of_cards": release.get("num_of_cards"),
                              "source_set_code": _clean(release.get("set_code")).upper() or None,
                              "resolution": release.get("_resolution") or "cardsets.php",
                              "evidence": release.get("_evidence"),
                          },
          '''
          text = text.replace(anchor, replacement, 1)

          anchor = '''            "official_release_rows": len(releases),
                      },
          '''
          if text.count(anchor) != 1:
              raise SystemExit('manifest source anchor drifted')
          replacement = '''            "official_release_rows": len(releases),
                          "catalog_release_rows": len(release_rows),
                          "verified_live_release_fallbacks": sorted(
                              name
                              for name, release in release_by_name.items()
                              if release.get("_resolution") == "verified_live_release_fallback"
                          ),
                      },
          '''
          text = text.replace(anchor, replacement, 1)

          anchor = '''            "release": "unique official cardsets.php release name",
          '''
          if text.count(anchor) != 1:
              raise SystemExit('identity policy anchor drifted')
          replacement = '''            "release": "unique cardsets.php release name, plus exact reviewed live-release fallbacks only while the registry lags",
          '''
          text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile patched builder
        run: python -m py_compile backend/app/scripts/build_yugioh_v2_snapshot_canonical.py

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Prove live canonical snapshot without database writes
        working-directory: backend
        run: python -m app.scripts.build_yugioh_v2_snapshot_canonical --output-dir /tmp/yugioh-v2-live-release-cert

      - name: Commit certified repair
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/scripts/build_yugioh_v2_snapshot_canonical.py
          git commit -m "fix(yugioh): admit verified WCS 2026 live release"
          git push origin HEAD:catalog-v2
