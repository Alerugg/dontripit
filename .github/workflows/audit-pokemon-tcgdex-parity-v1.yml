name: Audit Pokemon TCGdex Parity V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/scripts/prove_pokemon_tcgdex_parity.py'
      - 'backend/app/scripts/prove_pokemon_tcgdex_parity_v2.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_multilingual_physical.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_incremental_guard.py'
      - 'backend/app/ingest/registry.py'
      - 'backend/tests/test_tcgdex_en_legacy_incremental.py'
      - '.github/workflows/audit-pokemon-tcgdex-parity-v1.yml'

permissions:
  contents: read

concurrency:
  group: audit-pokemon-tcgdex-parity-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile parity audit and incremental contract
        run: |
          python -m py_compile app/ingest/connectors/tcgdex_pokemon_incremental_guard.py
          python -m py_compile app/scripts/prove_pokemon_tcgdex_parity_v2.py
      - name: Run legacy EN incremental regression
        run: pytest -q tests/test_tcgdex_en_legacy_incremental.py
      - name: Prove fresh TCGdex EN ES JA physical parity read-only
        run: python -m app.scripts.prove_pokemon_tcgdex_parity_v2
