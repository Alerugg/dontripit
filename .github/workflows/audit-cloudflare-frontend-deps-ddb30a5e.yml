name: Audit Cloudflare frontend dependencies ddb30a5e

on:
  push:
    branches:
      - audit/cloudflare-frontend-deps-ddb30a5e
    paths:
      - '.github/workflows/audit-cloudflare-frontend-deps-ddb30a5e.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: vercel-baseline
            ref: 0bebbd754fff89352a3c4d636082803d609417a4
          - label: cloudflare-current
            ref: ddb30a5e1298b3dd4c9e29871be9f2284ad5d69d
    steps:
      - name: Checkout ${{ matrix.label }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Capture dependency audit
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p /tmp/frontend-audit/${{ matrix.label }}
          npm audit --json > /tmp/frontend-audit/${{ matrix.label }}/audit.json || true
          npm ls --all --json > /tmp/frontend-audit/${{ matrix.label }}/tree.json || true
          node - <<'NODE'
          const fs = require('fs');
          const label = process.env.LABEL;
          const p = JSON.parse(fs.readFileSync(`/tmp/frontend-audit/${label}/audit.json`, 'utf8'));
          const vulns = p.vulnerabilities || {};
          const rows = Object.entries(vulns).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            via: (v.via || []).map(x => typeof x === 'string' ? x : `${x.name || '?'}:${x.title || ''}`),
            range: v.range,
            fixAvailable: v.fixAvailable
          }));
          const out = {
            label,
            metadata: p.metadata || {},
            vulnerabilities: rows.sort((a,b) => a.name.localeCompare(b.name))
          };
          fs.writeFileSync(`/tmp/frontend-audit/${label}/summary.json`, JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out, null, 2));
          NODE
        env:
          LABEL: ${{ matrix.label }}

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deps-${{ matrix.label }}-${{ github.run_id }}
          path: /tmp/frontend-audit/${{ matrix.label }}/*
          retention-days: 90
          if-no-files-found: warn
