name: QA Cardmarket Multi-TCG Pricing

on:
  pull_request:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_prices.py'
      - 'backend/app/jobs/cardmarket_market_prices.py'
      - 'backend/tests/test_cardmarket_prices.py'
      - 'backend/tests/test_cardmarket_market_prices.py'
      - '.github/workflows/qa-cardmarket-multi-tcg-pricing.yml'
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_prices.py'
      - 'backend/app/jobs/cardmarket_market_prices.py'
      - 'backend/tests/test_cardmarket_prices.py'
      - 'backend/tests/test_cardmarket_market_prices.py'
      - '.github/workflows/qa-cardmarket-multi-tcg-pricing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Compile Cardmarket price tooling
        working-directory: backend
        run: |
          python -m compileall -q \
            app/jobs/cardmarket_prices.py \
            app/jobs/cardmarket_market_prices.py

      - name: Run Cardmarket price tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_cardmarket_prices.py \
            tests/test_cardmarket_market_prices.py
