name: Apply Yu-Gi-Oh OCG Structure Deck Variants V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/apply_yugioh_ocg_structure_decks_variants_v1.py'
      - '.github/workflows/apply-yugioh-ocg-structure-decks-variants-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/apply_yugioh_ocg_structure_decks_variants_v1.py'
      - '.github/workflows/apply-yugioh-ocg-structure-decks-variants-v1.yml'

permissions:
  contents: read

concurrency:
  group: yugioh-ocg-structure-deck-variants-v1
  cancel-in-progress: false

jobs:
  exact-links:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile guarded Structure Deck variant writer and exact-idProduct projector
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_structure_decks_variants_v1.py
          python -m py_compile scripts/project_cardmarket_link_prices.py
      - name: READ ONLY rebuild exact 40-link variant proposal
        run: |
          mkdir -p /tmp/ygo-ocg-structure-deck-variants-apply
          python -m app.scripts.apply_yugioh_ocg_structure_decks_variants_v1 --report /tmp/ygo-ocg-structure-deck-variants-apply/proposal.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-structure-deck-variants-apply/proposal.json'))
          expected={'SD41':10,'SD40':16,'SD38':10,'SD36':4}
          before={'SD41':43,'SD40':38,'SD38':43,'SD36':44}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['cardmarket_capture']=='2026-08-18 21:09:20.740891+00:00',p
          assert p['evidence_sha256']=='4bebcbd1d942966ac88744a6fde7029b506bed761efbf1bea71f558c52b71b74',p
          assert p['certified_pairs']==40,p
          assert p['already_accepted_same_pair'] in (0,40),p
          assert p['new_links_ready'] in (0,40),p
          assert p['already_accepted_same_pair']+p['new_links_ready']==40,p
          rows={r['set_code']:r for r in p['sets']}
          assert {k:rows[k]['pairs'] for k in rows}==expected,p
          if '${{ github.event_name }}'=='pull_request':
              assert p['already_accepted_same_pair']==0,p
              assert p['new_links_ready']==40,p
              assert {k:rows[k]['new_ready'] for k in rows}==expected,p
              assert {k:rows[k]['regional_accepted_before_or_after'] for k in rows}==before,p
          print(json.dumps({'dry_run':'pass','existing':p['already_accepted_same_pair'],'new':p['new_links_ready'],'per_set':expected},indent=2))
          PY
      - name: Atomically apply all 40 exact Structure Deck variant links
        if: github.event_name == 'push'
        run: python -m app.scripts.apply_yugioh_ocg_structure_decks_variants_v1 --apply --confirm APPLY_YUGIOH_OCG_STRUCTURE_DECK_VARIANTS_V1 --report /tmp/ygo-ocg-structure-deck-variants-apply/applied.json
      - name: Project Yu-Gi-Oh Cardmarket prices from exact linked idProducts
        if: github.event_name == 'push'
        run: python scripts/project_cardmarket_link_prices.py --game yugioh --apply --report /tmp/ygo-ocg-structure-deck-variants-apply/projection.json
      - name: Prove writer idempotency and complete all four regional surfaces
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_structure_decks_variants_v1 --apply --confirm APPLY_YUGIOH_OCG_STRUCTURE_DECK_VARIANTS_V1 --report /tmp/ygo-ocg-structure-deck-variants-apply/idempotency.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-structure-deck-variants-apply/idempotency.json'))
          expected={'SD41':10,'SD40':16,'SD38':10,'SD36':4}
          after={'SD41':53,'SD40':54,'SD38':53,'SD36':48}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['already_accepted_same_pair']==40,p
          assert p['new_links_ready']==0,p
          rows={r['set_code']:r for r in p['sets']}
          assert {k:rows[k]['existing_same'] for k in rows}==expected,p
          assert {k:rows[k]['regional_accepted_before_or_after'] for k in rows}==after,p
          print(json.dumps({'idempotency':'pass','variant_links':40,'regional_complete':after},indent=2))
          PY
      - name: Final complete regional identity proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          methods=('cardmarket_ocg_certified_public_code_singleton_v2','cardmarket_ocg_certified_public_version_contract_v2')
          surfaces={'4535':('SD41',53,43,10),'4545':('SD40',54,38,16),'4557':('SD38',53,43,10),'4579':('SD36',48,44,4)}
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'],connect_timeout=30,application_name='dontripit_ygo_ocg_structure_deck_variants_final_v1'); conn.set_session(readonly=True,autocommit=False); out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='yugioh' LIMIT 1"); gid=int(cur.fetchone()['id'])
              cur.execute("SELECT max(last_seen_at) capture FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s",(gid,)); capture=cur.fetchone()['capture']
              total=0
              for exp,(set_code,physical,singletons,variants) in surfaces.items():
                cur.execute("""SELECT count(*) total,count(DISTINCT l.external_product_id) products,count(DISTINCT l.print_id) prints,
                    count(*) FILTER (WHERE lower(coalesce(p.language,''))='ja' AND upper(coalesce(s.code,''))=%s) good,
                    count(*) FILTER (WHERE l.mapping_method=%s AND l.confidence='exact' AND l.reviewed=true) singleton_good,
                    count(*) FILTER (WHERE l.mapping_method=%s AND l.confidence='exact' AND l.reviewed=true) variant_good,
                    count(*) FILTER (WHERE e.last_seen_at=%s) current
                  FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN prints p ON p.id=l.print_id JOIN sets s ON s.id=p.set_id
                  WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND e.expansion_external_id=%s AND l.link_status IN ('accepted','mapped','exact')""",(set_code,methods[0],methods[1],capture,gid,exp)); x=cur.fetchone()
                vals=(int(x['total']),int(x['products']),int(x['prints']),int(x['good']),int(x['current']))
                assert vals==(physical,physical,physical,physical,physical),(exp,set_code,vals,physical)
                assert int(x['singleton_good'])==singletons,(set_code,x,singletons)
                assert int(x['variant_good'])==variants,(set_code,x,variants)
                out[set_code]={'idExpansion':exp,'physical':physical,'singleton_links':singletons,'variant_links':variants,'accepted_exact_ja_links':physical}; total+=physical
              assert total==208,total
              out['total']={'accepted_exact_ja_links':208,'sets':4}; conn.rollback()
          finally: conn.close()
          open('/tmp/ygo-ocg-structure-deck-variants-apply/final.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-structure-deck-variants-apply-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-structure-deck-variants-apply/*.json
          retention-days: 90
          if-no-files-found: warn
