name: Repair Yu-Gi-Oh Cardmarket Exact Print Images V1

on:
  pull_request:
    paths:
      - 'backend/app/data/yugioh_cardmarket_exact_print_images_v1.csv'
      - 'backend/app/scripts/apply_yugioh_cardmarket_exact_print_images_v1.py'
      - 'backend/tests/test_yugioh_cardmarket_exact_print_images_v1.py'
      - '.github/workflows/repair-yugioh-cardmarket-exact-print-images-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/data/yugioh_cardmarket_exact_print_images_v1.csv'
      - 'backend/app/scripts/apply_yugioh_cardmarket_exact_print_images_v1.py'
      - 'backend/tests/test_yugioh_cardmarket_exact_print_images_v1.py'
      - '.github/workflows/repair-yugioh-cardmarket-exact-print-images-v1.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply exact image inserts after all fail-closed gates'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: repair-yugioh-cardmarket-exact-print-images-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime and image validator
        run: |
          pip install -r requirements.txt
          pip install 'Pillow==11.3.0'
      - name: Compile writer
        run: python -m py_compile app/scripts/apply_yugioh_cardmarket_exact_print_images_v1.py
      - name: Lock manifest contracts
        run: pytest -q tests/test_yugioh_cardmarket_exact_print_images_v1.py
      - name: Dry-run all 16 exact identities and image hashes
        run: |
          mkdir -p /tmp/ygo-cardmarket-exact-images-v1
          python -m app.scripts.apply_yugioh_cardmarket_exact_print_images_v1 \
            --report /tmp/ygo-cardmarket-exact-images-v1/preflight.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-cardmarket-exact-images-v1/preflight.json'))
          assert p['status']=='pass', p
          assert p['mode']=='dry_run', p
          assert p['manifest_rows']==16, p
          assert p['network_verified']==16, p
          assert p['identity_verified']==16, p
          assert p['planned_inserts'] + p['already_present'] == 16, p
          assert p['inserted']==0 and p['production_writes']==0, p
          print(json.dumps({k:p[k] for k in ('manifest_rows','network_verified','identity_verified','planned_inserts','already_present','post_exact_images')},indent=2))
          PY
      - name: Apply certified exact images
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        env:
          CONFIRM_APPLY: APPLY_YUGIOH_CARDMARKET_EXACT_PRINT_IMAGES_V1
        run: |
          python -m app.scripts.apply_yugioh_cardmarket_exact_print_images_v1 \
            --apply \
            --report /tmp/ygo-cardmarket-exact-images-v1/apply.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-cardmarket-exact-images-v1/apply.json'))
          assert p['status']=='pass' and p['mode']=='apply', p
          assert p['manifest_rows']==16 and p['network_verified']==16 and p['identity_verified']==16, p
          assert p['inserted'] + p['already_present'] == 16, p
          assert p['post_exact_images']==16, p
          print(json.dumps({k:p[k] for k in ('inserted','already_present','post_exact_images','production_writes')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-cardmarket-exact-print-images-v1-${{ github.run_id }}
          path: /tmp/ygo-cardmarket-exact-images-v1/*
          retention-days: 90
          if-no-files-found: warn
