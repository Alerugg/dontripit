name: Apply Yu-Gi-Oh OCG Frozen Version Contract V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/yugioh_ocg_frozen_version_manifest_v1.py'
      - 'backend/app/scripts/apply_yugioh_ocg_frozen_version_contract_v1.py'
      - '.github/workflows/apply-yugioh-ocg-frozen-version-contract-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/yugioh_ocg_frozen_version_manifest_v1.py'
      - 'backend/app/scripts/apply_yugioh_ocg_frozen_version_contract_v1.py'
      - '.github/workflows/apply-yugioh-ocg-frozen-version-contract-v1.yml'

permissions:
  contents: read

concurrency:
  group: yugioh-ocg-frozen-version-contract-v1
  cancel-in-progress: false

jobs:
  exact-links:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile frozen manifest, guarded writer and price projector
        run: |
          python -m py_compile app/scripts/yugioh_ocg_frozen_version_contract_v1.py
          python -m py_compile app/scripts/yugioh_ocg_frozen_version_manifest_v1.py
          python -m py_compile app/scripts/apply_yugioh_ocg_frozen_version_contract_v1.py
          python -m py_compile scripts/project_cardmarket_link_prices.py
      - name: READ ONLY rebuild exact frozen 41-link proposal
        run: |
          mkdir -p /tmp/ygo-ocg-frozen-version-contract-apply
          python -m app.scripts.apply_yugioh_ocg_frozen_version_contract_v1 \
            --report /tmp/ygo-ocg-frozen-version-contract-apply/proposal.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-frozen-version-contract-apply/proposal.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['contract_sha256']=='86e1e0fa94e6bb22a4640513cd166907904b25c7ff6b5f6f3ac2ef68d28eb23c',p
          assert p['pair_manifest_sha256']=='359799b8b165d6974ab703e4b18026b350cfb88d635acf6a765023759b8486f2',p
          assert p['certified_pairs']==41,p
          assert p['already_accepted_same_pair'] in (0,41),p
          assert p['new_links_ready'] in (0,41),p
          assert p['already_accepted_same_pair']+p['new_links_ready']==41,p
          expected={'DOCS':19,'LTGY':11,'CSOC':11}
          rows={r['set_code']:r for r in p['sets']}
          assert {k:rows[k]['pairs'] for k in rows}==expected,p
          if '${{ github.event_name }}' == 'pull_request':
              assert p['already_accepted_same_pair']==0,p
              assert p['new_links_ready']==41,p
              assert {k:rows[k]['new_ready'] for k in rows}==expected,p
              assert {k:rows[k]['regional_accepted_before_or_after'] for k in rows}=={'DOCS':69,'LTGY':75,'CSOC':74},p
          print(json.dumps({'dry_run':'pass','existing':p['already_accepted_same_pair'],'new':p['new_links_ready']},indent=2))
          PY
      - name: Atomically apply 41 frozen first-party version-contract links
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_frozen_version_contract_v1 \
            --apply --confirm APPLY_YUGIOH_OCG_FROZEN_VERSION_CONTRACT_V1 \
            --report /tmp/ygo-ocg-frozen-version-contract-apply/applied.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-frozen-version-contract-apply/applied.json'))
          assert p['status']=='pass',p
          assert p['production_writes'] in (0,41),p
          assert p['already_accepted_same_pair'] in (0,41),p
          assert p['new_links_ready'] in (0,41),p
          assert p['already_accepted_same_pair']+p['new_links_ready']==41,p
          print(json.dumps({'apply_writes':p['production_writes']},indent=2))
          PY
      - name: Project Yu-Gi-Oh Cardmarket prices only from accepted exact idProducts
        if: github.event_name == 'push'
        run: |
          python scripts/project_cardmarket_link_prices.py \
            --game yugioh \
            --apply \
            --report /tmp/ygo-ocg-frozen-version-contract-apply/projection.json
      - name: Prove writer idempotency
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_frozen_version_contract_v1 \
            --apply --confirm APPLY_YUGIOH_OCG_FROZEN_VERSION_CONTRACT_V1 \
            --report /tmp/ygo-ocg-frozen-version-contract-apply/idempotency.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-frozen-version-contract-apply/idempotency.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['already_accepted_same_pair']==41,p
          assert p['new_links_ready']==0,p
          rows={r['set_code']:r for r in p['sets']}
          assert {k:rows[k]['existing_same'] for k in rows}=={'DOCS':19,'LTGY':11,'CSOC':11},p
          assert {k:rows[k]['regional_accepted_before_or_after'] for k in rows}=={'DOCS':88,'LTGY':86,'CSOC':85},p
          print(json.dumps({'idempotency':'pass','exact_links':41},indent=2))
          PY
      - name: Final exact regional identity proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          method='cardmarket_ocg_certified_public_version_contract_v1'
          surfaces={'4680':('DOCS',19,88),'4725':('LTGY',11,86),'4809':('CSOC',11,85)}
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'],connect_timeout=30,application_name='dontripit_ygo_ocg_frozen_version_contract_final_v1')
          conn.set_session(readonly=True,autocommit=False); out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='yugioh' LIMIT 1"); gid=int(cur.fetchone()['id'])
              cur.execute("SELECT max(last_seen_at) capture FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s",(gid,)); capture=cur.fetchone()['capture']
              total=0
              for exp,(set_code,new_method_expected,total_expected) in surfaces.items():
                cur.execute("""SELECT count(*) total,
                    count(*) FILTER (WHERE lower(coalesce(p.language,''))='ja' AND upper(coalesce(s.code,''))=%s) good,
                    count(*) FILTER (WHERE l.mapping_method=%s AND l.confidence='exact' AND l.reviewed=true) method_good,
                    count(DISTINCT e.external_id) products,count(DISTINCT p.id) prints,
                    count(*) FILTER (WHERE e.last_seen_at=%s) current
                  FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN prints p ON p.id=l.print_id JOIN sets s ON s.id=p.set_id
                  WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single'
                    AND e.expansion_external_id=%s AND l.link_status IN ('accepted','mapped','exact')""",(set_code,method,capture,gid,exp))
                x=cur.fetchone(); vals=(int(x['total']),int(x['good']),int(x['products']),int(x['prints']),int(x['current']))
                assert vals==(total_expected,total_expected,total_expected,total_expected,total_expected),(exp,set_code,vals,total_expected)
                assert int(x['method_good'])==new_method_expected,(exp,set_code,x,new_method_expected)
                out[set_code]={'idExpansion':exp,'accepted_exact_ja_links':total_expected,'frozen_version_contract_links':new_method_expected}; total+=new_method_expected
              assert total==41,total
              cur.execute("""SELECT count(*) n,count(DISTINCT l.external_product_id) products,count(DISTINCT l.print_id) prints
                  FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN prints p ON p.id=l.print_id JOIN cards c ON c.id=p.card_id
                  WHERE e.source='cardmarket' AND e.game_id=%s AND l.mapping_method=%s
                    AND l.link_status IN ('accepted','mapped','exact') AND l.confidence='exact' AND l.reviewed=true
                    AND lower(coalesce(p.language,''))='ja'""",(gid,method)); x=cur.fetchone()
              assert (int(x['n']),int(x['products']),int(x['prints']))==(41,41,41),x
              out['total']={'mapping_method':method,'links':41,'products':41,'prints':41}; conn.rollback()
          finally: conn.close()
          open('/tmp/ygo-ocg-frozen-version-contract-apply/final.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-frozen-version-contract-apply-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-frozen-version-contract-apply/*.json
          retention-days: 90
          if-no-files-found: warn
