name: Audit Production Hardening Final V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-production-hardening-final-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout current catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2
          path: catalog

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-run repository trigger safety contract on catalog-v2
        run: |
          mkdir -p artifacts
          python catalog/.github/scripts/audit_main_promotion.py \
            --catalog-root catalog \
            --main-root main \
            --report artifacts/production-hardening-catalog-trigger-safety-v1.json

      - name: Re-run repository trigger safety contract on live main
        run: |
          python catalog/.github/scripts/audit_main_promotion.py \
            --catalog-root main \
            --main-root catalog \
            --report artifacts/production-hardening-main-trigger-safety-v1.json

      - name: Prove scheduler and seven-child frozen-SHA contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              'refresh-onepiece-yugioh-canonical-v2.yml',
              'refresh-pokemon-canonical-v2-sharded.yml',
              'sync-cardmarket-master-production-v2.yml',
              'project-cardmarket-canonical-prices-v2.yml',
              'sync-cardmarket-website-paths.yml',
              'sync-regional-tcg-content.yml',
              'certify-search-v2-production-latency-v1.yml',
          ]
          main_root = Path('main/.github/workflows')
          catalog_root = Path('catalog/.github/workflows')
          text = (main_root / 'daily-catalog-v2-orchestrator.yml').read_text(encoding='utf-8')
          failures = []

          cron_lines = [line.strip() for line in text.splitlines() if line.strip().startswith('- cron:')]
          if cron_lines != ["- cron: '20 4 * * *'"]:
              failures.append(f'expected only permanent cron 20 4 * * *, found {cron_lines!r}')
          if 'TARGET_REF: catalog-v2' not in text:
              failures.append('TARGET_REF is not pinned to catalog-v2')
          if 'push:' in text.split('permissions:', 1)[0]:
              failures.append('orchestrator unexpectedly has push trigger')
          for marker in (
              'const frozenSha = await branchSha();',
              'resolveRun(workflowId, frozenSha, dispatchedAt)',
              'row.head_sha !== frozenSha',
          ):
              if marker not in text:
                  failures.append(f'missing frozen-SHA guard: {marker}')

          positions = []
          for workflow in expected:
              positions.append(text.find(workflow))
              for root_name, root in [('main', main_root), ('catalog-v2', catalog_root)]:
                  path = root / workflow
                  if not path.exists():
                      failures.append(f'{workflow} missing on {root_name}')
                      continue
                  child = path.read_text(encoding='utf-8')
                  trigger_section = child.split('permissions:', 1)[0]
                  if 'workflow_dispatch' not in trigger_section:
                      failures.append(f'{workflow} not workflow_dispatch capable on {root_name}')
                  if root_name == 'catalog-v2' and 'schedule:' in trigger_section:
                      failures.append(f'{workflow} has independent schedule on catalog-v2')
          if any(pos < 0 for pos in positions):
              failures.append('orchestrator is missing one or more certified children')
          elif positions != sorted(positions):
              failures.append('certified child order drifted')

          report = {
              'status': 'fail' if failures else 'pass',
              'production_writes': 0,
              'cron_utc': '20 4 * * *',
              'target_ref': 'catalog-v2',
              'pipeline': expected,
              'failures': failures,
          }
          Path('artifacts/production-hardening-scheduler-contract-v1.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if failures:
              raise SystemExit('scheduler contract failed: ' + ' | '.join(failures))
          PY

      - name: Prove latest scheduled attempt, seven children, and production revision
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          api = 'https://api.github.com'
          expected = [
              'refresh-onepiece-yugioh-canonical-v2.yml',
              'refresh-pokemon-canonical-v2-sharded.yml',
              'sync-cardmarket-master-production-v2.yml',
              'project-cardmarket-canonical-prices-v2.yml',
              'sync-cardmarket-website-paths.yml',
              'sync-regional-tcg-content.yml',
              'certify-search-v2-production-latency-v1.yml',
          ]

          def get_json(url: str, *, github: bool = False):
              headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'dontripit-production-hardening-v1'}
              if github:
                  headers['Authorization'] = f'Bearer {token}'
                  headers['X-GitHub-Api-Version'] = '2022-11-28'
              req = Request(url, headers=headers)
              with urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode('utf-8'))

          def parse_ts(value: str):
              return datetime.fromisoformat(str(value).replace('Z', '+00:00'))

          failures = []
          catalog_sha = str(get_json(f'{api}/repos/{repo}/branches/catalog-v2', github=True)['commit']['sha'])
          main_sha = str(get_json(f'{api}/repos/{repo}/branches/main', github=True)['commit']['sha'])

          runs_payload = get_json(
              f'{api}/repos/{repo}/actions/workflows/daily-catalog-v2-orchestrator.yml/runs?event=schedule&per_page=20',
              github=True,
          )
          completed = [r for r in runs_payload.get('workflow_runs', []) if r.get('status') == 'completed']
          completed.sort(key=lambda r: parse_ts(r.get('updated_at') or r['created_at']), reverse=True)

          latest = completed[0] if completed else None
          child_evidence = []
          age_hours = None
          if latest is None:
              failures.append('no completed scheduled Daily Catalog V2 run found')
          else:
              if latest.get('event') != 'schedule':
                  failures.append(f"authoritative run event is {latest.get('event')!r}, expected schedule")
              if latest.get('conclusion') != 'success':
                  failures.append(f"most recently completed scheduled attempt concluded {latest.get('conclusion')}")

              started_raw = latest.get('run_started_at') or latest.get('created_at')
              started = parse_ts(started_raw)
              updated = parse_ts(latest.get('updated_at') or started_raw)
              age_hours = (datetime.now(timezone.utc) - started).total_seconds() / 3600.0
              if age_hours > 36:
                  failures.append(f'most recent scheduled attempt is stale: {age_hours:.2f}h')

              lower = started.timestamp() - 30
              upper = updated.timestamp() + 30
              for workflow in expected:
                  payload = get_json(
                      f'{api}/repos/{repo}/actions/workflows/{quote(workflow)}/runs?event=workflow_dispatch&branch=catalog-v2&per_page=30',
                      github=True,
                  )
                  candidates = []
                  for run in payload.get('workflow_runs', []):
                      ts = parse_ts(run['created_at']).timestamp()
                      if lower <= ts <= upper and run.get('head_sha') == catalog_sha:
                          candidates.append(run)
                  candidates.sort(key=lambda run: parse_ts(run['created_at']))
                  if not candidates:
                      failures.append(f'{workflow}: no child dispatch on certified SHA inside latest attempt window')
                      continue
                  run = candidates[0]
                  child_evidence.append({
                      'workflow': workflow,
                      'run_id': run.get('id'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'head_sha': run.get('head_sha'),
                      'created_at': run.get('created_at'),
                  })
                  if run.get('status') != 'completed' or run.get('conclusion') != 'success':
                      failures.append(f"{workflow}: run {run.get('id')} is not completed/success")
                  if run.get('head_sha') != catalog_sha:
                      failures.append(f"{workflow}: SHA {run.get('head_sha')} != {catalog_sha}")
              if len(child_evidence) != len(expected):
                  failures.append(f'only {len(child_evidence)}/{len(expected)} children proven')

          health = get_json('https://api.dontripit.com/api/health')
          if health.get('ok') is not True:
              failures.append(f'production health ok != true: {health!r}')
          if health.get('runtime') != 'vercel':
              failures.append(f"production runtime {health.get('runtime')!r} != vercel")
          if health.get('revision') != catalog_sha:
              failures.append(f"production revision {health.get('revision')!r} != catalog-v2 {catalog_sha!r}")

          report = {
              'status': 'fail' if failures else 'pass',
              'production_writes': 0,
              'catalog_v2_head': catalog_sha,
              'main_head': main_sha,
              'production_health': health,
              'authoritative_scheduled_attempt': None if latest is None else {
                  'id': latest.get('id'),
                  'run_attempt': latest.get('run_attempt'),
                  'created_at': latest.get('created_at'),
                  'run_started_at': latest.get('run_started_at'),
                  'updated_at': latest.get('updated_at'),
                  'event': latest.get('event'),
                  'conclusion': latest.get('conclusion'),
                  'age_hours': round(age_hours, 3) if age_hours is not None else None,
              },
              'children_on_certified_catalog_sha': child_evidence,
              'failures': failures,
          }
          Path('artifacts/production-hardening-live-runtime-v1.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if failures:
              raise SystemExit('production hardening live gate failed: ' + ' | '.join(failures))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-hardening-final-v1-${{ github.run_id }}
          path: artifacts/*.json
          retention-days: 30
          if-no-files-found: error
