name: Audit Production Hardening Final V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-production-hardening-final-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout current catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2
          path: catalog

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-run repository trigger safety contract on catalog-v2
        run: |
          mkdir -p artifacts
          python catalog/.github/scripts/audit_main_promotion.py \
            --catalog-root catalog \
            --main-root main \
            --report artifacts/production-hardening-catalog-trigger-safety-v1.json

      - name: Re-run repository trigger safety contract on live main
        run: |
          python catalog/.github/scripts/audit_main_promotion.py \
            --catalog-root main \
            --main-root catalog \
            --report artifacts/production-hardening-main-trigger-safety-v1.json

      - name: Prove single scheduler child registration and dispatch contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              'refresh-onepiece-yugioh-canonical-v2.yml',
              'refresh-pokemon-canonical-v2.yml',
              'sync-cardmarket-master-production-v2.yml',
              'project-cardmarket-canonical-prices-v2.yml',
              'sync-cardmarket-website-paths.yml',
              'sync-regional-tcg-content.yml',
              'certify-search-v2-production-latency-v1.yml',
          ]

          main_root = Path('main/.github/workflows')
          catalog_root = Path('catalog/.github/workflows')
          orchestrator = main_root / 'daily-catalog-v2-orchestrator.yml'
          text = orchestrator.read_text(encoding='utf-8')
          failures = []

          if "cron: '20 4 * * *'" not in text:
              failures.append('main orchestrator daily 04:20 UTC cron missing or changed')
          cron_lines = [
              line.strip()
              for line in text.splitlines()
              if line.strip().startswith('- cron:')
          ]
          if cron_lines != ["- cron: '20 4 * * *'"]:
              failures.append(
                  'main orchestrator must contain only permanent 04:20 UTC cron; '
                  f'found {cron_lines!r}'
              )
          if 'TARGET_REF: catalog-v2' not in text:
              failures.append('main orchestrator no longer pins TARGET_REF=catalog-v2')
          if 'push:' in text.split('permissions:', 1)[0]:
              failures.append('main orchestrator unexpectedly has a push trigger')

          positions = []
          for workflow in expected:
              pos = text.find(workflow)
              if pos < 0:
                  failures.append(f'orchestrator missing child {workflow}')
              positions.append(pos)
              for root_name, root in [('main', main_root), ('catalog-v2', catalog_root)]:
                  path = root / workflow
                  if not path.exists():
                      failures.append(f'{workflow} missing on {root_name}')
                      continue
                  child = path.read_text(encoding='utf-8')
                  if 'workflow_dispatch:' not in child and 'workflow_dispatch' not in child.split('permissions:', 1)[0]:
                      failures.append(f'{workflow} is not dispatchable on {root_name}')
                  if root_name == 'catalog-v2' and 'schedule:' in child.split('permissions:', 1)[0]:
                      failures.append(f'{workflow} has an independent schedule on catalog-v2')

          valid_positions = [p for p in positions if p >= 0]
          if valid_positions != sorted(valid_positions):
              failures.append('orchestrator child order drifted from certified sequential pipeline')

          report = {
              'status': 'fail' if failures else 'pass',
              'production_writes': 0,
              'target_ref': 'catalog-v2',
              'cron_utc': '20 4 * * *',
              'pipeline': expected,
              'registered_on_main': [w for w in expected if (main_root / w).exists()],
              'registered_on_catalog_v2': [w for w in expected if (catalog_root / w).exists()],
              'failures': failures,
          }
          Path('artifacts/production-hardening-scheduler-contract-v1.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if failures:
              raise SystemExit('scheduler contract failed: ' + ' | '.join(failures))
          PY

      - name: Prove latest daily run is fresh/successful and production deploy matches catalog-v2 HEAD
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          api = 'https://api.github.com'

          def get_json(url: str, *, github: bool = False):
              headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'dontripit-production-hardening-v1'}
              if github:
                  headers['Authorization'] = f'Bearer {token}'
                  headers['X-GitHub-Api-Version'] = '2022-11-28'
              req = Request(url, headers=headers)
              with urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode('utf-8'))

          failures = []
          catalog_branch = get_json(f'{api}/repos/{repo}/branches/catalog-v2', github=True)
          main_branch = get_json(f'{api}/repos/{repo}/branches/main', github=True)
          catalog_sha = str(catalog_branch['commit']['sha'])
          main_sha = str(main_branch['commit']['sha'])

          runs_payload = get_json(
              f'{api}/repos/{repo}/actions/workflows/daily-catalog-v2-orchestrator.yml/runs?event=schedule&per_page=10',
              github=True,
          )
          completed = [r for r in runs_payload.get('workflow_runs', []) if r.get('status') == 'completed']
          if not completed:
              failures.append('no completed scheduled Daily Catalog V2 orchestrator run found')
              latest = None
              age_hours = None
          else:
              latest = completed[0]
              created = datetime.fromisoformat(str(latest['created_at']).replace('Z', '+00:00'))
              age_hours = (datetime.now(timezone.utc) - created).total_seconds() / 3600.0
              if latest.get('conclusion') != 'success':
                  failures.append(f"latest scheduled orchestrator run concluded {latest.get('conclusion')}")
              if age_hours > 36:
                  failures.append(f'latest scheduled orchestrator run is stale: {age_hours:.2f}h')

          health = get_json('https://api.dontripit.com/api/health')
          if health.get('ok') is not True:
              failures.append(f'production health ok != true: {health!r}')
          if health.get('runtime') != 'vercel':
              failures.append(f"production health runtime is {health.get('runtime')!r}, expected 'vercel'")
          if health.get('revision') != catalog_sha:
              failures.append(
                  f"production revision {health.get('revision')!r} != catalog-v2 HEAD {catalog_sha!r}"
              )

          recent = [
              {
                  'id': r.get('id'),
                  'created_at': r.get('created_at'),
                  'updated_at': r.get('updated_at'),
                  'status': r.get('status'),
                  'conclusion': r.get('conclusion'),
                  'head_sha': r.get('head_sha'),
              }
              for r in runs_payload.get('workflow_runs', [])[:5]
          ]
          report = {
              'status': 'fail' if failures else 'pass',
              'production_writes': 0,
              'catalog_v2_head': catalog_sha,
              'main_head': main_sha,
              'production_health': health,
              'latest_scheduled_orchestrator': None if latest is None else {
                  'id': latest.get('id'),
                  'created_at': latest.get('created_at'),
                  'updated_at': latest.get('updated_at'),
                  'conclusion': latest.get('conclusion'),
                  'head_sha': latest.get('head_sha'),
                  'age_hours': round(age_hours, 3) if age_hours is not None else None,
              },
              'recent_scheduled_orchestrator_runs': recent,
              'failures': failures,
          }
          Path('artifacts/production-hardening-live-runtime-v1.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if failures:
              raise SystemExit('production hardening live gate failed: ' + ' | '.join(failures))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-hardening-final-v1-${{ github.run_id }}
          path: artifacts/*.json
          retention-days: 30
          if-no-files-found: error
