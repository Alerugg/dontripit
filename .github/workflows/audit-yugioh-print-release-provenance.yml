name: Audit Yu-Gi-Oh PrintRelease provenance

on:
  workflow_dispatch:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - backend/app/scripts/audit_yugioh_print_release_provenance.py
      - .github/workflows/audit-yugioh-print-release-provenance.yml

permissions:
  contents: read

concurrency:
  group: audit-yugioh-print-release-provenance-${{ github.ref }}
  cancel-in-progress: false

env:
  YGOJSON_URL: https://github.com/iconmaster5326/YGOJSON/releases/download/v1/aggregate.zip
  PYTHONPATH: .

jobs:
  provenance-audit:
    name: Source-only PrintRelease provenance topology
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: multilingual-ygo-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Download immutable historical YGOJSON aggregate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ygo-provenance/extracted" artifacts
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/ygo-provenance/aggregate.zip" "$YGOJSON_URL"
          unzip -q "$RUNNER_TEMP/ygo-provenance/aggregate.zip" \
            -d "$RUNNER_TEMP/ygo-provenance/extracted"

      - name: Audit PrintRelease provenance topology
        shell: bash
        run: |
          set -euo pipefail
          python -m app.scripts.audit_yugioh_print_release_provenance \
            --input-dir "$RUNNER_TEMP/ygo-provenance/extracted" \
            --report ../artifacts/yugioh-print-release-provenance.json

      - name: Enforce provenance gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../artifacts/yugioh-print-release-provenance.json').read_text())
          if not r['gate_pass']:
              raise SystemExit('YGO PrintRelease provenance gate failed')
          print(json.dumps({
              'gate_pass': r['gate_pass'],
              'cross_language_source_uuid_reuse_count': r['cross_language_source_uuid_reuse_count'],
              'es': {
                  'canonical_prints': r['targets']['es']['canonical_prints'],
                  'print_release_memberships': r['targets']['es']['print_release_memberships'],
                  'membership_alias_conflicts': r['targets']['es']['membership_alias_conflict_groups'],
              },
              'ja': {
                  'canonical_prints': r['targets']['ja']['canonical_prints'],
                  'print_release_memberships': r['targets']['ja']['print_release_memberships'],
                  'membership_alias_conflicts': r['targets']['ja']['membership_alias_conflict_groups'],
              },
          }, indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-print-release-provenance
          path: artifacts/yugioh-print-release-provenance.json
          if-no-files-found: warn
          retention-days: 30
