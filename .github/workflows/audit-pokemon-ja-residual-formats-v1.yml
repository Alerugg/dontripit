name: Audit Pokemon JA Residual Formats V1

on:
  pull_request:
    paths:
      - '.github/workflows/audit-pokemon-ja-residual-formats-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      TCGDEX_CARDS_SHA: 771a8381c57c73182b9776657a15cd1166c66d36
      TCGDEX_CARDS_REPO: ${{ github.workspace }}/tcgdex-cards
      OUTPUT: backend/artifacts/pokemon-ja-residual-formats-v1.json

    steps:
      - name: Checkout Dontripit
        uses: actions/checkout@v4

      - name: Checkout pinned TCGdex source
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 771a8381c57c73182b9776657a15cd1166c66d36
          path: tcgdex-cards
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Probe alternate exact JA asset representations - READ ONLY
        env:
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          test "$(git -C "$TCGDEX_CARDS_REPO" rev-parse HEAD)" = "$TCGDEX_CARDS_SHA"
          python - <<'PY'
          import hashlib, json, os, re, threading
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import requests
          from sqlalchemy import create_engine, text

          ROOT=Path(os.environ['TCGDEX_CARDS_REPO'])/'data-asia'
          PIN=os.environ['TCGDEX_CARDS_SHA']
          ID_RE=re.compile(r'\bid\s*:\s*["\']([^"\']+)["\']')
          VARIANTS=('high.png','high.jpg','low.webp','low.png','low.jpg')
          PREFERENCE=('high.png','high.jpg','low.webp','low.png','low.jpg')

          set_to_asset_series={}
          for path in ROOT.rglob('*.ts'):
              rel=path.relative_to(ROOT)
              if len(rel.parts)<2:
                  continue
              try: content=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if 'import { Set }' not in content or 'import serie from' not in content:
                  continue
              m=ID_RE.search(content)
              if not m: continue
              sid=m.group(1); series=rel.parts[0]
              prior=set_to_asset_series.get(sid)
              if prior and prior!=series:
                  raise RuntimeError(f'conflicting asset series for {sid}: {prior} vs {series}')
              set_to_asset_series[sid]=series
          if len(set_to_asset_series)!=333:
              raise RuntimeError(f'Asia set index drift: {len(set_to_asset_series)}')
          set_ids=sorted(set_to_asset_series,key=len,reverse=True)

          engine=create_engine(os.environ['DATABASE_URL_UNPOOLED'],pool_pre_ping=True)
          with engine.connect() as conn:
              conn.execute(text('SET TRANSACTION READ ONLY'))
              if conn.execute(text('SHOW transaction_read_only')).scalar_one()!='on':
                  raise RuntimeError('audit connection is not read-only')
              existing=[dict(r) for r in conn.execute(text('''
                SELECT p.id print_id,p.language,p.variant,p.collector_number,im.url,im.source,im.is_primary,
                       ids.cnt ja_identifier_count,ids.external_id
                FROM prints p JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
                JOIN print_images im ON im.print_id=p.id
                LEFT JOIN LATERAL (
                  SELECT COUNT(*)::int cnt,MIN(pi.external_id) external_id
                  FROM print_identifiers pi WHERE pi.print_id=p.id AND pi.source='tcgdex:ja'
                ) ids ON TRUE
                WHERE g.slug='pokemon' AND p.language='ja' AND im.source='tcgdex:ja'
                ORDER BY p.id,im.id
              ''')).mappings().all()]
              missing=[dict(r) for r in conn.execute(text('''
                SELECT p.id print_id,p.language,p.variant,p.collector_number,p.print_key,c.name card_name,
                       s.code set_code,s.name set_name,ids.cnt ja_identifier_count,ids.external_id
                FROM prints p JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
                LEFT JOIN sets s ON s.id=p.set_id
                LEFT JOIN LATERAL (
                  SELECT COUNT(*)::int cnt,MIN(pi.external_id) external_id
                  FROM print_identifiers pi WHERE pi.print_id=p.id AND pi.source='tcgdex:ja'
                ) ids ON TRUE
                WHERE g.slug='pokemon' AND p.language='ja'
                  AND NOT EXISTS(SELECT 1 FROM print_images im WHERE im.print_id=p.id)
                ORDER BY p.id
              ''')).mappings().all()]
              conn.rollback()

          if len(existing)!=4002: raise RuntimeError(f'JA existing source baseline drift: {len(existing)}')
          if len(missing)!=4157: raise RuntimeError(f'JA residual baseline drift: {len(missing)}')

          existing_errors=[]
          for row in existing:
              if row.get('language')!='ja' or row.get('variant')!='default' or not bool(row.get('is_primary')):
                  existing_errors.append({'print_id':row['print_id'],'reason':'scope'}); continue
              if int(row.get('ja_identifier_count') or 0)!=1 or not row.get('external_id'):
                  existing_errors.append({'print_id':row['print_id'],'reason':'identifier'}); continue
              ext=str(row['external_id'])
              sid=next((x for x in set_ids if ext.startswith(x+'-')),None)
              if not sid:
                  existing_errors.append({'print_id':row['print_id'],'reason':'no-pinned-set','external_id':ext}); continue
              local=ext[len(sid)+1:]
              expected=f'https://assets.tcgdex.net/ja/{set_to_asset_series[sid]}/{sid}/{local}/high.webp'
              if str(row.get('url') or '')!=expected:
                  existing_errors.append({'print_id':row['print_id'],'reason':'url-mismatch','actual':row.get('url'),'expected':expected})
          if existing_errors:
              raise RuntimeError(f'existing JA integrity violations: {existing_errors[:20]} total={len(existing_errors)}')

          candidates=[]; errors=[]
          for row in missing:
              if row.get('language')!='ja' or row.get('variant')!='default' or int(row.get('ja_identifier_count') or 0)!=1 or not row.get('external_id'):
                  errors.append({'print_id':row['print_id'],'reason':'identity-shape'}); continue
              ext=str(row['external_id'])
              sid=next((x for x in set_ids if ext.startswith(x+'-')),None)
              if not sid:
                  errors.append({'print_id':row['print_id'],'reason':'no-pinned-set','external_id':ext}); continue
              local=ext[len(sid)+1:]
              base=f'https://assets.tcgdex.net/ja/{set_to_asset_series[sid]}/{sid}/{local}'
              candidates.append({
                'print_id':int(row['print_id']),'external_id':ext,'collector_number':row.get('collector_number'),
                'set_code':row.get('set_code'),'card_name':row.get('card_name'),'canonical_set_id':sid,
                'asset_series':set_to_asset_series[sid],'local_id':local,'base':base,
              })
          if errors:
              raise RuntimeError(f'JA residual mapping violations: {errors[:20]} total={len(errors)}')
          if len(candidates)!=4157:
              raise RuntimeError(f'JA residual candidate mismatch: {len(candidates)}')

          tls=threading.local()
          def session():
              if not hasattr(tls,'s'):
                  tls.s=requests.Session()
                  tls.s.headers.update({
                    'User-Agent':'Dontripit Pokemon JA exact alternate asset auditor/1.0',
                    'Accept':'image/avif,image/webp,image/png,image/jpeg,image/*;q=0.9,*/*;q=0.1',
                  })
              return tls.s

          def probe_url(url):
              try:
                  r=session().get(url,timeout=14,stream=True,allow_redirects=True)
                  ctype=str(r.headers.get('Content-Type') or '').lower()
                  prefix=next(r.iter_content(32),b'') if r.status_code==200 else b''
                  ok=r.status_code==200 and ctype.startswith('image/') and bool(prefix)
                  return {'status':r.status_code,'content_type':ctype,'prefix_hex':prefix[:12].hex(),'image_ok':ok,'final_url':r.url}
              except Exception as exc:
                  return {'status':type(exc).__name__,'error':str(exc),'image_ok':False}

          def probe_candidate(item):
              statuses={}; available=[]
              for variant in VARIANTS:
                  url=f"{item['base']}/{variant}"
                  result=probe_url(url)
                  statuses[variant]=result
                  if result.get('image_ok'):
                      available.append({'variant':variant,'url':url,**result})
              best=None
              for pref in PREFERENCE:
                  match=next((x for x in available if x['variant']==pref),None)
                  if match:
                      best=match; break
              return {**item,'statuses':statuses,'available':available,'best':best}

          results=[]
          with ThreadPoolExecutor(max_workers=36) as pool:
              futures=[pool.submit(probe_candidate,x) for x in candidates]
              for f in as_completed(futures): results.append(f.result())
          results.sort(key=lambda x:x['print_id'])

          variant_status_counts={}
          variant_verified={}
          for variant in VARIANTS:
              variant_status_counts[variant]=dict(Counter(str(r['statuses'][variant].get('status')) for r in results))
              variant_verified[variant]=sum(1 for r in results if r['statuses'][variant].get('image_ok'))

          recoverable=[r for r in results if r.get('best')]
          best_variant_counts=dict(Counter(r['best']['variant'] for r in recoverable))
          per_set=defaultdict(lambda:{'count':0,'recoverable':0,'best_variants':Counter()})
          for r in results:
              code=str(r.get('set_code'))
              per_set[code]['count']+=1
              if r.get('best'):
                  per_set[code]['recoverable']+=1
                  per_set[code]['best_variants'][r['best']['variant']]+=1
          per_set={k:{'count':v['count'],'recoverable':v['recoverable'],'best_variants':dict(v['best_variants'])} for k,v in sorted(per_set.items())}

          manifest_lines=[f"{r['print_id']}|{r['external_id']}|{r['best']['variant']}|{r['best']['url']}\n" for r in recoverable]
          manifest_sha=hashlib.sha256(''.join(manifest_lines).encode('utf-8')).hexdigest()

          report={
            'status':'pass','mode':'read-only-ja-alternate-format-probe','production_writes':0,
            'source_version':PIN,'asia_sets_indexed':len(set_to_asset_series),
            'existing_ja_image_rows_validated':len(existing),'residual_total':len(missing),
            'tested_variants':list(VARIANTS),'variant_status_counts':variant_status_counts,
            'variant_verified_images':variant_verified,'recoverable_prints':len(recoverable),
            'best_variant_counts':best_variant_counts,'recoverable_manifest_sha256':manifest_sha,
            'per_set':per_set,
            'recoverable_manifest':[{
              'print_id':r['print_id'],'external_id':r['external_id'],'set_code':r.get('set_code'),
              'variant':r['best']['variant'],'url':r['best']['url'],'content_type':r['best'].get('content_type'),
            } for r in recoverable],
            'candidate_results':[{
              'print_id':r['print_id'],'external_id':r['external_id'],'set_code':r.get('set_code'),
              'statuses':{v:{'status':r['statuses'][v].get('status'),'content_type':r['statuses'][v].get('content_type'),'image_ok':r['statuses'][v].get('image_ok')} for v in VARIANTS},
              'best_variant':r['best']['variant'] if r.get('best') else None,
            } for r in results],
          }
          out=Path(os.environ['OUTPUT']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False,default=str)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k not in ('candidate_results','recoverable_manifest','per_set')},indent=2,sort_keys=True,ensure_ascii=False,default=str))
          print(json.dumps({'top_recoverable_sets':sorted([(k,v['recoverable']) for k,v in per_set.items() if v['recoverable']],key=lambda x:(-x[1],x[0]))[:50]},indent=2,ensure_ascii=False))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-ja-residual-formats-v1-${{ github.run_id }}
          path: backend/artifacts/pokemon-ja-residual-formats-v1.json
          retention-days: 30
