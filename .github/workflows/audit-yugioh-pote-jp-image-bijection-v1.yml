name: Audit Yu-Gi-Oh POTE-JP Image Bijection V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_residual_image_bijection_v1.py'
      - '.github/workflows/audit-yugioh-pote-jp-image-bijection-v1.yml'

permissions:
  contents: read

jobs:
  image-match:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {key: spirit-of-neos, card: 'Elemental HERO Spirit of Neos'}
          - {key: spright-blue, card: 'Spright Blue'}
          - {key: therion-irregular, card: 'Therion Irregular'}
          - {key: albaz-the-ashen, card: 'Albaz the Ashen'}
          - {key: tearlaments-scheiren, card: 'Tearlaments Scheiren'}
          - {key: vernusylph-flourishing-hills, card: 'Vernusylph of the Flourishing Hills'}
          - {key: kurikara-divincarnate, card: 'Kurikara Divincarnate'}
          - {key: aussa-earth-channeler, card: 'Aussa the Earth Channeler'}
          - {key: vendread-scavenger, card: 'Vendread Scavenger'}
          - {key: shining-neos-wingman, card: 'Elemental HERO Shining Neos Wingman'}
          - {key: tearlaments-kitkallos, card: 'Tearlaments Kitkallos'}
          - {key: tearlaments-kaleido-heart, card: 'Tearlaments Kaleido-Heart'}
          - {key: gem-knight-lady-rose-diamond, card: 'Gem-Knight Lady Rose Diamond'}
          - {key: gigantic-spright, card: 'Gigantic Spright'}
          - {key: spright-elf, card: 'Spright Elf'}
          - {key: engage-neo-space, card: 'EN - Engage Neo Space'}
          - {key: ultimate-slayer, card: 'Ultimate Slayer'}
          - {key: draco-utopian-aura, card: 'Draco-Utopian Aura'}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Install audit-only image dependency
        run: pip install 'Pillow>=10,<13'
      - name: Compile generic OCG image certifier
        run: python -m py_compile app/scripts/audit_yugioh_ocg_residual_image_bijection_v1.py
      - name: Certify one complete residual POTE-JP physical group
        run: |
          mkdir -p /tmp/pote-image-bijection
          python -m app.scripts.audit_yugioh_ocg_residual_image_bijection_v1 \
            --id-expansion 5044 \
            --expansion-code POTE-JP \
            --set-code POTE \
            --card-name "${{ matrix.card }}" \
            --report "/tmp/pote-image-bijection/${{ matrix.key }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-pote-jp-image-${{ matrix.key }}-${{ github.run_id }}
          path: /tmp/pote-image-bijection/${{ matrix.key }}.json
          retention-days: 90
          if-no-files-found: error
