name: Audit Yu-Gi-Oh Print Images Fresh V2

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-yugioh-print-images-fresh-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PGOPTIONS: -c default_transaction_read_only=on
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Audit and probe exact current YGO physical candidates READ ONLY
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from collections import Counter
          from pathlib import Path

          from PIL import Image
          from sqlalchemy import create_engine, text

          db_url = os.environ['DATABASE_URL_UNPOOLED']
          engine = create_engine(db_url, pool_pre_ping=True)
          accepted = ('accepted','mapped','exact')

          with engine.connect() as conn:
              conn.execute(text('SET TRANSACTION READ ONLY'))
              assert conn.execute(text('SHOW transaction_read_only')).scalar_one() == 'on'
              capture = conn.execute(text('''
                SELECT max(e.last_seen_at)
                FROM external_catalog_products e
                JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.product_group='single' AND g.slug='yugioh'
              ''')).scalar_one()
              missing = conn.execute(text('''
                SELECT p.id,p.language,s.code
                FROM prints p JOIN cards c ON c.id=p.card_id
                JOIN games g ON g.id=c.game_id
                JOIN sets s ON s.id=p.set_id
                WHERE g.slug='yugioh'
                  AND NOT EXISTS (SELECT 1 FROM print_images pi WHERE pi.print_id=p.id)
              ''')).mappings().all()
              rows = conn.execute(text('''
                WITH claims AS (
                  SELECT l.id link_id,l.external_product_id,l.print_id,l.link_status,l.mapping_method,
                         l.confidence,l.reviewed,
                         count(*) OVER(PARTITION BY l.external_product_id) product_claims,
                         count(*) OVER(PARTITION BY l.print_id) print_claims
                  FROM external_catalog_print_links l
                  JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN games g ON g.id=e.game_id
                  WHERE e.source='cardmarket' AND e.product_group='single' AND g.slug='yugioh'
                    AND l.link_status IN ('accepted','mapped','exact')
                )
                SELECT p.id print_id,p.collector_number,p.language,p.rarity,p.variant,
                       c.name card_name,s.code set_code,
                       e.external_id id_product,e.category_id,e.expansion_external_id,
                       cl.mapping_method,cl.confidence,cl.reviewed
                FROM claims cl
                JOIN external_catalog_products e ON e.id=cl.external_product_id
                JOIN prints p ON p.id=cl.print_id
                JOIN cards c ON c.id=p.card_id
                JOIN sets s ON s.id=p.set_id
                WHERE e.last_seen_at=:capture
                  AND cl.confidence='exact' AND cl.reviewed IS TRUE
                  AND cl.product_claims=1 AND cl.print_claims=1
                  AND NOT EXISTS (SELECT 1 FROM print_images pi WHERE pi.print_id=p.id)
                ORDER BY p.language,s.code,p.collector_number,p.id
              '''), {'capture': capture}).mappings().all()

          def token(collector):
              value=str(collector or '').strip()
              m=re.fullmatch(r'(.+?JP)(\d{3})',value,flags=re.I)
              if m: return m.group(1).upper()
              m=re.fullmatch(r'(.+?)-(\d{3})',value)
              if m: return m.group(1).upper()
              return None

          headers={
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36',
              'Accept':'image/avif,image/webp,image/png,image/jpeg,image/*;q=0.8,*/*;q=0.1',
              'Referer':'https://www.cardmarket.com/',
          }
          results=[]
          for raw in rows:
              row=dict(raw)
              t=token(row['collector_number'])
              pid=str(row['id_product'] or '').strip(); cat=str(row['category_id'] or '').strip()
              url=f'https://product-images.s3.cardmarket.com/{cat}/{t}/{pid}/{pid}.jpg' if t and pid and cat else None
              out={**row,'directory_token':t,'url':url,'valid':False}
              if not url:
                  out['status']='unresolved_directory'
                  results.append(out); continue
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(); status=int(getattr(r,'status',200) or 200)
                  with Image.open(io.BytesIO(body)) as im:
                      im.verify()
                  with Image.open(io.BytesIO(body)) as im:
                      width,height=im.size; fmt=im.format
                  out.update(status=status,valid=bool(width and height),width=width,height=height,format=fmt,
                             sha256=hashlib.sha256(body).hexdigest(),bytes=len(body))
              except urllib.error.HTTPError as exc:
                  out.update(status=int(exc.code),error=f'HTTP {exc.code}')
              except Exception as exc:
                  out.update(status=None,error=f'{type(exc).__name__}: {exc}')
              results.append(out)

          valid=[r for r in results if r['valid']]
          report={
              'status':'pass',
              'production_writes':0,
              'transaction_read_only':True,
              'cardmarket_capture':capture.isoformat() if capture else None,
              'missing_print_images_total':len(missing),
              'missing_by_language':dict(sorted(Counter(str(r['language'] or 'unknown') for r in missing).items())),
              'exact_reviewed_one_to_one_current_missing':len(rows),
              'eligible_by_language':dict(sorted(Counter(str(r['language'] or 'unknown') for r in rows).items())),
              'probe_counts':dict(sorted(Counter('valid' if r['valid'] else f"status_{r.get('status')}" for r in results).items())),
              'valid_exact_product_images':len(valid),
              'valid_rows':valid,
              'unresolved_rows':[r for r in results if not r['valid']],
          }
          assert len({r['url'] for r in valid})==len(valid), report
          Path('artifacts/yugioh-print-images-fresh-v2.json').write_text(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False,default=str)+'\n')
          print(json.dumps({
              'status':report['status'],
              'production_writes':0,
              'capture':report['cardmarket_capture'],
              'missing':report['missing_print_images_total'],
              'missing_by_language':report['missing_by_language'],
              'eligible_exact_1to1':report['exact_reviewed_one_to_one_current_missing'],
              'eligible_by_language':report['eligible_by_language'],
              'valid_now':report['valid_exact_product_images'],
              'probe_counts':report['probe_counts'],
              'valid_rows':[
                {k:r.get(k) for k in ('print_id','card_name','collector_number','language','rarity','variant','id_product','url','sha256','width','height','format')}
                for r in valid
              ],
          },indent=2,sort_keys=True,ensure_ascii=False,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-print-images-fresh-v2-${{ github.run_id }}
          path: backend/artifacts/yugioh-print-images-fresh-v2.json
          retention-days: 30
          if-no-files-found: error
