name: Patch Step 4 Child Contracts

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/patch-step4-child-contracts.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-step4-child-contracts
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
          fetch-depth: 0
      - name: Patch child scheduling and production gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          scheduled_children = [
              '.github/workflows/ingest.yml',
              '.github/workflows/cardmarket-pokemon-daily.yml',
              '.github/workflows/project-mtg-cardmarket-prices.yml',
              '.github/workflows/project-pokemon-cardmarket-prices.yml',
              '.github/workflows/project-yugioh-cardmarket-prices.yml',
              '.github/workflows/project-onepiece-cardmarket-prices.yml',
              '.github/workflows/refresh-onepiece-yugioh-canonical-v2.yml',
              '.github/workflows/sync-cardmarket-master-production-v2.yml',
              '.github/workflows/sync-cardmarket-website-paths.yml',
              '.github/workflows/audit-cardmarket-current-coverage-live.yml',
              '.github/workflows/sync-regional-tcg-content-v4.yml',
          ]
          for name in scheduled_children:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text2, n = re.subn(r'(?m)^  schedule:\n(?:    [^\n]*\n)+', '', text, count=1)
              if n:
                  p.write_text(text2, encoding='utf-8')
                  print('removed child schedule:', name)
              else:
                  print('already manual/dispatch-only:', name)

          mtg = Path('.github/workflows/project-mtg-cardmarket-prices.yml')
          text = mtg.read_text(encoding='utf-8')
          old_select = """                       count(*) FILTER (WHERE ps.price_low IS NOT NULL OR ps.price_mid IS NOT NULL OR ps.price_market IS NOT NULL OR ps.price_last IS NOT NULL) AS valued,\n                       count(DISTINCT ps.entity_id) AS prints\n"""
          new_select = """                       count(*) FILTER (WHERE ps.price_low IS NOT NULL OR ps.price_mid IS NOT NULL OR ps.price_market IS NOT NULL OR ps.price_last IS NOT NULL) AS valued,\n                       count(*) FILTER (\n                         WHERE (ps.price_low IS NOT NULL AND ps.price_low <= 0)\n                            OR (ps.price_mid IS NOT NULL AND ps.price_mid <= 0)\n                            OR (ps.price_market IS NOT NULL AND ps.price_market <= 0)\n                            OR (ps.price_last IS NOT NULL AND ps.price_last <= 0)\n                       ) AS nonpositive,\n                       count(DISTINCT ps.entity_id) AS prints\n"""
          if old_select in text:
              text = text.replace(old_select, new_select, 1)
          elif 'AS nonpositive' not in text:
              raise SystemExit('MTG proof SELECT shape changed; refusing blind patch')
          old_check = """          proof={k:(v.isoformat() if hasattr(v,'isoformat') else int(v)) for k,v in dict(row).items()}\n          if proof['prints'] < 80000 or proof['valued'] != proof['prints']:\n              raise AssertionError(proof)\n"""
          new_check = """          proof={k:(v.isoformat() if hasattr(v,'isoformat') else int(v)) for k,v in dict(row).items()}\n          proof['unpriced'] = proof['prints'] - proof['valued']\n          # A current Cardmarket row may legitimately have no publishable numeric value.\n          # Keep it NULL; never borrow a sibling/historical/zero price.\n          if proof['prints'] < 80000 or proof['valued'] > proof['prints'] or proof['nonpositive'] != 0:\n              raise AssertionError(proof)\n"""
          if old_check in text:
              text = text.replace(old_check, new_check, 1)
          elif "proof['unpriced']" not in text:
              raise SystemExit('MTG proof assertion shape changed; refusing blind patch')
          mtg.write_text(text, encoding='utf-8')

          gate = Path('.github/workflows/audit-cardmarket-point4-production-gate.yml')
          text = gate.read_text(encoding='utf-8')
          marker = """                r['single_product_ambiguities']=int(cur.fetchone()['n'])\n\n"""
          addition = marker + """                # Cardmarket may legitimately group finish/language variants under one\n                # idProduct. That is safe only when every linked Print resolves to the\n                # same canonical card + set + collector identity.\n                cur.execute('''\n                  SELECT count(*) n FROM (\n                    SELECT l.external_product_id\n                    FROM external_catalog_print_links l\n                    JOIN external_catalog_products e ON e.id=l.external_product_id\n                    JOIN prints p ON p.id=l.print_id\n                    WHERE e.source='cardmarket' AND e.product_group='single' AND e.game_id=%s\n                      AND l.link_status=ANY(%s)\n                    GROUP BY l.external_product_id\n                    HAVING count(DISTINCT (p.card_id,p.set_id,upper(coalesce(p.collector_number,'')))) > 1\n                  ) q\n                ''',(gid,list(ACCEPTED)))\n                r['single_product_mixed_identity']=int(cur.fetchone()['n'])\n\n"""
          if marker in text and "r['single_product_mixed_identity']" not in text:
              text = text.replace(marker, addition, 1)
          elif "r['single_product_mixed_identity']" not in text:
              raise SystemExit('Point 4 gate product metric shape changed; refusing blind patch')
          old_tuple = "('single_print_ambiguities','single_product_ambiguities','single_cross_game','stale_or_mismatched_print_prices','sealed_structural_ambiguities','sealed_cross_game','stale_or_mismatched_sealed_prices')"
          new_tuple = "('single_print_ambiguities','single_product_mixed_identity','single_cross_game','stale_or_mismatched_print_prices','sealed_structural_ambiguities','sealed_cross_game','stale_or_mismatched_sealed_prices')"
          if old_tuple in text:
              text = text.replace(old_tuple, new_tuple, 1)
          elif new_tuple not in text:
              raise SystemExit('Point 4 gate failure tuple changed; refusing blind patch')
          gate.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- .github/workflows
      - name: Commit patched contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git commit -m 'Harden Step 4 child workflow contracts'
          git push origin HEAD:catalog-v2
