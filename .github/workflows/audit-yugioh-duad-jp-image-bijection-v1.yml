name: Audit Yu-Gi-Oh DUAD-JP Image Bijection V1

on:
  pull_request:
    paths:
      - '.github/workflows/audit-yugioh-duad-jp-image-bijection-v1.yml'
      - 'backend/app/scripts/audit_yugioh_ocg_residual_image_bijection_v1.py'
      - 'backend/app/scripts/audit_yugioh_agov_jp_image_match_pilot_v1.py'

permissions:
  contents: read

jobs:
  image-match:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {key: lunalight-gold-leo, card: 'Lunalight Gold Leo'}
          - {key: serene-psychic-girl, card: 'Serene Psychic Girl'}
          - {key: the-monarchs-revolt, card: 'The Monarchs Revolt'}
          - {key: gorgon-of-zilofthonia, card: 'Gorgon of Zilofthonia'}
          - {key: heroic-champion-magnum-excalibur, card: 'Heroic Champion - Magnum Excalibur'}
          - {key: trap-holic, card: 'Trap Holic'}
          - {key: artmage-diactorus, card: 'Artmage Diactorus'}
          - {key: angry-burger, card: 'Angry Burger'}
          - {key: morgana-the-witch-of-eyes, card: 'Morgana the Witch of Eyes'}
          - {key: miasma-dragon-tistina, card: 'Miasma Dragon Tistina'}
          - {key: eidos-the-underworld-monarch, card: 'Eidos the Underworld Monarch'}
          - {key: sky-striker-special-maneuver-lemnisgate, card: 'Sky Striker Special Maneuver - Lemnisgate!'}
          - {key: artmage-finmel, card: 'Artmage Finmel'}
          - {key: argostars-adventurous-arion, card: 'Argostars - Adventurous Arion'}
          - {key: number-f0-utopic-future-zexal, card: 'Number F0: Utopic Future Zexal'}
          - {key: ukanomitsune-no-onari, card: 'Ukanomitsune-no-Onari'}
          - {key: nerva-the-power-patron-of-creation, card: 'Nerva the Power Patron of Creation'}
          - {key: lunalight-liger-dancer, card: 'Lunalight Liger Dancer'}
          - {key: artmage-graflare, card: 'Artmage Graflare'}
          - {key: linkslayer-ignister, card: 'Linkslayer @Ignister'}
          - {key: guilt-gripping-morganite, card: 'Guilt-Gripping Morganite'}
          - {key: mind-procedure, card: 'Mind Procedure'}
          - {key: inferno-of-the-ashened, card: 'Inferno of the Ashened'}
          - {key: dodododo-warrior, card: 'Dodododo Warrior'}
          - {key: kaibaman-the-legend, card: 'Kaibaman the Legend'}
          - {key: artmage-academic-arcane-arts-acropolis, card: 'Artmage Academic Arcane Arts Acropolis'}
          - {key: absolute-axon-kicker, card: 'Absolute Axon Kicker'}
          - {key: lunalight-perfume-dancer, card: 'Lunalight Perfume Dancer'}
          - {key: psychic-blaster-mk-ii, card: 'Psychic Blaster Mk-II'}
          - {key: gagagaga-girl, card: 'Gagagaga Girl'}
          - {key: secreterion-dragon, card: 'Secreterion Dragon'}
          - {key: wake-cup-mocha, card: 'WAKE CUP! Mocha'}
          - {key: super-quantum-black-layer, card: 'Super Quantum Black Layer'}
          - {key: vanquish-soul-hollie-sue, card: 'Vanquish Soul Hollie Sue'}
          - {key: dark-flare-swordsman, card: 'Dark Flare Swordsman'}
          - {key: regenesis-commands, card: 'Regenesis Commands'}
          - {key: unbreakable-xyz-barrier, card: 'Unbreakable Xyz Barrier'}
          - {key: artmage-litera, card: 'Artmage Litera'}
          - {key: medius-the-pure, card: 'Medius the Pure'}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Install audit-only image dependency
        run: pip install 'Pillow>=10,<13'
      - name: Compile generic OCG image certifier
        run: python -m py_compile app/scripts/audit_yugioh_ocg_residual_image_bijection_v1.py
      - name: Certify one complete residual DUAD-JP 2x2 physical group
        run: |
          mkdir -p /tmp/duad-image-bijection
          python -m app.scripts.audit_yugioh_ocg_residual_image_bijection_v1 \
            --id-expansion 6129 \
            --expansion-code DUAD-JP \
            --set-code DUAD \
            --card-name "${{ matrix.card }}" \
            --report "/tmp/duad-image-bijection/${{ matrix.key }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-duad-jp-image-${{ matrix.key }}-${{ github.run_id }}
          path: /tmp/duad-image-bijection/${{ matrix.key }}.json
          retention-days: 90
          if-no-files-found: error
