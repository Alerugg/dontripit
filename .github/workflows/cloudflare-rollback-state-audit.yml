name: Cloudflare Rollback State Audit

on:
  push:
    branches: [infra/cloudflare-catalog-cache-hardening]
    paths:
      - '.github/triggers/cloudflare-rollback-state-audit'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7fcca192ccc3d1f2f0d9d5843391a2f5
      APEX: https://dontripit.com
      EXPECTED_VERCEL_CNAME: bc5bf74c5be387d6.vercel-dns-017.com
    steps:
      - name: Verify exact rollback state
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_code=$(curl -sS "${auth[@]}" -o /tmp/zone.json -w '%{http_code}' 'https://api.cloudflare.com/client/v4/zones?name=dontripit.com&status=active')
          test "$zone_code" = "200"
          zone_id=$(jq -r '.result[0].id // empty' /tmp/zone.json); test -n "$zone_id"

          dns_code=$(curl -sS "${auth[@]}" -o /tmp/dns.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=dontripit.com&per_page=100")
          test "$dns_code" = "200"
          jq -c '.result[] | {type,name,content,proxied,ttl}' /tmp/dns.json
          cname_count=$(jq --arg expected "$EXPECTED_VERCEL_CNAME" '[.result[] | select(.type=="CNAME" and .name=="dontripit.com" and .content==$expected and .proxied==false)] | length' /tmp/dns.json)
          mx_count=$(jq '[.result[] | select(.type=="MX")] | length' /tmp/dns.json)
          spf_count=$(jq '[.result[] | select(.type=="TXT" and (.content|contains("include:_spf-eu.ionos.com")))] | length' /tmp/dns.json)
          echo "vercel_cname=$cname_count mx=$mx_count spf=$spf_count"
          test "$cname_count" = "1"
          test "$mx_count" -ge 2
          test "$spf_count" -ge 1

          domains_code=$(curl -sS "${auth[@]}" -o /tmp/domains.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")
          test "$domains_code" = "200"
          current=$(jq -r '.result[] | select(.hostname=="dontripit.com") | .service // empty' /tmp/domains.json | head -1)
          echo "custom_domain_service=${current:-none}"
          test -z "$current"

          green=0
          for i in $(seq 1 36); do
            code=$(curl -L -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' --max-time 25 "$APEX/" || true)
            server=$(awk -F': ' 'tolower($1)=="server" {print tolower($2)}' /tmp/headers | tr -d '\r' | tail -1)
            fallback=$(awk -F': ' 'tolower($1)=="x-dontripit-fallback" {print tolower($2)}' /tmp/headers | tr -d '\r' | tail -1)
            echo "public_probe=$i status=$code server=${server:-missing} fallback=${fallback:-none}"
            if [ "$code" = "200" ] && [ "$server" = "vercel" ]; then green=1; break; fi
            sleep 5
          done
          test "$green" = "1"

          health=$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 30 "$APEX/api/health")
          echo "health=$health"
          test "$health" = "200"
          jq -e '.status=="ok"' /tmp/health >/dev/null
          echo 'ROLLBACK_STATE_GREEN=yes'
