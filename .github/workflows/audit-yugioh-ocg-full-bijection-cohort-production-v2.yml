name: Audit Yu-Gi-Oh OCG Full Bijection Cohort Production V2

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_full_bijection_cohort_production_v2.py'
      - '.github/workflows/audit-yugioh-ocg-full-bijection-cohort-production-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_COHORT_PROOF_V2_OUTPUT: /tmp/ygo-ocg-cohort-proof-v2/production.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile stable writer and independent proof
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_full_bijection_cohort_v2.py
          python -m py_compile app/scripts/audit_yugioh_ocg_full_bijection_cohort_production_v2.py
      - name: READ ONLY certify 715 exact identities and exact-idProduct prices
        run: |
          mkdir -p /tmp/ygo-ocg-cohort-proof-v2
          python -m app.scripts.audit_yugioh_ocg_full_bijection_cohort_production_v2
      - name: Require production proof PASS
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-cohort-proof-v2/production.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['stable_identity_sha256']=='9a2b8ed9c43c0110fd8818a4b91239b26a565addaf5a88f4d898f6d6d41311ac',p
          assert p['accepted_links']==715 and p['unique_products']==715 and p['unique_prints']==715,p
          assert len(p['sets'])==21,p
          assert all(r['wrong_language']==0 and r['wrong_set']==0 and r['wrong_method']==0 and r['stale']==0 for r in p['sets'].values()),p
          q=p['pricing']
          assert q['canonical_current_wrong_idProduct']==0,p
          assert q['canonical_current_exact_idProduct_prices']==q['externally_priceable_links'],p
          print(json.dumps({'identity':'715/715','stable_identity_sha256':p['stable_identity_sha256'],'pricing':q},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-full-bijection-cohort-production-v2-${{ github.run_id }}
          path: /tmp/ygo-ocg-cohort-proof-v2/*.json
          retention-days: 90
          if-no-files-found: warn
