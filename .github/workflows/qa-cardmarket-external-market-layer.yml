name: QA Cardmarket External Market Layer

on:
  pull_request:
    branches:
      - catalog-v2
    paths:
      - 'backend/alembic/versions/20260809_28_add_external_catalog_market_layer.py'
      - 'backend/app/external_catalog_models.py'
      - 'backend/app/jobs/cardmarket_catalog_ingest.py'
      - 'backend/app/jobs/cardmarket_external_prices.py'
      - 'backend/scripts/sync_cardmarket_catalog.py'
      - 'backend/scripts/sync_cardmarket_external_prices.py'
      - 'backend/tests/conftest.py'
      - 'backend/tests/test_cardmarket_external_catalog.py'
      - '.github/workflows/qa-cardmarket-external-market-layer.yml'
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/alembic/versions/20260809_28_add_external_catalog_market_layer.py'
      - 'backend/app/external_catalog_models.py'
      - 'backend/app/jobs/cardmarket_catalog_ingest.py'
      - 'backend/app/jobs/cardmarket_external_prices.py'
      - 'backend/scripts/sync_cardmarket_catalog.py'
      - 'backend/scripts/sync_cardmarket_external_prices.py'
      - 'backend/tests/conftest.py'
      - 'backend/tests/test_cardmarket_external_catalog.py'
      - '.github/workflows/qa-cardmarket-external-market-layer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dontripit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Compile external market layer
        working-directory: backend
        run: |
          python -m compileall -q \
            app/external_catalog_models.py \
            app/jobs/cardmarket_catalog_ingest.py \
            app/jobs/cardmarket_external_prices.py \
            scripts/sync_cardmarket_catalog.py \
            scripts/sync_cardmarket_external_prices.py \
            alembic/versions/20260809_28_add_external_catalog_market_layer.py

      - name: Verify Alembic remains linear
        working-directory: backend
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1

      - name: Run full Alembic chain on PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/dontripit_test
        run: |
          set -euo pipefail
          EXPECTED_HEAD="$(alembic heads | awk '{print $1}')"
          export EXPECTED_HEAD
          alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as connection:
              version = connection.execute(text('select version_num from alembic_version')).scalar_one()
          assert version == os.environ['EXPECTED_HEAD'], (version, os.environ['EXPECTED_HEAD'])

          tables = set(inspect(engine).get_table_names())
          required = {
              'external_catalog_products',
              'external_catalog_print_links',
              'external_catalog_product_variant_links',
              'external_market_price_snapshots',
          }
          missing = sorted(required - tables)
          assert not missing, f'missing external market tables: {missing}'
          print({'alembic_version': version, 'external_tables': sorted(required)})
          PY

      - name: Run external catalog and price identity tests
        working-directory: backend
        run: pytest -q tests/test_cardmarket_external_catalog.py tests/test_cardmarket_set_bootstrap.py

      - name: Download current official MVP catalog and price feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cardmarket-contract
          for spec in mtg:1 yugioh:3 pokemon:6 onepiece:18 riftbound:22; do
            game="${spec%%:*}"
            game_id="${spec##*:}"
            for group in singles nonsingles; do
              curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
                "https://downloads.s3.cardmarket.com/productCatalog/productList/products_${group}_${game_id}.json" \
                -o "/tmp/cardmarket-contract/${game}_${group}.json"
            done
            curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
              "https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_${game_id}.json" \
              -o "/tmp/cardmarket-contract/${game}_prices.json"
          done

      - name: Classify current PriceGuide to catalog skew without weakening identity checks
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.jobs.cardmarket_master_inventory import load_catalog_feed_bytes
          from app.jobs.cardmarket_prices import load_price_guide_bytes

          report = []
          for game in ('mtg', 'yugioh', 'pokemon', 'onepiece', 'riftbound'):
              singles = load_catalog_feed_bytes(
                  Path(f'/tmp/cardmarket-contract/{game}_singles.json').read_bytes(),
                  game_slug=game,
                  product_group='single',
              )
              nonsingles = load_catalog_feed_bytes(
                  Path(f'/tmp/cardmarket-contract/{game}_nonsingles.json').read_bytes(),
                  game_slug=game,
                  product_group='non_single',
              )
              created_at, prices = load_price_guide_bytes(
                  Path(f'/tmp/cardmarket-contract/{game}_prices.json').read_bytes()
              )
              assert prices, f'{game}: empty price guide'
              catalog_ids = {row.product_id for row in singles.rows} | {row.product_id for row in nonsingles.rows}
              price_ids = [row.product_id for row in prices]
              assert len(price_ids) == len(set(price_ids)), f'{game}: duplicate idProduct in price guide'

              missing = sorted(set(price_ids) - catalog_ids)
              matched = len(set(price_ids) & catalog_ids)
              row = {
                  'game': game,
                  'catalog_products': len(catalog_ids),
                  'price_products': len(price_ids),
                  'matched_price_products': matched,
                  'price_created_at': created_at.isoformat() if created_at else None,
                  'catalog_skew_products': len(missing),
                  'catalog_skew_sample': missing[:20],
              }
              report.append(row)
              print(row)

          Path('/tmp/cardmarket-contract/feed-skew.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-feed-contract-${{ github.run_id }}
          path: /tmp/cardmarket-contract/feed-skew.json
          retention-days: 30
          if-no-files-found: warn
