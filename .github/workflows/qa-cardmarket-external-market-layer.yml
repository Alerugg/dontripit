name: QA Cardmarket External Market Layer

on:
  pull_request:
    branches:
      - catalog-v2
    paths:
      - 'backend/alembic/versions/20260809_28_add_external_catalog_market_layer.py'
      - 'backend/app/external_catalog_models.py'
      - 'backend/app/jobs/cardmarket_catalog_ingest.py'
      - 'backend/app/jobs/cardmarket_external_prices.py'
      - 'backend/scripts/sync_cardmarket_catalog.py'
      - 'backend/scripts/sync_cardmarket_external_prices.py'
      - 'backend/tests/conftest.py'
      - 'backend/tests/test_cardmarket_external_catalog.py'
      - '.github/workflows/qa-cardmarket-external-market-layer.yml'
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/alembic/versions/20260809_28_add_external_catalog_market_layer.py'
      - 'backend/app/external_catalog_models.py'
      - 'backend/app/jobs/cardmarket_catalog_ingest.py'
      - 'backend/app/jobs/cardmarket_external_prices.py'
      - 'backend/scripts/sync_cardmarket_catalog.py'
      - 'backend/scripts/sync_cardmarket_external_prices.py'
      - 'backend/tests/conftest.py'
      - 'backend/tests/test_cardmarket_external_catalog.py'
      - '.github/workflows/qa-cardmarket-external-market-layer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Compile external market layer
        working-directory: backend
        run: |
          python -m compileall -q \
            app/external_catalog_models.py \
            app/jobs/cardmarket_catalog_ingest.py \
            app/jobs/cardmarket_external_prices.py \
            scripts/sync_cardmarket_catalog.py \
            scripts/sync_cardmarket_external_prices.py \
            alembic/versions/20260809_28_add_external_catalog_market_layer.py

      - name: Verify Alembic remains linear at revision 28
        working-directory: backend
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          printf '%s\n' "$heads" | grep -q '20260809_28'

      - name: Run external catalog and price identity tests
        working-directory: backend
        run: pytest -q tests/test_cardmarket_external_catalog.py tests/test_cardmarket_set_bootstrap.py

      - name: Download current official MVP catalog and price feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cardmarket-contract
          for spec in mtg:1 yugioh:3 pokemon:6 onepiece:18; do
            game="${spec%%:*}"
            game_id="${spec##*:}"
            for group in singles nonsingles; do
              curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
                "https://downloads.s3.cardmarket.com/productCatalog/productList/products_${group}_${game_id}.json" \
                -o "/tmp/cardmarket-contract/${game}_${group}.json"
            done
            curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
              "https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_${game_id}.json" \
              -o "/tmp/cardmarket-contract/${game}_prices.json"
          done

      - name: Verify every current price id exists in current official catalog
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.jobs.cardmarket_master_inventory import load_catalog_feed_bytes
          from app.jobs.cardmarket_prices import load_price_guide_bytes

          for game in ('mtg', 'yugioh', 'pokemon', 'onepiece'):
              singles = load_catalog_feed_bytes(
                  Path(f'/tmp/cardmarket-contract/{game}_singles.json').read_bytes(),
                  game_slug=game,
                  product_group='single',
              )
              nonsingles = load_catalog_feed_bytes(
                  Path(f'/tmp/cardmarket-contract/{game}_nonsingles.json').read_bytes(),
                  game_slug=game,
                  product_group='non_single',
              )
              created_at, prices = load_price_guide_bytes(
                  Path(f'/tmp/cardmarket-contract/{game}_prices.json').read_bytes()
              )
              assert prices, f'{game}: empty price guide'
              catalog_ids = {row.product_id for row in singles.rows} | {row.product_id for row in nonsingles.rows}
              price_ids = [row.product_id for row in prices]
              assert len(price_ids) == len(set(price_ids)), f'{game}: duplicate idProduct in price guide'
              missing = sorted(set(price_ids) - catalog_ids)
              assert not missing, f'{game}: price IDs missing from product catalog: {missing[:20]}'
              print({
                  'game': game,
                  'catalog_products': len(catalog_ids),
                  'price_products': len(price_ids),
                  'price_created_at': created_at.isoformat() if created_at else None,
                  'missing_price_products': len(missing),
              })
          PY
