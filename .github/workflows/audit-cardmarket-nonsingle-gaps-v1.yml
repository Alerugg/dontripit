name: Export Card Manual Gap Worklist V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-cardmarket-nonsingle-gaps-v1.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary==2.9.9
      - name: Export physical card manual gap worklist READ ONLY
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          dsn = os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not dsn:
              raise RuntimeError('DATABASE_URL_UNPOOLED/DATABASE_URL is required')

          conn = psycopg2.connect(dsn)
          conn.set_session(readonly=True, autocommit=False)
          try:
              with conn.cursor(cursor_factory=RealDictCursor) as cur:
                  cur.execute("SET LOCAL statement_timeout='180s'")
                  cur.execute('''
                    WITH base AS (
                      SELECT
                        p.id AS print_id,
                        g.slug AS tcg,
                        s.code AS set_code,
                        COALESCE(NULLIF(p.collector_number,''), NULLIF(c.collector_number,'')) AS collector_number,
                        c.name AS card_name,
                        COALESCE(NULLIF(p.language_code,''), NULLIF(c.language_code,''), NULLIF(s.language_code,'')) AS language,
                        p.variant,
                        (
                          SELECT ps.price
                          FROM price_snapshots ps
                          WHERE ps.print_id=p.id
                            AND ps.source='cardmarket'
                            AND ps.price IS NOT NULL
                            AND ps.price > 0
                          ORDER BY ps.as_of DESC, ps.id DESC
                          LIMIT 1
                        ) AS current_cardmarket_price,
                        COALESCE(
                          (SELECT pi.url FROM print_images pi
                           WHERE pi.print_id=p.id AND pi.is_primary=true
                             AND pi.url IS NOT NULL AND pi.url<>''
                           ORDER BY pi.id DESC LIMIT 1),
                          (SELECT pi.url FROM print_images pi
                           WHERE pi.print_id=p.id
                             AND pi.url IS NOT NULL AND pi.url<>''
                           ORDER BY pi.is_primary DESC, pi.id DESC LIMIT 1),
                          NULLIF(p.image_url,''),
                          NULLIF(c.image_url,'')
                        ) AS current_image_url,
                        cm.external_id AS cardmarket_external_id,
                        cm.website_path,
                        COALESCE(cm.link_count,0) AS exact_link_count
                      FROM prints p
                      JOIN cards c ON c.id=p.card_id
                      JOIN sets s ON s.id=p.set_id
                      JOIN games g ON g.id=c.game_id
                      LEFT JOIN LATERAL (
                        SELECT e.external_id, e.website_path, count(*) OVER() AS link_count
                        FROM external_catalog_product_variant_links l
                        JOIN external_catalog_products e ON e.id=l.external_product_id
                        WHERE l.print_id=p.id
                          AND e.source='cardmarket'
                          AND e.product_group='single'
                          AND l.link_status IN ('accepted','mapped','exact')
                          AND l.confidence='exact'
                        ORDER BY e.last_seen_at DESC NULLS LAST, e.id DESC
                        LIMIT 1
                      ) cm ON TRUE
                      WHERE g.slug IN ('mtg','yugioh','pokemon','onepiece')
                    )
                    SELECT *
                    FROM base
                    WHERE current_cardmarket_price IS NULL OR current_image_url IS NULL
                    ORDER BY tcg,set_code,collector_number,card_name,language,variant,print_id
                  ''')
                  rows = [dict(r) for r in cur.fetchall()]

                  cur.execute('''
                    SELECT count(*) AS n
                    FROM prints p
                    JOIN cards c ON c.id=p.card_id
                    JOIN games g ON g.id=c.game_id
                    WHERE g.slug IN ('mtg','yugioh','pokemon','onepiece')
                  ''')
                  total_physical_prints = int(cur.fetchone()['n'])
          finally:
              conn.rollback()
              conn.close()

          def cm_url(path):
              if not path:
                  return None
              p=str(path).strip()
              if not p:
                  return None
              if p.startswith('http://') or p.startswith('https://'):
                  return p
              return 'https://www.cardmarket.com' + (p if p.startswith('/') else '/' + p)

          out=[]
          by_game_union=Counter(); by_game_price=Counter(); by_game_image=Counter(); by_game_both=Counter()
          missing_price=missing_image=missing_both=missing_price_with_image=0
          missing_price_with_cm=missing_price_without_cm=0
          for r in rows:
              mp = r.get('current_cardmarket_price') is None
              mi = not bool((r.get('current_image_url') or '').strip())
              url = cm_url(r.get('website_path'))
              game = r['tcg']
              by_game_union[game]+=1
              if mp:
                  missing_price+=1; by_game_price[game]+=1
                  if not mi: missing_price_with_image+=1
                  if url: missing_price_with_cm+=1
                  else: missing_price_without_cm+=1
              if mi:
                  missing_image+=1; by_game_image[game]+=1
              if mp and mi:
                  missing_both+=1; by_game_both[game]+=1
              out.append({
                  'tcg': game,
                  'set_code': r.get('set_code'),
                  'collector_number': r.get('collector_number'),
                  'card_name': r.get('card_name'),
                  'language': r.get('language'),
                  'variant': r.get('variant'),
                  'missing_price': mp,
                  'missing_image': mi,
                  'cardmarket_url': url,
                  'cardmarket_external_id': r.get('cardmarket_external_id'),
                  'current_image_url': r.get('current_image_url'),
                  'print_id': r.get('print_id'),
                  'exact_link_count': int(r.get('exact_link_count') or 0),
              })

          report={
              'mode':'read_only',
              'production_writes':0,
              'scope':'physical_prints_mtg_yugioh_pokemon_onepiece',
              'total_physical_prints':total_physical_prints,
              'pending_union':len(out),
              'missing_price_count':missing_price,
              'missing_image_count':missing_image,
              'missing_both_count':missing_both,
              'missing_price_with_image_count':missing_price_with_image,
              'missing_price_with_exact_cardmarket_url_count':missing_price_with_cm,
              'missing_price_without_exact_cardmarket_link_count':missing_price_without_cm,
              'pending_by_game':dict(sorted(by_game_union.items())),
              'missing_price_by_game':dict(sorted(by_game_price.items())),
              'missing_image_by_game':dict(sorted(by_game_image.items())),
              'missing_both_by_game':dict(sorted(by_game_both.items())),
              'rows':out,
          }
          path=Path('/tmp/card-manual-gap-worklist.json')
          path.write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k!='rows'},indent=2,sort_keys=True))
          assert report['mode']=='read_only'
          assert report['production_writes']==0
          assert report['pending_union']==len(report['rows'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-manual-gap-worklist-v1-${{ github.run_id }}
          path: /tmp/card-manual-gap-worklist.json
          retention-days: 90
          if-no-files-found: error
