name: Diagnose Cloudflare API route

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-cloudflare-api-route.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve DNS and probe API
        run: |
          set -euxo pipefail
          echo '=== DNS A ==='
          dig +short A api.dontripit.com || true
          echo '=== DNS AAAA ==='
          dig +short AAAA api.dontripit.com || true
          echo '=== HTTPS headers ==='
          curl -sS -D /tmp/headers.txt -o /tmp/body.json --max-time 20 https://api.dontripit.com/api/health
          cat /tmp/headers.txt
          echo '=== Body ==='
          cat /tmp/body.json
          echo
          echo '=== Cloudflare indicators ==='
          grep -Ei '^(server:|cf-ray:|cf-cache-status:|x-powered-by:|x-vercel-id:)' /tmp/headers.txt || true
