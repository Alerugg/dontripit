name: TCGdex Multilingual Ephemeral Certification

on:
  push:
    branches:
      - multilingual-v1
    paths:
      - "backend/app/ingest/connectors/tcgdex_pokemon_multilingual.py"
      - "backend/app/ingest/connectors/tcgdex_pokemon_multilingual_physical.py"
      - "backend/app/ingest/registry.py"
      - "backend/app/multilingual_models.py"
      - "backend/app/scripts/seed_multilingual_ephemeral_catalog.py"
      - "backend/app/scripts/validate_tcgdex_multilingual_ephemeral.py"
      - "backend/alembic/versions/20260814_33_add_print_localizations.py"
      - "backend/alembic/versions/20260814_34_add_catalog_entity_identifiers.py"
      - ".github/workflows/test-tcgdex-multilingual-ephemeral.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcgdex-multilingual-ephemeral-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multilingual_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d multilingual_ephemeral"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout multilingual sandbox
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile certification code
        run: |
          python -m py_compile \
            app/ingest/connectors/tcgdex_pokemon_multilingual.py \
            app/ingest/connectors/tcgdex_pokemon_multilingual_physical.py \
            app/scripts/seed_multilingual_ephemeral_catalog.py \
            app/scripts/validate_tcgdex_multilingual_ephemeral.py

      - name: Migrate ephemeral PostgreSQL only
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/multilingual_ephemeral
          PYTHONPATH: .
        run: alembic upgrade head

      - name: Seed Pokémon canonical identity from production read-only
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          EPHEMERAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/multilingual_ephemeral
        run: python app/scripts/seed_multilingual_ephemeral_catalog.py

      - name: Assert writer has no production credential in environment
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/multilingual_ephemeral
        run: |
          test -z "${PRODUCTION_DATABASE_URL:-}"
          test -z "${PRODUCTION_DATABASE_URL_UNPOOLED:-}"
          python - <<'PY'
          import os
          value = os.environ["DATABASE_URL"]
          assert "localhost:5432/multilingual_ephemeral" in value, value
          print("writer target guard: ephemeral only")
          PY

      - name: Run full Spanish physical writer against ephemeral DB
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/multilingual_ephemeral
          PYTHONPATH: .
          INGEST_LOG_LEVEL: WARNING
        run: python -m app.ingest.run tcgdex_pokemon --lang es --incremental false

      - name: Run full Japanese physical writer against ephemeral DB
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/multilingual_ephemeral
          PYTHONPATH: .
          INGEST_LOG_LEVEL: WARNING
        run: python -m app.ingest.run tcgdex_pokemon --lang ja --incremental false

      - name: Validate exact live ES JA coverage and canonical immutability
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/multilingual_ephemeral
          PYTHONPATH: .
        run: python app/scripts/validate_tcgdex_multilingual_ephemeral.py --snapshot /tmp/multilingual-first-pass.json

      - name: Rerun Spanish incrementally for idempotency
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/multilingual_ephemeral
          PYTHONPATH: .
          INGEST_LOG_LEVEL: WARNING
        run: python -m app.ingest.run tcgdex_pokemon --lang es --incremental true

      - name: Rerun Japanese incrementally for idempotency
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/multilingual_ephemeral
          PYTHONPATH: .
          INGEST_LOG_LEVEL: WARNING
        run: python -m app.ingest.run tcgdex_pokemon --lang ja --incremental true

      - name: Certify idempotent catalog state
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/multilingual_ephemeral
          PYTHONPATH: .
        run: python app/scripts/validate_tcgdex_multilingual_ephemeral.py --compare /tmp/multilingual-first-pass.json

      - name: Publish certification summary
        if: always()
        run: |
          {
            echo "# TCGdex multilingual ephemeral certification"
            echo
            echo "- Production access: read-only canonical seed only (games, sets, cards)."
            echo "- Writer target: ephemeral PostgreSQL only."
            echo "- Languages executed: ES + JA."
            echo "- Pocket scope: excluded by physical writer guard when tcgp is published."
            echo
            if [ -f /tmp/pokemon-multilingual-ephemeral-validation.json ]; then
              echo '```json'
              cat /tmp/pokemon-multilingual-ephemeral-validation.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcgdex-multilingual-ephemeral-${{ github.run_id }}
          path: |
            /tmp/pokemon-multilingual-ephemeral-baseline.json
            /tmp/multilingual-first-pass.json
            /tmp/pokemon-multilingual-ephemeral-validation.json
          if-no-files-found: warn
          retention-days: 90
