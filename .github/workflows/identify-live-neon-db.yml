name: Identify Live Neon Database

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/identify-live-neon-db.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install driver
        run: pip install psycopg2-binary==2.9.9
      - name: Identify connected PostgreSQL database read-only
        run: |
          python - <<'PY'
          import json, os
          import psycopg2

          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not url:
              raise SystemExit('No database secret configured')
          if url.startswith('postgresql+psycopg2://'):
              url='postgresql://'+url[len('postgresql+psycopg2://'):]
          elif url.startswith('postgres://'):
              url='postgresql://'+url[len('postgres://'):]

          conn=psycopg2.connect(url)
          try:
              with conn.cursor() as cur:
                  cur.execute('SET TRANSACTION READ ONLY')
                  cur.execute('SELECT current_database(), current_user, current_schema(), version()')
                  db,user,schema,version=cur.fetchone()
                  cur.execute("SELECT current_setting('neon.max_cluster_size', true)")
                  limit=cur.fetchone()[0]
                  cur.execute("SELECT name, setting FROM pg_settings WHERE name LIKE 'neon.%' AND (name ILIKE '%project%' OR name ILIKE '%branch%' OR name ILIKE '%endpoint%' OR name ILIKE '%cluster%') ORDER BY name")
                  neon_settings=dict(cur.fetchall())
                  cur.execute("SELECT COUNT(*) FROM games")
                  games=int(cur.fetchone()[0])
                  cur.execute("SELECT COUNT(*) FROM cards")
                  cards=int(cur.fetchone()[0])
                  cur.execute("SELECT COUNT(*) FROM prints")
                  prints=int(cur.fetchone()[0])
              conn.rollback()
          finally:
              conn.close()

          safe={
              'database_name':db,
              'database_user':user,
              'schema':schema,
              'server': 'Neon PostgreSQL' if 'neon' in version.lower() or limit else 'PostgreSQL',
              'neon_max_cluster_size':limit,
              'neon_identifying_settings':neon_settings,
              'catalog_counts':{'games':games,'cards':cards,'prints':prints},
              'database_writes':0,
          }
          print(json.dumps(safe,indent=2,sort_keys=True))
          PY
