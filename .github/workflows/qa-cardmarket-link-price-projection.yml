name: QA Cardmarket Link Price Projection

on:
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/jobs/cardmarket_link_price_projection.py'
      - 'backend/tests/test_cardmarket_link_price_projection.py'
      - '.github/workflows/qa-cardmarket-link-price-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile projector
        run: python -m compileall -q app/jobs/cardmarket_link_price_projection.py
      - name: Run focused projector tests
        run: pytest -q tests/test_cardmarket_link_price_projection.py
