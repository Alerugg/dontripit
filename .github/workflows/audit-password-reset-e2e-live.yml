name: Audit Password Reset E2E Live

on:
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/email_delivery.py'
      - 'backend/app/user_auth_service.py'
      - 'backend/app/routes/user_auth.py'
      - '.github/workflows/audit-password-reset-e2e-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
      PUBLIC_SITE_URL: https://dontripit.com
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply auth schema
        run: alembic upgrade head
      - name: Prove password recovery with safe Resend recipient
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from sqlalchemy import delete, select
          from app import db
          from app.email_delivery import email_delivery_configured, send_password_reset_email
          from app.main import create_app
          from app.user_auth_service import issue_password_reset_token, password_hash, utcnow
          from app.user_models import User, UserPasswordResetToken

          if not email_delivery_configured():
              raise AssertionError('Password reset delivery is not configured: RESEND_API_KEY/AUTH_EMAIL_FROM missing')

          email=f"delivered+dontripit-reset-{os.environ['RUN_ID']}@resend.dev"
          old_password=f"Old-{os.environ['RUN_ID']}-Password!"
          new_password=f"New-{os.environ['RUN_ID']}-Password!"
          app=create_app()
          user_id=None
          try:
              with db.SessionLocal() as session:
                  existing=session.execute(select(User).where(User.email==email)).scalar_one_or_none()
                  if existing:
                      session.delete(existing); session.commit()
                  user=User(name='Password Reset E2E',email=email,password_hash=password_hash(old_password),
                            marketing_consent=False,terms_accepted_at=utcnow(),is_active=True)
                  session.add(user); session.commit(); user_id=int(user.id)

              # Exercise the public forgot-password handler. It must create a token and
              # successfully send through the configured Resend transport.
              with app.test_client() as client:
                  response=client.post('/api/v2/auth/forgot-password',json={'email':email})
                  assert response.status_code==200, (response.status_code,response.get_json())
              with db.SessionLocal() as session:
                  forgot_tokens=session.execute(select(UserPasswordResetToken).where(UserPasswordResetToken.user_id==user_id)).scalars().all()
                  assert len(forgot_tokens)>=1

              # Issue a known raw token through the exact production token service, send
              # it with the real email transport to Resend's safe delivered test inbox,
              # then consume it through the public reset endpoint.
              with db.SessionLocal() as session:
                  user=session.get(User,user_id)
                  raw_token, token_row=issue_password_reset_token(session,user=user)
                  session.commit()
                  known_token_id=int(token_row.id)
              assert send_password_reset_email(to_email=email,token=raw_token), 'Resend delivery returned false'

              with app.test_client() as client:
                  reset=client.post('/api/v2/auth/reset-password',json={'token':raw_token,'password':new_password})
                  assert reset.status_code==200, (reset.status_code,reset.get_json())
                  reused=client.post('/api/v2/auth/reset-password',json={'token':raw_token,'password':old_password})
                  assert reused.status_code==400, (reused.status_code,reused.get_json())
                  login_old=client.post('/api/v2/auth/login',json={'email':email,'password':old_password})
                  assert login_old.status_code==401, (login_old.status_code,login_old.get_json())
                  login_new=client.post('/api/v2/auth/login',json={'email':email,'password':new_password})
                  assert login_new.status_code==200, (login_new.status_code,login_new.get_json())

              with db.SessionLocal() as session:
                  token=session.get(UserPasswordResetToken,known_token_id)
                  assert token is not None and token.used_at is not None

              print(json.dumps({
                  'email_transport':'resend',
                  'test_recipient_domain':'resend.dev',
                  'forgot_endpoint':'pass',
                  'delivery':'pass',
                  'reset_endpoint':'pass',
                  'one_time_token':'pass',
                  'old_password_revoked':'pass',
                  'new_password_login':'pass',
              },indent=2,sort_keys=True))
          finally:
              if user_id is not None:
                  with db.SessionLocal() as session:
                      user=session.get(User,user_id)
                      if user is not None:
                          session.delete(user)
                      session.commit()
          PY

# Manual production verification trigger: 2026-08-10
