name: Preflight TCGdex Multilingual Production

on:
  push:
    branches:
      - multilingual-v1
    paths:
      - '.github/workflows/preflight-tcgdex-multilingual-production.yml'
      - 'backend/app/scripts/preflight_tcgdex_multilingual_production.py'
      - '.github/multilingual-production-preflight-trigger'

permissions:
  contents: read

concurrency:
  group: tcgdex-multilingual-production-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact sandbox commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify production database secret
        run: test -n "${DATABASE_URL_UNPOOLED}${DATABASE_URL}"

      - name: Compile production preflight and physical auditor
        run: |
          python -m py_compile \
            app/scripts/preflight_tcgdex_multilingual_production.py \
            app/scripts/audit_tcgdex_multilingual_backfill.py \
            app/scripts/audit_tcgdex_multilingual_backfill_physical.py

      - name: Run focused multilingual safety tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_tcgdex_multilingual.py \
            tests/test_tcgdex_physical_scope.py \
            tests/test_validate_tcgdex_multilingual_live.py

      - name: Gate exact production baseline read-only
        env:
          PYTHONPATH: .
        run: python -m app.scripts.preflight_tcgdex_multilingual_production

      - name: Audit current physical TCGdex plan read-only
        run: python app/scripts/audit_tcgdex_multilingual_backfill_physical.py

      - name: Gate physical rollout plan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path('/tmp/tcgdex-multilingual-production-preflight.json').read_text())
          audit = json.loads(Path('/tmp/tcgdex-multilingual-physical-backfill-audit.json').read_text())

          if baseline.get('status') != 'pass' or baseline.get('database_writes') != 0:
              raise SystemExit(f'Production baseline preflight failed: {baseline!r}')
          if audit.get('database_transaction_read_only') != 'on':
              raise SystemExit('Physical audit did not prove a read-only production transaction')
          if audit.get('scope', {}).get('database_writes') != 0:
              raise SystemExit('Physical audit unexpectedly reports database writes')

          prod = audit['production_baseline']
          if prod['pokemon_sets'] != 203 or prod['pokemon_cards'] != 21065 or prod['pokemon_prints'] != 33757:
              raise SystemExit(f'Production Pokémon baseline moved during audit: {prod!r}')
          if prod['print_language_counts'] != {'en': 33757}:
              raise SystemExit(f'Unexpected production language state: {prod["print_language_counts"]!r}')

          es = audit['spanish_overlay_plan']
          if es['remote_cards'] <= 0:
              raise SystemExit('TCGdex ES physical catalog is unexpectedly empty')
          if es['exact_canonical_identity_eligible'] != es['remote_cards']:
              raise SystemExit(f'ES is not 100% exact-canonical eligible: {es!r}')
          if any(es[key] for key in ('missing_canonical_card', 'missing_canonical_set', 'unresolved_set_from_card_id')):
              raise SystemExit(f'ES has unresolved canonical identity: {es!r}')
          if es['already_existing_es_prints_matching_plan'] != 0:
              raise SystemExit(f'Production already has partial ES target prints: {es!r}')
          if es['estimated_new_es_prints'] != es['remote_cards']:
              raise SystemExit(f'Unexpected ES write cardinality: {es!r}')

          ja = audit['japanese_regional_plan']
          if ja['remote_cards'] <= 0 or ja['estimated_independent_prints'] != ja['remote_cards']:
              raise SystemExit(f'Unexpected JA regional write cardinality: {ja!r}')

          drift = audit['production_en_source_drift']
          if drift['production_global_card_ids'] != 21065:
              raise SystemExit(f'Unexpected production EN identity count: {drift!r}')
          if drift['remote_only_card_ids'] != 0 or drift['remote_only_set_ids'] != 0:
              raise SystemExit(
                  'Current remote EN contains identities missing from production; refresh/certify EN before multilingual rollout: '
                  + repr(drift)
              )

          summary = {
              'status': 'pass',
              'mode': 'strict-read-only-production-rollout-preflight',
              'database_writes': 0,
              'sandbox_sha': '${{ github.sha }}',
              'alembic_before': baseline['alembic_version'],
              'canonical_sets_sha256': baseline['pokemon']['sets_sha256'],
              'canonical_cards_sha256': baseline['pokemon']['cards_sha256'],
              'production_print_languages': prod['print_language_counts'],
              'es_expected_new_prints': es['estimated_new_es_prints'],
              'ja_expected_new_prints': ja['estimated_independent_prints'],
              'production_only_en_cards_preserved': drift['production_only_card_ids'],
              'production_only_en_sets_preserved': drift['production_only_set_ids'],
              'remote_only_en_cards': drift['remote_only_card_ids'],
              'remote_only_en_sets': drift['remote_only_set_ids'],
          }
          Path('/tmp/tcgdex-multilingual-production-preflight-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload production preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcgdex-multilingual-production-preflight-${{ github.sha }}
          path: |
            /tmp/tcgdex-multilingual-production-preflight.json
            /tmp/tcgdex-multilingual-physical-backfill-audit.json
            /tmp/tcgdex-multilingual-physical-backfill-audit.md
            /tmp/tcgdex-multilingual-production-preflight-summary.json
          retention-days: 90
          if-no-files-found: warn
