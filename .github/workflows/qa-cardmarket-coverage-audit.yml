name: QA Cardmarket Coverage Audit

on:
  pull_request:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_coverage.py'
      - 'backend/scripts/audit_cardmarket_coverage.py'
      - 'backend/tests/test_cardmarket_coverage.py'
      - '.github/workflows/qa-cardmarket-coverage-audit.yml'
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_coverage.py'
      - 'backend/scripts/audit_cardmarket_coverage.py'
      - 'backend/tests/test_cardmarket_coverage.py'
      - '.github/workflows/qa-cardmarket-coverage-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Compile coverage audit
        working-directory: backend
        run: python -m compileall -q app/jobs/cardmarket_coverage.py scripts/audit_cardmarket_coverage.py
      - name: Run coverage regression tests
        working-directory: backend
        env:
          API_KEY_REQUIRED: 'false'
        run: pytest -q tests/test_cardmarket_coverage.py --tb=short
