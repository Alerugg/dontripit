name: Audit One Piece DON Fresh Price V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-onepiece-don-fresh-price-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PGOPTIONS: -c default_transaction_read_only=on
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Require production read-only database
        run: test -n "${DATABASE_URL_UNPOOLED:-}"
      - name: Download current official One Piece Cardmarket feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cardmarket-don-fresh
          curl --retry 5 --retry-all-errors --retry-delay 2 --fail --location --silent --show-error \
            'https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_18.json' \
            -o /tmp/cardmarket-don-fresh/products_singles_18.json
          curl --retry 5 --retry-all-errors --retry-delay 2 --fail --location --silent --show-error \
            'https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_18.json' \
            -o /tmp/cardmarket-don-fresh/price_guide_18.json
          test -s /tmp/cardmarket-don-fresh/products_singles_18.json
          test -s /tmp/cardmarket-don-fresh/price_guide_18.json
      - name: Compare latest DON source rows with fresh Cardmarket feed READ ONLY
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from decimal import Decimal
          from pathlib import Path

          from sqlalchemy import text

          from app import db
          from app.jobs.cardmarket_master_inventory import load_catalog_feed_bytes
          from app.jobs.cardmarket_prices import load_price_guide_bytes

          ROOT = Path('/tmp/cardmarket-don-fresh')
          OUTPUT = Path('artifacts/onepiece-don-fresh-price-v1.json')
          EXPECTED_DON_ROWS = 164
          MAX_PRICE_AGE_SECONDS = 36 * 60 * 60

          catalog = load_catalog_feed_bytes(
              (ROOT / 'products_singles_18.json').read_bytes(),
              game_slug='onepiece',
              product_group='single',
          )
          price_as_of, price_rows = load_price_guide_bytes(
              (ROOT / 'price_guide_18.json').read_bytes(),
              filename='price_guide_18.json',
          )

          price_by_id = {}
          duplicate_price_ids = []
          for row in price_rows:
              if row.product_id in price_by_id:
                  duplicate_price_ids.append(row.product_id)
              else:
                  price_by_id[row.product_id] = row

          catalog_by_id = {}
          duplicate_catalog_ids = []
          for row in catalog.rows:
              if row.product_id in catalog_by_id:
                  duplicate_catalog_ids.append(row.product_id)
              else:
                  catalog_by_id[row.product_id] = row

          def positive(value) -> bool:
              return value is not None and Decimal(str(value)) > 0

          def visible_prices(row):
              values = []
              if row is None:
                  return values
              nonfoil = None
              for value in (row.low_ex, row.low, row.trend, row.avg):
                  if positive(value):
                      nonfoil = value
                      break
              if nonfoil is not None:
                  values.append(('nonfoil', nonfoil))
              foil = None
              for value in (row.foil_low, row.foil_trend, row.foil_avg):
                  if positive(value):
                      foil = value
                      break
              if foil is not None:
                  values.append(('foil', foil))
              return values

          now = datetime.now(timezone.utc)
          errors = []
          if price_as_of is None:
              errors.append('price_guide_createdAt_missing')
              price_age_seconds = None
          else:
              price_age_seconds = (now - price_as_of).total_seconds()
              if price_age_seconds < -2 * 60 * 60 or price_age_seconds > MAX_PRICE_AGE_SECONDS:
                  errors.append(f'price_guide_not_fresh:{price_age_seconds:.0f}s')
          if catalog.rejected_records != 0:
              errors.append(f'catalog_rejected_records:{catalog.rejected_records}')
          if duplicate_catalog_ids:
              errors.append(f'duplicate_catalog_ids:{len(duplicate_catalog_ids)}')
          if duplicate_price_ids:
              errors.append(f'duplicate_price_ids:{len(duplicate_price_ids)}')
          if not price_rows:
              errors.append('empty_price_guide')

          db.init_engine(os.environ['DATABASE_URL_UNPOOLED'])
          with db.SessionLocal() as session:
              session.execute(text('SET TRANSACTION READ ONLY'))
              read_only = session.execute(text('SHOW transaction_read_only')).scalar_one() == 'on'
              if not read_only:
                  errors.append('transaction_not_read_only')

              rows = session.execute(text('''
                WITH latest AS (
                  SELECT max(source_as_of) AS source_as_of
                  FROM onepiece_don_market_items
                  WHERE source='cardmarket'
                )
                SELECT
                  m.metacard_external_id,
                  m.representative_external_product_id,
                  m.name,
                  m.subject,
                  m.subject_normalized,
                  m.product_ids_json,
                  m.product_count,
                  m.source_as_of,
                  market.external_id AS current_price_product_id,
                  market.price AS current_price,
                  market.price_variant AS current_price_variant,
                  market.as_of AS current_price_as_of
                FROM onepiece_don_market_items m
                JOIN latest l ON l.source_as_of=m.source_as_of
                LEFT JOIN LATERAL (
                  SELECT e.external_id, cp.price, cp.price_variant, cp.as_of
                  FROM jsonb_array_elements_text(COALESCE(m.product_ids_json, '[]'::jsonb)) product_id(value)
                  JOIN games g ON g.slug='onepiece'
                  JOIN external_catalog_products e
                    ON e.source='cardmarket'
                   AND e.game_id=g.id
                   AND e.product_group='single'
                   AND e.external_id=product_id.value
                  LEFT JOIN LATERAL (
                    SELECT
                      COALESCE(
                        NULLIF(ps.price_mid,0),
                        NULLIF(ps.price_market,0),
                        NULLIF(ps.price_last,0),
                        NULLIF(ps.price_low,0)
                      ) AS price,
                      ps.price_variant,
                      ps.as_of
                    FROM external_market_price_snapshots ps
                    WHERE ps.external_product_id=e.id
                      AND ps.currency='EUR'
                      AND COALESCE(
                        NULLIF(ps.price_mid,0),
                        NULLIF(ps.price_market,0),
                        NULLIF(ps.price_last,0),
                        NULLIF(ps.price_low,0)
                      ) IS NOT NULL
                    ORDER BY ps.as_of DESC,
                             COALESCE(NULLIF(ps.price_mid,0),NULLIF(ps.price_market,0),NULLIF(ps.price_last,0),NULLIF(ps.price_low,0)) ASC,
                             ps.price_variant ASC,
                             ps.id DESC
                    LIMIT 1
                  ) cp ON TRUE
                  ORDER BY (cp.price IS NULL) ASC,
                           cp.price ASC NULLS LAST,
                           CASE WHEN e.external_id=m.representative_external_product_id THEN 0 ELSE 1 END,
                           e.external_id ASC
                  LIMIT 1
                ) market ON TRUE
                WHERE m.source='cardmarket'
                ORDER BY m.metacard_external_id
              ''')).mappings().all()
              session.rollback()

          if len(rows) != EXPECTED_DON_ROWS:
              errors.append(f'unexpected_don_row_count:{len(rows)}')

          target_metacards = {str(row['metacard_external_id']) for row in rows}
          fresh_by_metacard = {}
          for product in catalog.rows:
              metacard = str(product.metacard_id or '').strip()
              if metacard in target_metacards:
                  fresh_by_metacard.setdefault(metacard, []).append(product)

          details = []
          current_priced = fresh_priced = resolved_old_gap = 0
          fresh_new_product_ids = set()
          for row in rows:
              metacard = str(row['metacard_external_id'])
              stored_ids = {str(x) for x in (row['product_ids_json'] or [])}
              fresh_products = fresh_by_metacard.get(metacard, [])
              candidates = []
              for product in fresh_products:
                  pid = str(product.product_id)
                  if pid not in stored_ids:
                      fresh_new_product_ids.add(pid)
                  for variant, price in visible_prices(price_by_id.get(pid)):
                      candidates.append({
                          'idProduct': pid,
                          'name': product.name,
                          'variant': variant,
                          'price': str(price),
                      })
              candidates.sort(key=lambda x: (Decimal(x['price']), x['variant'], x['idProduct']))
              best = candidates[0] if candidates else None
              current_price = row['current_price']
              if current_price is not None:
                  current_priced += 1
              if best is not None:
                  fresh_priced += 1
              if current_price is None and best is not None:
                  resolved_old_gap += 1

              if current_price is None or best is None or any(str(p.product_id) not in stored_ids for p in fresh_products):
                  details.append({
                      'metacard_id': metacard,
                      'name': row['name'],
                      'subject': row['subject'],
                      'representative_idProduct': str(row['representative_external_product_id']),
                      'stored_product_ids': sorted(stored_ids),
                      'stored_product_count': int(row['product_count'] or 0),
                      'current_db_price': str(current_price) if current_price is not None else None,
                      'current_db_price_idProduct': str(row['current_price_product_id']) if row['current_price_product_id'] else None,
                      'current_db_price_variant': row['current_price_variant'],
                      'current_db_price_as_of': row['current_price_as_of'].isoformat() if row['current_price_as_of'] else None,
                      'fresh_product_ids': sorted(str(p.product_id) for p in fresh_products),
                      'fresh_new_product_ids': sorted(str(p.product_id) for p in fresh_products if str(p.product_id) not in stored_ids),
                      'fresh_best_price': best,
                      'fresh_status': (
                          'priced'
                          if best is not None
                          else ('catalog_metacard_missing' if not fresh_products else 'price_guide_no_visible_price')
                      ),
                  })

          report = {
              'generated_at': now.isoformat(),
              'status': 'pass' if not errors else 'fail',
              'errors': errors,
              'production_writes': 0,
              'transaction_read_only': read_only,
              'source': {
                  'game': 'onepiece',
                  'cardmarket_game_id': 18,
                  'catalog_url': 'https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_18.json',
                  'price_guide_url': 'https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_18.json',
                  'catalog_created_at': catalog.created_at.isoformat() if catalog.created_at else None,
                  'catalog_products': len(catalog.rows),
                  'price_guide_created_at': price_as_of.isoformat() if price_as_of else None,
                  'price_guide_age_seconds': price_age_seconds,
                  'price_guide_products': len(price_rows),
              },
              'don': {
                  'source_as_of': rows[0]['source_as_of'].isoformat() if rows else None,
                  'metacards': len(rows),
                  'current_priced': current_priced,
                  'current_unpriced': len(rows) - current_priced,
                  'fresh_priced': fresh_priced,
                  'fresh_unpriced': len(rows) - fresh_priced,
                  'historical_unpriced_now_fresh_priced': resolved_old_gap,
                  'fresh_new_product_ids': len(fresh_new_product_ids),
              },
              'attention_rows': details,
          }
          OUTPUT.write_text(json.dumps(report, ensure_ascii=False, indent=2, default=str, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2, default=str, sort_keys=True))
          raise SystemExit(0 if not errors else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-don-fresh-price-v1-${{ github.run_id }}
          path: backend/artifacts/onepiece-don-fresh-price-v1.json
          retention-days: 30
          if-no-files-found: warn
