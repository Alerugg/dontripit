name: Audit Password Recovery Live PR V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-password-recovery-live-pr-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
      PUBLIC_SITE_URL: https://dontripit.com
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Prove local auth security contracts
        run: |
          unset DATABASE_URL DATABASE_URL_UNPOOLED RESEND_API_KEY AUTH_EMAIL_FROM
          pytest -q tests/test_user_auth_mvp.py
      - name: Require production auth secrets
        run: |
          test -n "${DATABASE_URL_UNPOOLED}${DATABASE_URL}"
          test -n "${RESEND_API_KEY}"
          test -n "${AUTH_EMAIL_FROM}"
      - name: Prove production schema and Resend E2E with disposable safe recipient
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          alembic upgrade head
          python - <<'PY'
          import json, os
          from sqlalchemy import select
          from app import db
          from app.email_delivery import email_delivery_configured, send_password_reset_email
          from app.main import create_app
          from app.user_auth_service import issue_password_reset_token, password_hash, utcnow
          from app.user_models import User, UserPasswordResetToken

          assert email_delivery_configured(), 'RESEND_API_KEY/AUTH_EMAIL_FROM not configured'
          email=f"delivered+dontripit-reset-{os.environ['RUN_ID']}@resend.dev"
          old_password=f"Old-{os.environ['RUN_ID']}-Password!"
          new_password=f"New-{os.environ['RUN_ID']}-Password!"
          app=create_app(); user_id=None
          result={}
          try:
              with db.SessionLocal() as session:
                  existing=session.execute(select(User).where(User.email==email)).scalar_one_or_none()
                  if existing:
                      session.delete(existing); session.commit()
                  user=User(name='Password Reset E2E',email=email,password_hash=password_hash(old_password),
                            marketing_consent=False,terms_accepted_at=utcnow(),is_active=True)
                  session.add(user); session.commit(); user_id=int(user.id)

              with app.test_client() as client:
                  forgot=client.post('/api/v2/auth/forgot-password',json={'email':email})
                  assert forgot.status_code==200,(forgot.status_code,forgot.get_json())
              with db.SessionLocal() as session:
                  tokens=session.execute(select(UserPasswordResetToken).where(UserPasswordResetToken.user_id==user_id)).scalars().all()
                  assert len(tokens)>=1,'forgot-password delivery failed/rolled back token'

              with db.SessionLocal() as session:
                  user=session.get(User,user_id)
                  raw_token, token_row=issue_password_reset_token(session,user=user)
                  session.commit(); token_id=int(token_row.id)
              assert send_password_reset_email(to_email=email,token=raw_token),'Resend delivery returned false'

              with app.test_client() as client:
                  reset=client.post('/api/v2/auth/reset-password',json={'token':raw_token,'password':new_password})
                  assert reset.status_code==200,(reset.status_code,reset.get_json())
                  reused=client.post('/api/v2/auth/reset-password',json={'token':raw_token,'password':'Another-Password-123!'})
                  assert reused.status_code==400 and reused.get_json().get('error')=='reset_token_invalid',reused.get_json()
                  old_login=client.post('/api/v2/auth/login',json={'email':email,'password':old_password})
                  new_login=client.post('/api/v2/auth/login',json={'email':email,'password':new_password})
                  assert old_login.status_code==401
                  assert new_login.status_code==200
              with db.SessionLocal() as session:
                  token=session.get(UserPasswordResetToken,token_id)
                  assert token is not None and token.used_at is not None
              result={'secrets':'pass','schema':'pass','forgot_endpoint':'pass','resend_delivery':'pass','reset_endpoint':'pass','one_time_token':'pass','password_rotation':'pass'}
              print(json.dumps(result,indent=2,sort_keys=True))
          finally:
              if user_id is not None:
                  with db.SessionLocal() as session:
                      user=session.get(User,user_id)
                      if user is not None: session.delete(user)
                      session.commit()
          PY
      - name: Prove deployed API and public proxy are configured
        run: |
          set -euo pipefail
          for url in \
            'https://api.dontripit.com/api/v2/auth/forgot-password' \
            'https://dontripit.com/api/auth/forgot-password'
          do
            body="$(mktemp)"
            status="$(curl -sS --retry 3 --retry-delay 2 -o "$body" -w '%{http_code}' \
              -X POST "$url" -H 'Content-Type: application/json' \
              --data '{"email":"dontripit-password-recovery-probe-does-not-exist@example.invalid"}')"
            echo "$url -> HTTP $status"
            cat "$body"; echo
            test "$status" = '200'
            python - "$body" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('ok') is True,p
          assert 'recibirás un enlace' in str(p.get('message','')),p
          PY
          done
