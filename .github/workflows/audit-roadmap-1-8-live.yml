name: Audit Roadmap 1-8 Live

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-roadmap-1-8-live.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-roadmap-1-8-live
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary==2.9.9
      - name: Audit live production state
        working-directory: backend
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          url=os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL']
          conn=psycopg2.connect(url)
          report={'mode':'read_only','roadmap':'1-8'}
          with conn, conn.cursor(cursor_factory=RealDictCursor) as cur:
            cur.execute("SELECT max(last_seen_at) AS capture FROM external_catalog_products WHERE source='cardmarket'")
            capture=cur.fetchone()['capture']
            report['cardmarket_capture']=capture.isoformat() if capture else None

            cur.execute('''
              WITH cm AS (
                SELECT e.id,e.external_id,e.game_id,e.product_group,g.slug
                FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.last_seen_at=%s
                  AND g.slug IN ('pokemon','onepiece','mtg','yugioh')
              ), mapped_print AS (
                SELECT DISTINCT cm.id
                FROM cm JOIN external_catalog_print_links l ON l.external_product_id=cm.id
                JOIN prints p ON p.id=l.print_id JOIN cards c ON c.id=p.card_id AND c.game_id=cm.game_id
                WHERE cm.product_group='single' AND l.link_status IN ('accepted','mapped','exact')
                UNION
                SELECT DISTINCT cm.id FROM cm
                JOIN print_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                JOIN prints p ON p.id=pi.print_id JOIN cards c ON c.id=p.card_id AND c.game_id=cm.game_id
                WHERE cm.product_group='single'
              ), mapped_product AS (
                SELECT DISTINCT cm.id
                FROM cm JOIN external_catalog_product_variant_links l ON l.external_product_id=cm.id
                JOIN product_variants pv ON pv.id=l.product_variant_id
                JOIN products p ON p.id=pv.product_id AND p.game_id=cm.game_id
                WHERE cm.product_group='non_single' AND l.link_status IN ('accepted','mapped','exact')
                UNION
                SELECT DISTINCT cm.id FROM cm
                JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                JOIN product_variants pv ON pv.id=pi.product_variant_id
                JOIN products p ON p.id=pv.product_id AND p.game_id=cm.game_id
                WHERE cm.product_group='non_single'
              ), mapped AS (
                SELECT id FROM mapped_print UNION SELECT id FROM mapped_product
              ), priced AS (
                SELECT DISTINCT p.external_product_id
                FROM external_market_price_snapshots p JOIN cm ON cm.id=p.external_product_id
              )
              SELECT cm.slug,cm.product_group,count(*) total,
                count(*) FILTER (WHERE m.id IS NOT NULL) mapped,
                count(*) FILTER (WHERE pr.external_product_id IS NOT NULL) externally_priced
              FROM cm LEFT JOIN mapped m ON m.id=cm.id LEFT JOIN priced pr ON pr.external_product_id=cm.id
              GROUP BY cm.slug,cm.product_group ORDER BY cm.slug,cm.product_group
            ''',(capture,))
            coverage=[]
            for row in cur.fetchall():
              d=dict(row); total=int(d['total']); mapped=int(d['mapped']); priced=int(d['externally_priced'])
              d.update(total=total,mapped=mapped,externally_priced=priced,
                       mapping_pct=round(mapped*100/total,3) if total else 0,
                       external_price_pct=round(priced*100/total,3) if total else 0,
                       unresolved=total-mapped)
              coverage.append(d)
            report['cardmarket_coverage']=coverage

            cur.execute('''
              WITH cm AS (
                SELECT e.*,g.slug
                FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.last_seen_at=%s
                  AND e.product_group='non_single'
                  AND g.slug IN ('pokemon','onepiece','mtg','yugioh')
              ), mapped_product AS (
                SELECT DISTINCT cm.id
                FROM cm JOIN external_catalog_product_variant_links l ON l.external_product_id=cm.id
                JOIN product_variants pv ON pv.id=l.product_variant_id
                JOIN products p ON p.id=pv.product_id AND p.game_id=cm.game_id
                WHERE l.link_status IN ('accepted','mapped','exact')
                UNION
                SELECT DISTINCT cm.id FROM cm
                JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                JOIN product_variants pv ON pv.id=pi.product_variant_id
                JOIN products p ON p.id=pv.product_id AND p.game_id=cm.game_id
              )
              SELECT to_jsonb(cm) AS external_product
              FROM cm LEFT JOIN mapped_product m ON m.id=cm.id
              WHERE m.id IS NULL
              ORDER BY cm.slug,cm.external_id
            ''',(capture,))
            report['unresolved_sealed']=[x['external_product'] for x in cur.fetchall()]

            cur.execute('''SELECT g.slug,count(DISTINCT c.id) cards,count(DISTINCT p.id) prints,
              count(DISTINCT s.id) sets
              FROM games g LEFT JOIN cards c ON c.game_id=g.id
              LEFT JOIN prints p ON p.card_id=c.id LEFT JOIN sets s ON s.game_id=g.id
              WHERE g.slug IN ('pokemon','onepiece','mtg','yugioh') GROUP BY g.slug ORDER BY g.slug''')
            report['canonical_catalog']=[dict(x) for x in cur.fetchall()]

            cur.execute('''SELECT g.slug,count(DISTINCT p.id) products,count(DISTINCT pv.id) variants,
              count(DISTINCT pi.external_id) FILTER (WHERE pi.source='cardmarket') cardmarket_identifiers
              FROM games g LEFT JOIN products p ON p.game_id=g.id LEFT JOIN product_variants pv ON pv.product_id=p.id
              LEFT JOIN product_identifiers pi ON pi.product_variant_id=pv.id
              WHERE g.slug IN ('pokemon','onepiece','mtg','yugioh') GROUP BY g.slug ORDER BY g.slug''')
            report['sealed_canonical']=[dict(x) for x in cur.fetchall()]

            cur.execute('''SELECT g.slug,count(*) AS prints,
              count(*) FILTER (WHERE EXISTS(SELECT 1 FROM print_images i WHERE i.print_id=p.id AND NULLIF(i.url,'') IS NOT NULL)) AS with_image
              FROM prints p JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
              WHERE g.slug IN ('pokemon','onepiece','mtg','yugioh') GROUP BY g.slug ORDER BY g.slug''')
            images=[]
            for row in cur.fetchall():
              d=dict(row); d['prints']=int(d['prints']); d['with_image']=int(d['with_image']); d['missing_image']=d['prints']-d['with_image']; images.append(d)
            report['images']=images

            cur.execute("SELECT id FROM price_sources WHERE name='cardmarket' LIMIT 1")
            ps=cur.fetchone(); source_id=int(ps['id']) if ps else None
            if source_id:
              cur.execute('''SELECT g.slug,ps.entity_type,count(DISTINCT ps.entity_id) AS entities,max(ps.as_of) AS latest_as_of
                FROM price_snapshots ps
                JOIN prints p ON ps.entity_type='print' AND p.id=ps.entity_id
                JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
                WHERE ps.source_id=%s AND g.slug IN ('pokemon','onepiece','mtg','yugioh')
                GROUP BY g.slug,ps.entity_type ORDER BY g.slug,ps.entity_type''',(source_id,))
              report['canonical_print_prices']=[{**dict(x),'latest_as_of':x['latest_as_of'].isoformat() if x['latest_as_of'] else None} for x in cur.fetchall()]
              cur.execute('''SELECT g.slug,count(DISTINCT ps.entity_id) AS entities,max(ps.as_of) AS latest_as_of
                FROM price_snapshots ps JOIN product_variants pv ON ps.entity_type='product_variant' AND pv.id=ps.entity_id
                JOIN products p ON p.id=pv.product_id JOIN games g ON g.id=p.game_id
                WHERE ps.source_id=%s AND g.slug IN ('pokemon','onepiece','mtg','yugioh')
                GROUP BY g.slug ORDER BY g.slug''',(source_id,))
              report['canonical_sealed_prices']=[{**dict(x),'latest_as_of':x['latest_as_of'].isoformat() if x['latest_as_of'] else None} for x in cur.fetchall()]
            else:
              report['canonical_print_prices']=[]; report['canonical_sealed_prices']=[]

            cur.execute("SELECT to_regclass('public.user_password_reset_tokens') AS reset_table")
            report['password_reset_schema']=bool(cur.fetchone()['reset_table'])
            cur.execute("SELECT count(*) AS releases FROM catalog_releases")
            report['catalog_releases']=int(cur.fetchone()['releases'])

          conn.close()
          report['email_config']={
            'resend_api_key_present':bool(os.getenv('RESEND_API_KEY','').strip()),
            'auth_email_from_present':bool(os.getenv('AUTH_EMAIL_FROM','').strip()),
            'public_site_url_present':bool(os.getenv('PUBLIC_SITE_URL','').strip()),
          }
          Path('/tmp/roadmap-1-8-live.json').write_text(json.dumps(report,indent=2,default=str,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,default=str,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: roadmap-1-8-live-${{ github.run_id }}
          path: /tmp/roadmap-1-8-live.json
          retention-days: 90
          if-no-files-found: error
