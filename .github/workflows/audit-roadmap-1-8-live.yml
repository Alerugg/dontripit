name: Audit Roadmap 1-8 Live

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-roadmap-1-8-live.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-roadmap-1-8-live
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary==2.9.9
      - name: Audit exact six sealed identities and source prices
        run: |
          python - <<'PY'
          import json, os
          import psycopg2
          from psycopg2.extras import RealDictCursor

          ids=['903009','903002','902998','902999','903000','903001']
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          conn.set_session(readonly=True,autocommit=True)
          with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT max(last_seen_at) capture FROM external_catalog_products WHERE source='cardmarket'")
              capture=cur.fetchone()['capture']
              cur.execute('''
                SELECT e.id external_product_id,e.external_id,g.slug game,e.name,e.category,e.category_id,
                       e.expansion_external_id,e.date_added,e.website_path,e.last_seen_at,e.product_group,
                       (SELECT count(*) FROM product_identifiers pi
                        WHERE pi.source='cardmarket' AND pi.external_id=e.external_id) identifier_count,
                       (SELECT count(*) FROM external_catalog_product_variant_links l
                        WHERE l.external_product_id=e.id AND l.link_status IN ('accepted','mapped','exact')) accepted_link_count,
                       (SELECT count(*) FROM external_market_price_snapshots s
                        WHERE s.external_product_id=e.id) source_price_rows,
                       (SELECT max(s.as_of) FROM external_market_price_snapshots s
                        WHERE s.external_product_id=e.id) latest_source_price_as_of
                FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.external_id = ANY(%s)
                ORDER BY array_position(%s::text[],e.external_id)
              ''',(ids,ids))
              rows=[dict(r) for r in cur.fetchall()]
              price_rows={}
              for row in rows:
                  cur.execute('''
                    SELECT s.as_of,s.currency,s.price_variant,s.price_low,s.price_mid,s.price_market,s.price_last,
                           s.avg1,s.avg7,s.avg30,s.raw_json
                    FROM external_market_price_snapshots s
                    WHERE s.external_product_id=%s
                    ORDER BY s.as_of DESC,s.id DESC LIMIT 5
                  ''',(row['external_product_id'],))
                  price_rows[row['external_id']]=[dict(x) for x in cur.fetchall()]
          conn.close()
          report={'mode':'READ_ONLY','capture':capture,'rows':rows,'price_rows':price_rows}
          print('SEALED_PRICE_AUDIT='+json.dumps(report,default=str,sort_keys=True))
          if len(rows)!=6:
              raise SystemExit(f'Expected six source products, got {len(rows)}')
          PY
