name: Audit Pokemon Legacy Cardmarket Identifiers

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-pokemon-cardmarket-legacy-identifiers.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Audit unmigrated exact legacy identifiers only
        run: |
          python - <<'PY'
          import json,os
          from collections import defaultdict,Counter
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='pokemon' LIMIT 1");gid=int(cur.fetchone()['id'])
              cur.execute("SELECT max(last_seen_at) latest FROM external_catalog_products WHERE source='cardmarket'");latest=cur.fetchone()['latest']
              cur.execute('''SELECT pi.external_id id_product,pi.print_id,p.print_key,p.collector_number,p.variant,p.is_foil,p.language,s.code set_code,c.name card_name,
                e.id external_product_id,e.name market_name,e.expansion_external_id
                FROM print_identifiers pi JOIN prints p ON p.id=pi.print_id JOIN cards c ON c.id=p.card_id JOIN sets s ON s.id=p.set_id
                LEFT JOIN external_catalog_products e ON e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND e.last_seen_at=%s AND e.external_id=pi.external_id
                WHERE pi.source='cardmarket' AND c.game_id=%s''',(gid,latest,gid))
              ids=[dict(r) for r in cur.fetchall()]
              cur.execute('''SELECT l.external_product_id,l.print_id FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                WHERE e.source='cardmarket' AND e.game_id=%s AND l.link_status IN ('accepted','mapped','exact')''',(gid,))
              links=[dict(r) for r in cur.fetchall()]
            by_id=defaultdict(list)
            for r in ids:by_id[str(r['id_product'])].append(r)
            by_ext=defaultdict(set);by_print=defaultdict(set)
            for r in links:by_ext[int(r['external_product_id'])].add(int(r['print_id']));by_print[int(r['print_id'])].add(int(r['external_product_id']))
            status=Counter();safe=[]
            for cmid,rows in by_id.items():
              current=[r for r in rows if r['external_product_id'] is not None]
              if not current:status['identifier_not_in_current_cardmarket_catalog']+=1;continue
              ext_ids={int(r['external_product_id']) for r in current}
              print_ids={int(r['print_id']) for r in rows}
              if len(ext_ids)!=1:status['multiple_current_products_for_identifier']+=1;continue
              ext=next(iter(ext_ids));existing=by_ext.get(ext,set())
              if len(print_ids)!=1:
                if existing==print_ids:status['multi_print_identifier_already_exactly_linked']+=1
                else:status['multi_print_identifier_ambiguous']+=1
                continue
              pid=next(iter(print_ids))
              if existing:
                if existing=={pid}:status['already_linked_same_pair']+=1
                else:status['product_existing_conflict']+=1
                continue
              other=by_print.get(pid,set())
              if other:status['print_already_linked_elsewhere']+=1;continue
              r=current[0]
              safe.append({'idProduct':cmid,'external_product_id':ext,'print_id':pid,'print_key':r['print_key'],'card_name':r['card_name'],'set_code':r['set_code'],
                'collector_number':r['collector_number'],'variant':r['variant'],'is_foil':bool(r['is_foil']),'language':r['language'],'market_name':r['market_name'],'expansion_external_id':r['expansion_external_id']})
              status['safe_unmigrated_unique_identifier']+=1
            report={'mode':'dry_run','game':'pokemon','latest_cardmarket_snapshot':str(latest),'legacy_identifier_rows':len(ids),'legacy_unique_idProducts':len(by_id),
              'accepted_cardmarket_links':len(links),'status_counts':dict(status),'safe_candidates':len(safe),'safe_prints':len({x['print_id'] for x in safe}),'safe_products':len({x['external_product_id'] for x in safe}),
              'candidate_sample':safe[:200]}
            summary={k:v for k,v in report.items() if not k.endswith('_sample')}
            Path('/tmp/pokemon-legacy-cardmarket.json').write_text(json.dumps(report,indent=2,default=str)+'\n');Path('/tmp/pokemon-legacy-cardmarket-summary.json').write_text(json.dumps(summary,indent=2,default=str)+'\n')
            print(json.dumps(summary,indent=2,default=str))
          finally:conn.close()
          PY
      - name: Persist summary
        run: |
          mkdir -p audit-reports
          cp /tmp/pokemon-legacy-cardmarket-summary.json audit-reports/pokemon-cardmarket-legacy-identifiers-summary.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/pokemon-cardmarket-legacy-identifiers-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Pokemon legacy Cardmarket identifier audit"
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokemon-cardmarket-legacy-identifiers-${{ github.run_id }}
          path: /tmp/pokemon-legacy-cardmarket.json
          retention-days: 90
