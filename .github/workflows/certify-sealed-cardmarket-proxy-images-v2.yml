name: Certify Sealed Cardmarket Proxy Images V2

# Production trigger: materialize the already-certified exact Cardmarket proxy manifest.
on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - 'backend/app/main.py'
      - 'backend/app/routes/product_media.py'
      - 'backend/app/scripts/sync_sealed_cardmarket_proxy_images_v1.py'
      - 'backend/app/scripts/sync_sealed_cardmarket_proxy_images_v2.py'
      - 'backend/tests/test_product_media_proxy.py'
      - 'backend/requirements.txt'
      - '.github/workflows/certify-sealed-cardmarket-proxy-images-v2.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/main.py'
      - 'backend/app/routes/product_media.py'
      - 'backend/app/scripts/sync_sealed_cardmarket_proxy_images_v1.py'
      - 'backend/app/scripts/sync_sealed_cardmarket_proxy_images_v2.py'
      - 'backend/requirements.txt'
      - '.github/workflows/certify-sealed-cardmarket-proxy-images-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: sealed-cardmarket-proxy-images-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      PRODUCT_MEDIA_PUBLIC_BASE_URL: https://api.dontripit.com
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Compile exact sealed proxy pipeline
        run: |
          python -m py_compile \
            app/routes/product_media.py \
            app/scripts/sync_sealed_cardmarket_proxy_images_v1.py \
            app/scripts/sync_sealed_cardmarket_proxy_images_v2.py \
            tests/test_product_media_proxy.py

      - name: Run exact proxy contract tests
        run: pytest -q tests/test_product_media_proxy.py

      - name: Certify full exact sealed image population
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/sealed-cardmarket-proxy-images
          MODE="--audit"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "catalog-v2" ]; then
            MODE="--apply --certify-two-pass"
          fi
          python -m app.scripts.sync_sealed_cardmarket_proxy_images_v2 \
            $MODE \
            --max-workers 10 \
            --timeout 12 \
            --retries 2 \
            --public-base-url "$PRODUCT_MEDIA_PUBLIC_BASE_URL" \
            --report /tmp/sealed-cardmarket-proxy-images/report.json

      - name: Assert closed exact-image contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/sealed-cardmarket-proxy-images/report.json'))
          assert p['gate']=='PASS', p
          c=p.get('certification') or p
          assert c['hard_failure_count']==0, c
          assert c['source_url_collision_count']==0, c
          assert c['eligible'] > 0, c
          assert c['recoverable_count'] > 0, c
          assert c['unique_recoverable_urls']==c['recoverable_count'], c
          if p['mode']=='audit':
              assert p['production_writes']==0, p
          else:
              assert p['first_pass']['identity_changed']==0, p
              assert p['second_pass']['inserted']==0, p
              assert p['second_pass']['material_writes']==0, p
              assert p['verification']['gate']=='PASS', p
          print(json.dumps({
              'mode':p['mode'],
              'gate':p['gate'],
              'eligible':c['eligible'],
              'recoverable':c['recoverable_count'],
              'unavailable':c['unavailable_count'],
              'byte_reuse_groups':c['image_byte_reuse_group_count'],
              'source_url_collisions':c['source_url_collision_count'],
              'first_pass':p.get('first_pass'),
              'second_pass':p.get('second_pass'),
              'verification':p.get('verification'),
          },indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-cardmarket-proxy-images-v2-${{ github.run_id }}
          path: /tmp/sealed-cardmarket-proxy-images/report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish production sealed-image certification status
        if: always() && github.event_name == 'push' && github.ref_name == 'catalog-v2'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/sealed-status.json
          import json, os
          from pathlib import Path
          state='success' if os.environ['JOB_STATUS']=='success' else 'failure'
          description='Sealed exact-image backfill failed closed'
          report=Path('/tmp/sealed-cardmarket-proxy-images/report.json')
          if state=='success' and report.exists():
              p=json.loads(report.read_text()); c=p.get('certification') or p
              inserted=(p.get('first_pass') or {}).get('inserted',0)
              unavailable=c.get('unavailable_count',0)
              description=f"PASS: +{inserted} exact proxy images; {unavailable} unavailable"[:140]
          print(json.dumps({
              'state':state,
              'context':'sealed-images-exact-proxy',
              'description':description,
              'target_url':os.environ['RUN_URL'],
          }))
          PY
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/sealed-status.json
