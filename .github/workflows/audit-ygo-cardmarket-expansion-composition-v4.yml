name: Audit YGO Cardmarket Expansion Composition V4

on:
  push:
    branches: [p1/cardmarket-identity-resolver-v1]
    paths:
      - 'backend/scripts/audit_yugioh_cardmarket_expansion_composition_v4.py'
      - '.github/workflows/audit-ygo-cardmarket-expansion-composition-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1/cardmarket-identity-resolver-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile V4 composition audit
        working-directory: backend
        run: python -m py_compile scripts/audit_yugioh_cardmarket_expansion_composition_v4.py

      - name: Read-only V4 composition calibration
        working-directory: backend
        run: >-
          python scripts/audit_yugioh_cardmarket_expansion_composition_v4.py
          --min-linked 5
          --min-informative 5
          --min-support 5
          --min-evidence-coverage 0.25
          --min-purity 0.95
          --min-margin 3
          --report /tmp/ygo-expansion-composition-v4.json

      - name: Assert calibration safety
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ygo-expansion-composition-v4.json'))['summary']
          assert d['production_writes'] == 0, d
          assert d['gold_certified_expansions'] >= 100, d
          assert d['calibration_ready'] is True, d
          p=d['best_zero_wrong_profile']
          assert p is not None, d
          assert p['gold_wrong'] == 0, p
          assert p['gold_precision'] == 1.0, p
          print('YGO_EXPANSION_COMPOSITION_V4_CALIBRATION_GATE=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-expansion-composition-v4-${{ github.run_id }}
          path: /tmp/ygo-expansion-composition-v4.json
          retention-days: 90
          if-no-files-found: error
