name: Observe Sealed Certifier Temporary

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/observe-sealed-certifier-temporary.yml'

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate sealed certifier run for idempotence fix
        uses: actions/github-script@v7
        id: locate
        with:
          github-token: ${{ github.token }}
          script: |
            const targetSha = '6ddc796784e82109e5be3f314d643fd345768037';
            const workflowId = 'certify-sealed-cardmarket-proxy-images-v2.yml';
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: 'catalog-v2',
              per_page: 50,
            });
            const run = response.data.workflow_runs.find(r => r.head_sha === targetSha);
            if (!run) throw new Error(`No ${workflowId} run found for ${targetSha}`);
            const payload = {
              run_id: run.id,
              status: run.status,
              conclusion: run.conclusion,
              event: run.event,
              head_sha: run.head_sha,
              created_at: run.created_at,
              updated_at: run.updated_at,
              html_url: run.html_url,
            };
            core.info(JSON.stringify(payload, null, 2));
            core.setOutput('run_id', String(run.id));
            core.setOutput('run_status', String(run.status));
            core.setOutput('run_conclusion', String(run.conclusion || ''));
            core.setOutput('run_url', run.html_url);

      - name: Publish observer status
        if: always() && steps.locate.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_STATUS: ${{ steps.locate.outputs.run_status }}
          RUN_CONCLUSION: ${{ steps.locate.outputs.run_conclusion }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
        run: |
          python - <<'PY' >/tmp/observer-status.json
          import json, os
          status=os.environ['RUN_STATUS']
          conclusion=os.environ['RUN_CONCLUSION'] or 'pending'
          print(json.dumps({
            'state':'success',
            'context':'sealed-certifier-observer',
            'description':f"run={os.environ['RUN_ID']} status={status} conclusion={conclusion}"[:140],
            'target_url':os.environ['RUN_URL'],
          }))
          PY
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/observer-status.json
