name: Launch Split Pokemon Refresh Now

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/launch-split-pokemon-refresh-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: refresh-pokemon-canonical-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff:
    name: cancel-legacy-and-dispatch-split
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch current split Pokemon refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/refresh-pokemon-canonical-v2.yml/dispatches" \
            -d '{"ref":"catalog-v2"}'
