name: Audit One Piece Official Text V1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/app/ingest/connectors/onepiece_v2.py'
      - 'backend/app/scripts/apply_onepiece_official_text_v1.py'
      - 'backend/tests/test_onepiece_v2_identity.py'
      - 'backend/tests/test_onepiece_official_text_backfill_v1.py'
      - '.github/workflows/audit-onepiece-official-text-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-onepiece-official-text-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile One Piece official text path
        working-directory: backend
        run: python -m py_compile app/ingest/connectors/onepiece_v2.py app/scripts/apply_onepiece_official_text_v1.py
      - name: Certify parser and fail-closed planner on isolated DB
        working-directory: backend
        run: pytest -q tests/test_onepiece_v2_identity.py tests/test_onepiece_official_text_backfill_v1.py
      - name: Audit production mapping and official text READ ONLY
        working-directory: backend
        run: python -m app.scripts.apply_onepiece_official_text_v1 --output /tmp/onepiece-official-text-v1.json
      - name: Enforce strict read-only execution
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/onepiece-official-text-v1.json'))
          assert p['read_only'] is True, p
          assert p['production_writes'] == 0, p
          assert p['applied'] is False, p
          assert p['source']['print_rows'] > 0, p
          PY
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onepiece-official-text-v1-${{ github.run_id }}
          path: /tmp/onepiece-official-text-v1.json
          retention-days: 90
          if-no-files-found: warn