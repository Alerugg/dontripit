name: Audit Pokemon ES TCGdex Assets V2

on:
  pull_request:
    paths:
      - '.github/workflows/audit-pokemon-es-tcgdex-assets-v2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      TCGDEX_CARDS_SHA: 771a8381c57c73182b9776657a15cd1166c66d36
      TCGDEX_CARDS_REPO: ${{ github.workspace }}/tcgdex-cards
      OUTPUT: backend/artifacts/pokemon-es-tcgdex-assets-v2.json
    steps:
      - name: Checkout Dontripit
        uses: actions/checkout@v4

      - name: Checkout pinned TCGdex source
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 771a8381c57c73182b9776657a15cd1166c66d36
          path: tcgdex-cards
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Certify existing ES path rule and probe 933 residuals - READ ONLY
        env:
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          test "$(git -C "$TCGDEX_CARDS_REPO" rev-parse HEAD)" = "$TCGDEX_CARDS_SHA"
          python - <<'PY'
          import json, os, re, time
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import requests
          from sqlalchemy import create_engine, text

          ROOT=Path(os.environ['TCGDEX_CARDS_REPO'])/'data'
          PIN=os.environ['TCGDEX_CARDS_SHA']
          ID_RE=re.compile(r'\bid\s*:\s*["\']([^"\']+)["\']')

          # Build canonical set -> series mapping from pinned TCGdex source layout.
          set_to_series={}; source_files={}
          for path in ROOT.rglob('*.ts'):
              rel=path.relative_to(ROOT)
              if len(rel.parts)<2:
                  continue
              try:
                  content=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'import { Set }' not in content or 'import serie from' not in content:
                  continue
              m=ID_RE.search(content)
              if not m:
                  continue
              set_id=m.group(1)
              series_file=ROOT/f'{rel.parts[0]}.ts'
              if not series_file.exists():
                  continue
              try:
                  series_content=series_file.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              sm=ID_RE.search(series_content)
              if not sm:
                  continue
              series_id=sm.group(1)
              previous=set_to_series.get(set_id)
              if previous and previous!=series_id:
                  raise RuntimeError(f'conflicting series for set {set_id}: {previous} vs {series_id}')
              set_to_series[set_id]=series_id
              source_files[set_id]=str(rel)

          if len(set_to_series)<200:
              raise RuntimeError(f'implausibly small pinned set index: {len(set_to_series)}')
          set_ids=sorted(set_to_series,key=len,reverse=True)

          engine=create_engine(os.environ['DATABASE_URL_UNPOOLED'],pool_pre_ping=True)
          with engine.connect() as conn:
              conn.execute(text('SET TRANSACTION READ ONLY'))
              if conn.execute(text('SHOW transaction_read_only')).scalar_one()!='on':
                  raise RuntimeError('audit connection is not read-only')

              existing=[dict(r) for r in conn.execute(text('''
                SELECT p.id AS print_id,p.variant,im.id AS image_id,im.url,im.source,im.is_primary,
                       ids.cnt AS es_identifier_count,ids.external_id
                FROM prints p
                JOIN cards c ON c.id=p.card_id
                JOIN games g ON g.id=c.game_id
                JOIN print_images im ON im.print_id=p.id
                LEFT JOIN LATERAL (
                  SELECT COUNT(*)::int AS cnt, MIN(pi.external_id) AS external_id
                  FROM print_identifiers pi
                  WHERE pi.print_id=p.id AND pi.source='tcgdex:es'
                ) ids ON TRUE
                WHERE g.slug='pokemon' AND p.language='es'
                  AND im.source='tcgdex:es'
                ORDER BY p.id,im.id
              ''')).mappings().all()]

              missing=[dict(r) for r in conn.execute(text('''
                SELECT p.id AS print_id,p.variant,p.collector_number,p.print_key,
                       c.name AS card_name,s.code AS set_code,s.name AS set_name,
                       ids.cnt AS es_identifier_count,ids.external_id
                FROM prints p
                JOIN cards c ON c.id=p.card_id
                JOIN games g ON g.id=c.game_id
                LEFT JOIN sets s ON s.id=p.set_id
                LEFT JOIN LATERAL (
                  SELECT COUNT(*)::int AS cnt, MIN(pi.external_id) AS external_id
                  FROM print_identifiers pi
                  WHERE pi.print_id=p.id AND pi.source='tcgdex:es'
                ) ids ON TRUE
                WHERE g.slug='pokemon' AND p.language='es'
                  AND NOT EXISTS(SELECT 1 FROM print_images im WHERE im.print_id=p.id)
                ORDER BY p.id
              ''')).mappings().all()]
              conn.rollback()

          if len(existing)!=13113:
              raise RuntimeError(f'ES existing-image baseline drift: expected=13113 actual={len(existing)}')
          if len(missing)!=933:
              raise RuntimeError(f'ES missing-image baseline drift: expected=933 actual={len(missing)}')

          # Existing localized images must all be exact default Prints with exactly one localized identifier.
          existing_identity_errors=[]; existing_path_errors=[]
          for row in existing:
              if row.get('variant')!='default':
                  existing_identity_errors.append({'print_id':row['print_id'],'reason':'variant','value':row.get('variant')})
                  continue
              if int(row.get('es_identifier_count') or 0)!=1 or not row.get('external_id'):
                  existing_identity_errors.append({'print_id':row['print_id'],'reason':'identifier_count','count':row.get('es_identifier_count')})
                  continue
              if not bool(row.get('is_primary')):
                  existing_identity_errors.append({'print_id':row['print_id'],'reason':'not_primary'})
                  continue
              external_id=str(row['external_id'])
              set_id=next((sid for sid in set_ids if external_id.startswith(sid+'-')),None)
              if not set_id:
                  existing_path_errors.append({'print_id':row['print_id'],'external_id':external_id,'reason':'no_pinned_set_match'})
                  continue
              local_id=external_id[len(set_id)+1:]
              expected=f'https://assets.tcgdex.net/es/{set_to_series[set_id]}/{set_id}/{local_id}/high.webp'
              if str(row.get('url') or '')!=expected:
                  existing_path_errors.append({'print_id':row['print_id'],'external_id':external_id,'actual':row.get('url'),'expected':expected,'set_id':set_id})

          if existing_identity_errors:
              raise RuntimeError(f'existing ES identity violations: {existing_identity_errors[:20]} total={len(existing_identity_errors)}')
          if existing_path_errors:
              raise RuntimeError(f'existing ES source/path violations: {existing_path_errors[:20]} total={len(existing_path_errors)}')

          # The 933 residuals must have the same exact localized identity shape before any URL is tested.
          candidates=[]; candidate_errors=[]
          for row in missing:
              if row.get('variant')!='default':
                  candidate_errors.append({'print_id':row['print_id'],'reason':'variant','value':row.get('variant')})
                  continue
              if int(row.get('es_identifier_count') or 0)!=1 or not row.get('external_id'):
                  candidate_errors.append({'print_id':row['print_id'],'reason':'identifier_count','count':row.get('es_identifier_count')})
                  continue
              external_id=str(row['external_id'])
              set_id=next((sid for sid in set_ids if external_id.startswith(sid+'-')),None)
              if not set_id:
                  candidate_errors.append({'print_id':row['print_id'],'reason':'no_pinned_set_match','external_id':external_id})
                  continue
              local_id=external_id[len(set_id)+1:]
              series_id=set_to_series[set_id]
              candidates.append({
                'print_id':int(row['print_id']),'external_id':external_id,'set_id':set_id,'series_id':series_id,
                'local_id':local_id,'set_code':row.get('set_code'),'card_name':row.get('card_name'),
                'source_file':source_files.get(set_id),
                'url':f'https://assets.tcgdex.net/es/{series_id}/{set_id}/{local_id}/high.webp',
              })

          if candidate_errors:
              raise RuntimeError(f'ES residual identity/path mapping violations: {candidate_errors[:20]} total={len(candidate_errors)}')
          if len(candidates)!=933:
              raise RuntimeError(f'not all ES residuals mapped: expected=933 actual={len(candidates)}')

          def probe_once(item):
              try:
                  response=requests.get(item['url'],headers={
                    'User-Agent':'Dontripit Pokemon ES localized asset auditor/2.0',
                    'Accept':'image/webp,image/*;q=0.9,*/*;q=0.1',
                  },timeout=18,stream=True)
                  ctype=str(response.headers.get('Content-Type') or '').lower()
                  prefix=next(response.iter_content(32),b'') if response.status_code==200 else b''
                  return {**item,'status':response.status_code,'content_type':ctype,'prefix_hex':prefix[:12].hex(),'image_ok':response.status_code==200 and ctype.startswith('image/') and bool(prefix)}
              except Exception as exc:
                  return {**item,'status':type(exc).__name__,'error':str(exc),'image_ok':False}

          def probe(item):
              last=None
              for attempt in range(3):
                  last=probe_once(item); last['attempt']=attempt+1
                  if last.get('image_ok'):
                      return last
                  if last.get('status') not in (429,500,502,503,504):
                      return last
                  time.sleep(attempt+1)
              return last

          results=[]
          with ThreadPoolExecutor(max_workers=18) as pool:
              futures=[pool.submit(probe,item) for item in candidates]
              for future in as_completed(futures):
                  results.append(future.result())
          results.sort(key=lambda x:x['print_id'])
          verified=[r for r in results if r.get('image_ok')]

          per_set={}
          for set_id in sorted({r['set_id'] for r in results}):
              subset=[r for r in results if r['set_id']==set_id]
              per_set[set_id]={
                'count':len(subset),'series_id':subset[0]['series_id'],'source_file':subset[0]['source_file'],
                'status_counts':dict(Counter(str(x.get('status')) for x in subset)),
                'verified_images':sum(1 for x in subset if x.get('image_ok')),
              }

          report={
            'status':'pass','mode':'read-only-localized-source-backed-probe','production_writes':0,
            'source_version':PIN,'sets_indexed':len(set_to_series),
            'existing_es_image_rows_validated':len(existing),'existing_es_path_mismatches':0,
            'residual_total':len(missing),'exact_localized_candidates':len(candidates),
            'probe_status_counts':dict(Counter(str(r.get('status')) for r in results)),
            'verified_images':len(verified),'per_set':per_set,
            'verified_manifest':[{'print_id':r['print_id'],'external_id':r['external_id'],'url':r['url']} for r in verified],
            'all_probe_results':results,
          }
          out=Path(os.environ['OUTPUT']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False,default=str)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k not in ('verified_manifest','all_probe_results')},indent=2,sort_keys=True,ensure_ascii=False,default=str))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-es-tcgdex-assets-v2-${{ github.run_id }}
          path: backend/artifacts/pokemon-es-tcgdex-assets-v2.json
          retention-days: 30
