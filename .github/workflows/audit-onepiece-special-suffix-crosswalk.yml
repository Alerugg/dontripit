name: Audit One Piece Special Suffix Crosswalk

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-onepiece-special-suffix-crosswalk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests psycopg2-binary==2.9.9
      - name: Resolve remaining canonical variants only when suffix tokens match exactly
        run: |
          python - <<'PY'
          import concurrent.futures,json,os,re,time
          from collections import Counter,defaultdict
          from pathlib import Path
          from urllib.parse import quote
          import psycopg2,requests
          from psycopg2.extras import RealDictCursor

          SOURCE='https://one-piece.cards'
          http=requests.Session(); http.headers.update({'User-Agent':'DontRipIt/1.0 special-suffix-exact-auditor'})
          first=http.get(f'{SOURCE}/api/cards',params={'limit':500,'page':1},timeout=30); first.raise_for_status(); firstp=first.json()
          pages=[firstp]
          for page in range(2,max(1,int(firstp.get('totalPages') or 1))+1):
            r=http.get(f'{SOURCE}/api/cards',params={'limit':500,'page':page},timeout=30); r.raise_for_status(); pages.append(r.json())

          source_index=defaultdict(list); suffix_counts=Counter(); source_unique=set()
          for payload in pages:
            for card in payload.get('cards') or []:
              if str(card.get('lang') or '').lower()!='en': continue
              sid=str(card.get('id') or '').removesuffix('.jpg'); vid=str(card.get('variant_id') or '').removesuffix('.jpg'); collector=str(card.get('card_id') or '').upper().removesuffix('.JPG')
              if not sid or not collector or sid in source_unique: continue
              source_unique.add(sid)
              variant='default'
              if vid.upper().startswith(collector+'_'): variant=vid[len(collector)+1:].lower()
              suffix_counts[variant]+=1
              if variant.startswith('cm'): continue
              source_index[(collector,variant)].append({'source_id':sid,'variant_id':vid,'collector':collector,'variant':variant,'name':card.get('name'),'set':card.get('set')})

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with conn,conn.cursor(cursor_factory=RealDictCursor) as cur:
            cur.execute("SELECT id FROM games WHERE slug='onepiece'"); gid=int(cur.fetchone()['id'])
            cur.execute('''SELECT p.id print_id,p.collector_number,p.variant,p.language,p.print_key,c.name card_name,s.code set_code
              FROM prints p JOIN cards c ON c.id=p.card_id JOIN sets s ON s.id=p.set_id WHERE c.game_id=%s AND lower(p.language)='en' ''',(gid,)); canonical=[dict(r) for r in cur.fetchall()]
            cur.execute("SELECT max(last_seen_at) latest FROM external_catalog_products WHERE source='cardmarket'"); latest=cur.fetchone()['latest']
            cur.execute('''SELECT id external_product_id,external_id,name,expansion_external_id,last_seen_at FROM external_catalog_products
              WHERE source='cardmarket' AND game_id=%s AND product_group='single' ''',(gid,)); products=[dict(r) for r in cur.fetchall()]
            cur.execute('''SELECT l.external_product_id,l.print_id,l.link_status,l.mapping_method,l.confidence FROM external_catalog_print_links l
              JOIN external_catalog_products e ON e.id=l.external_product_id WHERE e.source='cardmarket' AND e.game_id=%s AND l.link_status IN ('accepted','mapped','exact')''',(gid,)); links=[dict(r) for r in cur.fetchall()]
          conn.close()

          by_print=defaultdict(set); by_product=defaultdict(set)
          for l in links: by_print[int(l['print_id'])].add(int(l['external_product_id'])); by_product[int(l['external_product_id'])].add(int(l['print_id']))
          product_by_external=defaultdict(list)
          for p in products: product_by_external[str(p['external_id'])].append(p)
          canonical_keys=defaultdict(list)
          for p in canonical: canonical_keys[(str(p['collector_number']).upper(),str(p.get('variant') or 'default').lower())].append(p)

          pre=Counter(); fetch_rows=[]; details=[]
          for key,prints in canonical_keys.items():
            if len(prints)!=1:
              for p in prints:
                if not by_print.get(int(p['print_id'])): pre['canonical_key_ambiguous']+=1
              continue
            p=prints[0]; pid=int(p['print_id'])
            if by_print.get(pid): pre['already_mapped']+=1; continue
            sources=source_index.get(key,[])
            if len(sources)==0: pre['no_exact_source_suffix']+=1; continue
            if len(sources)!=1:
              pre['source_key_ambiguous']+=1; details.append({'print_id':pid,'key':key,'result':'source_key_ambiguous','sources':[s['source_id'] for s in sources]}); continue
            fetch_rows.append({**sources[0],'print_id':pid,'canonical_name':p['card_name'],'set_code':p['set_code']}); pre['detail_fetch_candidate']+=1

          cm_url_re=re.compile(r'https://www\.cardmarket\.com/OnePiece/Products\?idProduct=(\d+)',re.I); cm_text_re=re.compile(r'CM:\s*(\d+)')
          def fetch(row):
            url=f"{SOURCE}/cards/{quote(row['source_id'],safe='')}"
            for attempt in range(3):
              try:
                r=http.get(url,timeout=15)
                if r.status_code==200:
                  ids=sorted(set(cm_url_re.findall(r.text) or cm_text_re.findall(r.text)))
                  return {**row,'source_url':url,'http_status':200,'cm_ids':ids}
                if r.status_code in (429,500,502,503,504) and attempt<2: time.sleep(.5*(attempt+1)); continue
                return {**row,'source_url':url,'http_status':r.status_code,'cm_ids':[]}
              except Exception as exc:
                if attempt<2: time.sleep(.5*(attempt+1)); continue
                return {**row,'source_url':url,'http_status':'error','error':repr(exc),'cm_ids':[]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool: fetched=list(pool.map(fetch,fetch_rows))

          collector_re=re.compile(r'\(((?:OP|ST|EB|PRB)\d{1,2}-\d{3}|P-\d{3})\)\s*$',re.I)
          status=Counter(pre); candidates=[]
          for row in fetched:
            ids=row.get('cm_ids') or []; rec={k:row.get(k) for k in ('source_id','collector','variant','print_id','set_code','source_url','http_status')}
            if row.get('http_status')!=200: result='source_http_failure'
            elif len(ids)==0: result='source_has_no_cardmarket_id'
            elif len(ids)!=1: result='source_multiple_cardmarket_ids'
            else:
              ext=product_by_external.get(ids[0],[]); rec['cardmarket_id']=ids[0]
              if len(ext)==0: result='cardmarket_product_not_in_mirror'
              elif len(ext)!=1: result='cardmarket_product_ambiguous'
              else:
                e=ext[0]; m=collector_re.search(str(e.get('name') or '')); market_collector=m.group(1).upper() if m else None
                rec['external_product_id']=int(e['external_product_id']); rec['cardmarket_name']=e.get('name'); rec['market_collector']=market_collector
                if e.get('last_seen_at')!=latest: result='cardmarket_product_not_current'
                elif market_collector!=row['collector']: result='collector_mismatch'
                elif by_product.get(int(e['external_product_id'])) and row['print_id'] not in by_product[int(e['external_product_id'])]: result='existing_product_conflict'
                else:
                  result='candidate'; candidates.append({'source_id':row['source_id'],'source_url':row['source_url'],'collector':row['collector'],'variant':row['variant'],'print_id':int(row['print_id']),'external_product_id':int(e['external_product_id']),'cardmarket_id':ids[0],'cardmarket_name':e.get('name'),'set_code':row['set_code']})
            rec['result']=result; status[result]+=1; details.append(rec)

          pair=Counter((c['print_id'],c['external_product_id']) for c in candidates); pc=Counter(c['print_id'] for c in candidates); ec=Counter(c['external_product_id'] for c in candidates)
          safe=[c for c in candidates if pair[(c['print_id'],c['external_product_id'])]==1 and pc[c['print_id']]==1 and ec[c['external_product_id']]==1]
          safe_variants=Counter(c['variant'] for c in safe); safe_sets=Counter(c['set_code'] for c in safe)
          report={'mode':'dry_run_special_suffix','source_en_unique':len(source_unique),'canonical_en_prints':len(canonical),'currently_mapped':pre['already_mapped'],'detail_fetch_candidates':len(fetch_rows),'status_counts':dict(status),'candidate_pairs':len(candidates),'safe_pairs':len(safe),'projected_mapped':pre['already_mapped']+len(safe),'safe_variant_counts':dict(safe_variants.most_common()),'safe_set_top':dict(safe_sets.most_common(40)),'source_suffix_top':dict(suffix_counts.most_common(40)),'safe_sample':safe[:50],'details':details}
          print(json.dumps({k:v for k,v in report.items() if k!='details'},indent=2,ensure_ascii=False,default=str))
          Path('/tmp/onepiece-special-suffix-crosswalk.json').write_text(json.dumps(report,indent=2,ensure_ascii=False,default=str)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-special-suffix-crosswalk-${{ github.run_id }}
          path: /tmp/onepiece-special-suffix-crosswalk.json
          retention-days: 90
