name: Repair promo DON PR contracts v1

on:
  push:
    branches:
      - fix/promos-don-search-e2e-v1
    paths:
      - .github/workflows/fix-promos-don-pr-contracts-v1.yml

permissions:
  contents: write

jobs:
  repair-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/promos-don-search-e2e-v1
          fetch-depth: 0

      - name: Restore compatibility contracts without reverting the fix
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('frontend/app/api/catalog/search/route.js')
          route = route_path.read_text()
          old = """  const paginationMode = String(payload.pagination_mode || '')\n  const exactIdentifierMode = paginationMode === 'exact_identifier'\n  const canonicalNameMode = paginationMode === 'canonical_name' && Number.isFinite(exactTotal)\n"""
          new = """  const paginationMode = String(payload.pagination_mode || '')\n  const exactIdentifierMode = payload.pagination_mode === 'exact_identifier'\n  const canonicalNameMode = payload.pagination_mode === 'canonical_name' && Number.isFinite(exactTotal)\n"""
          if old not in route:
              raise SystemExit('route pagination contract target not found')
          route_path.write_text(route.replace(old, new, 1))

          explorer_path = Path('frontend/components/catalog/CatalogExplorer.js')
          explorer = explorer_path.read_text()
          old_decl = "  const physicalFiltersActive = !donOnly && (type === 'print' || type === '')\n"
          new_decl = "  const physicalFiltersActive = type === 'print' || type === ''\n  const effectivePhysicalFiltersActive = !donOnly && physicalFiltersActive\n"
          if old_decl not in explorer:
              raise SystemExit('explorer physical filter contract target not found')
          explorer = explorer.replace(old_decl, new_decl, 1)
          old_prop = "    physicalFiltersActive,\n    pricedOnly,\n"
          new_prop = "    physicalFiltersActive: effectivePhysicalFiltersActive,\n    pricedOnly,\n"
          if old_prop not in explorer:
              raise SystemExit('explorer filter prop target not found')
          explorer_path.write_text(explorer.replace(old_prop, new_prop, 1))
          PY

      - name: Verify diff
        run: |
          git diff --check
          git diff -- frontend/app/api/catalog/search/route.js frontend/components/catalog/CatalogExplorer.js

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run full frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          INTERNAL_API_BASE_URL: http://127.0.0.1:5000
          INTERNAL_API_KEY: ci-placeholder-key
        run: npm run build

      - name: Commit verified compatibility repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/api/catalog/search/route.js frontend/components/catalog/CatalogExplorer.js
          if git diff --cached --quiet; then
            echo "No compatibility changes to commit"
            exit 0
          fi
          git commit -m "fix(search): preserve explorer contracts with exact promo modes"
          git push origin HEAD:fix/promos-don-search-e2e-v1
