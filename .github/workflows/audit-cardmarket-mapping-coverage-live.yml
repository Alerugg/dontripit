name: Audit Cardmarket Mapping Coverage Live

# Manual refresh marker: 2026-08-11 point-1 exact Cardmarket gaps
on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-cardmarket-mapping-coverage-live.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-cardmarket-mapping-coverage-live
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Measure external catalog, exact mappings, links and latest prices
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          engine=create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          sql=text('''
          WITH cm AS (
            SELECT e.id,e.external_id,e.game_id,e.product_group,e.website_path,g.slug
            FROM external_catalog_products e
            JOIN games g ON g.id=e.game_id
            WHERE e.source='cardmarket' AND g.slug IN ('pokemon','onepiece','mtg','yugioh')
          ),
          exact_print AS (
            SELECT DISTINCT cm.id AS external_product_id
            FROM cm
            JOIN print_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
            JOIN prints p ON p.id=pi.print_id
            JOIN cards c ON c.id=p.card_id AND c.game_id=cm.game_id
            WHERE cm.product_group='single'
          ),
          exact_product AS (
            SELECT DISTINCT cm.id AS external_product_id
            FROM cm
            JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
            JOIN product_variants pv ON pv.id=pi.product_variant_id
            JOIN products p ON p.id=pv.product_id AND p.game_id=cm.game_id
            WHERE cm.product_group='non_single'
          ),
          accepted_print_link AS (
            SELECT DISTINCT l.external_product_id
            FROM external_catalog_print_links l
            JOIN cm ON cm.id=l.external_product_id
            JOIN prints p ON p.id=l.print_id
            JOIN cards c ON c.id=p.card_id AND c.game_id=cm.game_id
            WHERE cm.product_group='single' AND l.link_status IN ('accepted','mapped','exact')
          ),
          accepted_product_link AS (
            SELECT DISTINCT l.external_product_id
            FROM external_catalog_product_variant_links l
            JOIN cm ON cm.id=l.external_product_id
            JOIN product_variants pv ON pv.id=l.product_variant_id
            JOIN products p ON p.id=pv.product_id AND p.game_id=cm.game_id
            WHERE cm.product_group='non_single' AND l.link_status IN ('accepted','mapped','exact')
          ),
          exact_all AS (
            SELECT external_product_id FROM exact_print
            UNION SELECT external_product_id FROM exact_product
            UNION SELECT external_product_id FROM accepted_print_link
            UNION SELECT external_product_id FROM accepted_product_link
          ),
          latest_by_game AS (
            SELECT e.game_id, max(p.as_of) AS as_of
            FROM external_market_price_snapshots p
            JOIN external_catalog_products e ON e.id=p.external_product_id
            WHERE e.source='cardmarket'
            GROUP BY e.game_id
          ),
          latest_price_product AS (
            SELECT DISTINCT p.external_product_id
            FROM external_market_price_snapshots p
            JOIN cm ON cm.id=p.external_product_id
            JOIN latest_by_game l ON l.game_id=cm.game_id AND l.as_of=p.as_of
          )
          SELECT
            cm.slug,
            cm.product_group,
            count(*) AS total,
            count(*) FILTER (WHERE x.external_product_id IS NOT NULL) AS exact_mapped,
            count(*) FILTER (WHERE lp.external_product_id IS NOT NULL) AS latest_price_products,
            count(*) FILTER (WHERE cm.website_path IS NOT NULL AND cm.website_path<>'') AS stored_website_paths,
            count(*) FILTER (WHERE x.external_product_id IS NULL) AS unresolved
          FROM cm
          LEFT JOIN exact_all x ON x.external_product_id=cm.id
          LEFT JOIN latest_price_product lp ON lp.external_product_id=cm.id
          GROUP BY cm.slug,cm.product_group
          ORDER BY cm.slug,cm.product_group
          ''')
          with engine.connect() as conn:
              rows=conn.execute(sql).mappings().all()
              candidate_links=conn.execute(text('''
                SELECT g.slug,e.product_group,l.link_status,l.confidence,count(*)
                FROM external_catalog_print_links l
                JOIN external_catalog_products e ON e.id=l.external_product_id
                JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket'
                GROUP BY g.slug,e.product_group,l.link_status,l.confidence
                ORDER BY g.slug,e.product_group,l.link_status,l.confidence
              ''')).all()
              candidate_product_links=conn.execute(text('''
                SELECT g.slug,e.product_group,l.link_status,l.confidence,count(*)
                FROM external_catalog_product_variant_links l
                JOIN external_catalog_products e ON e.id=l.external_product_id
                JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket'
                GROUP BY g.slug,e.product_group,l.link_status,l.confidence
                ORDER BY g.slug,e.product_group,l.link_status,l.confidence
              ''')).all()
          result=[]
          for r in rows:
              d=dict(r)
              total=int(d['total']); exact=int(d['exact_mapped']); priced=int(d['latest_price_products'])
              d.update({
                'total':total,'exact_mapped':exact,'latest_price_products':priced,
                'stored_website_paths':int(d['stored_website_paths']),'unresolved':int(d['unresolved']),
                'exact_mapping_pct':round(exact*100/total,4) if total else 0,
                'latest_price_pct':round(priced*100/total,4) if total else 0,
              })
              result.append(d)
          report={
            'source':'cardmarket',
            'mode':'read_only',
            'coverage':result,
            'print_link_statuses':[list(x) for x in candidate_links],
            'product_variant_link_statuses':[list(x) for x in candidate_product_links],
            'redirect_policy':{
              'magic':'https://www.cardmarket.com/Magic/Products?idProduct={idProduct}',
              'pokemon':'https://www.cardmarket.com/Pokemon/Products?idProduct={idProduct}',
              'onepiece':'https://www.cardmarket.com/OnePiece/Products?idProduct={idProduct}',
              'yugioh':'https://www.cardmarket.com/YuGiOh/Products?idProduct={idProduct}',
              'identity':'game + Cardmarket idProduct',
            },
          }
          Path('/tmp/cardmarket-mapping-coverage.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cardmarket-mapping-coverage-${{ github.run_id }}
          path: /tmp/cardmarket-mapping-coverage.json
          retention-days: 30
          if-no-files-found: error
