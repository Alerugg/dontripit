name: Certify Yu-Gi-Oh Multilingual Fresh Ephemeral V3 Recovery

on:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - .github/triggers/run-yugioh-fresh-v3-recovery

permissions:
  contents: read
  actions: read

concurrency:
  group: certify-yugioh-multilingual-fresh-ephemeral-v3-recovery
  cancel-in-progress: true

env:
  PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
  EPHEMERAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_ygo_fresh_ephemeral
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_ygo_fresh_ephemeral
  YAML_YUGI_CARDS_URL: https://dawnbrandbots.github.io/yaml-yugi/cards.json
  YAML_YUGI_REPO_API: https://api.github.com/repos/DawnbrandBots/yaml-yugi
  PYTHONPATH: .

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dontripit_ygo_fresh_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dontripit_ygo_fresh_ephemeral"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout isolated Yu-Gi-Oh branch
        uses: actions/checkout@v4
        with:
          ref: multilingual-ygo-v1

      - name: Resolve recovery shadow refresh run id
        working-directory: .
        run: |
          set -euo pipefail
          run_id="$(tr -d '[:space:]' < .github/triggers/run-yugioh-fresh-v3-recovery)"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "FULL_REFRESH_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Using shadow refresh run $run_id"

      - name: Wait for certified shadow refresh source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_state=''
          for attempt in $(seq 1 90); do
            final_state="$(gh run view "$FULL_REFRESH_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion --jq '.status+":"+(.conclusion // "")')"
            echo "shadow refresh attempt=${attempt} state=${final_state}"
            case "$final_state" in
              completed:success) break ;;
              completed:*) echo "Shadow refresh completed without success: $final_state" >&2; exit 1 ;;
            esac
            sleep 60
          done
          test "$final_state" = 'completed:success'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Compile fresh-source certification code
        run: |
          python -m py_compile \
            app/scripts/seed_yugioh_production_shape_v1.py \
            app/scripts/prepare_yugioh_multilingual_ephemeral_v1.py \
            app/scripts/certify_yugioh_multilingual_ephemeral_v1.py \
            app/scripts/certify_yugioh_multilingual_ephemeral_v2.py \
            app/scripts/certify_yugioh_multilingual_ephemeral_v3.py \
            app/scripts/audit_yugioh_multilingual_rollout_readiness_v1.py

      - name: Prove production is source-only and ephemeral is local
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          prod=os.getenv('PRODUCTION_DATABASE_URL_UNPOOLED') or os.getenv('PRODUCTION_DATABASE_URL')
          eph=os.environ['EPHEMERAL_DATABASE_URL']
          assert prod and prod != eph
          assert urlparse(eph).hostname in {'127.0.0.1','localhost'}
          print('safety gate: production != target; target is local PostgreSQL')
          PY

      - name: Build exact production schema revision 34
        run: alembic upgrade 20260814_34

      - name: Clone only Yu-Gi-Oh catalog from production in READ ONLY mode
        run: python -m app.scripts.seed_yugioh_production_shape_v1

      - name: Apply regional and card-scoped migrations on production-shaped data
        run: alembic upgrade head

      - name: Certify migrations and install hard write guards
        run: python -m app.scripts.prepare_yugioh_multilingual_ephemeral_v1

      - name: Download certified fresh YGOJSON shadow artifact
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fresh-artifact" "$RUNNER_TEMP/ygojson-fresh/extracted" artifacts
          gh run view "$FULL_REFRESH_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,name > artifacts/yugioh-fresh-source-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/yugioh-fresh-source-run.json').read_text())
          assert r['status']=='completed' and r['conclusion']=='success', r
          assert r['name']=='Shadow YGOJSON Full Refresh V1', r
          PY
          gh run download "$FULL_REFRESH_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ygojson-shadow-full-refresh-v1-${FULL_REFRESH_RUN_ID}" \
            --dir "$RUNNER_TEMP/fresh-artifact"
          test -s "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-full-refresh-v1.json"
          test -s "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-fresh-aggregate-v1.zip"
          unzip -q "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-fresh-aggregate-v1.zip" -d "$RUNNER_TEMP/ygojson-fresh/extracted"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/cards.json"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/sets.json"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/meta.json"
          cp "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-full-refresh-v1.json" artifacts/
          cp "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-aggregate-sha256.txt" artifacts/

      - name: Download and seal current YAML Yugi localization source
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yaml-yugi"
          curl --fail --location --retry 4 --retry-all-errors --output "$RUNNER_TEMP/yaml-yugi/cards.json" "$YAML_YUGI_CARDS_URL"
          sha256sum "$RUNNER_TEMP/yaml-yugi/cards.json" | tee artifacts/yugioh-yaml-yugi-cards-sha256-v3.txt
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          cards=Path(os.environ['RUNNER_TEMP'])/'yaml-yugi'/'cards.json'
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'dontripit-ygo-fresh-cert-v3-recovery'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          repo=get(os.environ['YAML_YUGI_REPO_API'])
          commits=get(os.environ['YAML_YUGI_REPO_API']+'/commits?sha=master&per_page=1')
          meta={'source':'yaml-yugi','cards_url':os.environ['YAML_YUGI_CARDS_URL'],'sha256':hashlib.sha256(cards.read_bytes()).hexdigest(),'head':commits[0]['sha'] if commits else None,'head_date':commits[0]['commit']['committer']['date'] if commits else None,'pushed_at':repo.get('pushed_at')}
          out=Path(os.environ['RUNNER_TEMP'])/'yaml-yugi'/'source-meta.json'
          out.write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          Path('artifacts/yugioh-yaml-yugi-source-meta-v3.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          PY

      - name: Run guarded two-pass certification against fresh physical source
        run: |
          python -m app.scripts.certify_yugioh_multilingual_ephemeral_v3 \
            --input-dir "$RUNNER_TEMP/ygojson-fresh/extracted" \
            --yaml-yugi-cards "$RUNNER_TEMP/yaml-yugi/cards.json" \
            --yaml-yugi-meta "$RUNNER_TEMP/yaml-yugi/source-meta.json" \
            --source-evidence "$RUNNER_TEMP/fresh-artifact/ygojson-shadow-full-refresh-v1.json" \
            --output ../artifacts/yugioh-multilingual-fresh-ephemeral-v3.json

      - name: Enforce fresh-source certification contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../artifacts/yugioh-multilingual-fresh-ephemeral-v3.json').read_text())
          assert r['status']=='pass', r
          assert r['mode']=='ephemeral-only-yugioh-multilingual-certification-v3-fresh-source', r
          assert r['fresh_source_certified'] is True, r
          assert all(r['fresh_source_gates'].values()), r
          assert r['source_freshness']['status']=='current_enough', r
          assert r['production_writes']==0, r
          assert r['production_rollout_ready'] is False, r
          assert r['pass2_zero_writes'] is True and r['pass2']['total_writes']==0, r
          assert r['validation']['status']=='pass' and all(r['validation']['gates'].values()), r
          assert r['validation']['lean_invariants']['economics_untouched'] is True, r
          PY

      - name: Download certified overlay and localization-gap evidence
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          OVERLAY_RUN: '31910377210'
          GAPS_RUN: '31911720911'
        run: |
          set -euo pipefail
          mkdir -p evidence/overlay evidence/gaps
          for run in "$OVERLAY_RUN" "$GAPS_RUN"; do
            state="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status+":"+.conclusion')"
            test "$state" = 'completed:success'
          done
          gh run download "$OVERLAY_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "yugioh-current-physical-delta-ephemeral-v2-${OVERLAY_RUN}" --dir evidence/overlay
          gh run download "$GAPS_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "yugioh-current-localization-gaps-v2-${GAPS_RUN}" --dir evidence/gaps
          overlay_json="$(find evidence/overlay -type f -name 'yugioh-current-physical-delta-ephemeral-v2.json' -print -quit)"
          gaps_json="$(find evidence/gaps -type f -name 'yugioh-current-localization-gaps-v2.json' -print -quit)"
          test -n "$overlay_json" && test -s "$overlay_json"
          test -n "$gaps_json" && test -s "$gaps_json"
          if [ "$overlay_json" != "evidence/overlay/yugioh-current-physical-delta-ephemeral-v2.json" ]; then
            cp "$overlay_json" evidence/overlay/yugioh-current-physical-delta-ephemeral-v2.json
          fi
          if [ "$gaps_json" != "evidence/gaps/yugioh-current-localization-gaps-v2.json" ]; then
            cp "$gaps_json" evidence/gaps/yugioh-current-localization-gaps-v2.json
          fi
          test -s evidence/overlay/yugioh-current-physical-delta-ephemeral-v2.json
          test -s evidence/gaps/yugioh-current-localization-gaps-v2.json

      - name: Run final controlled rollout readiness gate
        run: |
          python -m app.scripts.audit_yugioh_multilingual_rollout_readiness_v1 \
            --fresh-historical ../artifacts/yugioh-multilingual-fresh-ephemeral-v3.json \
            --current-overlay ../evidence/overlay/yugioh-current-physical-delta-ephemeral-v2.json \
            --localization-gaps ../evidence/gaps/yugioh-current-localization-gaps-v2.json \
            --output ../artifacts/yugioh-multilingual-rollout-readiness-v1.json

      - name: Enforce final readiness without production authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../artifacts/yugioh-multilingual-rollout-readiness-v1.json').read_text())
          assert r['status']=='pass', r
          assert r['controlled_rollout_candidate_ready'] is True, r
          assert r['automatic_production_write_authorized'] is False, r
          assert r['production_writes']==0, r
          assert all(r['gates'].values()), r
          PY

      - name: Upload fresh certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-multilingual-fresh-ephemeral-v3-${{ github.run_id }}
          path: |
            artifacts/yugioh-multilingual-fresh-ephemeral-v3.json
            artifacts/yugioh-fresh-source-run.json
            artifacts/ygojson-shadow-full-refresh-v1.json
            artifacts/ygojson-shadow-aggregate-sha256.txt
            artifacts/yugioh-yaml-yugi-cards-sha256-v3.txt
            artifacts/yugioh-yaml-yugi-source-meta-v3.json
            /tmp/yugioh-production-shape-pre-migration.json
            /tmp/yugioh-multilingual-ephemeral-baseline.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload final readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-multilingual-rollout-readiness-v1-${{ github.run_id }}
          path: artifacts/yugioh-multilingual-rollout-readiness-v1.json
          retention-days: 90
          if-no-files-found: warn
