name: Certify Cloud Run migration
# Certification v3: production-parity Cloud Run revision.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/certify-cloud-run-migration.yml'

permissions:
  contents: read
  id-token: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve Cloud Run URL
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'europe-southwest1' }}
          SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'dontripit-api' }}
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          test -n "$SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "Cloud Run URL resolved"

      - name: Compare Cloud Run with current production API
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          targets = {
              'cloud_run': os.environ['SERVICE_URL'].rstrip('/'),
              'production': 'https://api.dontripit.com',
          }

          def get(base, path, params=None, timeout=30):
              url = base + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              started = time.perf_counter()
              req = urllib.request.Request(url, headers={'User-Agent': 'dontripit-cloud-run-certifier/3.0'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      body = response.read().decode('utf-8')
                      status = response.status
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  status = exc.code
              elapsed_ms = round((time.perf_counter() - started) * 1000, 1)
              try:
                  payload = json.loads(body)
              except Exception:
                  payload = {'raw': body[:1000]}
              return status, elapsed_ms, payload

          def summarize(payload):
              items = payload.get('items') or []
              first = items[0] if items else {}
              matched = first.get('matched_print') or first
              return {
                  'count': int(payload.get('count') or 0),
                  'total': payload.get('total'),
                  'total_prints': payload.get('total_prints'),
                  'pagination_mode': payload.get('pagination_mode'),
                  'first_name': first.get('name'),
                  'first_game': first.get('game'),
                  'first_collector_number': matched.get('collector_number'),
                  'first_set_code': matched.get('set_code'),
                  'error': payload.get('error'),
              }

          report = {'status': 'diagnostic', 'targets': {}, 'comparisons': []}
          for label, base in targets.items():
              status, ms, payload = get(base, '/api/health')
              report['targets'][label] = {
                  'health_status': status,
                  'health_ms': ms,
                  'health_ok': payload.get('ok'),
                  'runtime': payload.get('runtime'),
                  'revision': payload.get('revision'),
              }

          probes = [
              ('P-150', None),
              ('P-150', 'onepiece'),
              ('P-150', 'pokemon'),
              ('OP05-119', None),
              ('OP05-119', 'onepiece'),
              ('LOB-001', None),
              ('LOB-001', 'yugioh'),
              ('Luffy', 'onepiece'),
              ('Pikachu', 'pokemon'),
          ]

          for query, game in probes:
              row = {'query': query, 'game': game}
              params = {'q': query, 'limit': 24}
              if game:
                  params['game'] = game
              for label, base in targets.items():
                  status, ms, payload = get(base, '/api/v2/search', params)
                  row[label] = {'status': status, 'ms': ms, **summarize(payload)}
              row['same_count'] = row['cloud_run']['count'] == row['production']['count']
              row['same_first'] = (
                  row['cloud_run']['first_name'],
                  row['cloud_run']['first_collector_number'],
                  row['cloud_run']['first_set_code'],
              ) == (
                  row['production']['first_name'],
                  row['production']['first_collector_number'],
                  row['production']['first_set_code'],
              )
              report['comparisons'].append(row)

          print(json.dumps(report, indent=2, ensure_ascii=False, sort_keys=True))
          PY
