name: Certify Cloud Run migration

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve Cloud Run URL
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'europe-southwest1' }}
          SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'dontripit-api' }}
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          test -n "$SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Enforce Cloud Run parity with current production API
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          cloud_run = os.environ['SERVICE_URL'].rstrip('/')
          production = 'https://api.dontripit.com'

          def get(base, path, params=None):
              url = base + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': 'dontripit-cloud-run-parity/1.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, json.loads(response.read().decode('utf-8'))

          status, health = get(cloud_run, '/api/health')
          if status != 200 or health.get('ok') is not True or health.get('runtime') != 'cloud_run':
              raise SystemExit(f'Cloud Run health failed: status={status} body={health}')

          probes = [
              ('P-150', None),
              ('P-150', 'onepiece'),
              ('P-150', 'pokemon'),
              ('OP05-119', None),
              ('OP05-119', 'onepiece'),
              ('LOB-001', None),
              ('LOB-001', 'yugioh'),
              ('Luffy', 'onepiece'),
              ('Pikachu', 'pokemon'),
          ]

          report = []
          failures = []
          for query, game in probes:
              params = {'q': query, 'limit': 24}
              if game:
                  params['game'] = game
              cr_status, cr = get(cloud_run, '/api/v2/search', params)
              prod_status, prod = get(production, '/api/v2/search', params)

              def identity(payload):
                  items = payload.get('items') or []
                  first = items[0] if items else {}
                  matched = first.get('matched_print') or first
                  return (
                      int(payload.get('count') or 0),
                      payload.get('total'),
                      payload.get('total_prints'),
                      payload.get('pagination_mode'),
                      first.get('name'),
                      first.get('game'),
                      matched.get('collector_number'),
                      matched.get('set_code'),
                  )

              same = cr_status == prod_status == 200 and identity(cr) == identity(prod)
              row = {'query': query, 'game': game, 'parity': same, 'cloud_run': identity(cr), 'production': identity(prod)}
              report.append(row)
              if not same:
                  failures.append(row)

          print(json.dumps({'health': health, 'probes': report}, indent=2, ensure_ascii=False, default=list))
          if failures:
              raise SystemExit(f'Cloud Run parity failed for {len(failures)} probe(s)')
          PY
