name: Certify Yu-Gi-Oh regional set schema

on:
  workflow_dispatch:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - backend/alembic/versions/20260815_35_add_set_region_identity.py
      - backend/app/routes/set_ui.py
      - backend/tests/test_set_ui_region_identity.py
      - .github/workflows/certify-yugioh-set-region-schema.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dontripit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dontripit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/dontripit_test
      DATABASE_URL_UNPOOLED: postgresql+psycopg2://postgres:postgres@localhost:5432/dontripit_test
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply complete Alembic chain
        working-directory: backend
        run: alembic upgrade head

      - name: Verify regional set schema and coexistence
        working-directory: backend
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          import os

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as conn:
              cols = conn.execute(text("""
                  SELECT column_name, is_nullable, column_default
                  FROM information_schema.columns
                  WHERE table_name='sets' AND column_name='region'
              """)).mappings().all()
              assert len(cols) == 1, cols
              assert cols[0]["is_nullable"] == "NO", cols
              assert "global" in str(cols[0]["column_default"]), cols

              game_id = conn.execute(text("INSERT INTO games (slug, name) VALUES ('yugioh-region-cert', 'YGO Region Cert') RETURNING id")).scalar_one()
              global_id = conn.execute(text("""
                  INSERT INTO sets (game_id, code, name)
                  VALUES (:game_id, 'DL2', 'Legacy TCG') RETURNING id
              """), {"game_id": game_id}).scalar_one()
              jp_id = conn.execute(text("""
                  INSERT INTO sets (game_id, code, name, region)
                  VALUES (:game_id, 'DL2', 'Japanese OCG', 'jp') RETURNING id
              """), {"game_id": game_id}).scalar_one()
              assert global_id != jp_id

              rows = conn.execute(text("""
                  SELECT id, code, region FROM sets
                  WHERE game_id=:game_id AND code='DL2'
                  ORDER BY region
              """), {"game_id": game_id}).mappings().all()
              assert {(row['code'], row['region']) for row in rows} == {('DL2', 'global'), ('DL2', 'jp')}, rows

              duplicate_blocked = False
              try:
                  conn.execute(text("SAVEPOINT duplicate_guard"))
                  conn.execute(text("""
                      INSERT INTO sets (game_id, code, name, region)
                      VALUES (:game_id, 'DL2', 'Duplicate JP', 'jp')
                  """), {"game_id": game_id})
              except Exception:
                  duplicate_blocked = True
                  conn.execute(text("ROLLBACK TO SAVEPOINT duplicate_guard"))
              assert duplicate_blocked, "same game/code/region must remain unique"

          print("regional_schema_gate=PASS")
          print("coexistence_DL2_global_jp=PASS")
          print("duplicate_same_region_blocked=PASS")
          print("production_writes=0")
          PY

      - name: Run regional resolver tests
        working-directory: backend
        run: pytest -q tests/test_set_ui_region_identity.py
