name: Cleanup Demo Product Identifiers

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/cleanup-demo-product-identifiers.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Delete only certified obsolete demo identifiers
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          expected={
            1:{'product_variant_id':1,'source':'demo','external_id':'sv1-box-en-eu'},
            2:{'product_variant_id':2,'source':'demo','external_id':'sv1-etb-en-us'},
          }
          report={'mode':'cleanup_demo_identifiers','status':'started'}
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL']); conn.autocommit=False
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id,product_variant_id,source,external_id FROM product_identifiers WHERE source='demo' ORDER BY id")
              rows=[dict(r) for r in cur.fetchall()]
              actual={int(r['id']):r for r in rows}
              if set(actual)!=set(expected):
                raise AssertionError({'unexpected_demo_identifier_ids':rows})
              for ident,exp in expected.items():
                row=actual[ident]
                for key,value in exp.items():
                  if row.get(key)!=value:
                    raise AssertionError({'identifier':ident,'field':key,'actual':row.get(key),'expected':value})

              # Prove the canonical products are real and remain untouched.
              cur.execute('''SELECT pv.id AS product_variant_id,pv.product_id,pv.sku,pv.language,pv.region,pv.packaging,
                                    p.name AS product_name,p.product_type,g.slug AS game_slug,s.code AS set_code
                             FROM product_variants pv JOIN products p ON p.id=pv.product_id
                             JOIN games g ON g.id=p.game_id LEFT JOIN sets s ON s.id=p.set_id
                             WHERE pv.id=ANY(%s) ORDER BY pv.id''',([1,2],))
              variants=[dict(r) for r in cur.fetchall()]
              if len(variants)!=2 or any(r['game_slug']!='pokemon' or r['set_code']!='svi' for r in variants):
                raise AssertionError({'unexpected_canonical_products':variants})

              # Variant 1 already has a real exact Cardmarket identifier. Keep it.
              cur.execute("SELECT id,product_variant_id,source,external_id FROM product_identifiers WHERE product_variant_id=1 AND source='cardmarket'")
              cm=[dict(r) for r in cur.fetchall()]
              if len(cm)!=1 or cm[0]['external_id']!='692092':
                raise AssertionError({'booster_box_cardmarket_identity_not_proven':cm})

              cur.execute("DELETE FROM product_identifiers WHERE source='demo' AND id=ANY(%s) RETURNING id,product_variant_id,source,external_id",([1,2],))
              deleted=[dict(r) for r in cur.fetchall()]
              if len(deleted)!=2:
                raise AssertionError({'deleted':deleted})
              cur.execute("SELECT count(*) AS remaining FROM product_identifiers WHERE source='demo'")
              remaining=int(cur.fetchone()['remaining'])
              if remaining!=0:
                raise AssertionError({'remaining_demo_identifiers':remaining})

              # Products, variants and images must remain after cleanup.
              cur.execute("SELECT count(*) AS count FROM product_variants WHERE id=ANY(%s)",([1,2],))
              variants_after=int(cur.fetchone()['count'])
              cur.execute("SELECT count(*) AS count FROM products WHERE id=ANY(%s)",([1,2],))
              products_after=int(cur.fetchone()['count'])
              if variants_after!=2 or products_after!=2:
                raise AssertionError({'variants_after':variants_after,'products_after':products_after})

              report.update({'status':'cleaned','deleted':deleted,'canonical_variants_preserved':variants,'remaining_demo_identifiers':0})
            conn.commit()
          except Exception:
            conn.rollback(); raise
          finally:
            conn.close()
          print(json.dumps(report,indent=2,ensure_ascii=False,default=str))
          Path('/tmp/demo-product-identifiers-cleanup.json').write_text(json.dumps(report,indent=2,ensure_ascii=False,default=str)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-product-identifiers-cleanup-${{ github.run_id }}
          path: /tmp/demo-product-identifiers-cleanup.json
          retention-days: 90
