name: Probe One Piece Official Cardlist Structure

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/probe-onepiece-official-cardlist-structure.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Probe official HTML structure
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          url='https://en.onepiece-cardgame.com/cardlist/'
          r=requests.get(url,timeout=30,headers={'User-Agent':'DontRipIt/1.0 official-parity-audit'})
          r.raise_for_status()
          print('final_url',r.url,'status',r.status_code,'bytes',len(r.text))
          soup=BeautifulSoup(r.text,'html.parser')
          selects=[]
          for s in soup.find_all('select'):
              opts=[]
              for o in s.find_all('option'):
                  opts.append({'value':o.get('value'),'text':' '.join(o.stripped_strings)})
              selects.append({'name':s.get('name'),'id':s.get('id'),'class':s.get('class'),'options_count':len(opts),'options_sample':opts[:20]})
          print('SELECTS_JSON',json.dumps(selects,ensure_ascii=False))
          text=r.text
          for needle in ['OP16-001','OP16-011','series=','cardlist-','cardList','card_data','cardlist']:
              idx=text.find(needle)
              print('NEEDLE',needle,'IDX',idx)
              if idx>=0:
                  print(text[max(0,idx-700):idx+1300])
          series_pairs=re.findall(r'(?:series=|value=[\"\']?)(\d{4,})[^>\n]{0,300}',text,re.I)
          print('SERIES_NUMERIC_COUNT',len(set(series_pairs)),'SAMPLE',sorted(set(series_pairs))[:80])
          # common card wrappers containing first card code
          node=soup.find(string=re.compile(r'OP16-001'))
          if node:
              cur=node.parent
              for depth in range(6):
                  if not cur: break
                  print('ANCESTOR',depth,cur.name,cur.get('id'),cur.get('class'))
                  print(str(cur)[:2500])
                  cur=cur.parent
          PY
