name: Probe Cardmarket Sealed Gap Candidates Compact

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/probe-cardmarket-sealed-gap-candidates-compact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary
      - name: Probe exact release-family candidates read-only
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          TARGETS = [
            ('mtg','903009','Commander: Foundations: Deck Set','%commander%','%foundations%'),
            ('pokemon','903002',"Deck Crafter's Collection: Meowth ex",'%meowth%',None),
            ('yugioh','902998','Beyond the Brave Booster','%beyond%','%brave%'),
            ('yugioh','902999','Beyond the Brave Booster Box','%beyond%','%brave%'),
            ('yugioh','903000','Beyond the Brave: 3-Pack Tuckbox','%beyond%','%brave%'),
            ('yugioh','903001','Beyond the Brave Booster Box Case (12 Boxes)','%beyond%','%brave%'),
          ]
          dsn=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not dsn:
              raise RuntimeError('Production database secret is missing')
          conn=psycopg2.connect(dsn)
          conn.set_session(readonly=True,autocommit=True)
          out={'mode':'production_read_only','production_writes':0,'targets':[]}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id,slug FROM games WHERE slug=ANY(%s)",(['mtg','pokemon','yugioh'],))
              gids={r['slug']:r['id'] for r in cur.fetchall()}
              for game,external_id,external_name,p1,p2 in TARGETS:
                params=[gids[game],p1]
                predicate="lower(coalesce(p.name,'')) LIKE %s"
                if p2:
                    predicate += " AND lower(coalesce(p.name,'')) LIKE %s"
                    params.append(p2)
                cur.execute(f'''
                  SELECT p.id product_id,p.name product_name,p.product_type,
                         pv.id variant_id,pv.name variant_name
                  FROM products p
                  LEFT JOIN product_variants pv ON pv.product_id=p.id
                  WHERE p.game_id=%s AND {predicate}
                  ORDER BY p.id,pv.id
                  LIMIT 25
                ''',params)
                rows=[dict(r) for r in cur.fetchall()]
                out['targets'].append({
                  'game':game,'external_id':external_id,'external_name':external_name,
                  'candidate_count':len(rows),'candidates':rows
                })
          finally:
            conn.close()
          report=json.dumps(out,indent=2,sort_keys=True,default=str)
          Path('/tmp/cardmarket-sealed-gap-candidates-compact.json').write_text(report+'\n')
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-sealed-gap-candidates-compact-${{ github.run_id }}
          path: /tmp/cardmarket-sealed-gap-candidates-compact.json
          retention-days: 30
          if-no-files-found: error
