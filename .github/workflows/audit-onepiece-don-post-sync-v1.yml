name: Audit One Piece DON Post Sync V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-onepiece-don-post-sync-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PGOPTIONS: -c default_transaction_read_only=on
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Certify production DON price coverage READ ONLY
        run: |
          python - <<'PY'
          import json,os
          from sqlalchemy import text
          from app import db
          db.init_engine(os.environ['DATABASE_URL_UNPOOLED'])
          with db.SessionLocal() as session:
            session.execute(text('SET TRANSACTION READ ONLY'))
            assert session.execute(text('SHOW transaction_read_only')).scalar_one()=='on'
            rows=session.execute(text('''
              WITH latest AS (
                SELECT max(source_as_of) source_as_of FROM onepiece_don_market_items WHERE source='cardmarket'
              )
              SELECT m.metacard_external_id,m.name,m.subject,m.product_ids_json,m.source_as_of,
                     market.external_id AS id_product,market.price,market.price_variant,market.as_of
              FROM onepiece_don_market_items m
              JOIN latest l ON l.source_as_of=m.source_as_of
              LEFT JOIN LATERAL (
                SELECT e.external_id,cp.price,cp.price_variant,cp.as_of
                FROM jsonb_array_elements_text(COALESCE(m.product_ids_json,'[]'::jsonb)) pid(value)
                JOIN games g ON g.slug='onepiece'
                JOIN external_catalog_products e ON e.source='cardmarket' AND e.game_id=g.id AND e.product_group='single' AND e.external_id=pid.value
                LEFT JOIN LATERAL (
                  SELECT COALESCE(NULLIF(ps.price_mid,0),NULLIF(ps.price_market,0),NULLIF(ps.price_last,0),NULLIF(ps.price_low,0)) price,
                         ps.price_variant,ps.as_of
                  FROM external_market_price_snapshots ps
                  WHERE ps.external_product_id=e.id AND ps.currency='EUR'
                    AND COALESCE(NULLIF(ps.price_mid,0),NULLIF(ps.price_market,0),NULLIF(ps.price_last,0),NULLIF(ps.price_low,0)) IS NOT NULL
                  ORDER BY ps.as_of DESC,
                           COALESCE(NULLIF(ps.price_mid,0),NULLIF(ps.price_market,0),NULLIF(ps.price_last,0),NULLIF(ps.price_low,0)) ASC,
                           ps.price_variant ASC,ps.id DESC
                  LIMIT 1
                ) cp ON TRUE
                ORDER BY (cp.price IS NULL),cp.price ASC NULLS LAST,e.external_id ASC
                LIMIT 1
              ) market ON TRUE
              WHERE m.source='cardmarket'
              ORDER BY m.metacard_external_id
            ''')).mappings().all()
            session.rollback()
          priced=[r for r in rows if r['price'] is not None]
          missing=[{'metacard_id':str(r['metacard_external_id']),'name':r['name'],'subject':r['subject'],'product_ids':r['product_ids_json']} for r in rows if r['price'] is None]
          op17=[{'metacard_id':str(r['metacard_external_id']),'name':r['name'],'idProduct':str(r['id_product']) if r['id_product'] else None,'price':str(r['price']) if r['price'] is not None else None,'as_of':r['as_of'].isoformat() if r['as_of'] else None} for r in rows if 'OP17' in str(r['name'] or '')]
          report={'production_writes':0,'transaction_read_only':True,'metacards':len(rows),'priced':len(priced),'unpriced':len(missing),'unpriced_rows':missing,'op17':op17,'source_as_of':rows[0]['source_as_of'].isoformat() if rows else None}
          print(json.dumps(report,indent=2,default=str,sort_keys=True))
          assert len(rows)==164,report
          assert len(priced)==160,report
          assert len(missing)==4,report
          expected={'804813','804814','804815','865637'}
          actual={str(pid) for row in missing for pid in (row['product_ids'] or [])}
          assert actual==expected,(actual,expected,report)
          assert len(op17)==4 and all(x['price'] is not None for x in op17),report
          PY
