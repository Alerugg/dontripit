name: Audit Yu-Gi-Oh V2 Print Collisions

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/audit-yugioh-v2-print-collisions.yml'
      - 'backend/app/scripts/audit_yugioh_v2_print_collisions.py'
      - 'backend/app/scripts/build_yugioh_v2_snapshot.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile collision audit
        working-directory: backend
        run: python -m compileall -q app/scripts/audit_yugioh_v2_print_collisions.py app/scripts/build_yugioh_v2_snapshot.py
      - name: Audit exact Print key and shared constraint collisions
        working-directory: backend
        run: |
          set -euo pipefail
          python -u -m app.scripts.audit_yugioh_v2_print_collisions \
            --report-path /tmp/yugioh-v2-print-collisions.json \
            | tee /tmp/yugioh-v2-print-collisions.log
      - name: Upload collision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-v2-print-collisions-${{ github.sha }}
          path: |
            /tmp/yugioh-v2-print-collisions.json
            /tmp/yugioh-v2-print-collisions.log
          retention-days: 90
          if-no-files-found: error
