name: Frontend Security Audit

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/frontend-security-audit.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > /tmp/frontend-audit.json || true
          node - <<'NODE'
          const fs = require('fs')
          const payload = JSON.parse(fs.readFileSync('/tmp/frontend-audit.json', 'utf8'))
          console.log(JSON.stringify({
            metadata: payload.metadata,
            vulnerabilities: payload.vulnerabilities,
          }, null, 2))
          NODE
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-audit-${{ github.sha }}
          path: /tmp/frontend-audit.json
          retention-days: 30
