name: Certify Yu-Gi-Oh Multilingual Search V2

on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: certify-yugioh-multilingual-search-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile bridge V2
        working-directory: backend
        run: python -m py_compile app/scripts/audit_yugioh_cardmarket_es_historical_bridge_v2.py app/scripts/apply_yugioh_cardmarket_es_historical_bridge_v2.py app/scripts/apply_yugioh_cardmarket_es_bridge_v1.py
      - name: Require V1 remains idempotent READ ONLY
        working-directory: backend
        run: python -m app.scripts.apply_yugioh_cardmarket_es_bridge_v1 --expected-proposals 0 --output /tmp/ygo-es-v1-idempotent.json
      - name: Re-certify historical V2 immediately before write READ ONLY
        working-directory: backend
        run: python -m app.scripts.audit_yugioh_cardmarket_es_historical_bridge_v2
      - name: Apply exactly 1,159 historical ES links atomically
        working-directory: backend
        run: python -m app.scripts.apply_yugioh_cardmarket_es_historical_bridge_v2 --apply --expected-proposals 1159 --output /tmp/ygo-es-historical-v2-apply.json
      - name: Enforce committed V2 evidence
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/ygo-es-historical-v2-apply.json'))
          assert r['status']=='pass' and r['commit_confirmed'] is True, r
          assert r['production_writes']==1159, r
          assert r['before']['proposal_count']==1159, r
          assert r['after']['proposal_count']==0, r
          assert r['after']['multilingual_products']==22055, r
          assert r['economics_untouched'] and r['catalog_identity_untouched'] and r['images_untouched'] and r['ja_untouched'], r
          PY
      - name: Upload one-shot V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-cardmarket-es-historical-v2-${{ github.run_id }}
          path: |
            /tmp/ygo-es-v1-idempotent.json
            /tmp/yugioh-cardmarket-es-historical-bridge-v2.json
            /tmp/ygo-es-historical-v2-apply.json
          retention-days: 180
          if-no-files-found: warn
