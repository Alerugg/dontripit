name: Certify Cardmarket Version UI V1

on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: certify-cardmarket-version-ui-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile market readers and read-only auditors
        working-directory: backend
        run: python -m py_compile app/routes/card_prints.py app/routes/exact_print_output.py app/scripts/audit_exact_print_detail_coverage_v1.py app/scripts/audit_cardmarket_version_grouping_v1.py app/scripts/audit_yugioh_cardmarket_ja_surface_v1.py app/scripts/audit_onepiece_cardmarket_language_surface_v1.py app/scripts/apply_yugioh_cardmarket_es_bridge_v1.py app/scripts/apply_yugioh_cardmarket_es_historical_bridge_v2.py
      - name: Certify Exact Print Detail V2 on isolated DB
        working-directory: backend
        run: pytest -q tests/test_exact_print_detail_v2.py
      - name: Audit Exact Print Detail V2 coverage READ ONLY
        working-directory: backend
        run: python -m app.scripts.audit_exact_print_detail_coverage_v1 > /tmp/exact-print-detail-coverage-v1.json
      - name: Audit Cardmarket grouping READ ONLY
        working-directory: backend
        run: python -m app.scripts.audit_cardmarket_version_grouping_v1
      - name: Certify modern Yu-Gi-Oh ES bridge idempotent READ ONLY
        working-directory: backend
        run: python -m app.scripts.apply_yugioh_cardmarket_es_bridge_v1 --expected-proposals 0 --output /tmp/ygo-es-v1-idempotent.json
      - name: Certify historical Yu-Gi-Oh ES bridge idempotent READ ONLY
        working-directory: backend
        run: python -m app.scripts.apply_yugioh_cardmarket_es_historical_bridge_v2 --expected-proposals 0 --output /tmp/ygo-es-v2-idempotent.json
      - name: Inspect Yu-Gi-Oh Japanese OCG surface READ ONLY
        working-directory: backend
        run: python -m app.scripts.audit_yugioh_cardmarket_ja_surface_v1
      - name: Inspect One Piece global versus Asia surface READ ONLY
        working-directory: backend
        run: python -m app.scripts.audit_onepiece_cardmarket_language_surface_v1
      - name: Enforce zero-write state
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/ygo-es-v1-idempotent.json'))
          b=json.load(open('/tmp/ygo-es-v2-idempotent.json'))
          j=json.load(open('/tmp/yugioh-cardmarket-ja-surface-v1.json'))
          o=json.load(open('/tmp/onepiece-cardmarket-language-surface-v1.json'))
          x=json.load(open('/tmp/exact-print-detail-coverage-v1.json'))
          assert a['production_writes']==0 and b['production_writes']==0, (a,b)
          assert j['production_writes']==0 and o['production_writes']==0, (j,o)
          assert a['before']['proposal_count']==0 and b['before']['proposal_count']==0, (a,b)
          assert a['before']['multilingual_products']==22055, a
          assert b['before']['multilingual_products']==22055, b
          assert j['status']=='pass' and o['status']=='pass', (j,o)
          assert x['read_only'] is True and x['totals']['prints'] > 0, x
          PY
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-version-ui-readonly-${{ github.run_id }}
          path: |
            /tmp/exact-print-detail-coverage-v1.json
            /tmp/cardmarket-version-grouping-v1.json
            /tmp/ygo-es-v1-idempotent.json
            /tmp/ygo-es-v2-idempotent.json
            /tmp/yugioh-cardmarket-ja-surface-v1.json
            /tmp/onepiece-cardmarket-language-surface-v1.json
          retention-days: 90
          if-no-files-found: warn
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build