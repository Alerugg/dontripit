name: Certify Yu-Gi-Oh Multilingual Search V2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: certify-yugioh-multilingual-search-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Compile Cardmarket version reader and bridge certifiers
        working-directory: backend
        run: |
          python -m py_compile \
            app/routes/card_prints.py \
            app/scripts/audit_cardmarket_version_grouping_v1.py \
            app/scripts/audit_yugioh_cardmarket_es_bridge_v1.py \
            app/scripts/apply_yugioh_cardmarket_es_bridge_v1.py

      - name: Audit current Cardmarket grouping READ ONLY
        working-directory: backend
        run: python -m app.scripts.audit_cardmarket_version_grouping_v1

      - name: Certify ES bridge is fully idempotent READ ONLY
        working-directory: backend
        run: |
          python -m app.scripts.apply_yugioh_cardmarket_es_bridge_v1 \
            --expected-proposals 0 \
            --output /tmp/yugioh-cardmarket-es-bridge-idempotency-v1.json

      - name: Enforce post-apply read-only state
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/yugioh-cardmarket-es-bridge-idempotency-v1.json'))
          assert r['status']=='pass', r
          assert r['apply'] is False and r['commit_confirmed'] is False, r
          assert r['production_writes']==0, r
          assert r['before']['proposal_count']==0, r
          assert r['before']['multilingual_products']==20896, r
          assert r['economics_untouched'] is True, r
          assert r['catalog_identity_untouched'] is True, r
          assert r['images_untouched'] is True, r
          assert r['ja_untouched'] is True, r
          PY

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-version-grouping-post-apply-v1-${{ github.run_id }}
          path: |
            /tmp/cardmarket-version-grouping-v1.json
            /tmp/yugioh-cardmarket-es-bridge-idempotency-v1.json
          retention-days: 90
          if-no-files-found: warn

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend contract suite
        working-directory: frontend
        run: npm test

      - name: Build Next.js frontend
        working-directory: frontend
        run: npm run build
