name: Certify Yu-Gi-Oh Multilingual Search V2

on:
  push:
    branches:
      - agent/yugioh-multilingual-search-integration-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: certify-yugioh-multilingual-search-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Compile multilingual Search V2 backend and Cardmarket readers
        working-directory: backend
        run: |
          python -m py_compile \
            app/routes/search_v2.py \
            app/routes/card_prints.py \
            app/search_v2/yugioh_query.py \
            app/search_v2/yugioh_advanced.py \
            app/search_v2/yugioh_profiles.py \
            app/scripts/rebuild_yugioh_search_v2_fast.py \
            app/scripts/audit_yugioh_multilingual_search_live.py \
            app/scripts/audit_cardmarket_version_grouping_v1.py \
            app/scripts/audit_yugioh_cardmarket_es_bridge_v1.py

      - name: Audit Cardmarket product-language grouping READ ONLY
        working-directory: backend
        run: python -m app.scripts.audit_cardmarket_version_grouping_v1

      - name: Audit deterministic Yu-Gi-Oh ES Cardmarket bridge READ ONLY
        working-directory: backend
        run: python -m app.scripts.audit_yugioh_cardmarket_es_bridge_v1

      - name: Upload Cardmarket grouping evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-version-grouping-v1-${{ github.run_id }}
          path: |
            /tmp/cardmarket-version-grouping-v1.json
            /tmp/yugioh-cardmarket-es-bridge-v1.json
          retention-days: 90
          if-no-files-found: warn

      - name: Run targeted backend multilingual contract tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_yugioh_multilingual_search_v2.py \
            tests/test_yugioh_multilingual_production_transaction_proxy.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Enforce frontend security baseline
        working-directory: frontend
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Run frontend contract suite
        working-directory: frontend
        run: npm test

      - name: Build Next.js frontend
        working-directory: frontend
        run: npm run build
