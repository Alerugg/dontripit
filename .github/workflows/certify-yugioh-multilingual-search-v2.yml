name: Certify Yu-Gi-Oh Multilingual Search V2

on:
  push:
    branches:
      - agent/yugioh-multilingual-search-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: certify-yugioh-multilingual-search-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile multilingual Search V2 backend
        working-directory: backend
        run: |
          python -m py_compile \
            app/routes/search_v2.py \
            app/search_v2/yugioh_query.py \
            app/search_v2/yugioh_advanced.py \
            app/scripts/audit_yugioh_multilingual_search_live.py

      - name: Run targeted backend multilingual contract tests
        working-directory: backend
        run: pytest -q tests/test_yugioh_multilingual_search_v2.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Enforce frontend security baseline
        working-directory: frontend
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Run frontend contract suite
        working-directory: frontend
        run: npm test

      - name: Build Next.js frontend
        working-directory: frontend
        run: npm run build
