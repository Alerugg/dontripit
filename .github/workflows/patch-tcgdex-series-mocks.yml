name: Patch legacy TCGdex series mocks

on:
  push:
    branches:
      - multilingual-v1
    paths:
      - ".github/workflows/patch-tcgdex-series-mocks.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multilingual-v1

      - name: Add series discovery to legacy TCGdex mocks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_ingest_engine.py")
          text = path.read_text(encoding="utf-8")

          def patch_test(name, replacements):
              global text
              marker = f"def {name}"
              start = text.index(marker)
              end = text.find("\ndef test_", start + len(marker))
              if end == -1:
                  end = len(text)
              block = text[start:end]
              for old, new in replacements:
                  if old not in block:
                      raise SystemExit(f"missing expected snippet in {name}: {old!r}")
                  block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]

          direct_old = (
              '        if url.endswith("/series/tcgp"):\n'
              '            return {"id": "tcgp", "sets": [{"id": "A1"}]}\n'
          )
          direct_new = (
              '        if url.endswith("/series"):\n'
              '            return [{"id": "tcgp"}]\n'
              + direct_old
          )

          for name in [
              "test_tcgdex_remote_load_with_limit_stops_early_and_logs_progress",
              "test_tcgdex_remote_set_filter_does_not_fetch_per_card_endpoint",
              "test_tcgdex_remote_load_limit_run_persists_rows",
          ]:
              replacements = [(direct_old, direct_new)]
              if name == "test_tcgdex_remote_load_with_limit_stops_early_and_logs_progress":
                  replacements.append((
                      '    assert calls == [\n        "https://api.tcgdex.net/v2/en/series/tcgp",\n',
                      '    assert calls == [\n        "https://api.tcgdex.net/v2/en/series",\n        "https://api.tcgdex.net/v2/en/series/tcgp",\n',
                  ))
              elif name == "test_tcgdex_remote_set_filter_does_not_fetch_per_card_endpoint":
                  replacements.append((
                      '    assert calls == [\n        "https://api.tcgdex.net/v2/en/series/tcgp",\n',
                      '    assert calls == [\n        "https://api.tcgdex.net/v2/en/series",\n        "https://api.tcgdex.net/v2/en/series/tcgp",\n',
                  ))
              patch_test(name, replacements)

          series_payload_old = (
              '        "https://api.tcgdex.net/v2/en/series/tcgp": '
              '{"id": "tcgp", "sets": [{"id": "A1"}]},\n'
          )
          series_payload_new = (
              '        "https://api.tcgdex.net/v2/en/series": [{"id": "tcgp"}],\n'
              + series_payload_old
          )

          patch_test(
              "test_tcgdex_remote_set_ingest_fetches_set_only_with_limit",
              [
                  (series_payload_old, series_payload_new),
                  (
                      '    assert requested_urls == [\n        "https://api.tcgdex.net/v2/en/series/tcgp",\n',
                      '    assert requested_urls == [\n        "https://api.tcgdex.net/v2/en/series",\n        "https://api.tcgdex.net/v2/en/series/tcgp",\n',
                  ),
              ],
          )
          patch_test(
              "test_tcgdex_remote_without_set_preserves_general_list_behavior",
              [
                  (series_payload_old, series_payload_new),
                  (
                      '    assert requested_urls == [\n        "https://api.tcgdex.net/v2/en/series/tcgp",\n',
                      '    assert requested_urls == [\n        "https://api.tcgdex.net/v2/en/series",\n        "https://api.tcgdex.net/v2/en/series/tcgp",\n',
                  ),
              ],
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patched mocks
        run: |
          if git diff --quiet -- backend/tests/test_ingest_engine.py; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_ingest_engine.py
          git commit -m "test(multilingual): model TCGdex series discovery"
          git push origin HEAD:multilingual-v1
