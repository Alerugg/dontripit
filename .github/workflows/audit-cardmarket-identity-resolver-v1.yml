name: Audit Cardmarket Identity Resolver V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - 'backend/app/jobs/cardmarket_identity_resolver.py'
      - 'backend/scripts/audit_cardmarket_identity_resolver_v1.py'
      - 'backend/tests/test_cardmarket_identity_resolver_v1.py'
      - '.github/workflows/audit-cardmarket-identity-resolver-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PGOPTIONS: -c default_transaction_read_only=on
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Compile resolver and run focused safety tests
        run: |
          python -m py_compile \
            app/jobs/cardmarket_identity_resolver.py \
            scripts/audit_cardmarket_identity_resolver_v1.py \
            tests/test_cardmarket_identity_resolver_v1.py
          pytest -q tests/test_cardmarket_identity_resolver_v1.py

      - name: Download current public Cardmarket product catalogs and price guides
        run: |
          mkdir -p artifacts/cardmarket-inputs
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          from pathlib import Path
          from urllib import request

          root = Path('artifacts/cardmarket-inputs')
          sources = {
              'products_singles_1.json': 'https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_1.json',
              'products_singles_3.json': 'https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_3.json',
              'products_singles_6.json': 'https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json',
              'products_singles_18.json': 'https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_18.json',
              'price_guide_1.json': 'https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_1.json',
              'price_guide_3.json': 'https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_3.json',
              'price_guide_6.json': 'https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json',
              'price_guide_18.json': 'https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_18.json',
          }
          headers = {'User-Agent': 'Dontripit-Cardmarket-Identity-Resolver/1.0 (+read-only catalog audit)'}

          for filename, url in sources.items():
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = request.Request(url, headers=headers)
                      with request.urlopen(req, timeout=90) as response:
                          content = response.read()
                      if len(content) < 100:
                          raise RuntimeError(f'{filename} unexpectedly small: {len(content)} bytes')
                      payload = json.loads(content.decode('utf-8-sig'))
                      if not isinstance(payload, (dict, list)):
                          raise RuntimeError(f'{filename} unsupported JSON root')
                      (root / filename).write_bytes(content)
                      print(f'downloaded {filename}: {len(content)} bytes')
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt == 3:
                          raise
                      time.sleep(attempt * 2)
              else:
                  raise last_error
          PY

      - name: Execute Cardmarket Identity Resolver V1 against production READ ONLY
        run: |
          python scripts/audit_cardmarket_identity_resolver_v1.py \
            --catalog mtg=artifacts/cardmarket-inputs/products_singles_1.json \
            --catalog yugioh=artifacts/cardmarket-inputs/products_singles_3.json \
            --catalog pokemon=artifacts/cardmarket-inputs/products_singles_6.json \
            --catalog onepiece=artifacts/cardmarket-inputs/products_singles_18.json \
            --price-guide mtg=artifacts/cardmarket-inputs/price_guide_1.json \
            --price-guide yugioh=artifacts/cardmarket-inputs/price_guide_3.json \
            --price-guide pokemon=artifacts/cardmarket-inputs/price_guide_6.json \
            --price-guide onepiece=artifacts/cardmarket-inputs/price_guide_18.json \
            --outdir artifacts/cardmarket-identity-resolver-v1

      - name: Assert zero-write evidence and exact gold-set safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('artifacts/cardmarket-identity-resolver-v1/summary.json').read_text())
          assert summary['mode'] == 'READ_ONLY'
          assert summary['production_writes'] == 0
          assert summary['transaction_read_only'] is True
          assert summary['forbidden_mismatches']['duplicate_catalog_idProduct'] == 0
          assert summary['forbidden_mismatches']['wrong_exact_gold_predictions'] == 0
          assert summary['forbidden_mismatches']['cross_game_resolver_writes'] == 0
          print(json.dumps({
              'status': summary['status'],
              'pending': summary['pending_missing_current_cardmarket_price'],
              'resolver_identities': summary['resolver_identities'],
              'exact_rows': summary['exact_resolvable_pending_print_rows'],
              'high_confidence_review_rows': summary['high_confidence_review_pending_print_rows'],
              'projected_price_rows': summary['projected_price_recoverable_pending_print_rows'],
              'ambiguous_rows': summary['print_row_results'].get('AMBIGUOUS', 0),
              'unmatched_rows': summary['print_row_results'].get('UNMATCHED', 0),
              'goldset': summary['goldset'],
          }, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-identity-resolver-v1-${{ github.run_id }}
          path: |
            backend/artifacts/cardmarket-identity-resolver-v1/
          retention-days: 30
          if-no-files-found: error
