name: Cloudflare Hardened Preview Deploy

on:
  push:
    branches:
      - infra/cloudflare-catalog-cache-hardening
    paths:
      - '.github/triggers/cloudflare-hardened-preview-deploy*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 7fcca192ccc3d1f2f0d9d5843391a2f5
  WORKER_NAME: dontripit-web-preview
  WORKER_URL: https://dontripit-web-preview.alejandro-ruggeri-l.workers.dev

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify current preview bindings before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          code=$(curl -sS "${auth[@]}" -o /tmp/settings-before.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")
          echo "settings_before_http=$code"
          test "$code" = "200"
          jq -e '.success==true' /tmp/settings-before.json >/dev/null
          jq -r '.result.bindings[]? | [.name,.type] | @tsv' /tmp/settings-before.json | sort > /tmp/bindings-before.txt
          cat /tmp/bindings-before.txt
          grep -q $'^INTERNAL_API_KEY\tsecret_text$' /tmp/bindings-before.txt
          grep -q $'^VINEXT_KV_CACHE\tkv_namespace$' /tmp/bindings-before.txt
      - name: Install frontend dependencies without rewriting lockfile
        working-directory: frontend
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run focused hardening tests
        working-directory: frontend
        run: node --test tests/catalogMetadataHardening.test.js tests/bffRoutesSyntax.test.mjs
      - name: Build Vinext bundle
        working-directory: frontend
        run: npm run build:vinext
      - name: Deploy only preview Worker
        working-directory: frontend
        run: npm run deploy:vinext
      - name: Verify bindings survived deploy
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          code=$(curl -sS "${auth[@]}" -o /tmp/settings-after.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")
          echo "settings_after_http=$code"
          test "$code" = "200"
          jq -e '.success==true' /tmp/settings-after.json >/dev/null
          jq -r '.result.bindings[]? | [.name,.type] | @tsv' /tmp/settings-after.json | sort > /tmp/bindings-after.txt
          cat /tmp/bindings-after.txt
          grep -q $'^INTERNAL_API_KEY\tsecret_text$' /tmp/bindings-after.txt
          grep -q $'^VINEXT_KV_CACHE\tkv_namespace$' /tmp/bindings-after.txt
      - name: Certify hardened preview Worker
        shell: bash
        run: |
          set -euo pipefail
          pages=(/ /pokemon /onepiece /yugioh /riftbound /magic /explorer /login /register /forgot-password /privacy /terms /cookies)
          for path in "${pages[@]}"; do
            code=$(curl -L -sS -o /tmp/page -w '%{http_code}' --max-time 35 "$WORKER_URL$path")
            echo "$path status=$code bytes=$(wc -c </tmp/page)"
            test "$code" = "200"
            test -s /tmp/page
          done

          code=$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 30 "$WORKER_URL/api/health")
          test "$code" = "200"
          jq -e '.status=="ok"' /tmp/health >/dev/null

          code=$(curl -sS -o /tmp/me -w '%{http_code}' --max-time 30 "$WORKER_URL/api/auth/me")
          test "$code" = "401"
          jq -e '.error=="authentication_required"' /tmp/me >/dev/null

          for q in Pikachu Luffy P-150 OP05-119 LOB-001; do
            enc=$(node -p "encodeURIComponent(process.argv[1])" "$q")
            code=$(curl -sS -o /tmp/search -w '%{http_code}' --max-time 55 "$WORKER_URL/api/search-v2?q=$enc&limit=20")
            echo "search $q status=$code"
            test "$code" = "200"
          done

          # Probe the exact path that blocked the two historical cutovers.
          fingerprints=''
          for i in $(seq 1 8); do
            url="$WORKER_URL/api/catalog/search?q=Pikachu&type=card&include_counts=0&limit=24&offset=0&cert_probe=$i"
            curl -fsS -D /tmp/catalog.headers --max-time 55 "$url" -o /tmp/catalog.json
            node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const j=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const items=j.items||[];
          if(items.length!==24) throw new Error(`expected 24 Pikachu cards, got ${items.length}`);
          const top=items.slice(0,5).map(x=>String(x.card_id));
          const expected=['1','38645','38658','38670','38681'];
          if(JSON.stringify(top)!==JSON.stringify(expected)) throw new Error(`Pikachu top drift ${JSON.stringify(top)}`);
          const p=items[0];
          if(String(p.card_id)!=='1'||String(p.matched_print_id)!=='571'||p.set_code!=='bs'||String(p.collector_number)!=='58'||p.rarity!=='Common') {
            throw new Error(`Base Pikachu drift ${JSON.stringify(p)}`);
          }
          const bad=new Set(['','-','?','n/a','na','none','null','unknown','undefined']);
          for(const item of items) for(const field of ['set_code','set_name','collector_number','rarity']) {
            const v=item[field];
            if(typeof v==='string'&&bad.has(v.trim().toLowerCase())) throw new Error(`placeholder ${field}=${v} card=${item.card_id}`);
          }
          const canonical=JSON.stringify(items.map(x=>({card_id:x.card_id,matched_print_id:x.matched_print_id,set_code:x.set_code,set_name:x.set_name,collector_number:x.collector_number,rarity:x.rarity})));
          console.log(crypto.createHash('sha256').update(canonical).digest('hex'));
          NODE
            fp=$(node -e "const fs=require('fs'),c=require('crypto'),j=JSON.parse(fs.readFileSync('/tmp/catalog.json')); console.log(c.createHash('sha256').update(JSON.stringify((j.items||[]).map(x=>({card_id:x.card_id,matched_print_id:x.matched_print_id,set_code:x.set_code,set_name:x.set_name,collector_number:x.collector_number,rarity:x.rarity})))).digest('hex'))")
            fingerprints="$fingerprints $fp"
            cache=$(awk -F': ' 'tolower($1)=="cache-control" {print $2}' /tmp/catalog.headers | tr -d '\r' | tail -1)
            echo "catalog_probe=$i fingerprint=$fp cache_control=$cache"
            test "$cache" = "public, s-maxage=15, must-revalidate"
          done
          unique=$(tr ' ' '\n' <<<"$fingerprints" | sed '/^$/d' | sort -u | wc -l)
          echo "catalog_unique_fingerprints=$unique"
          test "$unique" = "1"
          echo 'PREVIEW_HARDENING_GREEN=yes'
