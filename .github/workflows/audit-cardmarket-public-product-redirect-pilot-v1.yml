name: Audit Cardmarket Public Product Redirect Pilot V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_cardmarket_public_product_redirect_pilot_v1.py'
      - '.github/workflows/audit-cardmarket-public-product-redirect-pilot-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      CARDMARKET_PUBLIC_REDIRECT_PILOT_OUTPUT: /tmp/cardmarket-public-product-redirect-pilot-v1.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile redirect pilot
        run: python -m py_compile app/scripts/audit_cardmarket_public_product_redirect_pilot_v1.py
      - name: Resolve six Cardmarket idProducts through the public product endpoint
        run: python -m app.scripts.audit_cardmarket_public_product_redirect_pilot_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-public-product-redirect-pilot-v1-${{ github.run_id }}
          path: /tmp/cardmarket-public-product-redirect-pilot-v1.json
          retention-days: 30
          if-no-files-found: error
