name: Audit Cardmarket Regional Neon Surface V2

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_cardmarket_regional_neon_surface_v2.py'
      - '.github/workflows/audit-cardmarket-regional-neon-surface-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      CARDMARKET_REGIONAL_NEON_SURFACE_OUTPUT: /tmp/cardmarket-regional-neon-surface-v2/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile read-only audit
        run: python -m py_compile app/scripts/audit_cardmarket_regional_neon_surface_v2.py
      - name: Audit current Neon regional surfaces
        run: python -m app.scripts.audit_cardmarket_regional_neon_surface_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-regional-neon-surface-v2-${{ github.run_id }}
          path: /tmp/cardmarket-regional-neon-surface-v2/report.json
          retention-days: 90
          if-no-files-found: warn
