name: Audit Pokemon EN Default TCGdex Source Path V4

on:
  pull_request:
    paths:
      - '.github/workflows/audit-pokemon-en-default-tcgdex-source-path-v4.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      TCGDEX_CARDS_SHA: 771a8381c57c73182b9776657a15cd1166c66d36
      TCGDEX_CARDS_REPO: ${{ github.workspace }}/tcgdex-cards
      OUTPUT: backend/artifacts/pokemon-en-default-tcgdex-source-path-v3.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 771a8381c57c73182b9776657a15cd1166c66d36
          path: tcgdex-cards
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Replay V3 with observed 45-set cross-check frozen - READ ONLY
        env:
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          test "$(git -C "$TCGDEX_CARDS_REPO" rev-parse HEAD)" = "$TCGDEX_CARDS_SHA"
          python - <<'PYRUN'
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/audit-pokemon-en-default-tcgdex-source-path-v3.yml').read_text(encoding='utf-8').splitlines(True)
          start=next(i for i,line in enumerate(workflow) if "python - <<'PY'" in line)
          end=next(i for i in range(start+1,len(workflow)) if workflow[i].strip()=='PY')
          code=textwrap.dedent(''.join(workflow[start+1:end]))
          old="if len(intersections)<50:\n    raise RuntimeError(f'insufficient production/source path cross-checks: {len(intersections)}')"
          new="if len(intersections)!=45:\n    raise RuntimeError(f'production/source path cross-check count drift: expected=45 actual={len(intersections)}')"
          if old not in code:
              raise RuntimeError('V3 gate text not found; refusing modified replay')
          code=code.replace(old,new,1)
          exec(compile(code,'audit-pokemon-en-default-tcgdex-source-path-v4','exec'),{'__name__':'__main__'})
          PYRUN

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokemon-en-default-tcgdex-source-path-v4-${{ github.run_id }}
          path: backend/artifacts/pokemon-en-default-tcgdex-source-path-v3.json
          retention-days: 30
