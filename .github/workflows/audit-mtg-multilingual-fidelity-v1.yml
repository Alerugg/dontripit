name: Audit MTG Multilingual Fidelity V1

on:
  push:
    branches:
      - multilingual-mtg-v1
    paths:
      - 'backend/app/scripts/audit_mtg_multilingual_fidelity_v1.py'
      - '.github/workflows/audit-mtg-multilingual-fidelity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtg-multilingual-fidelity-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile read-only fidelity audit
        run: python -m py_compile app/scripts/audit_mtg_multilingual_fidelity_v1.py

      - name: Audit existing MTG ES/JA source fidelity read-only
        run: |
          python -m app.scripts.audit_mtg_multilingual_fidelity_v1 \
            --output /tmp/mtg-multilingual-existing-fidelity.json

      - name: Enforce read-only and source-match gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/mtg-multilingual-existing-fidelity.json').read_text())
          assert report['status'] == 'pass', report
          assert report['mode'] == 'strict-read-only-existing-mtg-multilingual-fidelity-audit', report
          assert report['database_writes'] == 0, report
          assert report['transaction_read_only'] is True, report
          assert report['existing_prints'] == 2082, report
          assert report['source_matched_existing_prints'] == 2082, report
          counts = report['counts']
          assert counts.get('existing_es', 0) == 1207, report
          assert counts.get('existing_ja', 0) == 875, report
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-multilingual-fidelity-${{ github.run_id }}
          path: /tmp/mtg-multilingual-existing-fidelity.json
          retention-days: 90
          if-no-files-found: warn
