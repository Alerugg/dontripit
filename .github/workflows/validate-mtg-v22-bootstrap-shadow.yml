name: Validate MTG V2.2 Bootstrap Shadow

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/validate-mtg-v22-bootstrap-shadow.yml'
      - 'backend/app/scripts/apply_mtg_v22_snapshot_live.py'
      - 'backend/app/scripts/export_mtg_legacy_backup.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mtg-v22-bootstrap-shadow
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tcg_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tcg_shadow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/tcg_shadow
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/tcg_shadow
      CERTIFIED_ARTIFACT_ID: '9026133384'
      CERTIFIED_ARTIFACT_SHA256: '9680a8f2521e02a1ec070220fd13046d6431ebe7d88e096c83b3b7aad23749d3'

    steps:
      - name: Checkout catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile loader and backup exporter
        working-directory: backend
        run: python -m py_compile app/scripts/apply_mtg_v22_snapshot_live.py app/scripts/export_mtg_legacy_backup.py

      - name: Apply complete schema to disposable PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          test "$(alembic heads | awk '{print $1}')" = "20260808_25"

      - name: Seed exact legacy MTG shape plus non-MTG sentinel
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d tcg_shadow -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO games (slug,name) VALUES ('mtg','Magic: The Gathering'),('shadow-sentinel','Shadow Sentinel');

          INSERT INTO sets (game_id,code,name)
          SELECT g.id, 'legacy-' || n::text, 'Legacy Set ' || n::text
          FROM games g CROSS JOIN generate_series(1,298) n
          WHERE g.slug='mtg';

          INSERT INTO cards (game_id,name,card_key)
          SELECT g.id, 'Legacy Card ' || n::text, 'mtg:legacy:' || n::text
          FROM games g CROSS JOIN generate_series(1,1183) n
          WHERE g.slug='mtg';

          WITH target AS (
            SELECT
              n,
              (SELECT id FROM sets WHERE game_id=(SELECT id FROM games WHERE slug='mtg') ORDER BY id LIMIT 1) AS set_id,
              (SELECT id FROM cards WHERE game_id=(SELECT id FROM games WHERE slug='mtg') ORDER BY id OFFSET ((n-1) % 1183) LIMIT 1) AS card_id
            FROM generate_series(1,1588) n
          )
          INSERT INTO prints (set_id,card_id,collector_number,language,rarity,is_foil,variant,print_key)
          SELECT set_id,card_id,n::text,'en','legacy',false,'legacy','mtg:legacy-print:' || n::text
          FROM target;

          INSERT INTO print_images (print_id,url,is_primary,source)
          SELECT p.id, 'https://example.invalid/' || p.id::text || '.jpg', true, 'legacy'
          FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=(SELECT id FROM games WHERE slug='mtg');

          INSERT INTO print_identifiers (print_id,source,external_id)
          SELECT p.id, 'legacy', 'legacy-' || p.id::text
          FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=(SELECT id FROM games WHERE slug='mtg');

          INSERT INTO field_provenance (entity_type,entity_id,field_name,source,value_text)
          SELECT 'print',p.id,'legacy_field','legacy','legacy'
          FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=(SELECT id FROM games WHERE slug='mtg')
          LIMIT 100;

          INSERT INTO search_documents (doc_type,object_id,game_id,title)
          SELECT 'card',c.id,c.game_id,c.name
          FROM cards c WHERE c.game_id=(SELECT id FROM games WHERE slug='mtg')
          LIMIT 100;

          INSERT INTO sets (game_id,code,name)
          SELECT id,'sentinel-set','Sentinel Set' FROM games WHERE slug='shadow-sentinel';
          INSERT INTO cards (game_id,name,card_key)
          SELECT id,'Sentinel Card','sentinel:card:1' FROM games WHERE slug='shadow-sentinel';
          INSERT INTO prints (set_id,card_id,collector_number,language,rarity,is_foil,variant,print_key)
          SELECT s.id,c.id,'1','en','rare',false,'default','sentinel:print:1'
          FROM sets s JOIN cards c ON c.game_id=s.game_id
          JOIN games g ON g.id=s.game_id WHERE g.slug='shadow-sentinel';

          DO $check$
          DECLARE
            mtg_id integer := (SELECT id FROM games WHERE slug='mtg');
          BEGIN
            IF (SELECT COUNT(*) FROM sets WHERE game_id=mtg_id) <> 298 THEN RAISE EXCEPTION 'legacy set seed mismatch'; END IF;
            IF (SELECT COUNT(*) FROM cards WHERE game_id=mtg_id) <> 1183 THEN RAISE EXCEPTION 'legacy card seed mismatch'; END IF;
            IF (SELECT COUNT(*) FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=mtg_id) <> 1588 THEN RAISE EXCEPTION 'legacy print seed mismatch'; END IF;
          END
          $check$;
          SQL

      - name: Download exact certified snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mtg-certified /tmp/mtg-certified.zip
          mkdir -p /tmp/mtg-certified
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CERTIFIED_ARTIFACT_ID}/zip" \
            -o /tmp/mtg-certified.zip
          echo "${CERTIFIED_ARTIFACT_SHA256}  /tmp/mtg-certified.zip" | sha256sum -c -
          unzip -q /tmp/mtg-certified.zip -d /tmp/mtg-certified
          manifest=$(find /tmp/mtg-certified -name manifest.json -type f -print -quit)
          test -n "$manifest"
          dirname "$manifest" > /tmp/mtg-snapshot-dir.txt
          cat /tmp/mtg-snapshot-dir.txt

      - name: Export disposable legacy recovery backup
        working-directory: backend
        run: python -u -m app.scripts.export_mtg_legacy_backup --output-dir /tmp/mtg-shadow-legacy-backup

      - name: Run exact transactional bootstrap in shadow database
        working-directory: backend
        run: |
          snapshot_dir=$(cat /tmp/mtg-snapshot-dir.txt)
          python -u -m app.scripts.apply_mtg_v22_snapshot_live \
            --snapshot-dir "$snapshot_dir" \
            --output /tmp/mtg-shadow-apply-report.json

      - name: Verify sentinel and final shadow state
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d tcg_shadow -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          DECLARE
            mtg_id integer := (SELECT id FROM games WHERE slug='mtg');
            sentinel_id integer := (SELECT id FROM games WHERE slug='shadow-sentinel');
          BEGIN
            IF (SELECT COUNT(*) FROM sets WHERE game_id=mtg_id) <> 986 THEN RAISE EXCEPTION 'final MTG sets mismatch'; END IF;
            IF (SELECT COUNT(*) FROM cards WHERE game_id=mtg_id) <> 37624 THEN RAISE EXCEPTION 'final MTG cards mismatch'; END IF;
            IF (SELECT COUNT(*) FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=mtg_id) <> 161275 THEN RAISE EXCEPTION 'final MTG prints mismatch'; END IF;
            IF (SELECT COUNT(*) FROM sets WHERE game_id=sentinel_id) <> 1 THEN RAISE EXCEPTION 'sentinel sets changed'; END IF;
            IF (SELECT COUNT(*) FROM cards WHERE game_id=sentinel_id) <> 1 THEN RAISE EXCEPTION 'sentinel cards changed'; END IF;
            IF (SELECT COUNT(*) FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=sentinel_id) <> 1 THEN RAISE EXCEPTION 'sentinel prints changed'; END IF;
          END
          $check$;
          SQL

      - name: Upload shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-v22-bootstrap-shadow-${{ github.sha }}
          path: |
            /tmp/mtg-shadow-apply-report.json
            /tmp/mtg-shadow-legacy-backup
          retention-days: 30
          if-no-files-found: warn
