name: Audit Sealed Production State V1

on:
  push:
    branches:
      - audit/sealed-production-state-v1
    paths:
      - '.github/workflows/audit-sealed-production-state-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg2-binary==2.9.9'
      - name: Read production exact sealed proxy state
        run: |
          python - <<'PY'
          import json, os, psycopg2
          from pathlib import Path
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL']
          conn=psycopg2.connect(url, connect_timeout=30, application_name='dontripit_sealed_proxy_readonly_audit')
          conn.set_session(readonly=True, autocommit=False)
          out={}
          try:
            with conn.cursor() as cur:
              cur.execute("""
                SELECT count(*) AS rows,
                       count(DISTINCT product_variant_id) AS variants,
                       count(DISTINCT url) AS urls,
                       count(*) FILTER (WHERE is_primary IS NOT TRUE) AS non_primary,
                       count(*) FILTER (
                         WHERE url <> 'https://api.dontripit.com/media/product-variants/' || product_variant_id::text || '/cardmarket-image'
                       ) AS bad_proxy_urls
                FROM product_images
                WHERE source='cardmarket_exact_proxy_v1'
              """)
              row=cur.fetchone()
              out.update({
                'rows':int(row[0]),'variants':int(row[1]),'urls':int(row[2]),
                'non_primary':int(row[3]),'bad_proxy_urls':int(row[4]),
              })
              cur.execute("""
                SELECT product_variant_id,count(*) n
                FROM product_images
                WHERE source='cardmarket_exact_proxy_v1'
                GROUP BY product_variant_id HAVING count(*)<>1
                ORDER BY product_variant_id LIMIT 25
              """)
              out['duplicate_variant_rows']=[{'variant_id':int(r[0]),'count':int(r[1])} for r in cur.fetchall()]
              cur.execute("""
                SELECT count(*)
                FROM product_images pi
                JOIN product_variants pv ON pv.id=pi.product_variant_id
                JOIN products p ON p.id=pv.product_id
                JOIN games g ON g.id=p.game_id
                WHERE pi.source='cardmarket_exact_proxy_v1'
                  AND g.slug NOT IN ('mtg','pokemon','yugioh','onepiece')
              """)
              out['unexpected_game_rows']=int(cur.fetchone()[0])
              cur.execute("""
                SELECT g.slug,count(*)
                FROM product_images pi
                JOIN product_variants pv ON pv.id=pi.product_variant_id
                JOIN products p ON p.id=pv.product_id
                JOIN games g ON g.id=p.game_id
                WHERE pi.source='cardmarket_exact_proxy_v1'
                GROUP BY g.slug ORDER BY g.slug
              """)
              out['by_game']={str(r[0]):int(r[1]) for r in cur.fetchall()}
              conn.rollback()
          finally:
            conn.close()
          out['gate']='PASS' if (
            out['rows']==out['variants']==out['urls']
            and out['non_primary']==0
            and out['bad_proxy_urls']==0
            and not out['duplicate_variant_rows']
            and out['unexpected_game_rows']==0
          ) else 'FAIL'
          Path('/tmp/sealed-production-state.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if out['gate']!='PASS': raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-production-state-${{ github.run_id }}
          path: /tmp/sealed-production-state.json
          retention-days: 30
