name: Audit Search Performance Neon Temporary

on:
  push:
    branches:
      - perf/search-hot-path-v1
    paths:
      - '.github/workflows/audit-search-performance-neon-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Read-only search index audit
        id: audit
        working-directory: backend
        run: |
          python - <<'PY'
          import json, os
          from sqlalchemy import create_engine, text

          url = os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not url:
              raise RuntimeError('DATABASE_URL_UNPOOLED or DATABASE_URL is required')
          engine = create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              extensions = [r[0] for r in conn.execute(text("SELECT extname FROM pg_extension ORDER BY extname"))]
              indexes = [dict(r) for r in conn.execute(text("""
                  SELECT tablename, indexname, indexdef
                  FROM pg_indexes
                  WHERE schemaname = current_schema()
                    AND tablename IN ('card_search_profiles','cards','prints','print_images','search_documents')
                  ORDER BY tablename, indexname
              """)).mappings()]
              counts = dict(conn.execute(text("""
                  SELECT
                    (SELECT COUNT(*) FROM cards) AS cards,
                    (SELECT COUNT(*) FROM prints) AS prints,
                    (SELECT COUNT(*) FROM card_search_profiles) AS card_search_profiles,
                    (SELECT COUNT(*) FROM search_documents) AS search_documents
              """)).mappings().one())
              plans = {}
              for q in ('luffy', 'pikachu', 'dark magician'):
                  plan = conn.execute(text("""
                      EXPLAIN (FORMAT JSON, COSTS TRUE)
                      SELECT csp.card_id
                      FROM card_search_profiles csp
                      WHERE csp.normalized_name LIKE :contains
                      LIMIT 24
                  """), {'contains': f'%{q}%'}).scalar_one()
                  plans[q] = plan

          payload = {
              'extensions': extensions,
              'has_pg_trgm': 'pg_trgm' in extensions,
              'indexes': indexes,
              'counts': counts,
              'plans': plans,
          }
          os.makedirs('/tmp/search-perf-audit', exist_ok=True)
          with open('/tmp/search-perf-audit/report.json', 'w') as f:
              json.dump(payload, f, indent=2, default=str)
          print(json.dumps(payload, indent=2, default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-performance-neon-${{ github.run_id }}
          path: /tmp/search-perf-audit/report.json
          if-no-files-found: error
      - name: Publish audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          ok = os.environ.get('AUDIT_OUTCOME') == 'success'
          print(json.dumps({
              'state': 'success' if ok else 'failure',
              'context': 'search-neon-index-audit',
              'description': f"read-only production index audit={os.environ.get('AUDIT_OUTCOME')}"[:140],
          }))
          PY
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/status.json
