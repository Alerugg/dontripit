name: Test Search V2 output contract

on:
  push:
    branches:
      - fix/search-v2-card-metadata-contract

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run Search V2 metadata contract tests
        working-directory: backend
        run: pytest -q tests/test_search_v2_output_contract.py tests/test_search_v2_api.py tests/test_search_v2_exact_identifier.py
