name: RETIRED - One Piece Cardmarket Trusted Expansion Bridge

# RETIRED 2026-08-11.
# This mapper inferred Cardmarket expansion -> Bandai release from all previously
# accepted single links. Because legacy accepted links included secondary
# crosswalk mappings that were not release-validated, this created circular
# trust and could propagate a wrong reprint identity. It is intentionally
# non-writing. Use the sealed-derived physical release gate instead.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "RETIRED: expansion trust must originate from independent physical release evidence, not accepted singles."
          exit 1
