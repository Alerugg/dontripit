name: Audit YGO Cardmarket 43 Contradictions

on:
  workflow_dispatch:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-yugioh-cardmarket-43-contradictions.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Summarize conflicting expansions and official products
        run: |
          python - <<'PY'
          import json,os,re,unicodedata
          from collections import defaultdict,Counter
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor
          A=('accepted','mapped','exact'); TARGET={'1488','1517','2429','2844','1677','1657','1712','1078'}
          def norm(v):
            s=unicodedata.normalize('NFKD',str(v or '')).casefold();s=''.join(c for c in s if not unicodedata.combining(c)).replace('&',' and ')
            return re.sub(r'\s+',' ',re.sub(r'[^a-z0-9]+',' ',s)).strip()
          SUFFIXES=(' booster box case',' booster case',' booster display',' booster box',' display',' booster',' structure deck',' starter deck',' speed duel box',' speed duel starter deck',' special edition',' tin',' mega tin',' box',' case')
          PREFIXES=('yugioh ','yu gi oh ')
          def bases(name):
            raw=norm(name);out={raw};changed=True
            while changed:
              changed=False
              for p in PREFIXES:
                if raw.startswith(p) and len(raw)>len(p):raw=raw[len(p):].strip();out.add(raw);changed=True
              for s in SUFFIXES:
                if raw.endswith(s) and len(raw)>len(s):raw=raw[:-len(s)].strip();out.add(raw);changed=True
            return {x for x in out if x}
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='yugioh'");gid=int(cur.fetchone()['id'])
              cur.execute("SELECT id,external_id,name,release_date FROM catalog_releases WHERE game_id=%s AND source='konami_neuron'",(gid,))
              releases=[dict(r) for r in cur.fetchall()];relmeta={int(r['id']):r for r in releases};byname=defaultdict(list)
              for r in releases:byname[norm(r['name'])].append(r)
              cur.execute("SELECT print_id,release_id FROM print_releases pr JOIN catalog_releases cr ON cr.id=pr.release_id WHERE cr.game_id=%s AND cr.source='konami_neuron'",(gid,))
              memberships=defaultdict(set)
              for r in cur.fetchall():memberships[int(r['print_id'])].add(int(r['release_id']))
              cur.execute("SELECT max(last_seen_at) seen FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s",(gid,));latest=cur.fetchone()['seen']
              cur.execute("SELECT external_id,expansion_external_id,name,category,website_path FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s AND product_group='non_single' AND last_seen_at=%s AND expansion_external_id=ANY(%s)",(gid,latest,list(TARGET)))
              sealed=defaultdict(list)
              for r in cur.fetchall():sealed[str(r['expansion_external_id'])].append(dict(r))
              cur.execute("""SELECT l.print_id,e.external_id id_product,e.expansion_external_id,e.name market_name,e.metacard_external_id,p.collector_number,p.rarity,p.variant,p.language,c.name card_name,s.code set_code
                FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                JOIN prints p ON p.id=l.print_id JOIN cards c ON c.id=p.card_id JOIN sets s ON s.id=p.set_id
                WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)
                  AND l.mapping_method='sealed_expansion_exact_name' AND e.expansion_external_id=ANY(%s) ORDER BY e.expansion_external_id,p.collector_number,e.external_id""",(gid,list(A),list(TARGET)))
              rows=defaultdict(list)
              for r in cur.fetchall():rows[str(r['expansion_external_id'])].append(dict(r))
              for exp in sorted(TARGET,key=int):
                votes=defaultdict(list)
                for item in sealed.get(exp,[]):
                  for b in bases(item['name']):
                    m=byname.get(b,[])
                    if len(m)==1:votes[int(m[0]['id'])].append({'idProduct':str(item['external_id']),'name':item['name'],'category':item['category'],'website_path':item['website_path'],'base':b})
                anchor_rid=next(iter(votes)) if len(votes)==1 else None
                categorized=[];counts=Counter()
                for r in rows.get(exp,[]):
                  official=memberships.get(int(r['print_id']),set())
                  if not official:status='no_official_membership'
                  elif anchor_rid in official:status='matches_anchor'
                  else:status='contradicts_anchor'
                  counts[status]+=1
                  if status=='contradicts_anchor':
                    categorized.append({**r,'official_releases':[{'release_id':rid,'pid':str(relmeta[rid]['external_id']),'name':relmeta[rid]['name'],'release_date':str(relmeta[rid]['release_date'])} for rid in sorted(official) if rid in relmeta]})
                out[exp]={'anchor':({'release_id':anchor_rid,'pid':str(relmeta[anchor_rid]['external_id']),'name':relmeta[anchor_rid]['name'],'release_date':str(relmeta[anchor_rid]['release_date']),'sealed_evidence':votes[anchor_rid]} if anchor_rid else None),'anchor_vote_count':len(votes),'sealed_products':sealed.get(exp,[]),'accepted_old_links':len(rows.get(exp,[])),'status_counts':dict(counts),'contradictions':categorized}
          finally:conn.close()
          Path('/tmp/ygo-43-contradictions.json').write_text(json.dumps(out,indent=2,default=str,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,default=str,sort_keys=True))
          PY
      - name: Persist
        run: |
          mkdir -p audit-reports
          cp /tmp/ygo-43-contradictions.json audit-reports/yugioh-cardmarket-43-contradictions.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/yugioh-cardmarket-43-contradictions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record YGO Cardmarket contradiction details'
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-cardmarket-43-contradictions-${{ github.run_id }}
          path: /tmp/ygo-43-contradictions.json
          retention-days: 90
