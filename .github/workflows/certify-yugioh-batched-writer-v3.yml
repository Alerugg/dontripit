name: Certify Yu-Gi-Oh Batched Writer V3

on:
  pull_request:
    branches:
      - main
    paths:
      - backend/app/scripts/rollout_yugioh_multilingual_production_v3.py
      - .github/workflows/certify-yugioh-batched-writer-v3.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: certify-yugioh-batched-writer-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
  EPHEMERAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_ygo_batch_v3
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dontripit_ygo_batch_v3
  YUGIOH_PRODUCTION_ROLLOUT_ACK: YGO_ES_JA_ROLLOUT_V1
  PREFLIGHT_RUN_ID: '32084050029'
  SOURCE_RUN_ID: '31915462442'
  PYTHONPATH: .

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dontripit_ygo_batch_v3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dontripit_ygo_batch_v3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'
      - name: Compile V3
        run: python -m py_compile app/scripts/rollout_yugioh_multilingual_production_v3.py
      - name: Build production pre-migration schema locally
        run: alembic upgrade 20260814_34
      - name: Clone Yu-Gi-Oh from production READ ONLY
        run: python -m app.scripts.seed_yugioh_production_shape_v1
      - name: Apply certified schema locally
        run: alembic upgrade 20260815_36
      - name: Verify migration and install local guards
        run: python -m app.scripts.prepare_yugioh_multilingual_ephemeral_v1
      - name: Download pinned certification evidence and fresh source
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/preflight/raw evidence/preflight evidence/fresh/raw "$RUNNER_TEMP/ygojson-fresh/extracted" "$RUNNER_TEMP/yaml-yugi"
          test "$(gh run view "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status+":"+.conclusion')" = 'completed:success'
          gh run download "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "yugioh-multilingual-rollout-preflight-v1-${PREFLIGHT_RUN_ID}" \
            --dir evidence/preflight/raw
          for name in yugioh-multilingual-rollout-preflight-fresh.json yugioh-multilingual-rollout-readiness-v1.json yugioh-yaml-yugi-cards-sha256-preflight.txt yugioh-yaml-yugi-source-meta-preflight.json; do
            src="$(find evidence/preflight/raw -type f -name "$name" -print -quit)"
            test -n "$src" && test -s "$src"
            cp "$src" "evidence/preflight/$name"
          done
          test "$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status+":"+.conclusion')" = 'completed:success'
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ygojson-shadow-full-refresh-v1-${SOURCE_RUN_ID}" \
            --dir evidence/fresh/raw
          aggregate="$(find evidence/fresh/raw -type f -name 'ygojson-shadow-fresh-aggregate-v1.zip' -print -quit)"
          test -n "$aggregate" && test -s "$aggregate"
          unzip -q "$aggregate" -d "$RUNNER_TEMP/ygojson-fresh/extracted"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/yaml-yugi/cards.json" \
            https://dawnbrandbots.github.io/yaml-yugi/cards.json
          actual="$(sha256sum "$RUNNER_TEMP/yaml-yugi/cards.json" | awk '{print $1}')"
          expected="$(awk '{print $1}' evidence/preflight/yugioh-yaml-yugi-cards-sha256-preflight.txt)"
          test "$actual" = "$expected"
          cp evidence/preflight/yugioh-yaml-yugi-source-meta-preflight.json "$RUNNER_TEMP/yaml-yugi/source-meta.json"
      - name: Dry-run V3 against local production-shaped clone
        env:
          DATABASE_URL_UNPOOLED: ''
        run: |
          python -m app.scripts.rollout_yugioh_multilingual_production_v3 \
            --input-dir "$RUNNER_TEMP/ygojson-fresh/extracted" \
            --yaml-yugi-cards "$RUNNER_TEMP/yaml-yugi/cards.json" \
            --yaml-yugi-meta "$RUNNER_TEMP/yaml-yugi/source-meta.json" \
            --fresh-certificate ../evidence/preflight/yugioh-multilingual-rollout-preflight-fresh.json \
            --readiness ../evidence/preflight/yugioh-multilingual-rollout-readiness-v1.json \
            --output ../evidence/yugioh-batched-v3-dry-run.json
      - name: Apply V3 atomically to local clone
        env:
          DATABASE_URL_UNPOOLED: ''
        run: |
          python -m app.scripts.rollout_yugioh_multilingual_production_v3 \
            --input-dir "$RUNNER_TEMP/ygojson-fresh/extracted" \
            --yaml-yugi-cards "$RUNNER_TEMP/yaml-yugi/cards.json" \
            --yaml-yugi-meta "$RUNNER_TEMP/yaml-yugi/source-meta.json" \
            --fresh-certificate ../evidence/preflight/yugioh-multilingual-rollout-preflight-fresh.json \
            --readiness ../evidence/preflight/yugioh-multilingual-rollout-readiness-v1.json \
            --output ../evidence/yugioh-batched-v3-apply.json \
            --apply
      - name: Enforce batched V3 certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../evidence/yugioh-batched-v3-apply.json').read_text())
          assert r['status']=='pass', r
          assert r['runner_version']==3, r
          assert r['writer_mode']=='batched-v3', r
          assert r['commit_confirmed'] is True, r
          assert r['pass1']['writer']=='batched-v3', r
          assert r['pass2']['writer']=='batched-v3', r
          assert r['pass2']['total_writes']==0, r
          assert r['pass2_zero_writes'] is True, r
          assert r['validation']['status']=='pass' and all(r['validation']['gates'].values()), r
          assert r['invariants']['status']=='pass', r
          assert r['logical_cards_created']==0, r
          assert r['economics_untouched'] is True, r
          expected={'prints':74675,'print_localizations':74675,'print_images':48662,'print_releases':76445}
          for key,value in expected.items():
              assert r['pass1']['writes'].get(key)==value, (key,r['pass1'])
          PY
      - name: Upload V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-batched-writer-v3-${{ github.run_id }}
          path: |
            evidence/yugioh-batched-v3-dry-run.json
            evidence/yugioh-batched-v3-apply.json
          retention-days: 30
          if-no-files-found: warn
