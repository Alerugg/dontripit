name: Project Yu-Gi-Oh OCG DOCS Super Secret Exact Prices V1

on:
  pull_request:
    paths:
      - '.github/workflows/project-yugioh-ocg-docs-super-secret-prices-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/project-yugioh-ocg-docs-super-secret-prices-v1.yml'

permissions:
  contents: read

concurrency:
  group: project-yugioh-ocg-docs-super-secret-prices-v1
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile installed DOCS writer and exact-idProduct projector
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_docs_super_secret_v1.py
          python -m py_compile scripts/project_cardmarket_link_prices.py
      - name: READ ONLY prove final DOCS identity is complete before pricing
        run: |
          mkdir -p /tmp/ygo-ocg-docs-super-secret-price-projection
          python -m app.scripts.apply_yugioh_ocg_docs_super_secret_v1 --report /tmp/ygo-ocg-docs-super-secret-price-projection/identity-before.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-docs-super-secret-price-projection/identity-before.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['certified_pairs']==20,p
          assert p['already_accepted_same_pair']==20,p
          assert p['new_links_ready']==0,p
          assert p['regional_accepted_before_or_after']==108,p
          print(json.dumps({'identity':'complete','method_links':20,'DOCS_accepted':108},indent=2))
          PY
      - name: Project current Yu-Gi-Oh prices from accepted exact Cardmarket idProducts
        if: github.event_name == 'push'
        run: |
          python scripts/project_cardmarket_link_prices.py --game yugioh --apply --report /tmp/ygo-ocg-docs-super-secret-price-projection/projection.json
      - name: READ ONLY prove DOCS identity remained unchanged
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_docs_super_secret_v1 --report /tmp/ygo-ocg-docs-super-secret-price-projection/identity-after.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-docs-super-secret-price-projection/identity-after.json'))
          assert p['production_writes']==0,p
          assert p['already_accepted_same_pair']==20,p
          assert p['new_links_ready']==0,p
          assert p['regional_accepted_before_or_after']==108,p
          print(json.dumps({'identity_after_projection':'unchanged','method_links':20,'DOCS_accepted':108},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-docs-super-secret-exact-price-projection-${{ github.run_id }}
          path: /tmp/ygo-ocg-docs-super-secret-price-projection/*.json
          retention-days: 90
          if-no-files-found: warn
