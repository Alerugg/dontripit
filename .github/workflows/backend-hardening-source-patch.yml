name: Backend Hardening Source Patch

on:
  push:
    branches:
      - backend/perfection-hardening-20260911
    paths:
      - '.github/triggers/backend-hardening-source-patch'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend/perfection-hardening-20260911
          fetch-depth: 0
      - name: Apply exact fail-closed source patches
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          def d(value):
              return base64.b64decode(value).decode()
          anchor=d('ICAgICAgICBpbWFnZXNfYnlfcHJpbnRfc291cmNlX2tleSA9IHsKICAgICAgICAgICAgaW1nLnByaW50X3NvdXJjZV9rZXk6IGltZyBmb3IgaW1nIGluIG5vcm1hbGl6ZWQubm9ybWFsaXplZF9pbWFnZXMgaWYgaW1nLmlzX3ByaW1hcnkKICAgICAgICB9CiAgICAgICAgbm9ybWFsaXplZF9wcmludHNfYnlfeWdvX2lkOiBkaWN0W3N0ciwgb2JqZWN0XSA9IHt9Cg==')
          replacement=d('')
          old=d('')
          new=d('')
          old_model=d('Y2xhc3MgUHJpbnRJZGVudGlmaWVyKEJhc2UpOgogICAgX190YWJsZW5hbWVfXyA9ICJwcmludF9pZGVudGlmaWVycyIKICAgIF9fdGFibGVfYXJnc19fID0gKFVuaXF1ZUNvbnN0cmFpbnQoInByaW50X2lkIiwgInNvdXJjZSIsIG5hbWU9InVxX2lkZW50aWZpZXJfc291cmNlIiksKQo=')
          new_model=d('')
          ygo_path=Path('backend/app/ingest/connectors/ygoprodeck_yugioh.py')
          ygo=ygo_path.read_text()
          if ygo.count(anchor)!=1 or ygo.count(old)!=1:
              raise SystemExit(f'YGO anchors changed: map={ygo.count(anchor)} block={ygo.count(old)}')
          ygo_path.write_text(ygo.replace(anchor,replacement,1).replace(old,new,1))
          model_path=Path('backend/app/models.py')
          models=model_path.read_text()
          if models.count(old_model)!=1:
              raise SystemExit(f'PrintIdentifier anchor changed: {models.count(old_model)}')
          model_path.write_text(models.replace(old_model,new_model,1))
          PY
      - name: Compile patched modules
        run: python -m py_compile backend/app/models.py backend/app/ingest/connectors/ygoprodeck_yugioh.py
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/models.py backend/app/ingest/connectors/ygoprodeck_yugioh.py
          git diff --cached --check
          git commit -m "fix(ingest): make YGO primary images transaction-idempotent"
          git push origin HEAD:backend/perfection-hardening-20260911
