name: Audit OP15 Special All Products

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-op15-special-all-products.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests psycopg2-binary==2.9.9
      - name: Enumerate source variants, Cardmarket products and existing canonical links
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import quote
          import psycopg2,requests
          from psycopg2.extras import RealDictCursor

          collectors=['OP15-036','OP15-075','OP15-108']
          http=requests.Session(); http.headers.update({'User-Agent':'DontRipIt/1.0 exact-variant-auditor'})
          feed=http.get('https://one-piece.cards/api/cards',params={'set':'OP15-EB04','limit':500},timeout=25); feed.raise_for_status()
          cards=feed.json().get('cards',[])
          cm_re=re.compile(r'https://www\.cardmarket\.com/OnePiece/Products\?idProduct=(\d+)',re.I)
          source={collector:[] for collector in collectors}
          for c in cards:
            collector=str(c.get('card_id') or '').upper().removesuffix('.JPG')
            if collector not in source or str(c.get('lang') or '').lower()!='en': continue
            sid=str(c.get('id') or '').removesuffix('.jpg')
            detail_url=f'https://one-piece.cards/cards/{quote(sid,safe="")}'
            try:
              r=http.get(detail_url,timeout=20)
              ids=sorted(set(cm_re.findall(r.text))) if r.status_code==200 else []
            except Exception as exc:
              r=None; ids=[]
            source[collector].append({
              'id':sid,'variant_id':str(c.get('variant_id') or '').removesuffix('.jpg'),'variant_label':c.get('variant'),
              'rarity':c.get('rarity'),'set':c.get('set'),'set_name':c.get('set_name'),'name':c.get('name'),
              'detail_url':detail_url,'detail_status':getattr(r,'status_code',None),'explicit_cm_ids':ids,
              'raw':c,
            })

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with conn,conn.cursor(cursor_factory=RealDictCursor) as cur:
            cur.execute("SELECT id FROM games WHERE slug='onepiece'"); gid=int(cur.fetchone()['id'])
            cur.execute("SELECT id FROM sets WHERE game_id=%s AND lower(code)='op-15'",(gid,)); set_id=int(cur.fetchone()['id'])
            cur.execute("SELECT max(last_seen_at) latest FROM external_catalog_products WHERE source='cardmarket'"); latest=cur.fetchone()['latest']
            db={}
            for collector in collectors:
              cur.execute('''SELECT p.id print_id,p.variant,p.rarity,p.language,p.print_key,c.name card_name,
                EXISTS(SELECT 1 FROM print_releases pr WHERE pr.print_id=p.id AND pr.release_id=66) in_release_66
                FROM prints p JOIN cards c ON c.id=p.card_id WHERE p.set_id=%s AND upper(p.collector_number)=%s ORDER BY p.id''',(set_id,collector))
              prints=[dict(r) for r in cur.fetchall()]
              cur.execute('''SELECT e.id external_product_id,e.external_id,e.name,e.expansion_external_id,e.website_path,e.last_seen_at,
                (SELECT json_build_object('price_variant',mp.price_variant,'low',mp.price_low,'mid',mp.price_mid,'market',mp.price_market,'last',mp.price_last,'avg1',mp.avg1,'avg7',mp.avg7,'avg30',mp.avg30,'as_of',mp.as_of)
                 FROM external_market_price_snapshots mp WHERE mp.external_product_id=e.id AND mp.currency='EUR' ORDER BY mp.as_of DESC,mp.id DESC LIMIT 1) latest_price
                FROM external_catalog_products e WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND e.last_seen_at=%s AND e.name ILIKE %s ORDER BY e.external_id''',(gid,latest,f'%({collector})'))
              products=[dict(r) for r in cur.fetchall()]
              cur.execute('''SELECT l.external_product_id,l.print_id,l.mapping_method,l.confidence,l.link_status,l.evidence
                FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                WHERE e.source='cardmarket' AND e.game_id=%s AND l.link_status IN ('accepted','mapped','exact') AND (l.print_id=ANY(%s) OR l.external_product_id=ANY(%s))
                ORDER BY l.print_id,l.external_product_id''',(gid,[int(p['print_id']) for p in prints],[int(p['external_product_id']) for p in products]))
              links=[dict(r) for r in cur.fetchall()]
              db[collector]={'prints':prints,'products':products,'links':links}
          conn.close()
          report={'source':source,'db':db}
          print(json.dumps(report,indent=2,ensure_ascii=False,default=str))
          Path('/tmp/op15-special-all-products.json').write_text(json.dumps(report,indent=2,ensure_ascii=False,default=str)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op15-special-all-products-${{ github.run_id }}
          path: /tmp/op15-special-all-products.json
          retention-days: 90
