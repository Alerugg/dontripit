name: Audit YGO Physical Identity Corroboration V2

on:
  push:
    branches: [p0/physical-identity-ingest-v2]
    paths:
      - 'backend/scripts/audit_yugioh_physical_identity_corroboration_v2.py'
      - '.github/workflows/audit-ygo-physical-identity-corroboration-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}/backend

jobs:
  corroborate-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PGOPTIONS: -c default_transaction_read_only=on
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/physical-identity-ingest-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Compile YGO corroboration audit
        run: python -m py_compile scripts/audit_yugioh_physical_identity_corroboration_v2.py
        working-directory: backend

      # The source run has >100 artifacts. actions/download-artifact's pattern lookup
      # only returns the first artifacts page, which omitted YGO shards 0-5. Fetch
      # those six exact names explicitly, then fetch the visible 6-23 set by pattern.
      - name: Download YGO shard 0
        uses: actions/download-artifact@v4
        with:
          name: identity-v2-shard-yugioh-0-34169156875
          path: /tmp/ygo-shards/identity-v2-shard-yugioh-0-34169156875
          github-token: ${{ github.token }}
          repository: Alerugg/dontripit
          run-id: 34169156875

      - name: Download YGO shard 1
        uses: actions/download-artifact@v4
        with:
          name: identity-v2-shard-yugioh-1-34169156875
          path: /tmp/ygo-shards/identity-v2-shard-yugioh-1-34169156875
          github-token: ${{ github.token }}
          repository: Alerugg/dontripit
          run-id: 34169156875

      - name: Download YGO shard 2
        uses: actions/download-artifact@v4
        with:
          name: identity-v2-shard-yugioh-2-34169156875
          path: /tmp/ygo-shards/identity-v2-shard-yugioh-2-34169156875
          github-token: ${{ github.token }}
          repository: Alerugg/dontripit
          run-id: 34169156875

      - name: Download YGO shard 3
        uses: actions/download-artifact@v4
        with:
          name: identity-v2-shard-yugioh-3-34169156875
          path: /tmp/ygo-shards/identity-v2-shard-yugioh-3-34169156875
          github-token: ${{ github.token }}
          repository: Alerugg/dontripit
          run-id: 34169156875

      - name: Download YGO shard 4
        uses: actions/download-artifact@v4
        with:
          name: identity-v2-shard-yugioh-4-34169156875
          path: /tmp/ygo-shards/identity-v2-shard-yugioh-4-34169156875
          github-token: ${{ github.token }}
          repository: Alerugg/dontripit
          run-id: 34169156875

      - name: Download YGO shard 5
        uses: actions/download-artifact@v4
        with:
          name: identity-v2-shard-yugioh-5-34169156875
          path: /tmp/ygo-shards/identity-v2-shard-yugioh-5-34169156875
          github-token: ${{ github.token }}
          repository: Alerugg/dontripit
          run-id: 34169156875

      - name: Download YGO shards 6-23 from visible artifact page
        uses: actions/download-artifact@v4
        with:
          pattern: identity-v2-shard-yugioh-*-34169156875
          path: /tmp/ygo-shards
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: Alerugg/dontripit
          run-id: 34169156875

      - name: Assert complete 24-shard YGO evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/ygo-shards')
          files = sorted(root.rglob('descriptors.ndjson'))
          print('descriptor_files', len(files))
          for path in files:
              print(path)
          assert len(files) == 24, f'expected 24 YGO descriptor shards, found {len(files)}'

          expected = {
              f'identity-v2-shard-yugioh-{i}-34169156875'
              for i in range(24)
          }
          found = {
              path.parent.name
              for path in files
          }
          missing = sorted(expected - found)
          assert not missing, f'missing YGO shards: {missing}'
          PY

      - name: Download current official Cardmarket YGO universe
        run: |
          mkdir -p artifacts/ygo-physical-v2-inputs
          python - <<'PY'
          from pathlib import Path
          from urllib import request
          import json, time

          url = 'https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_3.json'
          path = Path('artifacts/ygo-physical-v2-inputs/products_singles_3.json')
          headers = {'User-Agent': 'DontRipIt-PhysicalIdentityV2/1.0 (+read-only YGO corroboration)'}
          for attempt in range(1, 4):
              try:
                  req = request.Request(url, headers=headers)
                  with request.urlopen(req, timeout=90) as response:
                      content = response.read()
                  json.loads(content.decode('utf-8-sig'))
                  path.write_bytes(content)
                  print('downloaded', len(content))
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(attempt * 2)
          PY
        working-directory: backend

      - name: Corroborate accepted exact YGO products against physical descriptors
        run: |
          python scripts/audit_yugioh_physical_identity_corroboration_v2.py \
            --shards-root /tmp/ygo-shards \
            --catalog artifacts/ygo-physical-v2-inputs/products_singles_3.json \
            --outdir artifacts/yugioh-physical-identity-corroboration-v2
        working-directory: backend

      - name: Assert read-only safety and useful corroboration result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/yugioh-physical-identity-corroboration-v2/summary.json')
          if p.exists():
              s = json.loads(p.read_text())
              assert s['mode'] == 'READ_ONLY'
              assert s['transaction_read_only'] is True
              assert s['production_writes'] == 0
              assert s['yugioh_shadow_descriptor_files'] == 24
              assert s['yugioh_shadow_descriptors'] > 0
              assert s['descriptor_status_counts'].get('NO_CANONICAL_MATCH', 0) < s['yugioh_shadow_descriptors']
              print(json.dumps(s, indent=2, sort_keys=True))
          PY
        working-directory: backend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-physical-identity-corroboration-v2-${{ github.run_id }}
          path: backend/artifacts/yugioh-physical-identity-corroboration-v2/
          if-no-files-found: warn
          retention-days: 90
