name: Audit Yu-Gi-Oh OCG First-Party Version Contract V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_first_party_version_contract_v1.py'
      - '.github/workflows/audit-yugioh-ocg-first-party-version-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_FIRST_PARTY_VERSION_CONTRACT_OUTPUT: /tmp/ygo-ocg-first-party-version-contract/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile first-party version-contract auditor
        run: python -m py_compile app/scripts/audit_yugioh_ocg_first_party_version_contract_v1.py
      - name: READ ONLY verify Cardmarket public version anchors and derive exact residual pairs
        run: |
          mkdir -p /tmp/ygo-ocg-first-party-version-contract
          python -m app.scripts.audit_yugioh_ocg_first_party_version_contract_v1
      - name: Require safe current production surface
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-first-party-version-contract/report.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['candidate_pairs']==p['candidate_products']==p['candidate_prints'],p
          assert p['candidate_pairs']<=41,p
          assert all(v in ('certified','inconclusive') for v in p['anchor_status'].values()),p
          expected={'DOCS':(108,108,69,39),'LTGY':(86,86,75,11),'CSOC':(87,87,74,13)}
          rows={r['set_code']:r for r in p['sets']}
          for code,(products,prints,accepted,residual) in expected.items():
              r=rows[code]
              assert (r['products'],r['prints'],r['accepted'],r['residual'])==(products,prints,accepted,residual),r
          if all(v=='certified' for v in p['anchor_status'].values()):
              assert p['candidate_pairs']==41,p
              assert {k:rows[k]['candidate_pairs'] for k in rows}=={'DOCS':19,'LTGY':11,'CSOC':11},p
          print(json.dumps({'anchors':p['anchor_status'],'candidate_pairs':p['candidate_pairs'],'per_set':{k:rows[k]['candidate_pairs'] for k in rows}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-first-party-version-contract-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-first-party-version-contract/report.json
          retention-days: 90
          if-no-files-found: error
