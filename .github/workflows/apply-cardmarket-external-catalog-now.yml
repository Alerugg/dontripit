name: Apply Cardmarket External Catalog Now

on:
  push:
    branches:
      - apply-cardmarket-external-catalog-now

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Download all official Cardmarket MVP catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cardmarket
          for spec in mtg:1 yugioh:3 pokemon:6 onepiece:18; do
            game="${spec%%:*}"
            game_id="${spec##*:}"
            for group in singles nonsingles; do
              curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
                "https://downloads.s3.cardmarket.com/productCatalog/productList/products_${group}_${game_id}.json" \
                -o "/tmp/cardmarket/${game}_${group}.json"
            done
          done
      - name: Dry-run full external catalog sync
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/sync_cardmarket_catalog.py \
            --catalog mtg:single:/tmp/cardmarket/mtg_singles.json \
            --catalog mtg:non_single:/tmp/cardmarket/mtg_nonsingles.json \
            --catalog yugioh:single:/tmp/cardmarket/yugioh_singles.json \
            --catalog yugioh:non_single:/tmp/cardmarket/yugioh_nonsingles.json \
            --catalog pokemon:single:/tmp/cardmarket/pokemon_singles.json \
            --catalog pokemon:non_single:/tmp/cardmarket/pokemon_nonsingles.json \
            --catalog onepiece:single:/tmp/cardmarket/onepiece_singles.json \
            --catalog onepiece:non_single:/tmp/cardmarket/onepiece_nonsingles.json \
            --report /tmp/cardmarket/catalog-dry.json
      - name: Apply full external catalog sync
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/sync_cardmarket_catalog.py \
            --catalog mtg:single:/tmp/cardmarket/mtg_singles.json \
            --catalog mtg:non_single:/tmp/cardmarket/mtg_nonsingles.json \
            --catalog yugioh:single:/tmp/cardmarket/yugioh_singles.json \
            --catalog yugioh:non_single:/tmp/cardmarket/yugioh_nonsingles.json \
            --catalog pokemon:single:/tmp/cardmarket/pokemon_singles.json \
            --catalog pokemon:non_single:/tmp/cardmarket/pokemon_nonsingles.json \
            --catalog onepiece:single:/tmp/cardmarket/onepiece_singles.json \
            --catalog onepiece:non_single:/tmp/cardmarket/onepiece_nonsingles.json \
            --apply --report /tmp/cardmarket/catalog-apply.json
      - uses: actions/upload-artifact@v4
        with:
          name: cardmarket-external-catalog-sync
          path: |
            /tmp/cardmarket/catalog-dry.json
            /tmp/cardmarket/catalog-apply.json
          retention-days: 7
