name: Audit Yu-Gi-Oh Catalog Health V2

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/audit-yugioh-catalog-health-v2.yml'
      - 'backend/app/scripts/audit_yugioh_catalog_health_v2.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Checkout catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify Neon secret
        run: test -n "${DATABASE_URL}${DATABASE_URL_UNPOOLED}"
      - name: Compile Catalog Health audit
        working-directory: backend
        run: python -m compileall -q app/scripts/audit_yugioh_catalog_health_v2.py
      - name: Audit canonical Yu-Gi-Oh catalog health read-only
        working-directory: backend
        run: |
          set -euo pipefail
          python -u -m app.scripts.audit_yugioh_catalog_health_v2 \
            --report-path /tmp/yugioh-catalog-health-v2.json \
            | tee /tmp/yugioh-catalog-health-v2.log
      - name: Upload Catalog Health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-catalog-health-v2-${{ github.sha }}
          path: |
            /tmp/yugioh-catalog-health-v2.json
            /tmp/yugioh-catalog-health-v2.log
          retention-days: 90
          if-no-files-found: error
