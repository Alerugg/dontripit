name: Audit Yu-Gi-Oh OCG Frozen Version Contract V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/yugioh_ocg_frozen_version_contract_v1.py'
      - 'backend/app/scripts/yugioh_ocg_frozen_version_pairs_v1.py'
      - 'backend/app/scripts/audit_yugioh_ocg_frozen_version_contract_v1.py'
      - '.github/workflows/audit-yugioh-ocg-frozen-version-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_FROZEN_VERSION_CONTRACT_OUTPUT: /tmp/ygo-ocg-frozen-version-contract/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile frozen version certificate and derivation
        run: |
          python -m py_compile app/scripts/yugioh_ocg_frozen_version_contract_v1.py
          python -m py_compile app/scripts/yugioh_ocg_frozen_version_pairs_v1.py
          python -m py_compile app/scripts/audit_yugioh_ocg_frozen_version_contract_v1.py
      - name: READ ONLY derive exact 41-pair frozen-contract proposal
        run: |
          mkdir -p /tmp/ygo-ocg-frozen-version-contract
          python -m app.scripts.audit_yugioh_ocg_frozen_version_contract_v1
      - name: Require exact frozen residual surface
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-frozen-version-contract/report.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['candidate_pairs']==41,p
          assert p['candidate_products']==41,p
          assert p['candidate_prints']==41,p
          assert len(p['contract_sha256'])==64,p
          rows={r['set_code']:r for r in p['sets']}
          assert {k:(rows[k]['candidate_pairs'],rows[k]['unsupported_pairs']) for k in rows}=={
            'DOCS':(19,20),'LTGY':(11,0),'CSOC':(11,2)
          },p
          assert sum(x['residual_products'] for x in p['unsupported_groups'])==22,p
          assert {x['rarity_key'] for x in p['unsupported_groups']}=={'secret|super','common|commonparallel'},p
          assert len({x['idProduct'] for x in p['proposal']})==41,p
          assert len({x['print_id'] for x in p['proposal']})==41,p
          print(json.dumps({'contract_sha256':p['contract_sha256'],'pairs':41,'DOCS':19,'LTGY':11,'CSOC':11,'intentionally_blocked':22},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-frozen-version-contract-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-frozen-version-contract/report.json
          retention-days: 90
          if-no-files-found: error
