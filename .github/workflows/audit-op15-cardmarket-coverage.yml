name: Audit OP15 Cardmarket Coverage

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-op15-cardmarket-coverage.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Count exact OP15 mappings and list every remaining gap
        run: |
          python - <<'PY'
          import json,os
          from collections import Counter
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with conn,conn.cursor(cursor_factory=RealDictCursor) as cur:
            cur.execute("SELECT id FROM games WHERE slug='onepiece'"); gid=int(cur.fetchone()['id'])
            cur.execute("SELECT id,name FROM sets WHERE game_id=%s AND lower(code)='op-15' LIMIT 1",(gid,)); setrow=dict(cur.fetchone())
            cur.execute('''
              WITH latest_prices AS (
                SELECT DISTINCT ON (external_product_id,price_variant)
                       external_product_id,price_variant,price_low,price_mid,price_market,price_last,avg1,avg7,avg30,as_of
                FROM external_market_price_snapshots
                WHERE currency='EUR' AND price_variant='nonfoil'
                ORDER BY external_product_id,price_variant,as_of DESC,id DESC
              ), accepted AS (
                SELECT DISTINCT ON (l.print_id)
                       l.print_id,l.external_product_id,l.mapping_method,l.confidence,
                       e.external_id,e.name AS cardmarket_name,e.website_path,e.last_seen_at,
                       lp.price_low,lp.price_mid,lp.price_market,lp.price_last,lp.avg1,lp.avg7,lp.avg30,lp.as_of
                FROM external_catalog_print_links l
                JOIN external_catalog_products e ON e.id=l.external_product_id
                LEFT JOIN latest_prices lp ON lp.external_product_id=e.id
                WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single'
                  AND l.link_status IN ('accepted','mapped','exact')
                ORDER BY l.print_id,
                         CASE WHEN l.confidence='exact' THEN 0 ELSE 1 END,
                         l.updated_at DESC,l.id DESC
              )
              SELECT p.id AS print_id,c.name AS card_name,p.collector_number,p.variant,p.rarity,p.language,p.print_key,
                     EXISTS(SELECT 1 FROM print_releases pr WHERE pr.print_id=p.id AND pr.release_id=66) AS in_release_66,
                     a.external_product_id,a.external_id AS cardmarket_id,a.cardmarket_name,a.website_path,a.mapping_method,a.confidence,
                     a.price_low,a.price_mid,a.price_market,a.price_last,a.avg1,a.avg7,a.avg30,a.as_of
              FROM prints p JOIN cards c ON c.id=p.card_id
              LEFT JOIN accepted a ON a.print_id=p.id
              WHERE p.set_id=%s
              ORDER BY p.collector_number,p.variant,p.id
            ''',(gid,setrow['id']))
            rows=[dict(r) for r in cur.fetchall()]
          conn.close()

          for row in rows:
            row['mapped']=row.get('external_product_id') is not None
            row['priced']=row['mapped'] and any(row.get(k) is not None for k in ('price_mid','price_market','price_last','price_low'))
            if row.get('as_of') is not None: row['as_of']=row['as_of'].isoformat()
          gaps=[r for r in rows if not r['mapped']]
          mapped_unpriced=[r for r in rows if r['mapped'] and not r['priced']]
          report={
            'set':setrow,
            'total_prints':len(rows),
            'mapped_prints':sum(r['mapped'] for r in rows),
            'priced_prints':sum(r['priced'] for r in rows),
            'mapped_unpriced':len(mapped_unpriced),
            'unmapped':len(gaps),
            'release_66_prints':sum(bool(r['in_release_66']) for r in rows),
            'mapping_methods':dict(Counter(r.get('mapping_method') or 'unmapped' for r in rows)),
            'unmapped_rows':gaps,
            'mapped_unpriced_rows':mapped_unpriced,
          }
          print(json.dumps(report,indent=2,ensure_ascii=False,default=str))
          Path('/tmp/op15-cardmarket-coverage.json').write_text(json.dumps(report,indent=2,ensure_ascii=False,default=str)+'\n')
          if len(rows)!=149: raise AssertionError({'op15_prints':len(rows),'expected':149})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op15-cardmarket-coverage-${{ github.run_id }}
          path: /tmp/op15-cardmarket-coverage.json
          retention-days: 90
