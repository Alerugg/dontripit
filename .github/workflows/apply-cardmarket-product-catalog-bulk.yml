name: Apply Cardmarket Product Catalog Bulk

on:
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/jobs/cardmarket_product_catalog_bulk_v2.py'
      - '.github/workflows/apply-cardmarket-product-catalog-bulk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-cardmarket-product-catalog-bulk-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile bulk loader
        run: python -m py_compile app/jobs/cardmarket_product_catalog_bulk_v2.py
      - name: Apply current schema
        run: alembic upgrade head
      - name: Canonicalize current non-single catalog and prices
        run: python -m app.jobs.cardmarket_product_catalog_bulk_v2 | tee /tmp/cardmarket-product-bulk.json
      - name: Verify exact current coverage
        run: |
          python - <<'PY'
          import json,os
          from sqlalchemy import create_engine,text
          engine=create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              proof=conn.execute(text('''
                WITH current AS (
                  SELECT e.id,e.external_id,e.game_id
                  FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                  WHERE e.source='cardmarket' AND e.product_group='non_single'
                    AND e.last_seen_at=(SELECT max(last_seen_at) FROM external_catalog_products WHERE source='cardmarket')
                    AND g.slug IN ('pokemon','onepiece','mtg','yugioh')
                ), exact AS (
                  SELECT c.id,c.external_id,c.game_id,pv.id variant_id,p.game_id canonical_game_id
                  FROM current c
                  JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=c.external_id
                  JOIN product_variants pv ON pv.id=pi.product_variant_id
                  JOIN products p ON p.id=pv.product_id
                ), linked AS (
                  SELECT DISTINCT e.id
                  FROM exact e JOIN external_catalog_product_variant_links l
                    ON l.external_product_id=e.id AND l.product_variant_id=e.variant_id AND l.link_status='accepted'
                ), priced AS (
                  SELECT DISTINCT e.id
                  FROM exact e JOIN price_snapshots ps
                    ON ps.entity_type='product_variant' AND ps.entity_id=e.variant_id
                  JOIN price_sources src ON src.id=ps.source_id AND src.name='cardmarket'
                )
                SELECT (SELECT count(*) FROM current) total,
                       (SELECT count(*) FROM exact) identifiers,
                       (SELECT count(*) FROM linked) accepted_links,
                       (SELECT count(*) FROM exact WHERE canonical_game_id<>game_id) cross_game,
                       (SELECT count(*) FROM priced) canonically_priced
              ''')).mappings().one()
          proof={k:int(v) for k,v in proof.items()}
          if proof['total'] != proof['identifiers'] or proof['total'] != proof['accepted_links'] or proof['cross_game'] != 0:
              raise AssertionError(proof)
          if proof['canonically_priced'] < int(proof['total'] * 0.75):
              raise AssertionError({'reason':'unexpected price coverage regression','proof':proof})
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-product-bulk-${{ github.run_id }}
          path: /tmp/cardmarket-product-bulk.json
          retention-days: 90
          if-no-files-found: warn
