name: Apply Cardmarket Product Catalog Bulk

on:
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/jobs/cardmarket_product_catalog_bulk_v2.py'
      - '.github/workflows/apply-cardmarket-product-catalog-bulk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-cardmarket-product-catalog-bulk-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile bulk loader
        run: python -m py_compile app/jobs/cardmarket_product_catalog_bulk_v2.py
      - name: Apply current schema
        run: alembic upgrade head
      - name: Canonicalize current non-single catalog and prices
        shell: bash
        run: |
          set -o pipefail
          python -m app.jobs.cardmarket_product_catalog_bulk_v2 | tee /tmp/cardmarket-product-bulk.json
      - name: Verify exact current coverage efficiently
        run: |
          python - <<'PY'
          import json,os
          import psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
              c.execute("SET LOCAL statement_timeout='90s'")
              c.execute('''CREATE TEMP TABLE current_cm_non_single ON COMMIT DROP AS
                SELECT e.id,e.external_id,e.game_id,g.slug
                FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.product_group='non_single'
                  AND e.last_seen_at=(SELECT max(last_seen_at) FROM external_catalog_products WHERE source='cardmarket')
                  AND g.slug IN ('pokemon','onepiece','mtg','yugioh')''')
              c.execute('CREATE INDEX ON current_cm_non_single(external_id)')
              c.execute('CREATE INDEX ON current_cm_non_single(id)')
              c.execute('SELECT count(*) total FROM current_cm_non_single')
              total=int(c.fetchone()['total'])
              c.execute('''SELECT count(*) identifiers,count(*) FILTER (WHERE p.game_id<>cm.game_id) cross_game
                FROM current_cm_non_single cm
                JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                JOIN product_variants pv ON pv.id=pi.product_variant_id JOIN products p ON p.id=pv.product_id''')
              identity=c.fetchone()
              c.execute('''SELECT count(DISTINCT cm.id) accepted_links
                FROM current_cm_non_single cm
                JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                JOIN external_catalog_product_variant_links l ON l.external_product_id=cm.id
                  AND l.product_variant_id=pi.product_variant_id AND l.link_status='accepted' ''')
              accepted=int(c.fetchone()['accepted_links'])
              c.execute("SELECT id FROM price_sources WHERE name='cardmarket'")
              source_id=int(c.fetchone()['id'])
              c.execute('''SELECT count(DISTINCT cm.id) priced FROM current_cm_non_single cm
                JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                JOIN price_snapshots ps ON ps.entity_type='product_variant' AND ps.entity_id=pi.product_variant_id
                  AND ps.source_id=%s''',(source_id,))
              priced=int(c.fetchone()['priced'])
              c.execute('SELECT slug,count(*) n FROM current_cm_non_single GROUP BY slug ORDER BY slug')
              by_game={r['slug']:int(r['n']) for r in c.fetchall()}
          conn.close()
          proof={'total':total,'by_game':by_game,'identifiers':int(identity['identifiers']),'accepted_links':accepted,
                 'cross_game':int(identity['cross_game']),'canonically_priced':priced,
                 'price_coverage_pct':round(priced*100/total,3) if total else 0}
          # Never hard-code a catalog size: Cardmarket adds commercial products over time.
          # Instead require complete one-to-one identity coverage for whatever the current feed contains.
          if proof['total']<13173 or proof['identifiers']!=total or accepted!=total or proof['cross_game']!=0:
              raise AssertionError(proof)
          if priced<int(total*0.75):
              raise AssertionError({'reason':'unexpected price coverage regression','proof':proof})
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-product-bulk-${{ github.run_id }}
          path: /tmp/cardmarket-product-bulk.json
          retention-days: 90
          if-no-files-found: warn
