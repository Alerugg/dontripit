name: Audit Pokemon Source Marketplace Image V1

on:
  pull_request:
    paths:
      - '.github/workflows/audit-pokemon-source-marketplace-image-v1.yml'
      - 'backend/app/scripts/audit_pokemon_tcgdex_source_marketplace_v1.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PGOPTIONS: -c default_transaction_read_only=on
      PYTHONPATH: .
      TCGDEX_CARDS_SHA: d9083b73db080979123ebf5e9e97338d4e0745b2
      TCGDEX_CARDS_REPO: ${{ github.workspace }}/tcgdex-cards
      POKEMON_SOURCE_MARKETPLACE_OUTPUT: artifacts/pokemon-source-marketplace-image-v1.json
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Dontripit
        uses: actions/checkout@v4

      - name: Checkout pinned TCGdex cards database
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: d9083b73db080979123ebf5e9e97338d4e0745b2
          path: tcgdex-cards
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Certify source marketplace image identities READ ONLY
        run: |
          test "$(git -C "$TCGDEX_CARDS_REPO" rev-parse HEAD)" = "$TCGDEX_CARDS_SHA"
          python -m app.scripts.audit_pokemon_tcgdex_source_marketplace_v1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-source-marketplace-image-v1-${{ github.run_id }}
          path: backend/artifacts/pokemon-source-marketplace-image-v1.json
          retention-days: 30
