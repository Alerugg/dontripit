name: Apply YGO Cardmarket Konami Bridge V4 Live

on:
  push:
    branches: [p1/cardmarket-identity-resolver-v1]
    paths:
      - '.github/workflows/apply-ygo-cardmarket-konami-bridge-v4-live.yml'

permissions:
  contents: read

concurrency:
  group: apply-ygo-cardmarket-konami-bridge-v4-live
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1/cardmarket-identity-resolver-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile V4 live paths
        working-directory: backend
        run: >-
          python -m py_compile
          scripts/audit_yugioh_cardmarket_expansion_composition_v4.py
          scripts/certify_yugioh_cardmarket_expansion_composition_v4.py
          scripts/audit_yugioh_cardmarket_konami_bridge_v4.py
          scripts/apply_yugioh_cardmarket_konami_bridge_v4.py
          scripts/project_cardmarket_link_prices.py

      - name: Capture YGO current price baseline
        working-directory: backend
        run: |
          python - <<'PY'
          import json, os, psycopg2
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          conn=psycopg2.connect(url)
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT id FROM games WHERE slug='yugioh'"); gid=cur.fetchone()[0]
                  cur.execute("SELECT id FROM price_sources WHERE name='cardmarket'"); row=cur.fetchone(); sid=row[0] if row else None
                  cur.execute("SELECT count(*) FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=%s",(gid,)); total=int(cur.fetchone()[0])
                  latest=None; priced=0
                  if sid is not None:
                      cur.execute("SELECT max(ps.as_of) FROM price_snapshots ps JOIN prints p ON p.id=ps.entity_id JOIN cards c ON c.id=p.card_id WHERE ps.entity_type='print' AND ps.source_id=%s AND c.game_id=%s",(sid,gid)); latest=cur.fetchone()[0]
                      if latest is not None:
                          cur.execute("SELECT count(DISTINCT ps.entity_id) FROM price_snapshots ps JOIN prints p ON p.id=ps.entity_id JOIN cards c ON c.id=p.card_id WHERE ps.entity_type='print' AND ps.source_id=%s AND c.game_id=%s AND ps.as_of=%s",(sid,gid,latest)); priced=int(cur.fetchone()[0])
                  out={'canonical_prints':total,'latest_as_of':latest.isoformat() if latest else None,'current_priced_prints':priced,'missing_current_price':total-priced}
                  print('YGO_V4_PRICE_BEFORE='+json.dumps(out,separators=(',',':')))
                  open('/tmp/ygo-v4-price-before.json','w').write(json.dumps(out,indent=2)+'\n')
              conn.rollback()
          finally: conn.close()
          PY

      - name: Fresh composition calibration READ ONLY
        working-directory: backend
        run: >-
          python scripts/audit_yugioh_cardmarket_expansion_composition_v4.py
          --min-linked 5
          --min-informative 5
          --min-support 5
          --min-evidence-coverage 0.25
          --min-purity 0.95
          --min-margin 3
          --report /tmp/ygo-v4-composition-calibration.json

      - name: Fresh fixed-profile expansion certification
        working-directory: backend
        run: >-
          python scripts/certify_yugioh_cardmarket_expansion_composition_v4.py
          /tmp/ygo-v4-composition-calibration.json
          --report /tmp/ygo-v4-expansion-cert.json

      - name: Fresh deterministic product certification READ ONLY
        working-directory: backend
        run: >-
          python scripts/audit_yugioh_cardmarket_konami_bridge_v4.py
          /tmp/ygo-v4-expansion-cert.json
          --report /tmp/ygo-v4-product-cert.json

      - name: Gate fresh V4 certification
        run: |
          python - <<'PY'
          import json
          exp=json.load(open('/tmp/ygo-v4-expansion-cert.json'))['summary']
          d=json.load(open('/tmp/ygo-v4-product-cert.json'))['summary']
          assert exp['production_writes'] == 0, exp
          assert exp['fixed_profile_gold_accepted'] >= 200, exp
          assert exp['fixed_profile_gold_wrong'] == 0, exp
          assert exp['fixed_profile_gold_precision'] == 1.0, exp
          assert exp['certification_passed'] is True, exp
          assert d['production_writes'] == 0, d
          assert d['masked_backtest_predictable'] >= 10000, d
          assert d['masked_backtest_wrong'] == 0, d
          assert d['masked_backtest_precision'] == 1.0, d
          assert 0 < d['safe_candidate_external_products'] <= 3000, d
          assert d['safe_candidate_link_rows'] == d['safe_candidate_external_products'], d
          assert d['certification_ready'] is True, d
          print('YGO_V4_FRESH_CERT_GATE=PASS')
          PY

      - name: V4 exact-link dry-run preflight
        working-directory: backend
        run: >-
          python scripts/apply_yugioh_cardmarket_konami_bridge_v4.py
          /tmp/ygo-v4-product-cert.json
          --report /tmp/ygo-v4-apply-preflight.json

      - name: Gate V4 exact-link preflight
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ygo-v4-apply-preflight.json'))
          assert d['write_ready'] is True, d
          assert d['blockers'] == [], d
          assert d['certified_external_products'] > 0, d
          assert d['certified_pairs'] == d['certified_external_products'], d
          assert d['candidate_links'] > 0, d
          print('YGO_V4_APPLY_PREFLIGHT_GATE=PASS')
          PY

      - name: APPLY certified YGO V4 exact links
        working-directory: backend
        run: >-
          python scripts/apply_yugioh_cardmarket_konami_bridge_v4.py
          /tmp/ygo-v4-product-cert.json
          --apply
          --report /tmp/ygo-v4-apply.json

      - name: Prove YGO V4 idempotence
        working-directory: backend
        run: |
          python scripts/apply_yugioh_cardmarket_konami_bridge_v4.py /tmp/ygo-v4-product-cert.json --apply --report /tmp/ygo-v4-apply-second.json
          python - <<'PY'
          import json
          first=json.load(open('/tmp/ygo-v4-apply.json'))
          second=json.load(open('/tmp/ygo-v4-apply-second.json'))
          assert first['write_ready'] is True, first
          assert first['affected_rows'] == first['candidate_links'], first
          assert first['ambiguous_targets_after'] == 0, first
          assert second['write_ready'] is True, second
          assert second['candidate_links'] == 0, second
          assert second['affected_rows'] == 0, second
          assert second['ambiguous_targets_after'] == 0, second
          print('YGO_V4_IDEMPOTENCE_GATE=PASS')
          PY

      - name: Project YGO prices dry-run
        working-directory: backend
        run: >-
          env PYTHONPATH=. python scripts/project_cardmarket_link_prices.py
          --game yugioh
          --report /tmp/ygo-v4-price-preflight.json

      - name: Gate YGO V4 price projection
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ygo-v4-price-preflight.json'))
          assert d['write_ready'] is True, d
          assert d['ambiguous_print_links'] == 0, d
          assert d['cross_game_links'] == 0, d
          print('YGO_V4_PRICE_GATE=PASS')
          PY

      - name: APPLY YGO V4 price projection
        working-directory: backend
        run: >-
          env PYTHONPATH=. python scripts/project_cardmarket_link_prices.py
          --game yugioh
          --apply
          --report /tmp/ygo-v4-price-apply.json

      - name: Fresh post-apply composition certification
        working-directory: backend
        run: |
          python scripts/audit_yugioh_cardmarket_expansion_composition_v4.py --min-linked 5 --min-informative 5 --min-support 5 --min-evidence-coverage 0.25 --min-purity 0.95 --min-margin 3 --report /tmp/ygo-v4-post-composition.json
          python scripts/certify_yugioh_cardmarket_expansion_composition_v4.py /tmp/ygo-v4-post-composition.json --report /tmp/ygo-v4-post-expansion-cert.json
          python scripts/audit_yugioh_cardmarket_konami_bridge_v4.py /tmp/ygo-v4-post-expansion-cert.json --report /tmp/ygo-v4-post-product-cert.json

      - name: Assert post-apply V4 state
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ygo-v4-post-product-cert.json'))['summary']
          assert d['production_writes'] == 0, d
          assert d['masked_backtest_wrong'] == 0, d
          assert d['masked_backtest_precision'] == 1.0, d
          assert d['safe_candidate_external_products'] == 0, d
          assert d['safe_candidate_link_rows'] == 0, d
          print('YGO_V4_POST_CERT_GATE=PASS')
          PY

      - name: Capture YGO current price result
        working-directory: backend
        run: |
          python - <<'PY'
          import json, os, psycopg2
          before=json.load(open('/tmp/ygo-v4-price-before.json'))
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          conn=psycopg2.connect(url)
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT id FROM games WHERE slug='yugioh'"); gid=cur.fetchone()[0]
                  cur.execute("SELECT id FROM price_sources WHERE name='cardmarket'"); sid=cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=%s",(gid,)); total=int(cur.fetchone()[0])
                  cur.execute("SELECT max(ps.as_of) FROM price_snapshots ps JOIN prints p ON p.id=ps.entity_id JOIN cards c ON c.id=p.card_id WHERE ps.entity_type='print' AND ps.source_id=%s AND c.game_id=%s",(sid,gid)); latest=cur.fetchone()[0]
                  cur.execute("SELECT count(DISTINCT ps.entity_id) FROM price_snapshots ps JOIN prints p ON p.id=ps.entity_id JOIN cards c ON c.id=p.card_id WHERE ps.entity_type='print' AND ps.source_id=%s AND c.game_id=%s AND ps.as_of=%s",(sid,gid,latest)); priced=int(cur.fetchone()[0])
                  missing=total-priced
                  out={'canonical_prints':total,'latest_as_of':latest.isoformat(),'current_priced_prints':priced,'missing_current_price':missing,'recovered_prices':before['missing_current_price']-missing}
                  assert missing <= before['missing_current_price'], (before,out)
                  print('YGO_V4_PRICE_AFTER='+json.dumps(out,separators=(',',':')))
                  open('/tmp/ygo-v4-price-after.json','w').write(json.dumps(out,indent=2)+'\n')
              conn.rollback()
          finally: conn.close()
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-cardmarket-konami-bridge-v4-live-${{ github.run_id }}
          path: |
            /tmp/ygo-v4-composition-calibration.json
            /tmp/ygo-v4-expansion-cert.json
            /tmp/ygo-v4-product-cert.json
            /tmp/ygo-v4-apply-preflight.json
            /tmp/ygo-v4-apply.json
            /tmp/ygo-v4-apply-second.json
            /tmp/ygo-v4-price-before.json
            /tmp/ygo-v4-price-preflight.json
            /tmp/ygo-v4-price-apply.json
            /tmp/ygo-v4-post-composition.json
            /tmp/ygo-v4-post-expansion-cert.json
            /tmp/ygo-v4-post-product-cert.json
            /tmp/ygo-v4-price-after.json
          retention-days: 90
          if-no-files-found: warn
