name: Deploy backend to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-southwest1' }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'dontripit' }}
  GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'dontripit-api' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_CONSOLE_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_CONSOLE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in PROJECT_ID WIF_PROVIDER DEPLOYER_SA DATABASE_URL INTERNAL_API_KEY ADMIN_USER ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub variable/secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/dontripit-api:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build --pull -t "${IMAGE}" ./backend
          docker push "${IMAGE}"

      - name: Deploy Cloud Run revision
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_CONSOLE_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_CONSOLE_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
        run: |
          set -euo pipefail
          gcloud run deploy "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --image="${IMAGE}" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min=0 \
            --max=2 \
            --concurrency=20 \
            --timeout=120 \
            --set-env-vars="SOURCE_VERSION=${GITHUB_SHA},DATABASE_URL=${DATABASE_URL},INTERNAL_API_KEY=${INTERNAL_API_KEY},ADMIN_CONSOLE_USERNAME=${ADMIN_USER},ADMIN_CONSOLE_PASSWORD=${ADMIN_PASSWORD},PUBLIC_SITE_URL=https://dontripit.com,RESEND_API_KEY=${RESEND_API_KEY},AUTH_EMAIL_FROM=${AUTH_EMAIL_FROM}"

      - name: Verify health endpoint
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" --project="${PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          echo "Cloud Run URL: ${SERVICE_URL}"
          curl --fail --show-error --silent --retry 5 --retry-delay 3 "${SERVICE_URL}/api/health"
