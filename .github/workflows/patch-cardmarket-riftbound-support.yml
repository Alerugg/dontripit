name: Patch Cardmarket Riftbound Support

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/patch-cardmarket-riftbound-support.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Riftbound to Cardmarket-supported games
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('backend/app/jobs/cardmarket_master_inventory.py')
          s=p.read_text()
          old='SUPPORTED_GAMES = {"pokemon", "onepiece", "mtg", "yugioh"}'
          new='SUPPORTED_GAMES = {"pokemon", "onepiece", "mtg", "yugioh", "riftbound"}'
          if old not in s and new not in s:
              raise SystemExit('unexpected SUPPORTED_GAMES definition')
          p.write_text(s.replace(old,new))

          p=Path('backend/scripts/sync_cardmarket_external_prices.py')
          s=p.read_text()
          old='choices=["pokemon", "mtg", "onepiece", "yugioh"]'
          new='choices=["pokemon", "mtg", "onepiece", "yugioh", "riftbound"]'
          if old not in s and new not in s:
              raise SystemExit('unexpected --game choices definition')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- backend/app/jobs/cardmarket_master_inventory.py backend/scripts/sync_cardmarket_external_prices.py
      - name: Commit exact patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "DontRipIt CI"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/jobs/cardmarket_master_inventory.py backend/scripts/sync_cardmarket_external_prices.py
          git commit -m "Support Riftbound in Cardmarket master sync"
          git push origin HEAD:catalog-v2
