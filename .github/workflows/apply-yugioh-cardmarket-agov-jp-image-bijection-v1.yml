name: Apply Yu-Gi-Oh Cardmarket AGOV-JP Image Bijection V1

on:
  pull_request:
    paths:
      - 'backend/app/data/yugioh_agov_jp_image_bijection_v1.csv'
      - 'backend/app/scripts/apply_yugioh_cardmarket_agov_jp_image_bijection_v1.py'
      - '.github/workflows/apply-yugioh-cardmarket-agov-jp-image-bijection-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/data/yugioh_agov_jp_image_bijection_v1.csv'
      - 'backend/app/scripts/apply_yugioh_cardmarket_agov_jp_image_bijection_v1.py'
      - '.github/workflows/apply-yugioh-cardmarket-agov-jp-image-bijection-v1.yml'

permissions:
  contents: read

concurrency:
  group: yugioh-cardmarket-agov-jp-image-bijection-v1
  cancel-in-progress: false

jobs:
  exact-links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile guarded mapper
        run: python -m py_compile app/scripts/apply_yugioh_cardmarket_agov_jp_image_bijection_v1.py
      - name: READ ONLY validate frozen 30-pair manifest
        run: |
          mkdir -p /tmp/ygo-agov-jp-image-v1
          python -m app.scripts.apply_yugioh_cardmarket_agov_jp_image_bijection_v1 \
            --report /tmp/ygo-agov-jp-image-v1/proposal.json
      - name: Apply 30 image-certified exact links
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_cardmarket_agov_jp_image_bijection_v1 \
            --apply \
            --confirm APPLY_YUGIOH_CARDMARKET_AGOV_JP_IMAGE_BIJECTION_V1 \
            --report /tmp/ygo-agov-jp-image-v1/applied.json
      - name: Project Cardmarket prices from accepted exact links
        if: github.event_name == 'push'
        run: |
          python scripts/project_cardmarket_link_prices.py \
            --game yugioh \
            --apply \
            --report /tmp/ygo-agov-jp-image-v1/projection.json
      - name: Final production proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json, os, psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          conn.set_session(readonly=True,autocommit=False)
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("""SELECT count(*) n FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id JOIN prints p ON p.id=l.print_id JOIN sets s ON s.id=p.set_id WHERE e.source='cardmarket' AND e.game_id=(SELECT id FROM games WHERE slug='yugioh') AND e.product_group='single' AND e.expansion_external_id='5421' AND l.link_status IN ('accepted','mapped','exact') AND lower(coalesce(p.language,''))='ja' AND upper(coalesce(s.code,''))='AGOV'""")
              total=int(cur.fetchone()['n'])
              if total != 89: raise SystemExit(f'expected 89 accepted AGOV-JP JA links, got {total}')
              cur.execute("""SELECT count(*) n FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id JOIN prints p ON p.id=l.print_id WHERE e.source='cardmarket' AND e.expansion_external_id='5421' AND l.link_status IN ('accepted','mapped','exact') AND lower(coalesce(p.language,''))<>'ja'""")
              bad=int(cur.fetchone()['n'])
              if bad: raise SystemExit(f'wrong-language AGOV-JP links remain: {bad}')
              cur.execute("""SELECT count(*) n FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id WHERE e.source='cardmarket' AND e.expansion_external_id='5421' AND l.link_status IN ('accepted','mapped','exact') AND l.mapping_method='cardmarket_ocg_certified_image_bijection_v1'""")
              image=int(cur.fetchone()['n'])
              if image != 30: raise SystemExit(f'expected 30 image-bijection links, got {image}')
          finally: conn.close()
          out={'accepted_agov_jp_ja_links':total,'image_bijection_links':image,'wrong_language_links':bad}
          open('/tmp/ygo-agov-jp-image-v1/final.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-cardmarket-agov-jp-image-bijection-v1-${{ github.run_id }}
          path: /tmp/ygo-agov-jp-image-v1/*.json
          retention-days: 90
          if-no-files-found: warn
