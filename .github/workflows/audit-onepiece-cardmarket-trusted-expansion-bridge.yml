name: Audit One Piece Cardmarket Trusted Expansion Bridge

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-onepiece-cardmarket-trusted-expansion-bridge.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-onepiece-cardmarket-trusted-expansion-bridge
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Derive expansion release anchors from already exact links
        run: |
          python - <<'PY'
          import json, os, re, unicodedata
          from collections import defaultdict, Counter
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          def norm(v):
              v=unicodedata.normalize('NFKD',str(v or ''))
              v=''.join(c for c in v if not unicodedata.combining(c)).casefold().replace('’',"'").replace('&',' and ')
              return re.sub(r'\s+',' ',re.sub(r'[^a-z0-9]+',' ',v)).strip()
          cr=re.compile(r'^(?P<name>.+)\s+\((?P<collector>(?:OP|ST|EB|PRB)\d{1,2}-\d{3}|P-\d{3})\)\s*$',re.I)
          def parse(name):
              m=cr.match(str(name or '').strip())
              if not m:return None
              c=m.group('collector').upper()
              c=re.sub(r'^(OP|ST|EB|PRB)0?(\d{1,2})-',lambda x:f'{x.group(1).upper()}{int(x.group(2)):02d}-',c)
              return norm(m.group('name')),c

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          try:
              with conn.cursor(cursor_factory=RealDictCursor) as cur:
                  cur.execute("SELECT id FROM games WHERE slug='onepiece' LIMIT 1"); gid=int(cur.fetchone()['id'])
                  cur.execute("SELECT max(last_seen_at) latest FROM external_catalog_products WHERE source='cardmarket'"); latest=cur.fetchone()['latest']

                  cur.execute('''SELECT p.id print_id,p.collector_number,p.variant,p.rarity,c.name card_name,s.code set_code,
                    array_agg(DISTINCT pr.release_id) FILTER (WHERE pr.release_id IS NOT NULL) release_ids
                    FROM prints p JOIN cards c ON c.id=p.card_id JOIN sets s ON s.id=p.set_id
                    LEFT JOIN print_releases pr ON pr.print_id=p.id
                    WHERE c.game_id=%s AND lower(p.language)='en'
                    GROUP BY p.id,p.collector_number,p.variant,p.rarity,c.name,s.code''',(gid,))
                  canon=[dict(r) for r in cur.fetchall()]
                  canon_by_id={int(r['print_id']):r for r in canon}
                  release_identity=defaultdict(list)
                  for r in canon:
                      for rid in (r['release_ids'] or []):
                          release_identity[(int(rid),norm(r['card_name']),str(r['collector_number'] or '').upper())].append(r)

                  cur.execute('''SELECT l.external_product_id,l.print_id,e.external_id id_product,e.expansion_external_id,e.name market_name
                    FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                    WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND e.last_seen_at=%s
                      AND l.link_status IN ('accepted','mapped','exact')''',(gid,latest))
                  existing=[dict(r) for r in cur.fetchall()]
                  linked_prints={int(r['print_id']) for r in existing}; linked_products={int(r['external_product_id']) for r in existing}

                  # Each anchored expansion must have a release common to every already-exact print in it.
                  expansion_prints=defaultdict(list)
                  for r in existing: expansion_prints[str(r['expansion_external_id'] or '')].append(int(r['print_id']))
                  anchors={}; anchor_stats={}; rejected=Counter()
                  for exp,pids in expansion_prints.items():
                      release_sets=[]; missing=False
                      for pid in sorted(set(pids)):
                          rs=set(int(x) for x in (canon_by_id.get(pid,{}).get('release_ids') or []))
                          if not rs: missing=True; break
                          release_sets.append(rs)
                      if missing or not release_sets:
                          rejected['missing_official_release_membership']+=1; continue
                      common=set.intersection(*release_sets)
                      if len(common)!=1:
                          rejected['non_unique_common_release']+=1; continue
                      rid=next(iter(common))
                      # Require at least two distinct exact print anchors, except an expansion that already has a
                      # direct official sealed/release mapping would be handled by the older workflow.
                      distinct=len(set(pids))
                      if distinct<2:
                          rejected['insufficient_exact_anchor_prints']+=1; continue
                      anchors[exp]=rid
                      anchor_stats[exp]={'release_id':rid,'exact_anchor_prints':distinct}

                  cur.execute('''SELECT id external_product_id,external_id id_product,expansion_external_id,name market_name,metacard_external_id,website_path
                    FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s AND product_group='single' AND last_seen_at=%s''',(gid,latest))
                  current=[dict(r) for r in cur.fetchall()]

                  raw=[]; status=Counter(); samples=[]
                  for m in current:
                      eid=int(m['external_product_id'])
                      if eid in linked_products: continue
                      exp=str(m['expansion_external_id'] or '')
                      rid=anchors.get(exp)
                      if rid is None: status['unanchored_expansion']+=1; continue
                      q=parse(m['market_name'])
                      if q is None: status['collector_not_parseable']+=1; continue
                      cands=release_identity.get((rid,q[0],q[1]),[])
                      cands=[c for c in cands if int(c['print_id']) not in linked_prints]
                      if not cands: status['no_unlinked_release_match']+=1; continue
                      if len(cands)>1:
                          status['release_match_ambiguous']+=1
                          if len(samples)<100:samples.append({'reason':'release_match_ambiguous','expansion':exp,'release_id':rid,'market':m,'candidate_prints':[int(c['print_id']) for c in cands]})
                          continue
                      c=cands[0]
                      raw.append({'print_id':int(c['print_id']),'external_product_id':eid,'idProduct':str(m['id_product']),'expansion_external_id':exp,
                        'release_id':rid,'market_name':m['market_name'],'card_name':c['card_name'],'collector_number':c['collector_number'],'variant':c['variant'],'rarity':c['rarity'],'set_code':c['set_code'],
                        'exact_anchor_prints':anchor_stats[exp]['exact_anchor_prints']})
                      status['raw_candidate']+=1

                  pc=Counter(x['print_id'] for x in raw); ec=Counter(x['external_product_id'] for x in raw)
                  safe=[x for x in raw if pc[x['print_id']]==1 and ec[x['external_product_id']]==1]
                  status['multiple_products_claim_print']=len(raw)-len(safe)
                  status['safe_candidate']=len(safe)

                  # Recheck no accepted links touch candidate targets.
                  pids=[x['print_id'] for x in safe]; eids=[x['external_product_id'] for x in safe]
                  conflicts=[]
                  if pids or eids:
                      cur.execute('''SELECT external_product_id,print_id FROM external_catalog_print_links
                        WHERE link_status IN ('accepted','mapped','exact') AND (print_id=ANY(%s) OR external_product_id=ANY(%s))''',(pids or [-1],eids or [-1]))
                      conflicts=[dict(r) for r in cur.fetchall()]
                  if conflicts: raise AssertionError({'candidate_existing_conflicts':conflicts[:20]})

                  report={'mode':'dry_run','game':'onepiece','latest_cardmarket_snapshot':str(latest),'canonical_en_prints':len(canon),
                    'existing_exact_prints':len(linked_prints),'existing_exact_products':len(linked_products),
                    'expansions_with_existing_exact_links':len(expansion_prints),'trusted_expansion_anchors':len(anchors),'anchor_rejections':dict(rejected),
                    'status_counts':dict(status),'safe_candidates':len(safe),'safe_candidate_prints':len({x['print_id'] for x in safe}),
                    'safe_candidate_products':len({x['external_product_id'] for x in safe}),
                    'safe_candidate_sample':safe[:100],'ambiguous_sample':samples[:100]}
                  summary={k:v for k,v in report.items() if not k.endswith('_sample')}
                  Path('/tmp/op-trusted-expansion-bridge.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
                  Path('/tmp/op-trusted-expansion-bridge-summary.json').write_text(json.dumps(summary,indent=2,default=str)+'\n')
                  print(json.dumps(summary,indent=2,default=str))
          finally:conn.close()
          PY
      - name: Persist summary
        run: |
          mkdir -p audit-reports
          cp /tmp/op-trusted-expansion-bridge-summary.json audit-reports/onepiece-cardmarket-trusted-expansion-bridge-summary.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/onepiece-cardmarket-trusted-expansion-bridge-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update One Piece trusted expansion bridge audit"
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-cardmarket-trusted-expansion-bridge-${{ github.run_id }}
          path: /tmp/op-trusted-expansion-bridge.json
          retention-days: 90
