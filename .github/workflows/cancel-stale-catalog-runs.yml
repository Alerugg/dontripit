name: Cancel Stale Catalog Runs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-stale-catalog-runs.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale product loader and superseded orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run_id in 31389068740 31391162595; do
            code=$(curl -sS -o /tmp/cancel-${run_id}.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/cancel")
            if [ "$code" = "202" ] || [ "$code" = "409" ]; then
              echo "Run ${run_id}: cancel response ${code}"
            else
              echo "Unexpected cancel response ${code} for ${run_id}"
              cat /tmp/cancel-${run_id}.json || true
              exit 1
            fi
          done
