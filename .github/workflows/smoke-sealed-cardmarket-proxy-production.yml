name: Smoke Sealed Cardmarket Proxy Production

on:
  workflow_dispatch:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/smoke-sealed-cardmarket-proxy-production.yml'

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smoke exact production proxy
        run: |
          mkdir -p /tmp/sealed-proxy-smoke
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          BASE='https://api.dontripit.com/media/product-variants'
          report={'checks': []}

          def magic_type(body: bytes):
              if body.startswith(b'\xff\xd8\xff'):
                  return 'image/jpeg'
              if body.startswith(b'\x89PNG\r\n\x1a\n'):
                  return 'image/png'
              if len(body) >= 12 and body[:4] == b'RIFF' and body[8:12] == b'WEBP':
                  return 'image/webp'
              return None

          # Historical exact recoverable variant: must serve a validated image.
          url=f'{BASE}/36155/cardmarket-image'
          req=urllib.request.Request(url, headers={'User-Agent':'DontripitProductionSmoke/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              body=r.read(4*1024*1024+1)
              headers={k.lower():v for k,v in r.headers.items()}
              status=int(r.status)
          detected=magic_type(body)
          width=int(headers.get('x-image-width','0'))
          height=int(headers.get('x-image-height','0'))
          assert status == 200, status
          assert detected in {'image/jpeg','image/png','image/webp'}, detected
          assert headers.get('content-type','').split(';')[0] == detected, headers.get('content-type')
          assert headers.get('x-image-source') == 'cardmarket-exact-proxy-v1', headers
          assert width >= 80 and height >= 80, (width,height)
          assert headers.get('access-control-allow-origin') == '*', headers
          assert headers.get('cross-origin-resource-policy') == 'cross-origin', headers
          assert 'max-age=86400' in headers.get('cache-control',''), headers
          assert headers.get('etag','').startswith('"sha256-'), headers
          report['checks'].append({
              'variant_id':36155,'status':status,'content_type':detected,
              'bytes':len(body),'width':width,'height':height,
              'x_image_source':headers.get('x-image-source'),
              'cache_control':headers.get('cache-control'),
          })

          # Historical blocked variant: exact upstream remains unavailable and
          # the public contract must fail closed as image_not_available.
          url=f'{BASE}/35143/cardmarket-image'
          req=urllib.request.Request(url, headers={'User-Agent':'DontripitProductionSmoke/1.0'})
          try:
              urllib.request.urlopen(req, timeout=30)
              raise AssertionError('variant 35143 unexpectedly returned success')
          except urllib.error.HTTPError as e:
              status=int(e.code)
              body=e.read()
              headers={k.lower():v for k,v in e.headers.items()}
          payload=json.loads(body.decode('utf-8'))
          assert status == 404, status
          assert payload == {'error':'image_not_available'}, payload
          assert 'max-age=300' in headers.get('cache-control',''), headers
          assert headers.get('x-content-type-options') == 'nosniff', headers
          report['checks'].append({
              'variant_id':35143,'status':status,'payload':payload,
              'cache_control':headers.get('cache-control'),
          })

          report['gate']='PASS'
          with open('/tmp/sealed-proxy-smoke/report.json','w') as f:
              json.dump(report,f,indent=2,sort_keys=True)
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-cardmarket-proxy-smoke-${{ github.run_id }}
          path: /tmp/sealed-proxy-smoke/report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish production smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/sealed-smoke-status.json
          import json, os
          from pathlib import Path
          state='success' if os.environ['JOB_STATUS']=='success' else 'failure'
          description='sealed production API smoke failed'
          p=Path('/tmp/sealed-proxy-smoke/report.json')
          if state=='success' and p.exists():
              r=json.loads(p.read_text())
              description='PASS: 36155 image=200; 35143 unavailable=404'
          print(json.dumps({
              'state':state,
              'context':'sealed-images-production-smoke',
              'description':description,
              'target_url':os.environ['RUN_URL'],
          }))
          PY
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/sealed-smoke-status.json
