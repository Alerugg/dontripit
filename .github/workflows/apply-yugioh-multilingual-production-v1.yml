name: Cancel Superseded Yu-Gi-Oh Multilingual Production V1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/triggers/run-yugioh-multilingual-production-recovery-v1
      - .github/workflows/apply-yugioh-multilingual-production-v1.yml

permissions:
  contents: read

# Recovery barrier only. A new run in this group cancels the superseded
# row-by-row V2 writer and any queued V2 recovery run. No production code or
# database statement is executed here; dropping the old runner connection
# makes PostgreSQL roll its single uncommitted transaction back atomically.
concurrency:
  group: yugioh-multilingual-production-v1
  cancel-in-progress: true

jobs:
  cancellation-barrier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm V2 is superseded
        run: |
          echo 'Superseded Yu-Gi-Oh V2 production writer cancelled by concurrency barrier.'
          echo 'No database connection is opened by this workflow.'
