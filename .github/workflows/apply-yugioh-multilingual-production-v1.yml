name: Apply Yu-Gi-Oh Multilingual Production V3

on:
  push:
    branches:
      - main
    paths:
      - .github/triggers/run-yugioh-multilingual-production-v1

permissions:
  contents: read
  actions: read

# Reuse the historical production concurrency group so this V3 run also
# cancels any superseded V2 execution that might somehow still be queued.
concurrency:
  group: yugioh-multilingual-production-v1
  cancel-in-progress: true

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      YUGIOH_PRODUCTION_ROLLOUT_ACK: YGO_ES_JA_ROLLOUT_V1
      PYTHONPATH: .
      WRITER_CERT_RUN_ID: '32140349027'
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require certified V3 writer lineage unchanged
        working-directory: .
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 79698d3d5068af7b93b9b63ea6e09a67eaa42c16 HEAD
          git diff --quiet 79698d3d5068af7b93b9b63ea6e09a67eaa42c16 -- \
            backend/app/scripts/rollout_yugioh_multilingual_production_v1.py \
            backend/app/scripts/rollout_yugioh_multilingual_production_v2.py \
            backend/app/scripts/rollout_yugioh_multilingual_production_v3.py \
            backend/app/scripts/certify_yugioh_multilingual_ephemeral_v1.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Read pinned rollout evidence
        working-directory: .
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          cfg=json.loads(Path('.github/triggers/run-yugioh-multilingual-production-v1').read_text())
          expected={'preflight_run_id':32084050029,'source_run_id':31915462442}
          if cfg != expected:
              raise SystemExit(f'Unexpected production trigger contract: {cfg}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"PREFLIGHT_RUN_ID={cfg['preflight_run_id']}\n")
              f.write(f"SOURCE_RUN_ID={cfg['source_run_id']}\n")
          PY

      - name: Require successful batched V3 certificate
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh run view "$WRITER_CERT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,name --jq '.status+":"+(.conclusion // "")+":"+.name')"
          test "$state" = 'completed:success:Certify Yu-Gi-Oh Batched Writer V3'

      - name: Download pinned preflight and fresh source
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf evidence/preflight evidence/fresh
          mkdir -p evidence/preflight/raw evidence/preflight evidence/fresh/raw "$RUNNER_TEMP/ygojson-fresh/extracted" "$RUNNER_TEMP/yaml-yugi"

          state="$(gh run view "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,name --jq '.status+":"+(.conclusion // "")+":"+.name')"
          test "$state" = 'completed:success:Certify Yu-Gi-Oh Multilingual Rollout Preflight V1'
          gh run download "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "yugioh-multilingual-rollout-preflight-v1-${PREFLIGHT_RUN_ID}" \
            --dir evidence/preflight/raw
          for name in yugioh-multilingual-rollout-preflight-fresh.json yugioh-multilingual-rollout-readiness-v1.json yugioh-yaml-yugi-cards-sha256-preflight.txt yugioh-yaml-yugi-source-meta-preflight.json; do
            src="$(find evidence/preflight/raw -type f -name "$name" -print -quit)"
            test -n "$src" && test -s "$src"
            cp "$src" "evidence/preflight/$name"
          done

          state="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,name --jq '.status+":"+(.conclusion // "")+":"+.name')"
          test "$state" = 'completed:success:Shadow YGOJSON Full Refresh V1'
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ygojson-shadow-full-refresh-v1-${SOURCE_RUN_ID}" \
            --dir evidence/fresh/raw
          aggregate="$(find evidence/fresh/raw -type f -name 'ygojson-shadow-fresh-aggregate-v1.zip' -print -quit)"
          test -n "$aggregate" && test -s "$aggregate"
          unzip -q "$aggregate" -d "$RUNNER_TEMP/ygojson-fresh/extracted"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/cards.json"
          test -s "$RUNNER_TEMP/ygojson-fresh/extracted/sets.json"

      - name: Fetch YAML Yugi and require exact preflight hash
        working-directory: .
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/yaml-yugi/cards.json" \
            https://dawnbrandbots.github.io/yaml-yugi/cards.json
          actual="$(sha256sum "$RUNNER_TEMP/yaml-yugi/cards.json" | awk '{print $1}')"
          expected="$(awk '{print $1}' evidence/preflight/yugioh-yaml-yugi-cards-sha256-preflight.txt)"
          test "$actual" = "$expected"
          cp evidence/preflight/yugioh-yaml-yugi-source-meta-preflight.json "$RUNNER_TEMP/yaml-yugi/source-meta.json"

      - name: Require no superseded production writer session
        run: |
          python - <<'PY'
          import json, os, psycopg2
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not url:
              raise SystemExit('missing production database URL')
          conn=psycopg2.connect(url, connect_timeout=30, application_name='dontripit_ygo_v3_guard')
          conn.set_session(readonly=True, autocommit=False)
          try:
              with conn.cursor() as cur:
                  cur.execute("""
                    SELECT pid,application_name,state,backend_xid::text
                    FROM pg_stat_activity
                    WHERE datname=current_database()
                      AND pid <> pg_backend_pid()
                      AND application_name = ANY(%s)
                    ORDER BY pid
                  """, (['dontripit_ygo_multilingual_production_v1','dontripit_ygo_cert_writer','dontripit_ygo_cert_validate'],))
                  rows=cur.fetchall()
              conn.rollback()
          finally:
              conn.close()
          report={'status':'pass' if not rows else 'blocked','writer_backends_visible':len(rows),'activity':[list(r) for r in rows],'production_writes':0}
          open('../evidence/yugioh-batched-v3-preapply-guard.json','w').write(json.dumps(report,indent=2,sort_keys=True)+'\n')
          if rows:
              raise SystemExit(f'Existing Yu-Gi-Oh writer session still active: {rows}')
          PY

      - name: Compile batched V3 writer
        run: python -m py_compile app/scripts/rollout_yugioh_multilingual_production_v3.py

      - name: Dry-run V3 against live production
        run: |
          python -m app.scripts.rollout_yugioh_multilingual_production_v3 \
            --input-dir "$RUNNER_TEMP/ygojson-fresh/extracted" \
            --yaml-yugi-cards "$RUNNER_TEMP/yaml-yugi/cards.json" \
            --yaml-yugi-meta "$RUNNER_TEMP/yaml-yugi/source-meta.json" \
            --fresh-certificate ../evidence/preflight/yugioh-multilingual-rollout-preflight-fresh.json \
            --readiness ../evidence/preflight/yugioh-multilingual-rollout-readiness-v1.json \
            --output ../evidence/yugioh-batched-production-v3-dry-run.json

      - name: Require full rollback state before apply
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../evidence/yugioh-batched-production-v3-dry-run.json').read_text())
          assert r['status']=='pass', r
          assert r['runner_version']==3 and r['writer_mode']=='batched-v3', r
          assert r['production_writes']==0, r
          assert r['before']['counts']=={'cards':14479,'prints':44226,'sets':646}, r
          assert r['plan']['targets']['es']['materializable']==38249, r
          assert r['plan']['targets']['ja']['materializable']==36426, r
          PY

      - name: Apply batched V3 atomically to production
        run: |
          python -m app.scripts.rollout_yugioh_multilingual_production_v3 \
            --input-dir "$RUNNER_TEMP/ygojson-fresh/extracted" \
            --yaml-yugi-cards "$RUNNER_TEMP/yaml-yugi/cards.json" \
            --yaml-yugi-meta "$RUNNER_TEMP/yaml-yugi/source-meta.json" \
            --fresh-certificate ../evidence/preflight/yugioh-multilingual-rollout-preflight-fresh.json \
            --readiness ../evidence/preflight/yugioh-multilingual-rollout-readiness-v1.json \
            --output ../evidence/yugioh-batched-production-v3-apply.json \
            --apply

      - name: Enforce committed V3 production evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('../evidence/yugioh-batched-production-v3-apply.json').read_text())
          assert r['status']=='pass', r
          assert r['runner_version']==3 and r['writer_mode']=='batched-v3', r
          assert r['commit_confirmed'] is True, r
          assert r['pass1']['writer']=='batched-v3' and r['pass2']['writer']=='batched-v3', r
          assert r['pass2']['total_writes']==0 and r['pass2_zero_writes'] is True, r
          assert r['logical_cards_created']==0 and r['economics_untouched'] is True, r
          assert r['invariants']['status']=='pass', r
          assert r['validation']['status']=='pass' and all(r['validation']['gates'].values()), r
          expected={'sets':811,'catalog_releases':1860,'prints':74675,'print_localizations':74675,'print_images':48662,'print_releases':76445}
          for key,value in expected.items():
              assert r['pass1']['writes'].get(key)==value, (key,r['pass1'])
          PY

      - name: Certify post-commit physical counts READ ONLY
        run: |
          python - <<'PY'
          import json, os, psycopg2
          url=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          conn=psycopg2.connect(url, connect_timeout=30, application_name='dontripit_ygo_v3_postcommit_audit')
          conn.set_session(readonly=True, autocommit=False)
          try:
              with conn.cursor() as cur:
                  cur.execute("""
                    SELECT lower(coalesce(p.language,'')),count(*)
                    FROM prints p JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
                    WHERE g.slug='yugioh' GROUP BY 1 ORDER BY 1
                  """)
                  languages={str(k):int(v) for k,v in cur.fetchall()}
                  cur.execute("""
                    SELECT count(*) FROM print_localizations l
                    JOIN prints p ON p.id=l.print_id JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
                    WHERE g.slug='yugioh' AND lower(l.language) IN ('es','ja')
                  """)
                  localizations=int(cur.fetchone()[0])
                  cur.execute("SELECT count(*) FROM cards c JOIN games g ON g.id=c.game_id WHERE g.slug='yugioh'")
                  cards=int(cur.fetchone()[0])
                  cur.execute("SELECT count(*) FROM sets s JOIN games g ON g.id=s.game_id WHERE g.slug='yugioh'")
                  sets=int(cur.fetchone()[0])
              conn.rollback()
          finally:
              conn.close()
          report={'status':'pass','production_writes':0,'languages':languages,'print_localizations_es_ja':localizations,'cards':cards,'sets':sets}
          assert languages=={'en':44226,'es':38249,'ja':36426}, report
          assert localizations==74675, report
          assert cards==14479, report
          assert sets==1457, report
          open('../evidence/yugioh-batched-production-v3-postcommit.json','w').write(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload production V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-batched-production-v3-${{ github.run_id }}
          path: |
            evidence/yugioh-batched-v3-preapply-guard.json
            evidence/yugioh-batched-production-v3-dry-run.json
            evidence/yugioh-batched-production-v3-apply.json
            evidence/yugioh-batched-production-v3-postcommit.json
          retention-days: 180
          if-no-files-found: warn
