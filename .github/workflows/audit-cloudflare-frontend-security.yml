name: Audit Cloudflare frontend migration security

on:
  push:
    branches:
      - infra/cloudflare-frontend-production-parity
    paths:
      - '.github/workflows/audit-cloudflare-frontend-security.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INTERNAL_API_BASE_URL: https://api.dontripit.com
      INTERNAL_API_KEY: migration-build-placeholder
      NEXT_PUBLIC_SITE_NAME: Don’tRipIt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/cloudflare-frontend-production-parity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch Next.js security release
        working-directory: frontend
        run: npm install --save-exact --legacy-peer-deps next@16.3.3
      - name: Prove clean install
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Rebuild Cloudflare target
        working-directory: frontend
        run: npm run build:vinext
      - name: Rebuild traditional Next target
        working-directory: frontend
        run: npm run build
      - name: Production dependency audit
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/audit-prod.json
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit-prod.json','utf8'));
          const counts = a.metadata?.vulnerabilities || {};
          console.log('PROD_AUDIT_COUNTS=' + JSON.stringify(counts));
          for (const [name,v] of Object.entries(a.vulnerabilities || {})) {
            console.log(`PROD ${name} severity=${v.severity} direct=${v.isDirect} via=${JSON.stringify(v.via)}`);
          }
          if ((counts.critical || 0) > 0) process.exit(2);
          NODE
      - name: Full dependency audit
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/audit-full.json
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit-full.json','utf8'));
          console.log('FULL_AUDIT_COUNTS=' + JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name,v] of Object.entries(a.vulnerabilities || {})) {
            console.log(`FULL ${name} severity=${v.severity} direct=${v.isDirect} via=${JSON.stringify(v.via)}`);
          }
          NODE
          exit 0
      - name: Persist validated security patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Security patch already persisted.'
            exit 0
          fi
          git commit -m 'fix(frontend): patch Next.js security release'
          git push origin HEAD:infra/cloudflare-frontend-production-parity
