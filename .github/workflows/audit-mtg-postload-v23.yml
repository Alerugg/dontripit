name: Audit MTG V2.3 Postload

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/audit-mtg-postload-v23.yml'
      - 'backend/app/scripts/audit_mtg_postload_v23.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-mtg-v23-postload
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL driver only
        run: pip install psycopg2-binary==2.9.9
      - name: Verify database secret
        run: test -n "${DATABASE_URL_UNPOOLED}${DATABASE_URL}"
      - name: Compile audit
        run: python -m py_compile app/scripts/audit_mtg_postload_v23.py
      - name: Run read-only post-load audit
        run: python -u -m app.scripts.audit_mtg_postload_v23 --output /tmp/mtg-v23-postload-audit.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-v23-postload-audit-${{ github.sha }}
          path: /tmp/mtg-v23-postload-audit.json
          retention-days: 90
          if-no-files-found: warn
