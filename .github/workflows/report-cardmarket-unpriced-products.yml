name: Report Cardmarket Unpriced Products

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/report-cardmarket-unpriced-products.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Build explicit no-price report
        run: |
          python - <<'PY'
          import csv,json,os
          from collections import Counter
          import psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
              c.execute('''
                WITH current AS (
                  SELECT e.id,e.external_id,e.game_id,e.name,e.category,e.expansion_external_id,e.website_path,g.slug
                  FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                  WHERE e.source='cardmarket' AND e.product_group='non_single'
                    AND e.last_seen_at=(SELECT max(last_seen_at) FROM external_catalog_products WHERE source='cardmarket')
                    AND g.slug IN ('pokemon','onepiece','mtg','yugioh')
                ), mapped AS (
                  SELECT cm.*,pi.product_variant_id
                  FROM current cm JOIN product_identifiers pi ON pi.source='cardmarket' AND pi.external_id=cm.external_id
                ), latest_external AS (
                  SELECT p.external_product_id,max(p.as_of) as as_of
                  FROM external_market_price_snapshots p JOIN current c ON c.id=p.external_product_id
                  GROUP BY p.external_product_id
                ), usable_external AS (
                  SELECT DISTINCT p.external_product_id
                  FROM external_market_price_snapshots p
                  JOIN latest_external l ON l.external_product_id=p.external_product_id AND l.as_of=p.as_of
                  WHERE NOT (p.price_low IS NULL AND p.price_mid IS NULL AND p.price_market IS NULL AND p.price_last IS NULL
                             AND p.avg1 IS NULL AND p.avg7 IS NULL AND p.avg30 IS NULL)
                ), canonical_priced AS (
                  SELECT DISTINCT m.id
                  FROM mapped m JOIN price_snapshots ps ON ps.entity_type='product_variant' AND ps.entity_id=m.product_variant_id
                  JOIN price_sources src ON src.id=ps.source_id AND src.name='cardmarket'
                )
                SELECT m.slug,m.external_id id_product,m.name,m.category,m.expansion_external_id,m.website_path,
                       CASE
                         WHEN l.external_product_id IS NULL THEN 'no_current_price_guide_row'
                         WHEN u.external_product_id IS NULL THEN 'current_price_guide_all_values_null'
                         ELSE 'usable_external_price_not_projected'
                       END reason
                FROM mapped m
                LEFT JOIN latest_external l ON l.external_product_id=m.id
                LEFT JOIN usable_external u ON u.external_product_id=m.id
                LEFT JOIN canonical_priced cp ON cp.id=m.id
                WHERE cp.id IS NULL
                ORDER BY m.slug,m.category,m.name,m.external_id
              ''')
              rows=[dict(r) for r in c.fetchall()]
          conn.close()
          counts=Counter((r['slug'],r['reason']) for r in rows)
          categories=Counter((r['slug'],r['category'] or 'uncategorized') for r in rows)
          summary={
              'total_unpriced':len(rows),
              'by_game_reason':{f'{g}:{reason}':n for (g,reason),n in sorted(counts.items())},
              'top_categories':[
                  {'game':g,'category':cat,'count':n}
                  for (g,cat),n in categories.most_common(40)
              ],
          }
          if len(rows)!=1094:
              raise AssertionError({'expected_current_unpriced':1094,'actual':len(rows),'summary':summary})
          with open('/tmp/cardmarket-unpriced-products.csv','w',newline='',encoding='utf-8') as f:
              writer=csv.DictWriter(f,fieldnames=['slug','id_product','name','category','expansion_external_id','website_path','reason'])
              writer.writeheader(); writer.writerows(rows)
          with open('/tmp/cardmarket-unpriced-summary.json','w',encoding='utf-8') as f:
              json.dump(summary,f,indent=2,ensure_ascii=False,sort_keys=True)
          print(json.dumps(summary,indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cardmarket-unpriced-products-${{ github.run_id }}
          path: |
            /tmp/cardmarket-unpriced-products.csv
            /tmp/cardmarket-unpriced-summary.json
          retention-days: 90
          if-no-files-found: error
