name: Test YGO Current Card Self Heal V1

on:
  push:
    branches:
      - test/ygo-current-card-self-heal-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile YGO V2 connector
        run: python -m py_compile app/ingest/connectors/ygoprodeck_yugioh_v2.py
      - name: Run focused YGO maintenance guards
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_yugioh_canonical_card_self_heal_v1.py \
            tests/test_yugioh_canonical_print_self_heal_v1.py \
            tests/test_yugioh_v2_incremental_maintenance.py \
            tests/test_ygoprodeck_incremental_v2.py
