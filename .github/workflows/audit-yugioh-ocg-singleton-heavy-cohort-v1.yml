name: Audit Yu-Gi-Oh OCG Singleton Heavy Cohort V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_singleton_heavy_cohort_v1.py'
      - '.github/workflows/audit-yugioh-ocg-singleton-heavy-cohort-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_SINGLETON_HEAVY_COHORT_OUTPUT: /tmp/ygo-ocg-singleton-heavy-cohort/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile singleton-heavy cohort auditor
        run: python -m py_compile app/scripts/audit_yugioh_ocg_singleton_heavy_cohort_v1.py
      - name: READ ONLY partition exact regional surfaces into deterministic singletons and variants
        run: |
          mkdir -p /tmp/ygo-ocg-singleton-heavy-cohort
          python -m app.scripts.audit_yugioh_ocg_singleton_heavy_cohort_v1
      - name: Require safe globally one-to-one singleton subset
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-singleton-heavy-cohort/report.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['screened_targets']==13,p
          assert p['certified_targets']+p['rejected_targets']==13,p
          assert p['certified_targets']>0,p
          assert p['certified_singleton_pairs']==len(p['proposal']),p
          assert p['certified_singleton_pairs']>=300,p
          assert len({x['external_product_id'] for x in p['proposal']})==p['certified_singleton_pairs'],p
          assert len({x['print_id'] for x in p['proposal']})==p['certified_singleton_pairs'],p
          assert all(x['metacard_evidence_links']>0 for x in p['proposal']),p
          print(json.dumps({'screened':13,'certified_targets':p['certified_targets'],'rejected_targets':p['rejected_targets'],'singleton_pairs':p['certified_singleton_pairs'],'stable_sha256':p['stable_singleton_identity_sha256'],'certified':p['certified'],'rejected':p['rejected']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-singleton-heavy-cohort-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-singleton-heavy-cohort/report.json
          retention-days: 90
          if-no-files-found: error
