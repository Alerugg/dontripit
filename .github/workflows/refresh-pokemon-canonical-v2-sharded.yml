name: Refresh Pokemon Canonical V2 Sharded

on:
  workflow_dispatch:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/refresh-pokemon-canonical-v2-sharded.yml'
      - 'backend/scripts/select_tcgdex_endpoint.sh'
      - 'backend/app/scripts/run_pokemon_refresh_shard.py'
      - 'backend/app/scripts/prove_pokemon_tcgdex_parity_v2.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_identity_rehome.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_duplicate_safe.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_certified_refresh.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_incremental_guard.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_multilingual_physical.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_multilingual.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon.py'
      - 'backend/app/ingest/registry.py'
      - 'backend/tests/test_tcgdex_certified_refresh.py'
      - 'backend/tests/test_tcgdex_sharded_refresh.py'

permissions:
  contents: read

concurrency:
  group: refresh-pokemon-canonical-v2-sharded-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tcgdex_fallback_image: ${{ steps.freeze_tcgdex_fallback.outputs.image }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact dispatched SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile sharded Pokemon refresh and parity gate
        run: |
          python -m py_compile \
            app/ingest/run.py \
            app/ingest/registry.py \
            app/ingest/connectors/tcgdex_pokemon.py \
            app/ingest/connectors/tcgdex_pokemon_multilingual.py \
            app/ingest/connectors/tcgdex_pokemon_multilingual_physical.py \
            app/ingest/connectors/tcgdex_pokemon_incremental_guard.py \
            app/ingest/connectors/tcgdex_pokemon_certified_refresh.py \
            app/ingest/connectors/tcgdex_pokemon_duplicate_safe.py \
            app/ingest/connectors/tcgdex_pokemon_identity_rehome.py \
            app/scripts/run_pokemon_refresh_shard.py \
            app/scripts/prove_pokemon_tcgdex_parity_v2.py

      - name: Re-run focused Pokemon physical identity and shard guards
        env:
          PYTHONPATH: .
        run: |
          unset DATABASE_URL DATABASE_URL_UNPOOLED POKEMON_SHARD_INDEX POKEMON_SHARD_COUNT
          pytest -q \
            tests/test_tcgdex_multilingual.py \
            tests/test_tcgdex_physical_scope.py \
            tests/test_tcgdex_en_legacy_incremental.py \
            tests/test_tcgdex_transport_retry.py \
            tests/test_tcgdex_certified_refresh.py \
            tests/test_tcgdex_sharded_refresh.py

      - name: Verify configurable TCGdex endpoint contract
        env:
          PYTHONPATH: .
          TCGDEX_BASE_URL_TEMPLATE: http://127.0.0.1:3000/v2/{lang}
          TCGDEX_SOURCE_MODE: preflight_contract_test
        run: |
          python - <<'PY'
          from app.ingest.connectors.tcgdex_pokemon_multilingual_physical import PhysicalMultilingualTcgdexPokemonConnector
          from app.scripts.run_pokemon_refresh_shard import _configure_tcgdex_endpoint

          selected = _configure_tcgdex_endpoint()
          assert selected == 'http://127.0.0.1:3000/v2/{lang}'
          assert PhysicalMultilingualTcgdexPokemonConnector().base_url_template == selected
          PY

      - name: Freeze and validate official TCGdex fallback image
        id: freeze_tcgdex_fallback
        run: |
          set -euo pipefail
          image='ghcr.io/tcgdex/server:edge'
          docker pull "$image"
          frozen="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          test -n "$frozen"
          echo "image=$frozen" >> "$GITHUB_OUTPUT"
          echo "Frozen official TCGdex fallback image: $frozen"

          docker rm -f tcgdex-preflight >/dev/null 2>&1 || true
          docker run -d \
            --name tcgdex-preflight \
            -p 127.0.0.1:3000:3000 \
            -e CI=1 \
            -e MAX_WORKERS=2 \
            "$frozen" >/dev/null
          trap 'docker rm -f tcgdex-preflight >/dev/null 2>&1 || true' EXIT

          ready=0
          for _attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:3000/ping >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != '1' ]]; then
            docker logs tcgdex-preflight || true
            exit 1
          fi
          for lang in en es ja; do
            curl --silent --show-error --fail --connect-timeout 2 --max-time 15 \
              "http://127.0.0.1:3000/v2/${lang}/series" >/dev/null
          done

  refresh_en:
    name: refresh-en-${{ matrix.shard_name }}-of-10
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - shard_index: 0
            shard_name: 1
          - shard_index: 1
            shard_name: 2
          - shard_index: 2
            shard_name: 3
          - shard_index: 3
            shard_name: 4
          - shard_index: 4
            shard_name: 5
          - shard_index: 5
            shard_name: 6
          - shard_index: 6
            shard_name: 7
          - shard_index: 7
            shard_name: 8
          - shard_index: 8
            shard_name: 9
          - shard_index: 9
            shard_name: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONUNBUFFERED: '1'
      POKEMON_LANGUAGE: en
      POKEMON_SHARD_INDEX: ${{ matrix.shard_index }}
      POKEMON_SHARD_COUNT: '10'
      TCGDEX_FALLBACK_IMAGE: ${{ needs.preflight.outputs.tcgdex_fallback_image }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact dispatched SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify production database secret
        run: test -n "${DATABASE_URL_UNPOOLED}${DATABASE_URL}"

      - name: Select one TCGdex endpoint for this shard
        run: bash scripts/select_tcgdex_endpoint.sh

      - name: Refresh certified EN shard incrementally
        env:
          PYTHONPATH: .
        run: python -m app.scripts.run_pokemon_refresh_shard

      - name: Stop local TCGdex fallback
        if: always()
        run: docker rm -f tcgdex-fallback >/dev/null 2>&1 || true

      - name: Upload EN shard diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-refresh-en-${{ matrix.shard_name }}-of-10-${{ github.run_id }}
          path: backend/pokemon-refresh-diagnostic-en-shard-${{ matrix.shard_index }}-of-10.json
          if-no-files-found: ignore
          retention-days: 7

  refresh_ja:
    name: refresh-ja
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONUNBUFFERED: '1'
      POKEMON_LANGUAGE: ja
      POKEMON_SHARD_INDEX: '0'
      POKEMON_SHARD_COUNT: '1'
      TCGDEX_FALLBACK_IMAGE: ${{ needs.preflight.outputs.tcgdex_fallback_image }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact dispatched SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify production database secret
        run: test -n "${DATABASE_URL_UNPOOLED}${DATABASE_URL}"

      - name: Select one TCGdex endpoint for JA
        run: bash scripts/select_tcgdex_endpoint.sh

      - name: Refresh certified JA physical catalog incrementally
        env:
          PYTHONPATH: .
        run: python -m app.scripts.run_pokemon_refresh_shard

      - name: Stop local TCGdex fallback
        if: always()
        run: docker rm -f tcgdex-fallback >/dev/null 2>&1 || true

      - name: Upload JA refresh diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-refresh-ja-${{ github.run_id }}
          path: backend/pokemon-refresh-diagnostic-ja.json
          if-no-files-found: ignore
          retention-days: 7

  refresh_es:
    name: refresh-es-${{ matrix.shard_name }}-of-10
    needs:
      - preflight
      - refresh_en
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - shard_index: 0
            shard_name: 1
          - shard_index: 1
            shard_name: 2
          - shard_index: 2
            shard_name: 3
          - shard_index: 3
            shard_name: 4
          - shard_index: 4
            shard_name: 5
          - shard_index: 5
            shard_name: 6
          - shard_index: 6
            shard_name: 7
          - shard_index: 7
            shard_name: 8
          - shard_index: 8
            shard_name: 9
          - shard_index: 9
            shard_name: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONUNBUFFERED: '1'
      POKEMON_LANGUAGE: es
      POKEMON_SHARD_INDEX: ${{ matrix.shard_index }}
      POKEMON_SHARD_COUNT: '10'
      TCGDEX_FALLBACK_IMAGE: ${{ needs.preflight.outputs.tcgdex_fallback_image }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact dispatched SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify production database secret
        run: test -n "${DATABASE_URL_UNPOOLED}${DATABASE_URL}"

      - name: Select one TCGdex endpoint for this shard
        run: bash scripts/select_tcgdex_endpoint.sh

      - name: Refresh certified ES shard incrementally
        env:
          PYTHONPATH: .
        run: python -m app.scripts.run_pokemon_refresh_shard

      - name: Stop local TCGdex fallback
        if: always()
        run: docker rm -f tcgdex-fallback >/dev/null 2>&1 || true

      - name: Upload ES shard diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-refresh-es-${{ matrix.shard_name }}-of-10-${{ github.run_id }}
          path: backend/pokemon-refresh-diagnostic-es-shard-${{ matrix.shard_index }}-of-10.json
          if-no-files-found: ignore
          retention-days: 7

  parity:
    name: parity
    needs:
      - preflight
      - refresh_en
      - refresh_es
      - refresh_ja
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONUNBUFFERED: '1'
      POKEMON_LANGUAGE: en
      TCGDEX_FALLBACK_IMAGE: ${{ needs.preflight.outputs.tcgdex_fallback_image }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact dispatched SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify production database secret
        run: test -n "${DATABASE_URL_UNPOOLED}${DATABASE_URL}"

      - name: Select one TCGdex endpoint for parity
        run: bash scripts/select_tcgdex_endpoint.sh

      - name: Prove fresh TCGdex physical source parity in production
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import time

          import requests

          from app.scripts.prove_pokemon_tcgdex_parity_v2 import main

          for attempt in range(1, 4):
              try:
                  main()
                  break
              except (requests.exceptions.Timeout, requests.exceptions.ConnectionError) as exc:
                  if attempt == 3:
                      raise
                  wait_seconds = 5 * (2 ** (attempt - 1))
                  print(json.dumps({
                      'event': 'pokemon_parity_transport_retry',
                      'attempt': attempt,
                      'wait_seconds': wait_seconds,
                      'error_type': type(exc).__name__,
                  }, sort_keys=True), flush=True)
                  time.sleep(wait_seconds)
          PY

      - name: Stop local TCGdex fallback
        if: always()
        run: docker rm -f tcgdex-fallback >/dev/null 2>&1 || true
