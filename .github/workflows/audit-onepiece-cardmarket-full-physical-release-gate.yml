name: Audit One Piece Cardmarket Full Physical Release Gate

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-onepiece-cardmarket-full-physical-release-gate.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary
      - run: |
          python - <<'PY'
          import json,os,re,unicodedata
          from collections import defaultdict,Counter
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          def norm(v):
            v=unicodedata.normalize('NFKD',str(v or ''))
            v=''.join(c for c in v if not unicodedata.combining(c)).casefold().replace('’',"'").replace('&',' and ')
            return re.sub(r'\s+',' ',re.sub(r'[^a-z0-9]+',' ',v)).strip()
          def release_core(name):
            raw=re.sub(r'\s*\[[^\]]+\]\s*$','',str(name or '').strip()).strip()
            m=re.match(r'^(?:BOOSTER PACK|STARTER DECK|EXTRA BOOSTER|PREMIUM BOOSTER|ULTIMATE DECK)\s*-(.+)-\s*$',raw,flags=re.I)
            return norm(m.group(1) if m else raw)
          def sealed_bases(name):
            raw=str(name or '').strip(); out={norm(raw)}
            for prefix in ('Starter Deck: ','Ultimate Deck: '):
              if raw.casefold().startswith(prefix.casefold()):out.add(norm(raw[len(prefix):]))
            for pat in (r'\s+Booster Box Case\s*\(.*\)$',r'\s+Booster Box$',r'\s+Sleeved Booster$',r'\s+Booster Display$',r'\s+Booster$',r'\s*:\s*Pre-Release Pack$'):
              x=re.sub(pat,'',raw,flags=re.I).strip()
              if x!=raw:out.add(norm(x))
            return {x for x in out if x}

          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          report={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='onepiece'");gid=int(cur.fetchone()['id'])
              cur.execute("SELECT max(last_seen_at) latest FROM external_catalog_products WHERE source='cardmarket'");latest=cur.fetchone()['latest']
              cur.execute("SELECT id,external_id,name FROM catalog_releases WHERE game_id=%s AND source='onepiece_official'",(gid,))
              rels=[dict(r) for r in cur.fetchall()]; idx=defaultdict(list); meta={}
              for r in rels:
                rid=int(r['id']);meta[rid]={'external_id':str(r['external_id']),'name':r['name']};idx[release_core(r['name'])].append(r)

              # Independent release proof from Cardmarket sealed product names.
              cur.execute("SELECT external_id,expansion_external_id,name,category FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s AND product_group='non_single' AND last_seen_at=%s",(gid,latest))
              byexp=defaultdict(list)
              for r in cur.fetchall():byexp[str(r['expansion_external_id'] or '')].append(dict(r))
              exp_rel={}; exp_evidence={}; conflicts={}
              for exp,items in byexp.items():
                votes=defaultdict(list)
                for item in items:
                  for base in sealed_bases(item['name']):
                    ms=idx.get(base,[])
                    if len(ms)==1:
                      rid=int(ms[0]['id']);votes[rid].append({'idProduct':str(item['external_id']),'name':item['name'],'category':item['category'],'matched_core':base})
                if len(votes)==1:
                  rid=next(iter(votes));exp_rel[exp]=rid;exp_evidence[exp]=votes[rid]
                elif len(votes)>1:conflicts[exp]={str(r):v for r,v in votes.items()}
              report['sealed_derived_release_expansions']=len(exp_rel);report['sealed_expansion_conflicts']=len(conflicts)
              report['release_bridge']={e:{'release_id':r,'release':meta.get(r),'evidence':exp_evidence[e][:5]} for e,r in exp_rel.items()}

              cur.execute('''SELECT pr.print_id,cr.id release_id FROM print_releases pr JOIN catalog_releases cr ON cr.id=pr.release_id
                             JOIN prints p ON p.id=pr.print_id JOIN cards c ON c.id=p.card_id WHERE c.game_id=%s''',(gid,))
              memberships=defaultdict(set)
              for r in cur.fetchall():memberships[int(r['print_id'])].add(int(r['release_id']))

              cur.execute('''SELECT l.id link_id,l.print_id,l.mapping_method,l.confidence,l.evidence,l.external_product_id,
                                    e.external_id id_product,e.expansion_external_id,e.name market_name,e.website_path,
                                    p.collector_number,p.variant,p.rarity,c.name card_name
                             FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                             JOIN prints p ON p.id=l.print_id JOIN cards c ON c.id=p.card_id
                             WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status IN ('accepted','mapped','exact')
                             ORDER BY l.print_id''',(gid,))
              rows=[dict(r) for r in cur.fetchall()]
              counts=Counter();method_counts=defaultdict(Counter);classified=[]
              for x in rows:
                exp=str(x.get('expansion_external_id') or ''); rid=exp_rel.get(exp); official=sorted(memberships.get(int(x['print_id']),set()))
                if x['mapping_method']=='bandai_release_exact': cls='direct_release_exact'
                elif rid is None: cls='release_unproven'
                elif rid in official: cls='release_consistent'
                else: cls='release_mismatch'
                counts[cls]+=1;method_counts[x['mapping_method']][cls]+=1
                classified.append({**x,'classification':cls,'sealed_derived_release_id':rid,'sealed_derived_release':meta.get(rid),'official_release_ids':official,'official_releases':[{'id':r,**meta.get(r,{})} for r in official]})
              report['accepted_total']=len(rows);report['classification']=dict(counts);report['by_method']={m:dict(c) for m,c in method_counts.items()}
              report['release_mismatches']=[x for x in classified if x['classification']=='release_mismatch']
              report['release_unproven_sample']=[x for x in classified if x['classification']=='release_unproven'][:500]

              # User-reported print and exact candidate inside sealed-proven Pillars release.
              target=next((x for x in classified if int(x['print_id'])==44257),None);report['target_current']=target
              target_release=78
              pillar_exp=[e for e,r in exp_rel.items() if r==target_release]
              report['pillars_expansion_ids']=pillar_exp
              cur.execute('''SELECT id external_product_id,external_id id_product,name,expansion_external_id,website_path,metacard_external_id
                             FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s AND product_group='single' AND last_seen_at=%s
                               AND upper(name) LIKE '%%ST01-012%%' AND expansion_external_id=ANY(%s)
                             ORDER BY external_id''',(gid,latest,pillar_exp or ['__none__']))
              report['target_pillars_candidates']=[dict(r) for r in cur.fetchall()]
          finally:conn.close()
          p=Path('/tmp/op-full-physical-release-gate.json');p.write_text(json.dumps(report,indent=2,default=str,sort_keys=True)+'\n')
          print(json.dumps({'sealed_derived_release_expansions':report['sealed_derived_release_expansions'],'sealed_expansion_conflicts':report['sealed_expansion_conflicts'],'accepted_total':report['accepted_total'],'classification':report['classification'],'by_method':report['by_method'],'pillars_expansion_ids':report['pillars_expansion_ids'],'target_current':report['target_current'],'target_pillars_candidates':report['target_pillars_candidates']},indent=2,default=str,sort_keys=True))
          PY
      - name: Persist
        run: |
          mkdir -p audit-reports
          cp /tmp/op-full-physical-release-gate.json audit-reports/onepiece-cardmarket-full-physical-release-gate.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/onepiece-cardmarket-full-physical-release-gate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record One Piece full physical release gate'
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op-full-physical-release-gate-${{ github.run_id }}
          path: /tmp/op-full-physical-release-gate.json
          retention-days: 90
