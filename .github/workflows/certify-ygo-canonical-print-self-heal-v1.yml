name: Certify YGO Canonical Print Self-Heal V1

on:
  push:
    branches: ['fix/ygo-canonical-print-self-heal-v1']
    paths:
      - 'backend/app/ingest/connectors/ygoprodeck_yugioh_v2.py'
      - 'backend/app/scripts/reconcile_yugioh_canonical_prints_v1.py'
      - 'backend/tests/test_yugioh_canonical_print_self_heal_v1.py'
      - '.github/workflows/certify-ygo-canonical-print-self-heal-v1.yml'
  pull_request:
    branches: [catalog-v2]
    paths:
      - 'backend/app/ingest/connectors/ygoprodeck_yugioh_v2.py'
      - 'backend/app/scripts/reconcile_yugioh_canonical_prints_v1.py'
      - 'backend/tests/test_yugioh_canonical_print_self_heal_v1.py'
      - '.github/workflows/certify-ygo-canonical-print-self-heal-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certify-ygo-canonical-print-self-heal-v1
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ''
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Prove self-heal and snapshot growth guards
        run: pytest -q tests/test_yugioh_canonical_print_self_heal_v1.py tests/test_yugioh_v2_snapshot_growth_guard.py
      - name: Dry-run current exact canonical Print repair
        run: |
          rm -rf /tmp/ygo-self-heal-preflight evidence
          mkdir -p evidence
          python -m app.scripts.reconcile_yugioh_canonical_prints_v1 \
            --output-dir /tmp/ygo-self-heal-preflight \
            --report evidence/ygo-self-heal-preflight-v1.json \
            --max-writes 500
      - name: Capture production invariants before write
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          engine=create_engine(os.environ['DATABASE_URL_UNPOOLED'])
          with engine.connect() as conn:
              gid=conn.execute(text("SELECT id FROM games WHERE slug='yugioh' LIMIT 1")).scalar_one()
              report={
                  'ygo_cards': conn.execute(text('SELECT count(*) FROM cards WHERE game_id=:g'),{'g':gid}).scalar_one(),
                  'ygo_sets': conn.execute(text('SELECT count(*) FROM sets WHERE game_id=:g'),{'g':gid}).scalar_one(),
                  'ygo_prints': conn.execute(text('SELECT count(*) FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=:g'),{'g':gid}).scalar_one(),
                  'prices': conn.execute(text('SELECT count(*) FROM prices')).scalar_one(),
                  'price_snapshots': conn.execute(text('SELECT count(*) FROM price_snapshots')).scalar_one(),
                  'print_images': conn.execute(text('SELECT count(*) FROM print_images')).scalar_one(),
                  'product_variants': conn.execute(text('SELECT count(*) FROM product_variants')).scalar_one(),
              }
          Path('evidence/ygo-self-heal-invariants-before-v1.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Apply bounded exact canonical Print repair
        env:
          YUGIOH_CANONICAL_PRINT_RECONCILE_ACK: YGO_CANONICAL_PRINTS_V1
        run: |
          rm -rf /tmp/ygo-self-heal-apply
          python -m app.scripts.reconcile_yugioh_canonical_prints_v1 \
            --output-dir /tmp/ygo-self-heal-apply \
            --report evidence/ygo-self-heal-apply-v1.json \
            --max-writes 500 \
            --apply
      - name: Require idempotent zero-write second pass
        run: |
          rm -rf /tmp/ygo-self-heal-idempotent
          python -m app.scripts.reconcile_yugioh_canonical_prints_v1 \
            --output-dir /tmp/ygo-self-heal-idempotent \
            --report evidence/ygo-self-heal-idempotent-v1.json \
            --max-writes 0
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/ygo-self-heal-idempotent-v1.json').read_text())
          if report['missing_before'] != 0 or report['planned_writes'] != 0 or report['missing_after'] != 0:
              raise SystemExit(f'idempotency failed: {report}')
          PY
      - name: Prove source parity, search indexing and unchanged non-target invariants
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          before=json.loads(Path('evidence/ygo-self-heal-invariants-before-v1.json').read_text())
          applied=json.loads(Path('evidence/ygo-self-heal-apply-v1.json').read_text())
          source_rows=[json.loads(line) for line in Path('/tmp/ygo-self-heal-idempotent/prints.jsonl').read_text().splitlines() if line.strip()]
          source_keys={str(row['print_key']) for row in source_rows}
          source_cards={str(row['source_card_id']) for row in source_rows}
          source_sets={str(row['set_family']).lower() for row in source_rows}

          engine=create_engine(os.environ['DATABASE_URL_UNPOOLED'])
          with engine.connect() as conn:
              gid=conn.execute(text("SELECT id FROM games WHERE slug='yugioh' LIMIT 1")).scalar_one()
              db_keys={str(v) for v in conn.execute(text('''
                  SELECT p.print_key FROM prints p JOIN cards c ON c.id=p.card_id
                  WHERE c.game_id=:g AND p.print_key IS NOT NULL
              '''),{'g':gid}).scalars()}
              db_card_ids={str(v) for v in conn.execute(text("SELECT yugoprodeck_id FROM cards WHERE game_id=:g AND yugoprodeck_id IS NOT NULL"),{'g':gid}).scalars()}
              db_sets={str(v).lower() for v in conn.execute(text("SELECT code FROM sets WHERE game_id=:g"),{'g':gid}).scalars()}
              missing_search=conn.execute(text('''
                  SELECT count(*)
                  FROM prints p
                  JOIN cards c ON c.id=p.card_id
                  LEFT JOIN search_documents sd ON sd.doc_type='print' AND sd.object_id=p.id
                  WHERE c.game_id=:g AND p.print_key = ANY(:keys) AND sd.id IS NULL
              '''),{'g':gid,'keys':list(source_keys)}).scalar_one()
              after={
                  'ygo_cards': conn.execute(text('SELECT count(*) FROM cards WHERE game_id=:g'),{'g':gid}).scalar_one(),
                  'ygo_sets': conn.execute(text('SELECT count(*) FROM sets WHERE game_id=:g'),{'g':gid}).scalar_one(),
                  'ygo_prints': conn.execute(text('SELECT count(*) FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=:g'),{'g':gid}).scalar_one(),
                  'prices': conn.execute(text('SELECT count(*) FROM prices')).scalar_one(),
                  'price_snapshots': conn.execute(text('SELECT count(*) FROM price_snapshots')).scalar_one(),
                  'print_images': conn.execute(text('SELECT count(*) FROM print_images')).scalar_one(),
                  'product_variants': conn.execute(text('SELECT count(*) FROM product_variants')).scalar_one(),
              }

          failures=[]
          if source_keys-db_keys: failures.append(f'missing source print_keys={len(source_keys-db_keys)}')
          if source_cards-db_card_ids: failures.append(f'missing source cards={len(source_cards-db_card_ids)}')
          if source_sets-db_sets: failures.append(f'missing source sets={len(source_sets-db_sets)}')
          if missing_search: failures.append(f'missing search docs={missing_search}')
          writes=int(applied['canonical_print_writes'])
          if after['ygo_prints']-before['ygo_prints'] != writes:
              failures.append(f"unexpected ygo print delta={after['ygo_prints']-before['ygo_prints']} writes={writes}")
          for key in ('ygo_cards','ygo_sets','prices','price_snapshots','print_images','product_variants'):
              if after[key] != before[key]: failures.append(f'{key} changed {before[key]}->{after[key]}')

          report={
              'status':'pass' if not failures else 'fail',
              'source_prints':len(source_keys),
              'source_cards':len(source_cards),
              'source_sets':len(source_sets),
              'applied_writes':writes,
              'missing_source_prints':len(source_keys-db_keys),
              'missing_source_cards':len(source_cards-db_card_ids),
              'missing_source_sets':len(source_sets-db_sets),
              'missing_search_documents':int(missing_search),
              'before':before,
              'after':after,
              'failures':failures,
          }
          Path('evidence/ygo-self-heal-postwrite-cert-v1.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          if failures: raise SystemExit('postwrite certification failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-canonical-print-self-heal-v1-${{ github.run_id }}
          path: backend/evidence/*
          retention-days: 30
          if-no-files-found: error
