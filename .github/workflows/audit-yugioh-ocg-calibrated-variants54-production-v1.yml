name: Audit Yu-Gi-Oh OCG Calibrated Variants54 Production V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_calibrated_variants54_production_v1.py'
      - '.github/workflows/audit-yugioh-ocg-calibrated-variants54-production-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_CALIBRATED_VARIANTS54_PROOF_OUTPUT: /tmp/ygo-ocg-calibrated-variants54-proof/production.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile corrected writer and independent production proof
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_calibrated_variants54_v2.py
          python -m py_compile app/scripts/audit_yugioh_ocg_calibrated_variants54_production_v1.py
      - name: READ ONLY certify 54 exact calibrated identities and exact-idProduct prices
        run: |
          mkdir -p /tmp/ygo-ocg-calibrated-variants54-proof
          python -m app.scripts.audit_yugioh_ocg_calibrated_variants54_production_v1
      - name: Require production proof PASS
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-calibrated-variants54-proof/production.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['stable_identity_sha256']=='f864e644d3b27e8adcf0a09bdb124a4735736b72134c719e5ff9931664efa72e',p
          assert p['accepted_links']==54 and p['unique_products']==54 and p['unique_prints']==54,p
          assert len(p['sets'])==5,p
          assert all(r['wrong_language']==0 and r['wrong_set']==0 and r['wrong_method']==0 and r['stale']==0 for r in p['sets'].values()),p
          q=p['pricing']; assert q['canonical_current_wrong_idProduct']==0,p
          assert q['canonical_current_exact_idProduct_prices']==q['externally_priceable_links'],p
          print(json.dumps({'identity':'54/54','pricing':q},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-calibrated-variants54-production-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-calibrated-variants54-proof/*.json
          retention-days: 90
          if-no-files-found: warn
