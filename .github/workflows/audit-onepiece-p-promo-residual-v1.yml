name: Audit One Piece P Promo Residual V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_onepiece_p_promo_residual_v1.py'
      - '.github/workflows/audit-onepiece-p-promo-residual-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      ONEPIECE_HTTP_TIMEOUT: '30'
      ONEPIECE_P_PROMO_RESIDUAL_OUTPUT: /tmp/onepiece-p-promo-residual-v1.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/scripts/audit_onepiece_p_promo_residual_v1.py
      - name: Cross-check 22 missing promo collectors against official EN and JP READ ONLY
        run: python -m app.scripts.audit_onepiece_p_promo_residual_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-p-promo-residual-v1-${{ github.run_id }}
          path: /tmp/onepiece-p-promo-residual-v1.json
          retention-days: 90
          if-no-files-found: error
