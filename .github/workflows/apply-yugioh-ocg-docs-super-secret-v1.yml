name: Apply Yu-Gi-Oh OCG DOCS Super Secret V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/yugioh_ocg_docs_super_secret_manifest_v1.py'
      - 'backend/app/scripts/apply_yugioh_ocg_docs_super_secret_v1.py'
      - '.github/workflows/apply-yugioh-ocg-docs-super-secret-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/yugioh_ocg_docs_super_secret_manifest_v1.py'
      - 'backend/app/scripts/apply_yugioh_ocg_docs_super_secret_v1.py'
      - '.github/workflows/apply-yugioh-ocg-docs-super-secret-v1.yml'

permissions:
  contents: read

concurrency:
  group: yugioh-ocg-docs-super-secret-v1
  cancel-in-progress: false

jobs:
  exact-links:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile frozen DOCS manifest, writer and price projector
        run: |
          python -m py_compile app/scripts/yugioh_ocg_docs_super_secret_manifest_v1.py
          python -m py_compile app/scripts/apply_yugioh_ocg_docs_super_secret_v1.py
          python -m py_compile scripts/project_cardmarket_link_prices.py
      - name: READ ONLY rebuild exact frozen 20-link DOCS proposal
        run: |
          mkdir -p /tmp/ygo-ocg-docs-super-secret-apply
          python -m app.scripts.apply_yugioh_ocg_docs_super_secret_v1 --report /tmp/ygo-ocg-docs-super-secret-apply/proposal.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-docs-super-secret-apply/proposal.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['evidence_sha256']=='73ad75d60ca1ab0c2fa4c647d98f8e9bc1e8be4b75f1a911ac6085fd8852dd0f',p
          assert p['pair_manifest_sha256']=='e2df7294e917f4b07a8f054775273715169ec70f2acf59691bc0b8fcf9c4e268',p
          assert p['certified_pairs']==20,p
          assert p['candidate_groups']==10,p
          assert p['already_accepted_same_pair'] in (0,20),p
          assert p['new_links_ready'] in (0,20),p
          assert p['already_accepted_same_pair']+p['new_links_ready']==20,p
          if '${{ github.event_name }}' == 'pull_request':
              assert p['already_accepted_same_pair']==0,p
              assert p['new_links_ready']==20,p
              assert p['regional_accepted_before_or_after']==88,p
          print(json.dumps({'dry_run':'pass','existing':p['already_accepted_same_pair'],'new':p['new_links_ready'],'DOCS_accepted':p['regional_accepted_before_or_after']},indent=2))
          PY
      - name: Atomically apply final 20 DOCS Super Secret links
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_docs_super_secret_v1 --apply --confirm APPLY_YUGIOH_OCG_DOCS_SUPER_SECRET_V1 --report /tmp/ygo-ocg-docs-super-secret-apply/applied.json
      - name: Project Yu-Gi-Oh Cardmarket prices from exact linked idProducts
        if: github.event_name == 'push'
        run: python scripts/project_cardmarket_link_prices.py --game yugioh --apply --report /tmp/ygo-ocg-docs-super-secret-apply/projection.json
      - name: Prove writer idempotency and complete DOCS regional identity
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_docs_super_secret_v1 --apply --confirm APPLY_YUGIOH_OCG_DOCS_SUPER_SECRET_V1 --report /tmp/ygo-ocg-docs-super-secret-apply/idempotency.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-docs-super-secret-apply/idempotency.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['already_accepted_same_pair']==20,p
          assert p['new_links_ready']==0,p
          assert p['regional_accepted_before_or_after']==108,p
          print(json.dumps({'idempotency':'pass','exact_new_method_links':20,'DOCS_accepted':108},indent=2))
          PY
      - name: Final exact DOCS regional one-to-one proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          method='cardmarket_ocg_certified_public_super_secret_contract_v1'
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'],connect_timeout=30,application_name='dontripit_ygo_docs_super_secret_final_v1'); conn.set_session(readonly=True,autocommit=False)
          out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='yugioh' LIMIT 1"); gid=int(cur.fetchone()['id'])
              cur.execute("SELECT max(last_seen_at) capture FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s",(gid,)); capture=cur.fetchone()['capture']
              cur.execute("""SELECT count(*) total,count(DISTINCT l.external_product_id) products,count(DISTINCT l.print_id) prints,
                    count(*) FILTER (WHERE lower(coalesce(p.language,''))='ja' AND upper(coalesce(s.code,''))='DOCS') good,
                    count(*) FILTER (WHERE e.last_seen_at=%s) current,
                    count(*) FILTER (WHERE l.mapping_method=%s AND l.confidence='exact' AND l.reviewed=true) method_good
                  FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN prints p ON p.id=l.print_id JOIN sets s ON s.id=p.set_id
                  WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND e.expansion_external_id='4680' AND l.link_status IN ('accepted','mapped','exact')""",(capture,method,gid)); x=cur.fetchone()
              vals=(int(x['total']),int(x['products']),int(x['prints']),int(x['good']),int(x['current']))
              assert vals==(108,108,108,108,108),vals
              assert int(x['method_good'])==20,x
              out={'status':'pass','DOCS_products':108,'DOCS_JA_prints':108,'accepted_exact_links':108,'new_super_secret_contract_links':20,'mapping_method':method}; conn.rollback()
          finally: conn.close()
          open('/tmp/ygo-ocg-docs-super-secret-apply/final.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-docs-super-secret-apply-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-docs-super-secret-apply/*.json
          retention-days: 90
          if-no-files-found: warn
