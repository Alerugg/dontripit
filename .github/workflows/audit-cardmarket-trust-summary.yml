name: Audit Cardmarket Trust Summary

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-cardmarket-trust-summary.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary
      - run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor
          A=['accepted','mapped','exact']
          conn=psycopg2.connect(os.environ['DATABASE_URL_UNPOOLED']);out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id,slug FROM games WHERE slug IN ('mtg','pokemon','yugioh','onepiece') ORDER BY slug")
              games=[dict(r) for r in cur.fetchall()]
              cur.execute("SELECT id FROM price_sources WHERE name='cardmarket'"); sid=int(cur.fetchone()['id'])
              for g in games:
                gid=int(g['id']);d={}
                cur.execute('''SELECT l.mapping_method,l.confidence,l.reviewed,count(*) links,count(DISTINCT l.print_id) prints,
                                      count(DISTINCT l.external_product_id) products,
                                      array_agg(DISTINCT coalesce(l.evidence->>'source','')) evidence_sources,
                                      array_agg(DISTINCT coalesce(l.evidence->>'source_kind','')) source_kinds,
                                      array_agg(DISTINCT coalesce(l.evidence->>'source_field','')) source_fields
                               FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                               WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)
                               GROUP BY l.mapping_method,l.confidence,l.reviewed ORDER BY links DESC''',(gid,A))
                d['methods']=[dict(r) for r in cur.fetchall()]
                cur.execute('''SELECT count(*) n FROM (
                                 SELECT l.print_id FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                                 WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)
                                 GROUP BY l.print_id HAVING count(DISTINCT e.id)<>1
                               ) q''',(gid,A));d['ambiguous_prints']=int(cur.fetchone()['n'])
                cur.execute('''WITH accepted AS (
                                 SELECT l.print_id,min(e.external_id) id_product,count(DISTINCT e.id) n
                                 FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                                 WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)
                                 GROUP BY l.print_id
                               ), latest AS (
                                 SELECT DISTINCT ON (ps.entity_id) ps.entity_id print_id,ps.raw_json
                                 FROM price_snapshots ps JOIN prints p ON p.id=ps.entity_id JOIN cards c ON c.id=p.card_id
                                 WHERE ps.source_id=%s AND ps.entity_type='print' AND c.game_id=%s ORDER BY ps.entity_id,ps.as_of DESC,ps.id DESC
                               )
                               SELECT count(*) n FROM latest l LEFT JOIN accepted a ON a.print_id=l.print_id
                               WHERE a.print_id IS NULL OR a.n<>1 OR coalesce(l.raw_json->>'idProduct','')<>coalesce(a.id_product,'')''',(gid,A,sid,gid));d['stale_or_mismatched_latest_snapshots']=int(cur.fetchone()['n'])
                cur.execute('''SELECT count(DISTINCT l.print_id) prints,count(*) links FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                               WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)''',(gid,A));d['accepted']=dict(cur.fetchone())
                out[g['slug']]=d
          finally:conn.close()
          p=Path('/tmp/cardmarket-trust-summary.json');p.write_text(json.dumps(out,indent=2,default=str,sort_keys=True)+'\n');print(p.read_text())
          PY
      - name: Persist
        run: |
          mkdir -p audit-reports
          cp /tmp/cardmarket-trust-summary.json audit-reports/cardmarket-trust-summary.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/cardmarket-trust-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Cardmarket trust summary'
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-trust-summary-${{ github.run_id }}
          path: /tmp/cardmarket-trust-summary.json
          retention-days: 90
