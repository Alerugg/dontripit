name: Certify Yu-Gi-Oh V2 Incremental Maintenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/ingest/connectors/ygoprodeck_yugioh_v2.py'
      - 'backend/tests/test_ygoprodeck_incremental_v2.py'
      - 'backend/tests/test_yugioh_v2_incremental_maintenance.py'
      - '.github/workflows/certify-yugioh-v2-incremental-maintenance.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile Yu-Gi-Oh V2 connector
        run: python -m py_compile app/ingest/connectors/ygoprodeck_yugioh_v2.py
      - name: Prove incremental fetch and maintenance contracts
        run: |
          pytest -q \
            tests/test_ygoprodeck_incremental_v2.py \
            tests/test_yugioh_v2_incremental_maintenance.py
