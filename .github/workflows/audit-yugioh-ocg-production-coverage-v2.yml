name: Audit Yu-Gi-Oh OCG Production Coverage V2

# Fresh checkpoint after the independently certified 205-link BE01 rollout.
on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_production_coverage_v2.py'
      - '.github/workflows/audit-yugioh-ocg-production-coverage-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_PRODUCTION_COVERAGE_V2_OUTPUT: /tmp/ygo-ocg-production-coverage-v2/report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile global production coverage V2 auditor
        run: python -m py_compile app/scripts/audit_yugioh_ocg_production_coverage_v2.py
      - name: READ ONLY rebuild complete current OCG coverage and candidate inventory
        run: |
          mkdir -p /tmp/ygo-ocg-production-coverage-v2
          python -m app.scripts.audit_yugioh_ocg_production_coverage_v2
      - name: Require identity and pricing safety invariants
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-production-coverage-v2/report.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_physical_baseline']==36426,p
          assert p['accepted_cardmarket_ja_links']==p['accepted_unique_products']==p['accepted_unique_prints'],p
          assert p['accepted_stale_links']==0,p
          assert p['pricing']['canonical_current_wrong_idProduct']==0,p
          assert p['complete_sets']+p['partial_sets']+p['unmapped_sets']==p['ja_set_count'],p
          print(json.dumps({
            'accepted_JA_links':p['accepted_cardmarket_ja_links'],
            'coverage_pct':p['coverage_pct'],
            'complete_sets':p['complete_sets'],
            'partial_sets':p['partial_sets'],
            'unmapped_sets':p['unmapped_sets'],
            'externally_priceable':p['pricing']['externally_priceable_links'],
            'canonically_exact_priced':p['pricing']['canonical_current_exact_idProduct_prices'],
            'price_projection_gap':p['pricing'].get('price_projection_gap',0),
            'high_confidence_candidates':len(p['high_confidence_surface_candidates']),
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-production-coverage-v2-${{ github.run_id }}
          path: /tmp/ygo-ocg-production-coverage-v2/report.json
          retention-days: 90
          if-no-files-found: error
