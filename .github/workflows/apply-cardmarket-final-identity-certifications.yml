name: Apply Cardmarket Final Identity Certifications

on:
  workflow_dispatch:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/apply-cardmarket-final-identity-certifications.yml']

permissions:
  contents: write

concurrency:
  group: apply-cardmarket-final-identity-certifications
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Certify YGO official subreleases and Pokemon legacy exceptions
        run: |
          python - <<'PY'
          import json,os,re,unicodedata
          from collections import defaultdict,Counter
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor,Json
          A=('accepted','mapped','exact')
          def norm(v):
            s=unicodedata.normalize('NFKD',str(v or '')).casefold();s=''.join(c for c in s if not unicodedata.combining(c))
            return re.sub(r'\s+',' ',re.sub(r'[^a-z0-9]+',' ',s)).strip()
          EXPECTED_YGO={
            '1078':(1,"structure deck dinosaur's rage special edition"),
            '1488':(15,'super starter space-time showdown power-up pack'),
            '1517':(6,'noble knights of the round table box set power-up pack'),
            '1657':(4,'clash of rebellions special edition'),
            '1677':(4,'dimension of chaos special edition'),
            '1712':(2,'the dark illusion special edition'),
            '2429':(6,'duel power variant cards'),
            '2844':(5,'speed duel: trials of the kingdom sneak peak'),
          }
          EXPECTED_POKEMON={53078:'278574',53375:'277439',53424:'277488',63858:'297277'}
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL']);conn.autocommit=False
          report={'yugioh':{},'pokemon':{}}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              # YGO: identify exactly the 43 rows already proven to belong to official subproducts nested by Cardmarket.
              cur.execute("SELECT id FROM games WHERE slug='yugioh'");ygid=int(cur.fetchone()['id'])
              cur.execute("SELECT id,external_id,name FROM catalog_releases WHERE game_id=%s AND source='konami_neuron'",(ygid,))
              relmeta={int(r['id']):dict(r) for r in cur.fetchall()}
              cur.execute("SELECT print_id,release_id FROM print_releases pr JOIN catalog_releases cr ON cr.id=pr.release_id WHERE cr.game_id=%s AND cr.source='konami_neuron'",(ygid,))
              memberships=defaultdict(set)
              for r in cur.fetchall():memberships[int(r['print_id'])].add(int(r['release_id']))
              cur.execute("""SELECT l.id link_id,l.print_id,l.external_product_id,l.evidence,e.external_id id_product,e.expansion_external_id,e.name market_name,
                    p.collector_number,p.rarity,p.variant,p.language,c.name card_name,s.code set_code
                FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                JOIN prints p ON p.id=l.print_id JOIN cards c ON c.id=p.card_id JOIN sets s ON s.id=p.set_id
                WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)
                  AND l.mapping_method='sealed_expansion_exact_name' AND e.expansion_external_id=ANY(%s)
                ORDER BY e.expansion_external_id,p.collector_number""",(ygid,list(A),list(EXPECTED_YGO)))
              candidates=[];counts=Counter()
              for r in cur.fetchall():
                exp=str(r['expansion_external_id']);official=memberships.get(int(r['print_id']),set())
                matching=[]
                for rid in official:
                  meta=relmeta.get(rid)
                  if meta and norm(EXPECTED_YGO[exp][1]) in norm(meta['name']): matching.append(rid)
                if matching:
                  if len(matching)!=1:raise AssertionError({'reason':'multiple expected official subreleases','print_id':r['print_id'],'release_ids':matching})
                  candidates.append((dict(r),matching[0]));counts[exp]+=1
              expected_total=sum(v[0] for v in EXPECTED_YGO.values())
              if len(candidates)!=expected_total or any(counts[k]!=v[0] for k,v in EXPECTED_YGO.items()):
                raise AssertionError({'reason':'YGO subrelease certification regression','expected_total':expected_total,'actual':len(candidates),'counts':dict(counts)})
              # Ensure each target is still globally 1:1 accepted before changing metadata.
              pids=[int(r['print_id']) for r,_ in candidates];eids=[int(r['external_product_id']) for r,_ in candidates]
              cur.execute("""SELECT print_id,count(DISTINCT external_product_id) n FROM external_catalog_print_links
                WHERE print_id=ANY(%s) AND link_status=ANY(%s) GROUP BY print_id HAVING count(DISTINCT external_product_id)<>1""",(pids,list(A)))
              if cur.fetchall():raise AssertionError('YGO target Print is not globally one-to-one')
              cur.execute("""SELECT external_product_id,count(DISTINCT print_id) n FROM external_catalog_print_links
                WHERE external_product_id=ANY(%s) AND link_status=ANY(%s) GROUP BY external_product_id HAVING count(DISTINCT print_id)<>1""",(eids,list(A)))
              if cur.fetchall():raise AssertionError('YGO target Cardmarket product is not globally one-to-one')
              ygo_details=[]
              for r,rid in candidates:
                old=r['evidence'] if isinstance(r['evidence'],dict) else {}
                official=relmeta[rid]
                ev={**old,
                    'certification':'konami_official_subrelease_exact',
                    'certification_reason':'Cardmarket expansion groups the official subrelease inside its broader commercial expansion; exact unique card identity remains one-to-one',
                    'official_konami_release_id':rid,'official_konami_pid':str(official['external_id']),'official_konami_release_name':official['name'],
                    'collector_number':r['collector_number'],'rarity':r['rarity'],'variant':r['variant'],'cardmarket_idProduct':str(r['id_product']),'cardmarket_expansion_id':str(r['expansion_external_id'])}
                cur.execute("UPDATE external_catalog_print_links SET mapping_method='ygo_konami_subrelease_exact',confidence='exact',reviewed=true,evidence=%s,updated_at=now() WHERE id=%s",(Json(ev),int(r['link_id'])))
                ygo_details.append({'print_id':int(r['print_id']),'idProduct':str(r['id_product']),'expansion':str(r['expansion_external_id']),'collector_number':r['collector_number'],'card_name':r['card_name'],'official_pid':str(official['external_id']),'official_release':official['name']})
              report['yugioh']={'certified':len(ygo_details),'by_expansion':dict(counts),'details':ygo_details}

              # Pokemon: certify four legacy rows semantically against the current Cardmarket catalog.
              cur.execute("SELECT id FROM games WHERE slug='pokemon'");pgid=int(cur.fetchone()['id'])
              pokemon=[]
              for print_id,correct_id in EXPECTED_POKEMON.items():
                cur.execute("""SELECT l.id link_id,l.evidence,e.external_id id_product,e.name market_name,p.collector_number,p.variant,c.name card_name,s.code set_code,pi.external_id legacy_id,
                      pa.attributes_json #>> '{physical_variant,third_party,cardmarket}' tcgdex_physical_id,
                      pa.attributes_json #>> '{third_party,cardmarket}' tcgdex_card_id
                  FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                  JOIN prints p ON p.id=l.print_id JOIN cards c ON c.id=p.card_id JOIN sets s ON s.id=p.set_id
                  LEFT JOIN print_identifiers pi ON pi.print_id=p.id AND pi.source='cardmarket'
                  LEFT JOIN print_attributes pa ON pa.print_id=p.id AND pa.source='tcgdex/cards-database'
                  WHERE l.print_id=%s AND e.source='cardmarket' AND e.game_id=%s AND l.link_status=ANY(%s)""",(print_id,pgid,list(A)))
                rows=[dict(x) for x in cur.fetchall()]
                if len(rows)!=1:raise AssertionError({'pokemon_print':print_id,'accepted_links':len(rows)})
                r=rows[0]
                if str(r['id_product'])!=correct_id or str(r['legacy_id'] or '')!=correct_id:raise AssertionError({'pokemon_print':print_id,'expected':correct_id,'row':r})
                if norm(r['market_name'])!=norm(r['card_name']):raise AssertionError({'pokemon_print':print_id,'reason':'Cardmarket name mismatch','row':r})
                conflict=None
                declared=str(r['tcgdex_physical_id'] or r['tcgdex_card_id'] or '')
                if declared and declared!=correct_id:
                  cur.execute("SELECT external_id,name,expansion_external_id FROM external_catalog_products WHERE source='cardmarket' AND game_id=%s AND product_group='single' AND external_id=%s",(pgid,declared))
                  alt=cur.fetchone()
                  if alt is None: conflict={'declared_id':declared,'resolution':'declared_product_absent_current_cardmarket'}
                  else:
                    alt=dict(alt)
                    if norm(alt['name'])==norm(r['card_name']):raise AssertionError({'pokemon_print':print_id,'reason':'conflicting declared ID also matches card name; manual review needed','alternative':alt})
                    conflict={'declared_id':declared,'declared_product_name':alt['name'],'declared_expansion':alt['expansion_external_id'],'resolution':'source_id_rejected_because_it_resolves_to_different_card_name'}
                old=r['evidence'] if isinstance(r['evidence'],dict) else {}
                ev={**old,'certification':'cardmarket_semantic_identity_exact','certified_cardmarket_idProduct':correct_id,'canonical_card_name':r['card_name'],'cardmarket_product_name':r['market_name'],'collector_number':r['collector_number'],'legacy_print_identifier':str(r['legacy_id']),'tcgdex_declared_id':declared or None,'source_conflict':conflict}
                cur.execute("UPDATE external_catalog_print_links SET mapping_method='pokemon_cardmarket_identity_certified',confidence='exact',reviewed=true,evidence=%s,updated_at=now() WHERE id=%s",(Json(ev),int(r['link_id'])))
                pokemon.append({'print_id':print_id,'idProduct':correct_id,'card_name':r['card_name'],'set_code':r['set_code'],'collector_number':r['collector_number'],'tcgdex_declared_id':declared or None,'source_conflict':conflict})
              report['pokemon']={'certified':len(pokemon),'details':pokemon}
            conn.commit()
          except Exception:
            conn.rollback();raise
          finally:conn.close()
          Path('/tmp/cardmarket-final-identity-certifications.json').write_text(json.dumps(report,indent=2,default=str,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,default=str,sort_keys=True))
          PY
      - name: Reproject current exact prices after evidence certification
        run: |
          python backend/scripts/project_cardmarket_link_prices.py --game yugioh --apply --report /tmp/ygo-cert-price.json
          python backend/scripts/project_cardmarket_link_prices.py --game pokemon --apply --report /tmp/pokemon-cert-price.json
      - name: Persist certification proof
        run: |
          mkdir -p audit-reports
          cp /tmp/cardmarket-final-identity-certifications.json audit-reports/cardmarket-final-identity-certifications.json
          cp /tmp/ygo-cert-price.json audit-reports/yugioh-price-projection-after-final-certification.json
          cp /tmp/pokemon-cert-price.json audit-reports/pokemon-price-projection-after-final-certification.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/cardmarket-final-identity-certifications.json audit-reports/yugioh-price-projection-after-final-certification.json audit-reports/pokemon-price-projection-after-final-certification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record final Cardmarket identity certifications'
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-final-identity-certifications-${{ github.run_id }}
          path: |
            /tmp/cardmarket-final-identity-certifications.json
            /tmp/ygo-cert-price.json
            /tmp/pokemon-cert-price.json
          retention-days: 90
