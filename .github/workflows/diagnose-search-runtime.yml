name: Diagnose Search Runtime

on:
  push:
    branches:
      - search-runtime-diagnostics
    paths:
      - '.github/workflows/diagnose-search-runtime.yml'

permissions:
  contents: read

jobs:
  database-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary==2.9.9
      - name: Inspect active database sessions read-only
        run: |
          python - <<'PY'
          import json, os, time
          import psycopg2

          url = os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if url.startswith('postgresql+psycopg2://'):
              url = 'postgresql://' + url[len('postgresql+psycopg2://'):]
          elif url.startswith('postgres://'):
              url = 'postgresql://' + url[len('postgres://'):]

          conn = psycopg2.connect(url, connect_timeout=20, application_name='dontripit_runtime_diag_readonly')
          conn.set_session(readonly=True, autocommit=False)
          with conn.cursor() as cur:
              cur.execute("""
                SELECT pid, state, wait_event_type, wait_event,
                       EXTRACT(EPOCH FROM (clock_timestamp() - xact_start))::bigint,
                       left(regexp_replace(query, '\\s+', ' ', 'g'), 220)
                FROM pg_stat_activity
                WHERE datname=current_database() AND pid<>pg_backend_pid() AND xact_start IS NOT NULL
                ORDER BY xact_start ASC
              """)
              sessions = [
                  {'pid': r[0], 'state': r[1], 'wait_event_type': r[2], 'wait_event': r[3], 'xact_age_seconds': r[4], 'query': r[5]}
                  for r in cur.fetchall()
              ]
              cur.execute('SELECT max(id)::bigint FROM prints')
              visible_max_print_id = int(cur.fetchone()[0] or 0)
              cur.execute("SELECT pg_get_serial_sequence('prints','id')")
              sequence_name = cur.fetchone()[0]
              cur.execute(f'SELECT last_value::bigint FROM {sequence_name}')
              sequence_last_value = int(cur.fetchone()[0])
              cur.execute("SELECT current_setting('neon.pageserver_connstring', true)")
              pageserver = cur.fetchone()[0]
          conn.rollback()
          conn.close()

          consumed_uncommitted_estimate = max(0, sequence_last_value - visible_max_print_id)
          print(json.dumps({
              'database_writes': 0,
              'transaction_read_only': True,
              'active_transactions': sessions,
              'visible_max_print_id': visible_max_print_id,
              'prints_sequence_last_value': sequence_last_value,
              'sequence_ids_ahead_of_visible_max': consumed_uncommitted_estimate,
              'certified_es_target_prints': 14046,
              'approx_es_sequence_progress_pct': round(consumed_uncommitted_estimate / 14046 * 100, 1),
              'pageserver_host_hint': pageserver,
              'vercel_api_region_observed_separately': 'iad1',
          }, indent=2, sort_keys=True))
          PY
