name: Diagnose Search Runtime

on:
  push:
    branches:
      - search-runtime-diagnostics
    paths:
      - '.github/workflows/diagnose-search-runtime.yml'

permissions:
  contents: read

jobs:
  database-region:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install psycopg2-binary==2.9.9
      - name: Inspect DB runtime metadata read-only
        run: |
          python - <<'PY'
          import json, os, time
          import psycopg2

          url = os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if url.startswith('postgresql+psycopg2://'):
              url = 'postgresql://' + url[len('postgresql+psycopg2://'):]
          elif url.startswith('postgres://'):
              url = 'postgresql://' + url[len('postgres://'):]

          started = time.perf_counter()
          conn = psycopg2.connect(url, connect_timeout=20, application_name='dontripit_search_region_diag')
          connected_ms = round((time.perf_counter() - started) * 1000, 1)
          conn.set_session(readonly=True, autocommit=False)
          with conn.cursor() as cur:
              t0 = time.perf_counter()
              cur.execute('SELECT 1')
              cur.fetchone()
              select1_ms = round((time.perf_counter() - t0) * 1000, 1)
              cur.execute("SELECT current_setting('neon.region', true), current_setting('cloud.region', true), current_database(), current_user")
              neon_region, cloud_region, db_name, db_user = cur.fetchone()
              cur.execute("SELECT name, setting FROM pg_settings WHERE name ILIKE '%region%' OR name LIKE 'neon.%' ORDER BY name")
              settings = {name: value for name, value in cur.fetchall() if 'id' not in name.lower()}
          conn.rollback()
          conn.close()
          report = {
              'transaction_read_only': True,
              'database_writes': 0,
              'neon_region': neon_region,
              'cloud_region': cloud_region,
              'database_name': db_name,
              'database_user': db_user,
              'connect_ms_from_github_runner': connected_ms,
              'select_1_ms_from_github_runner': select1_ms,
              'region_settings': settings,
              'vercel_api_region_observed_separately': 'iad1',
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
