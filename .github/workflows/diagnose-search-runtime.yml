name: Diagnose Search Runtime

on:
  push:
    branches:
      - search-runtime-diagnostics
    paths:
      - '.github/workflows/diagnose-search-runtime.yml'

permissions:
  contents: read

jobs:
  database-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary==2.9.9
      - name: Inspect active database sessions read-only
        run: |
          python - <<'PY'
          import json, os, time
          import psycopg2

          url = os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if url.startswith('postgresql+psycopg2://'):
              url = 'postgresql://' + url[len('postgresql+psycopg2://'):]
          elif url.startswith('postgres://'):
              url = 'postgresql://' + url[len('postgres://'):]

          started = time.perf_counter()
          conn = psycopg2.connect(url, connect_timeout=20, application_name='dontripit_runtime_diag_readonly')
          connect_ms = round((time.perf_counter() - started) * 1000, 1)
          conn.set_session(readonly=True, autocommit=False)
          with conn.cursor() as cur:
              t0 = time.perf_counter()
              cur.execute('SELECT 1')
              cur.fetchone()
              select1_ms = round((time.perf_counter() - t0) * 1000, 1)
              cur.execute("""
                SELECT
                  pid,
                  application_name,
                  state,
                  wait_event_type,
                  wait_event,
                  EXTRACT(EPOCH FROM (clock_timestamp() - xact_start))::bigint AS xact_age_seconds,
                  EXTRACT(EPOCH FROM (clock_timestamp() - query_start))::bigint AS query_age_seconds,
                  left(regexp_replace(query, '\\s+', ' ', 'g'), 220) AS query
                FROM pg_stat_activity
                WHERE datname = current_database()
                  AND pid <> pg_backend_pid()
                  AND xact_start IS NOT NULL
                ORDER BY xact_start ASC
              """)
              sessions = [
                  {
                      'pid': row[0], 'application_name': row[1], 'state': row[2],
                      'wait_event_type': row[3], 'wait_event': row[4],
                      'xact_age_seconds': row[5], 'query_age_seconds': row[6], 'query': row[7],
                  }
                  for row in cur.fetchall()
              ]
              cur.execute("SELECT current_setting('neon.pageserver_connstring', true)")
              pageserver = cur.fetchone()[0]
          conn.rollback()
          conn.close()
          print(json.dumps({
              'database_writes': 0,
              'transaction_read_only': True,
              'connect_ms_from_runner': connect_ms,
              'select_1_ms_from_runner': select1_ms,
              'pageserver_host_hint': pageserver,
              'active_transactions': sessions,
              'vercel_api_region_observed_separately': 'iad1',
          }, indent=2, sort_keys=True))
          PY
