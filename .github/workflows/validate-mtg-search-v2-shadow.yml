name: Validate MTG Search V2 Shadow

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/validate-mtg-search-v2-shadow.yml'
      - 'backend/app/search_v2/mtg_profiles.py'
      - 'backend/app/search_v2/mtg_facets.py'
      - 'backend/app/search_v2/mtg_advanced.py'
      - 'backend/app/search_v2/mtg_facet_values.py'
      - 'backend/app/routes/search_v2.py'
      - 'backend/app/scripts/rebuild_mtg_search_v2_fast.py'
      - 'backend/app/scripts/benchmark_mtg_search_v2_shadow.py'
      - 'backend/app/scripts/apply_mtg_v22_snapshot_live.py'
      - 'backend/app/scripts/apply_mtg_v23_snapshot_live.py'
      - 'backend/tests/test_mtg_search_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mtg-search-v2-shadow
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mtg_search_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mtg_search_shadow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/mtg_search_shadow
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/mtg_search_shadow
      CERTIFIED_ARTIFACT_ID: '9026354085'
      CERTIFIED_ARTIFACT_SHA256: '594b041b3055e8d7fe564cbb7138b044e8593131c939810ff104729e015b8845'

    steps:
      - name: Checkout catalog-v2
        uses: actions/checkout@v4
        with:
          ref: catalog-v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile MTG Search V2 modules
        working-directory: backend
        run: |
          python -m py_compile \
            app/search_v2/mtg_profiles.py \
            app/search_v2/mtg_facets.py \
            app/search_v2/mtg_advanced.py \
            app/search_v2/mtg_facet_values.py \
            app/routes/search_v2.py \
            app/scripts/rebuild_mtg_search_v2_fast.py \
            app/scripts/benchmark_mtg_search_v2_shadow.py

      - name: Run focused MTG Search V2 unit tests
        working-directory: backend
        run: pytest -q tests/test_mtg_search_v2.py tests/test_mtg_identity_v2.py tests/test_mtg_write_quarantine_v2.py

      - name: Apply canonical schema to disposable PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          test "$(alembic heads | grep -c '(head)')" -eq 1

      - name: Seed exact legacy MTG baseline required by certified loader
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d mtg_search_shadow -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO games (slug,name) VALUES ('mtg','Magic: The Gathering'),('shadow-sentinel','Shadow Sentinel');
          INSERT INTO sets (game_id,code,name)
          SELECT g.id,'legacy-'||n,'Legacy Set '||n FROM games g CROSS JOIN generate_series(1,298) n WHERE g.slug='mtg';
          INSERT INTO cards (game_id,name,card_key)
          SELECT g.id,'Legacy Card '||n,'mtg:legacy:'||n FROM games g CROSS JOIN generate_series(1,1183) n WHERE g.slug='mtg';
          WITH target AS (
            SELECT n,
              (SELECT id FROM sets WHERE game_id=(SELECT id FROM games WHERE slug='mtg') ORDER BY id LIMIT 1) set_id,
              (SELECT id FROM cards WHERE game_id=(SELECT id FROM games WHERE slug='mtg') ORDER BY id OFFSET ((n-1)%1183) LIMIT 1) card_id
            FROM generate_series(1,1588) n
          )
          INSERT INTO prints (set_id,card_id,collector_number,language,rarity,is_foil,variant,print_key)
          SELECT set_id,card_id,n::text,'en','legacy',false,'legacy','mtg:legacy-print:'||n FROM target;
          INSERT INTO print_images (print_id,url,is_primary,source)
          SELECT p.id,'https://example.invalid/'||p.id||'.jpg',true,'legacy'
          FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=(SELECT id FROM games WHERE slug='mtg');
          INSERT INTO print_identifiers (print_id,source,external_id)
          SELECT p.id,'legacy','legacy-'||p.id
          FROM prints p JOIN cards c ON c.id=p.card_id WHERE c.game_id=(SELECT id FROM games WHERE slug='mtg');
          INSERT INTO sets (game_id,code,name) SELECT id,'sentinel-set','Sentinel Set' FROM games WHERE slug='shadow-sentinel';
          INSERT INTO cards (game_id,name,card_key) SELECT id,'Sentinel Card','sentinel:card:1' FROM games WHERE slug='shadow-sentinel';
          INSERT INTO prints (set_id,card_id,collector_number,language,rarity,is_foil,variant,print_key)
          SELECT s.id,c.id,'1','en','rare',false,'default','sentinel:print:1'
          FROM sets s JOIN cards c ON c.game_id=s.game_id JOIN games g ON g.id=s.game_id WHERE g.slug='shadow-sentinel';
          SQL

      - name: Download exact certified MTG V2.3 snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mtg-certified /tmp/mtg-certified.zip
          mkdir -p /tmp/mtg-certified
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CERTIFIED_ARTIFACT_ID}/zip" \
            -o /tmp/mtg-certified.zip
          echo "${CERTIFIED_ARTIFACT_SHA256}  /tmp/mtg-certified.zip" | sha256sum -c -
          unzip -q /tmp/mtg-certified.zip -d /tmp/mtg-certified
          manifest=$(find /tmp/mtg-certified -name manifest.json -type f -print -quit)
          test -n "$manifest"
          python - "$manifest" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          assert m['snapshot_schema_version']=='mtg-canonical-v2.3'
          assert m['counts']['logical_cards']==37624
          assert m['counts']['exact_prints']==161275
          print({'status':'pass','snapshot':m['snapshot_schema_version']})
          PY
          dirname "$manifest" > /tmp/mtg-snapshot-dir.txt

      - name: Apply certified MTG V2.3 snapshot to disposable PostgreSQL
        working-directory: backend
        run: |
          snapshot_dir=$(cat /tmp/mtg-snapshot-dir.txt)
          python -u -m app.scripts.apply_mtg_v23_snapshot_live \
            --snapshot-dir "$snapshot_dir" \
            --output /tmp/mtg-shadow-apply.json

      - name: Capture canonical database size before Search V2
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d mtg_search_shadow -Atc "SELECT pg_database_size(current_database())" > /tmp/db-before-search.txt
          cat /tmp/db-before-search.txt

      - name: Build lean MTG Search V2 profiles transactionally
        working-directory: backend
        run: python -u -m app.scripts.rebuild_mtg_search_v2_fast --report-path /tmp/mtg-search-build.json

      - name: Benchmark natural, advanced and facet Search V2
        working-directory: backend
        run: python -u -m app.scripts.benchmark_mtg_search_v2_shadow --output /tmp/mtg-search-benchmark.json

      - name: Verify sentinel remains untouched and report total storage delta
        env:
          PGPASSWORD: postgres
        run: |
          python - <<'PY'
          import json,subprocess
          before=int(open('/tmp/db-before-search.txt').read().strip())
          after=int(subprocess.check_output(['psql','-h','127.0.0.1','-U','postgres','-d','mtg_search_shadow','-Atc','SELECT pg_database_size(current_database())'],text=True).strip())
          build=json.load(open('/tmp/mtg-search-build.json'))
          bench=json.load(open('/tmp/mtg-search-benchmark.json'))
          if build['status']!='committed' or bench['status']!='pass':
              raise SystemExit('Search V2 shadow did not certify')
          subprocess.check_call(['psql','-h','127.0.0.1','-U','postgres','-d','mtg_search_shadow','-v','ON_ERROR_STOP=1','-c',"DO $$ BEGIN IF (SELECT COUNT(*) FROM cards c JOIN games g ON g.id=c.game_id WHERE g.slug='shadow-sentinel')<>1 THEN RAISE EXCEPTION 'sentinel changed'; END IF; END $$;"])
          report={'status':'pass','database_bytes_before_search':before,'database_bytes_after_search':after,'database_delta_bytes':after-before,'database_delta_mib':round((after-before)/1024/1024,2),'build':build,'benchmark':bench,'neon_writes':0}
          open('/tmp/mtg-search-shadow-certification.json','w').write(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':'pass','database_delta_mib':report['database_delta_mib'],'latency_gates':bench['latency_gates']},indent=2))
          PY

      - name: Upload MTG Search V2 shadow certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-search-v2-shadow-${{ github.sha }}
          path: |
            /tmp/mtg-shadow-apply.json
            /tmp/mtg-search-build.json
            /tmp/mtg-search-benchmark.json
            /tmp/mtg-search-shadow-certification.json
          retention-days: 30
          if-no-files-found: warn
