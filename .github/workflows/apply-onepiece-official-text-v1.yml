name: Apply One Piece Official Text V1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-onepiece-official-text-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Certify isolated parser and writer plan
        working-directory: backend
        run: pytest -q tests/test_onepiece_v2_identity.py tests/test_onepiece_official_text_backfill_v1.py
      - name: Preflight exact 4672 proposals READ ONLY
        working-directory: backend
        run: python -m app.scripts.apply_onepiece_official_text_v1 --expected-proposals 4672 --output /tmp/onepiece-text-preflight.json
      - name: Enforce preflight invariants
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/onepiece-text-preflight.json'))
          assert p['production_writes'] == 0 and p['read_only'] is True, p
          assert p['source']['print_rows'] == 4672, p
          assert p['source']['effect_rows'] == 4672, p
          assert p['database']['identifier_external_ids'] == 4672, p
          assert p['database']['existing_en_localizations'] == 0, p
          assert p['matching'] == {
            'unresolved_source_count': 0,
            'database_without_source_count': 0,
            'ambiguous_target_count': 0,
            'language_mismatch_count': 0,
          }, p
          assert p['proposals']['count'] == 4672, p
          assert p['proposals']['insert_count'] == 4672, p
          assert p['proposals']['update_count'] == 0, p
          assert p['safe_to_apply'] is True, p
          assert all(value == 0 for value in p['blockers'].values()), p
          PY
      - name: Apply certified exact official text
        working-directory: backend
        run: python -m app.scripts.apply_onepiece_official_text_v1 --apply --expected-proposals 4672 --output /tmp/onepiece-text-applied.json
      - name: Prove idempotence READ ONLY
        working-directory: backend
        run: python -m app.scripts.apply_onepiece_official_text_v1 --expected-proposals 0 --output /tmp/onepiece-text-postflight.json
      - name: Re-audit exact print coverage READ ONLY
        working-directory: backend
        run: python -m app.scripts.audit_exact_print_detail_coverage_v1 > /tmp/exact-print-detail-after-onepiece-text.json
      - name: Enforce final One Piece coverage and zero residual proposals
        run: |
          python - <<'PY'
          import json
          applied=json.load(open('/tmp/onepiece-text-applied.json'))
          post=json.load(open('/tmp/onepiece-text-postflight.json'))
          coverage=json.load(open('/tmp/exact-print-detail-after-onepiece-text.json'))
          assert applied['applied'] is True and applied['production_writes'] == 4672, applied
          assert post['read_only'] is True and post['production_writes'] == 0, post
          assert post['proposals']['count'] == 0, post
          assert post['proposals']['already_current_count'] == 4672, post
          row=next(
            item for item in coverage['by_game_language']
            if item['game'] == 'onepiece' and item['language'] == 'en'
          )
          assert row['total_prints'] == 4672, row
          assert row['exact_localization_prints'] == 4672, row
          assert row['missing_exact_localization_prints'] == 0, row
          assert row['exact_localization_coverage_percent'] == 100.0, row
          PY
      - name: Upload certified production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onepiece-official-text-production-${{ github.run_id }}
          path: |
            /tmp/onepiece-text-preflight.json
            /tmp/onepiece-text-applied.json
            /tmp/onepiece-text-postflight.json
            /tmp/exact-print-detail-after-onepiece-text.json
          retention-days: 90
          if-no-files-found: warn