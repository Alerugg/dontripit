name: Audit Yu-Gi-Oh OCG Full Bijection Cohort Production V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_full_bijection_cohort_production_v1.py'
      - '.github/workflows/audit-yugioh-ocg-full-bijection-cohort-production-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      YGO_OCG_FULL_BIJECTION_COHORT_PROOF_OUTPUT: /tmp/ygo-ocg-full-bijection-cohort-proof/production.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile writer and independent production proof
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_full_bijection_cohort_v1.py
          python -m py_compile app/scripts/audit_yugioh_ocg_full_bijection_cohort_production_v1.py
      - name: READ ONLY prove writer sees full idempotent 715 state
        run: |
          mkdir -p /tmp/ygo-ocg-full-bijection-cohort-proof
          python -m app.scripts.apply_yugioh_ocg_full_bijection_cohort_v1 --report /tmp/ygo-ocg-full-bijection-cohort-proof/idempotency-readonly.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-full-bijection-cohort-proof/idempotency-readonly.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['certified_pairs']==715,p
          assert p['already_accepted_same_pair']==715,p
          assert p['new_links_ready']==0,p
          assert p['frozen_proposal_sha256']=='ef0ee909fa46752d37df46f91df473be96ebdf3ef67a54e9be93fd7cbac57d03',p
          print(json.dumps({'writer_readonly':'idempotent','existing':715},indent=2))
          PY
      - name: READ ONLY certify exact identity and current exact-idProduct prices
        run: python -m app.scripts.audit_yugioh_ocg_full_bijection_cohort_production_v1
      - name: Require production proof PASS
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-full-bijection-cohort-proof/production.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['accepted_links']==715,p
          assert p['unique_products']==715,p
          assert p['unique_prints']==715,p
          assert len(p['sets'])==21,p
          assert all(r['wrong_language']==0 and r['wrong_set']==0 and r['wrong_method']==0 and r['stale']==0 for r in p['sets'].values()),p
          pricing=p['pricing']
          assert pricing['canonical_current_wrong_idProduct']==0,p
          assert pricing['canonical_current_exact_idProduct_prices']==pricing['externally_priceable_links'],p
          print(json.dumps({'identity':'715/715','pricing':pricing},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-full-bijection-cohort-production-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-full-bijection-cohort-proof/*.json
          retention-days: 90
          if-no-files-found: warn
