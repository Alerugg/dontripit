# Production retrigger after workflow installation on catalog-v2.
name: Apply One Piece JP OP16 Residual V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/apply_onepiece_jp_op16_residual_v1.py'
      - 'backend/app/scripts/reindex_onepiece_jp_op16_full_v1.py'
      - '.github/workflows/apply-onepiece-jp-op16-residual-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/apply_onepiece_jp_op16_residual_v1.py'
      - 'backend/app/scripts/reindex_onepiece_jp_op16_full_v1.py'
      - '.github/workflows/apply-onepiece-jp-op16-residual-v1.yml'

permissions:
  contents: read

concurrency:
  group: onepiece-jp-op16-residual-v1
  cancel-in-progress: false

jobs:
  residual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      ONEPIECE_HTTP_TIMEOUT: '30'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: |
          python -m py_compile app/scripts/apply_onepiece_jp_op16_residual_v1.py
          python -m py_compile app/scripts/reindex_onepiece_jp_op16_full_v1.py
      - name: READ ONLY rebuild exact five-row residual
        run: |
          mkdir -p /tmp/op16jp-residual
          python -m app.scripts.apply_onepiece_jp_op16_residual_v1 --report /tmp/op16jp-residual/proposal.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/op16jp-residual/proposal.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['official_surface_sha256']=='772684372981c8004acc0b17598f2853118b2ea0c375e5654631b2cfacdf2008',p
          assert p['existing_ja_before'] in (149,154),p
          assert p['residual_ready'] in (5,0),p
          assert (p['existing_ja_before'],p['residual_ready']) in ((149,5),(154,0)),p
          print(json.dumps({'dry_run':'pass','existing':p['existing_ja_before'],'residual':p['residual_ready']},indent=2))
          PY
      - name: Apply five exact OP16-JP cross-release variants
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_onepiece_jp_op16_residual_v1 \
            --apply --confirm APPLY_ONEPIECE_JP_OP16_RESIDUAL_V1 \
            --report /tmp/op16jp-residual/applied.json
      - name: Reindex full OP16-JP physical surface
        if: github.event_name == 'push'
        run: python -m app.scripts.reindex_onepiece_jp_op16_full_v1
      - name: Prove writer idempotency
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_onepiece_jp_op16_residual_v1 \
            --apply --confirm APPLY_ONEPIECE_JP_OP16_RESIDUAL_V1 \
            --report /tmp/op16jp-residual/idempotency.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/op16jp-residual/idempotency.json'))
          assert p['production_writes']==0,p
          assert p['existing_ja_before']==154,p
          assert p['residual_ready']==0,p
          print(json.dumps({'idempotency':'pass','OP16_JA':154},indent=2))
          PY
      - name: Final OP16-JP full-source proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,re,psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL']); conn.set_session(readonly=True,autocommit=False)
          out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='onepiece' LIMIT 1"); game_id=int(cur.fetchone()['id'])
              cur.execute("SELECT id,code FROM sets WHERE game_id=%s",(game_id,)); sets=[dict(r) for r in cur.fetchall()]
              matches=[r for r in sets if re.sub(r'[^A-Z0-9]+','',str(r['code']).upper())=='OP16']; assert len(matches)==1,matches; set_id=int(matches[0]['id'])
              cur.execute("SELECT id print_id,collector_number,variant FROM prints WHERE set_id=%s AND lower(coalesce(language,''))='ja' ORDER BY collector_number,variant",(set_id,)); ja=[dict(r) for r in cur.fetchall()]
              assert len(ja)==154,len(ja); ids=[int(r['print_id']) for r in ja]
              cur.execute("SELECT count(*) n,count(DISTINCT print_id) p FROM print_images WHERE print_id=ANY(%s) AND is_primary=true AND source='onepiece_official_jp'",(ids,)); x=cur.fetchone(); assert (int(x['n']),int(x['p']))==(154,154),x
              cur.execute("SELECT count(*) n,count(DISTINCT print_id) p,count(DISTINCT external_id) e FROM print_identifiers WHERE print_id=ANY(%s) AND source='onepiece_official_jp'",(ids,)); x=cur.fetchone(); assert (int(x['n']),int(x['p']),int(x['e']))==(154,154,154),x
              cur.execute("SELECT count(*) n FROM search_documents WHERE doc_type='print' AND object_id=ANY(%s)",(ids,)); assert int(cur.fetchone()['n'])==154
              cur.execute("SELECT count(*) n FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id WHERE e.source='cardmarket' AND l.print_id=ANY(%s) AND l.link_status IN ('accepted','mapped','exact')",(ids,)); assert int(cur.fetchone()['n'])==0
              cur.execute("SELECT count(*) n FROM price_snapshots ps JOIN price_sources src ON src.id=ps.source_id WHERE src.name='cardmarket' AND ps.entity_type='print' AND ps.entity_id=ANY(%s)",(ids,)); assert int(cur.fetchone()['n'])==0
              out={'status':'pass','OP16_JA':154,'official_images':154,'official_identifiers':154,'search_docs':154,'cardmarket_links':0,'cardmarket_prices':0}
              conn.rollback()
          finally: conn.close()
          open('/tmp/op16jp-residual/final.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-jp-op16-residual-v1-${{ github.run_id }}
          path: /tmp/op16jp-residual/*.json
          retention-days: 90
          if-no-files-found: warn
