name: Audit Sealed Live Closure V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-sealed-live-closure-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet psycopg2-binary
      - name: Prove current Cardmarket non-single projection READ ONLY
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          ACTIVE=('mtg','onepiece','pokemon','yugioh')
          ACCEPTED=('accepted','mapped','exact')
          dsn=os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not dsn:
              raise RuntimeError('Production database secret is missing')

          def read_once():
              conn=psycopg2.connect(dsn,connect_timeout=30,application_name='dontripit_sealed_live_closure_v1')
              conn.set_session(readonly=True,autocommit=False)
              report={
                  'mode':'production_read_only',
                  'production_writes':0,
                  'active_games':list(ACTIVE),
                  'coverage':{},
                  'integrity':{},
                  'structural_gaps':[],
              }
              try:
                with conn.cursor(cursor_factory=RealDictCursor) as c:
                  c.execute("SET LOCAL statement_timeout='300s'")
                  c.execute('''
                    WITH captures AS (
                      SELECT e.game_id,max(e.last_seen_at) captured_at
                      FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                      WHERE e.source='cardmarket' AND e.product_group='non_single' AND g.slug=ANY(%s)
                      GROUP BY e.game_id
                    ), current_products AS (
                      SELECT e.* FROM external_catalog_products e
                      JOIN captures cap ON cap.game_id=e.game_id AND cap.captured_at=e.last_seen_at
                      WHERE e.source='cardmarket' AND e.product_group='non_single'
                    ), cardinality AS (
                      SELECT cp.id,
                             count(DISTINCT l.product_variant_id) FILTER (WHERE l.link_status=ANY(%s)) accepted_count
                      FROM current_products cp
                      LEFT JOIN external_catalog_product_variant_links l ON l.external_product_id=cp.id
                      GROUP BY cp.id
                    )
                    SELECT g.slug game,cp.id external_product_pk,cp.external_id,cp.name,cp.category,
                           cp.last_seen_at,coalesce(k.accepted_count,0) accepted_count
                    FROM current_products cp JOIN cardinality k ON k.id=cp.id
                    JOIN games g ON g.id=cp.game_id
                    WHERE g.slug=ANY(%s) AND coalesce(k.accepted_count,0)<>1
                    ORDER BY g.slug,cp.external_id
                  ''',(list(ACTIVE),list(ACCEPTED),list(ACTIVE)))
                  report['structural_gaps']=[dict(r) for r in c.fetchall()]

                  c.execute("SELECT id FROM price_sources WHERE lower(name)='cardmarket' LIMIT 1")
                  source=c.fetchone()
                  if not source:
                      raise RuntimeError('Cardmarket canonical price source is missing')
                  source_id=int(source['id'])

                  c.execute('''
                    WITH captures AS (
                      SELECT e.game_id,max(e.last_seen_at) captured_at
                      FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                      WHERE e.source='cardmarket' AND e.product_group='non_single' AND g.slug=ANY(%s)
                      GROUP BY e.game_id
                    ), current_products AS (
                      SELECT e.* FROM external_catalog_products e
                      JOIN captures cap ON cap.game_id=e.game_id AND cap.captured_at=e.last_seen_at
                      WHERE e.source='cardmarket' AND e.product_group='non_single'
                    ), accepted AS (
                      SELECT cp.id external_product_id,cp.external_id,cp.game_id,cp.last_seen_at,
                             l.product_variant_id
                      FROM current_products cp
                      JOIN external_catalog_product_variant_links l ON l.external_product_id=cp.id
                      WHERE l.link_status=ANY(%s)
                    ), price_captures AS (
                      SELECT cp.game_id,max(x.as_of) price_as_of
                      FROM current_products cp
                      JOIN external_market_price_snapshots x ON x.external_product_id=cp.id
                      GROUP BY cp.game_id
                    ), exact_links AS (
                      SELECT a.external_product_id,a.external_id,a.game_id,a.last_seen_at,a.product_variant_id,pc.price_as_of
                      FROM accepted a JOIN price_captures pc ON pc.game_id=a.game_id
                      JOIN product_variants pv ON pv.id=a.product_variant_id
                      JOIN products p ON p.id=pv.product_id AND p.game_id=a.game_id
                      WHERE NOT EXISTS (
                        SELECT 1 FROM accepted a2
                        WHERE a2.external_product_id=a.external_product_id
                          AND a2.product_variant_id<>a.product_variant_id
                      )
                        AND NOT EXISTS (
                          SELECT 1 FROM accepted a3
                          WHERE a3.product_variant_id=a.product_variant_id
                            AND a3.external_product_id<>a.external_product_id
                        )
                    )
                    SELECT g.slug,
                      count(*) linked,
                      count(*) FILTER (WHERE EXISTS (
                        SELECT 1 FROM external_market_price_snapshots x
                        WHERE x.external_product_id=e.external_product_id
                          AND x.as_of=e.price_as_of AND x.currency='EUR' AND x.price_variant='sealed'
                          AND greatest(coalesce(x.price_low,0),coalesce(x.price_mid,0),coalesce(x.price_market,0),coalesce(x.price_last,0))>0
                      )) current_priceable,
                      count(*) FILTER (WHERE NOT EXISTS (
                        SELECT 1 FROM external_market_price_snapshots x
                        WHERE x.external_product_id=e.external_product_id
                          AND x.as_of=e.price_as_of AND x.currency='EUR' AND x.price_variant='sealed'
                          AND greatest(coalesce(x.price_low,0),coalesce(x.price_mid,0),coalesce(x.price_market,0),coalesce(x.price_last,0))>0
                      )) current_no_public_price,
                      count(*) FILTER (WHERE EXISTS (
                        SELECT 1 FROM external_market_price_snapshots x
                        WHERE x.external_product_id=e.external_product_id
                          AND x.as_of=e.price_as_of AND x.currency='EUR' AND x.price_variant='sealed'
                          AND greatest(coalesce(x.price_low,0),coalesce(x.price_mid,0),coalesce(x.price_market,0),coalesce(x.price_last,0))>0
                      ) AND EXISTS (
                        SELECT 1 FROM price_snapshots ps
                        WHERE ps.entity_type='product_variant' AND ps.entity_id=e.product_variant_id
                          AND ps.source_id=%s AND ps.currency='EUR' AND ps.as_of=e.price_as_of
                          AND coalesce(ps.raw_json->>'idProduct','')=e.external_id
                          AND greatest(coalesce(ps.price_low,0),coalesce(ps.price_mid,0),coalesce(ps.price_market,0),coalesce(ps.price_last,0))>0
                      )) current_projected,
                      count(*) FILTER (WHERE EXISTS (
                        SELECT 1 FROM external_market_price_snapshots x
                        WHERE x.external_product_id=e.external_product_id
                          AND x.as_of=e.price_as_of AND x.currency='EUR' AND x.price_variant='sealed'
                          AND greatest(coalesce(x.price_low,0),coalesce(x.price_mid,0),coalesce(x.price_market,0),coalesce(x.price_last,0))>0
                      ) AND NOT EXISTS (
                        SELECT 1 FROM price_snapshots ps
                        WHERE ps.entity_type='product_variant' AND ps.entity_id=e.product_variant_id
                          AND ps.source_id=%s AND ps.currency='EUR' AND ps.as_of=e.price_as_of
                          AND coalesce(ps.raw_json->>'idProduct','')=e.external_id
                          AND greatest(coalesce(ps.price_low,0),coalesce(ps.price_mid,0),coalesce(ps.price_market,0),coalesce(ps.price_last,0))>0
                      )) current_price_gaps,
                      max(e.last_seen_at) catalog_capture,max(e.price_as_of) price_capture
                    FROM exact_links e JOIN games g ON g.id=e.game_id
                    GROUP BY g.slug ORDER BY g.slug
                  ''',(list(ACTIVE),list(ACCEPTED),source_id,source_id))
                  rows=[dict(r) for r in c.fetchall()]
                  report['coverage']={r['slug']:{k:v for k,v in r.items() if k!='slug'} for r in rows}

                  c.execute('''
                    WITH captures AS (
                      SELECT e.game_id,max(e.last_seen_at) captured_at
                      FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                      WHERE e.source='cardmarket' AND e.product_group='non_single' AND g.slug=ANY(%s)
                      GROUP BY e.game_id
                    ), links AS (
                      SELECT e.id external_product_id,l.product_variant_id
                      FROM external_catalog_products e JOIN captures cap ON cap.game_id=e.game_id AND cap.captured_at=e.last_seen_at
                      JOIN games g ON g.id=e.game_id
                      JOIN external_catalog_product_variant_links l ON l.external_product_id=e.id AND l.link_status=ANY(%s)
                      WHERE e.source='cardmarket' AND e.product_group='non_single' AND g.slug=ANY(%s)
                    )
                    SELECT
                      (SELECT count(*) FROM (SELECT external_product_id FROM links GROUP BY external_product_id HAVING count(DISTINCT product_variant_id)>1) a) ambiguous_external,
                      (SELECT count(*) FROM (SELECT product_variant_id FROM links GROUP BY product_variant_id HAVING count(DISTINCT external_product_id)>1) b) duplicate_variant
                  ''',(list(ACTIVE),list(ACCEPTED),list(ACTIVE)))
                  report['integrity']={k:int(v) for k,v in dict(c.fetchone()).items()}
                  conn.rollback()
              finally:
                conn.close()

              totals={
                  'structural_gaps':len(report['structural_gaps']),
                  'linked':sum(int(v['linked']) for v in report['coverage'].values()),
                  'current_priceable':sum(int(v['current_priceable']) for v in report['coverage'].values()),
                  'current_no_public_price':sum(int(v['current_no_public_price']) for v in report['coverage'].values()),
                  'current_projected':sum(int(v['current_projected']) for v in report['coverage'].values()),
                  'current_price_gaps':sum(int(v['current_price_gaps']) for v in report['coverage'].values()),
              }
              report['totals']=totals
              report['price_projection_closed']=(
                  totals['current_price_gaps']==0
                  and totals['current_projected']==totals['current_priceable']
              )
              report['catalog_structurally_complete']=(totals['structural_gaps']==0)
              report['status']='pass' if report['price_projection_closed'] and not any(report['integrity'].values()) else 'pending'
              return report

          report=None
          for attempt in range(20):
              report=read_once()
              if report['status']=='pass':
                  break
              if any(report['integrity'].values()):
                  break
              time.sleep(15)

          Path('/tmp/sealed-live-closure-v1.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print('SEALED_LIVE_CLOSURE_V1 '+json.dumps(report,indent=2,sort_keys=True,default=str))
          if any(report['integrity'].values()):
              raise SystemExit('Sealed mapping integrity failure: '+repr(report['integrity']))
          if not report['price_projection_closed']:
              raise SystemExit('Current sealed canonical price projection still has gaps: '+repr(report['totals']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-live-closure-v1-${{ github.run_id }}
          path: /tmp/sealed-live-closure-v1.json
          retention-days: 30
          if-no-files-found: error
