name: Audit Yu-Gi-Oh AGOV-JP Image Match Pilot V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_agov_jp_image_match_pilot_v1.py'
      - '.github/workflows/audit-yugioh-agov-jp-image-match-pilot-v1.yml'

permissions:
  contents: read

jobs:
  image-match:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {key: arias-labrynth-butler, card: 'Arias the Labrynth Butler'}
          - {key: berfomet, card: 'Berfomet the Mythical King of Phantom Beasts'}
          - {key: dark-hole-dragon, card: 'Dark Hole Dragon'}
          - {key: diabellstar, card: 'Diabellstar the Black Witch'}
          - {key: exceed-pendulum, card: 'Exceed the Pendulum'}
          - {key: full-armored-lancer, card: 'Full Armored Dark Knight Lancer'}
          - {key: imsety, card: 'Imsety, Glory of Horus'}
          - {key: nephilabyss, card: 'Nephilabyss, the Ogdoadic Overlord'}
          - {key: poissonniere, card: 'Poissonniere de Nouvelles'}
          - {key: sp-little-knight, card: 'S:P Little Knight'}
          - {key: snake-eye-ash, card: 'Snake-Eye Ash'}
          - {key: flamberge, card: 'Snake-Eyes Flamberge Dragon'}
          - {key: ty-phon, card: 'Super Starslayer TY-PHON - Sky Crisis'}
          - {key: supreme-king-gate, card: 'Supreme King Gate Magician'}
          - {key: tg-rocket-salamander, card: 'T.G. Rocket Salamander'}
          - {key: veda-kalarcanum, card: 'Veda Kalarcanum'}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Install audit-only image dependency
        run: pip install 'Pillow>=10,<13'
      - name: Compile image pilot
        run: python -m py_compile app/scripts/audit_yugioh_agov_jp_image_match_pilot_v1.py
      - name: Compare first-party Cardmarket images to exact canonical print images
        run: |
          mkdir -p /tmp/agov-image-pilot
          python -m app.scripts.audit_yugioh_agov_jp_image_match_pilot_v1 \
            --card-name "${{ matrix.card }}" \
            --report "/tmp/agov-image-pilot/${{ matrix.key }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-agov-jp-image-match-${{ matrix.key }}-${{ github.run_id }}
          path: /tmp/agov-image-pilot/${{ matrix.key }}.json
          retention-days: 90
          if-no-files-found: error
