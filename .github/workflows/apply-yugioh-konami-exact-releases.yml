name: Apply Yu-Gi-Oh Konami Exact Releases

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/apply-yugioh-konami-exact-releases.yml'
      - 'backend/app/scripts/apply_yugioh_konami_releases.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: apply-yugioh-konami-exact-releases
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      CERTIFIED_ARTIFACT_ID: '9085824318'
      CERTIFIED_ARTIFACT_SHA256: '7b0ff3deeaef56b84f9bd79061425897eb16c6ddf6fcd3c8208371979201a885'
      CERTIFIED_JSON_SHA256: 'f3dcb456a2c13e3d250c0787cef3e175c5b85a94e8d9f21f23d30e38e2afdf71'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile guarded loader
        working-directory: backend
        run: python -m compileall -q app/scripts/apply_yugioh_konami_releases.py
      - name: Download and verify certified Konami audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/ygo-konami-audit /tmp/ygo-konami-audit.zip
          mkdir -p /tmp/ygo-konami-audit
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CERTIFIED_ARTIFACT_ID}/zip" \
            -o /tmp/ygo-konami-audit.zip
          echo "${CERTIFIED_ARTIFACT_SHA256}  /tmp/ygo-konami-audit.zip" | sha256sum -c -
          unzip -q /tmp/ygo-konami-audit.zip -d /tmp/ygo-konami-audit
          test -f /tmp/ygo-konami-audit/yugioh-konami-exact-print-full.json
          echo "${CERTIFIED_JSON_SHA256}  /tmp/ygo-konami-audit/yugioh-konami-exact-print-full.json" | sha256sum -c -
      - name: Dry-run exact official release memberships
        working-directory: backend
        run: |
          python -u -m app.scripts.apply_yugioh_konami_releases \
            /tmp/ygo-konami-audit/yugioh-konami-exact-print-full.json \
            --expected-sha256 "${CERTIFIED_JSON_SHA256}" \
            --report /tmp/ygo-konami-release-dry.json
      - name: Apply exact official release memberships transactionally
        working-directory: backend
        run: |
          python -u -m app.scripts.apply_yugioh_konami_releases \
            /tmp/ygo-konami-audit/yugioh-konami-exact-print-full.json \
            --expected-sha256 "${CERTIFIED_JSON_SHA256}" \
            --apply \
            --report /tmp/ygo-konami-release-apply.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-konami-release-apply-${{ github.run_id }}
          path: |
            /tmp/ygo-konami-release-dry.json
            /tmp/ygo-konami-release-apply.json
          retention-days: 90
          if-no-files-found: warn
