name: QA Cardmarket Pokémon Daily Sync

on:
  pull_request:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_daily_sync.py'
      - 'backend/scripts/sync_cardmarket_pokemon_daily.py'
      - 'backend/tests/test_cardmarket_daily_sync.py'
      - 'backend/app/jobs/cardmarket_prices.py'
      - '.github/workflows/qa-cardmarket-daily-sync.yml'
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_daily_sync.py'
      - 'backend/scripts/sync_cardmarket_pokemon_daily.py'
      - 'backend/tests/test_cardmarket_daily_sync.py'
      - 'backend/app/jobs/cardmarket_prices.py'
      - '.github/workflows/qa-cardmarket-daily-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-sync-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Compile daily sync
        working-directory: backend
        run: python -m compileall -q app/jobs/cardmarket_daily_sync.py scripts/sync_cardmarket_pokemon_daily.py
      - name: Run daily sync guards and importer regressions
        working-directory: backend
        env:
          API_KEY_REQUIRED: 'false'
        run: pytest -q tests/test_cardmarket_daily_sync.py tests/test_cardmarket_prices.py --tb=short
