name: Cloudflare production cutover audit

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-cutover-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7fcca192ccc3d1f2f0d9d5843391a2f5
    steps:
      - name: Inspect public DNS and Cloudflare domain state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          zone_code=$(curl -sS "${auth[@]}" -o /tmp/zone.json -w '%{http_code}' 'https://api.cloudflare.com/client/v4/zones?name=dontripit.com&status=active')
          echo "zone_lookup_http=$zone_code"
          test "$zone_code" = "200"
          zone_id=$(jq -r '.result[0].id // empty' /tmp/zone.json)
          test -n "$zone_id"

          echo '--- public DNS apex ---'
          dig +short A dontripit.com || true
          dig +short AAAA dontripit.com || true
          dig +short CNAME dontripit.com || true
          echo '--- public DNS www ---'
          dig +short A www.dontripit.com || true
          dig +short AAAA www.dontripit.com || true
          dig +short CNAME www.dontripit.com || true

          echo '--- current apex headers ---'
          curl -sSI --max-time 30 https://dontripit.com/ | tr -d '\r' | grep -Ei '^(HTTP/|server:|cf-ray:|x-vercel-id:|location:)' || true
          echo '--- current www headers ---'
          curl -sSI --max-time 30 https://www.dontripit.com/ | tr -d '\r' | grep -Ei '^(HTTP/|server:|cf-ray:|x-vercel-id:|location:)' || true

          domains_code=$(curl -sS "${auth[@]}" -o /tmp/domains.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")
          echo "workers_custom_domains_http=$domains_code"
          if [ "$domains_code" = "200" ]; then
            jq -c '.result[] | select((.hostname // "") | contains("dontripit.com")) | {id,hostname,service,environment,zone_id,zone_name}' /tmp/domains.json || true
          else
            jq -c '{success,errors}' /tmp/domains.json || true
          fi
          test "$domains_code" = "200"
