name: Cloudflare production cutover audit

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-cutover-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7fcca192ccc3d1f2f0d9d5843391a2f5
    steps:
      - name: Inspect current Cloudflare zone and routing state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=dontripit.com&status=active' -o /tmp/zone.json
          zone_id=$(jq -r '.result[0].id // empty' /tmp/zone.json)
          test -n "$zone_id" || { jq '{success,errors}' /tmp/zone.json; exit 2; }
          echo "zone_found=yes"

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=dontripit.com" -o /tmp/apex.json
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=www.dontripit.com" -o /tmp/www.json
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" -o /tmp/routes.json

          echo '--- apex DNS ---'
          jq -c '.result[] | {id,type,name,content,proxied,ttl}' /tmp/apex.json || true
          echo '--- www DNS ---'
          jq -c '.result[] | {id,type,name,content,proxied,ttl}' /tmp/www.json || true
          echo '--- worker routes touching dontripit ---'
          jq -c '.result[] | select((.pattern // "") | contains("dontripit.com")) | {id,pattern,script,environment}' /tmp/routes.json || true

          apex_proxied=$(jq -r '[.result[] | select(.proxied == true)] | length' /tmp/apex.json)
          www_proxied=$(jq -r '[.result[] | select(.proxied == true)] | length' /tmp/www.json)
          echo "apex_proxied_records=$apex_proxied"
          echo "www_proxied_records=$www_proxied"
