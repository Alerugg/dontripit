name: Cloudflare production cutover audit

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-cutover-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe preview, production-copy and fallback Workers
        shell: bash
        run: |
          set -euo pipefail
          bases=(
            'preview|https://dontripit-web-preview.alejandro-ruggeri-l.workers.dev'
            'production|https://dontripit-web-production.alejandro-ruggeri-l.workers.dev'
            'fallback|https://dontripit-vercel-fallback.alejandro-ruggeri-l.workers.dev'
            'vercel-alias|https://dontripit.vercel.app'
          )
          for entry in "${bases[@]}"; do
            label=${entry%%|*}
            base=${entry#*|}
            echo "--- $label ---"
            for path in / /api/health /api/auth/me '/api/search-v2?q=P-150&limit=20'; do
              code=$(curl -L -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' --max-time 45 "$base$path" || true)
              bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)
              server=$(tr -d '\r' </tmp/headers 2>/dev/null | awk -F': ' 'tolower($1)=="server" {print $2}' | tail -1)
              fallback=$(tr -d '\r' </tmp/headers 2>/dev/null | awk -F': ' 'tolower($1)=="x-dontripit-fallback" {print $2}' | tail -1)
              build=$(tr -d '\r' </tmp/headers 2>/dev/null | awk -F': ' 'tolower($1)=="x-vinext-build-id" {print $2}' | tail -1)
              echo "$path status=$code bytes=$bytes server=${server:-none} fallback=${fallback:-none} build=${build:-none}"
              if [ "$code" = "500" ]; then
                head -c 500 /tmp/body | tr '\n' ' '; echo
              fi
            done
          done
