name: Cloudflare production cutover audit

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-cutover-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7fcca192ccc3d1f2f0d9d5843391a2f5
    steps:
      - name: Inspect Cloudflare permissions and current Worker routes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          zone_code=$(curl -sS "${auth[@]}" -o /tmp/zone.json -w '%{http_code}' 'https://api.cloudflare.com/client/v4/zones?name=dontripit.com&status=active')
          echo "zone_lookup_http=$zone_code"
          test "$zone_code" = "200"
          zone_id=$(jq -r '.result[0].id // empty' /tmp/zone.json)
          test -n "$zone_id" || exit 2

          apex_code=$(curl -sS "${auth[@]}" -o /tmp/apex.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=dontripit.com")
          www_code=$(curl -sS "${auth[@]}" -o /tmp/www.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=www.dontripit.com")
          routes_code=$(curl -sS "${auth[@]}" -o /tmp/routes.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes")
          scripts_code=$(curl -sS "${auth[@]}" -o /tmp/scripts.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")

          echo "dns_apex_http=$apex_code"
          echo "dns_www_http=$www_code"
          echo "worker_routes_http=$routes_code"
          echo "worker_scripts_http=$scripts_code"

          if [ "$routes_code" = "200" ]; then
            echo '--- worker routes touching dontripit ---'
            jq -c '.result[] | select((.pattern // "") | contains("dontripit.com")) | {id,pattern,script,environment}' /tmp/routes.json || true
          else
            jq -c '{success,errors}' /tmp/routes.json || true
          fi

          if [ "$scripts_code" = "200" ]; then
            echo '--- relevant workers ---'
            jq -c '.result[] | select((.id // "") | startswith("dontripit-web")) | {id,created_on,modified_on}' /tmp/scripts.json || true
          else
            jq -c '{success,errors}' /tmp/scripts.json || true
          fi

          test "$routes_code" = "200"
