name: Apply Yu-Gi-Oh OCG BE01 205 V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/apply_yugioh_ocg_be01_205_v1.py'
      - '.github/workflows/apply-yugioh-ocg-be01-205-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/apply_yugioh_ocg_be01_205_v1.py'
      - '.github/workflows/apply-yugioh-ocg-be01-205-v1.yml'

permissions:
  contents: read

concurrency:
  group: yugioh-ocg-be01-205-v1
  cancel-in-progress: false

jobs:
  exact-links:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile guarded BE01 writer and exact-idProduct projector
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_be01_205_v1.py
          python -m py_compile scripts/project_cardmarket_link_prices.py
      - name: READ ONLY rebuild exact stable 205-link BE01 proposal
        run: |
          mkdir -p /tmp/ygo-ocg-be01-205-v1
          python -m app.scripts.apply_yugioh_ocg_be01_205_v1 --report /tmp/ygo-ocg-be01-205-v1/proposal.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-be01-205-v1/proposal.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['cardmarket_capture']=='2026-08-18 21:09:20.740891+00:00',p
          assert p['stable_identity_sha256']=='0f6afeb05d84a6e7e22d13275093997e15bdbb479e90d8ffab23b290bf05470e',p
          assert p['certified_pairs']==205,p
          assert (p['already_accepted_same_pair'],p['new_links_ready']) in ((0,205),(205,0)),p
          assert sorted((x['idProduct'] for x in p['outside_products']),key=int)==['711248','711275','711277','711292','711392'],p
          print(json.dumps({'dry_run':'pass','existing':p['already_accepted_same_pair'],'new':p['new_links_ready'],'outside_frozen':5},indent=2))
          PY
      - name: Atomically apply 205 exact BE01 links
        if: github.event_name == 'push'
        run: python -m app.scripts.apply_yugioh_ocg_be01_205_v1 --apply --confirm APPLY_YUGIOH_OCG_BE01_205_V1 --report /tmp/ygo-ocg-be01-205-v1/applied.json
      - name: Project Yu-Gi-Oh Cardmarket prices from exact linked idProducts
        if: github.event_name == 'push'
        run: python scripts/project_cardmarket_link_prices.py --game yugioh --apply --report /tmp/ygo-ocg-be01-205-v1/projection.json
      - name: Prove writer idempotency
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_be01_205_v1 --apply --confirm APPLY_YUGIOH_OCG_BE01_205_V1 --report /tmp/ygo-ocg-be01-205-v1/idempotency.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-be01-205-v1/idempotency.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['already_accepted_same_pair']==205,p
          assert p['new_links_ready']==0,p
          assert p['stable_identity_sha256']=='0f6afeb05d84a6e7e22d13275093997e15bdbb479e90d8ffab23b290bf05470e',p
          print(json.dumps({'idempotency':'pass','exact_links':205},indent=2))
          PY
      - name: Final exact BE01 regional proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          method='cardmarket_ocg_certified_logical_subset_bijection_be01_v1'
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'],connect_timeout=30,application_name='dontripit_ygo_ocg_be01_205_final_v1'); conn.set_session(readonly=True,autocommit=False)
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='yugioh' LIMIT 1"); gid=int(cur.fetchone()['id'])
              cur.execute("""SELECT count(*) total,count(DISTINCT l.external_product_id) products,count(DISTINCT l.print_id) prints,
                  count(*) FILTER (WHERE lower(coalesce(p.language,''))='ja' AND upper(coalesce(s.code,''))='BE01') good,
                  count(*) FILTER (WHERE l.mapping_method=%s AND l.confidence='exact' AND l.reviewed=true) method_good
                FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                JOIN prints p ON p.id=l.print_id JOIN sets s ON s.id=p.set_id
                WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND e.expansion_external_id='4760' AND l.link_status IN ('accepted','mapped','exact')""",(method,gid)); r=cur.fetchone(); vals=tuple(int(r[k]) for k in ('total','products','prints','good','method_good'))
              assert vals==(205,205,205,205,205),vals
              conn.rollback()
          finally: conn.close()
          out={'mapping_method':method,'idExpansion':'4760','set_code':'BE01','links':205}
          open('/tmp/ygo-ocg-be01-205-v1/final.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-be01-205-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-be01-205-v1/*.json
          retention-days: 90
          if-no-files-found: warn
