name: Audit Yu-Gi-Oh OCG Certified Singletons V3

on:
  pull_request:
    paths:
      - 'backend/app/scripts/audit_yugioh_ocg_certified_singletons_v3.py'
      - '.github/workflows/audit-yugioh-ocg-certified-singletons-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile singleton auditor V3
        run: python -m py_compile app/scripts/audit_yugioh_ocg_certified_singletons_v3.py
      - name: READ ONLY derive deterministic singleton mappings V3
        run: python -m app.scripts.audit_yugioh_ocg_certified_singletons_v3
      - name: Require safe nonempty one-to-one surfaces
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/yugioh-ocg-certified-singletons-v3.json'))
          expected={'PHRA':'4550','SAST':'4605','DANE':'4594','SOFU':'4611'}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['certified_expansions']==expected,p
          assert len(p['sets'])==4,p
          assert p['total_pairs']>0,p
          assert p['total_new_ready']>0,p
          for row in p['sets']:
              assert row['pairs']>0,row
              assert row['blocked'].get('accepted_claim_conflict',0)==0,row
          print(json.dumps({'pairs':p['total_pairs'],'new':p['total_new_ready'],'sets':{r['set_code']:r['new_ready'] for r in p['sets']}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-certified-singletons-v3-${{ github.run_id }}
          path: /tmp/yugioh-ocg-certified-singletons-v3.json
          retention-days: 90
          if-no-files-found: error
