name: Apply One Piece JP EB PRB Batch V1

on:
  pull_request:
    paths:
      - 'backend/app/scripts/apply_onepiece_jp_eb_prb_batch_v1.py'
      - 'backend/app/scripts/reindex_onepiece_jp_eb_prb_batch_v1.py'
      - '.github/workflows/apply-onepiece-jp-eb-prb-batch-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/apply_onepiece_jp_eb_prb_batch_v1.py'
      - 'backend/app/scripts/reindex_onepiece_jp_eb_prb_batch_v1.py'
      - '.github/workflows/apply-onepiece-jp-eb-prb-batch-v1.yml'

permissions:
  contents: read

concurrency:
  group: onepiece-jp-eb-prb-batch-v1
  cancel-in-progress: false

jobs:
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      ONEPIECE_HTTP_TIMEOUT: '30'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile batch writer and reindex
        run: |
          python -m py_compile app/scripts/apply_onepiece_jp_eb_prb_batch_v1.py
          python -m py_compile app/scripts/reindex_onepiece_jp_eb_prb_batch_v1.py
      - name: READ ONLY rebuild exact six-set JP batch
        run: |
          mkdir -p /tmp/opjp-eb-prb
          python -m app.scripts.apply_onepiece_jp_eb_prb_batch_v1 --report /tmp/opjp-eb-prb/proposal.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/opjp-eb-prb/proposal.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['official_full_surface_sha256']=='772684372981c8004acc0b17598f2853118b2ea0c375e5654631b2cfacdf2008',p
          assert p['target_physical']==434,p
          assert p['already_exact'] in (0,434),p
          assert p['new_prints_ready']+p['already_exact']==434,p
          print(json.dumps({'dry_run':'pass','new':p['new_prints_ready'],'existing':p['already_exact']},indent=2))
          PY
      - name: Apply exact Japanese EB/PRB physical batch
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_onepiece_jp_eb_prb_batch_v1 \
            --apply --confirm APPLY_ONEPIECE_JP_EB_PRB_BATCH_V1 \
            --report /tmp/opjp-eb-prb/applied.json
      - name: Reindex only Japanese EB/PRB prints
        if: github.event_name == 'push'
        run: python -m app.scripts.reindex_onepiece_jp_eb_prb_batch_v1
      - name: Prove writer idempotency
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_onepiece_jp_eb_prb_batch_v1 \
            --apply --confirm APPLY_ONEPIECE_JP_EB_PRB_BATCH_V1 \
            --report /tmp/opjp-eb-prb/idempotency.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/opjp-eb-prb/idempotency.json'))
          assert p['production_writes']==0,p
          assert p['new_prints_ready']==0,p
          assert p['already_exact']==434,p
          print(json.dumps({'idempotency':'pass','exact_JA':434},indent=2))
          PY
      - name: Final independent batch proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,re,psycopg2
          from collections import Counter
          from psycopg2.extras import RealDictCursor
          expected={'EB01':118,'EB02':93,'EB03':94,'EB04':88,'PRB01':2,'PRB02':39}
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          conn.set_session(readonly=True,autocommit=False)
          out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='onepiece' LIMIT 1")
              game_id=int(cur.fetchone()['id'])
              cur.execute("SELECT id,code FROM sets WHERE game_id=%s",(game_id,))
              sets=[dict(r) for r in cur.fetchall()]
              set_by_token={re.sub(r'[^A-Z0-9]+','',str(r['code']).upper()):r for r in sets}
              all_ja=[]
              for token,count in expected.items():
                row=set_by_token[token]; set_id=int(row['id'])
                cur.execute("""SELECT p.id print_id FROM prints p
                  WHERE p.set_id=%s AND lower(coalesce(p.language,''))='ja'""",(set_id,))
                ids=[int(r['print_id']) for r in cur.fetchall()]
                assert len(ids)==count,(token,len(ids),count)
                all_ja.extend(ids)
                out[token]={'ja_prints':len(ids)}
              assert len(all_ja)==434
              cur.execute("""SELECT count(*) n,count(DISTINCT print_id) prints FROM print_images
                WHERE print_id=ANY(%s) AND is_primary=true AND source='onepiece_official_jp'""",(all_ja,))
              img=cur.fetchone(); assert int(img['n'])==434 and int(img['prints'])==434,img
              cur.execute("""SELECT count(*) n,count(DISTINCT print_id) prints,count(DISTINCT external_id) ext
                FROM print_identifiers WHERE print_id=ANY(%s) AND source='onepiece_official_jp'""",(all_ja,))
              ident=cur.fetchone(); assert (int(ident['n']),int(ident['prints']),int(ident['ext']))==(434,434,434),ident
              cur.execute("SELECT count(*) n FROM search_documents WHERE doc_type='print' AND object_id=ANY(%s)",(all_ja,))
              assert int(cur.fetchone()['n'])==434
              cur.execute("""SELECT count(*) n FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                WHERE e.source='cardmarket' AND l.print_id=ANY(%s) AND l.link_status IN ('accepted','mapped','exact')""",(all_ja,))
              assert int(cur.fetchone()['n'])==0
              cur.execute("""SELECT count(*) n FROM price_snapshots ps JOIN price_sources src ON src.id=ps.source_id
                WHERE src.name='cardmarket' AND ps.entity_type='print' AND ps.entity_id=ANY(%s)""",(all_ja,))
              assert int(cur.fetchone()['n'])==0
              out['total']={'ja_prints':434,'official_images':434,'official_identifiers':434,'search_docs':434,'cardmarket_links':0,'cardmarket_prices':0}
              conn.rollback()
          finally: conn.close()
          open('/tmp/opjp-eb-prb/final.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onepiece-jp-eb-prb-batch-v1-${{ github.run_id }}
          path: /tmp/opjp-eb-prb/*.json
          retention-days: 90
          if-no-files-found: warn
