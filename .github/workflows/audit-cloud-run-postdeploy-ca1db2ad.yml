name: Certify Cloud Run post-deploy ca1db2ad

on:
  push:
    branches:
      - audit/cloud-run-ca1db2ad
    paths:
      - '.github/workflows/audit-cloud-run-postdeploy-ca1db2ad.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ca1db2adacc3d4f9972e26e3403c9b9b7f3b3b5b
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    steps:
      - name: Checkout exact deployed backend revision
        uses: actions/checkout@v4
        with:
          ref: ca1db2adacc3d4f9972e26e3403c9b9b7f3b3b5b
          persist-credentials: false

      - name: Verify public Cloudflare health and revision
        run: |
          set -euo pipefail
          mkdir -p /tmp/cloud-run-postdeploy
          curl --fail --show-error --silent -D /tmp/cloud-run-postdeploy/headers.txt \
            https://api.dontripit.com/api/health \
            -o /tmp/cloud-run-postdeploy/health.json
          cat /tmp/cloud-run-postdeploy/headers.txt
          cat /tmp/cloud-run-postdeploy/health.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          body = json.loads(Path('/tmp/cloud-run-postdeploy/health.json').read_text())
          headers = Path('/tmp/cloud-run-postdeploy/headers.txt').read_text().lower()
          assert body.get('ok') is True, body
          assert body.get('runtime') == 'cloud_run', body
          assert body.get('revision') == os.environ['TARGET_SHA'], body
          assert 'server: cloudflare' in headers, headers
          assert 'cf-ray:' in headers, headers
          print('PUBLIC_ROUTE_OK', body['revision'])
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run read-only rarity consensus production audit
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p /tmp/cloud-run-postdeploy
          python -m app.scripts.audit_search_v2_rarity_consensus_live_v1 \
            --base-url https://api.dontripit.com \
            --report /tmp/cloud-run-postdeploy/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/cloud-run-postdeploy/report.json').read_text())
          assert p['status'] == 'pass', p
          assert p['production_writes'] == 0, p
          assert p['totals']['identity_drift'] == 0, p
          assert p['totals']['non_rarity_payload_drift'] == 0, p
          assert p['totals']['consensus_enriched'] > 0, p
          pikachu = p['pikachu_contract']
          assert pikachu['representative_print_id'] == 571, pikachu
          assert str(pikachu['rarity']).casefold() == 'common', pikachu
          assert pikachu['rarity_source'] == 'sibling_consensus_v1', pikachu
          assert pikachu['rarity_evidence_count'] == 5, pikachu
          for row in p['cases']:
              if row['cards']:
                  assert row['production_first_page_identity_match'] is True, row
          print(json.dumps(p, indent=2, sort_keys=True))
          PY

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-run-postdeploy-ca1db2ad-${{ github.run_id }}
          path: /tmp/cloud-run-postdeploy/*
          retention-days: 90
          if-no-files-found: warn
