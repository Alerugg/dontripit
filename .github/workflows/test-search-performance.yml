name: Search performance gates

on:
  push:
    branches:
      - search-performance-v2
    paths:
      - 'frontend/app/api/search-v2/**'
      - 'frontend/lib/searchV2/**'
      - 'frontend/tests/search-v2-performance-contract.test.js'
      - 'backend/app/search_v2/advanced.py'
      - 'backend/tests/test_search_v2_performance.py'
      - '.github/workflows/test-search-performance.yml'

permissions:
  contents: read

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Search V2 performance contract
        run: node --test tests/search-v2-performance-contract.test.js

  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Search V2 backend performance contract
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_search_v2_performance.py
