name: Apply Yu-Gi-Oh OCG Near Exact Calibrated28 V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/apply_yugioh_ocg_near_exact_calibrated28_v1.py'
      - '.github/workflows/apply-yugioh-ocg-near-exact-calibrated28-v1.yml'
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/scripts/apply_yugioh_ocg_near_exact_calibrated28_v1.py'
      - '.github/workflows/apply-yugioh-ocg-near-exact-calibrated28-v1.yml'

permissions:
  contents: read

concurrency:
  group: yugioh-ocg-near-exact-calibrated28-v1
  cancel-in-progress: false

jobs:
  exact-links:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'catalog-v2' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile guarded calibrated writer and exact-idProduct projector
        run: |
          python -m py_compile app/scripts/apply_yugioh_ocg_near_exact_calibrated28_v1.py
          python -m py_compile scripts/project_cardmarket_link_prices.py
      - name: READ ONLY rebuild exact stable 28-link calibrated proposal
        run: |
          mkdir -p /tmp/ygo-ocg-near-exact-calibrated28
          python -m app.scripts.apply_yugioh_ocg_near_exact_calibrated28_v1 --report /tmp/ygo-ocg-near-exact-calibrated28/proposal.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-near-exact-calibrated28/proposal.json'))
          expected={'STSP':20,'SD37':8}
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['ja_baseline']==36426,p
          assert p['stable_identity_sha256']=='82e3d0d449477c95c63fe2a97c380b3b55915607657a2b8bb9e2e0f54c72f65d',p
          assert p['certified_pairs']==28,p
          assert (p['already_accepted_same_pair'],p['new_links_ready']) in ((0,28),(28,0)),p
          rows={r['set_code']:r for r in p['sets']}
          assert {k:rows[k]['pairs'] for k in rows}==expected,p
          print(json.dumps({'dry_run':'pass','existing':p['already_accepted_same_pair'],'new':p['new_links_ready'],'sets':expected},indent=2))
          PY
      - name: Atomically apply 28 calibrated variant links
        if: github.event_name == 'push'
        run: python -m app.scripts.apply_yugioh_ocg_near_exact_calibrated28_v1 --apply --confirm APPLY_YUGIOH_OCG_NEAR_EXACT_CALIBRATED28_V1 --report /tmp/ygo-ocg-near-exact-calibrated28/applied.json
      - name: Project Yu-Gi-Oh Cardmarket prices from exact linked idProducts
        if: github.event_name == 'push'
        run: python scripts/project_cardmarket_link_prices.py --game yugioh --apply --report /tmp/ygo-ocg-near-exact-calibrated28/projection.json
      - name: Prove writer idempotency
        if: github.event_name == 'push'
        run: |
          python -m app.scripts.apply_yugioh_ocg_near_exact_calibrated28_v1 --apply --confirm APPLY_YUGIOH_OCG_NEAR_EXACT_CALIBRATED28_V1 --report /tmp/ygo-ocg-near-exact-calibrated28/idempotency.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ygo-ocg-near-exact-calibrated28/idempotency.json'))
          assert p['status']=='pass',p
          assert p['production_writes']==0,p
          assert p['already_accepted_same_pair']==28,p
          assert p['new_links_ready']==0,p
          assert p['stable_identity_sha256']=='82e3d0d449477c95c63fe2a97c380b3b55915607657a2b8bb9e2e0f54c72f65d',p
          print(json.dumps({'idempotency':'pass','exact_links':28},indent=2))
          PY
      - name: Final exact calibrated method proof
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          method='cardmarket_ocg_certified_independent_ordinal_rarity_near_exact_v1'
          expected={'STSP':20,'SD37':8}
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'],connect_timeout=30,application_name='dontripit_ygo_ocg_near_exact_calibrated28_final_v1'); conn.set_session(readonly=True,autocommit=False)
          total=0; out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id FROM games WHERE slug='yugioh' LIMIT 1"); gid=int(cur.fetchone()['id'])
              for code,n in expected.items():
                cur.execute("""SELECT count(*) n,count(DISTINCT l.external_product_id) products,count(DISTINCT l.print_id) prints FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id JOIN prints p ON p.id=l.print_id JOIN sets s ON s.id=p.set_id WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status IN ('accepted','mapped','exact') AND l.mapping_method=%s AND upper(coalesce(s.code,''))=%s AND lower(coalesce(p.language,''))='ja'""",(gid,method,code)); r=cur.fetchone(); vals=(int(r['n']),int(r['products']),int(r['prints']))
                assert vals==(n,n,n),(code,vals,n)
                total+=n; out[code]=n
              assert total==28,total
              conn.rollback()
          finally: conn.close()
          payload={'mapping_method':method,'total':total,'sets':out}
          open('/tmp/ygo-ocg-near-exact-calibrated28/final.json','w').write(json.dumps(payload,indent=2)+'\n'); print(json.dumps(payload,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-ocg-near-exact-calibrated28-v1-${{ github.run_id }}
          path: /tmp/ygo-ocg-near-exact-calibrated28/*.json
          retention-days: 90
          if-no-files-found: warn
