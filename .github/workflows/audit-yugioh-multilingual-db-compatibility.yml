name: Audit Yu-Gi-Oh multilingual DB compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - multilingual-ygo-v1
    paths:
      - backend/app/scripts/audit_yugioh_multilingual_db_compatibility.py
      - .github/workflows/audit-yugioh-multilingual-db-compatibility.yml

permissions:
  contents: read

concurrency:
  group: audit-yugioh-multilingual-db-compatibility-${{ github.ref }}
  cancel-in-progress: false

env:
  YGOJSON_URL: https://github.com/iconmaster5326/YGOJSON/releases/download/v1/aggregate.zip
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
  PYTHONPATH: .

jobs:
  compatibility-audit:
    name: Read-only YGOJSON to Neon identity compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: multilingual-ygo-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --disable-pip-version-check 'ijson==3.4.0.post0'

      - name: Download immutable YGOJSON aggregate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ygojson/extracted" artifacts
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/ygojson/aggregate.zip" "$YGOJSON_URL"
          unzip -q "$RUNNER_TEMP/ygojson/aggregate.zip" -d "$RUNNER_TEMP/ygojson/extracted"

      - name: Audit exact compatibility in explicit read-only transaction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          python -m app.scripts.audit_yugioh_multilingual_db_compatibility \
            --input-dir "$RUNNER_TEMP/ygojson/extracted" \
            --report ../artifacts/yugioh-multilingual-db-compatibility.json

      - name: Print compact evidence
        if: always()
        working-directory: .
        shell: bash
        run: |
          if [ -f artifacts/yugioh-multilingual-db-compatibility.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/yugioh-multilingual-db-compatibility.json').read_text())
          print(json.dumps({
            'production_writes':r['production_writes'],
            'database_transaction_read_only':r['database_transaction_read_only'],
            'database_inventory':r['database_inventory'],
            'es':r['targets']['es'],
            'ja':r['targets']['ja'],
            'gates':r['gates'],
            'gate_pass':r['gate_pass'],
          }, indent=2, ensure_ascii=False))
          PY
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-multilingual-db-compatibility
          path: artifacts/yugioh-multilingual-db-compatibility.json
          if-no-files-found: warn
          retention-days: 30
