name: Audit Cardmarket Manual Worklist V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-cardmarket-manual-worklist-v1.yml'
      - '.github/workflows/audit-market-version-manual-worklist-v2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PGOPTIONS: -c default_transaction_read_only=on
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt

      - name: Export fresh unresolved exact Cardmarket Print worklist READ ONLY
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from __future__ import annotations
          import csv, json, os
          from collections import Counter, defaultdict
          from pathlib import Path
          from sqlalchemy import select, text
          from app import db
          from app.external_catalog_models import ExternalCatalogPrintLink, ExternalCatalogProduct
          from app.models import Card, Game, Print, Set

          db.init_engine(os.environ['DATABASE_URL_UNPOOLED'])
          def clean(v): return '' if v is None else str(v).replace('\x00','').strip()
          with db.SessionLocal() as session:
              session.execute(text('SET TRANSACTION READ ONLY'))
              assert session.execute(text('SHOW transaction_read_only')).scalar_one() == 'on'
              prints=session.execute(select(Print.id,Print.card_id,Print.collector_number,Print.language,Print.rarity,Print.is_foil,Print.variant,Print.print_key,Card.name,Set.code,Set.name,Set.region,Game.slug).join(Card,Card.id==Print.card_id).join(Set,Set.id==Print.set_id).join(Game,Game.id==Set.game_id)).all()
              links=session.execute(select(ExternalCatalogPrintLink.print_id,ExternalCatalogPrintLink.link_status,ExternalCatalogPrintLink.confidence,ExternalCatalogPrintLink.reviewed,ExternalCatalogProduct.external_id,ExternalCatalogProduct.website_path).join(ExternalCatalogProduct,ExternalCatalogProduct.id==ExternalCatalogPrintLink.external_product_id).where(ExternalCatalogProduct.source=='cardmarket')).all()
              session.rollback()
          by_print=defaultdict(list)
          for r in links: by_print[int(r[0])].append(r)
          fields=['game','print_id','card_name','set_code','set_name','set_region','collector_number','language','rarity','finish','variant','print_key','existing_cm_product_ids','existing_cm_urls','existing_cm_reviewed_flags']
          out=[]; by_game=Counter()
          for p in prints:
              pid=int(p[0]); current=by_print.get(pid,[])
              exact=[r for r in current if clean(r[1]).lower()=='accepted' and clean(r[2]).lower()=='exact']
              if exact: continue
              row={'game':clean(p[12]),'print_id':pid,'card_name':clean(p[8]),'set_code':clean(p[9]),'set_name':clean(p[10]),'set_region':clean(p[11]),'collector_number':clean(p[2]),'language':clean(p[3]),'rarity':clean(p[4]),'finish':'foil' if p[5] else 'nonfoil','variant':clean(p[6]),'print_key':clean(p[7]),'existing_cm_product_ids':' | '.join(sorted({clean(r[4]) for r in current if clean(r[4])})),'existing_cm_urls':' | '.join(sorted({('https://www.cardmarket.com'+clean(r[5]) if clean(r[5]).startswith('/') else clean(r[5])) for r in current if clean(r[5])})),'existing_cm_reviewed_flags':' | '.join(sorted({str(bool(r[3])).lower() for r in current}))}
              out.append(row); by_game[row['game']]+=1
          with Path('artifacts/cardmarket-manual-worklist-v1.csv').open('w',encoding='utf-8',newline='') as fh:
              w=csv.DictWriter(fh,fieldnames=fields); w.writeheader(); w.writerows(out)
          summary={'status':'pass','production_writes':0,'transaction_read_only':True,'definition_of_resolved':'Cardmarket link_status=accepted AND confidence=exact','unresolved_exact_prints':len(out),'by_game':dict(sorted(by_game.items()))}
          Path('artifacts/cardmarket-manual-worklist-summary-v1.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-manual-worklist-v1-${{ github.run_id }}
          path: |
            backend/artifacts/cardmarket-manual-worklist-v1.csv
            backend/artifacts/cardmarket-manual-worklist-summary-v1.json
          retention-days: 30
          if-no-files-found: error
