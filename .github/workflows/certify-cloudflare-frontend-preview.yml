name: Certify Cloudflare frontend preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/cloudflare-cert-v2-trigger'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW: https://dontripit-web-preview.alejandro-ruggeri-l.workers.dev
      PROD: https://dontripit.com
    steps:
      - name: Page and public-route parity
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            /
            /pokemon
            /onepiece
            /yugioh
            /riftbound
            /magic
            /explorer
            /login
            /register
            /forgot-password
            /privacy
            /terms
            /cookies
          )
          for path in "${paths[@]}"; do
            p_code=$(curl -L -sS -o /tmp/preview.html -w '%{http_code}' --max-time 30 "$PREVIEW$path")
            r_code=$(curl -L -sS -o /tmp/prod.html -w '%{http_code}' --max-time 30 "$PROD$path")
            echo "$path preview=$p_code prod=$r_code preview_bytes=$(wc -c </tmp/preview.html) prod_bytes=$(wc -c </tmp/prod.html)"
            test "$p_code" = "200"
            test "$r_code" = "200"
            test -s /tmp/preview.html
            grep -Eqi '<html|<!doctype' /tmp/preview.html
          done

      - name: Static asset delivery
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "$PREVIEW/" -o /tmp/home.html
          node <<'NODE' >/tmp/assets.txt
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/home.html','utf8');
          const matches = [...html.matchAll(/(?:src|href)=["']([^"']*\/_next\/static\/[^"']+\.(?:js|css|woff2))["']/gi)].map(m => m[1]);
          const unique = [...new Set(matches)].slice(0, 8);
          if (unique.length < 2) {
            console.error('Too few static assets discovered:', unique);
            process.exit(2);
          }
          process.stdout.write(unique.join('\n'));
          NODE
          while IFS= read -r asset; do
            case "$asset" in
              http*) url="$asset" ;;
              *) url="$PREVIEW$asset" ;;
            esac
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url")
            echo "asset=$asset status=$code"
            test "$code" = "200"
          done </tmp/assets.txt

      - name: Frontend API health parity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$PREVIEW/api/health" -o /tmp/preview-health.json
          curl -fsS --max-time 30 "$PROD/api/health" -o /tmp/prod-health.json
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/preview-health.json','utf8'));
          const r = JSON.parse(fs.readFileSync('/tmp/prod-health.json','utf8'));
          console.log('preview_health=' + JSON.stringify(p));
          console.log('prod_health=' + JSON.stringify(r));
          if (p?.status !== 'ok' || r?.status !== 'ok') process.exit(2);
          NODE

      - name: Anonymous auth contract
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/preview.cookies /tmp/prod.cookies
          p_code=$(curl -sS -o /tmp/preview-me.json -D /tmp/preview-me.headers -w '%{http_code}' --max-time 30 "$PREVIEW/api/auth/me")
          r_code=$(curl -sS -o /tmp/prod-me.json -D /tmp/prod-me.headers -w '%{http_code}' --max-time 30 "$PROD/api/auth/me")
          echo "anonymous_auth preview=$p_code prod=$r_code"
          test "$p_code" = "401"
          test "$r_code" = "401"
          PREVIEW_CODE="$p_code" PROD_CODE="$r_code" node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/preview-me.json','utf8'));
          const r = JSON.parse(fs.readFileSync('/tmp/prod-me.json','utf8'));
          const errorOf = (x) => String(x?.error || x?.code || '').toLowerCase();
          console.log('anonymous_preview=' + JSON.stringify(p));
          console.log('anonymous_prod=' + JSON.stringify(r));
          if (process.env.PREVIEW_CODE !== process.env.PROD_CODE) throw new Error('Anonymous auth status drift');
          if (!errorOf(p).includes('auth')) throw new Error('Preview anonymous auth did not return an authentication error');
          if (!errorOf(r).includes('auth')) throw new Error('Production anonymous auth did not return an authentication error');
          NODE

          for path in /api/library/collection /api/library/wishlist; do
            p=$(curl -sS -o /tmp/p.json -w '%{http_code}' --max-time 30 "$PREVIEW$path")
            r=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 30 "$PROD$path")
            echo "$path anonymous preview=$p prod=$r"
            test "$p" = "$r"
            test "$p" = "401"
          done

      - name: Same-origin search parity
        shell: bash
        run: |
          set -euo pipefail
          queries=('Pikachu' 'Luffy' 'P-150' 'OP05-119' 'LOB-001')
          for q in "${queries[@]}"; do
            encoded=$(node -p "encodeURIComponent(process.argv[1])" "$q")
            curl -fsS --max-time 45 "$PREVIEW/api/search-v2?q=$encoded&limit=20" -o /tmp/preview-search.json
            curl -fsS --max-time 45 "$PROD/api/search-v2?q=$encoded&limit=20" -o /tmp/prod-search.json
            QUERY="$q" node <<'NODE'
          const fs = require('fs');
          const q = process.env.QUERY;
          const p = JSON.parse(fs.readFileSync('/tmp/preview-search.json','utf8'));
          const r = JSON.parse(fs.readFileSync('/tmp/prod-search.json','utf8'));
          const pickArray = (j) => {
            if (Array.isArray(j)) return j;
            for (const key of ['results','items','data']) {
              if (Array.isArray(j?.[key])) return j[key];
              if (Array.isArray(j?.[key]?.results)) return j[key].results;
              if (Array.isArray(j?.[key]?.items)) return j[key].items;
            }
            return null;
          };
          const identity = (x) => String(x?.print_id ?? x?.printId ?? x?.id ?? x?.card_id ?? x?.cardId ?? x?.external_id ?? x?.code ?? x?.name ?? '');
          const pa = pickArray(p);
          const ra = pickArray(r);
          if (!pa || !ra) {
            console.error(q, 'unrecognized search shapes', Object.keys(p || {}), Object.keys(r || {}));
            process.exit(3);
          }
          const pIds = pa.slice(0, 5).map(identity);
          const rIds = ra.slice(0, 5).map(identity);
          console.log(`${q} preview_results=${pa.length} prod_results=${ra.length} preview_top=${JSON.stringify(pIds)} prod_top=${JSON.stringify(rIds)}`);
          if (pa.length !== ra.length) process.exit(4);
          if (JSON.stringify(pIds) !== JSON.stringify(rIds)) process.exit(5);
          NODE
          done

      - name: Search latency regression gate
        shell: bash
        run: |
          set -euo pipefail
          queries=('Pikachu' 'Luffy' 'P-150' 'OP05-119' 'LOB-001')
          : >/tmp/latency.tsv
          for q in "${queries[@]}"; do
            encoded=$(node -p "encodeURIComponent(process.argv[1])" "$q")
            p_url="$PREVIEW/api/search-v2?q=$encoded&limit=20"
            r_url="$PROD/api/search-v2?q=$encoded&limit=20"

            # Warm both paths once so the comparison is about steady-state migration overhead.
            curl -fsS -o /dev/null --max-time 30 "$p_url"
            curl -fsS -o /dev/null --max-time 30 "$r_url"

            for i in 1 2 3; do
              p_time=$(curl -fsS -o /dev/null -w '%{time_total}' --max-time 30 "$p_url")
              r_time=$(curl -fsS -o /dev/null -w '%{time_total}' --max-time 30 "$r_url")
              printf '%s\tpreview\t%s\n' "$q" "$p_time" >>/tmp/latency.tsv
              printf '%s\tprod\t%s\n' "$q" "$r_time" >>/tmp/latency.tsv
            done
          done
          cat /tmp/latency.tsv
          node <<'NODE'
          const fs = require('fs');
          const rows = fs.readFileSync('/tmp/latency.tsv','utf8').trim().split(/\n+/).map(line => {
            const [q, side, seconds] = line.split('\t');
            return {q, side, ms: Number(seconds) * 1000};
          });
          const median = (xs) => {
            const a = [...xs].sort((a,b) => a-b);
            return a[Math.floor(a.length / 2)];
          };
          for (const q of [...new Set(rows.map(r => r.q))]) {
            const p = rows.filter(r => r.q === q && r.side === 'preview').map(r => r.ms);
            const prod = rows.filter(r => r.q === q && r.side === 'prod').map(r => r.ms);
            if (p.length !== 3 || prod.length !== 3 || [...p, ...prod].some(x => !Number.isFinite(x))) {
              throw new Error(`${q}: incomplete latency samples`);
            }
            const p50 = median(p);
            const prod50 = median(prod);
            const pMax = Math.max(...p);
            const allowedP50 = prod50 * 1.5 + 500;
            const allowedMax = Math.max(20000, Math.max(...prod) * 2 + 1000);
            console.log(`${q} preview_p50=${p50.toFixed(0)}ms prod_p50=${prod50.toFixed(0)}ms allowed_preview_p50=${allowedP50.toFixed(0)}ms preview_max=${pMax.toFixed(0)}ms`);
            if (p50 > allowedP50) throw new Error(`${q}: Cloudflare preview p50 materially regressed vs production`);
            if (pMax > allowedMax) throw new Error(`${q}: Cloudflare preview produced an extreme latency regression`);
          }
          NODE

      - name: Canonical physical metadata contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 "$PREVIEW/api/catalog/search?q=Pikachu&type=card&include_counts=0&limit=24&offset=0" -o /tmp/catalog.json
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const items = j.items || [];
          const placeholders = new Set(['', '-', '?', 'n/a', 'na', 'none', 'null', 'unknown', 'undefined']);
          const fields = ['set_code', 'set_name', 'collector_number', 'rarity', 'language', 'finish', 'variant_family', 'exact_variant'];
          for (const item of items) {
            for (const field of fields) {
              const value = item?.[field];
              if (typeof value === 'string' && placeholders.has(value.trim().toLowerCase())) {
                throw new Error(`Placeholder leaked: card=${item.card_id} field=${field} value=${value}`);
              }
            }
          }
          const base = items.find(x => Number(x.card_id) === 1);
          if (!base) throw new Error('Base Set Pikachu card_id=1 missing');
          if (Number(base.matched_print_id) !== 571) throw new Error(`Representative print drift: ${base.matched_print_id}`);
          if (base.rarity !== null && base.rarity !== undefined) throw new Error(`Expected null rarity, got ${base.rarity}`);
          if (String(base.set_code).toLowerCase() !== 'bs' || String(base.collector_number) !== '58') throw new Error('Base Set Pikachu identity drift');
          console.log('metadata_contract=green ' + JSON.stringify({card_id:base.card_id,set_code:base.set_code,collector_number:base.collector_number,rarity:base.rarity,matched_print_id:base.matched_print_id}));
          NODE

      - name: Preview isolation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$PREVIEW" != "$PROD"
          curl -fsSI --max-time 30 "$PREVIEW/" | tr -d '\r' | tee /tmp/headers.txt
          grep -Eqi '^server: cloudflare$|^cf-ray:' /tmp/headers.txt

      - name: Certification summary
        run: |
          echo '### Cloudflare frontend preview certification' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Public pages: green' >> "$GITHUB_STEP_SUMMARY"
          echo '- Static assets: green' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frontend API health: green' >> "$GITHUB_STEP_SUMMARY"
          echo '- Anonymous auth contract: green' >> "$GITHUB_STEP_SUMMARY"
          echo '- Search parity probes: green' >> "$GITHUB_STEP_SUMMARY"
          echo '- Search latency regression gate: green' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical metadata contract: green' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production domain: unchanged' >> "$GITHUB_STEP_SUMMARY"
