name: Audit Frontend Point 9

on:
  push:
    branches: [catalog-v2]
    paths:
      - 'frontend/**'
      - '.github/workflows/audit-frontend-point9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-point9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          INTERNAL_API_BASE_URL: https://api.dontripit.com
          INTERNAL_API_ALLOW_PUBLIC: 'true'
