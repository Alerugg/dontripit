name: Audit Frontend Point 9

on:
  push:
    branches: [catalog-v2]
    paths:
      - 'frontend/**'
      - '.github/workflows/audit-frontend-point9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-point9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit legal, cookies, SEO and accessibility contracts
        id: point9_contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run point9:audit 2>&1 | tee point9-audit.log
      - name: Run frontend contracts
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log
      - name: Build production frontend
        id: production_build
        continue-on-error: true
        shell: bash
        env:
          INTERNAL_API_BASE_URL: https://api.dontripit.com
          INTERNAL_API_ALLOW_PUBLIC: 'true'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-point9-qa-${{ github.sha }}
          path: |
            frontend/point9-audit.log
            frontend/frontend-test.log
            frontend/frontend-build.log
          retention-days: 90
          if-no-files-found: warn
      - name: Enforce gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.point9_contract.outcome }}" != "success" ]; then
            echo "Point 9 frontend audit failed"
            exit 1
          fi
          if [ "${{ steps.contracts.outcome }}" != "success" ]; then
            echo "Frontend contract suite failed"
            exit 1
          fi
          if [ "${{ steps.production_build.outcome }}" != "success" ]; then
            echo "Frontend production build failed"
            exit 1
          fi
