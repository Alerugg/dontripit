name: QA MTG Search Profile Contract

on:
  workflow_dispatch:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/qa-mtg-search-profile-contract.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Inspect schema and four collector-correction profiles
        run: |
          python - <<'PY'
          import json,os,psycopg2
          from psycopg2.extras import RealDictCursor
          ids=[272959,272960,307059,307060]
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          out={}
          with conn,conn.cursor(cursor_factory=RealDictCursor) as c:
            c.execute('''SELECT column_name,data_type,is_nullable,column_default
                         FROM information_schema.columns
                         WHERE table_schema='public' AND table_name='print_search_profiles' ORDER BY ordinal_position''')
            out['print_search_profiles_columns']=[dict(x) for x in c.fetchall()]
            c.execute('SELECT * FROM print_search_profiles WHERE print_id=ANY(%s) ORDER BY print_id',(ids,))
            out['profiles']=[dict(x) for x in c.fetchall()]
            c.execute('''SELECT p.id,p.collector_number,p.print_key,p.variant,p.is_foil,c.name,s.code
                         FROM prints p JOIN cards c ON c.id=p.card_id JOIN sets s ON s.id=p.set_id
                         WHERE p.id=ANY(%s) ORDER BY p.id''',(ids,))
            out['prints']=[dict(x) for x in c.fetchall()]
          conn.close()
          print(json.dumps(out,indent=2,ensure_ascii=False,default=str))
          PY
