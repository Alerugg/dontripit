name: Backfill Four Pokémon Cardmarket Prices 2026-08-09

on:
  push:
    branches:
      - backfill-four-cardmarket-prices-2026-08-09
    paths:
      - 'backend/scripts/backfill_four_cardmarket_prices_2026_08_09.py'
      - '.github/workflows/backfill-four-cardmarket-prices-2026-08-09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backfill-four-cardmarket-prices-2026-08-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Download exact official Pokémon Cardmarket Price Guide
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json \
            -o /tmp/prices_pokemon.json
          test -s /tmp/prices_pokemon.json
      - name: Verify exact four-row delta and extend capture
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python scripts/backfill_four_cardmarket_prices_2026_08_09.py /tmp/prices_pokemon.json --report /tmp/cardmarket-four-price-backfill.json
      - name: Upload verified backfill report
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-four-price-backfill-2026-08-09
          path: /tmp/cardmarket-four-price-backfill.json
          if-no-files-found: error
          retention-days: 30
