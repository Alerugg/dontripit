name: Audit Step 3 Exact Print Links Final

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-step3-exact-print-links-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Backend compile
        run: |
          python -m py_compile backend/app/routes/catalog.py backend/app/routes/card_prints.py backend/app/routes/set_ui.py backend/app/main.py scripts/audit_step3_exact_print_links.py
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Production exact-print identity gate
        run: python scripts/audit_step3_exact_print_links.py
      - name: Persist final gate report
        if: always()
        run: |
          mkdir -p audit-reports
          if [ -f /tmp/step3-exact-print-links-final.json ]; then cp /tmp/step3-exact-print-links-final.json audit-reports/step3-exact-print-links-final.json; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/step3-exact-print-links-final.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record step 3 exact print links final gate'
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step3-exact-print-links-final-${{ github.run_id }}
          path: /tmp/step3-exact-print-links-final.json
          retention-days: 90
