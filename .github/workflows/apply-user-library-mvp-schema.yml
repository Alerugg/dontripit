name: Apply User Library MVP Schema

on:
  push:
    branches:
      - mvp-launch-2026-08-09
    paths:
      - '.github/workflows/apply-user-library-mvp-schema.yml'
      - 'backend/alembic/versions/20260809_26_add_user_library_mvp.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-library-mvp-schema-live
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout MVP branch
        uses: actions/checkout@v4
        with:
          ref: mvp-launch-2026-08-09

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify Neon secret
        run: test -n "${DATABASE_URL}${DATABASE_URL_UNPOOLED}"

      - name: Capture live catalog state
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          url = os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if not url:
              raise SystemExit('No database URL configured')
          if url.startswith('postgres://'):
              url = 'postgresql://' + url[len('postgres://'):]
          engine = create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              version = str(conn.execute(text('SELECT version_num FROM alembic_version')).scalar_one())
              cards = int(conn.execute(text('SELECT COUNT(*) FROM cards')).scalar_one())
              prints = int(conn.execute(text('SELECT COUNT(*) FROM prints')).scalar_one())
              prices = int(conn.execute(text('SELECT COUNT(*) FROM prices')).scalar_one())
              snapshots = int(conn.execute(text('SELECT COUNT(*) FROM price_snapshots')).scalar_one())
              tables = {
                  name: bool(conn.execute(text('SELECT to_regclass(:name) IS NOT NULL'), {'name': f'public.{name}'}).scalar_one())
                  for name in ('users', 'user_sessions', 'user_collection_items', 'user_wishlist_items')
              }
          state = {
              'alembic_version': version,
              'cards': cards,
              'prints': prints,
              'prices': prices,
              'price_snapshots': snapshots,
              'user_tables': tables,
          }
          if version not in {'20260808_25', '20260809_26'}:
              raise SystemExit(f'Unexpected live Alembic version: {version}')
          if version == '20260808_25' and any(tables.values()):
              raise SystemExit(f'User tables partially exist before revision 26: {tables}')
          if version == '20260809_26' and not all(tables.values()):
              raise SystemExit(f'Revision 26 recorded but user tables are incomplete: {tables}')
          Path('/tmp/user-mvp-before.json').write_text(json.dumps(state, indent=2, sort_keys=True) + '\n')
          print(json.dumps(state, indent=2, sort_keys=True))
          PY

      - name: Apply additive user schema
        run: alembic upgrade 20260809_26

      - name: Verify catalog unchanged and user schema exact
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          before = json.loads(Path('/tmp/user-mvp-before.json').read_text())
          url = os.getenv('DATABASE_URL_UNPOOLED') or os.getenv('DATABASE_URL')
          if url.startswith('postgres://'):
              url = 'postgresql://' + url[len('postgres://'):]
          engine = create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              after = {
                  'alembic_version': str(conn.execute(text('SELECT version_num FROM alembic_version')).scalar_one()),
                  'cards': int(conn.execute(text('SELECT COUNT(*) FROM cards')).scalar_one()),
                  'prints': int(conn.execute(text('SELECT COUNT(*) FROM prints')).scalar_one()),
                  'prices': int(conn.execute(text('SELECT COUNT(*) FROM prices')).scalar_one()),
                  'price_snapshots': int(conn.execute(text('SELECT COUNT(*) FROM price_snapshots')).scalar_one()),
              }
              required_tables = ('users', 'user_sessions', 'user_collection_items', 'user_wishlist_items')
              tables = {
                  name: bool(conn.execute(text('SELECT to_regclass(:name) IS NOT NULL'), {'name': f'public.{name}'}).scalar_one())
                  for name in required_tables
              }
              constraints = {
                  name: bool(conn.execute(text('''
                      SELECT EXISTS(
                        SELECT 1 FROM pg_constraint WHERE conname=:name
                      )
                  '''), {'name': name}).scalar_one())
                  for name in ('uq_users_email', 'uq_user_sessions_token_hash', 'uq_user_collection_print', 'uq_user_wishlist_print')
              }

          if after['alembic_version'] != '20260809_26':
              raise SystemExit(f"Unexpected post-migration version: {after['alembic_version']}")
          if not all(tables.values()):
              raise SystemExit(f'Missing user tables after migration: {tables}')
          if not all(constraints.values()):
              raise SystemExit(f'Missing user uniqueness constraints: {constraints}')
          for key in ('cards', 'prints', 'prices', 'price_snapshots'):
              if before[key] != after[key]:
                  raise SystemExit(f'{key} changed during additive user migration: {before[key]} -> {after[key]}')
          print(json.dumps({'before': before, 'after': after, 'tables': tables, 'constraints': constraints}, indent=2, sort_keys=True))
          PY
