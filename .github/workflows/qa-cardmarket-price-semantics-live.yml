name: QA Cardmarket Price Semantics Live

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/qa-cardmarket-price-semantics-live.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary==2.9.9
      - name: Inspect live snapshot semantics
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          out={}
          with conn, conn.cursor(cursor_factory=RealDictCursor) as c:
              c.execute('''
                SELECT g.slug,e.product_group,s.price_variant,count(*) rows,
                       count(*) FILTER (WHERE s.price_low IS NOT NULL OR s.price_mid IS NOT NULL OR s.price_market IS NOT NULL OR s.price_last IS NOT NULL OR s.avg1 IS NOT NULL OR s.avg7 IS NOT NULL OR s.avg30 IS NOT NULL) usable,
                       max(s.as_of) latest
                FROM external_market_price_snapshots s
                JOIN external_catalog_products e ON e.id=s.external_product_id
                JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket'
                GROUP BY g.slug,e.product_group,s.price_variant
                ORDER BY g.slug,e.product_group,s.price_variant
              ''')
              out['external_snapshot_variants']=[dict(r) for r in c.fetchall()]
              c.execute('''
                SELECT e.external_id,e.name,g.slug,s.price_variant,s.currency,s.price_low,s.price_mid,s.price_market,s.price_last,s.avg1,s.avg7,s.avg30,s.as_of
                FROM external_catalog_products e
                JOIN games g ON g.id=e.game_id
                LEFT JOIN external_market_price_snapshots s ON s.external_product_id=e.id
                WHERE e.source='cardmarket' AND e.external_id IN ('11655','11656')
                ORDER BY e.external_id,s.as_of DESC,s.id DESC LIMIT 30
              ''')
              out['mtg_samples']=[dict(r) for r in c.fetchall()]
              c.execute('''
                SELECT g.slug,count(*) total,
                       count(*) FILTER (WHERE ps.id IS NOT NULL) projected,
                       max(ps.as_of) latest
                FROM prints p
                JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id
                LEFT JOIN LATERAL (
                  SELECT x.id,x.as_of FROM price_snapshots x JOIN price_sources src ON src.id=x.source_id
                  WHERE x.entity_type='print' AND x.entity_id=p.id AND x.currency='EUR' AND src.name='cardmarket'
                  ORDER BY x.as_of DESC,x.id DESC LIMIT 1
                ) ps ON TRUE
                GROUP BY g.slug ORDER BY g.slug
              ''')
              out['projected_by_game']=[dict(r) for r in c.fetchall()]
              c.execute('''
                SELECT p.id print_id,c.name,g.slug,s.code,p.collector_number,p.is_foil,p.variant,
                       ps.price_low,ps.price_mid,ps.price_market,ps.price_last,ps.as_of
                FROM prints p JOIN cards c ON c.id=p.card_id JOIN games g ON g.id=c.game_id JOIN sets s ON s.id=p.set_id
                JOIN price_snapshots ps ON ps.entity_type='print' AND ps.entity_id=p.id AND ps.currency='EUR'
                JOIN price_sources src ON src.id=ps.source_id AND src.name='cardmarket'
                WHERE g.slug='mtg' AND c.name IN ('Ancestral Recall','Black Lotus') AND s.code='2ED'
                ORDER BY p.id,ps.as_of DESC,ps.id DESC LIMIT 20
              ''')
              out['mtg_projected_samples']=[dict(r) for r in c.fetchall()]
          conn.close()
          Path('/tmp/cardmarket-price-semantics.json').write_text(json.dumps(out,indent=2,ensure_ascii=False,default=str)+'\n')
          print(json.dumps(out,indent=2,ensure_ascii=False,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cardmarket-price-semantics-${{ github.run_id }}
          path: /tmp/cardmarket-price-semantics.json
          retention-days: 30
