name: Cancel Slow One Piece Bootstrap

permissions:
  actions: write
  contents: read

on:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/cancel-slow-onepiece-bootstrap.yml'

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel slow bootstrap run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Alerugg/dontripit/actions/runs/31203009198/cancel
          echo "Cancellation requested for run 31203009198"
