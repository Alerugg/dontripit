name: Apply MTG Multilingual Production V1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY_CERTIFIED_SCRYFALL_31891077971'
        required: true
        type: string
  push:
    branches:
      - multilingual-mtg-v1
    paths:
      - 'backend/app/scripts/mtg_multilingual_production_apply_permit_v1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: mtg-multilingual-production-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      APPLY_DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      POSTFLIGHT_DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
      EXPECTED_CATALOG_V2_SHA: 32b577d8473e8ce6080745a6cec0bb999d46c890
      EXPECTED_GENERAL_CERT_RUN: '31891077971'
      EXPECTED_WRITER_CERT_RUN: '31891701191'
      EXPECTED_PREFLIGHT_RUN: '31891632882'
      EXPECTED_CONFIRM: APPLY_CERTIFIED_SCRYFALL_31891077971

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact rollout commit
        uses: actions/checkout@v4

      - name: Verify one-time permit and certified GitHub evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CONFIRM: ${{ inputs.confirm }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          expected_confirm = os.environ['EXPECTED_CONFIRM']
          permit_path = Path('app/scripts/mtg_multilingual_production_apply_permit_v1.json')
          if not permit_path.exists():
              raise SystemExit('one-time production permit file is missing')
          permit = json.loads(permit_path.read_text(encoding='utf-8'))
          expected = {
              'schema': 'dontripit-mtg-multilingual-production-apply-permit-v1',
              'confirm': expected_confirm,
              'general_certification_run_id': int(os.environ['EXPECTED_GENERAL_CERT_RUN']),
              'atomic_writer_certification_run_id': int(os.environ['EXPECTED_WRITER_CERT_RUN']),
              'production_preflight_run_id': int(os.environ['EXPECTED_PREFLIGHT_RUN']),
              'expected_catalog_v2_sha': os.environ['EXPECTED_CATALOG_V2_SHA'],
              'snapshot_sha256': '744e09b735e63b697008cd5e4b52062857661a212be2cdf188f72fda9a67f8f7',
              'scryfall_bulk_updated_at': '2026-08-15T09:17:42.782+00:00',
              'one_time': True,
          }
          for key, value in expected.items():
              if permit.get(key) != value:
                  raise SystemExit(f'permit mismatch {key}: {permit.get(key)!r} != {value!r}')
          if permit.get('expected_final') != {'es': 89405, 'ja': 104735, 'total_mtg_prints': 353202}:
              raise SystemExit('permit final-count contract mismatch')

          if os.environ.get('EVENT_NAME') == 'workflow_dispatch' and os.environ.get('DISPATCH_CONFIRM') != expected_confirm:
              raise SystemExit('manual workflow confirmation phrase mismatch')

          repo = os.environ['GITHUB_REPOSITORY_NAME']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'dontripit-mtg-production-rollout-v1',
          }
          def api(path):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          for run_id in (
              int(os.environ['EXPECTED_GENERAL_CERT_RUN']),
              int(os.environ['EXPECTED_WRITER_CERT_RUN']),
              int(os.environ['EXPECTED_PREFLIGHT_RUN']),
          ):
              run = api(f'/actions/runs/{run_id}')
              if run.get('status') != 'completed' or run.get('conclusion') != 'success':
                  raise SystemExit(f'certification run {run_id} is not completed/success')
              if run.get('head_branch') != 'multilingual-mtg-v1':
                  raise SystemExit(f'certification run {run_id} came from unexpected branch')

          catalog_ref = api('/git/ref/heads/catalog-v2')
          actual_catalog_sha = catalog_ref['object']['sha']
          if actual_catalog_sha != os.environ['EXPECTED_CATALOG_V2_SHA']:
              raise SystemExit(
                  f'catalog-v2 moved: {actual_catalog_sha} != {os.environ["EXPECTED_CATALOG_V2_SHA"]}'
              )
          print('one-time permit + upstream certification evidence: PASS')
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile exact certified rollout path
        run: |
          python -m py_compile \
            app/scripts/preflight_mtg_multilingual_production_v1.py \
            app/scripts/prepare_mtg_multilingual_certified_snapshot_v1.py \
            app/scripts/apply_mtg_multilingual_production_v1.py \
            app/scripts/postflight_mtg_multilingual_production_v1.py \
            app/scripts/validate_mtg_multilingual_source_fidelity_v1.py

      - name: Replay exact certified Scryfall snapshot
        run: |
          python -m app.scripts.prepare_mtg_multilingual_certified_snapshot_v1 \
            --snapshot /tmp/mtg-certified-scryfall.jsonl \
            --meta /tmp/mtg-certified-scryfall-meta.json

      - name: Re-run strict production preflight read-only immediately before write
        run: |
          python -m app.scripts.preflight_mtg_multilingual_production_v1 \
            --output /tmp/mtg-multilingual-production-preflight-live.json

      - name: Enforce live preflight before opening writer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/mtg-multilingual-production-preflight-live.json').read_text())
          assert report['status'] == 'pass', report
          assert report['mode'] == 'strict-read-only-production-preflight', report
          assert report['database_writes'] == 0, report
          assert report['transaction_read_only'] is True, report
          assert report['alembic_revision'] == '20260814_34', report
          assert report['baseline']['sets'] == 986, report
          assert report['baseline']['cards'] == 37624, report
          assert report['baseline']['prints'] == 161144, report
          assert report['baseline']['languages']['en'] == 158246, report
          assert report['baseline']['languages']['es'] == 1207, report
          assert report['baseline']['languages']['ja'] == 875, report
          assert report['baseline']['target_localizations'] == 0, report
          assert report['baseline']['missing_target_scryfall_ids'] == 0, report
          assert report['baseline']['duplicate_target_scryfall_finish_identities'] == 0, report
          assert report['baseline']['auxiliary_scryfall_print_identifiers'] == 0, report
          print('immediate production preflight: PASS')
          PY

      - name: Apply certified MTG ES/JA atomically to production
        run: |
          python -m app.scripts.apply_mtg_multilingual_production_v1 \
            --snapshot /tmp/mtg-certified-scryfall.jsonl \
            --mode production \
            --confirm "$EXPECTED_CONFIRM" \
            --output /tmp/mtg-multilingual-production-apply.json

      - name: Independent read-only postflight after production commit
        run: |
          python -m app.scripts.postflight_mtg_multilingual_production_v1 \
            --snapshot /tmp/mtg-certified-scryfall.jsonl \
            --apply-report /tmp/mtg-multilingual-production-apply.json \
            --output /tmp/mtg-multilingual-production-postflight.json

      - name: Enforce final production certification gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('/tmp/mtg-certified-scryfall-meta.json').read_text())
          apply = json.loads(Path('/tmp/mtg-multilingual-production-apply.json').read_text())
          post = json.loads(Path('/tmp/mtg-multilingual-production-postflight.json').read_text())

          assert source['status'] == 'pass', source
          assert source['certification_run_id'] == 31891077971, source
          assert source['snapshot_sha256'] == '744e09b735e63b697008cd5e4b52062857661a212be2cdf188f72fda9a67f8f7', source

          assert apply['status'] == 'pass', apply
          assert apply['mode'] == 'production', apply
          assert apply['atomic_transaction'] is True, apply
          assert apply['committed'] is True, apply
          assert apply['writes']['prints_created_es'] == 88198, apply
          assert apply['writes']['prints_created_ja'] == 103860, apply
          assert apply['writes']['print_attributes_created'] == 192058, apply
          assert apply['writes']['print_images_created'] == 194121, apply
          assert apply['writes']['print_localizations_created'] == 194140, apply
          assert apply['writes'].get('print_identifiers_created', 0) == 0, apply
          assert apply['precommit']['status'] == 'pass', apply
          assert apply['precommit']['protected_digests_unchanged'] is True, apply
          assert apply['precommit']['source_fidelity']['counts']['exact_es'] == 89405, apply
          assert apply['precommit']['source_fidelity']['counts']['exact_ja'] == 104735, apply

          assert post['status'] == 'pass', post
          assert post['mode'] == 'independent-read-only-postflight', post
          assert post['transaction_read_only'] is True, post
          assert post['database_writes'] == 0, post
          assert post['final']['languages'] == {'es': 89405, 'ja': 104735}, post
          assert post['final']['total_mtg_prints'] == 353202, post
          assert post['final']['target_localizations'] == 194140, post
          assert post['final']['natural_duplicates'] == 0, post
          assert post['final']['duplicate_scryfall_finish_identities'] == 0, post
          assert post['final']['missing_scryfall_ids'] == 0, post
          assert post['final']['auxiliary_scryfall_print_identifiers'] == 0, post
          assert post['final']['protected_digests_unchanged'] is True, post
          assert post['final']['source_fidelity']['counts']['exact_es'] == 89405, post
          assert post['final']['source_fidelity']['counts']['exact_ja'] == 104735, post
          print('MTG multilingual production rollout certification: PASS')
          PY

      - name: Re-check catalog-v2 branch remained frozen
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY_NAME']}/git/ref/heads/catalog-v2",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'dontripit-mtg-production-rollout-v1',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              ref = json.load(response)
          actual = ref['object']['sha']
          expected = os.environ['EXPECTED_CATALOG_V2_SHA']
          if actual != expected:
              raise SystemExit(f'catalog-v2 moved during rollout: {actual} != {expected}')
          print(f'catalog-v2 frozen: {actual}')
          PY

      - name: Upload production rollout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-multilingual-production-rollout-${{ github.run_id }}
          path: |
            /tmp/mtg-certified-scryfall-meta.json
            /tmp/mtg-multilingual-production-preflight-live.json
            /tmp/mtg-multilingual-production-apply.json
            /tmp/mtg-multilingual-production-postflight.json
          retention-days: 90
          if-no-files-found: warn
