name: Apply MTG Multilingual Production V1 (retired)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Retired one-time rollout; no further production apply is permitted'
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse reuse of consumed one-time rollout
        run: |
          echo 'This one-time MTG multilingual production rollout was consumed successfully by run 31892139919.'
          echo 'Create and certify a new rollout path for any future MTG multilingual production change.'
          exit 1
