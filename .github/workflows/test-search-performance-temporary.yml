name: Test Search Performance Temporary

on:
  push:
    branches:
      - perf/search-hot-path-v1
    paths:
      - 'backend/**'
      - '.github/workflows/test-search-performance-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile changed backend modules
        working-directory: backend
        run: |
          python -m py_compile \
            app/auth/middleware.py \
            app/main.py \
            app/routes/set_ui.py \
            app/search_v2/legacy_search_hot_path.py
      - name: Run performance and search contracts
        working-directory: backend
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
        run: |
          pytest -q \
            tests/test_api_performance_middleware.py \
            tests/test_search_v2_api.py \
            tests/test_search_api.py \
            tests/test_set_ui.py
