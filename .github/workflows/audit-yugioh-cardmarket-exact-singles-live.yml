name: Audit Yu-Gi-Oh Cardmarket Exact Singles Live

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-yugioh-cardmarket-exact-singles-live.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Audit exact singles using independently sealed-confirmed expansion identity
        run: |
          python - <<'PY'
          import json, os, re, unicodedata
          from collections import defaultdict, Counter
          from pathlib import Path
          from sqlalchemy import create_engine,text

          def norm(value):
              value=unicodedata.normalize('NFKD',str(value or ''))
              value=''.join(ch for ch in value if not unicodedata.combining(ch)).casefold().replace('&',' and ')
              value=re.sub(r'[^a-z0-9]+',' ',value)
              return re.sub(r'\s+',' ',value).strip()

          def set_aliases(code,name):
              out={norm(name)}
              clean=re.sub(r'^\s*[A-Za-z]{1,5}[ -]?\d{1,3}\s*[:\-–—]\s*','',str(name or '')).strip()
              out.add(norm(clean)); out.add(norm(f'{code} {clean}'))
              return {x for x in out if x}

          def sealed_bases(name,category):
              raw=str(name or '').strip(); bases={norm(raw)}
              if category in ('Yugioh Booster','Yugioh Display'):
                  for suffix in (' booster display',' display',' booster box',' booster'):
                      if raw.casefold().endswith(suffix): bases.add(norm(raw[:-len(suffix)]))
              return {x for x in bases if x}

          engine=create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              latest=conn.execute(text("SELECT max(last_seen_at) FROM external_catalog_products WHERE source='cardmarket'" )).scalar_one()
              sets=[dict(x) for x in conn.execute(text('''
                SELECT s.id,s.code,s.name FROM sets s JOIN games g ON g.id=s.game_id
                WHERE g.slug='yugioh'
              ''')).mappings()]
              alias_index=defaultdict(list)
              for s in sets:
                  for a in set_aliases(s['code'],s['name']): alias_index[a].append(s)
              sealed=[dict(x) for x in conn.execute(text('''
                SELECT e.external_id,e.expansion_external_id,e.name,e.category
                FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.last_seen_at=:latest AND g.slug='yugioh'
                  AND e.product_group='non_single'
              '''),{'latest':latest}).mappings()]
              by_exp=defaultdict(list)
              for p in sealed: by_exp[str(p['expansion_external_id'] or '')].append(p)

              crosswalk={}; expansion_conflicts=[]
              for expansion_id,items in by_exp.items():
                  votes=defaultdict(list)
                  for item in items:
                      for base in sealed_bases(item['name'],item['category']):
                          matches=alias_index.get(base,[])
                          if len(matches)==1:
                              votes[int(matches[0]['id'])].append({'idProduct':item['external_id'],'name':item['name'],'category':item['category'],'alias':base})
                  if len(votes)==1:
                      sid=next(iter(votes)); crosswalk[expansion_id]={'set_id':sid,'evidence':votes[sid]}
                  elif len(votes)>1:
                      expansion_conflicts.append({'expansion_id':expansion_id,'candidate_set_ids':sorted(votes)})

              # Candidate canonical Prints indexed by certified Set + exact normalized card name.
              print_rows=conn.execute(text('''
                SELECT p.id print_id,p.set_id,p.collector_number,p.variant,p.rarity,p.language,
                       c.id card_id,c.name card_name,s.code set_code
                FROM prints p JOIN cards c ON c.id=p.card_id JOIN sets s ON s.id=p.set_id
                JOIN games g ON g.id=c.game_id WHERE g.slug='yugioh'
              ''')).mappings().all()
              canon=defaultdict(list)
              for r in print_rows: canon[(int(r['set_id']),norm(r['card_name']))].append(dict(r))

              singles=[dict(x) for x in conn.execute(text('''
                SELECT e.id external_product_id,e.external_id,e.expansion_external_id,e.name,e.metacard_external_id
                FROM external_catalog_products e JOIN games g ON g.id=e.game_id
                WHERE e.source='cardmarket' AND e.last_seen_at=:latest AND g.slug='yugioh'
                  AND e.product_group='single'
              '''),{'latest':latest}).mappings()]

          statuses=Counter(); decisions=[]
          product_ids=Counter(str(x['external_id']) for x in singles)
          by_expansion_product_name=Counter((str(x['expansion_external_id'] or ''),norm(x['name'])) for x in singles)
          candidate_print_claims=defaultdict(list)
          for p in singles:
              exp=str(p['expansion_external_id'] or '')
              cw=crosswalk.get(exp)
              if cw is None:
                  status='unconfirmed_expansion'; candidates=[]
              else:
                  candidates=canon.get((cw['set_id'],norm(p['name'])),[])
                  if len(candidates)==0: status='name_no_match'
                  elif len(candidates)>1: status='canonical_print_ambiguity'
                  elif by_expansion_product_name[(exp,norm(p['name']))]>1: status='cardmarket_same_name_ambiguity'
                  else: status='exact_candidate'
              statuses[status]+=1
              d={
                'idProduct':str(p['external_id']),'external_product_id':int(p['external_product_id']),
                'idExpansion':exp,'name':p['name'],'metacard_id':p['metacard_external_id'],
                'status':status,'set_id':cw['set_id'] if cw else None,
                'candidate_print_ids':[int(x['print_id']) for x in candidates[:20]],
                'candidate_details':[
                  {'print_id':int(x['print_id']),'set_code':x['set_code'],'collector_number':x['collector_number'],'variant':x['variant'],'rarity':x['rarity'],'language':x['language'],'card_id':int(x['card_id'])}
                  for x in candidates[:10]
                ],
                'expansion_evidence':cw['evidence'][:5] if cw else [],
              }
              decisions.append(d)
              if status=='exact_candidate': candidate_print_claims[int(candidates[0]['print_id'])].append(str(p['external_id']))

          multi_claim={pid:ids for pid,ids in candidate_print_claims.items() if len(ids)>1}
          safe=[]
          for d in decisions:
              if d['status']!='exact_candidate': continue
              pid=d['candidate_print_ids'][0]
              if pid in multi_claim:
                  d['status']='multiple_cardmarket_products_claim_print'; statuses['exact_candidate']-=1; statuses['multiple_cardmarket_products_claim_print']+=1
              else:
                  safe.append(d)

          report={
            'mode':'read_only','game':'yugioh','source':'cardmarket',
            'current_singles':len(singles),
            'sealed_confirmed_expansions':len(crosswalk),
            'sealed_expansion_conflicts':len(expansion_conflicts),
            'status_counts':dict(sorted(statuses.items())),
            'safe_exact_products':len(safe),
            'safe_exact_prints':len({d['candidate_print_ids'][0] for d in safe}),
            'multiple_product_print_claims':len(multi_claim),
            'safe_samples':safe[:100],
            'ambiguous_samples':[d for d in decisions if d['status']!='exact_candidate'][:200],
            'expansion_crosswalk':{
              exp:{'set_id':v['set_id'],'evidence_count':len(v['evidence']),'evidence':v['evidence'][:10]}
              for exp,v in sorted(crosswalk.items())
            },
            'write_ready':len(expansion_conflicts)==0 and len(multi_claim)==0,
          }
          Path('/tmp/yugioh-cardmarket-exact-singles-audit.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k not in ('safe_samples','ambiguous_samples','expansion_crosswalk')},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yugioh-cardmarket-exact-singles-audit-${{ github.run_id }}
          path: /tmp/yugioh-cardmarket-exact-singles-audit.json
          retention-days: 30
          if-no-files-found: error
