name: Smoke Password Recovery Temporary

on:
  push:
    branches: [ops/password-recovery-smoke-v1]
    paths:
      - '.github/workflows/smoke-password-recovery-temporary.yml'

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production recovery delivery is configured
        id: smoke
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          code="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST 'https://api.dontripit.com/api/v2/auth/forgot-password' \
            -H 'Content-Type: application/json' \
            --data '{"email":"invalid-email-format"}')"
          cat "$response_file"
          test "$code" = "200"
          python - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              payload=json.load(f)
          assert payload.get('ok') is True, payload
          assert 'Si existe una cuenta' in str(payload.get('message') or ''), payload
          print('PASS production password recovery config is available; invalid email caused no delivery')
          PY
      - name: Publish recovery smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          python - <<'PY' >/tmp/status.json
          import json, os
          ok = os.environ.get('SMOKE_OUTCOME') == 'success'
          print(json.dumps({
            'state':'success' if ok else 'failure',
            'context':'password-recovery-production-smoke',
            'description':f"production invalid-email recovery smoke={os.environ.get('SMOKE_OUTCOME')}"[:140],
          }))
          PY
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/status.json
