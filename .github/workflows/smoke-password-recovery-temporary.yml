name: Smoke Password Recovery Temporary

on:
  push:
    branches: [ops/password-recovery-smoke-v1]
    paths:
      - '.github/workflows/smoke-password-recovery-temporary.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production recovery delivery is configured
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          code="$(curl --fail-with-body -sS -o "$response_file" -w '%{http_code}' \
            -X POST 'https://api.dontripit.com/api/v2/auth/forgot-password' \
            -H 'Content-Type: application/json' \
            --data '{"email":"invalid-email-format"}')"
          cat "$response_file"
          test "$code" = "200"
          python - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              payload=json.load(f)
          assert payload.get('ok') is True, payload
          assert 'Si existe una cuenta' in str(payload.get('message') or ''), payload
          print('PASS production password recovery config is available; invalid email caused no delivery')
          PY
