name: Sync Regional TCG Content

on:
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/regional_content.py'
      - 'backend/scripts/sync_regional_content_daily.py'
      - 'backend/scripts/sync_regional_content_daily_v2.py'
      - 'backend/scripts/dedupe_regional_content.py'
      - '.github/workflows/sync-regional-tcg-content.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: sync-regional-tcg-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Compile regional pipeline
        run: |
          python -m py_compile \
            app/jobs/regional_content.py \
            scripts/sync_regional_content_daily.py \
            scripts/sync_regional_content_daily_v2.py \
            scripts/dedupe_regional_content.py \
            alembic/versions/20260810_32_add_regional_tcg_content.py

      - name: Gate official sources without database writes
        run: |
          python scripts/sync_regional_content_daily_v2.py \
            --dry-run \
            --report /tmp/regional-dry-run.json

      - name: Apply content schema
        run: alembic upgrade head

      - name: Persist canonical feeds and certify second-pass idempotency
        run: |
          python scripts/sync_regional_content_daily_v2.py \
            --apply \
            --certify-two-pass \
            --report /tmp/regional-two-pass-proof.json

      - name: Retire superseded Pokemon EU source rows on catalog push only
        if: github.event_name == 'push' && github.ref_name == 'catalog-v2'
        run: |
          python scripts/sync_regional_content_daily_v2.py \
            --cleanup-deprecated \
            --report /tmp/regional-source-migration.json

      - name: Remove historical duplicate titles only
        run: |
          python scripts/dedupe_regional_content.py \
            --window-hours 24000 \
            --apply \
            --report /tmp/regional-dedupe-proof.json

      - name: Verify durable regional database contract
        run: |
          python scripts/sync_regional_content_daily_v2.py \
            --verify-db \
            --report /tmp/regional-db-proof.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-tcg-content-${{ github.run_id }}
          path: |
            /tmp/regional-dry-run.json
            /tmp/regional-two-pass-proof.json
            /tmp/regional-source-migration.json
            /tmp/regional-dedupe-proof.json
            /tmp/regional-db-proof.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish regional certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/regional-status.json
          import json, os
          from pathlib import Path

          state = 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure'
          description = 'Regional sync failed closed'
          proof = Path('/tmp/regional-two-pass-proof.json')
          verify = Path('/tmp/regional-db-proof.json')
          if state == 'success' and proof.exists() and verify.exists():
              p = json.loads(proof.read_text())
              v = json.loads(verify.read_text())
              second = p.get('second_pass') or {}
              description = (
                  f"PASS: {v.get('canonical_rows', 0)} rows; "
                  f"second-pass writes {second.get('material_writes', '?')}"
              )[:140]
          print(json.dumps({
              'state': state,
              'context': 'regional-content-daily',
              'description': description,
              'target_url': os.environ['RUN_URL'],
          }))
          PY
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/regional-status.json
