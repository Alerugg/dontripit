name: Sync Regional TCG Content

on:
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/jobs/regional_content.py'
      - 'backend/scripts/dedupe_regional_content.py'
      - 'backend/scripts/verify_ingest.py'
      - 'backend/alembic/versions/20260810_32_add_regional_tcg_content.py'
      - '.github/workflows/sync-regional-tcg-content.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-regional-tcg-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile canonical regional pipeline
        run: python -m py_compile app/jobs/regional_content.py scripts/dedupe_regional_content.py scripts/verify_ingest.py alembic/versions/20260810_32_add_regional_tcg_content.py
      - name: Apply content schema
        run: alembic upgrade head
      - name: Fetch and persist canonical official regional feeds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app import db
          from app.jobs.regional_content import CANONICAL_SOURCE_KEYS, ingest_official_regional_content
          db.init_engine()
          with db.SessionLocal() as session:
              report = ingest_official_regional_content(session, strict=True)
              session.commit()
          if report['failed_sources'] or report['sources'] != len(CANONICAL_SOURCE_KEYS):
              raise AssertionError(report)
          Path('/tmp/regional-tcg-content.json').write_text(json.dumps(report, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True, ensure_ascii=False))
          PY
      - name: Deduplicate current canonical regional titles
        run: python scripts/dedupe_regional_content.py --window-hours 2 --apply --report /tmp/regional-dedupe-proof.json
      - name: Verify regional ingest contract
        run: python scripts/verify_ingest.py --window-hours 2 --report /tmp/regional-ingest-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-tcg-content-${{ github.run_id }}
          path: |
            /tmp/regional-tcg-content.json
            /tmp/regional-dedupe-proof.json
            /tmp/regional-ingest-proof.json
          retention-days: 90
          if-no-files-found: warn
