name: Sync Regional TCG Content

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-regional-tcg-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Compile regional pipeline
        run: |
          python -m py_compile \
            app/jobs/regional_content.py \
            scripts/sync_regional_content_daily.py \
            scripts/dedupe_regional_content.py \
            alembic/versions/20260810_32_add_regional_tcg_content.py

      - name: Gate official sources without database writes
        run: |
          python scripts/sync_regional_content_daily.py \
            --dry-run \
            --report /tmp/regional-dry-run.json

      - name: Apply content schema
        run: alembic upgrade head

      - name: Persist canonical feeds and certify second-pass idempotency
        run: |
          python scripts/sync_regional_content_daily.py \
            --apply \
            --certify-two-pass \
            --report /tmp/regional-two-pass-proof.json

      - name: Remove historical duplicate titles only
        run: |
          python scripts/dedupe_regional_content.py \
            --window-hours 24000 \
            --apply \
            --report /tmp/regional-dedupe-proof.json

      - name: Verify durable regional database contract
        run: |
          python scripts/sync_regional_content_daily.py \
            --verify-db \
            --report /tmp/regional-db-proof.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-tcg-content-${{ github.run_id }}
          path: |
            /tmp/regional-dry-run.json
            /tmp/regional-two-pass-proof.json
            /tmp/regional-dedupe-proof.json
            /tmp/regional-db-proof.json
          retention-days: 90
          if-no-files-found: warn
