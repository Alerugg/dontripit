name: Audit Cardmarket Page Physical Signals

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-cardmarket-page-physical-signals.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          urls={
            'pillars':'https://www.cardmarket.com/en/OnePiece/Products/Singles/Pillars-of-Strength/MonkeyDLuffy-ST01-012',
            'winner_v1':'https://www.cardmarket.com/en/OnePiece/Products/Singles/Winner-Cards/MonkeyDLuffy-ST01-012-V1',
            'generic_749435':'https://www.cardmarket.com/en/OnePiece/Products?idProduct=749435',
            'generic_873863':'https://www.cardmarket.com/en/OnePiece/Products?idProduct=873863',
          }
          sess=requests.Session(); sess.headers.update({'User-Agent':'Mozilla/5.0 (compatible; DontrIptCatalogAudit/1.0)'})
          out={}
          for key,url in urls.items():
            try:
              r=sess.get(url,timeout=30,allow_redirects=True)
              text=r.text
              soup=BeautifulSoup(text,'html.parser')
              ids=sorted(set(re.findall(r'idProduct(?:=|%3D|["\'\s:=]+)(\d+)',text,re.I)))
              metas={}
              for prop in ('og:url','og:title','og:image'):
                tag=soup.find('meta',attrs={'property':prop}) or soup.find('meta',attrs={'name':prop})
                if tag and tag.get('content'): metas[prop]=tag.get('content')
              canonical=soup.find('link',rel='canonical')
              printed=[]
              for s in soup.stripped_strings:
                if 'Pillars of Strength' in s or 'Winner Cards' in s: printed.append(s)
              out[key]={'requested':url,'status':r.status_code,'final_url':r.url,'ids':ids[:20],
                        'canonical':canonical.get('href') if canonical else None,'meta':metas,
                        'physical_text_hits':printed[:20],'bytes':len(r.content)}
            except Exception as e:
              out[key]={'requested':url,'error':repr(e)}
          p=Path('/tmp/cardmarket-page-physical-signals.json'); p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(p.read_text())
          PY
      - name: Persist
        run: |
          mkdir -p audit-reports
          cp /tmp/cardmarket-page-physical-signals.json audit-reports/cardmarket-page-physical-signals.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/cardmarket-page-physical-signals.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Cardmarket page physical signals'
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-page-physical-signals-${{ github.run_id }}
          path: /tmp/cardmarket-page-physical-signals.json
          retention-days: 30
