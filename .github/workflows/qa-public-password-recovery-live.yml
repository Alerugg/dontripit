# Redeploy marker: Resend production environment configured 2026-08-10
name: QA Public Password Recovery Live

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/qa-public-password-recovery-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public forgot-password route reaches configured backend
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST 'https://dontripit.com/api/auth/forgot-password' \
            -H 'Content-Type: application/json' \
            --data '{"email":"dontripit-public-probe-does-not-exist@example.invalid"}')"
          body="$(cat "$body_file")"
          echo "HTTP $status"
          echo "$body"
          test "$status" = "200"
          python - "$body_file" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding='utf-8'))
          assert payload.get('ok') is True, payload
          assert 'recibirás un enlace' in str(payload.get('message','')), payload
          print('public_password_recovery_route=pass')
          PY
