name: Audit Password Reset Production V1

on:
  pull_request:
    paths:
      - '.github/workflows/audit-password-reset-production-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe production forgot-password with guaranteed nonexistent address
        env:
          ENDPOINT: https://api.dontripit.com/api/v2/auth/forgot-password
        run: |
          mkdir -p /tmp/password-reset-production-v1
          CODE=$(curl --fail-with-body --silent --show-error \
            --output /tmp/password-reset-production-v1/response.json \
            --write-out '%{http_code}' \
            --request POST "$ENDPOINT" \
            --header 'Content-Type: application/json' \
            --data '{"email":"dontripit-password-reset-config-audit-20260820@example.com"}' || true)
          export CODE
          python - <<'PY'
          import json, os
          from pathlib import Path
          code=str(os.environ.get('CODE') or '')
          raw=Path('/tmp/password-reset-production-v1/response.json').read_text(encoding='utf-8') if Path('/tmp/password-reset-production-v1/response.json').exists() else ''
          try:
              body=json.loads(raw) if raw else {}
          except Exception:
              body={'raw':raw[:1000]}
          configured = code == '200' and body.get('ok') is True
          report={
              'status':'pass',
              'production_writes':0,
              'endpoint':'https://api.dontripit.com/api/v2/auth/forgot-password',
              'http_status':int(code) if code.isdigit() else None,
              'delivery_configured':configured,
              'response':body,
              'interpretation':(
                  'configured' if configured else
                  'delivery_unavailable' if code == '503' and body.get('error') == 'password_reset_delivery_unavailable' else
                  'unexpected_response'
              ),
          }
          Path('/tmp/password-reset-production-v1/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-reset-production-v1-${{ github.run_id }}
          path: /tmp/password-reset-production-v1/*
          retention-days: 90
          if-no-files-found: warn
