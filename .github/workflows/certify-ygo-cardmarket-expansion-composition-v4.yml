name: Certify YGO Cardmarket Expansion Composition V4

on:
  push:
    branches: [p1/cardmarket-identity-resolver-v1]
    paths:
      - 'backend/scripts/audit_yugioh_cardmarket_expansion_composition_v4.py'
      - 'backend/scripts/certify_yugioh_cardmarket_expansion_composition_v4.py'
      - '.github/workflows/certify-ygo-cardmarket-expansion-composition-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1/cardmarket-identity-resolver-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile V4 certification paths
        working-directory: backend
        run: >-
          python -m py_compile
          scripts/audit_yugioh_cardmarket_expansion_composition_v4.py
          scripts/certify_yugioh_cardmarket_expansion_composition_v4.py

      - name: Fresh read-only composition audit
        working-directory: backend
        run: >-
          python scripts/audit_yugioh_cardmarket_expansion_composition_v4.py
          --min-linked 5
          --min-informative 5
          --min-support 5
          --min-evidence-coverage 0.25
          --min-purity 0.95
          --min-margin 3
          --report /tmp/ygo-expansion-composition-v4-calibration.json

      - name: Certify fixed conservative profile
        working-directory: backend
        run: >-
          python scripts/certify_yugioh_cardmarket_expansion_composition_v4.py
          /tmp/ygo-expansion-composition-v4-calibration.json
          --report /tmp/ygo-expansion-composition-v4-cert.json

      - name: Assert fixed-profile certification
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ygo-expansion-composition-v4-cert.json'))['summary']
          assert d['production_writes'] == 0, d
          assert d['raw_gold_wrong'] == 0, d
          assert d['fixed_profile_gold_accepted'] >= 200, d
          assert d['fixed_profile_gold_wrong'] == 0, d
          assert d['fixed_profile_gold_precision'] == 1.0, d
          assert d['certified_new_expansions'] > 0, d
          assert d['contradictory_expansions'] == 0, d
          assert d['certification_passed'] is True, d
          print('YGO_EXPANSION_COMPOSITION_V4_CERT_GATE=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ygo-expansion-composition-v4-cert-${{ github.run_id }}
          path: |
            /tmp/ygo-expansion-composition-v4-calibration.json
            /tmp/ygo-expansion-composition-v4-cert.json
          retention-days: 90
          if-no-files-found: error
