name: QA Cardmarket Master Inventory

on:
  pull_request:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_catalog_audit.py'
      - 'backend/app/jobs/cardmarket_master_inventory.py'
      - 'backend/scripts/audit_cardmarket_master_inventory.py'
      - 'backend/tests/test_cardmarket_catalog_audit.py'
      - 'backend/tests/test_cardmarket_master_inventory.py'
      - '.github/workflows/qa-cardmarket-master-inventory.yml'
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_catalog_audit.py'
      - 'backend/app/jobs/cardmarket_master_inventory.py'
      - 'backend/scripts/audit_cardmarket_master_inventory.py'
      - 'backend/tests/test_cardmarket_catalog_audit.py'
      - 'backend/tests/test_cardmarket_master_inventory.py'
      - '.github/workflows/qa-cardmarket-master-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Compile master inventory tooling
        working-directory: backend
        run: |
          python -m compileall -q \
            app/jobs/cardmarket_catalog_audit.py \
            app/jobs/cardmarket_master_inventory.py \
            scripts/audit_cardmarket_master_inventory.py

      - name: Run focused identity and completeness tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_cardmarket_catalog_audit.py \
            tests/test_cardmarket_master_inventory.py

      - name: Download current official Pokémon Cardmarket catalogs
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json \
            -o /tmp/products_singles_6.json
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            https://downloads.s3.cardmarket.com/productCatalog/productList/products_nonsingles_6.json \
            -o /tmp/products_nonsingles_6.json
          test -s /tmp/products_singles_6.json
          test -s /tmp/products_nonsingles_6.json

      - name: Verify official catalog contract without database access
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.jobs.cardmarket_master_inventory import load_catalog_feed_bytes

          feeds = [
              load_catalog_feed_bytes(
                  Path('/tmp/products_singles_6.json').read_bytes(),
                  game_slug='pokemon',
                  product_group='single',
              ),
              load_catalog_feed_bytes(
                  Path('/tmp/products_nonsingles_6.json').read_bytes(),
                  game_slug='pokemon',
                  product_group='non_single',
              ),
          ]
          for feed in feeds:
              ids = [row.product_id for row in feed.rows]
              assert feed.raw_records > 0, f'{feed.product_group}: empty official catalog'
              assert feed.rejected_records == 0, f'{feed.product_group}: rejected={feed.rejected_records}'
              assert len(ids) == feed.raw_records, f'{feed.product_group}: accepted/raw mismatch'
              assert len(ids) == len(set(ids)), f'{feed.product_group}: duplicate idProduct inside feed'
              assert all(row.name for row in feed.rows), f'{feed.product_group}: missing name'
              print({
                  'game': feed.game_slug,
                  'group': feed.product_group,
                  'created_at': feed.created_at.isoformat() if feed.created_at else None,
                  'rows': feed.raw_records,
                  'rejected': feed.rejected_records,
              })
          PY
