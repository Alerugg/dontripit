name: QA Cardmarket Master Inventory

on:
  pull_request:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_catalog_audit.py'
      - 'backend/app/jobs/cardmarket_master_inventory.py'
      - 'backend/scripts/audit_cardmarket_master_inventory.py'
      - 'backend/tests/test_cardmarket_catalog_audit.py'
      - 'backend/tests/test_cardmarket_master_inventory.py'
      - '.github/workflows/qa-cardmarket-master-inventory.yml'
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/jobs/cardmarket_catalog_audit.py'
      - 'backend/app/jobs/cardmarket_master_inventory.py'
      - 'backend/scripts/audit_cardmarket_master_inventory.py'
      - 'backend/tests/test_cardmarket_catalog_audit.py'
      - 'backend/tests/test_cardmarket_master_inventory.py'
      - '.github/workflows/qa-cardmarket-master-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Compile master inventory tooling
        working-directory: backend
        run: |
          python -m compileall -q \
            app/jobs/cardmarket_catalog_audit.py \
            app/jobs/cardmarket_master_inventory.py \
            scripts/audit_cardmarket_master_inventory.py

      - name: Run focused identity and completeness tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_cardmarket_catalog_audit.py \
            tests/test_cardmarket_master_inventory.py

      - name: Download current official Cardmarket catalogs for all MVP games
        shell: bash
        run: |
          set -euo pipefail
          # Official Cardmarket game IDs: Magic=1, Yu-Gi-Oh!=3, Pokémon=6, One Piece=18.
          for spec in mtg:1 yugioh:3 pokemon:6 onepiece:18; do
            game="${spec%%:*}"
            game_id="${spec##*:}"
            for group in singles nonsingles; do
              target="/tmp/${game}_${group}.json"
              curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
                "https://downloads.s3.cardmarket.com/productCatalog/productList/products_${group}_${game_id}.json" \
                -o "$target"
              test -s "$target"
            done
          done

      - name: Verify official multi-TCG catalog contract without database access
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.jobs.cardmarket_master_inventory import load_catalog_feed_bytes

          specs = [
              ('mtg', 1),
              ('yugioh', 3),
              ('pokemon', 6),
              ('onepiece', 18),
          ]
          totals = {}
          for game, _game_id in specs:
              feeds = {}
              for file_group, product_group in [('singles', 'single'), ('nonsingles', 'non_single')]:
                  feed = load_catalog_feed_bytes(
                      Path(f'/tmp/{game}_{file_group}.json').read_bytes(),
                      game_slug=game,
                      product_group=product_group,
                  )
                  ids = [row.product_id for row in feed.rows]
                  assert feed.raw_records > 0, f'{game}:{product_group}: empty official catalog'
                  assert feed.rejected_records == 0, f'{game}:{product_group}: rejected={feed.rejected_records}'
                  assert len(ids) == feed.raw_records, f'{game}:{product_group}: accepted/raw mismatch'
                  assert len(ids) == len(set(ids)), f'{game}:{product_group}: duplicate idProduct inside feed'
                  assert all(row.name for row in feed.rows), f'{game}:{product_group}: missing name'
                  feeds[product_group] = feed
                  print({
                      'game': game,
                      'group': product_group,
                      'created_at': feed.created_at.isoformat() if feed.created_at else None,
                      'rows': feed.raw_records,
                      'rejected': feed.rejected_records,
                  })

              single_ids = {row.product_id for row in feeds['single'].rows}
              non_single_ids = {row.product_id for row in feeds['non_single'].rows}
              overlap = single_ids & non_single_ids
              assert not overlap, f'{game}: idProduct overlap between single/non-single feeds: {list(sorted(overlap))[:10]}'
              totals[game] = {
                  'singles': feeds['single'].raw_records,
                  'non_singles': feeds['non_single'].raw_records,
                  'total': feeds['single'].raw_records + feeds['non_single'].raw_records,
              }

          print({'official_catalog_totals': totals})
          PY
