name: Migrate Railway API Keys to Neon

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/migrate-railway-api-keys-to-neon.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-api-keys-to-neon
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install psycopg2-binary

      - name: Transactionally migrate API identities and usage only
        run: |
          mkdir -p /tmp/railway-api-migration
          cat > /tmp/railway-api-migration/migrate.py <<'PY'
          import json, os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import Json

          def norm(url):
              for old in ('postgresql+psycopg2://','postgres+psycopg2://','postgres://'):
                  if url.startswith(old):
                      return 'postgresql://' + url[len(old):]
              return url

          def catalog_counts(conn):
              with conn.cursor() as cur:
                  cur.execute('''
                    SELECT g.slug, COUNT(DISTINCT c.id)::bigint, COUNT(DISTINCT p.id)::bigint
                    FROM games g
                    LEFT JOIN cards c ON c.game_id=g.id
                    LEFT JOIN prints p ON p.card_id=c.id
                    GROUP BY g.slug ORDER BY g.slug
                  ''')
                  return {r[0]: {'cards':int(r[1]), 'prints':int(r[2])} for r in cur.fetchall()}

          railway=psycopg2.connect(norm(os.environ['RAILWAY_DATABASE_URL']), connect_timeout=15)
          railway.set_session(readonly=True, autocommit=False)
          neon=psycopg2.connect(norm(os.environ['NEON_DATABASE_URL']), connect_timeout=15)
          neon.autocommit=False

          try:
              with railway.cursor() as cur:
                  cur.execute('''
                    SELECT k.key_hash, k.prefix, p.name, k.is_active, k.label,
                           k.scopes, k.created_at, k.last_used_at
                    FROM api_keys k JOIN api_plans p ON p.id=k.plan_id
                    ORDER BY k.id
                  ''')
                  railway_keys=[{
                    'key_hash':r[0], 'prefix':r[1], 'plan':r[2], 'is_active':bool(r[3]),
                    'label':r[4], 'scopes':r[5], 'created_at':r[6], 'last_used_at':r[7]
                  } for r in cur.fetchall()]
                  cur.execute('''
                    SELECT k.key_hash, u.period_ym, u.request_count, u.last_request_at
                    FROM api_usage u JOIN api_keys k ON k.id=u.api_key_id
                    ORDER BY k.key_hash, u.period_ym
                  ''')
                  railway_usage=[{
                    'key_hash':r[0], 'period':r[1], 'request_count':int(r[2]), 'last_request_at':r[3]
                  } for r in cur.fetchall()]
                  cur.execute('''
                    SELECT name, monthly_quota_requests, burst_rpm FROM api_plans ORDER BY name
                  ''')
                  railway_plans={r[0]:(r[1],r[2]) for r in cur.fetchall()}
              railway.rollback()

              before_catalog=catalog_counts(neon)
              with neon.cursor() as cur:
                  cur.execute('SELECT name, monthly_quota_requests, burst_rpm FROM api_plans ORDER BY name')
                  neon_plans={r[0]:(r[1],r[2]) for r in cur.fetchall()}
                  if railway_plans != neon_plans:
                      raise RuntimeError('API plan definitions differ between Railway and Neon')

                  cur.execute('SELECT key_hash FROM api_keys')
                  before_hashes={r[0] for r in cur.fetchall()}
                  missing_before=[k for k in railway_keys if k['key_hash'] not in before_hashes]

                  for k in missing_before:
                      cur.execute('SELECT id FROM api_plans WHERE name=%s', (k['plan'],))
                      plan_id=cur.fetchone()[0]
                      cur.execute('''
                        INSERT INTO api_keys
                          (key_hash,prefix,plan_id,is_active,label,scopes,created_at,last_used_at)
                        VALUES (%s,%s,%s,%s,%s,%s,%s,%s)
                        ON CONFLICT (key_hash) DO NOTHING
                      ''', (
                        k['key_hash'], k['prefix'], plan_id, k['is_active'], k['label'],
                        Json(k['scopes']) if k['scopes'] is not None else Json(['read:catalog']),
                        k['created_at'], k['last_used_at']
                      ))

                  for u in railway_usage:
                      cur.execute('SELECT id FROM api_keys WHERE key_hash=%s', (u['key_hash'],))
                      row=cur.fetchone()
                      if not row:
                          raise RuntimeError('Railway API key missing after migration')
                      api_key_id=row[0]
                      cur.execute('''
                        INSERT INTO api_usage (api_key_id,period_ym,request_count,last_request_at)
                        VALUES (%s,%s,%s,%s)
                        ON CONFLICT (api_key_id,period_ym)
                        DO UPDATE SET
                          request_count=GREATEST(api_usage.request_count, EXCLUDED.request_count),
                          last_request_at=GREATEST(api_usage.last_request_at, EXCLUDED.last_request_at)
                      ''', (api_key_id,u['period'],u['request_count'],u['last_request_at']))

                  # Validate every Railway key exists with equivalent functional metadata.
                  cur.execute('''
                    SELECT k.key_hash,k.prefix,p.name,k.is_active,COALESCE(k.scopes::text,'null')
                    FROM api_keys k JOIN api_plans p ON p.id=k.plan_id
                  ''')
                  neon_meta={r[0]:(r[1],r[2],bool(r[3]),r[4]) for r in cur.fetchall()}
                  functional_mismatch=[]
                  for k in railway_keys:
                      expected=(k['prefix'],k['plan'],k['is_active'],json.dumps(k['scopes'], separators=(',',':')) if k['scopes'] is not None else 'null')
                      actual=neon_meta.get(k['key_hash'])
                      if actual is None:
                          functional_mismatch.append(k['key_hash'][:8]+':missing')
                          continue
                      # Normalize JSON text before comparing scopes.
                      actual_scopes='null' if actual[3]=='null' else json.dumps(json.loads(actual[3]), separators=(',',':'))
                      if (actual[0],actual[1],actual[2],actual_scopes) != expected:
                          functional_mismatch.append(k['key_hash'][:8]+':metadata')
                  if functional_mismatch:
                      raise RuntimeError(f'API key validation mismatch count={len(functional_mismatch)}')

                  usage_mismatch=[]
                  for u in railway_usage:
                      cur.execute('''
                        SELECT x.request_count
                        FROM api_usage x JOIN api_keys k ON k.id=x.api_key_id
                        WHERE k.key_hash=%s AND x.period_ym=%s
                      ''',(u['key_hash'],u['period']))
                      row=cur.fetchone()
                      if not row or int(row[0]) < u['request_count']:
                          usage_mismatch.append((u['key_hash'][:8],u['period']))
                  if usage_mismatch:
                      raise RuntimeError(f'API usage validation mismatch count={len(usage_mismatch)}')

              after_catalog=catalog_counts(neon)
              if before_catalog != after_catalog:
                  raise RuntimeError('Catalog counts changed during API identity migration')

              neon.commit()

              report={
                'status':'pass',
                'railway_api_keys':len(railway_keys),
                'railway_usage_rows':len(railway_usage),
                'railway_usage_requests':sum(u['request_count'] for u in railway_usage),
                'api_keys_inserted_to_neon':len(missing_before),
                'catalog_rows_changed':0,
                'catalog_counts':after_catalog,
              }
              Path('/tmp/railway-api-migration/report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
              print(json.dumps(report,indent=2,sort_keys=True))
          except Exception:
              neon.rollback()
              raise
          finally:
              railway.close(); neon.close()
          PY
          python /tmp/railway-api-migration/migrate.py

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-api-key-migration-${{ github.sha }}
          path: /tmp/railway-api-migration/report.json
          retention-days: 30
          if-no-files-found: warn
