name: Search V2 CI

on:
  push:
    branches:
      - catalog-v2
    paths:
      - 'backend/app/search_v2/**'
      - 'backend/app/search_v2_models.py'
      - 'backend/app/routes/search_v2.py'
      - 'backend/app/main.py'
      - 'backend/tests/test_search_v2_*.py'
      - 'backend/tests/test_onepiece_search_source.py'
      - '.github/workflows/search-v2-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Search V2 modules
        run: python -m compileall -q app/search_v2 app/routes/search_v2.py app/search_v2_models.py
      - name: Run Search V2 tests
        run: >-
          pytest -q
          tests/test_search_v2_models.py
          tests/test_search_v2_normalization.py
          tests/test_search_v2_indexer.py
          tests/test_onepiece_search_source.py
          tests/test_search_v2_api.py
