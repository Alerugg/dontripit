name: Project Yu-Gi-Oh Cardmarket Prices

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/project-yugioh-cardmarket-prices.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-yugioh-cardmarket-prices
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Preflight and apply Yu-Gi-Oh Cardmarket prices
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app import db
          from app.jobs.cardmarket_link_price_projection import build_link_price_projection_plan,apply_link_price_projection_plan
          db.init_engine()
          with db.SessionLocal() as session:
              plan=build_link_price_projection_plan(session,game_slug='yugioh')
              preflight=plan.summary()
              if not preflight['write_ready'] or preflight['accepted_links'] < 22000 or preflight['priceable_prints'] != preflight['accepted_links']:
                  raise AssertionError(preflight)
              result=apply_link_price_projection_plan(session,plan); session.commit()
          report={'preflight':preflight,'apply':result}
          Path('/tmp/yugioh-cardmarket-price-projection.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          PY
      - name: Prove latest canonical Yu-Gi-Oh Cardmarket prices
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from sqlalchemy import create_engine,text
          engine=create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              row=conn.execute(text('''
                WITH src AS (SELECT id FROM price_sources WHERE name='cardmarket'), game AS (SELECT id FROM games WHERE slug='yugioh'),
                latest AS (SELECT max(ps.as_of) as as_of FROM price_snapshots ps JOIN src ON src.id=ps.source_id
                  JOIN prints p ON p.id=ps.entity_id AND ps.entity_type='print' JOIN cards c ON c.id=p.card_id JOIN game ON game.id=c.game_id)
                SELECT latest.as_of,count(*) snapshots,count(DISTINCT ps.entity_id) prints,
                       count(*) FILTER (WHERE ps.price_low IS NOT NULL OR ps.price_mid IS NOT NULL OR ps.price_market IS NOT NULL OR ps.price_last IS NOT NULL) valued
                FROM latest JOIN price_snapshots ps ON ps.as_of=latest.as_of JOIN src ON src.id=ps.source_id
                JOIN prints p ON p.id=ps.entity_id AND ps.entity_type='print' JOIN cards c ON c.id=p.card_id JOIN game ON game.id=c.game_id
                GROUP BY latest.as_of
              ''')).mappings().one()
          proof={k:(v.isoformat() if hasattr(v,'isoformat') else int(v)) for k,v in dict(row).items()}
          if proof['prints'] < 22000 or proof['valued'] != proof['prints']: raise AssertionError(proof)
          Path('/tmp/yugioh-cardmarket-price-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugioh-cardmarket-price-projection-${{ github.run_id }}
          path: |
            /tmp/yugioh-cardmarket-price-projection.json
            /tmp/yugioh-cardmarket-price-proof.json
          retention-days: 90
          if-no-files-found: warn
