name: QA Cardmarket Finish Feed Live

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/qa-cardmarket-finish-feed-live.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect official price-guide fields
        run: |
          python - <<'PY'
          import json, urllib.request
          from collections import Counter
          specs={'mtg':1,'yugioh':3,'pokemon':6,'onepiece':18}
          out={}
          for game,gid in specs.items():
              url=f'https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_{gid}.json'
              with urllib.request.urlopen(url, timeout=60) as r:
                  payload=json.load(r)
              rows=payload.get('priceGuides') or payload.get('priceguides') or payload.get('data') or []
              key_counts=Counter()
              finish_key_counts=Counter()
              finish_nonempty=Counter()
              for row in rows:
                  for k,v in row.items():
                      key_counts[str(k)] += 1
                      lk=str(k).lower()
                      if 'foil' in lk or 'holo' in lk:
                          finish_key_counts[str(k)] += 1
                          if v not in (None,'',0,0.0,'0','0.0','0.00'):
                              finish_nonempty[str(k)] += 1
              out[game]={
                  'createdAt':payload.get('createdAt') or payload.get('created_at'),
                  'rows':len(rows),
                  'keys':sorted(key_counts),
                  'finish_keys':dict(sorted(finish_key_counts.items())),
                  'finish_nonempty':dict(sorted(finish_nonempty.items())),
                  'sample':rows[0] if rows else None,
              }
          print(json.dumps(out,indent=2,ensure_ascii=False))
          with open('/tmp/cardmarket-finish-feed.json','w',encoding='utf-8') as f:
              json.dump(out,f,indent=2,ensure_ascii=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cardmarket-finish-feed-${{ github.run_id }}
          path: /tmp/cardmarket-finish-feed.json
          retention-days: 30
