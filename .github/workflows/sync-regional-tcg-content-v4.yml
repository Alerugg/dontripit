name: Sync Regional TCG Content V4

on:
  push:
    branches: [catalog-v2]
    paths:
      - 'backend/app/jobs/regional_content_v4.py'
      - '.github/workflows/sync-regional-tcg-content-v4.yml'
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-regional-tcg-content-v4
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: Persist official regional sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app import db
          from app.jobs.regional_content_v4 import ingest_official_regional_content
          db.init_engine()
          with db.SessionLocal() as session:
              report=ingest_official_regional_content(session, strict=True)
              session.commit()
          if report['failed_sources']:
              raise AssertionError(report)
          Path('/tmp/regional-tcg-content-v4.json').write_text(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False))
          PY
      - name: Prove all twelve game-region cells
        run: |
          python - <<'PY'
          import json,os
          from sqlalchemy import create_engine,text
          engine=create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              rows=conn.execute(text('''
                SELECT g.slug,c.region,count(*) items,
                  count(*) FILTER (WHERE c.published_date IS NOT NULL) dated,
                  count(*) FILTER (WHERE c.kind IN ('product','release')) product_or_release,
                  max(c.last_seen_at) last_seen
                FROM regional_tcg_content c JOIN games g ON g.id=c.game_id
                WHERE g.slug IN ('pokemon','onepiece','mtg','yugioh')
                GROUP BY g.slug,c.region ORDER BY g.slug,c.region
              ''')).mappings().all()
          proof=[{**dict(r),'items':int(r['items']),'dated':int(r['dated']),'product_or_release':int(r['product_or_release']),
                  'last_seen':r['last_seen'].isoformat()} for r in rows]
          keys={(r['slug'],r['region']) for r in proof}
          required={(g,r) for g in ('pokemon','onepiece','mtg','yugioh') for r in ('jp','eu','us')}
          missing=sorted(required-keys)
          if missing or any(r['items'] < 1 for r in proof):
              raise AssertionError({'missing':missing,'proof':proof})
          print(json.dumps(proof,indent=2,sort_keys=True,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-tcg-content-v4-${{ github.run_id }}
          path: /tmp/regional-tcg-content-v4.json
          retention-days: 90
          if-no-files-found: warn
