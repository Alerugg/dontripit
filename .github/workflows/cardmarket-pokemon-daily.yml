name: Cardmarket Pokémon Daily Sync

on:
  workflow_dispatch:
  pull_request:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/cardmarket-pokemon-daily.yml'
      - 'backend/scripts/sync_cardmarket_pokemon_daily.py'
      - 'backend/app/jobs/cardmarket_daily_sync.py'
      - 'backend/app/jobs/cardmarket_prices.py'
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/cardmarket-pokemon-daily.yml'
      - 'backend/scripts/sync_cardmarket_pokemon_daily.py'
      - 'backend/app/jobs/cardmarket_daily_sync.py'
      - 'backend/app/jobs/cardmarket_prices.py'

permissions:
  contents: read

concurrency:
  group: cardmarket-pokemon-daily-sync
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Compile guarded sync
        working-directory: backend
        run: python -m compileall -q scripts/sync_cardmarket_pokemon_daily.py app/jobs/cardmarket_daily_sync.py app/jobs/cardmarket_prices.py
      - name: Verify official Cardmarket endpoint and feed shape without database access
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json \
            -o /tmp/prices_pokemon.json
          test -s /tmp/prices_pokemon.json
          python - <<'PY'
          import json
          path='/tmp/prices_pokemon.json'
          data=json.load(open(path, encoding='utf-8'))
          rows=data.get('priceGuides') if isinstance(data, dict) else None
          created=data.get('createdAt') if isinstance(data, dict) else None
          assert created, 'missing createdAt'
          assert isinstance(rows, list) and len(rows) >= 5000, f'unexpected priceGuides length: {0 if rows is None else len(rows)}'
          assert all('idProduct' in row for row in rows[:100]), 'sample rows missing idProduct'
          print({'createdAt': created, 'rows': len(rows)})
          PY

  sync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Download current official Pokémon Cardmarket Price Guide
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json \
            -o /tmp/prices_pokemon.json
          test -s /tmp/prices_pokemon.json

      - name: Run guarded daily sync against Neon
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/sync_cardmarket_pokemon_daily.py \
            /tmp/prices_pokemon.json \
            --report /tmp/cardmarket-pokemon-daily.json \
            --max-feed-age-hours 36

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-pokemon-daily-${{ github.run_id }}
          path: /tmp/cardmarket-pokemon-daily.json
          if-no-files-found: ignore
          retention-days: 30
