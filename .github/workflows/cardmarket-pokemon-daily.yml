name: Cardmarket Pokémon Daily Sync

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cardmarket-pokemon-daily.yml'

permissions:
  contents: read

concurrency:
  group: cardmarket-pokemon-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          ref: catalog-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Download current official Pokémon Cardmarket Price Guide
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json \
            -o /tmp/prices_pokemon.json
          test -s /tmp/prices_pokemon.json

      - name: Run guarded daily sync against Neon
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/sync_cardmarket_pokemon_daily.py \
            /tmp/prices_pokemon.json \
            --report /tmp/cardmarket-pokemon-daily.json \
            --max-feed-age-hours 36

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-pokemon-daily-${{ github.run_id }}
          path: /tmp/cardmarket-pokemon-daily.json
          if-no-files-found: ignore
          retention-days: 30
