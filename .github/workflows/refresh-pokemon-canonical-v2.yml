name: Refresh Pokemon Canonical V2

on:
  workflow_dispatch:
  push:
    branches:
      - catalog-v2
    paths:
      - '.github/workflows/refresh-pokemon-canonical-v2.yml'
      - 'backend/app/scripts/prove_pokemon_tcgdex_parity.py'
      - 'backend/app/scripts/prove_pokemon_tcgdex_parity_v2.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_multilingual.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_multilingual_physical.py'
      - 'backend/app/ingest/connectors/tcgdex_pokemon_incremental_guard.py'
      - 'backend/app/ingest/registry.py'

permissions:
  contents: read

concurrency:
  group: refresh-pokemon-canonical-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact dispatched ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify production database secret
        run: test -n "${DATABASE_URL_UNPOOLED}${DATABASE_URL}"

      - name: Compile certified Pokemon physical writer and parity gate
        run: |
          python -m py_compile \
            app/ingest/run.py \
            app/ingest/registry.py \
            app/ingest/connectors/tcgdex_pokemon.py \
            app/ingest/connectors/tcgdex_pokemon_multilingual.py \
            app/ingest/connectors/tcgdex_pokemon_multilingual_physical.py \
            app/ingest/connectors/tcgdex_pokemon_incremental_guard.py \
            app/scripts/prove_pokemon_tcgdex_parity.py \
            app/scripts/prove_pokemon_tcgdex_parity_v2.py

      - name: Re-run focused Pokemon physical identity guards
        env:
          PYTHONPATH: .
        run: |
          unset DATABASE_URL DATABASE_URL_UNPOOLED
          pytest -q \
            tests/test_tcgdex_multilingual.py \
            tests/test_tcgdex_physical_scope.py \
            tests/test_tcgdex_en_legacy_incremental.py

      - name: Refresh certified EN ES JA physical catalog incrementally
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from app.ingest.run import run_ingest

          summary = []
          for lang in ('en', 'es', 'ja'):
              stats = run_ingest(
                  'tcgdex_pokemon',
                  lang=lang,
                  incremental=True,
                  fixture=False,
              )
              row = {
                  'language': lang,
                  'files_seen': int(stats.files_seen),
                  'files_skipped': int(stats.files_skipped),
                  'inserted': int(stats.records_inserted),
                  'updated': int(stats.records_updated),
                  'errors': int(stats.errors),
              }
              print(json.dumps(row, sort_keys=True))
              summary.append(row)
              if row['errors'] != 0:
                  raise SystemExit(f'Pokemon {lang} refresh reported errors: {row!r}')

          if [row['language'] for row in summary] != ['en', 'es', 'ja']:
              raise SystemExit(f'Pokemon language coverage incomplete: {summary!r}')
          print(json.dumps({'status': 'pass', 'languages': summary}, indent=2, sort_keys=True))
          PY

      - name: Prove fresh TCGdex physical source parity in production
        env:
          PYTHONPATH: .
        run: python -m app.scripts.prove_pokemon_tcgdex_parity_v2
