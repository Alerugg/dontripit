name: Probe OP15 Set UI Source

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/probe-op15-set-ui-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare production set rows and Search V2 rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request

          base='https://dontripit.com'
          headers={'User-Agent':'Dontripit-OP15-Probe/1.0','Content-Type':'application/json'}

          def get_json(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'Dontripit-OP15-Probe/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          def post_json(path,payload):
              req=urllib.request.Request(base+path,data=json.dumps(payload).encode(),headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          detail=get_json('/api/catalog/set-detail?game=onepiece&set_code=op-15&limit=1000&offset=0')
          physical=detail.get('cards') or []
          search=post_json('/api/search-v2/advanced',{
              'game':'onepiece','q':'','filters':{'set':'op-15'},'limit':50,'offset':0
          })
          items=search.get('items') or []

          def safe_rows(rows, fields, n=5):
              return [{field: row.get(field) for field in fields} for row in rows[:n]]

          physical_fields=['id','print_id','card_id','name','collector_number','set_code','variant','language','rarity']
          search_fields=['id','print_id','card_id','name','collector_number','set_code','exact_variant','variant_family','language','rarity']
          print(json.dumps({
            'physical_count':len(physical),
            'physical_sample':safe_rows(physical,physical_fields),
            'search_status_total':search.get('total'),
            'search_count':len(items),
            'search_sample':safe_rows(items,search_fields),
            'physical_ids_sample':[str(r.get('id')) for r in physical[:20]],
            'search_print_ids_sample':[str(r.get('print_id') or r.get('id')) for r in items[:20]],
          },indent=2,ensure_ascii=False,sort_keys=True))
          PY
