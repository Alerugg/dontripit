name: Diagnose Search V2 card metadata

on:
  push:
    branches: [main]
    paths: ['.github/search-v2-card-metadata-trigger']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW: https://dontripit-web-preview.alejandro-ruggeri-l.workers.dev
    steps:
      - name: Inspect Pikachu canonical cards and physical prints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 "$PREVIEW/api/catalog/search?q=Pikachu&type=card&include_counts=0&limit=24&offset=0" -o /tmp/pikachu.json
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/pikachu.json','utf8'));
          const items = j.items || [];
          const placeholders = new Set(['unknown','n/a','na','none','null','-','']);
          const isUnknown = (v) => placeholders.has(String(v ?? '').trim().toLowerCase());
          console.log(`items=${items.length} total=${j.total}`);
          console.log(`unknown_rarity=${items.filter(x => isUnknown(x.rarity)).length}`);
          for (const x of items.slice(0, 8)) {
            console.log(JSON.stringify({card_id:x.card_id,id:x.id,name:x.name,set_code:x.set_code,collector_number:x.collector_number,rarity:x.rarity,matched_print_id:x.matched_print_id,variant_count:x.variant_count}));
          }
          fs.writeFileSync('/tmp/card_ids.txt', items.slice(0, 4).map(x => x.card_id).join('\n'));
          NODE
          while IFS= read -r card_id; do
            [ -n "$card_id" ] || continue
            curl -fsS --max-time 45 "$PREVIEW/api/catalog/cards/$card_id/prints?limit=100&offset=0" -o "/tmp/prints-$card_id.json"
            CARD_ID="$card_id" node <<'NODE'
          const fs = require('fs');
          const id = process.env.CARD_ID;
          const j = JSON.parse(fs.readFileSync(`/tmp/prints-${id}.json`,'utf8'));
          const rows = j.items || j.results || (Array.isArray(j) ? j : []);
          const placeholders = new Set(['unknown','n/a','na','none','null','-','']);
          const known = rows.filter(x => !placeholders.has(String(x.rarity ?? '').trim().toLowerCase()));
          console.log(`card=${id} prints=${rows.length} known_rarity=${known.length}`);
          for (const x of rows.slice(0, 12)) console.log('  '+JSON.stringify({id:x.id,print_id:x.print_id,set_code:x.set_code,collector_number:x.collector_number,language:x.language,rarity:x.rarity,variant:x.variant,primary_image_url:Boolean(x.primary_image_url)}));
          NODE
          done </tmp/card_ids.txt
