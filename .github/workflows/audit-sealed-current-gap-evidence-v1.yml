name: Audit Sealed Current Gap Evidence V1

on:
  pull_request:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-sealed-current-gap-evidence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Classify current Cardmarket non-single gaps READ ONLY
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app import db
          from app.jobs.cardmarket_sealed_mapping import build_sealed_mapping_plan
          from app.external_catalog_models import ExternalCatalogProduct
          from sqlalchemy import func, select
          from app.models import Game

          db.init_engine()
          wanted={'903128','903129','903175','903183'}
          with db.SessionLocal() as session:
              game=session.execute(select(Game).where(Game.slug=='mtg')).scalar_one()
              latest=session.execute(select(func.max(ExternalCatalogProduct.last_seen_at)).where(
                  ExternalCatalogProduct.source=='cardmarket',
                  ExternalCatalogProduct.game_id==game.id,
                  ExternalCatalogProduct.product_group=='non_single',
              )).scalar_one()
              current={str(row.external_id):row for row in session.execute(select(ExternalCatalogProduct).where(
                  ExternalCatalogProduct.source=='cardmarket',
                  ExternalCatalogProduct.game_id==game.id,
                  ExternalCatalogProduct.product_group=='non_single',
                  ExternalCatalogProduct.last_seen_at==latest,
                  ExternalCatalogProduct.external_id.in_(sorted(wanted)),
              )).scalars().all()}
              plan=build_sealed_mapping_plan(session)
              by_external={item.external_id:item for item in plan.decisions if item.external_id in wanted}
              result=[]
              for external_id in sorted(wanted):
                  item=by_external.get(external_id)
                  product=current.get(external_id)
                  if product is None:
                      raise AssertionError(f'Expected current MTG idProduct {external_id} missing from latest capture')
                  if item is None:
                      raise AssertionError(f'Mapping planner did not classify current MTG idProduct {external_id}')
                  result.append({
                      'external_id':external_id,
                      'name':product.name,
                      'category':product.category,
                      'date_added':str(product.date_added) if product.date_added else None,
                      'website_path':product.website_path,
                      'planner_status':item.status,
                      'product_variant_id':item.product_variant_id,
                      'mapping_method':item.mapping_method,
                      'evidence':item.evidence or {},
                  })
              session.rollback()

          report={'mode':'production_read_only','production_writes':0,'catalog_capture':latest.isoformat(),'gaps':result}
          Path('/tmp/sealed-current-gap-evidence-v1.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-current-gap-evidence-v1-${{ github.run_id }}
          path: /tmp/sealed-current-gap-evidence-v1.json
          retention-days: 30
          if-no-files-found: error
