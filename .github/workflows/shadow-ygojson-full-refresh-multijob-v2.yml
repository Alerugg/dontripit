          python -m pip install -e '.[dev,test]'
          ygojson --help >/dev/null

      - name: Apply minimal YGOPRODeck compatibility patches
        run: |
          python .github/scripts/patch-ygojson-pinned-v1.py
          git -C ygojson-src diff --check
          git -C ygojson-src diff -- src/ygojson/importers/ygoprodeck.py
      - name: Restore stage 0 state
        uses: actions/cache/restore@v4
        with:
          path: |
            ygojson-src/temp
            ygojson-src/data
          key: ygojson-full-v2-${{ github.run_id }}-stage-0
          fail-on-cache-miss: true

      - name: Import Yugipedia partition 1
        working-directory: ygojson-src
        run: |
          set -euo pipefail
          date -u '+partition 1 start %FT%TZ'
          ygojson --production \
            --no-ygoprodeck --no-yamlyugi \
            --yugipedia-use-partition "temp/part1.json" \
            --no-manual --individuals '' --no-individuals
          date -u '+partition 1 end %FT%TZ'

