name: Audit Cardmarket Global Physical Trust

on:
  push:
    branches: [catalog-v2]
    paths: ['.github/workflows/audit-cardmarket-global-physical-trust.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-v2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg2-binary
      - name: Audit accepted mappings and projected product invariants
        run: |
          python - <<'PY'
          import json,os
          from collections import defaultdict
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor
          ACCEPTED=('accepted','mapped','exact')
          conn=psycopg2.connect(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'])
          out={}
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute("SELECT id,slug,name FROM games WHERE slug IN ('mtg','pokemon','yugioh','onepiece') ORDER BY slug")
              games=[dict(r) for r in cur.fetchall()]
              cur.execute("SELECT id FROM price_sources WHERE name='cardmarket'"); source=cur.fetchone(); sid=int(source['id']) if source else None
              for g in games:
                gid=int(g['id']); slug=g['slug']; d={'game_id':gid,'name':g['name']}
                cur.execute('''SELECT l.mapping_method,l.confidence,l.link_status,l.reviewed,count(*) links,count(DISTINCT l.print_id) prints,
                                      count(DISTINCT l.external_product_id) products
                               FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                               WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)
                               GROUP BY l.mapping_method,l.confidence,l.link_status,l.reviewed ORDER BY links DESC''',(gid,list(ACCEPTED)))
                methods=[dict(r) for r in cur.fetchall()]
                for m in methods:
                  cur.execute('''SELECT l.print_id,l.mapping_method,l.confidence,l.reviewed,l.evidence,e.external_id id_product,
                                        e.expansion_external_id,e.name market_name,p.collector_number,p.variant,p.finish,p.rarity,p.language,
                                        c.name card_name,s.code set_code,s.name set_name
                                 FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                                 JOIN prints p ON p.id=l.print_id JOIN cards c ON c.id=p.card_id JOIN sets s ON s.id=p.set_id
                                 WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)
                                   AND l.mapping_method=%s ORDER BY l.print_id LIMIT 8''',(gid,list(ACCEPTED),m['mapping_method']))
                  m['sample']=[dict(r) for r in cur.fetchall()]
                d['accepted_methods']=methods
                cur.execute('''SELECT count(DISTINCT l.print_id) n FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                               WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)''',(gid,list(ACCEPTED)))
                d['accepted_prints']=int(cur.fetchone()['n'])
                # mapping cardinality must be exactly one per displayed print
                cur.execute('''SELECT l.print_id,count(*) n,array_agg(e.external_id ORDER BY e.external_id) ids
                               FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                               WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)
                               GROUP BY l.print_id HAVING count(*)<>1 ORDER BY n DESC LIMIT 200''',(gid,list(ACCEPTED)))
                amb=[dict(r) for r in cur.fetchall()]; d['ambiguous_accepted_prints_count']=len(amb); d['ambiguous_accepted_prints_sample']=amb[:30]
                # stale or mismatched projected snapshots: raw idProduct must equal the sole accepted product.
                if sid is not None:
                  cur.execute('''WITH accepted AS (
                                   SELECT l.print_id,min(e.external_id) id_product,count(*) n
                                   FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
                                   WHERE e.source='cardmarket' AND e.game_id=%s AND e.product_group='single' AND l.link_status=ANY(%s)
                                   GROUP BY l.print_id
                                 ), latest AS (
                                   SELECT DISTINCT ON (ps.entity_id) ps.entity_id print_id,ps.as_of,ps.raw_json
                                   FROM price_snapshots ps JOIN prints p ON p.id=ps.entity_id JOIN cards c ON c.id=p.card_id
                                   WHERE ps.source_id=%s AND ps.entity_type='print' AND c.game_id=%s ORDER BY ps.entity_id,ps.as_of DESC,ps.id DESC
                                 )
                                 SELECT l.print_id,l.as_of,l.raw_json->>'idProduct' snapshot_id_product,a.id_product accepted_id_product,a.n
                                 FROM latest l LEFT JOIN accepted a ON a.print_id=l.print_id
                                 WHERE a.print_id IS NULL OR a.n<>1 OR coalesce(l.raw_json->>'idProduct','')<>coalesce(a.id_product,'')
                                 ORDER BY l.print_id LIMIT 1000''',(gid,list(ACCEPTED),sid,gid))
                  stale=[dict(r) for r in cur.fetchall()]; d['stale_or_mismatched_latest_snapshot_count']=len(stale); d['stale_or_mismatched_snapshot_sample']=stale[:100]
                out[slug]=d
          finally: conn.close()
          p=Path('/tmp/cardmarket-global-physical-trust.json'); p.write_text(json.dumps(out,indent=2,default=str,sort_keys=True)+'\n')
          print(json.dumps({k:{'accepted_prints':v['accepted_prints'],'methods':[{x:m[x] for x in ('mapping_method','confidence','reviewed','links','prints')} for m in v['accepted_methods']], 'ambiguous':v['ambiguous_accepted_prints_count'],'stale_or_mismatched_latest_snapshot_count':v.get('stale_or_mismatched_latest_snapshot_count')} for k,v in out.items()},indent=2,default=str))
          PY
      - name: Persist
        run: |
          mkdir -p audit-reports
          cp /tmp/cardmarket-global-physical-trust.json audit-reports/cardmarket-global-physical-trust.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/cardmarket-global-physical-trust.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record global Cardmarket physical trust audit'
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-global-physical-trust-${{ github.run_id }}
          path: /tmp/cardmarket-global-physical-trust.json
          retention-days: 90
