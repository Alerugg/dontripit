name: Audit Pagination Point 2 Final Gate

on:
  push:
    branches: [catalog-v2]
    paths:
      - '.github/workflows/audit-pagination-point2-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Backend syntax and static contracts
        run: |
          python -m py_compile \
            backend/app/routes/catalog.py \
            backend/app/routes/set_ui.py \
            backend/app/routes/search_v2.py \
            backend/app/search_v2/market_ordering.py \
            backend/app/search_v2/advanced.py \
            backend/app/search_v2/pokemon_advanced.py \
            backend/app/search_v2/yugioh_advanced.py \
            backend/app/search_v2/mtg_advanced.py
          python - <<'PY'
          from pathlib import Path
          checks={
            'backend/app/routes/catalog.py':['max_offset = min(max_offset, 100_000)','include_meta'],
            'backend/app/routes/set_ui.py':['limit = _bounded_int','offset = _bounded_int','cardmarket_price','unfiltered_total'],
            'backend/app/search_v2/market_ordering.py':['price_desc','price_asc','current_cardmarket_price_join'],
            'frontend/components/games/GameCollectionsDirectoryPage.js':['PAGE_SIZE = 24','fetchSetsPage','Paginación de sets'],
            'frontend/components/games/GameSetPage.js':['PAGE_SIZE = 36','fetchSetDetail','Paginación de versiones del set'],
            'frontend/components/searchV2/OnePieceSearchV2Experience.js':['kind: normalType','hasPrice: onlyWithPrice','Precio: mayor a menor'],
            'frontend/app/api/search-v2/federated/route.js':["kind === 'sealed' ? offset : 0",'sort,','has_price: hasPrice'],
          }
          for file,tokens in checks.items():
            text=Path(file).read_text()
            missing=[token for token in tokens if token not in text]
            if missing: raise AssertionError({file:missing})
          if 'limit: 500' in Path('frontend/components/games/GameCollectionsDirectoryPage.js').read_text():
            raise AssertionError('set directory still bulk-fetches 500')
          if 'limit: 1000' in Path('frontend/components/games/GameSetPage.js').read_text():
            raise AssertionError('set detail still bulk-fetches 1000')
          print('static_contracts=PASS')
          PY
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Production DB global ordering and Point 1 regression
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from sqlalchemy import create_engine, text
          from sqlalchemy.orm import Session
          from app.search_v2.advanced import advanced_onepiece_search
          from app.search_v2.pokemon_advanced import advanced_pokemon_search
          from app.search_v2.yugioh_advanced import advanced_yugioh_search
          from app.search_v2.mtg_advanced import advanced_mtg_search

          engine=create_engine(os.getenv('DATABASE_URL_UNPOOLED') or os.environ['DATABASE_URL'], pool_pre_ping=True)
          report={'pass':False,'hard_failures':[],'search':{},'point1_regression':{}}
          cases={
            'onepiece':(advanced_onepiece_search,'Luffy'),
            'pokemon':(advanced_pokemon_search,'Pikachu'),
            'yugioh':(advanced_yugioh_search,'Dark Magician'),
            'mtg':(advanced_mtg_search,'Sol Ring'),
          }
          for game,(fn,q) in cases.items():
            started=time.time()
            try:
              with Session(engine) as session:
                session.execute(text("SET LOCAL statement_timeout = '12000ms'"))
                a=fn(session,filters={},query=q,sort='price_desc',has_price=True,limit=5,offset=0)
                b=fn(session,filters={},query=q,sort='price_desc',has_price=True,limit=5,offset=5)
                ap=[float(x['cardmarket_price']) for x in a['items']]
                bp=[float(x['cardmarket_price']) for x in b['items']]
                ai=[int(x['print_id']) for x in a['items']]
                bi=[int(x['print_id']) for x in b['items']]
                failures=[]
                if a['total'] <= 0: failures.append('no_results')
                if any(v <= 0 for v in ap+bp): failures.append('nonpositive_price')
                if ap != sorted(ap, reverse=True): failures.append('page1_not_desc')
                if bp != sorted(bp, reverse=True): failures.append('page2_not_desc')
                if ap and bp and ap[-1] < bp[0]: failures.append('cross_page_order_break')
                if set(ai)&set(bi): failures.append('duplicate_prints_between_pages')
                if failures: report['hard_failures'].append(f'{game}:{failures}')
                report['search'][game]={'total_priced':a['total'],'page1_prices':ap,'page2_prices':bp,'page1_ids':ai,'page2_ids':bi,'seconds':round(time.time()-started,3),'failures':failures}
            except Exception as exc:
              report['hard_failures'].append(f'{game}:{type(exc).__name__}:{exc}')
              report['search'][game]={'error':str(exc)[:500],'seconds':round(time.time()-started,3)}

          with engine.connect() as conn:
            rows=conn.execute(text('''SELECT e.external_id id_product,l.link_status,l.mapping_method
              FROM external_catalog_print_links l JOIN external_catalog_products e ON e.id=l.external_product_id
              WHERE l.print_id=44257 AND e.source='cardmarket' ORDER BY l.link_status,e.external_id''')).mappings().all()
            accepted=[dict(r) for r in rows if r['link_status'] in ('accepted','mapped','exact')]
            quarantined=[dict(r) for r in rows if r['link_status']=='quarantined']
            report['point1_regression']={'accepted':accepted,'quarantined':quarantined}
            if len(accepted)!=1 or str(accepted[0]['id_product'])!='720061': report['hard_failures'].append(f'point1:44257 accepted={accepted}')
            if not any(str(r['id_product'])=='749435' for r in quarantined): report['hard_failures'].append('point1:749435_not_quarantined')

          report['pass']=not report['hard_failures']
          Path('/tmp/pagination-point2-final.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          if not report['pass']: raise SystemExit(2)
          PY
      - name: Public pagination smoke
        run: |
          python - <<'PY'
          import json, requests, time
          from pathlib import Path
          report=json.loads(Path('/tmp/pagination-point2-final.json').read_text())
          failures=report['hard_failures']
          http={}
          s=requests.Session()
          def get(name,url,timeout=20):
            started=time.time(); r=s.get(url,timeout=timeout); elapsed=round(time.time()-started,3)
            if r.status_code!=200:
              failures.append(f'{name}:http_{r.status_code}')
              http[name]={'status':r.status_code,'seconds':elapsed,'body':r.text[:300]}
              return None
            data=r.json(); http[name]={'status':200,'seconds':elapsed}; return data

          sets1=get('sets_page1','https://api.dontripit.com/api/v1/sets?game=mtg&limit=5&offset=0&meta=1')
          sets2=get('sets_page2','https://api.dontripit.com/api/v1/sets?game=mtg&limit=5&offset=5&meta=1')
          if sets1 and sets2:
            ids1={x['id'] for x in sets1['items']}; ids2={x['id'] for x in sets2['items']}
            if sets1['total']!=sets2['total'] or ids1&ids2 or len(ids1)!=5 or len(ids2)!=5: failures.append('sets:paging_invariant')
            http['sets']={'total':sets1['total'],'page1_ids':sorted(ids1),'page2_ids':sorted(ids2)}

          deep=get('prints_deep','https://api.dontripit.com/api/v1/prints?game=mtg&limit=5&offset=1200&meta=1')
          if deep:
            if deep.get('offset')!=1200 or len(deep.get('items',[]))!=5 or deep.get('total',0)<1205: failures.append('prints:deep_offset_failed')
            http['prints_deep'].update({'total':deep.get('total'),'offset':deep.get('offset'),'ids':[x['id'] for x in deep.get('items',[])]})

          p1=get('search_page1','https://dontripit.com/api/search-v2/federated?q=Luffy&game=onepiece&kind=singles&page=1&limit=5&sort=price_desc&has_price=1',25)
          p2=get('search_page2','https://dontripit.com/api/search-v2/federated?q=Luffy&game=onepiece&kind=singles&page=2&limit=5&sort=price_desc&has_price=1',25)
          if p1 and p2:
            a=p1['singles']; b=p2['singles']; ap=[x['cardmarket_price'] for x in a['items']]; bp=[x['cardmarket_price'] for x in b['items']]
            ai={x['print_id'] for x in a['items']}; bi={x['print_id'] for x in b['items']}
            if a['page']!=1 or b['page']!=2 or a['total']!=b['total'] or ai&bi or ap!=sorted(ap,reverse=True) or bp!=sorted(bp,reverse=True) or ap[-1]<bp[0]: failures.append('search:public_cross_page_order')
            http['search']={'total':a['total'],'page1_prices':ap,'page2_prices':bp,'page1_ids':sorted(ai),'page2_ids':sorted(bi)}

          sealed1=get('sealed_page1','https://dontripit.com/api/search-v2/federated?q=Luffy&game=onepiece&kind=sealed&page=1&limit=5',25)
          sealed2=get('sealed_page2','https://dontripit.com/api/search-v2/federated?q=Luffy&game=onepiece&kind=sealed&page=2&limit=5',25)
          if sealed1 and sealed2:
            a=sealed1['sealed']; b=sealed2['sealed']; ai={x['id'] for x in a['items']}; bi={x['id'] for x in b['items']}
            if a['page']!=1 or b['page']!=2 or a['total']!=b['total'] or ai&bi: failures.append('sealed:active_tab_pagination')
            http['sealed']={'total':a['total'],'page1_ids':sorted(ai),'page2_ids':sorted(bi)}

          op1=get('op15_price_page1','https://api.dontripit.com/api/v1/set-ui/prints?game=onepiece&set_code=op-15&sort=price_desc&has_price=1&limit=5&offset=0',25)
          op2=get('op15_price_page2','https://api.dontripit.com/api/v1/set-ui/prints?game=onepiece&set_code=op-15&sort=price_desc&has_price=1&limit=5&offset=5',25)
          if op1 and op2:
            ap=[x['cardmarket_price'] for x in op1['items']]; bp=[x['cardmarket_price'] for x in op2['items']]
            ai={x['print_id'] for x in op1['items']}; bi={x['print_id'] for x in op2['items']}
            if op1['total']!=op2['total'] or ai&bi or ap!=sorted(ap,reverse=True) or bp!=sorted(bp,reverse=True) or ap[-1]<bp[0]: failures.append('set_ui:price_cross_page_order')
            http['op15']={'total_priced':op1['total'],'unfiltered_total':op1['unfiltered_total'],'page1_prices':ap,'page2_prices':bp}

          report['public_http']=http
          report['pass']=not failures
          Path('/tmp/pagination-point2-final.json').write_text(json.dumps(report,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps({'pass':report['pass'],'hard_failures':failures,'public_http':http},indent=2,sort_keys=True))
          if not report['pass']: raise SystemExit(2)
          PY
      - name: Persist final gate
        if: always()
        run: |
          mkdir -p audit-reports
          if [ -f /tmp/pagination-point2-final.json ]; then cp /tmp/pagination-point2-final.json audit-reports/pagination-point2-final.json; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-reports/pagination-point2-final.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record pagination point 2 final gate'
          git push origin HEAD:catalog-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagination-point2-final-${{ github.run_id }}
          path: /tmp/pagination-point2-final.json
          retention-days: 90
