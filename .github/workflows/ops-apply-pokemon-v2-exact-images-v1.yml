name: Ops Apply Pokemon V2 Exact Images V1

on:
  pull_request:
    paths:
      - '.github/workflows/ops-apply-pokemon-v2-exact-images-v1.yml'

permissions:
  contents: read

jobs:
  apply:
    if: github.head_ref == 'ops/apply-pokemon-v2-exact-images-v1' && github.base_ref == 'catalog-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: pokemon-v2-exact-images-production-v1
      cancel-in-progress: false
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL: ''
      PYTHONPATH: .
      TCGDEX_CARDS_SHA: 771a8381c57c73182b9776657a15cd1166c66d36
      TCGDEX_CARDS_REPO: ${{ github.workspace }}/tcgdex-cards
      POKEMON_V2_IMAGE_BACKFILL_OUTPUT: artifacts/pokemon-v2-exact-images-ops-v1.json
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Dontripit
        uses: actions/checkout@v4
      - name: Checkout exact historical TCGdex source
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 771a8381c57c73182b9776657a15cd1166c66d36
          path: tcgdex-cards
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Confirm exact source pin
        run: test "$(git -C "$TCGDEX_CARDS_REPO" rev-parse HEAD)" = "$TCGDEX_CARDS_SHA"
      - name: Production apply - guarded writer
        run: python -m app.scripts.backfill_pokemon_v2_exact_images_v1 --apply --require-baseline
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-v2-exact-images-ops-v1-${{ github.run_id }}
          path: backend/artifacts/pokemon-v2-exact-images-ops-v1.json
          retention-days: 30
