name: Backend Market Summary Seek Probe

on:
  push:
    branches:
      - backend/perfection-hardening-20260911
    paths:
      - '.github/triggers/backend-market-summary-seek-probe'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROD_DB_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
  PROD_DB_URL: ${{ secrets.DATABASE_URL }}
  PGOPTIONS: -c default_transaction_read_only=on

jobs:
  seek-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check psycopg2-binary==2.9.9
      - name: Benchmark latest-capture index seeks
        run: |
          python - <<'PY'
          import hashlib, json, os, time
          import psycopg2
          from psycopg2.extras import RealDictCursor

          ids=[571,45462,45475,45487,45498,45509,45523,45544,45564,45578,45589,675,23645,680,705,706,683,45624,45963,46202,46607,46976,46999,47042]
          expected_hash='61fb5c848be00b62960e0a4292e0dc839de40c46d3553b974143308f36bad9a0'
          url=(os.getenv('PROD_DB_URL_UNPOOLED') or os.getenv('PROD_DB_URL') or '').strip(); assert url

          sql='''
          WITH linked AS MATERIALIZED (
            SELECT l.print_id,
                   e.id AS external_product_id,
                   e.external_id AS id_product,
                   e.game_id,
                   e.last_seen_at
            FROM external_catalog_print_links l
            JOIN external_catalog_products e ON e.id=l.external_product_id
            WHERE l.print_id = ANY(%(print_ids)s)
              AND l.link_status IN ('accepted','mapped','exact')
              AND e.source='cardmarket'
              AND e.product_group='single'
          ), requested_games AS MATERIALIZED (
            SELECT DISTINCT game_id FROM linked
          ), latest_catalog_capture AS MATERIALIZED (
            SELECT rg.game_id,
                   (
                     SELECT e2.last_seen_at
                     FROM external_catalog_products e2
                     WHERE e2.source='cardmarket'
                       AND e2.game_id=rg.game_id
                     ORDER BY e2.last_seen_at DESC
                     LIMIT 1
                   ) AS last_seen_at
            FROM requested_games rg
          ), accepted AS MATERIALIZED (
            SELECT l.print_id,
                   MIN(l.id_product) AS id_product,
                   MIN(l.game_id) AS game_id,
                   COUNT(DISTINCT l.external_product_id) AS product_count
            FROM linked l
            JOIN latest_catalog_capture lc
              ON lc.game_id=l.game_id
             AND lc.last_seen_at=l.last_seen_at
            GROUP BY l.print_id
            HAVING COUNT(DISTINCT l.external_product_id)=1
          ), price_games AS MATERIALIZED (
            SELECT DISTINCT game_id FROM accepted
          ), latest_game_capture AS MATERIALIZED (
            SELECT pg.game_id,
                   (
                     SELECT mp.as_of
                     FROM external_market_price_snapshots mp
                     JOIN external_catalog_products ep ON ep.id=mp.external_product_id
                     WHERE ep.source='cardmarket'
                       AND ep.product_group='single'
                       AND ep.game_id=pg.game_id
                     ORDER BY mp.as_of DESC
                     LIMIT 1
                   ) AS as_of
            FROM price_games pg
          ), current_projection AS (
            SELECT ps.*,
                   a.id_product,
                   ROW_NUMBER() OVER(PARTITION BY ps.entity_id ORDER BY ps.id DESC) AS row_rank
            FROM price_snapshots ps
            JOIN price_sources src ON src.id=ps.source_id
            JOIN accepted a ON a.print_id=ps.entity_id
            JOIN latest_game_capture lgc
              ON lgc.game_id=a.game_id
             AND lgc.as_of=ps.as_of
            WHERE ps.entity_type='print'
              AND lower(src.name)='cardmarket'
              AND ps.entity_id = ANY(%(print_ids)s)
              AND COALESCE(ps.raw_json ->> 'idProduct','')=a.id_product
          )
          SELECT entity_id AS print_id,
                 currency,price_low,price_mid,price_high,price_market,price_last,as_of,raw_json
          FROM current_projection
          WHERE row_rank=1
          ORDER BY entity_id ASC
          '''

          def normalize(rows):
            clean=[]
            for row in rows:
              d=dict(row)
              for k,v in list(d.items()):
                if hasattr(v,'isoformat'): d[k]=v.isoformat()
                elif not isinstance(v,(str,int,float,bool,dict,list,type(None))): d[k]=str(v)
              clean.append(d)
            return clean

          conn=psycopg2.connect(url); conn.autocommit=False
          try:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
              cur.execute('SHOW transaction_read_only'); assert cur.fetchone()['transaction_read_only']=='on'
              cur.execute("SET LOCAL statement_timeout='10000ms'")
              times=[]; rows=[]; hashes=[]
              for i in range(8):
                t=time.perf_counter(); cur.execute(sql,{'print_ids':ids}); rows=normalize(cur.fetchall()); elapsed=round((time.perf_counter()-t)*1000,2)
                payload=json.dumps(rows,sort_keys=True,default=str)
                h=hashlib.sha256(payload.encode()).hexdigest()
                times.append(elapsed); hashes.append(h)
              out={'samples_ms':times,'rows':len(rows),'sha256':hashes[-1],'unique_hashes':sorted(set(hashes)),'same_as_current':hashes[-1]==expected_hash,'print_ids':[r['print_id'] for r in rows]}
              print(json.dumps(out,indent=2))
              assert len(set(hashes))==1
              assert hashes[-1]==expected_hash, out
            conn.rollback()
          finally: conn.close()
          PY
